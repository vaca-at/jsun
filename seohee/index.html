async function loginPin(name){
  LP={ name, mode:'wait', buf:'', first:'' }; drawLoginPin();
  // 다른 기기에서 만든 비밀번호가 있는지 먼저 확인해요 (최대 3초)
  await Promise.race([cloudPull(name,true), new Promise(r=>setTimeout(r,3000))]);
  if(!LP || LP.name!==name) return;
  LP.mode = kidPins()[name] ? 'enter' : 'make'; drawLoginPin();
}
function drawLoginPin(){
  const t={wait:'잠깐만요…', enter:`${esc(LP.name)}의 비밀번호를 눌러요`, make:'나만의 비밀번호 4자리를 만들어요', again:'한 번 더 똑같이 눌러요'}[LP.mode];
  document.getElementById('whoList').innerHTML=`<div class="lp">
    <div class="lp-who">${avatarHTML(LP.name, getProfiles().indexOf(LP.name))}<b>${esc(LP.name)}</b></div>
    <p class="sub">${t}</p>
    <div class="pinrow" id="lpinrow">${[0,1,2,3].map(i=>`<span class="${i<LP.buf.length?'f':''}"></span>`).join('')}</div>
    ${keypad('c','lpin').replace(/data-v="ok">확인/,'data-v="ok">◀ 그림 다시 고르기')}
    ${LP.mode==='make'?'<p class="sub" style="font-size:.85rem">다른 사람에게 알려 주지 마세요. 잊어버리면 부모님께 말해요.</p>':''}
  </div>`;
  document.getElementById('loginNew').hidden=true;
}
function lpinKey(v){
  if(!LP) return;
  if(v==='ok'){ LP=null; showLogin(); return; }
  if(v==='del'){ LP.buf=LP.buf.slice(0,-1); drawLoginPin(); return; }
  if(LP.mode==='wait' || !/^\d$/.test(v) || LP.buf.length>=4) return;
  LP.buf+=v; drawLoginPin();
  if(LP.buf.length<4) return;
  const name=LP.name, pins=kidPins();
  if(LP.mode==='enter'){
    if(hashPin(LP.buf,name)===pins[name]){ LP=null; loadProfile(name); return; }
    beep(false); shake('lpinrow'); toast('비밀번호가 틀렸어요');
  } else if(LP.mode==='make'){
    LP.first=LP.buf; LP.mode='again'; LP.buf=''; drawLoginPin(); return;
  } else {
    if(LP.buf===LP.first){ setKidPin(name,LP.buf); cloudPushNow(name); toast('비밀번호를 만들었어요 🔒'); LP=null; loadProfile(name); return; }
    beep(false); toast('두 번이 달라요. 다시 만들어요'); LP.mode='make'; LP.first='';
  }
  setTimeout(()=>{ if(LP){ LP.buf=''; drawLoginPin(); } },400);
}
function showLogin(){
  LP=null; document.getElementById('loginNew').hidden=true;
  document.getElementById('loginTitle').textContent='오늘은 어떤 친구랑 공부할까?';
  document.getElementById('whoList').innerHTML = `<div class="lp"><p class="sub" style="margin:0 0 10px">오늘 함께할 친구를 골라서 들어가요 🐟🐙</p>
    <div class="sea-grid">${SEA_FRIENDS.map(e=>`<button class="sea" data-act="loginSea" data-v="${e}" aria-label="${SEA_NAME[e]||e} 골라서 들어가기">${e}<small>${SEA_NAME[e]||''}</small></button>`).join('')}</div></div>`;
  document.getElementById('settings').hidden=true;
  document.getElementById('login').hidden=false;
}
function loadProfile(name){
  who=name; store.set('lastWho',name);
  App.unit=store.get('unit','add3'); App.mlv=store.get('mlv','e3a'); App.klv=KO_LV[store.get('klv',1)]?+store.get('klv',1):1; App.hlv=store.get('hlv',9); App.hslv=store.get('hslv',9); App.elv=ENG_LV[store.get('elv','1')]?String(store.get('elv','1')):'1'; App.e4cat=engLv().first;
  settings=Object.assign({theme:'note',font:'combo3',size:1,sound:true}, store.get('settings',{}));
  // 기본 글씨가 '또박 조합'으로 바뀌었어요: 예전 기본값(말랑)으로 저장된 경우 한 번만 바꿔 줘요
  if(settings.fontV!==2){ if(settings.font==='combo1') settings.font='combo3'; settings.fontV=2; }
  if(!(FONTS[settings.font]&&FONTS[settings.font].combo)) settings.font='combo3'; // 한 가지 글씨체는 없어졌어요
  stars=store.get('stars',0);
  Q=S=H=HQ=K=R=G=E=SQ=null; App.view='home'; lastDay=dayKey();
  markVisit(); applySettings(); updateStars();
  document.getElementById('whoBtn').textContent=`${josa(name,'이의','의')} 공부방`;
  document.title=`${josa(name,'이의','의')} 공부방`;
  document.getElementById('login').hidden=true;
  render(); window.scrollTo(0,0);
  cloudPullSettings().then(ch=>{ if(ch && who===name && App.view==='home') render(); });
  cloudPull(name).then(ok=>{
    if(!ok || who!==name) return;
    stars=store.get('stars',0); updateStars();
    if(App.view==='home') render();
    cloudPush();
  });
}
function addWho(){

}

/* ───── 과목 골고루: 최근 7일 동안 날마다 과목별로 몇 문제를 풀었는지 ───── */
const BAL_DAYS = 7;
function balDays(){ const t=new Date(); return Array.from({length:BAL_DAYS},(_,i)=>{ const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-(BAL_DAYS-1-i)); return {k:dayKey(d), w:WD[d.getDay()], dd:d.getDate()}; }); }
const balN = (L,k,s) => (L[k]&&L[k][s]&&L[k][s].n)||0;
const balLv = n => n===0 ? 0 : n<10 ? 1 : n<20 ? 2 : n<40 ? 3 : 4;
/* 과목 타일: 오늘 푼 문제 수 + 최근 7일 칸 (진할수록 많이 풀었어요) */
function subjTodayHTML(s){
  const L=getLog(), days=balDays(), n=balN(L,days[BAL_DAYS-1].k,s);
  return `<span class="subj-today">${n?`오늘 <b>${n}</b>문제`:'오늘 아직 안 했어요'}<span class="bal-dots" aria-hidden="true">${days.map((d,i)=>`<i class="l${balLv(balN(L,d.k,s))}${i===BAL_DAYS-1?' today':''}"></i>`).join('')}</span></span>`;
}
function balanceHTML(){
  const L=getLog(), days=balDays(), on=Object.keys(SUBJ).filter(k=>admin.subj[k]), today=days[BAL_DAYS-1].k;
  if(!on.length) return '';
  const full=days.filter(d=>on.every(s=>balN(L,d.k,s)>0)).length;
  const miss=on.filter(s=>!balN(L,today,s));
  const wk=on.map(s=>[s,days.reduce((a,d)=>a+balN(L,d.k,s),0)]);
  const sum=wk.reduce((a,x)=>a+x[1],0), low=wk.slice().sort((a,b)=>a[1]-b[1])[0];
  const tip = miss.length ? `👉 오늘 아직 안 한 과목: <b>${miss.map(s=>SUBJ[s].name).join(', ')}</b>` : '🌈 오늘은 모든 과목을 골고루 했어요!';
  const lowTip = sum && low[1] < sum/on.length/2 ? `<br>💡 최근 7일 동안 <b>${josa(SUBJ[low[0]].name,'을','를')}</b> 가장 적게 했어요 (${low[1]}문제).` : '';
  return `<div class="card balcard"><div class="grass-head"><b>🍱 과목 골고루 (최근 7일)</b><span class="sub">🌈 모든 과목 한 날 ${full}일</span></div>
    <div class="bal-wrap"><table class="bal">
      <tr><th></th>${days.map((d,i)=>`<th class="${i===BAL_DAYS-1?'today':''}">${i===BAL_DAYS-1?'오늘':d.w}<small>${d.dd}일</small></th>`).join('')}<th>합</th></tr>
      ${wk.map(([s,t])=>`<tr><th class="bal-s">${SUBJ[s].ico} ${SUBJ[s].name}</th>${days.map(d=>{ const n=balN(L,d.k,s); return `<td><span class="l${balLv(n)}">${n||''}</span></td>`; }).join('')}<td class="bal-t">${t}</td></tr>`).join('')}
      <tr><th class="bal-s">골고루</th>${days.map(d=>{ const c=on.filter(s=>balN(L,d.k,s)>0).length; return `<td>${c===on.length?'🌈':c?`<small class="sub">${c}/${on.length}</small>`:''}</td>`; }).join('')}<td></td></tr>
    </table></div>
    <div class="sub" style="margin-top:8px;line-height:1.6">${tip}${lowTip}</div></div>`;
}

function renderReview(){
  const w=store.get('wrongs',[]);
  if(!RV || RV.done===undefined){
    if(!w.length){ view.innerHTML=`<div class="card center"><p class="big">🔁 틀린 문제 복습함</p><p>아직 모인 문제가 없어요 👍<br><span class="sub">문제를 틀리거나 넘어가면 여기에 모여요.</span></p><button class="big-btn" data-act="tab" data-v="home">🏠 홈으로</button></div>`; return; }
  }
  if(!RV) startRV();
  drawRV();
}
let RV = null;
function startRV(){
  const w=shuffle(store.get('wrongs',[])).slice(0,10);
  RV={list:w.map(x=>Object.assign({}, x, {choices: x.choices ? shuffle(x.choices) : numChoices(+x.ans)})), i:0, score:0, tried:false, solved:false, picked:[], note:'', done:false};
}
const fracText = s => String(s).replace(/(?:(\d+) )?(\d+)\/(\d+)/g, (m,w,n,d)=>fr(n,d,w));
const mathText = s => fracText(esc(s));
function drawRV(){
  if(App.view!=='review') return;
  if(!RV.list.length){ RV=null; renderReview(); return; }
  if(RV.done){
    view.innerHTML=`<div class="card center"><p class="sub">🔁 틀린 문제 복습함</p><p class="big">${RV.list.length}문제 중 ${RV.score}개를 한 번에 맞혔어요!</p>
      <p>맞힌 문제는 복습함에서 빠졌어요. 남은 문제 ${store.get('wrongs',[]).length}개</p>
      <button class="big-btn" data-act="rvAgain">한 번 더 복습</button><div class="center"><button class="linkbtn" data-act="tab" data-v="home">🏠 홈으로</button></div></div>`;
    return;
  }
  const q=RV.list[RV.i], cls=i=> RV.solved && q.choices[i]===q.ans ? 'ok' : (RV.picked.includes(i)?'no':'');
  const txt = c => q.s==='school' ? mathText(c) : esc(c);
  view.innerHTML=`<div class="card">
    <div class="qtop"><span>🔁 ${SUBJ[q.s]?SUBJ[q.s].name:''}${q.sub?' › '+esc(q.sub):''} · ${RV.i+1} / ${RV.list.length}</span><span>⭐ ${RV.score}</span></div>
    <div class="sq ${q.s==='korean'?'ko-q':q.s==='history'?'hs-q':''}">${q.html}</div>
    <div class="choices ${q.choices.join('').length>24?'words':''}">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="rvPick" data-v="${i}"><span class="ct ${q.s==='hanja'&&/^[一-鿿]$/.test(c)?'hanja':''}">${txt(c)}</span></button>`).join('')}</div>
    ${RV.note?`<div class="hint">${RV.note}</div>`:''}
    ${RV.solved?'':skipBtn('rvSkip')}</div>`;
}
function rvPick(i){
  if(!RV||RV.solved||RV.done) return;
  const q=RV.list[RV.i];
  if(q.choices[i]===q.ans){
    RV.solved=true; beep(true); markO(); logToday(q.s, !RV.tried, q.sub);
    if(!RV.tried){ RV.score++; addStar(1); removeWrong(q.id); }
    RV.note=`<span class="praise">${praise()}</span>${q.explain?`<br><small>${q.s==='school'?fracText(q.explain):q.explain}</small>`:''}`; drawRV(); rvNext(1800);
  } else {
    if(RV.picked.includes(i)) return;
    RV.tried=true; RV.picked.push(i); beep(false); drawRV();
  }
}
function rvNext(ms){
  const me=RV;
  setTimeout(()=>{ if(RV!==me) return; RV.i++; RV.tried=false; RV.solved=false; RV.picked=[]; RV.note=''; if(RV.i>=RV.list.length) RV.done=true; drawRV(); }, ms);
}

/* 숫자 입력판: 'c' 확인 / 'd' 소수점 + 확인 / 'n' 음수(−) · 소수점 + 확인 */
function keypad(mode, act='key'){
  const nums=[7,8,9,4,5,6,1,2,3];
  const last = mode==='d' ? ['.','0','del'] : mode==='n' ? ['-','0','.'] : ['del','0','ok'];
  const lab={del:'⌫ 지우기',ok:'확인','-':'−'};
  return `<div class="keypad">${nums.map(n=>`<button class="key" data-act="${act}" data-v="${n}">${n}</button>`).join('')}${
    last.map(x=>`<button class="key ${x.length>1?'fn '+x:''}" data-act="${act}" data-v="${x}">${lab[x]||x}</button>`).join('')}${
    mode==='d'?`<button class="key fn ok wide" data-act="${act}" data-v="ok">확인</button>`:''}${
    mode==='n'?`<button class="key fn del" data-act="${act}" data-v="del">⌫</button><button class="key fn ok" style="grid-column:span 2" data-act="${act}" data-v="ok">확인</button>`:''}</div>`;
}

/* ───── 수학 (초3 1학기 · 초4 1학기 · 초4 2학기) ─────
   문제 형식: 숫자 입력(type:'num', html 안의 □ 자리에 답 입력) 또는 고르기(type:'choice') */
const numQ = (html, ans, explain='') => ({type:'num', html, ans, explain});
const choQ = (html, ans, others, explain='', cls='') => {
  const list=[...new Set([String(ans), ...shuffle(others.map(String))])].slice(0,4);
  return {type:'choice', html, ans:String(ans), choices:shuffle(list), explain, cls};
};
const BOX = '<span class="box">&nbsp;?&nbsp;</span>';
const r3 = x => Math.round(x*1000)/1000;
const fmtNum = x => String(r3(x));
/* 분수 그리기: fr(분자, 분모, 자연수) */
const fr = (n,d,w) => `<span class="mixed">${w?w:''}<span class="frac" data-say="${w&&w!=='□'?w+'과 ':''}${d}분의 ${n==='□'?'몇':n}"><i>${n}</i><i>${d}</i></span></span>`;
const frS = (n,d,w) => `${w?w+' ':''}${n}/${d}`; // 고르기 보기용 글자 (mathText 가 분수로 그려요)
function numChoices(ans){
  const dec=!Number.isInteger(ans), c=new Set([fmtNum(ans)]);
  const offs = dec ? [0.1,-0.1,0.01,-0.01,1,-1,ans*9,-ans*0.9] : [1,-1,2,-2,10,-10,5,-5,ans,Math.round(ans/2)];
  for(const o of shuffle(offs)){ const v=r3(ans+o); if((v>=0||ans<0) && c.size<4) c.add(fmtNum(v)); }
  let k=3; while(c.size<4) c.add(fmtNum(ans+(k++)));
  return shuffle([...c]);
}
const fbar = (n,d,n2=0) => `<span class="fbar">${Array.from({length:d},(_,i)=>`<i class="${i<n?'on':i<n+n2?'on2':''}"></i>`).join('')}</span>`;

/* 도형 그리기: 수학 좌표(위가 +) 점들을 받아 SVG 로. al 각 글자, sl 변 글자, tk 같은 길이 표시 개수, ra 직각 표시, diag 대각선 */
function polySVG(pts, o={}){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const sc=200/Math.max(maxx-minx, maxy-miny, 1e-6), P=34;
  const q=pts.map(([x,y])=>[P+(x-minx)*sc, P+(maxy-y)*sc]);
  const W=(maxx-minx)*sc+P*2, H=(maxy-miny)*sc+P*2;
  const cx=q.reduce((a,p)=>a+p[0],0)/q.length, cy=q.reduce((a,p)=>a+p[1],0)/q.length;
  const unit=(x,y)=>{ const l=Math.hypot(x,y)||1; return [x/l,y/l]; };
  const n=q.length, f=v=>v.toFixed(1);
  let s=`<polygon class="sp" points="${q.map(p=>p.map(f).join(',')).join(' ')}"/>`;
  if(o.diag) for(let i=0;i<n;i++) for(let j=i+2;j<n;j++){ if(i===0&&j===n-1) continue; s+=`<line class="sd" x1="${f(q[i][0])}" y1="${f(q[i][1])}" x2="${f(q[j][0])}" y2="${f(q[j][1])}"/>`; }
  (o.ra||[]).forEach(i=>{ const v=q[i], a=q[(i+n-1)%n], b=q[(i+1)%n], u1=unit(a[0]-v[0],a[1]-v[1]), u2=unit(b[0]-v[0],b[1]-v[1]), k=11;
    s+=`<path class="sq-mark" d="M${f(v[0]+u1[0]*k)},${f(v[1]+u1[1]*k)} L${f(v[0]+u1[0]*k+u2[0]*k)},${f(v[1]+u1[1]*k+u2[1]*k)} L${f(v[0]+u2[0]*k)},${f(v[1]+u2[1]*k)}"/>`; });
  (o.tk||[]).forEach((c,i)=>{ if(!c) return; const a=q[i], b=q[(i+1)%n], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], d=unit(b[0]-a[0],b[1]-a[1]), nn=[-d[1],d[0]];
    for(let t=0;t<c;t++){ const off=(t-(c-1)/2)*6, x=m[0]+d[0]*off, y=m[1]+d[1]*off; s+=`<line class="tk" x1="${f(x-nn[0]*7)}" y1="${f(y-nn[1]*7)}" x2="${f(x+nn[0]*7)}" y2="${f(y+nn[1]*7)}"/>`; } });
  (o.al||[]).forEach((t,i)=>{ if(!t) return; const v=q[i], u=unit(cx-v[0],cy-v[1]); s+=`<text x="${f(v[0]+u[0]*30)}" y="${f(v[1]+u[1]*30)}">${t}</text>`; });
  (o.sl||[]).forEach((t,i)=>{ if(!t) return; const a=q[i], b=q[(i+1)%n], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], u=unit(m[0]-cx,m[1]-cy); s+=`<text x="${f(m[0]+u[0]*16)}" y="${f(m[1]+u[1]*16)}">${t}</text>`; });
  return `<svg class="shape" viewBox="0 0 ${f(W)} ${f(H)}" role="img" aria-label="도형">${s}</svg>`;
}
/* 삼각형: 밑변 양 끝 각 A, B 로 그려요 */
function triPts(A,B){
  const C=180-A-B, rad=Math.PI/180, L=10, b=L*Math.sin(B*rad)/Math.sin(C*rad);
  return [[0,0],[L,0],[b*Math.cos(A*rad), b*Math.sin(A*rad)]];
}
const regPts = n => Array.from({length:n},(_,i)=>{ const a=(90+180/n*(n%2?0:1)+360*i/n)*Math.PI/180; return [Math.cos(a),Math.sin(a)]; });
const POLY_NAME = {3:'삼각형',4:'사각형',5:'오각형',6:'육각형',7:'칠각형',8:'팔각형',9:'구각형',10:'십각형'};

/* 꺾은선그래프 그리기 */
function lineSVG(xs, ys, unit, title){
  const mn=Math.min(...ys), mx=Math.max(...ys);
  const wave = mn>=10, lo = wave ? Math.max(0,Math.floor((mn-2)/2)*2) : 0, hi = Math.ceil((mx+1)/2)*2;
  const step = hi-lo>12 ? 2 : 1, W=320, H=210, L=42, T=14, B=34, R=12;
  const X=i=>L+18+i*(W-L-R-36)/(xs.length-1), Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let s='';
  for(let v=lo; v<=hi; v+=step){ s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/>`; if((v-lo)%(step*(hi-lo>8?2:1))===0) s+=`<text x="${L-12}" y="${Y(v)}">${v}</text>`; }
  s+=`<line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}"/><line class="ax" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>`;
  if(wave){ const y=H-B-8; s+=`<path class="wave" d="M${L-6},${y+3} q3,-6 6,0 t6,0"/>`; }
  s+=`<polyline class="ln" points="${ys.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}"/>`;
  s+=ys.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5"/>`).join('');
  s+=xs.map((x,i)=>`<text x="${X(i)}" y="${H-B+14}">${x}</text>`).join('');
  s+=`<text x="${L-14}" y="${H-10}" style="font-size:10px">(${unit})</text>`;
  return `<div class="gcap">${title}</div><svg class="lgraph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} 꺾은선그래프">${s}</svg>`;
}

/* ───── 공통 도구: 약수 · 분수 · 부호 ───── */
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; };
const lcm = (a,b) => a/gcd(a,b)*b;
const MN = '−';  // 보기 좋은 빼기 기호
const sgn = n => n<0 ? MN+(-n) : String(n);
const par = n => n<0 ? `(${MN}${-n})` : `(+${n})`;
const SUP = {1:'',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷'};
const rndNZ = (a,b) => { let v; do{ v=rnd(a,b); }while(v===0); return v; };
/* 기약분수 글자 (mathText 가 분수로 그려요). mixed: 1보다 크면 대분수로 */
function fStr(n,d,mixed=true){
  if(d<0){ n=-n; d=-d; }
  const g=gcd(n,d)||1; n/=g; d/=g;
  if(d===1) return sgn(n);
  const a=Math.abs(n), body = mixed && a>d ? `${Math.floor(a/d)} ${a%d}/${d}` : `${a}/${d}`;
  return (n<0?MN:'')+body;
}
/* 일차식 글자: lin(2,-3) → 2x − 3 */
function lin(a,b,v='x'){
  let s = a===0 ? '' : (a===1?'':a===-1?MN:sgn(a))+v;
  if(b!==0) s += s ? (b>0?` + ${b}`:` ${MN} ${-b}`) : sgn(b);
  return s||'0';
}
const oxQ = list => { const [s,a]=one(list); return choQ(`맞으면 O, 틀리면 X<br><b style="font-weight:normal">${s}</b>`, a, ['O','X'], '', 'okx'); };
const PN = n => POLY_NAME[n] || ({11:'십일각형',12:'십이각형',15:'십오각형',18:'십팔각형',20:'이십각형'})[n] || n+'각형';
const baseName = n => PN(n).replace(/형$/,'');

/* 큰 수 글자: 38400000 → 38,400,000 */
const cm = n => Number(n).toLocaleString('en-US');
/* 큰 수 읽기: 38400000 → 삼천팔백사십만 */
function readKo(n){
  const D=['','일','이','삼','사','오','육','칠','팔','구'], P=['천','백','십',''], G=['','만','억','조'];
  let s='', g=0;
  if(n===0) return '영';
  while(n>0){
    const part=n%10000; n=Math.floor(n/10000);
    if(part){ const ds=String(part).padStart(4,'0').split('').map(Number);
      const w=ds.map((d,i)=>!d?'':(d===1&&i<3?'':D[d])+P[i]).join('');
      s=w+G[g]+s; }
    g++;
  }
  return s;
}

function drawLesson(){
  const sb=document.getElementById('sbody'); if(!sb) return;
  sb.innerHTML = LESSONS[App.unit]().join('') + `<button class="big-btn" data-act="smode" data-v="quiz">✏️ 이제 퀴즈 풀어 보기</button>`;
}
function startS(){
  const list=[]; let guard=0;
  while(list.length<10 && guard++<300){ const q=genUnit(App.unit); if(!list.some(x=>x.html===q.html)) list.push(q); }
  S={unit:App.unit,list,i:0,input:'',res:[],correct:0,done:false,lock:false,flash:'',note:'',picked:-1};
  drawS();
}
function qBody(q, input, flash){
  return q.type==='num' ? q.html.replace('□',`<span class="ansbox ${flash}">${input?input.replace('-',MN):'&nbsp;'}</span>`) : q.html;
}
function drawS(){
  const sb=document.getElementById('sbody'); if(!sb) return;
  if(!S || S.unit!==App.unit){ startS(); return; }
  if(S.done){
    sb.innerHTML=`<div class="card center">
      <p class="big">${S.correct===10?'🏆 10문제 모두 정답!':`10문제 중 ${S.correct}개 맞았어요!`}</p>
      <p>받은 별: ⭐ ${S.earned}개</p>
      <button class="big-btn" data-act="startS">다시 하기</button></div>`;
    return;
  }
  const q=S.list[S.i];
  const dots=`<div class="dots">${S.list.map((_,i)=>`<span class="dot ${i<S.i?(S.res[i]?'ok':'no'):(i===S.i?'cur':'')}"></span>`).join('')}</div>`;
  const tag = isMix(App.unit) ? `<div class="unit-tag">${UNITS[q.unit].name}</div>` : '';
  let below='';
  if(q.type==='num') below=keypad('d','skey');
  else below=`<div class="choices ${q.cls}">${q.choices.map((c,i)=>{
      const cls = S.lock ? (c===q.ans?'ok':(i===S.picked?'no':'')) : '';
      return `<button class="choice ${cls}" data-act="spick" data-v="${i}"><span class="ct">${mathText(c)}</span></button>`;
    }).join('')}</div>`;
  sb.innerHTML=`<div class="card board">${dots}${tag}<div class="sq">${qBody(q,S.input,S.flash)}</div>
    <div class="hint">${S.note||(q.type==='num'?'답을 누르고 확인!':'알맞은 것을 골라요.')}</div></div>${below}${S.lock?'':skipBtn('skey','skip')}`;
}
function answerS(ok){
  const q=S.list[S.i];
  S.res.push(ok); beep(ok); logToday('school', ok, UNITS[q.unit].short);
  if(ok){ markO(); S.correct++; S.flash='ok'; S.note=`<span class="praise">${praise()}</span>`; }
  else { addWrong('school', UNITS[q.unit].short, q); S.flash='no'; S.note=`아쉬워요! 정답은 <b>${mathText(String(q.type==='num'?fmtNum(q.ans):q.ans))}</b>${q.explain?`<br><small>${fracText(q.explain)}</small>`:''}`; }
  S.lock=true; drawS();
  const me=S;
  setTimeout(()=>{
    if(S!==me) return;
    S.i++; S.input=''; S.flash=''; S.note=''; S.lock=false; S.picked=-1;
    if(S.i>=10){ S.done=true; S.earned=S.correct+(S.correct===10?2:0); addStar(S.earned); if(S.correct>=8) burst(); }
    if(App.view==='school') drawS();
  }, ok?900:2800);
}
function sKey(v){
  if(!S||S.done||S.lock) return;
  if(v==='skip'){ answerS(false); return; }
  const q=S.list[S.i]; if(q.type!=='num') return;
  if(v==='del') S.input=S.input.slice(0,-1);
  else if(v==='ok'){ if(!S.input||S.input==='.'||S.input==='-') return; answerS(Math.abs(parseFloat(S.input)-q.ans)<1e-9); return; }
  else if(v==='-'){ S.input = S.input[0]==='-' ? S.input.slice(1) : '-'+S.input; }
  else if(v==='.'){ if(!S.input.includes('.') && S.input.replace('-','').length<6) S.input=(S.input.replace('-','')?S.input:S.input+'0')+'.'; }
  else if(/^\d$/.test(v)){ if(S.input.replace('-','').length<6) S.input+=v; }
  drawS();
}
function sPick(i){
  if(!S||S.done||S.lock) return;
  const q=S.list[S.i]; S.picked=i; answerS(q.choices[i]===q.ans);
}

function e4Filter(){

function drawE4(){

  if(!engLv().words[App.e4cat]) App.e4cat=engLv().first;
  if(App.e4qcat!=='all' && !engLv().words[App.e4qcat]) App.e4qcat='all';

    eb.innerHTML=`${e4Filter()}<p class="desc">카드를 누르면 소리가 나와요.</p>

    return;
  }
  if(m==='scard'){
    const t=engLv().sent[App.e4top];
    eb.innerHTML=`${e4Filter()}<p class="desc">누르면 읽어 줘요. 묻는 말(파랑)과 대답(초록)을 짝으로 익혀요.</p>
      ${t.qa.map(([q,qk,a,ak])=>`<button class="sent-card q" data-act="esay" data-v="${esc(q)}"><span class="emo">${t.e}</span><span><span class="en">${esc(q)}</span><small>${qk}</small></span></button>
        <button class="sent-card a" data-act="esay" data-v="${esc(a)}"><span class="emo">💬</span><span><span class="en">${esc(a)}</span><small>${ak}</small></span></button>`).join('')}`;
    return;
  }
  const key=App.elv+'|'+m+'|'+(isSent(m)?App.e4top:App.e4qcat);
  let first=false;
  if(!E || E.key!==key){ startE4(key); first=true; }
  if(E.done){
    eb.innerHTML=`${e4Filter()}<div class="card center"><p class="sub">${E4_MODE_NAME[m]}</p>
      <p class="big">${E.score===E.list.length?'🏆 모두 한 번에 맞혔어요!':`${E.list.length}문제 중 ${E.score}개를 한 번에 맞혔어요!`}</p>
      <p>받은 별: ⭐ ${E.score}개</p><button class="big-btn" data-act="eAgain">다시 하기</button></div>`;
    return;
  }
  const q=E.list[E.i];
  let body='';
  if(q.type==='build'){
    const used=new Set(E.built);
    body=`<div class="slots" id="eslots">${E.built.map((ti,j)=>`<button class="tile ${q.word?'':'w'} en" data-act="eslot" data-v="${j}">${esc(q.tokens[ti])}</button>`).join('')||'<span class="sub" style="align-self:center">아래 조각을 차례로 눌러요</span>'}</div>
      <div class="tiles">${q.tokens.map((t,ti)=>`<button class="tile ${q.word?'':'w'} en ${used.has(ti)?'used':''}" data-act="etile" data-v="${ti}">${esc(t)}</button>`).join('')}</div>
      ${E.solved?'':'<div class="center"><button class="linkbtn" data-act="eclear">↺ 처음부터 다시 놓기</button></div>'}`;
  } else {
    const cls=i=> E.solved && q.vals[i]===q.ans ? 'ok' : (E.picked.includes(i)?'no':'');
    body=`<div class="choices ${q.cls||''}">${q.labels.map((l,i)=>`<button class="choice ${cls(i)}" data-act="epick" data-v="${i}">${l}${E.solved&&q.vals[i]===q.ans&&q.reveal?q.reveal:''}</button>`).join('')}</div>`;
  }
  eb.innerHTML=`${e4Filter()}<div class="card"><div class="qtop"><span>${E4_MODE_NAME[m]} · ${E.i+1} / ${E.list.length}</span><span>⭐ ${E.score}</span></div>
    ${q.html}${body}${E.note?`<div class="hint">${E.note}</div>`:''}${E.solved?'':skipBtn('eskip')}</div>`;
  if(first && q.sayFirst) setTimeout(()=>speak(q.say),350);
}

function pickOthers(pool, cur, keyf, n=3){ const seen=new Set([keyf(cur)]); return shuffle(pool).filter(x=>{ const k=keyf(x); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,n); }

      wrong:{html:`<div class="big-en en">${w.e} ${w.w}</div>이 단어의 뜻은?`, choices:[w.k,...pickOthers(wordPool('all'),w,x=>x.k).map(x=>x.k)], ans:w.k}}; }

    return {sub, html:`<div class="big-en en">${w.w}</div><p class="center"><button class="spk" data-act="esay" data-v="${w.w}">🔊 듣기</button></p><p class="center sub">이 단어의 뜻은?</p>`,
      labels:ch.map(x=>`<span class="ct">${x.k}</span>`), vals:ch.map(x=>x.k), ans:w.k, say:w.w, reveal:` <span class="emo" style="font-size:1.6rem">${w.e}</span>`,
      wrong:{html:`<div class="big-en en">${w.w}</div>이 단어의 뜻은?`, choices:ch.map(x=>x.k), ans:w.k}}; }
  if(m==='spell'){ let t; do{ t=shuffle(w.w.split('')); }while(t.join('')===w.w && w.w.length>1);
    const swapEnd=w.w.slice(0,-2)+w.w.slice(-1)+w.w.slice(-2,-1);
    const vowel=w.w.replace(/[aeiou]/, v=>({a:'e',e:'a',i:'e',o:'u',u:'o'})[v]);
    const swapMid=w.w.length>3 ? w.w[0]+w.w[2]+w.w[1]+w.w.slice(3) : w.w+'e';
    return {type:'build', word:true, sub, html:`<div class="readpic"><span class="emo">${w.e}</span></div><p class="center">${w.k} <button class="spk" data-act="esay" data-v="${w.w}" style="margin-left:6px">🔊</button></p><p class="center sub">알파벳을 차례로 눌러 단어를 만들어요.</p>`,
      tokens:t, ans:w.w, say:w.w, wrong:{html:`<div class="readpic"><span class="emo">${w.e}</span></div>${w.k} → 바른 철자는?`, choices:[w.w, swapEnd, vowel, swapMid, w.w+w.w.slice(-1)], ans:w.w}}; }
  if(m==='slisten'){ const ch=shuffle([w,...pickOthers(engLv().lines,w,x=>x.ko)]);
    return {sub, html:`<button class="replay" data-act="ereplay" aria-label="다시 듣기">🔊</button><p class="center sub" style="margin-top:-6px">잘 듣고 알맞은 뜻을 골라요.</p>`,
      labels:ch.map(x=>`<span class="ct" style="font-size:1.1rem">${x.ko}</span>`), vals:ch.map(x=>x.ko), ans:w.ko, say:w.en, sayFirst:true, cls:'words', reveal:`<br><span class="en">${esc(w.en)}</span>`,
      wrong:{html:`<div class="big-en en" style="font-size:1.4rem">${esc(w.en)}</div>이 문장의 뜻은?`, choices:ch.map(x=>x.ko), ans:w.ko}}; }
  if(m==='sreply'){ const all=qaPool('all'), others=pickOthers(all.filter(x=>x.top!==w.top),w,x=>x.a), ch=shuffle([w,...others]);
    return {sub, html:`<div class="sent-card q" style="margin-bottom:4px"><span class="emo">${engLv().sent[w.top].e}</span><span><span class="en">${esc(w.q)}</span><small>${w.qk}</small></span></div><p class="center"><button class="spk" data-act="esay" data-v="${esc(w.q)}">🔊 듣기</button></p><p class="center sub">알맞은 대답을 골라요.</p>`,
      labels:ch.map(x=>`<span class="en" style="font-size:1.2rem">${esc(x.a)}</span>`), vals:ch.map(x=>x.a), ans:w.a, say:w.q, cls:'words', reveal:`<br><small class="sub">${w.ak}</small>`,
      wrong:{html:`<div class="big-en en" style="font-size:1.4rem">${esc(w.q)}</div>알맞은 대답은?`, choices:ch.map(x=>x.a), ans:w.a}}; }
  // sbuild: 낱말 조각으로 문장 만들기
  const toks=w.en.split(' '); let t; do{ t=shuffle(toks); }while(t.join(' ')===w.en && toks.length>1);
  return {type:'build', sub, html:`<p class="center" style="font-size:1.25rem">${w.ko} <button class="spk" data-act="esay" data-v="${esc(w.en)}" style="margin-left:6px">🔊</button></p><p class="center sub">낱말 조각을 차례로 눌러 영어 문장을 만들어요.</p>`,
    tokens:t, ans:w.en, say:w.en, wrong:{html:`${w.ko}<br>바른 영어 문장은?`, choices:[w.en, t.join(' '), shuffle(toks).join(' '), toks.slice().reverse().join(' ')], ans:w.en}};
}
function startE4(key){
  const m=App.e4mode, src = m==='sreply' ? qaPool(App.e4top) : isSent(m) ? linePool(App.e4top) : wordPool(App.e4qcat).filter(w=>m!=='spell'||/^[a-z]+$/.test(w.w));
  let order=[]; while(order.length<10) order=order.concat(shuffle(src));
  E={key, list:order.slice(0,10).map(w=>genE4(m,w)), i:0, score:0, tried:false, solved:false, picked:[], built:[], note:'', done:false};
  // 복습함용 보기: 겹치는 것을 빼고 4개까지
  E.list.forEach(q=>{ if(q.wrong) q.wrong.choices=[...new Set(q.wrong.choices)].slice(0,4); });
}
function e4Answer(ok){
  const q=E.list[E.i];
  if(ok){
    E.solved=true; beep(true); markO(); speak(q.say); logToday('eng', !E.tried, q.sub);
    if(!E.tried){ E.score++; addStar(1); }
    E.note=`<span class="praise">${praise()}</span>`; drawE4(); e4Next(1500);
  } else {
    beep(false);
    if(!E.tried){ E.tried=true; addWrong('eng', q.sub, q.wrong); }
    drawE4();
    if(q.sayFirst) setTimeout(()=>speak(q.say),400);
  }
}
function e4Next(ms){
  const me=E;
  setTimeout(()=>{
    if(E!==me) return;
    E.i++; E.tried=false; E.solved=false; E.picked=[]; E.built=[]; E.note='';
    if(E.i>=E.list.length){ E.done=true; if(E.score>=8) burst(); }
    if(App.view==='eng'){ drawE4(); const q=!E.done&&E.list[E.i]; if(q&&q.sayFirst) setTimeout(()=>speak(q.say),300); }
  }, ms);
}
function ePick(i){
  if(!E||E.solved||E.done) return;
  const q=E.list[E.i]; if(q.type==='build') return;
  if(q.vals[i]===q.ans){ e4Answer(true); return; }
  if(E.picked.includes(i)) return;
  E.picked.push(i); e4Answer(false);
}
function eTile(ti){
  if(!E||E.solved||E.done) return;
  const q=E.list[E.i]; if(E.built.includes(ti)) return;
  E.built.push(ti);
  if(E.built.length<q.tokens.length){ drawE4(); return; }
  const made=E.built.map(k=>q.tokens[k]).join(q.word?'':' ');
  if(made===q.ans){ e4Answer(true); return; }
  shake('eslots'); eSkip('❌ 순서가 달라요. '); // 틀리면 다시 놓지 않고 바로 정답을 보여 줘요
}
function eSkip(pre=''){
  if(!E||E.solved||E.done) return;
  const q=E.list[E.i];
  if(!E.tried){ E.tried=true; addWrong('eng', q.sub, q.wrong); }
  E.solved=true; beep(false); speak(q.say); logToday('eng', false, q.sub);
  if(q.type==='build'){ // 정답 순서대로 조각을 놓아 보여 줘요
    const used=new Set(); E.built=[];
    q.ans.split(q.word?'':' ').forEach(t=>{ const k=q.tokens.findIndex((x,j)=>x===t&&!used.has(j)); used.add(k); E.built.push(k); });
  }
  E.note=`${pre}정답은 <b class="en">${esc(q.ans)}</b>`; drawE4(); e4Next(pre?3200:2600);
}

function quizPool(cat){

function newQuiz(){
  const pool=quizPool(App.qcat);
  let order=[];
  while(order.length<10){
    const s=shuffle(pool);
    if(order.length && s[0].w===order[order.length-1].w) s.push(s.shift());
    order=order.concat(s);
  }
  Q={mode:App.emode, cat:App.qcat, order:order.slice(0,10), i:0, score:0, done:false};

function nextQ(){
  const pool=quizPool(Q.cat), cur=Q.order[Q.i], n = Q.mode==='listen' ? 4 : 3;
  const seen=new Set([cur.w]);
  const others=shuffle(pool).filter(x=>{ if(seen.has(x.w)) return false; seen.add(x.w); return true; }).slice(0,n-1);
  Q.cur=cur; Q.choices=shuffle([cur,...others]); Q.tried=false; Q.solved=false; Q.wrong=[];
}
function drawQuiz(){
  const eb=document.getElementById('ebody'); if(!eb) return;

  const cats=`<div class="seg small">${pill('qcat','all','🌈 전체',App.qcat)}${QUIZ_CATS.map(c=>pill('qcat',c,WORDS[c].name,App.qcat)).join('')}</div>`;

  const cls=(i)=> Q.solved && Q.choices[i].w===Q.cur.w ? 'ok' : (Q.wrong.includes(i)?'no':'');

    eb.innerHTML=`${cats}<div class="card">${top}
      <button class="replay" data-act="replay" aria-label="다시 듣기">🔊</button>
      <p class="center sub" style="margin-top:-6px">잘 듣고 알맞은 그림을 골라요.</p>

    if(first) setTimeout(()=>{ if(Q&&Q.cur) speak(Q.cur.w); },350);
  } else {

      <div class="readpic">${vis(Q.cur)}</div>

  }

function advanceQ(ms){
  const me=Q;
  setTimeout(()=>{
    if(Q!==me) return;
    Q.i++;
    if(Q.i>=10){ Q.done=true; if(Q.score>=8) burst(); }
    else nextQ();
    if(App.view==='eng' && App.emode===Q.mode){
      drawQuiz();
      if(!Q.done && Q.mode==='listen') setTimeout(()=>{ if(Q&&Q.cur) speak(Q.cur.w); },300);
    }
  },ms);
}

function skipQ(){
  if(!Q||Q.solved||Q.done) return;
  if(!Q.tried) addWrong('eng', basicSub(), basicWrong());

  drawQuiz(); advanceQ(2000);
}
function pick(i){
  if(!Q||Q.solved||Q.done) return;
  const c=Q.choices[i];
  if(c.w===Q.cur.w){
    Q.solved=true; beep(true); markO(); speak(Q.cur.w); logToday('eng', !Q.tried, basicSub());
    if(!Q.tried){ Q.score++; addStar(1); }
    drawQuiz(); advanceQ(1300);

    if(Q.wrong.includes(i)) return;
    if(!Q.tried) addWrong('eng', basicSub(), basicWrong());

    drawQuiz();
    if(Q.mode==='listen') setTimeout(()=>{ if(Q&&Q.cur) speak(Q.cur.w); },400);
  }
}

function advanceH(ms){
  const me=H;
  setTimeout(()=>{
    if(H!==me) return;
    H.i++;
    if(H.i>=10){ H.done=true; if(H.score>=8) burst(); }
    else nextH();
    if(App.view==='hanja' && App.hmode===H.mode){
      drawHQuiz();
      if(!H.done && H.mode==='find') setTimeout(()=>{ if(H&&H.cur) speak(H.cur.m,'ko'); },300);
    }
  },ms);
}

function skipH(){
  if(!H||H.solved||H.done) return;
  if(!H.tried) addWrong('hanja', hSub(), hWrongQ());
  H.tried=true; H.solved=true; beep(false); speak(H.cur.m,'ko'); logToday('hanja', false, hSub());
  drawHQuiz(); advanceH(2200);
}
function hPick(i){
  if(!H||H.solved||H.done) return;
  const c=H.choices[i];
  if(c.h===H.cur.h){
    H.solved=true; beep(true); markO(); speak(H.cur.m,'ko'); logToday('hanja', !H.tried, hSub());
    if(!H.tried){ H.score++; addStar(1); }
    drawHQuiz(); advanceH(1300);
  } else {
    if(H.wrong.includes(i)) return;
    if(!H.tried) addWrong('hanja', hSub(), hWrongQ());
    H.tried=true; H.wrong.push(i); beep(false);
    drawHQuiz();
  }
}

function startR(pid){

function rNote(q){ return q.p ? `💡 글의 ${CIRC[q.p]}문단을 다시 읽어 봐요. (노랗게 칠했어요)` : '💡 글 전체를 다시 떠올려 봐요.'; }
function rWrongQ(q){
  const p=PASSAGE_BY_ID[R.pid];
  const ctx = q.p && !p.poem ? `<div class="ko-para">${paraHTML(p.paras[q.p-1])}</div>` : `<div class="sub">『${p.t}』에서</div>`;
  return {html:`${ctx}${esc(q.q)}`, choices:q.choices, ans:q.ans, explain:q.explain};
}
function rPick(i){
  if(!R||R.solved||R.done||R.phase!=='quiz') return;
  const q=R.qs[R.i], sub='긴 글 · '+genreName(PASSAGE_BY_ID[R.pid].g);
  if(q.choices[i]===q.ans){
    R.solved=true; R.res[R.i]=!R.tried; beep(true); markO(); logToday('korean', !R.tried, sub);
    if(!R.tried){ R.score++; addStar(1); }
    R.note=`<span class="praise">${praise()}</span><br><small>${esc(q.explain)}</small>`; drawPassage(); rNext(1800);
  } else {
    if(R.picked.includes(i)) return;
    if(!R.tried){ R.tried=true; addWrong('korean', sub, rWrongQ(q)); }
    R.picked.push(i); beep(false); R.note=rNote(q); drawPassage();
  }
}
function rSkip(){
  if(!R||R.solved||R.done) return;
  const q=R.qs[R.i], sub='긴 글 · '+genreName(PASSAGE_BY_ID[R.pid].g);
  if(!R.tried) addWrong('korean', sub, rWrongQ(q));
  R.tried=true; R.solved=true; R.res[R.i]=false; beep(false); logToday('korean', false, sub);
  R.note=`정답은 <b>${esc(q.ans)}</b><br><small>${esc(q.explain)}</small>`; drawPassage(); rNext(3000);
}
function rNext(ms){
  const me=R;
  setTimeout(()=>{
    if(R!==me) return;
    R.i++; R.tried=false; R.solved=false; R.picked=[]; R.note='';

  }, ms);
}

function startK(){
  const list=[]; let guard=0;
  while(list.length<10 && guard++<200){ const q=KO_GEN[App.kact](); if(!list.some(x=>x.html===q.html&&x.ans===q.ans)) list.push(q); }
  while(list.length<10) list.push(KO_GEN[App.kact]());
  K={lv:App.klv, act:App.kact, list, i:0, score:0, tried:false, solved:false, picked:[], note:'', done:false};
}
function drawK(){
  const b=document.getElementById('kbody'); if(!b) return;
  if(!K || K.act!==App.kact || K.lv!==App.klv) startK();
  if(K.done){
    b.innerHTML=`<div class="card center"><p class="big">${K.score===10?'🏆 모두 한 번에 맞혔어요!':`10문제 중 ${K.score}개를 한 번에 맞혔어요!`}</p>
      <p>받은 별: ⭐ ${K.score}개</p><button class="big-btn" data-act="kAgain">다시 하기</button></div>`;
    return;
  }
  const q=K.list[K.i];
  const cls=i=> K.solved && q.choices[i]===q.ans ? 'ok' : (K.picked.includes(i)?'no':'');
  b.innerHTML=`<div class="card">
    <div class="qtop"><span>${KO_ACTS[K.act]} · ${K.i+1} / 10</span><span>⭐ ${K.score}</span></div>
    <div class="sq ko-q">${q.html}</div>
    <div class="choices ${q.cls}">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="kpick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
    ${K.note?`<div class="hint">${K.note}</div>`:''}
    ${K.solved?'':skipBtn('kskip')}
  </div>`;
}
function kNext(ms){
  const me=K;
  setTimeout(()=>{
    if(K!==me) return;
    K.i++; K.tried=false; K.solved=false; K.picked=[]; K.note='';
    if(K.i>=10){ K.done=true; if(K.score>=8) burst(); }
    if(App.view==='korean') drawK();
  }, ms);
}
const kSub = () => KO_ACTS[K.act].replace(/^\S+ /,'');
function kPick(i){
  if(!K||K.solved||K.done) return;
  const q=K.list[K.i];
  if(q.choices[i]===q.ans){
    K.solved=true; beep(true); markO(); logToday('korean', !K.tried, kSub());
    if(!K.tried){ K.score++; addStar(1); }
    K.note=`<span class="praise">${praise()}</span>`; drawK(); kNext(1300);
  } else {
    if(K.picked.includes(i)) return;
    if(!K.tried) addWrong('korean', kSub(), q);
    K.tried=true; K.picked.push(i); beep(false);
    K.note=q.explain?`<small>💡 ${q.explain}</small>`:''; drawK();
  }
}
function kSkip(){
  if(!K||K.solved||K.done) return;
  const q=K.list[K.i];
  if(!K.tried) addWrong('korean', kSub(), q);
  K.tried=true; K.solved=true; beep(false); logToday('korean', false, kSub());
  K.note=`정답은 <b>${esc(q.ans)}</b>${q.explain?`<br><small>${q.explain}</small>`:''}`; drawK(); kNext(2600);
}

/* 문제 만들기 */
const hsChoices = (ans, pool, n=4) => shuffle([ans, ...shuffle([...new Set(pool)].filter(x=>x!==ans)).slice(0,n-1)]);
function qWho(it){
  const pool=hisPool().filter(x=>x.type===it.type).map(x=>x.t);
  return {id:it.t, html:`<div class="hs-qd">${it.d}</div>${it.type==='p'?'이 사람은 누구일까요?':'무엇일까요?'}`, ans:it.t, choices:hsChoices(it.t,pool), explain:`${it.e} ${it.t} (${eraName(it.era)})`};
}
function qEra(it){
  return {id:it.t, html:`<div class="hs-qe">${it.e}</div><b>${it.t}</b>${josa(it.t,'은','는').slice(it.t.length)} 어느 시대일까요?`, ans:eraName(it.era), choices:hsChoices(eraName(it.era), hisEras().map(e=>e[1])), explain:it.d};
}
function qOrder(){
  const eras=shuffle(hisEras().map(e=>e[0])).slice(0,4);
  const its=eras.map(k=>one(hisPool().filter(x=>x.era===k)));
  const first=Math.random()<0.6;
  const sorted=its.slice().sort((a,b)=>eraIdx(a.era)-eraIdx(b.era));
  const ans=(first?sorted[0]:sorted[3]).t;
  return {id:ans, html:`시대 순서를 생각해 봐요.<br><b>가장 ${first?'먼저':'나중에'}</b> 있었던 것은?`, ans, choices:shuffle(its.map(x=>x.t)),
    explain:sorted.map(x=>`${x.t}(${eraName(x.era)})`).join(' → ')};
}
const HQ_KIND = {quiz:'퀴즈', mock:'급수 연습 시험', order:'시대 순서 맞히기', wrong:'오답 다시 풀기'};
function startHQ(kind){
  let list=[];
  const P=hisPool();
  if(kind==='quiz'){
    const pool=App.hqera==='all'?P:P.filter(x=>x.era===App.hqera);
    list=shuffle(pool).slice(0,10).map(it=> App.hqera==='all' && Math.random()<0.35 ? qEra(it) : qWho(it));
    while(list.length<10) list.push(qWho(one(pool)));
  } else if(kind==='mock'){
    list=shuffle(P).slice(0,14).map(it=>Math.random()<0.7?qWho(it):qEra(it));
    for(let i=0;i<6;i++) list.push(qOrder());
    list=shuffle(list);
  } else if(kind==='order'){
    list=Array.from({length:10},qOrder);
  } else if(kind==='wrong'){
    const w=Object.keys(store.get('hwrong',{}));
    list=shuffle(HISTORY.filter(x=>w.includes(x.t))).slice(0,10).map(qWho);
    if(!list.length){ toast('오답 노트가 비어 있어요 👍'); return; }
  }
  HQ={kind, list, i:0, score:0, tried:false, solved:false, wrong:[], done:false, start:Date.now(), single:kind==='mock', lv:App.hslv};
  drawHQ();
}
function hsWrongNote(id, add){
  const w=store.get('hwrong',{});
  if(add) w[id]=(w[id]||0)+1; else delete w[id];
  store.set('hwrong',w); store.set('hwrongAt',Date.now()); cloudPush();
}

const hqEraPills = () => HQ && HQ.kind==='quiz' ? `<div class="seg small">${pill('hqera','all','🌈 전체',App.hqera)}${hisEras().map(e=>pill('hqera',e[0],e[1],App.hqera)).join('')}</div>` : '';
function drawHQ(){
  const b=document.getElementById('hsbody'); if(!b||!HQ) return;
  if(HQ.done){
    let res='';
    if(HQ.kind==='mock'){
      const pts=HQ.score*5, msg=pts>=90?'아주 잘했어요! 시험 준비 완료 🏆':pts>=70?'조금만 더! 틀린 문제를 복습해요 💪':'📚 이야기책부터 다시 읽어 봐요';
      res=`<p class="big">${pts}점</p><p>${msg}</p><p class="sub">걸린 시간: ${fmt(HQ.sec)}</p>`;
    } else res=`<p class="big">${HQ.score===HQ.list.length?'🏆 모두 한 번에 맞혔어요!':`${HQ.list.length}문제 중 ${HQ.score}개를 한 번에 맞혔어요!`}</p>`;
    b.innerHTML=`${hqEraPills()}<div class="card center"><p class="sub">${HQ.lv}급 ${HQ_KIND[HQ.kind]}</p>${res}<p>받은 별: ⭐ ${HQ.score}개</p>
      ${HQ.wrong.length?`<p class="sub">틀린 ${HQ.wrong.length}문제는 📒 오답 노트와 🔁 복습함에 모았어요.</p>`:''}
      <button class="big-btn" data-act="hqStart" data-v="${HQ.kind}">다시 하기</button>
      ${HQ.kind==='quiz'?'':'<div class="center"><button class="linkbtn" data-act="hqQuit">◀ 뒤로 가기</button></div>'}</div>`;
    return;
  }
  const q=HQ.list[HQ.i], n=HQ.list.length;
  const cls=i=> HQ.solved && q.choices[i]===q.ans ? 'ok' : (HQ.picked && HQ.picked.includes(i) ? 'no' : '');
  b.innerHTML=`${hqEraPills()}<div class="card">
      <div class="qtop"><span>${HQ_KIND[HQ.kind]} · ${HQ.i+1} / ${n}</span><span>⭐ ${HQ.score}</span></div>
      <div class="sq hs-q">${q.html}</div>
      <div class="choices words hs-ch">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="hqPick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
      ${HQ.solved && HQ.note ? `<div class="hint">${HQ.note}</div>` : ''}
      ${HQ.solved?'':skipBtn('hqSkip')}
      ${HQ.kind==='quiz'?'':'<div class="center"><button class="linkbtn" data-act="hqQuit">◀ 뒤로 가기</button></div>'}
    </div>`;
}
const hqSub = () => HQ_KIND[HQ.kind==='wrong'?'quiz':HQ.kind];
function hqMiss(q){ if(!HQ.tried){ HQ.tried=true; HQ.wrong.push(q.id); hsWrongNote(q.id,true); addWrong('history', hqSub(), q); } }
function hqPick(i){
  if(!HQ||HQ.solved||HQ.done) return;
  const q=HQ.list[HQ.i]; HQ.picked=HQ.picked||[];
  if(q.choices[i]===q.ans){
    HQ.solved=true; beep(true); markO(); logToday('history', !HQ.tried, hqSub());
    if(!HQ.tried){ HQ.score++; addStar(1); if(HQ.kind==='wrong') hsWrongNote(q.id,false); }
    HQ.note=`<span class="praise">${praise()}</span>`;
    drawHQ(); hqNext(1300);
  } else {
    if(HQ.picked.includes(i)) return;
    HQ.picked.push(i); beep(false); hqMiss(q);
    if(HQ.single){ HQ.solved=true; logToday('history', false, hqSub()); HQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${q.explain}</small>`; drawHQ(); hqNext(2600); return; }
    drawHQ();
  }
}
function hqSkip(){
  if(!HQ||HQ.solved||HQ.done) return;
  const q=HQ.list[HQ.i];
  hqMiss(q);
  HQ.solved=true; beep(false); logToday('history', false, hqSub());
  HQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${q.explain}</small>`;
  drawHQ(); hqNext(2600);
}
function hqNext(ms){
  const me=HQ;
  setTimeout(()=>{
    if(HQ!==me) return;
    HQ.i++; HQ.tried=false; HQ.solved=false; HQ.picked=[]; HQ.note='';
    if(HQ.i>=HQ.list.length){
      HQ.done=true; HQ.sec=Math.round((Date.now()-HQ.start)/1000);
      if(HQ.kind==='mock'){ const best=store.get('hmock',0); if(HQ.score*5>best){ store.set('hmock',HQ.score*5); cloudPush(); } }
      if(HQ.score>=HQ.list.length*0.8) burst();
    }
    if(App.view==='history') drawHQ();
  }, ms);
}

/* 관리자 로그인: 온라인 저장(Firebase)이 켜져 있으면 이메일/비밀번호로 들어가요.
   메일 주소가 소스에 드러나지 않도록 SHA-256 값만 적어요. (도윤 · 도진 · 가스 · 방 앱과 같은 관리자 계정)
   엄마 모드는 이메일 없이 엄마 비밀번호(4자리)로 들어가요. */
const ADMIN_EMAIL_SHA256 = '22fa372a479af0929cadcbf6b12b6c2dace34800344067ef44b21a0c187487fb';
async function sha256Hex(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const isAdminUser=async u=>{ const em=((u&&u.email)||'').trim().toLowerCase(); return !!em && await sha256Hex(em)===ADMIN_EMAIL_SHA256; };
function admEnter(){
  setMode='admin'; pinBuf=''; drawSettings();
  const v=admView||who||getProfiles()[0]; cloudPull(v).then(ok=>{ if(ok && setMode==='admin') drawSettings(); });
}
function admEmailHTML(){
  const f='display:block;width:100%;box-sizing:border-box;font:inherit;padding:.6rem .8rem;border:2px solid var(--line);border-radius:12px;margin:4px 0 12px;background:var(--paper);color:inherit';
  return `<h3>🔒 관리자 모드</h3>
    <p class="sub" style="margin:0 0 10px;font-size:.9rem">관리자 이메일과 비밀번호로 로그인하세요.</p>
    <label class="lbl" for="admEm">이메일</label>
    <input id="admEm" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" style="${f}">
    <label class="lbl" for="admPw">비밀번호</label>
    <input id="admPw" type="password" autocomplete="current-password" style="${f}">
    <button class="big-btn" data-act="admLogin">로그인</button>
    <button class="big-btn" data-act="closeSet" style="opacity:.8">닫기</button>
    <div class="center"><button class="linkbtn" data-act="admReset">비밀번호를 잊었어요</button></div>`;
}
async function admEmailLogin(){
  const em=((document.getElementById('admEm')||{}).value||'').trim().toLowerCase(), pw=(document.getElementById('admPw')||{}).value||'';
  if(!em||!pw){ toast('이메일과 비밀번호를 넣어 주세요'); return; }
  if(await sha256Hex(em)!==ADMIN_EMAIL_SHA256){ toast('관리자 이메일이 아니에요'); return; }
  if(!await cloudInit()){ toast('온라인 저장에 연결하지 못했어요'); return; }
  try{
    const r=await firebase.auth().signInWithEmailAndPassword(em,pw);
    if(await isAdminUser(r.user)){ if(setMode==='pin' && !isMom()) admEnter(); }
    else { await firebase.auth().signOut(); toast('관리자 계정이 아니에요'); }
  }catch(e){
    console.warn('로그인 실패',e);
    const m={'auth/invalid-credential':'이메일이나 비밀번호가 맞지 않아요','auth/wrong-password':'비밀번호가 맞지 않아요','auth/user-not-found':'등록되지 않은 이메일이에요','auth/too-many-requests':'여러 번 틀려서 잠시 막혔어요. 조금 뒤에 다시 해 주세요','auth/operation-not-allowed':'Firebase에서 이메일/비밀번호 로그인을 켜 주세요','auth/network-request-failed':'인터넷 연결을 확인해 주세요'}[e.code];
    toast(m||'로그인하지 못했어요');
  }
}
async function admEmailReset(){
  const em=((document.getElementById('admEm')||{}).value||'').trim().toLowerCase();
  if(!em){ toast('이메일을 먼저 넣어 주세요'); return; }
  if(await sha256Hex(em)!==ADMIN_EMAIL_SHA256){ toast('관리자 이메일이 아니에요'); return; }
  if(!await cloudInit()){ toast('온라인 저장에 연결하지 못했어요'); return; }
  try{ await firebase.auth().sendPasswordResetEmail(em); toast('비밀번호 재설정 메일을 보냈어요'); }catch(e){ console.warn(e); toast('메일을 보내지 못했어요'); }
}

function pinKey(v){
  if(v==='ok'){ openModal('deco'); return; }
  if(v==='del'){ pinBuf=pinBuf.slice(0,-1); drawSettings(); return; }
  if(!/^\d$/.test(v) || pinBuf.length>=4) return;
  pinBuf+=v;
  if(pinBuf.length<4){ drawSettings(); return; }
  if(isMom() ? hashPin(pinBuf,'mom')===momPinH() : hashPin(pinBuf,'admin')===adminPinH()){
    setMode='admin'; pinBuf=''; drawSettings();
    const v=admView||who||getProfiles()[0]; cloudPull(v).then(ok=>{ if(ok && setMode==='admin') drawSettings(); });
    return;
  }
  drawSettings(); shake('pinrow'); beep(false); toast('비밀번호가 틀렸어요');
  setTimeout(()=>{ if(setMode==='pin'){ pinBuf=''; drawSettings(); } },450);
}

async function loadOther(id){
  const k=ALL_KIDS.find(x=>x.id===id);
  try{
    if(!await cloudInit()) throw new Error('온라인 저장에 연결하지 못했어요');
    const ref=cloud.db.collection(k.grade).doc(k.id), [snap,qs]=await Promise.all([ref.get(), ref.collection('daily').get()]);
    const days={}; qs.forEach(d=>{ days[d.id]=d.data(); });
    OTHER[id]={doc:snap.exists?snap.data():{}, days};
  }catch(e){ OTHER[id]={err:e.message||String(e)}; }
  if(setMode==='admin' && admOther===id) drawSettings();
}

/* 한국어로 여러 문장을 차례로 읽어 줘요 */
function speakList(list){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  list.forEach(t=>{ const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=0.9; if(koVoice) u.voice=koVoice; speechSynthesis.speak(u); });
}
const spokenText = el => { const c=el.cloneNode(true); c.querySelectorAll('[data-say]').forEach(x=>{ x.textContent=' '+x.dataset.say+' '; }); c.querySelectorAll('button,svg').forEach(x=>x.remove());
  return c.textContent.replace(/×/g,' 곱하기 ').replace(/−/g,' 빼기 ').replace(/÷/g,' 나누기 ').replace(/°/g,'도').replace(/\s+/g,' ').trim(); };

  etile: v=>eTile(+v),
  eslot: v=>{ if(!E||E.solved) return; E.built.splice(+v,1); drawE4(); },
  eclear: ()=>{ if(!E||E.solved) return; E.built=[]; drawE4(); },
  eskip: ()=>eSkip(),
  eAgain: ()=>{ E=null; drawE4(); },
  // 국어
  klv: v=>{ App.klv=+v; store.set('klv',App.klv); if(!koLv().acts.includes(App.kact)) App.kact='read'; App.kgenre='all'; App.pid=null; R=null; K=null; render(); },
  kact: v=>{ App.kact=v; K=null; if(v!=='read'){ App.pid=null; R=null; } render(); },
  kpick: v=>kPick(+v),
  kskip: ()=>kSkip(),
  kAgain: ()=>{ K=null; drawK(); },
  kgenre: v=>{ App.kgenre=v; drawRead(); },
  openP: v=>{ const pp=PASSAGE_BY_ID[v]; if(pp && pp.lv!==App.klv){ App.klv=pp.lv; store.set('klv',App.klv); } App.kact='read'; App.pid=v; R=null; if(App.view!=='korean') go('korean'); else { render(); window.scrollTo(0,0); } },
  closeP: ()=>{ App.pid=null; R=null; speechSynthesis && speechSynthesis.cancel(); render(); window.scrollTo(0,0); },
  againP: ()=>{ R=null; drawPassage(); window.scrollTo(0,0); },
  readDone: ()=>{ if(!R) return; R.readSec=Math.round((Date.now()-R.start)/1000); R.phase='quiz'; drawPassage(); const c=document.querySelector('.rq'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); },
  readAloud: ()=>{ const p=PASSAGE_BY_ID[App.pid]; if(p) speakList([p.t, ...p.paras.filter(Boolean).map(plain)]); },
  rpick: v=>rPick(+v),
  rskip: ()=>rSkip(),
  addBook: ()=>{
    const t=document.getElementById('bkT').value.trim(), l=document.getElementById('bkL').value.trim();
    if(!t){ toast('책 제목을 적어 주세요'); return; }
    const list=store.get('books',[]), today=list.filter(x=>x.d===dayKey()).length;
    list.push({t, l, d:dayKey(), at:Date.now()}); while(list.length>300) list.shift();
    store.set('books',list); store.set('booksAt',Date.now());
    if(today<3){ addStar(1); toast('📒 기록했어요! ⭐ +1'); } else { toast('📒 기록했어요!'); cloudPush(); }
    drawBooks();
  },
  delBook: v=>{ if(!confirm('이 기록을 지울까요?')) return; store.set('books', store.get('books',[]).filter(x=>String(x.at)!==v)); store.set('booksAt',Date.now()); cloudPush(); drawBooks(); },
  // 한자
  hskip: ()=>skipH(),
  hmode: v=>{ App.hmode=v; H=null; render(); },
  hgrp: v=>{ App.hgrp=v; H=null; App.hmode==='card' ? drawHCard() : drawHQuiz(); },
  htile: v=>{ App.hchar=v; drawHCard(); speak(HANJA_ALL.find(x=>x.h===v).m,'ko'); },
  hlv: v=>{ App.hlv=+v; store.set('hlv',App.hlv); H=null; App.hgrp='all'; App.hchar=hList()[0].h; render(); },
  hpick: v=>hPick(+v),
  hAgain: ()=>{ H=null; drawHQuiz(); },
  // 한국사
  hslv: v=>{ App.hslv=+v; store.set('hslv',App.hslv); HQ=null; SQ=null; App.story=null; App.hitem=0; render(); },
  hsay: v=>{ if(v) speak(v,'ko'); else { const it=hisPool().filter(x=>x.era===App.hera)[App.hitem]; if(it) speak(it.t+'. '+it.d,'ko'); } },
  hsmode: v=>{ App.hsmode=v; App.exv='menu'; if(HQ && (v==='quiz')!==(HQ.kind==='quiz')) HQ=null; render(); },
  hera: v=>{ App.hera=v; App.hitem=0; drawHStudy(); },
  hitem: v=>{ App.hitem=+v; drawHStudy(); },
  hqera: v=>{ App.hqera=v; HQ=null; drawHQuizArea(); },
  hqStart: v=>{ startHQ(v); },
  hqPick: v=>hqPick(+v),
  hqSkip: ()=>hqSkip(),
  hqQuit: ()=>{ HQ=null; render(); },
  exv: v=>{ App.exv=v; HQ=null; drawExam(); },
  openStory: v=>{ App.hsmode='story'; App.story=v; App.spage=0; SQ=null; if(App.view!=='history') go('history'); else { render(); window.scrollTo(0,0); } if(App.autoRead) setTimeout(sayStoryPage,300); },
  closeStory: ()=>{ App.story=null; SQ=null; speechSynthesis && speechSynthesis.cancel(); drawStory(); window.scrollTo(0,0); },
  spage: v=>{ const st=STORIES.find(s=>s.id===App.story); if(!st) return; App.spage=Math.max(0,Math.min(st.pages.length-1,App.spage+ +v)); drawStory(); if(App.autoRead) sayStoryPage(); else speechSynthesis && speechSynthesis.cancel(); },
  storySay: ()=>sayStoryPage(),
  autoRead: ()=>{ App.autoRead=!App.autoRead; drawStory(); if(App.autoRead) sayStoryPage(); },
  storyQuiz: ()=>{ const st=STORIES.find(s=>s.id===App.story); if(!st) return; speechSynthesis && speechSynthesis.cancel();
    SQ={id:st.id, list:st.quiz.map(([q,a,o])=>({q, ans:a, choices:shuffle([a,...o])})), i:0, score:0, tried:false, solved:false, picked:[], note:'', done:false}; drawStory(); },
  sqPick: v=>sqAnswer(+v,false),
  sqSkip: ()=>sqAnswer(-1,true),
  // 설정 · 관리자
  openSet: ()=>openModal('deco'),
  closeSet: ()=>closeModal(),
  openAdmin: ()=>{ admRole='admin'; openModal('pin'); cloudPullSettings().then(ch=>{ if(ch && setMode==='pin' && !FIREBASE_CONFIG) drawSettings(); }); admAuto(); },
  admLogin: ()=>admEmailLogin(),
  admReset: ()=>admEmailReset(),
  admLogout: ()=>{ if(window.firebase && firebase.auth) firebase.auth().signOut().catch(()=>{}); toast('관리자에서 로그아웃했어요'); closeModal(); },
  openMom: ()=>{ admRole='mom'; openModal('pin'); cloudPullSettings().then(ch=>{ if(ch && setMode==='pin') drawSettings(); }); },
  admMomPin: ()=>{
    const p=document.getElementById('momPin').value;
    if(!/^\d{4}$/.test(p)){ toast('숫자 4자리로 적어 주세요'); return; }
    admin.momH=hashPin(p,'mom'); saveAdmin(); toast(isMom()?'엄마 비밀번호를 바꿨어요':'엄마 비밀번호를 정했어요. 엄마께 알려 주세요'); drawSettings();
  },
  admMomDel: ()=>{ if(!confirm('엄마 비밀번호를 지울까요? 엄마 모드로 들어갈 수 없게 돼요.')) return; admin.momH=''; saveAdmin(); toast('엄마 비밀번호를 지웠어요'); drawSettings(); },
  pin: v=>pinKey(v),
  set: (v,el)=>{
    const k=el.dataset.k;
    settings[k] = k==='size' ? +v : (k==='sound' ? v==='true' : v);
    applySettings();
    if(!document.getElementById('settings').hidden) drawSettings();
  },
  adm: (v,el)=>{
    const k=el.dataset.k;
    if(k==='subj') admin.subj[v]=!admin.subj[v];
    if(k==='goal') admin.goal=+v;
    saveAdmin(); drawSettings();
  },
  admMsg: ()=>{ admin.msg=document.getElementById('admMsg').value.trim(); saveAdmin(); toast('저장했어요'); },
  admStar: v=>{ if(isMom()) return; stars=Math.max(0,stars+ +v); store.set('stars',stars); store.set('starsAt',Date.now()); updateStars(); cloudPush(); drawSettings(); },
  admPin: ()=>{
    if(isMom()) return;
    const p=document.getElementById('admPin').value;
    if(!/^\d{4}$/.test(p)){ toast('숫자 4자리로 적어 주세요'); return; }
    admin.pinH=hashPin(p,'admin'); delete admin.pin; saveAdmin(); toast('비밀번호를 바꿨어요'); drawSettings();
  },
  reset: async ()=>{
    if(typeof isMom==='function' && isMom()) return;
    const name=admView||who||getProfiles()[0];
    if(!confirm(`${name}의 별, 스티커, 학습 기록, 공부 시간, 복습함을 모두 지울까요?\n지운 기록은 되살릴 수 없어요.`)) return;
    PROFILE_KEYS.filter(k=>!KEEP_ON_RESET.includes(k)).forEach(k=>store.del(k,name));
    const now=Date.now(); ['hwrongAt','wrongsAt','booksAt','starsAt'].forEach(k=>store.set(k,now,name));
    await cloudReset(name);   // 온라인 기록과 다른 기기의 기록도 지워져요
    if(name===who){ stars=0; markVisit(); updateStars(); }
    toast('🗑️ 기록을 모두 지웠어요'); drawSettings();
  }
};
document.addEventListener('click',e=>{
  lastAct=Date.now();
  if(e.target.id==='settings'){ closeModal(); return; }
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const f=ACT[el.dataset.act]; if(f) f(el.dataset.v, el);
});
document.addEventListener('keydown',e=>{
  lastAct=Date.now();
  if(!document.getElementById('login').hidden){
    if(LP){ if(/^[0-9]$/.test(e.key)) lpinKey(e.key); else if(e.key==='Backspace') lpinKey('del'); return; }
    if(e.key==='Enter' && e.target.id==='newWho') addWho(); return;
  }
  if(e.target.tagName==='INPUT'){ if(e.key==='Enter' && (e.target.id==='admEm'||e.target.id==='admPw')){ ACT.admLogin(); return; } if(e.key==='Enter' && (e.target.id==='bkT'||e.target.id==='bkL')) ACT.addBook(); return; }
  let fn=null;
  if(!document.getElementById('settings').hidden){ if(setMode==='pin') fn=pinKey; }
  else if(App.view==='school' && App.smode==='quiz') fn=sKey;
  if(!fn) return;
  if(/^[0-9]$/.test(e.key)) fn(e.key);
  else if(e.key==='.' && fn===sKey) fn('.');
  else if(e.key==='Backspace') fn('del');
  else if(e.key==='Enter' && fn!==pinKey){ e.preventDefault(); fn('ok'); }
});

applySettings();
updateStars();
showLogin();
cloudPullSettings().then(ch=>{ if(ch && who && App.view==='home') render(); });
tick();
setInterval(tick,1000);
</script>
</body>
</html>
