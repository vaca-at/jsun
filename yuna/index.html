<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
@font-face{font-family:'OngleipStudyWell';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_StudyHard-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;}
@font-face{font-family:'OnglippDaelong';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2507-2@1.0/Ownglyph_daelong-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;}
/* 좋아하는 글씨체 */
@font-face{font-family:'NexonLv2Gothic';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv2 Gothic Light.woff') format('woff');font-weight:300;font-display:swap;}
@font-face{font-family:'NexonLv2Gothic';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv2 Gothic.woff') format('woff');font-weight:normal;font-display:swap;}
@font-face{font-family:'NexonLv2Gothic';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv2 Gothic Bold.woff') format('woff');font-weight:700;font-display:swap;}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff');font-weight:300;font-display:swap;}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-weight:500;font-display:swap;}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap;}
@font-face{font-family:'OwnglyphYuntaeng';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/온글잎 윤탱체.woff2') format('woff2');font-weight:400;font-display:swap;size-adjust:118%;}
@font-face{font-family:'OngleipKimkonghae';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408@1.0/Ownglyph_kimkonghae.woff2') format('woff2');font-weight:normal;font-display:swap;}
@font-face{font-family:'OngleipTterom';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-4@1.0/Ownglyph_ttaerom-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;size-adjust:135%;}
@font-face{font-family:'MitmiFont';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_1@1.0/Ownglyph_meetme-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;}
@font-face{font-family:'GangwonEducationSaeum';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEduSaeeum_OTFMediumA.woff') format('woff');font-weight:normal;font-display:swap;}

:root{--size:1;--fsc:1;--font:'Jua';--font-t:var(--font);--font-p:var(--font);--tw:normal;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{font-size:calc(17px * var(--size) * var(--fsc));scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;min-height:100vh;font-family:var(--font),'Jua',system-ui,sans-serif;color:var(--ink);background-color:var(--bg);-webkit-tap-highlight-color:transparent;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
/* 글씨 조합: 제목(--font-t) · 본문(--font) · 포인트(--font-p) */
h1,.big,.tab,.pill,.big-btn,.subj b,.sheet h3,.grass-head b,.bigtime,.hq,.qtop,.letters,.abc-word,.ww,.ph-eq{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw)}
.praise,.bn-p,.msg,.hj-mean,.hj-qm,.ph-ko,.toast,.hello .big{font-family:var(--font-p),var(--font),'Jua',sans-serif;font-weight:normal}
.en{font-family:'Andika',system-ui,sans-serif}
.hanja{font-family:'Noto Serif KR','Batang','Noto Serif CJK KR',serif;font-weight:700}

/* ───── 디자인 3종 ───── */
body[data-theme="note"]{--bg:#F6F9FF;--paper:#FFFFFF;--ink:#1F3354;--sub:#6A7FA0;--line:#D5E3F5;--accent:#2F6FDB;--accent-ink:#FFFFFF;--hi:#FFD84D;--ok:#23A065;--no:#E5484D;--carry:#E5484D;--card:#FFFFFF;--shadow:0 3px 0 #D5E3F5;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,#E3ECF8 35px,#E3ECF8 36px)}
body[data-theme="note"]::before{content:"";position:fixed;top:0;bottom:0;left:18px;width:2px;background:#F4B4B4;pointer-events:none}
body[data-theme="chalk"]{--bg:#26433A;--paper:#2E5145;--ink:#F3F1E7;--sub:#B7CABD;--line:#40685A;--accent:#F7D96B;--accent-ink:#26433A;--hi:#F7D96B;--ok:#8FE3A8;--no:#FF9A9A;--carry:#FFB4C2;--card:#2E5145;--shadow:0 3px 0 #1B3129}
body[data-theme="crayon"]{--bg:#FFF0F3;--paper:#FFFFFF;--ink:#3A2E4D;--sub:#8A7A9C;--line:#F6CCD6;--accent:#7B5CFF;--accent-ink:#FFFFFF;--hi:#FFB23F;--ok:#18A97C;--no:#F0506E;--carry:#F0506E;--card:#FFFFFF;--shadow:0 4px 0 #F6CCD6}
body[data-theme="crayon"] .card{border-style:dashed}

/* ───── 상단 ───── */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line);padding:8px 12px 8px 28px}
.toprow,.tabs,.nowbar,main{max-width:780px;margin:0 auto}
.toprow{display:flex;align-items:center;gap:8px}
.grade{display:flex;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px;flex:none}
.grade a{padding:.3rem .85rem;border-radius:999px;text-decoration:none;color:var(--sub);font-size:1rem}
.grade a.on{background:var(--accent);color:var(--accent-ink)}
h1{flex:1;margin:0;font-size:1.3rem;font-weight:normal;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.starbox{display:flex;align-items:center;gap:4px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:.25rem .7rem;font-size:1.05rem}
.iconbtn{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-size:1.15rem}
.nowbar{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:.95rem;color:var(--sub);font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
h1 button{font:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1 button::after{content:" ▾";font-size:.7em;color:var(--sub)}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login[hidden]{display:none}
.login-box{width:100%;max-width:420px;text-align:center}
.login-ico{font-size:3.4rem}
.login h2{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw);font-size:1.8rem;margin:4px 0 16px}
.who-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.who{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 8px;border-radius:22px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow)}
.who-ico{font-size:3.2rem;line-height:1.1}
.who-ico.black-dragon{filter:grayscale(1) brightness(.38) contrast(1.4) drop-shadow(0 0 5px rgba(140,70,220,.85))}
.who-ico.black-cat{filter:grayscale(1) brightness(.4) contrast(1.3)}
.who-ico.ct1{filter:grayscale(1) brightness(1.55) contrast(.85)}
.who-ico.ct2{filter:grayscale(1) sepia(1) hue-rotate(180deg) saturate(.7) brightness(.95)}
.who-ico.ct3{filter:grayscale(1) brightness(.4) contrast(1.3)}
.who-ico.ct4{filter:grayscale(1) sepia(1) saturate(.8) brightness(.7)}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:10px}
.char-grid .who small{font-size:.8rem}
#loginNew[hidden]{display:none}
.who b{font-weight:normal;font-size:1.5rem;font-family:var(--font-t),var(--font),'Jua',sans-serif}
.who small{color:var(--sub)}
.lp{grid-column:1/-1}
.lp-who{display:flex;align-items:center;justify-content:center;gap:10px}
.lp-who b{font-weight:normal;font-size:1.6rem;font-family:var(--font-t),var(--font),'Jua',sans-serif}
.lp .keypad{max-width:300px}
.tab{flex:1 1 0;white-space:nowrap;padding:.5rem .2rem;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-size:1.02rem;color:var(--sub)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[hidden]{display:none}

main{padding:16px 12px 40px 28px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.center{text-align:center}
.sub{color:var(--sub)}
.big{font-size:1.5rem}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{padding:.45rem .9rem;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-size:1rem}
.pill.on{background:var(--hi);border-color:var(--hi);color:#3A2E1A}
.seg.oneline{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg.oneline::-webkit-scrollbar{display:none}
.seg.oneline .pill{flex:none;white-space:nowrap;padding:.4rem .7rem}
/* 큰 분류(윗줄)는 크게, 그 안의 거르기(아랫줄 .small)는 작은 칩으로 */
.seg:not(.small) .pill{font-size:1.05rem;padding:.5rem 1rem}
.seg.small{gap:5px}
.seg.small .pill{font-size:.82rem;padding:.25rem .65rem;border-width:1.5px;font-family:var(--font),'Jua',sans-serif;font-weight:normal}
.desc{margin:-2px 0 12px;color:var(--sub);font-size:.95rem}
.big-btn{display:block;width:100%;max-width:420px;margin:14px auto 0;padding:.85rem;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:1.3rem;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

/* ───── 시계 ───── */
.clock{width:7.5rem;height:7.5rem;flex:none;display:block}
.ck-face{fill:var(--paper);stroke:var(--ink);stroke-width:4}
.ck-tick{stroke:var(--sub);stroke-width:1.5}
.ck-tick.b{stroke:var(--ink);stroke-width:3}
.ck-num{fill:var(--ink);font-size:17px;text-anchor:middle;dominant-baseline:central;font-family:'Jua',sans-serif}
.ck-h{stroke:var(--ink);stroke-width:8;stroke-linecap:round}
.ck-m{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.ck-s{stroke:var(--no);stroke-width:2;stroke-linecap:round}
.ck-c{fill:var(--ink)}

/* ───── 홈 ───── */
.clockcard{display:flex;align-items:center;gap:18px}
.bigtime{font-size:2.1rem;line-height:1.2;font-variant-numeric:tabular-nums}
.msg{margin-top:12px;font-size:1.15rem;background:color-mix(in srgb,var(--hi) 22%,var(--card))}
.hello{margin-top:12px}
.hello .big{margin-bottom:4px}
.goal{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.goal i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.banner{margin-bottom:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--hi) 30%,var(--card)),var(--card))}
.bn-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.bn-tag{font-size:.9rem;color:var(--sub)}
.bn-p{font-size:1.6rem;line-height:1.35;text-align:center;margin:6px 0}
.bn-m{text-align:center;font-size:.92rem;color:var(--sub);margin:2px 0}
.bn-ex{margin:6px 0 0;padding:8px 10px;border-radius:12px;background:var(--paper);border:2px dashed var(--line);font-size:.92rem;line-height:1.5;color:var(--sub);text-align:center}
.bn-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.bn-btns .pill{font-size:.95rem;padding:.35rem .8rem}
/* 오른쪽 위에 떠 있는 시계 · 스티커 타일 */
.dock{position:fixed;top:128px;right:max(12px, calc((100vw - 780px) / 2 - 104px));z-index:30;display:flex;flex-direction:column;gap:10px}
.dock-t{width:84px;padding:10px 4px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 6px 16px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.dock-t small{font-size:.75rem;color:var(--sub)}
.dock-t i{font-style:normal;font-size:.72rem;color:var(--sub)}
.dock-t b{font-size:1.35rem;font-weight:normal;font-family:var(--font-t),var(--font),'Jua',sans-serif;font-variant-numeric:tabular-nums}
.dk-ico{font-size:1.7rem;line-height:1.1}
@media (max-width:1000px){ main{padding-right:100px} }
.decobar{max-width:780px;margin:6px auto 0;display:flex;align-items:center;justify-content:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.decobar::-webkit-scrollbar{display:none}
.dchip{flex:none;white-space:nowrap;padding:.18rem .55rem;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:.78rem;color:var(--sub);font-family:var(--font),'Jua',sans-serif}
.dchip i{font-style:normal}
.dchip.on{background:var(--hi);border-color:var(--hi);color:#3A2E1A}
.dsep{flex:none;width:1.5px;height:1rem;background:var(--line);margin:0 4px}
.grasscard{margin-top:12px}
.deco{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.deco-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.deco-row b{font-weight:normal;color:var(--sub);min-width:4.5em}
.deco-row .seg{margin:0}
.grass-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px}
.grass-head b{font-weight:normal;font-size:1.2rem}
.grass-wrap{display:flex;gap:4px;overflow-x:auto;padding:2px 2px 4px}
.grass-d,.grass{display:grid;grid-template-rows:repeat(7,24px);gap:4px}
.grass-d{font-size:.78rem;line-height:24px;color:var(--sub);padding-right:4px}
.grass{grid-auto-flow:column;grid-auto-columns:24px}
.g{width:24px;height:24px;border-radius:6px;padding:0;background:color-mix(in srgb,var(--line) 75%,transparent)}
.g.v{background:transparent;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ok) 60%,transparent)}
.g.g1{background:color-mix(in srgb,var(--ok) 30%,var(--paper))}
.g.g2{background:color-mix(in srgb,var(--ok) 55%,var(--paper))}
.g.g3{background:color-mix(in srgb,var(--ok) 80%,var(--paper))}
.g.g4{background:var(--ok)}
.g.t{outline:2px solid var(--accent);outline-offset:1px}
.grass-leg{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:.8rem;color:var(--sub);margin-top:6px}
.grass-leg .g{display:inline-block;cursor:default;width:13px;height:13px;border-radius:3px}
.g.out{visibility:hidden}
.g.fut{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.grass-wrap{justify-content:center}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.subj{text-align:left;padding:18px;border-radius:22px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.subj .ico{font-size:2.6rem;line-height:1}
.subj b{font-size:1.5rem;font-weight:normal}
.subj small{color:var(--sub);font-size:.95rem}
.clocktile{align-items:center;text-align:center;justify-content:center;gap:2px}
.clocktile .clock{width:5rem;height:5rem}
.clocktile .bigtime{font-size:1.25rem;line-height:1.2}
.subj.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px}

/* ───── 연산: 세로셈 모눈판 ───── */
.board{display:flex;flex-direction:column;align-items:center}
.vgrid{display:grid;grid-template-columns:2.6rem repeat(3,4.4rem);align-items:center;justify-items:center;row-gap:4px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:4.4rem 4.4rem;background-position:2.6rem 0;padding:6px 8px 10px;border-radius:12px}
.colname{font-size:.85rem;color:var(--sub)}
.dg{font-size:3rem;line-height:1.2;height:4.2rem;display:flex;align-items:center}
.dg.op{font-size:2.6rem}
.bar{grid-column:1/-1;width:100%;height:4px;background:var(--ink);border-radius:2px;margin:2px 0 6px}
.cell{width:3.7rem;height:4.1rem;border:3px dashed var(--sub);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.9rem;background:var(--paper);transition:transform .15s}
button.cell{padding:0;color:var(--ink)}
.cell.carry{width:2.6rem;height:2.8rem;font-size:1.9rem;border-color:var(--carry);color:var(--carry)}
.cell.active{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
.cell.carry.active{border-color:var(--carry);box-shadow:0 0 0 5px color-mix(in srgb,var(--carry) 25%,transparent)}
.cell.done{border-style:solid;border-color:var(--ok)}
.cell.carry.done{border-color:var(--carry)}
.hint{margin-top:12px;min-height:3.2em;text-align:center;font-size:1.15rem;line-height:1.5}
.hint b{color:var(--no);font-weight:normal;font-size:1.3em}
.hint small{color:var(--sub);font-size:.9em}
.praise{font-size:1.6rem;color:var(--ok)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:14px auto 0}
.key{padding:.6rem 0;font-size:1.9rem;border-radius:16px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.fn{font-size:1.15rem}
.key.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.key.hint{background:var(--hi);border-color:var(--hi);color:#3A2E1A}

.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--accent)}
.dot.ok{background:var(--ok)}
.dot.no{background:var(--no)}
.hq{font-size:2.6rem;display:flex;align-items:center;gap:.3em;flex-wrap:wrap;justify-content:center}
.ansbox{min-width:3.2em;padding:0 .2em;border-bottom:4px solid var(--accent);text-align:center}
.ansbox.ok{color:var(--ok);border-color:var(--ok)}
.ansbox.no{color:var(--no);border-color:var(--no)}

/* ───── 학교수학 ───── */
.sq{text-align:center;font-size:1.45rem;line-height:1.75;width:100%}
.sq .clock{width:11rem;height:11rem;margin:0 auto 8px}
.sq .ansbox{display:inline-block;min-width:2.2em;line-height:1.3;font-size:1.25em}
.sq .big{font-size:2.2rem}
.box{display:inline-block;min-width:1.7em;border:3px dashed var(--sub);border-radius:8px;line-height:1.25}
.unit-tag{display:inline-block;font-size:.85rem;color:var(--sub);border:2px solid var(--line);border-radius:999px;padding:0 .6rem;margin-bottom:6px}
.tbl{border-collapse:collapse;margin:4px auto 12px;font-size:1rem;line-height:1.3}
.tbl th,.tbl td{border:2px solid var(--line);padding:.3rem .5rem;text-align:center;font-weight:normal}
.tbl th{color:var(--sub)}
.gtbl td{width:3.4rem;height:1.9rem;padding:0 .3rem;color:var(--accent);font-size:1.4rem;line-height:1}
.gtbl .ax{border:none;font-size:.85rem}
.gcap{font-size:1rem;color:var(--sub)}
.choice .ct{font-size:1.5rem}

/* ───── 영어 ───── */
.abc-hero{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"let pic" "word word" "spk spk";align-items:center;gap:6px 16px;text-align:center}
.letters{grid-area:let;font-size:4.2rem;line-height:1}
.letters span{font-size:.8em;margin-left:.15em;color:var(--sub)}
.abc-pic{grid-area:pic;font-size:5rem;line-height:1}
.abc-word{grid-area:word;font-size:2.2rem}
.abc-word b{color:var(--no)}
.spk{grid-area:spk;justify-self:center;padding:.5rem 1.4rem;border-radius:999px;background:var(--hi);color:#3A2E1A;font-size:1.15rem}
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.6rem,1fr));gap:8px;margin-top:14px}
.abc-tile{padding:.5rem 0;font-size:1.45rem;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.abc-tile.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.4rem,1fr));gap:10px}
.wcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow)}
.wcard.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.08)}}
.ww{font-size:1.45rem}
.wk{font-size:.95rem;color:var(--sub)}
.emo{font-size:3rem;line-height:1.1}
.num{font-size:2.8rem;line-height:1.1}
.sw{width:3rem;height:3rem;border-radius:50%;border:3px solid var(--ink);display:inline-block}

.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--sub)}
.replay{display:block;margin:4px auto 16px;width:6rem;height:6rem;border-radius:50%;background:var(--hi);font-size:2.8rem;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px;margin:12px auto 0}
.choice{padding:16px 6px;border-radius:18px;background:var(--paper);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:6.2rem;justify-content:center}
.choice .emo{font-size:3.4rem}
.choice.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.choice.no{opacity:.35}
.choice .en{font-size:1.5rem}
.readpic{text-align:center;margin:0 0 14px}
.readpic .emo{font-size:6rem}.readpic .num{font-size:5.5rem}.readpic .sw{width:6rem;height:6rem}
.choices.words{grid-template-columns:1fr}
.choices.words .choice{min-height:0;padding:12px}
.choices.words .en{font-size:1.8rem}
.ph-hero{text-align:center}
.ph-eq{font-size:3.4rem;line-height:1.2}
.ph-eq small{font-size:.45em;color:var(--sub)}
.ph-ko{font-size:1.7rem;margin:2px 0 6px}
.ph-tip{font-size:.95rem;color:var(--sub);margin:6px 0 0}
.c-con{color:var(--accent)}
.c-vow{color:var(--no)}
body[data-theme="chalk"] .c-con{color:#9FD3FF}
.choices.short .choice{min-height:4rem;padding:10px 6px}

/* ───── 한자 ───── */
.era-line{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px}
.era{display:flex;align-items:center;gap:5px;padding:.35rem .75rem;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-size:.95rem;white-space:nowrap}
.era span{display:inline-flex;align-items:center;justify-content:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--line);font-size:.8rem}
.era.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.era.on span{background:var(--accent-ink);color:var(--accent)}
.hs-hero{text-align:center}
.hs-emo{font-size:4rem;line-height:1.1}
.hs-t{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw);font-size:1.9rem;margin-top:4px}
.hs-y{display:inline-block;margin-top:4px;padding:.1rem .7rem;border-radius:999px;background:color-mix(in srgb,var(--hi) 35%,var(--paper));font-size:.95rem}
.hs-d{font-size:1.15rem;line-height:1.6;margin:10px 0 12px}
.hs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:8px;margin-top:12px}
.hs-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:.95rem}
.hs-tile span{font-size:1.8rem}
.hs-tile.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.hs-q{font-size:1.25rem;line-height:1.6}
.hs-qd{background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;text-align:left}
.hs-qe{font-size:3.4rem;line-height:1.1}
.hs-ch .ct{font-size:1.3rem}
.exam-info p{margin:.4rem 0}
.exam-info .tbl{margin:8px 0}
.exam-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.note-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px dashed var(--line)}
.note-e{font-size:2rem;line-height:1}
.lesson{margin-bottom:12px}
.lesson p{margin:.45rem 0;line-height:1.6;font-size:1.1rem}
.ls-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ls-top b{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw);font-size:1.3rem}
.ls-spk{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--hi);font-size:1.1rem}
.ls-big{text-align:center;font-size:1.5rem;line-height:1.6;margin:8px 0;padding:8px;border-radius:14px;background:var(--paper);border:2px dashed var(--line)}
.ls-big u{color:var(--no);text-decoration:none;font-weight:bold}
.ls-clock .clock{width:10rem;height:10rem;margin:0 auto}
.dan{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0;text-align:center;font-size:1.15rem}
.dan span{padding:6px;border-radius:10px;background:var(--paper);border:2px solid var(--line)}
.lesson .tbl{margin:8px auto}
.ko-q{font-size:1.35rem;line-height:1.7}
.ko-q ~ .choices .ct{font-size:1.1rem;line-height:1.4}
.ko-q ~ .choices.words .choice{padding:10px 12px}
.ko-para{text-align:left;font-size:1.1rem;line-height:1.7;background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.lvtabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lvtab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:18px;background:var(--card);border:3px solid var(--line);box-shadow:var(--shadow)}
.lvtab b{font-weight:var(--tw);font-family:var(--font-t),var(--font),'Jua',sans-serif;font-size:1.6rem;line-height:1.1}
.lvtab small{color:var(--sub);font-size:.85rem}
.lvtab.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.lvtab.on b{color:var(--accent)}
.hj-hero{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;text-align:center}
.hj-big{font-size:7rem;line-height:1}
.hj-mean{font-size:2.3rem}
.hj-hero .spk{margin-top:8px}
.hj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.6rem,1fr));gap:8px;margin-top:14px}
.hj-tile{padding:.35rem 0;font-size:1.9rem;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.hj-tile.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hj-q{font-size:6.5rem;text-align:center;line-height:1.1;margin:0 0 6px}
.hj-qm{font-size:2.4rem;text-align:center;margin:0 0 4px}
.choice .hanja{font-size:3.2rem;line-height:1.1}
.choice .ct.km{font-size:1.6rem}

/* ───── 스티커 ───── */
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2rem,1fr));gap:10px;margin-top:14px}
.stk{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:var(--paper);border:3px solid var(--hi)}
.stk.empty{border:3px dashed var(--line);color:var(--line);font-size:1.4rem}

/* ───── 설정 / 관리자 ───── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 8px;font-weight:normal;font-size:1.4rem}
.lbl{margin:14px 0 6px;color:var(--sub)}
.danger{margin-top:18px;color:var(--no);text-decoration:underline;font-size:.95rem}
.linkbtn{margin-top:16px;color:var(--sub);text-decoration:underline;font-size:.95rem}
.pinrow{display:flex;justify-content:center;gap:14px;margin:14px 0 4px}
.pinrow span{width:20px;height:20px;border-radius:50%;border:3px solid var(--sub)}
.pinrow span.f{background:var(--accent);border-color:var(--accent)}
.scroll-x{overflow-x:auto}
.logtbl{width:100%;min-width:420px;font-size:.92rem;margin:0}
.logtbl td.z{color:var(--line)}
.logtbl tr.today td,.logtbl tr.today th{background:color-mix(in srgb,var(--hi) 20%,transparent)}
.inrow{display:flex;gap:6px}
.inrow input{flex:1;min-width:0;font:inherit;padding:.45rem .7rem;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.inrow .pill{flex:none}

.grade-o{position:fixed;left:50%;top:42%;width:10rem;height:10rem;margin:-5rem 0 0 -5rem;border:13px solid #E5484D;border-radius:50%;z-index:45;pointer-events:none;animation:oPop .9s ease-out forwards}
@keyframes oPop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.06);opacity:.95}75%{transform:scale(1);opacity:.9}100%{opacity:0}}
.skipbtn{display:block;margin:12px auto 0;padding:.45rem 1.1rem;border-radius:999px;border:2px dashed var(--line);background:var(--paper);color:var(--sub);font-size:1rem}
.adminbtn{margin-top:18px;padding:.45rem 1.1rem;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--sub);font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:999px;z-index:60;font-size:1.1rem;white-space:nowrap}
.burst{position:fixed;pointer-events:none;font-size:2rem;z-index:40;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}

@media (max-width:520px){
  header{padding-left:22px}
  main{padding-left:22px;padding-right:76px}
  .dock{top:150px;right:8px;gap:6px}
  .dock-t{width:60px;padding:6px 2px;border-radius:14px}
  .dock-t b{font-size:1.05rem}
  .dk-ico{font-size:1.3rem}
  body[data-theme="note"]::before{left:12px}
  h1{font-size:1.1rem}
  .grade a{padding:.3rem .6rem}
  html{font-size:calc(15px * var(--size) * min(var(--fsc),1.1))}
  header{position:static;padding-top:6px;padding-bottom:6px}
  .dchip{font-size:.74rem;padding:.15rem .45rem}
  .dchip i{display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .tab{padding:.35rem .1rem;font-size:.84rem;border-radius:12px;overflow:hidden;text-overflow:ellipsis}
  main{padding-top:10px}
  .card{padding:14px}
  .vgrid{grid-template-columns:1.8rem repeat(3,3.3rem);background-size:3.3rem 3.3rem;background-position:1.8rem 0;padding:4px 6px 6px}
  .dg{font-size:2.3rem;height:3.2rem}
  .dg.op{font-size:2rem}
  .cell{width:2.8rem;height:3.1rem;font-size:2.1rem;border-width:2px}
  .cell.carry{width:2rem;height:2.2rem;font-size:1.4rem}
  .hint{margin-top:6px;min-height:2.4em;font-size:1.05rem}
  .hq{font-size:2.1rem}
  .keypad{gap:6px;margin-top:10px}
  .key{padding:.4rem 0;font-size:1.6rem}
  .sq .clock{width:9rem;height:9rem}
  .choice{min-height:4.6rem;padding:10px 6px}
  .choice .emo{font-size:2.8rem}
  .hj-q{font-size:5rem}
  .hj-big{font-size:5.5rem}
  .replay{width:4.8rem;height:4.8rem;font-size:2.2rem}
  .bn-btns{gap:4px}
  .bn-btns .pill{font-size:.85rem;padding:.3rem .6rem}
  .bn-p{font-size:1.35rem}
  .subjects{gap:8px}
  .subj{padding:12px}
  .subj .ico{font-size:2rem}
  .subj b{font-size:1.25rem}
  .subj small{font-size:.82rem}
  .clocktile .clock{width:4.2rem;height:4.2rem}
  .clocktile .bigtime{font-size:1.05rem}
  .clock{width:6rem;height:6rem}
  .bigtime{font-size:1.7rem}
  .sq{font-size:1.3rem}
  .gtbl td{width:2.8rem}
}
/* 이메일 · 비밀번호 칸은 테마(칠판 등)나 자동 완성과 상관없이 흰 바탕에 검은 글씨로 */
.pinbox{-webkit-text-security:disc;text-security:disc}
input.pinbox,input[type=email],input[type=password]{background:#fff!important;color:#1F3354!important;-webkit-text-fill-color:#1F3354!important;caret-color:#1F3354}
input[type=email]:-webkit-autofill,input[type=password]:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #fff inset!important;-webkit-text-fill-color:#1F3354!important}
/* 과목 골고루: 최근 7일 과목별 문제 수 */
.balcard{margin-top:12px}
.bal-wrap{overflow-x:auto;margin:0 -4px}
.bal{width:100%;border-collapse:collapse;text-align:center}
.bal th{font-weight:normal;color:var(--sub);padding:2px 1px;font-size:.78rem;line-height:1.15}
.bal th small{display:block;font-size:.7rem}
.bal th.today{color:var(--accent)}
.bal .bal-s{text-align:left;white-space:nowrap;color:var(--ink);font-size:.9rem;padding-right:6px}
.bal .bal-s .hanja{font-size:1em}
.bal td{padding:2px 1px}
.bal td>span{display:flex;align-items:center;justify-content:center;min-width:1.6rem;height:1.6rem;border-radius:7px;font-size:.78rem;color:var(--ink)}
.bal .bal-t{font-size:.85rem;color:var(--sub)}
.bal .l0,.bal-dots .l0{background:color-mix(in srgb,var(--line) 55%,transparent)}
.bal .l1,.bal-dots .l1{background:color-mix(in srgb,var(--ok) 25%,var(--paper))}
.bal .l2,.bal-dots .l2{background:color-mix(in srgb,var(--ok) 45%,var(--paper))}
.bal .l3,.bal-dots .l3{background:color-mix(in srgb,var(--ok) 70%,var(--paper))}
.bal .l4,.bal-dots .l4{background:var(--ok);color:#fff}
.subj-today{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:.85rem;color:var(--sub);margin-top:2px}
.subj-today b{font-size:.95rem!important;color:var(--ink)}
.bal-dots{display:inline-flex;gap:3px}
.bal-dots i{width:10px;height:10px;border-radius:3px}
.bal-dots i.today{outline:2px solid var(--accent);outline-offset:1px}
/* 한 과목 100문제 완주 축하 */
.closed .cel-emo{font-size:4.6rem;line-height:1.1;display:inline-block;animation:celBounce 1s ease-in-out infinite}
.cel-row{font-size:2rem;letter-spacing:.2em;margin:4px 0 8px}
.closed .praise{font-size:1.9rem;margin:4px 0}
@keyframes celBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.1)}}
.rain{position:fixed;top:-3rem;z-index:45;pointer-events:none;animation:rainFall 2.8s ease-in forwards}
@keyframes rainFall{to{transform:translateY(112vh) rotate(360deg)}}
/* 국어 글 읽기 · 독서 기록 · 영어 이야기 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:10px}
.book{text-align:left;display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);position:relative}
.book .bk-e{font-size:2.2rem;line-height:1.1}
.book b{font-weight:normal;font-size:1.12rem}
.book small{color:var(--sub);font-size:.85rem}
.book .done{position:absolute;top:8px;right:10px;font-size:.9rem;color:var(--ok)}
.book.read{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.kr-next{display:flex;align-items:center;gap:12px;text-align:left;width:100%;margin-top:4px}
.kr-next .bk-e{font-size:2.6rem}
.kr-page .kr-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.kr-page .kr-top .bk-e{font-size:2.6rem;line-height:1}
.kr-page .kr-top b{flex:1;font-weight:normal;font-size:1.45rem}
.kr-page p{font-size:1.22rem;line-height:1.9;margin:.5rem 0;text-indent:.6em;word-break:keep-all}
.est{text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--hi) 18%,var(--card)),var(--card))}
.est-cover{font-size:.95rem;color:var(--sub)}
.est-title{font-size:1.6rem;margin:2px 0 4px}
.est-pic{font-size:4.6rem;line-height:1.2;margin:6px 0;letter-spacing:.04em}
.est-en{display:block;width:100%;font-size:1.7rem;line-height:1.35;padding:10px 12px;border-radius:16px;background:var(--paper);border:2px dashed var(--accent);margin:4px 0 8px}
.est-en span{font-size:1.1rem}
.est-ko{min-height:2.6rem;font-size:1.2rem;margin-bottom:8px}
.est-words{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:10px}
.est-w{padding:.3rem .7rem;border-radius:999px;background:color-mix(in srgb,var(--hi) 35%,var(--paper));border:2px solid var(--line);font-size:1rem}
.est-w .en{font-size:1.1rem;margin-right:4px}
.est-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.est-dots{display:flex;gap:5px;justify-content:center}
.est-dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.est-dots span.on{background:var(--accent)}
.est-q{font-size:2.2rem;margin:6px 0}
/* 쉬어가는 코너 탭 · 여행 표현 */
.bn-tabs{display:flex;gap:4px;flex-wrap:wrap}
.bn-tabs .pill{font-size:.82rem;padding:.2rem .6rem}
.bn-read{text-align:center;font-size:1.05rem;color:var(--accent);margin:0 0 2px}
/* 오늘 날씨 · 시간 */
.wx{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;margin-bottom:12px}
.wx-time{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.wx-date{color:var(--sub);font-size:.92rem}
.wx-now{display:flex;align-items:center;gap:10px;justify-content:flex-end;text-align:right}
.wx-ico{font-size:2.8rem;line-height:1}
.wx-t{font-size:1.6rem;line-height:1.1}
.wx-sub{color:var(--sub);font-size:.85rem}
.wx-tip{grid-column:1/-1;text-align:center;font-size:.98rem;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--hi) 22%,var(--paper))}
.wx-loc{background:none;border:none;color:var(--sub);text-decoration:underline;font-size:.78rem;padding:0}
@media (max-width:520px){ .wx-time{font-size:1.7rem} .wx-ico{font-size:2.2rem} .wx-t{font-size:1.3rem} }
/* 명작 도서관 · 책장으로 버튼 */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:.55rem 1.2rem;border-radius:999px;background:var(--accent);color:#fff;border:none;box-shadow:var(--shadow);font-size:1.1rem;font-family:var(--font-t),var(--font),'Jua',sans-serif}
.back-row{display:flex;justify-content:center;margin:12px 0 4px}
.back-row.top{justify-content:flex-start;margin:0 0 8px}
.lib-tile{margin-top:12px;width:100%;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--hi) 30%,var(--card)),var(--card))}
.lib-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:10px}
.lib-book{text-align:left;display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);position:relative}
.lib-book .bk-e{font-size:2.3rem;line-height:1.1}
.lib-book b{font-weight:normal;font-size:1.12rem}
.lib-book small{color:var(--sub);font-size:.82rem}
.lib-book .done{position:absolute;top:8px;right:10px;font-size:.9rem;color:var(--ok)}
.lib-book.read{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.lib-page{text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--hi) 16%,var(--card)),var(--card))}
.lib-by{font-size:.9rem;color:var(--sub)}
.lib-title{font-size:1.6rem;margin:2px 0 4px}
.lib-pic{font-size:4.4rem;line-height:1.2;margin:6px 0;letter-spacing:.04em}
.lib-text{font-size:1.28rem;line-height:1.9;text-align:left;margin:8px 4px 12px;min-height:7em;word-break:keep-all}
.lib-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lib-dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.lib-dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.lib-dots span.on{background:var(--accent)}
/* 관리자 대시보드 팝업 */
.admpop{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:2vh 2vw}
.admpop[hidden]{display:none}
.admpop-box{width:100%;max-width:1100px;height:100%;background:var(--bg);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.admpop-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:2px solid var(--line);background:var(--paper)}
.admpop-bar b{flex:1;font-weight:normal;font-size:1.15rem;font-family:var(--font-t),var(--font),'Jua',sans-serif}
.admpop-box iframe{flex:1;width:100%;border:0;background:var(--bg)}
@media (max-width:520px){ .admpop{padding:0} .admpop-box{border-radius:0} }
/* 관리자 모드 제목 옆 '전체 관리자' 바로가기 */
.adm-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.adm-head h3{margin:0;flex:1}
.adm-all{padding:.55rem 1.1rem;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:1.05rem;box-shadow:0 3px 0 rgba(0,0,0,.2);font-family:var(--font-t),var(--font),'Jua',sans-serif;white-space:nowrap}
.adm-all:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
/* 화면 아래 이용약관 · 개인정보처리방침 */
.legal{max-width:780px;margin:0 auto;padding:4px 12px 28px;text-align:center;font-size:.82rem;color:var(--sub)}
.legal a{color:var(--sub)}
/* 쉬어가는 코너 세 박스 · 오른쪽 날씨 타일 */
.bn-head{font-size:1.15rem;margin:4px 2px 8px}
.bn-row{margin-bottom:10px}
.dock-t.dk-wx small{white-space:nowrap}
.wx-pop .wx{margin:10px 0}
.lib-sec{font-size:1.2rem;margin:16px 2px 8px}
.lib-sec small{font-size:.85rem;color:var(--sub)}
.lib-body{text-align:left;margin:10px 2px 14px}
.lib-body p{font-size:1.2rem;line-height:1.95;margin:.7rem 0;word-break:keep-all}
.lib-em{margin-right:6px;font-size:1.25rem}
.lib-spk{border:none;background:none;font-size:.95rem;padding:0 2px;opacity:.65;vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ═════════ 새 디자인 (다섯 방 공통 · 이 블록은 다섯 방에 똑같이) ═════════
   디자인 2개: clean(깔끔 · 흰 카드) · bright(산뜻 · 과목 색 카드)
   글씨 2개: f1 또박(G마켓 산스 + 온글잎 윤탱체) · f2 산들(G마켓 산스 제목 + 카페24 아네모네 에어 본문 + 오뮤 다예쁨체) */
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff');font-weight:300;font-display:swap}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'OwnglyphYuntaeng';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/온글잎 윤탱체.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'OmuDaye';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-01@1.0/omyu_pretty.woff2') format('woff2');font-weight:normal;font-display:swap}
/* 아네모네 에어에는 · × ÷ ° ① → 같은 기호가 비어 있어요: 한글 · 영문 · 숫자만 쓰고 나머지는 G마켓 산스로 */
@font-face{font-family:'Cafe24AnemoneAir';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2202@1.0/Cafe24Ohsquareair.woff') format('woff');font-weight:normal;font-display:swap;unicode-range:U+0020-007E,U+2018-201D,U+2026,U+3131-318E,U+AC00-D7A3}

body[data-theme="clean"]{--bg:#F4F6FA;--paper:#FFFFFF;--card:#FFFFFF;--ink:#16213A;--sub:#6B7589;--line:#E3E8F0;--accent:#1F4FD8;--accent-ink:#FFFFFF;--soft:#EAF0FE;--hi:#FFC53D;--ok:#12A37A;--no:#E5484D;--carry:#E5484D;--shadow:0 1px 2px rgba(22,33,58,.04),0 6px 16px rgba(22,33,58,.06);--rad:16px}
body[data-theme="bright"]{--bg:#FFFFFF;--paper:#FFFFFF;--card:#F5F6F9;--ink:#1B1F2E;--sub:#6D7385;--line:#E4E7EE;--accent:#FF6A3D;--accent-ink:#FFFFFF;--soft:#FFEFE8;--hi:#FFC53D;--ok:#12A37A;--no:#E5484D;--carry:#E5484D;--shadow:none;--rad:22px}
/* 과목 색 */
[data-v="korean"]{--c:#E8604C}
[data-v="school"]{--c:#2F7BE5}
[data-v="math"]{--c:#0FA3B1}
[data-v="eng"]{--c:#7A5AF0}
[data-v="hanja"]{--c:#12A38A}
[data-v="history"]{--c:#E39A1B}
[data-v="social"]{--c:#D6457F}
[data-v="science"]{--c:#1F9D6B}
.sico{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}

/* ── 상단 바 ── */
header{background:var(--paper);border-bottom:1px solid var(--line);padding:0 16px}
.toprow{min-height:60px;gap:10px}
h1{flex:1;display:flex;align-items:center;gap:10px;text-align:left;font-size:1.12rem;font-weight:var(--tw);min-width:0}
h1 button{font-weight:inherit;min-width:0}
h1 button::after{color:var(--sub)}
.logo-m{flex:none;width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px}
body[data-theme="bright"] .logo-m{border-radius:11px;background:linear-gradient(135deg,#FF8A4C,#FF5A5F)}
.decobar{margin:0;max-width:none;flex:none;gap:8px;justify-content:flex-end;overflow:visible}
.dseg{display:flex;align-items:center;padding:3px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.dseg-l{font-size:.7rem;color:var(--sub);padding:0 5px 0 6px;white-space:nowrap}
.dchip,.dchip.on{border:0;padding:.3rem .7rem;border-radius:7px;background:transparent;font-size:.8rem;color:var(--sub);font-family:var(--font-t),var(--font),sans-serif;font-weight:var(--tw)}
.dchip.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(22,33,58,.14)}
body[data-theme="bright"] .dseg{border-radius:999px;background:#F1F2F6;border-color:transparent}
body[data-theme="bright"] .dchip{border-radius:999px}
body[data-theme="bright"] .dchip.on{background:var(--ink);color:#fff;box-shadow:none}
.starbox{display:flex;align-items:center;gap:6px;height:36px;padding:0 13px;border:0;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.95rem;font-family:var(--font-t),var(--font),sans-serif;font-weight:var(--tw)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--sub);display:grid;place-items:center;font-size:17px}
.iconbtn:hover{color:var(--ink)}
.tabs{gap:2px;margin-top:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab,.tab.on{flex:none;padding:.72rem .95rem .66rem;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;font-size:.98rem;color:var(--sub)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
body[data-theme="bright"] .tabs{gap:4px;padding:6px 0 10px}
body[data-theme="bright"] .tab,body[data-theme="bright"] .tab.on{border:0;border-radius:999px;padding:.5rem 1rem}
body[data-theme="bright"] .tab.on{background:var(--ink);color:#fff}

/* ── 카드 · 버튼 ── */
main{padding-left:12px}
.card,.subj,.who,.sea,.dock-t,.wcard,.lvtab,.book,.lib-book,.sent-card,.hs-tile{border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow)}
body[data-theme="bright"] :is(.card,.subj,.who,.sea,.dock-t,.wcard,.lvtab,.book,.lib-book,.sent-card,.hs-tile){border-color:transparent}
.sent-card.q{border-left:5px solid var(--accent)}
.sent-card.a{border-left:5px solid var(--ok)}
.pill{border:1.5px solid var(--line);background:var(--paper)}
.pill.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
body[data-theme="bright"] .pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.big-btn{border-radius:14px;font-size:1.18rem;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 26%,transparent)}
.big-btn:active{transform:scale(.98);box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 26%,transparent)}
body[data-theme="bright"] .big-btn{border-radius:999px}
.key{border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:none}
.choice{border-width:2px;border-radius:16px}
.lvtab{border-width:2px}
.lvtab.on{border-color:var(--accent);background:var(--soft)}
.abc-tile,.hj-tile,.era,.unit-tag,.tile{border-width:1.5px}
.tile{box-shadow:0 2px 0 var(--line)}
.spk,.ls-spk{background:var(--soft);color:var(--accent)}
.replay{background:var(--soft);box-shadow:none}
.adminbtn,.skipbtn{border:1px solid var(--line)}
.sheet{border-radius:22px 22px 0 0}
.toast{box-shadow:0 10px 30px rgba(0,0,0,.18)}
.msg{background:var(--soft);border-color:transparent}

/* ── 홈: 인사 · 과목 카드 ── */
.hello .big{font-size:1.6rem}
.goal{height:10px;background:color-mix(in srgb,var(--line) 80%,transparent)}
.goal i{background:var(--accent)}
body[data-theme="bright"] .hello{background:linear-gradient(120deg,#FFE7DB,#FFF4D6)}
body[data-theme="bright"] .hello .goal{background:rgba(255,255,255,.8)}
.subj{position:relative;overflow:hidden;padding:18px;gap:5px}
.subj .ico{width:2.75rem;height:2.75rem;margin-bottom:6px;border-radius:12px;display:grid;place-items:center;font-size:1.45rem;line-height:1;background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--paper));color:var(--c,var(--accent))}
.subj .ico .hanja{font-size:1.35rem}
.subj b{font-size:1.25rem;font-weight:var(--tw)}
.subj small{font-size:.86rem}
.subj .bal-dots .l1{background:color-mix(in srgb,var(--c,var(--ok)) 30%,var(--paper))}
.subj .bal-dots .l2{background:color-mix(in srgb,var(--c,var(--ok)) 55%,var(--paper))}
.subj .bal-dots .l3{background:color-mix(in srgb,var(--c,var(--ok)) 78%,var(--paper))}
.subj .bal-dots .l4{background:var(--c,var(--ok))}
.subj .bal-dots i.today{outline-color:var(--c,var(--accent))}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"]){background:var(--c);color:#fff;box-shadow:0 10px 22px color-mix(in srgb,var(--c) 28%,transparent)}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"])::after{content:"";position:absolute;right:-34px;bottom:-44px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"]) :is(small,.subj-today){color:rgba(255,255,255,.88)}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"]) .subj-today b{color:#fff}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"]) .ico{background:rgba(255,255,255,.22);color:#fff}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"]) .bal-dots i{background:rgba(255,255,255,.25)}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"]) .bal-dots :is(.l1,.l2,.l3,.l4){background:#fff}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"]) .bal-dots .l1{opacity:.5}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"]) .bal-dots .l2{opacity:.7}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"]) .bal-dots .l3{opacity:.85}
body[data-theme="bright"] .subj:is([data-v="korean"],[data-v="school"],[data-v="math"],[data-v="eng"],[data-v="hanja"],[data-v="history"],[data-v="social"],[data-v="science"]) .bal-dots i.today{outline-color:#fff}

/* ── 오른쪽 타일 ── */
.dock-t{border-radius:16px;padding:11px 4px}
.dock-t b{font-weight:var(--tw)}

@media (max-width:520px){
  header{padding:0 10px}
  .toprow{flex-wrap:wrap;min-height:0;padding:8px 0 4px;gap:8px}
  h1{font-size:1rem;gap:8px}
  .logo-m{width:28px;height:28px;border-radius:8px}
  .decobar{order:3;width:100%;justify-content:center}
  .dchip,.dchip.on{padding:.26rem .6rem;font-size:.76rem}
  .starbox{height:32px;padding:0 10px}
  .iconbtn{width:32px;height:32px}
  .tabs{display:flex}
  .tab,.tab.on{padding:.6rem .7rem .55rem;font-size:.9rem}
  main{padding-left:10px}
  .subj .ico{width:2.3rem;height:2.3rem;font-size:1.2rem}
  .subj b{font-size:1.1rem}
}
/* 쉬어가는 코너: 속담(미색) · 여행 일본어(분홍) · 여행 영어(하늘) */
.rc{margin-top:26px}
.rc-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0 2px 12px}
.rc-head b{font-family:var(--font-t),var(--font),sans-serif;font-weight:var(--tw);font-size:1.2rem}
.rc-head span{font-size:.85rem;color:var(--sub)}
.rc-card{position:relative;overflow:hidden;padding:18px 20px;border-radius:var(--rad);background:var(--rc-bg);border:1px solid var(--rc-line)}
.rc-prov{--rc-bg:#FFF8EA;--rc-line:#F2E2BF;--rc-c:#B7791F}
.rc-ja{--rc-bg:#FFF3F4;--rc-line:#F7D8DD;--rc-c:#D6435A}
.rc-en{--rc-bg:#F1F5FF;--rc-line:#D8E2FA;--rc-c:#2F66D8}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc-chip{display:inline-flex;align-items:center;gap:6px;padding:.24rem .65rem;border-radius:999px;background:#fff;border:1px solid var(--rc-line);color:var(--rc-c);font-size:.78rem;font-family:var(--font-t),var(--font),sans-serif;font-weight:var(--tw);white-space:nowrap}
.rc-chip i{width:6px;height:6px;border-radius:50%;background:var(--rc-c)}
.rc-nav{display:flex;align-items:center;gap:2px;font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums}
.rc-nav span{min-width:3.6em;text-align:center}
.rc-nav button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--rc-line);color:var(--rc-c);font-size:15px}
.rc-q{position:relative;margin:16px 0 4px;padding-left:36px;font-family:var(--font-p),var(--font),sans-serif;font-weight:normal;font-size:1.9rem;line-height:1.3;color:var(--ink);word-break:keep-all}
.rc-q::before{content:"\201C";position:absolute;left:0;top:-.28em;font-family:Georgia,'Times New Roman',serif;font-size:3.4rem;line-height:1;color:var(--rc-c);opacity:.4}
.rc-m{padding-left:36px;color:var(--sub);font-size:.98rem;line-height:1.55}
.rc-ex{margin:12px 0 0 36px;padding:10px 13px;border-radius:12px;background:#fff;border:1px dashed var(--rc-line);font-size:.92rem;line-height:1.6}
.rc-ex b{display:block;margin-bottom:2px;font-size:.74rem;color:var(--rc-c);font-family:var(--font-t),var(--font),sans-serif;font-weight:var(--tw)}
.rc-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.rc-prov .rc-acts{padding-left:36px}
.rc-act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--rc-line);color:var(--ink);font-size:.86rem;font-family:var(--font-t),var(--font),sans-serif;font-weight:var(--tw)}
.rc-act.main{background:var(--rc-c);border-color:var(--rc-c);color:#fff}
.rc-act:active,.rc-nav button:active{transform:scale(.95)}
.rc-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rc-pair .rc-card{display:flex;flex-direction:column}
.rc-pair .rc-acts{margin-top:auto;padding-top:14px}

koAdd(KO_MAIN, [['봄이 오면 여러 가지 꽃이 피어요.',['개나리가 노랗게 피어요.','진달래가 분홍빛으로 피어요.','벚꽃이 하얗게 피어요.']],['여름에는 더위를 이기는 방법이 많아요.',['수박을 먹어요.','바다에서 수영을 해요.','부채질을 해요.']],
  ['가을은 곡식과 열매가 익는 계절이에요.',['벼가 누렇게 익어요.','사과가 빨갛게 익어요.','밤송이가 벌어져요.']],['우리 몸에는 여러 감각 기관이 있어요.',['눈으로 보아요.','귀로 들어요.','코로 냄새를 맡아요.']],
  ['도서관에서는 지켜야 할 약속이 있어요.',['조용히 말해요.','뛰지 않아요.','책을 제자리에 꽂아요.']],['바다에는 여러 동물이 살아요.',['고래가 헤엄쳐요.','문어가 바위 틈에 숨어요.','불가사리가 바닥에 붙어 있어요.']],

  ['아침밥을 먹으면 좋은 점이 있어요.',['공부에 집중이 잘돼요.','힘이 나요.','점심때까지 배가 든든해요.']],['비가 오는 날에는 조심해야 해요.',['길이 미끄러워요.','우산을 꼭 챙겨요.','웅덩이를 피해 걸어요.']],

  ['추석에는 온 가족이 모여요.',['송편을 빚어요.','차례를 지내요.','보름달을 보며 소원을 빌어요.']],['책을 읽으면 좋은 점이 많아요.',['새로운 낱말을 알게 돼요.','상상력이 커져요.','재미있는 이야기를 만나요.']],

  ['동물들은 저마다 사는 곳이 달라요.',['물고기는 물속에 살아요.','새는 나무 위에 살아요.','두더지는 땅속에 살아요.']],['탈것에는 여러 가지가 있어요.',['땅에서는 자동차를 타요.','하늘에서는 비행기를 타요.','바다에서는 배를 타요.']],
  ['교실을 깨끗하게 해야 해요.',['쓰레기를 주워요.','책상을 정리해요.','바닥을 쓸어요.']],['손을 자주 씻어야 해요.',['병균이 없어져요.','감기에 덜 걸려요.','음식을 깨끗하게 먹을 수 있어요.']],
  ['우리 반 친구들은 좋아하는 운동이 달라요.',['민수는 축구를 좋아해요.','지아는 줄넘기를 좋아해요.','현우는 수영을 좋아해요.']],['시장에는 여러 가게가 있어요.',['생선 가게가 있어요.','과일 가게가 있어요.','떡집이 있어요.']],

  ['겨울에는 몸을 따뜻하게 해야 해요.',['목도리를 둘러요.','장갑을 껴요.','두꺼운 외투를 입어요.']],['캠핑을 가면 할 일이 많아요.',['텐트를 쳐요.','밥을 지어요.','밤하늘의 별을 봐요.']],
  ['학교에서는 여러 과목을 배워요.',['국어 시간에 글을 읽어요.','수학 시간에 셈을 해요.','음악 시간에 노래를 불러요.']],['생일 파티는 즐거워요.',['케이크에 촛불을 켜요.','생일 노래를 불러요.','선물을 받아요.']],
  ['비행기는 편리한 탈것이에요.',['먼 곳까지 빨리 가요.','바다 건너 다른 나라에 가요.','많은 사람을 태워요.']],['물건을 아껴 써야 해요.',['연필을 끝까지 써요.','종이를 양면으로 써요.','망가진 장난감을 고쳐 써요.']],
  ['동물원에는 여러 동물이 있어요.',['사자가 낮잠을 자요.','기린이 나뭇잎을 먹어요.','원숭이가 나무를 타요.']],['식물은 생김새가 여러 가지예요.',['선인장은 가시가 있어요.','연꽃은 물 위에 떠 있어요.','해바라기는 키가 커요.']],
  ['밤하늘에는 볼 것이 많아요.',['달이 떠 있어요.','별이 반짝여요.','가끔 별똥별도 떨어져요.']],['불이 나면 이렇게 해야 해요.',['“불이야!” 하고 크게 외쳐요.','젖은 수건으로 입과 코를 막아요.','몸을 낮추고 밖으로 나가요.']],
  ['집안일을 도울 수 있어요.',['빨래를 개요.','신발을 정리해요.','수저를 놓아요.']],['우리 동네 도서관은 좋은 곳이에요.',['책을 빌릴 수 있어요.','조용히 공부할 수 있어요.','재미있는 행사도 열려요.']],
  ['개구리는 자라면서 모습이 바뀌어요.',['처음에는 알이에요.','알에서 올챙이가 나와요.','올챙이에게 다리가 생겨 개구리가 돼요.']],['나비도 자라면서 모습이 바뀌어요.',['알에서 애벌레가 나와요.','애벌레가 번데기가 돼요.','번데기에서 나비가 나와요.']],
  ['과일은 색깔이 여러 가지예요.',['딸기는 빨간색이에요.','바나나는 노란색이에요.','포도는 보라색이에요.']],['우리 집에는 여러 방이 있어요.',['잠을 자는 침실이 있어요.','요리를 하는 부엌이 있어요.','씻는 욕실이 있어요.']],
  ['숲은 동물들의 집이에요.',['다람쥐가 도토리를 모아요.','딱따구리가 나무에 집을 지어요.','토끼가 풀숲에 숨어 살아요.']],['친구가 슬퍼할 때 도울 수 있어요.',['따뜻한 말을 건네요.','이야기를 들어 줘요.','꼭 안아 줘요.']],
  ['우리나라에는 사계절이 있어요.',['봄에는 꽃이 피어요.','여름에는 더워요.','겨울에는 눈이 와요.']],['텃밭에서 채소를 기를 수 있어요.',['상추를 심어요.','방울토마토를 길러요.','고추를 따요.']],
  ['운동회 날에는 여러 경기를 해요.',['달리기를 해요.','줄다리기를 해요.','공 굴리기를 해요.']],['박물관에서 지켜야 할 것이 있어요.',['전시물을 만지지 않아요.','뛰어다니지 않아요.','큰 소리로 떠들지 않아요.']],
  ['고양이는 재미있는 버릇이 있어요.',['상자 안에 들어가기를 좋아해요.','혀로 털을 핥아요.','기분이 좋으면 가르랑거려요.']],['소풍 가방에는 챙길 것이 많아요.',['도시락을 넣어요.','물병을 넣어요.','돗자리를 넣어요.']],
  ['물은 모양이 바뀌어요.',['얼면 얼음이 돼요.','끓으면 김이 돼요.','얼음이 녹으면 다시 물이 돼요.']],['버스를 탈 때 지켜야 할 약속이 있어요.',['줄을 서서 차례로 타요.','자리에 앉거나 손잡이를 잡아요.','큰 소리로 떠들지 않아요.']],
  ['공룡은 종류가 여러 가지예요.',['티라노사우루스는 고기를 먹었어요.','브라키오사우루스는 목이 길었어요.','트리케라톱스는 뿔이 세 개였어요.']],['거북은 신기한 동물이에요.',['등에 딱딱한 등딱지가 있어요.','아주 오래 살아요.','위험하면 머리를 등딱지 속에 넣어요.']],

function koDeck(key, arr){
  const D=store.get('kdeck',{}); let d=D[key];
  if(!d || d.n!==arr.length || !d.q || !d.q.length) d={n:arr.length, q:shuffle(arr.map((_,i)=>i))};

  return arr[i];
}

function burst(){
  const x=innerWidth/2, y=innerHeight/2.3;
  for(let i=0;i<12;i++){
    const s=document.createElement('span'); s.className='burst'; s.textContent=['⭐','✨','🌟'][i%3];
    const ang=Math.PI*2*i/12, r=110+Math.random()*60;
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.setProperty('--dx',Math.cos(ang)*r+'px'); s.style.setProperty('--dy',Math.sin(ang)*r+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000);
  }
}

let actx, actxRest;
function beep(ok){
  if(!settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    clearTimeout(actxRest);
    if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type='triangle'; o.connect(g); g.connect(actx.destination);
    if(ok){ o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+0.1); }
    else { o.frequency.setValueAtTime(240,t); o.frequency.setValueAtTime(180,t+0.12); }
    g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    o.start(t); o.stop(t+0.36);
    actxRest=setTimeout(()=>{ try{ if(actx) actx.suspend(); }catch(e){} },700);
  }catch(e){}
}
function soundOff(){ try{ clearTimeout(actxRest); if(actx){ actx.close(); actx=null; } if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }
let enVoice=null, koVoice=null;
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices();
  enVoice = vs.find(v=>v.lang==='en-US') || vs.find(v=>v.lang && v.lang.startsWith('en')) || null;
  koVoice = vs.find(v=>v.lang && v.lang.replace('_','-').startsWith('ko')) || null;
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text, lang='en'){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(lang==='ko'){ u.lang='ko-KR'; u.rate=0.85; if(koVoice) u.voice=koVoice; }
  else if(lang==='ja'){ u.lang='ja-JP'; u.rate=0.8; const jv=speechSynthesis.getVoices().find(v=>v.lang && v.lang.replace('_','-').startsWith('ja')); if(jv) u.voice=jv; }
  else { u.lang='en-US'; u.rate=0.8; if(enVoice) u.voice=enVoice; }
  speechSynthesis.speak(u);
}

    const add=n*(EV.mult||2); store.set('estars',eStars()+add); store.set('estarsAt',Date.now());

  if(n<=0) return;
  const k=dayKey(), sd=store.get('starDay',{}), got=sd.d===k ? sd.n : 0;

  stars+=n; store.set('stars',stars); store.set('starsAt',Date.now());
  const crossed=Math.floor(stars/10)-before, kd=store.get('stkDay',{}), sgot=kd.d===k?kd.n:0, give=Math.min(crossed, STICKER_DAY_MAX-sgot);

/* ───── 학습 기록 (날짜별 · 과목별: 푼 문제 n, 맞은 문제 ok) ───── */
function dayKey(t=new Date()){ return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; }
function getLog(name){ return store.get('log',{},name); }
function dayTotal(k=dayKey(), L=getLog()){ const d=L[k]||{}; return Object.values(d).reduce((a,e)=>a+e.n,0); }

/* ───── 공부 잔디: 접속한 날 + 푼 문제 수 ───── */
function markVisit(){ if(!who) return; const v=store.get('visits',{}); if(!v[dayKey()]){ v[dayKey()]=1; store.set('visits',v); } cloudPush(); }
function grassLevel(n, visited){
  if(!n) return visited ? 'v' : '';
  const g=admin.goal;
  return n>=g*2 ? 'g4' : n>=g ? 'g3' : n>=Math.ceil(g/2) ? 'g2' : 'g1';
}
/* 이번 달 공부 잔디: 한 칸 = 하루, 세로 한 줄 = 한 주. 색이 진할수록 많이 공부한 날 */
function grassHTML(name=who){
  const L=getLog(name), vis=store.get('visits',{},name);
  const today=new Date(); today.setHours(0,0,0,0);
  const y=today.getFullYear(), mo=today.getMonth();
  const first=new Date(y,mo,1), last=new Date(y,mo+1,0);
  const start=new Date(first); start.setDate(1-first.getDay());
  const end=new Date(last); end.setDate(last.getDate()+(6-last.getDay()));
  let cells='';
  for(const d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    if(d.getMonth()!==mo){ cells+='<span class="g out"></span>'; continue; }
    if(d>today){ cells+=`<span class="g fut" title="${d.getDate()}일"></span>`; continue; }
    const k=dayKey(d), n=dayTotal(k,L);
    cells+=`<button class="g ${grassLevel(n,vis[k])} ${k===dayKey()?'t':''}" data-act="grass" data-v="${k}" title="${d.getDate()}일 ${n}문제" aria-label="${mo+1}월 ${d.getDate()}일 ${n}문제"></button>`;
  }
  // 연속 접속일, 이번 달 공부한 날
  let streak=0; const c=new Date(today);
  while(vis[dayKey(c)]){ streak++; c.setDate(c.getDate()-1); }
  const ym=dayKey(today).slice(0,7);
  const studied=Object.keys(L).filter(k=>k.startsWith(ym) && dayTotal(k,L)>0).length;
  const goalDays=Object.keys(L).filter(k=>k.startsWith(ym) && dayTotal(k,L)>=admin.goal).length;
  return `<div class="grass-head"><b>🌱 ${mo+1}월 공부 잔디</b><span class="sub">🔥 ${streak}일 연속 · 공부한 날 ${studied}일 · 목표 달성 ${goalDays}일</span></div>
    <div class="grass-wrap"><div class="grass-d">${WD.map(w=>`<span>${w}</span>`).join('')}</div><div class="grass">${cells}</div></div>
    <div class="grass-leg">들어오기만 <span class="g v"></span> 조금 <span class="g g1"></span><span class="g g2"></span><span class="g g3"></span><span class="g g4"></span> 많이</div>`;
}

function logToday(s, ok){

/* ───── 시계 그림 ───── */
function clockSVG(h,m,s){
  let t='';
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30, b=i%5===0, r1=b?82:88;
    t+=`<line class="ck-tick${b?' b':''}" x1="${(Math.sin(a)*r1).toFixed(1)}" y1="${(-Math.cos(a)*r1).toFixed(1)}" x2="${(Math.sin(a)*93).toFixed(1)}" y2="${(-Math.cos(a)*93).toFixed(1)}"/>`;
  }
  for(let i=1;i<=12;i++){ const a=i*Math.PI/6; t+=`<text class="ck-num" x="${(Math.sin(a)*67).toFixed(1)}" y="${(-Math.cos(a)*67).toFixed(1)}">${i}</text>`; }
  const sec=s||0, ha=(h%12)*30+m*0.5+sec/120, ma=m*6+sec*0.1;
  return `<svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="${h%12||12}시 ${m}분"><circle class="ck-face" r="96"/>${t}
    <line class="ck-h" x1="0" y1="0" x2="0" y2="-46" transform="rotate(${ha})"/>
    <line class="ck-m" x1="0" y1="0" x2="0" y2="-74" transform="rotate(${ma})"/>
    ${s!==undefined?`<line class="ck-s" x1="0" y1="14" x2="0" y2="-82" transform="rotate(${s*6})"/>`:''}
    <circle class="ck-c" r="5"/></svg>`;
}
let lastDay = dayKey();
function tick(){
  try{ drawEvent(); }catch(e){}
  const t=new Date(), h=t.getHours(), m=t.getMinutes(), s=t.getSeconds();
  const ap=h<12?'오전':'오후', h12=h%12||12;
  const date=`${t.getFullYear()}년 ${t.getMonth()+1}월 ${t.getDate()}일 ${WD[t.getDay()]}요일`;
  document.getElementById('dkDate').textContent=`${t.getMonth()+1}/${t.getDate()}(${WD[t.getDay()]})`;
  document.getElementById('dkAp').textContent=ap;
  document.getElementById('dkTime').textContent=`${h12}:${pad(m)}`;
  const hc=document.getElementById('homeClock');
  if(hc){
    hc.innerHTML=clockSVG(h,m,s);
    document.getElementById('homeTime').textContent=`${ap} ${h12}시 ${m}분`;
    document.getElementById('homeDate').textContent=`${t.getMonth()+1}월 ${t.getDate()}일 ${WD[t.getDay()]}요일`;
  }
  if(dayKey()!==lastDay){ lastDay=dayKey(); markVisit(); if(App.view==='home') render(); }
}

/* ───── 온라인 저장 (Firebase Firestore) ─────
   아이 문서: { name, stars, starsAt, best_1~3, hmock, hwrong, hwrongAt, pinH, pinAt, updatedAt }
   설정 문서(e2/settings): { goal, subj, dans, msg, pinH, at }  ← 관리자 모드 설정 (모든 기기가 같이 써요)
   날짜 문서: { visited, total, math:{n,ok}, school:{n,ok}, eng:{n,ok}, hanja:{n,ok} }
   여러 기기에서 쓰면 날짜별 문제 수는 큰 쪽을, 별은 나중에 바뀐 쪽을 따라요. */
const cloud = { ready:null, db:null, ok:false };
function cloudInit(){
  if(!FIREBASE_CONFIG) return Promise.resolve(null);
  if(cloud.ready) return cloud.ready;
  const load=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  cloud.ready = load(base+'firebase-app-compat.js').then(()=>load(base+'firebase-firestore-compat.js')).then(()=>load(base+'firebase-auth-compat.js')).then(()=>{
    firebase.initializeApp(FIREBASE_CONFIG); cloud.db=firebase.firestore(); cloud.ok=true; return cloud.db;
  }).catch(e=>{ console.warn('온라인 저장을 쓸 수 없어요', e); return null; });
  return cloud.ready;
}
const kidRef = name => cloud.db && KID_IDS[name] ? cloud.db.collection(GRADE_ID).doc(KID_IDS[name]) : null;
const betterBest = (a,b) => !a ? b : !b ? a : (b.score>a.score || (b.score===a.score && b.sec<a.sec)) ? b : a;
async function cloudPull(name, docOnly){
  if(!KID_IDS[name] || !await cloudInit()) return false;
  try{
    const ref=kidRef(name), snap=await ref.get();
    if(snap.exists){
      const d=snap.data();
      // 관리자(대시보드 · 관리자 모드)가 기록을 지웠으면 이 기기에 남은 기록도 지워요
      if(d.resetAt && d.resetAt > store.get('resetAt',0,name)){
        PROFILE_KEYS.filter(k=>!KEEP_ON_RESET.includes(k)).forEach(k=>store.del(k,name));
        store.set('resetAt',d.resetAt,name);
        if(name===who){ stars=0; updateStars(); }
      }
      if(typeof d.estars==='number' && (d.estarsAt||0) > store.get('estarsAt',0,name)){ store.set('estars',d.estars,name); store.set('estarsAt',d.estarsAt,name); }
      if(typeof d.stars==='number' && (d.starsAt||0) > store.get('starsAt',0,name)){ store.set('stars',d.stars,name); store.set('starsAt',d.starsAt,name); if(typeof d.stk==='number') store.set('stk',d.stk,name); }
      if(d.deco && (d.deco.at||0) > (store.get('deco',{},name).at||0)) store.set('deco',d.deco,name);
      ['best_1','best_2','best_3'].forEach(k=>{ const b=betterBest(store.get(k,null,name), d[k]||null); if(b) store.set(k,b,name); });
      if(typeof d.hmock==='number' && d.hmock>store.get('hmock',0,name)) store.set('hmock',d.hmock,name);
      if(d.hwrong && (d.hwrongAt||0) > store.get('hwrongAt',0,name)){ store.set('hwrong',d.hwrong,name); store.set('hwrongAt',d.hwrongAt,name); }
      ['kread2','estory','lib','csbest'].forEach(k=>{ if(!d[k]) return; const o=store.get(k,{},name); for(const x in d[k]) o[x]=Math.max(o[x]===undefined?-1:o[x], d[k][x]); store.set(k,o,name); });
      if(Array.isArray(d.books) && (d.booksAt||0) > store.get('booksAt',0,name)){ store.set('books',d.books,name); store.set('booksAt',d.booksAt,name); }
      const lp=kidPinsRaw()[name];
      if(d.pinAt && (!lp || d.pinAt > lp.at)){ const r=kidPinsRaw(); r[name]={h:d.pinH||null, at:d.pinAt}; store.set('kidpins',r); }
    }
    if(docOnly) return true;
    const L=getLog(name), vis=store.get('visits',{},name), qs=await ref.collection('daily').get();
    qs.forEach(doc=>{
      const k=doc.id, d=doc.data();
      if(k===dayKey()){ [['starDay','starsGot'],['stkDay','stkGot']].forEach(([lk,rk])=>{ const o=store.get(lk,{},name); if((d[rk]||0) > (o.d===k?o.n:0)) store.set(lk,{d:k,n:d[rk]},name); }); }
      if(d.visited) vis[k]=1;
      Object.keys(SUBJ).forEach(s=>{
        if(!d[s]) return;
        const day=L[k]||(L[k]={}), e=day[s]||(day[s]={n:0,ok:0});
        e.n=Math.max(e.n,d[s].n||0); e.ok=Math.max(e.ok,d[s].ok||0);
      });
    });
    store.set('log',L,name); store.set('visits',vis,name);
    return true;
  }catch(e){ console.warn('불러오기 실패', e); return false; }
}
let pushTimer=null;
function cloudPush(){
  if(!FIREBASE_CONFIG || !who || !KID_IDS[who]) return;
  const name=who; clearTimeout(pushTimer);

/* 기록을 지워도 남겨 두는 것: 설정 · 고른 단계 */
const KEEP_ON_RESET = ['settings','unit','mlv','hlv','hslv','elv','level','op','klv'];
async function cloudPushNow(name){
  if(!await cloudInit()) return;
  const ref=kidRef(name); if(!ref) return;

  const k=dayKey(), L=getLog(name);

      hmock:store.get('hmock',0,name), hwrong:store.get('hwrong',{},name), hwrongAt:store.get('hwrongAt',0,name), pinH:pin.h||null, pinAt:pin.at||0,
      lib:store.get('lib',{},name), csbest:store.get('csbest',{},name), kread2:store.get('kread2',{},name), estory:store.get('estory',{},name), books:store.get('books',[],name), booksAt:store.get('booksAt',0,name)};
    ['best_1','best_2','best_3'].forEach(k=>{ doc[k]=store.get(k,null,name); });
    await ref.set(doc,{merge:true});
    if(!who || who!==name) return; // 비밀번호만 바꾼 경우 날짜 기록은 건드리지 않아요
    const sdn=(o=>o.d===k?o.n:0)(store.get('starDay',{},name)), kdn=(o=>o.d===k?o.n:0)(store.get('stkDay',{},name));
    await ref.collection('daily').doc(k).set(Object.assign({visited:!!store.get('visits',{},name)[k], total:dayTotal(k,L), starsGot:sdn, stkGot:kdn}, L[k]||{}),{merge:true});
  }catch(e){ console.warn('저장 실패', e); }
}
async function cloudReset(name){
  if(!KID_IDS[name] || !await cloudInit()) return;
  try{
    const ref=kidRef(name), qs=await ref.collection('daily').get();

}

function lpinKey(v){

  LP.buf+=v; drawLoginPin();
  if(LP.buf.length<4) return;

function genPair(lv){
  if(lv===3) lv = Math.random()<0.5 ? 1 : 2;
  const a1=rnd(1,9), b1=rnd(10-a1,9);          // 일의 자리 합이 10 이상
  let a10,b10;
  if(lv===1){ a10=rnd(1,7); b10=rnd(1,8-a10); } // 받아올림 포함 십의 자리 합 9 이하
  else { a10=rnd(1,9); b10=rnd(Math.max(1,9-a10),9); } // 십의 자리도 10 이상 → 세 자리 수
  return Math.random()<0.5 ? [a10*10+a1, b10*10+b1] : [b10*10+b1, a10*10+a1];
}
function genSub(lv){
  if(lv===3) lv = Math.random()<0.5 ? 1 : 2;
  const a1=rnd(0,8), b1=rnd(a1+1,9);            // 일의 자리에서 뺄 수 없어 받아내림
  if(lv===1){ const a10=rnd(2,9); return [a10*10+a1, b1]; }          // 42 − 7
  const a10=rnd(3,9), b10=rnd(1,a10-2);          // 십의 자리: (a10−1) − b10 ≥ 1
  return [a10*10+a1, b10*10+b1];                 // 62 − 38
}
const calc = (a,b,op) => op==='sub' ? a-b : a+b;
const OPS = {add:'+', sub:'−'};
/* 연산 메뉴: 덧셈 1·2단계 / 뺄셈 1·2단계 / 10문제 도전(모두 섞어서) */
function mrowCur(){

function keypad(mode, act='key'){

/* 세로셈 연습 */
/* 받아올림 칸은 따로 쓰지 않아요. 칸을 눌러 자리를 고르고 숫자를 쓰면, 쓴 숫자는 그 자리에 그대로 있어요.
   한 칸을 쓰면 다음 칸(일 → 십 → 백)으로 저절로 넘어가요. 틀리면 풀이 힌트가 나와요. */
const PLACES = ['o','t','h']; // 일, 십, 백
function newV(){
  const op=App.op, [a,b]=op==='sub' ? genSub(App.level) : genPair(App.level);
  const a1=a%10, b1=b%10, a10=Math.floor(a/10), b10=Math.floor(b/10);
  let hint;
  if(op==='sub'){
    hint=`일의 자리: ${a1}에서 ${b1}을(를) 뺄 수 없어요 → 십의 자리에서 10을 빌려 와요<br>${10+a1} − ${b1} = <b>${10+a1-b1}</b> · 십의 자리: ${a10-1} − ${b10} = <b>${a10-1-b10}</b>`;
  } else {
    const s1=a1+b1, t=a10+b10+1;
    hint=`일의 자리: ${a1} + ${b1} = ${s1} → <b>${s1%10}</b> 쓰고 1 올림<br>십의 자리: 1 + ${a10} + ${b10} = <b>${t}</b>`;
  }
  V={a,b,op,hint,cells:{o:'',t:'',h:''},sel:'o',wrong:0,miss:false,showHint:false,done:false,msg:''};
}
function drawVertical(){
  const mb=document.getElementById('mbody'); if(!mb) return;
  if(!V) newV();
  const {a,b,cells}=V;
  const cell=k=>{
    const on=!V.done && V.sel===k;
    return `<button class="cell ${on?'active':''} ${cells[k]!==''?'done':''}" data-act="vsel" data-v="${k}" aria-label="${{o:'일',t:'십',h:'백'}[k]}의 자리">${cells[k]}</button>`;
  };
  const show=V.showHint||V.done;
  // 덧셈: 받아올린 1 / 뺄셈: 십의 자리에 남은 수와 일의 자리로 빌려 온 10
  const carry = !show ? '' : V.op==='sub' ? `<div class="cell carry done">${Math.floor(a/10)-1}</div>` : '<div class="cell carry done">1</div>';
  const borrow = show && V.op==='sub' ? '<div class="cell carry done" style="font-size:1.3rem">10</div>' : '';
  const msg = V.done ? V.msg : (V.showHint ? V.hint : '칸을 눌러 자리를 고르고 답을 써요.');
  mb.innerHTML=`
    <div class="card board">
      <div class="vgrid" id="vgrid">
        <div></div><div class="colname">백</div><div class="colname">십</div><div class="colname">일</div>
        <div></div><div></div><div>${carry}</div><div>${borrow}</div>
        <div></div><div></div><div class="dg" ${show&&V.op==='sub'?'style="text-decoration:line-through;text-decoration-color:var(--no)"':''}>${Math.floor(a/10)}</div><div class="dg">${a%10}</div>
        <div class="dg op">${OPS[V.op]}</div><div></div><div class="dg">${b>=10?Math.floor(b/10):''}</div><div class="dg">${b%10}</div>
        <div class="bar"></div>
        <div></div><div>${cell('h')}</div><div>${cell('t')}</div><div>${cell('o')}</div>
      </div>
      <div class="hint">${msg}</div>
    </div>
    ${V.done ? `<button class="big-btn" data-act="nextV">다음 문제 ▶</button>` : keypad('c')+skipBtn('key','skip')}`;
}
function vKey(v){
  if(!V) return;
  if(V.done){ if(v==='ok') { V=null; drawVertical(); } return; }
  const ans=calc(V.a,V.b,V.op);
  if(v==='skip'){
    V.done=true; logToday('math', false);
    const s=String(ans).padStart(3,' ');
    V.cells={h:s[0].trim(), t:s[1], o:s[2]};
    V.msg=`정답은 <b>${ans}</b> 이에요.<br><small>${V.hint}</small>`;
    drawVertical(); return;
  }
  if(v==='del'){
    if(V.cells[V.sel]===''){ const k=PLACES.indexOf(V.sel); if(k>0) V.sel=PLACES[k-1]; }
    V.cells[V.sel]=''; drawVertical(); return;
  }
  if(v==='ok'){
    const {h,t,o}=V.cells;
    if(o==='' || (ans>=10 && t==='')){ toast(ans>=10?'일의 자리와 십의 자리를 모두 써요':'일의 자리를 써요'); return; }
    if(+(h+t+o)===ans){
      V.done=true; beep(true); markO(); addStar(1); logToday('math', !V.miss); burst();
      V.msg=`<span class="praise">${praise()}</span><br>${V.a} ${OPS[V.op]} ${V.b} = ${ans}`;
      drawVertical();
    } else {
      V.wrong++; V.miss=true; V.cells={o:'',t:'',h:''}; V.sel='o'; beep(false);
      if(V.wrong>=2) V.showHint=true;
      drawVertical(); shake('vgrid');
    }
    return;
  }
  if(/^\d$/.test(v)){
    V.cells[V.sel]=v;
    const k=PLACES.indexOf(V.sel); if(k<2) V.sel=PLACES[k+1];
    drawVertical();
  }
}

/* 10문제 도전 */
function startC(){
  C={list:Array.from({length:10},()=>{ const lv=rnd(1,2); return Math.random()<0.5 ? [...genPair(lv),'add'] : [...genSub(lv),'sub']; }),i:0,input:'',res:[],correct:0,start:Date.now(),done:false,lock:false,flash:'',note:''};
  drawChallenge();
}
function bestKey(){ return 'best_'+App.level; }
function drawChallenge(){
  const mb=document.getElementById('mbody'); if(!mb) return;
  const best=store.get(bestKey(),null);
  const bestTxt = best ? `${best.score}개 정답, ${fmt(best.sec)}` : '아직 없어요';
  if(!C){ startC(); return; }
  if(C.done){
    mb.innerHTML=`<div class="card center">
      <p class="big">${C.correct===10?'🏆 10문제 모두 정답!':`10문제 중 ${C.correct}개 맞았어요!`}</p>
      <p>걸린 시간: ${fmt(C.sec)}</p>
      <p>받은 별: ⭐ ${C.earned}개</p>
      ${C.newBest?'<p class="praise">새 최고 기록이에요!</p>':`<p class="sub">최고 기록: ${bestTxt}</p>`}
      <button class="big-btn" data-act="startC">다시 도전</button></div>`;
    return;
  }
  const [a,b,op]=C.list[C.i];
  mb.innerHTML=`<div class="card board">
      <div class="dots">${C.list.map((_,i)=>`<span class="dot ${i<C.i?(C.res[i]?'ok':'no'):(i===C.i?'cur':'')}"></span>`).join('')}</div>
      <div class="hq"><span>${a} ${OPS[op]} ${b} =</span><span class="ansbox ${C.flash}">${C.input||'&nbsp;'}</span></div>
      <div class="hint">${C.note||'답을 누르고 확인!'}</div>
      <div class="sub" style="font-size:.85rem">⏱ 최고 기록: ${bestTxt}</div>
    </div>${keypad('c')}${C.lock?'':skipBtn('key','skip')}`;
}
function cKey(v){
  if(!C||C.done||C.lock) return;
  if(v==='del'){ C.input=C.input.slice(0,-1); }
  else if(v==='ok'||v==='skip'){
    if(v==='ok' && !C.input) return;
    const [a,b,op]=C.list[C.i], ans=calc(a,b,op), ok=v==='ok' && +C.input===ans;
    C.res.push(ok); beep(ok); logToday('math', ok);
    if(ok){ markO(); C.correct++; C.flash='ok'; C.note=`<span class="praise">${praise()}</span>`; }
    else { C.flash='no'; C.note=`아쉬워요! 정답은 <b>${ans}</b>`; }
    C.lock=true; drawChallenge();
    const me=C;
    setTimeout(()=>{
      if(C!==me) return;
      C.i++; C.input=''; C.flash=''; C.note=''; C.lock=false;
      if(C.i>=10) finishC();
      if(App.view==='math'&&App.mmode==='challenge') drawChallenge();
    }, ok?700:1600);
    return;
  }
  else if(/^\d$/.test(v)){ if(C.input.length<3) C.input+=v; }
  drawChallenge();
}
function finishC(){
  C.done=true; C.sec=Math.round((Date.now()-C.start)/1000);
  C.earned=C.correct+(C.correct===10?2:0);
  addStar(C.earned);
  const best=store.get(bestKey(),null);
  C.newBest = !best || C.correct>best.score || (C.correct===best.score && C.sec<best.sec);
  if(C.newBest){ store.set(bestKey(),{score:C.correct,sec:C.sec}); cloudPush(); }
  if(C.correct>=8) burst();
}

/* ───── 학교수학 (2학년 2학기) ─────
   문제 형식: 숫자 입력(type:'num', html 안의 □ 자리에 답 입력) 또는 고르기(type:'choice') */
const numQ = (html, ans, explain='') => ({type:'num', html, ans, explain});
const choQ = (html, ans, others, explain='', cls='') => {
  const list=[...new Set([String(ans), ...others.map(String)])].slice(0,4);
  return {type:'choice', html, ans:String(ans), choices:shuffle(list), explain, cls};
};
const BOX = '<span class="box">&nbsp;?&nbsp;</span>';
const fmtT = (h,m) => m ? `${h}시 ${m}분` : `${h}시`;
const h12 = h => ((h-1)%12+12)%12+1;
function toKorean(n){
  const D=['','일','이','삼','사','오','육','칠','팔','구'], U=['','십','백','천'];
  const s=String(n); let out='';
  for(let i=0;i<s.length;i++){
    const d=+s[i], p=s.length-1-i;
    if(d) out += (d===1 && p>0 ? '' : D[d]) + U[p];
  }
  return out;
}

function genN4(){
  const t=rnd(1,5);
  if(t===1){
    const ds=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4), p=rnd(0,3), d=ds[3-p];
    const shown=ds.map((x,i)=>i===3-p?`<span style="color:var(--no)">${x}</span>`:x).join('');
    return numQ(`<span class="big">${shown}</span><br>빨간 숫자가 나타내는 수는?<br>□`, d*10**p, `${['일','십','백','천'][p]}의 자리 숫자 ${d} → ${d*10**p}`);
  }
  if(t===2){
    const a=rnd(1,9), b=rnd(0,9), c=rnd(0,9), d=rnd(0,9);
    return numQ(`1000이 ${a}개, 100이 ${b}개,<br>10이 ${c}개, 1이 ${d}개인 수는?<br>□`, a*1000+b*100+c*10+d);
  }
  if(t===3){
    const s=one([1,10,100,1000]), a=rnd(1000, 9999-4*s), k=rnd(1,4);
    const seq=[0,1,2,3,4].map(i=>i===k?'□':a+i*s);
    const nm={1:'1',10:'10',100:'100',1000:'1000'}[s];
    return numQ(`${nm}씩 뛰어 세어요.<br>${seq.join(' → ')}`, a+k*s, `${nm}씩 커져요.`);
  }
  if(t===4){
    const a=rnd(1000,9999); let b;
    do{ const s=String(a).split(''); const p=rnd(0,3); s[p]=String(rnd(p?0:1,9)); b=+s.join(''); }while(b===a);
    return choQ(`<span class="big">${a} ○ ${b}</span><br>○ 안에 알맞은 것은?`, a>b?'>':'<', ['>','<'], '천의 자리부터 차례로 비교해요.', 'short');
  }
  const n=rnd(1000,9999);
  return numQ(`‘${toKorean(n)}’를 숫자로 쓰면?<br>□`, n);
}
function genMul(){

}
function genLen(){
  const t=rnd(1,5);
  if(t===1){ const a=rnd(1,9), b=rnd(1,99); return numQ(`${a} m ${b} cm = □ cm`, a*100+b, `1 m = 100 cm 이니까 ${a*100} + ${b}`); }
  if(t===2){

                             : numQ(`${a} m ${b} cm + ${c} m ${d} cm<br>= ${a+c} m □ cm`, b+d, `cm끼리 더해요: ${b} + ${d}`);

                             : numQ(`${a} m ${b} cm − ${c} m ${d} cm<br>= ${a-c} m □ cm`, b-d, `cm끼리 빼요: ${b} − ${d}`);

    ['지우개의 길이','5','cm'],['운동장 한 바퀴','200','m'],['내 한 뼘','13','cm'],['수영장 긴 쪽의 길이','25','m'],['공책 긴 쪽의 길이','25','cm'],['아파트의 높이','50','m']]);
  return choQ(`${thing}는 약 ${n} ${BOX}<br>알맞은 단위는?`, u, ['cm','m'], '', 'short');

function genTime(){
