    [fmtT(H,(M+10)%60), fmtT(h12(H+1),M), fmtT(h12(H-1),M), fmtT(H,(M+50)%60)], '', 'short');
}
const GRAPH_TOPICS = [
  {t:'과일', items:[['🍎','사과'],['🍌','바나나'],['🍇','포도'],['🍓','딸기']]},
  {t:'계절', items:[['🌸','봄'],['☀️','여름'],['🍂','가을'],['⛄','겨울']]},
  {t:'동물', items:[['🐶','강아지'],['🐱','고양이'],['🐰','토끼'],['🐹','햄스터']]},
  {t:'색깔', items:[['🔴','빨강'],['🔵','파랑'],['🟢','초록'],['🟡','노랑']]}
];
function genGraph(){
  const tp=one(GRAPH_TOPICS); let c;
  do{ c=tp.items.map(()=>rnd(1,7)); }while(c.filter(v=>v===Math.max(...c)).length>1);
  const sum=c.reduce((a,b)=>a+b,0), mx=Math.max(5,...c);
  const table=`<table class="tbl"><tr><th>${tp.t}</th>${tp.items.map(x=>`<th>${x[0]}<br>${x[1]}</th>`).join('')}<th>합계</th></tr>
    <tr><th>학생 수(명)</th>${c.map(v=>`<td>${v}</td>`).join('')}<td>${BOX}</td></tr></table>`;
  let rows=''; for(let r=mx;r>=1;r--) rows+=`<tr><th class="ax">${r}</th>${c.map(v=>`<td>${v>=r?'○':''}</td>`).join('')}</tr>`;
  const graph=`<div class="gcap">좋아하는 ${tp.t}별 학생 수</div><table class="tbl gtbl">${rows}<tr><th class="ax">(명)</th>${tp.items.map(x=>`<th>${x[0]}<br>${x[1]}</th>`).join('')}</tr></table>`;
  const t=rnd(1,4), i=rnd(0,3), nm=tp.items[i][1];
  if(t===1) return numQ(`${graph}${josa(nm,'을','를')} 좋아하는 학생은 □명`, c[i], `${nm} 위의 ○를 세어요.`);
  if(t===2) return numQ(`${table}합계는 □명`, sum, `${c.join(' + ')} = ${sum}`);
  if(t===3){ const mi=c.indexOf(Math.max(...c)); return choQ(`${graph}가장 많은 학생이 좋아하는 ${tp.t}는?`, tp.items[mi][1], tp.items.map(x=>x[1]), '○가 가장 높이 쌓인 것을 찾아요.', 'short'); }
  let a, b; do{ [a,b]=shuffle([0,1,2,3]); }while(c[a]===c[b]);
  if(c[a]<c[b]) [a,b]=[b,a];
  return numQ(`${graph}${josa(tp.items[a][1],'은','는')} ${tp.items[b][1]}보다<br>□명 더 많아요.`, c[a]-c[b], `${c[a]} − ${c[b]} = ${c[a]-c[b]}`);
}
function genPat(){
  const t=rnd(1,4);
  if(t===1){
    const s=one([2,3,4,5,10,100]), a = s===100 ? rnd(1,9)*100+rnd(0,99) : rnd(1,30), k=rnd(1,4);
    return numQ([0,1,2,3,4].map(i=>i===k?'□':a+i*s).join(', '), a+k*s, `${s}씩 커지는 규칙이에요.`);
  }
  if(t===2){
    const E=shuffle(['🔴','🔵','🟡','🟢','⭐','🔺','💜','🍀']), U=one([[0,1],[0,1,2],[0,0,1],[0,1,1],[0,1,2,1]]);
    const seq=Array.from({length:9},(_,i)=>E[U[i%U.length]]), k=rnd(5,8);
    return choQ(`규칙을 찾아 ${BOX}에 알맞은 모양은?<br><span style="font-size:1.5em;letter-spacing:.08em">${seq.map((x,i)=>i===k?BOX:x).join('')}</span>`,
      seq[k], [...new Set(U.map(i=>E[i]))].concat(E[5],E[6]), `${U.map(i=>E[i]).join('')} 가 되풀이돼요.`, 'short');
  }
  if(t===3){
    const d=rnd(2,9), a=rnd(2,9);
    return Math.random()<0.5 ? numQ(`곱셈표의 ${d}단에서는<br>곱이 □씩 커져요.`, d, `${d} × 1 = ${d}, ${d} × 2 = ${d*2}, …`)
                             : numQ(`${d} × ${a}와 곱이 같은 곱셈<br>${a} × □`, d, `곱하는 두 수의 순서를 바꿔도 곱은 같아요.`);
  }
  const d=rnd(1,7);
  return one([
    ()=>numQ(`달력에서 같은 요일인 날짜<br>${d}일, ${d+7}일, ${d+14}일, □일`, d+21, '같은 요일은 7일마다 돌아와요.'),
    ()=>numQ(`달력에서 아래로 한 칸 내려가면<br>날짜가 □씩 커져요.`, 7, '1주일은 7일이에요.'),
    ()=>{ const x=rnd(1,20); return numQ(`${x}일에서 1주일 뒤는<br>□일`, x+7, `${x} + 7`); }
  ])();
}

  S={unit:App.unit,list,i:0,input:'',res:[],correct:0,done:false,lock:false,flash:'',note:'',picked:-1};

}
function drawS(){
  const sb=document.getElementById('sbody'); if(!sb) return;
  if(!S || S.unit!==App.unit){ startS(); return; }
  if(S.done){
    sb.innerHTML=`<div class="card center">
      <p class="big">${S.correct===10?'🏆 10문제 모두 정답!':`10문제 중 ${S.correct}개 맞았어요!`}</p>
      <p>받은 별: ⭐ ${S.earned}개</p>
      <button class="big-btn" data-act="startS">다시 하기</button></div>`;
    return;
  }
  const q=S.list[S.i];
  const dots=`<div class="dots">${S.list.map((_,i)=>`<span class="dot ${i<S.i?(S.res[i]?'ok':'no'):(i===S.i?'cur':'')}"></span>`).join('')}</div>`;
  const tag = App.unit==='mix' ? `<div class="unit-tag">${UNITS[q.unit].name}</div>` : '';
  let body, below='';
  if(q.type==='num'){
    body=q.html.replace('□',`<span class="ansbox ${S.flash}">${S.input||'&nbsp;'}</span>`);
    below=keypad('c','skey');
  } else {
    body=q.html;
    below=`<div class="choices ${q.cls}">${q.choices.map((c,i)=>{
      const cls = S.lock ? (c===q.ans?'ok':(i===S.picked?'no':'')) : '';
      return `<button class="choice ${cls}" data-act="spick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`;
    }).join('')}</div>`;
  }
  sb.innerHTML=`<div class="card board">${dots}${tag}<div class="sq">${body}</div>
    <div class="hint">${S.note||(q.type==='num'?'답을 누르고 확인!':'알맞은 것을 골라요.')}</div></div>${below}${S.lock?'':skipBtn('skey','skip')}`;
}
function answerS(ok){
  const q=S.list[S.i];
  S.res.push(ok); beep(ok); logToday('school', ok);
  if(ok){ markO(); S.correct++; S.flash='ok'; S.note=`<span class="praise">${praise()}</span>`; }
  else { S.flash='no'; S.note=`아쉬워요! 정답은 <b>${esc(q.ans)}</b>${q.explain?`<br><small>${q.explain}</small>`:''}`; }
  S.lock=true; drawS();
  const me=S;
  setTimeout(()=>{
    if(S!==me) return;
    S.i++; S.input=''; S.flash=''; S.note=''; S.lock=false; S.picked=-1;
    if(S.i>=10){ S.done=true; S.earned=S.correct+(S.correct===10?2:0); addStar(S.earned); if(S.correct>=8) burst(); }
    if(App.view==='school') drawS();
  }, ok?900:2600);
}
function sKey(v){
  if(!S||S.done||S.lock) return;
  if(v==='skip'){ answerS(false); return; }
  const q=S.list[S.i]; if(q.type!=='num') return;
  if(v==='del') S.input=S.input.slice(0,-1);
  else if(v==='ok'){ if(!S.input) return; answerS(+S.input===q.ans); return; }
  else if(/^\d$/.test(v)){ if(S.input.length<5) S.input+=v; }
  drawS();
}
function sPick(i){
  if(!S||S.done||S.lock) return;
  const q=S.list[S.i]; S.picked=i; answerS(q.choices[i]===q.ans);
}

  while(order.length<10){

function nextQ(){
  const pool=quizPool(Q.cat), cur=Q.order[Q.i], n = Q.mode==='listen' ? 4 : 3;
  const seen=new Set([cur.w]);
  const others=shuffle(pool).filter(x=>{ if(seen.has(x.w)) return false; seen.add(x.w); return true; }).slice(0,n-1);
  Q.cur=cur; Q.choices=shuffle([cur,...others]); Q.tried=false; Q.solved=false; Q.wrong=[];
}

}
function advanceQ(ms){
  const me=Q;

}
function skipQ(){

}

const KBOX = '<span class="box">&nbsp;?&nbsp;</span>';
const kq = (html, ans, choices, explain='', cls='words') => ({html, ans, choices:shuffle([...new Set([ans,...choices])]), explain, cls});
const others = (arr, not, n=3) => shuffle(arr.filter(x=>x!==not)).slice(0,n);
const KO_GEN = {
  spell: ()=>{ const [r,w]=koDeck('spell',KO_SPELL); return kq('바르게 쓴 낱말은?', r, [w], `‘${r}’는 [${w}]처럼 소리 나지만 ‘${r}’로 써요.`, 'short'); },
  sound: ()=>{ const [s,a]=koDeck('sound',KO_SOUND); return kq(`${s.replace('□',KBOX)}<br><small class="sub">알맞은 흉내 내는 말은?</small>`, a, others(KO_SOUND.map(x=>x[1]),a), s.replace('□',a), 'short'); },
  opp: ()=>{ const p=koDeck('opp',KO_OPP), k=rnd(0,1), a=p[1-k]; return kq(`‘${p[k]}’의 반대말은?`, a, others(KO_OPP.flat(),a).filter(x=>x!==p[k]), `${p[k]} ↔ ${a}`, 'short'); },
  punc: ()=>{ const [s,m]=koDeck('punc',KO_PUNC); return kq(`${s.replace('□',KBOX)}<br><small class="sub">${KBOX} 안에 알맞은 문장 부호는?</small>`, PUNC_NAME[m], Object.values(PUNC_NAME), s.replace('□',m), 'short'); },
  honor: ()=>{
    if(Math.random()<0.5){ const [p,h]=koDeck('honor',KO_HONOR); return kq(`‘${p}’${josa(p,'을','를').slice(p.length)} 높여 이르는 말은?`, h, others(KO_HONOR.map(x=>x[1]),h,2).concat(p), `${p} → ${h}`, 'short'); }
    const [s,a,w]=koDeck('honor_s',KO_HONOR_S); return kq(`${s.replace('□',KBOX)}<br><small class="sub">웃어른께 알맞은 말은?</small>`, a, w, s.replace('□',a));
  },
  base: ()=>{ const [w,a,d]=koDeck('base',KO_BASE); return kq(`‘${w}’${josa(w,'을','를').slice(w.length)} 국어사전에서 찾으려면<br>어떤 모양으로 찾아야 할까요?`, a, d, `국어사전에는 기본 모양 ‘${a}’로 실려 있어요.`, 'short'); },
  sense: ()=>{ const [p,i]=koDeck('sense',KO_SENSE); return kq(`‘${p}’<br><small class="sub">어떤 느낌을 살린 말일까요?</small>`, SENSES[i], others(SENSES,SENSES[i])); },
  main: ()=>{ const [m,rest]=koDeck('main',KO_MAIN), first=Math.random()<0.6, sents=first?[m,...rest]:[...rest,m];
    return kq(`<div class="ko-para">${sents.join(' ')}</div><small class="sub">이 문단의 중심 문장은?</small>`, m, rest, '나머지 문장들이 이 문장을 자세히 설명해 줘요.'); },
  why: ()=>{ const [s,q,a,d]=koDeck('why',KO_WHY); return kq(`<div class="ko-para">${s}</div>${q}`, a, d, s); },
  spell2: ()=>{ const [r,w]=koDeck('spell2',KO_SPELL2); return kq('바르게 쓴 문장은?', r, [w], r); }
};

function startK(){

  b.innerHTML=`<div class="card">

    ${K.note?`<div class="hint">${K.note}</div>`:''}
    ${K.solved?'':skipBtn('kskip')}
  </div>`;
}
function kNext(ms){
  const me=K;
  setTimeout(()=>{
    if(K!==me) return;
    K.i++; K.tried=false; K.solved=false; K.picked=[]; K.note='';
    if(K.i>=10){ K.done=true; if(K.score>=8) burst(); }
    if(App.view==='korean') drawK();
  }, ms);
}
function kPick(i){
  if(!K||K.solved||K.done) return;
  const q=K.list[K.i];
  if(q.choices[i]===q.ans){
    K.solved=true; beep(true); markO(); logToday('korean', !K.tried);
    if(!K.tried){ K.score++; addStar(1); }
    K.note=`<span class="praise">${praise()}</span>`; drawK(); kNext(1300);
  } else {
    if(K.picked.includes(i)) return;
    K.tried=true; K.picked.push(i); beep(false);
    K.note=q.explain?`<small>💡 ${q.explain}</small>`:''; drawK();
  }
}
function kSkip(){
  if(!K||K.solved||K.done) return;
  const q=K.list[K.i];
  K.tried=true; K.solved=true; beep(false); logToday('korean', false);
  K.note=`정답은 <b>${esc(q.ans)}</b>${q.explain?`<br><small>${q.explain}</small>`:''}`; drawK(); kNext(2600);
}

/* 📚 글 읽기: 책장 → 글 읽기 → 문제 1 ~ 2개 */
let KR=null;
const krDone = () => store.get('kread2',{});
const krPool = () => KO_READS.filter(p=>p.lv===App.klv);
function krNext(after){ const r=krDone(), l=krPool(), i=after?l.findIndex(p=>p.id===after):-1; return l.slice(i+1).find(p=>r[p.id]===undefined)||l.find(p=>r[p.id]===undefined)||l[(i+1)%l.length]; }
function drawKRead(){
  const b=document.getElementById('kbody'); if(!b) return;
  const p=KO_READS.find(x=>x.id===App.krid);
  if(!p){
    const r=krDone(), l=krPool(), nx=krNext();
    b.innerHTML=`<button class="subj kr-next" data-act="krOpen" data-v="${nx.id}"><span class="bk-e">${nx.e}</span><span><small>👉 이어서 읽을 글</small><br><b>${nx.t}</b></span></button>
      <p class="sub" style="margin:12px 0 6px">📚 읽은 글 ${l.filter(x=>r[x.id]!==undefined).length} / ${l.length}편</p>
      <div class="shelf">${l.map(x=>`<button class="book ${r[x.id]!==undefined?'read':''}" data-act="krOpen" data-v="${x.id}">${r[x.id]!==undefined?`<span class="done">${r[x.id]===x.qs.length?'🏅':'✔'}</span>`:''}<span class="bk-e">${x.e}</span><b>${x.t}</b><small>문제 ${x.qs.length}개</small></button>`).join('')}</div>`;
    return;
  }
  if(!KR || KR.id!==p.id) KR={id:p.id, phase:'read', i:0, score:0, tried:false, solved:false, picked:[], note:'', qs:p.qs.map(([q,a,o,ex])=>({q, ans:a, choices:shuffle([a,...o]), explain:ex}))};
  let below='';
  if(KR.phase==='read') below=`<button class="big-btn" data-act="krQuiz">✅ 다 읽었어요! 문제 풀기</button>`;
  else if(KR.phase==='done') below=`<div class="card center"><p class="big">${KR.score===KR.qs.length?'🏆 한 번에 다 맞혔어요!':`${KR.qs.length}문제 중 ${KR.score}개를 한 번에 맞혔어요!`}</p><p>받은 별 ⭐ ${KR.earned}개</p>
      <button class="big-btn" data-act="krOpen" data-v="${krNext(p.id).id}">📖 다음 글 읽기</button></div>`;
  else {
    const q=KR.qs[KR.i], cls=i=>KR.solved&&q.choices[i]===q.ans?'ok':(KR.picked.includes(i)?'no':'');
    below=`<div class="card"><div class="qtop"><span>문제 ${KR.i+1} / ${KR.qs.length}</span><span>⭐ ${KR.score}</span></div>
      <div class="sq ko-q">${esc(q.q)}</div>
      <div class="choices words">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="krPick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
      ${KR.note?`<div class="hint">${KR.note}</div>`:''}${KR.solved?'':skipBtn('krSkip')}</div>`;
  }
  b.innerHTML=`${backBtn('krClose',true)}<div class="card kr-page"><div class="kr-top"><span class="bk-e">${p.e}</span><b>${p.t}</b><button class="ls-spk" data-act="krSay" aria-label="읽어 주기">🔊</button></div>
    ${p.paras.map(t=>`<p>${esc(t)}</p>`).join('')}</div>${below}
    ${backBtn('krClose')}`;
}
function krPick(i){
  if(!KR||KR.solved||KR.phase!=='quiz') return;
  const q=KR.qs[KR.i];
  if(q.choices[i]===q.ans){
    KR.solved=true; beep(true); markO(); logToday('korean', !KR.tried);
    if(!KR.tried){ KR.score++; addStar(1); }
    KR.note=`<span class="praise">${praise()}</span>`; drawKRead(); krNextQ(1400);
  } else {
    if(KR.picked.includes(i)) return;
    KR.tried=true; KR.picked.push(i); beep(false);
    KR.note='💡 글을 다시 한번 읽어 봐요. '+esc(q.explain); drawKRead();
  }
}
function krSkip(){
  if(!KR||KR.solved||KR.phase!=='quiz') return;
  const q=KR.qs[KR.i];
  KR.tried=true; KR.solved=true; beep(false); logToday('korean', false);
  KR.note=`정답은 <b>${esc(q.ans)}</b><br><small>${esc(q.explain)}</small>`; drawKRead(); krNextQ(2600);
}
function krNextQ(ms){
  const me=KR;
  setTimeout(()=>{
    if(KR!==me) return;
    KR.i++; KR.tried=false; KR.solved=false; KR.picked=[]; KR.note='';
    if(KR.i>=KR.qs.length){
      KR.phase='done'; KR.earned=KR.score+(KR.score===KR.qs.length?1:0);
      if(KR.score===KR.qs.length){ addStar(1); burst(); }
      const r=krDone(); r[KR.id]=Math.max(r[KR.id]===undefined?-1:r[KR.id], KR.score); store.set('kread2',r); cloudPush();
    }
    if(App.view==='korean' && App.kact==='read') drawKRead();
  }, ms);
}

let ESQ=null;
const estPage = () => { const st=E_STORIES.find(s=>s.id===App.est); return st ? st.pages[Math.min(App.epg,st.pages.length-1)] : null; };
function drawEStory(){
  const eb=document.getElementById('ebody'); if(!eb) return;
  const st=E_STORIES.find(s=>s.id===App.est), r=store.get('estory',{});
  if(!st){

      <div class="shelf">${E_STORIES.map(s=>`<button class="book ${r[s.id]!==undefined?'read':''}" data-act="estOpen" data-v="${s.id}">${r[s.id]!==undefined?`<span class="done">${r[s.id]===2?'🏅':'✔'}</span>`:''}<span class="bk-e">${s.e}</span><b class="en">${s.t}</b><small>${s.ko}</small></button>`).join('')}</div>`;

  eb.innerHTML=`${backBtn('estClose',true)}<div class="card est">
      <div class="est-cover">📖 ${st.ko}</div>
      <div class="est-title en">${st.t}</div>

      <button class="est-en en" data-act="estSay">${esc(en)} <span>🔊</span></button>
      <div class="est-ko">${App.eko?esc(ko):'<button class="pill" data-act="estKo">🤔 무슨 뜻일까? 눌러 보기</button>'}</div>
      <div class="est-words">${ws.map(([w,m])=>`<button class="est-w" data-act="say" data-v="${esc(w)}"><span class="en">${esc(w)}</span>${esc(m)}</button>`).join('')}</div>
      <div class="est-nav">
        <button class="pill" data-act="estPage" data-v="-1" ${pg===0?'disabled style="opacity:.35"':''}>◀ 앞장</button>
        <div><div class="est-dots">${st.pages.map((_,i)=>`<span class="${i===pg?'on':''}"></span>`).join('')}</div><div class="sub" style="font-size:.85rem;margin-top:4px">${pg+1} / ${n}쪽</div></div>
        ${pg<n-1?'<button class="pill on" data-act="estPage" data-v="1">다음 장 ▶</button>':'<button class="pill on" data-act="estQuiz">📝 낱말 퀴즈!</button>'}
      </div>
    </div>
    ${backBtn('estClose')}`;

function startEStoryQuiz(st){
  const all=[...new Set(E_STORIES.flatMap(s=>s.pages.flatMap(p=>p[3].map(x=>x[1]))))];
  const mine=shuffle([...new Map(st.pages.flatMap(p=>p[3]).map(x=>[x[0],x])).values()]).slice(0,2);
  ESQ={id:st.id, i:0, score:0, tried:false, solved:false, picked:[], note:'', done:false,
    list:mine.map(([w,m])=>({w, ans:m, choices:shuffle([m, ...shuffle(all.filter(x=>x!==m)).slice(0,3)])}))};
}
function drawEStoryQuiz(st){
  const eb=document.getElementById('ebody'); if(!eb) return;
  if(ESQ.done){
    const nx=E_STORIES[(E_STORIES.findIndex(s=>s.id===st.id)+1)%E_STORIES.length];
    eb.innerHTML=`<div class="card center"><p class="sub">${st.e} ${st.t}</p><p class="big">${ESQ.score===2?'🏆 2문제 모두 한 번에!':`2문제 중 ${ESQ.score}개를 한 번에 맞혔어요!`}</p>
      <p>받은 별 ⭐ ${ESQ.earned}개</p>
      <button class="big-btn" data-act="estOpen" data-v="${nx.id}">📖 다음 이야기: ${nx.e} ${nx.t}</button>
      <div class="center"><button class="linkbtn" data-act="estOpen" data-v="${st.id}">↺ 이 이야기 다시 읽기</button></div></div>${backBtn('estClose')}`;
    return;
  }
  const q=ESQ.list[ESQ.i], cls=i=>ESQ.solved&&q.choices[i]===q.ans?'ok':(ESQ.picked.includes(i)?'no':'');
  eb.innerHTML=`<div class="card center"><div class="qtop"><span>${st.e} 낱말 퀴즈 · ${ESQ.i+1} / 2</span><span>⭐ ${ESQ.score}</span></div>
    <div class="est-q en">${esc(q.w)}</div><button class="spk" data-act="say" data-v="${esc(q.w)}">🔊 듣기</button>
    <p class="sub">이야기에 나온 이 낱말의 뜻은?</p>
    <div class="choices words">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="estPick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
    ${ESQ.note?`<div class="hint">${ESQ.note}</div>`:''}${ESQ.solved?'':skipBtn('estSkip')}</div>`;
}
function estAnswer(i){
  if(!ESQ||ESQ.solved||ESQ.done) return;
  const q=ESQ.list[ESQ.i], skip=i<0;
  if(!skip && q.choices[i]===q.ans){
    ESQ.solved=true; beep(true); markO(); speak(q.w); logToday('eng', !ESQ.tried);
    if(!ESQ.tried){ ESQ.score++; addStar(1); }
    ESQ.note=`<span class="praise">${praise()}</span>`;
  } else {
    if(!skip && ESQ.picked.includes(i)) return;
    if(!skip){ ESQ.tried=true; ESQ.picked.push(i); beep(false); ESQ.note='💡 이야기에서 이 낱말이 나온 장을 떠올려 봐요.'; drawEStory(); return; }
    ESQ.tried=true; ESQ.solved=true; beep(false); logToday('eng', false); ESQ.note=`정답은 <b>${esc(q.ans)}</b>`;
  }
  drawEStory();
  const me=ESQ;
  setTimeout(()=>{
    if(ESQ!==me) return;
    ESQ.i++; ESQ.tried=false; ESQ.solved=false; ESQ.picked=[]; ESQ.note='';
    if(ESQ.i>=ESQ.list.length){
      ESQ.done=true; ESQ.earned=ESQ.score+(ESQ.score===2?1:0);
      if(ESQ.score===2){ addStar(1); burst(); }
      const r=store.get('estory',{}); r[ESQ.id]=Math.max(r[ESQ.id]===undefined?-1:r[ESQ.id], ESQ.score); store.set('estory',r); cloudPush();
    } else setTimeout(()=>speak(ESQ.list[ESQ.i].w),300);
    if(App.view==='eng' && App.emode==='story') drawEStory();
  }, skip?2200:1400);
}

    ['🐴🐶🐱🐓','농장 울타리 위에서는 수탉이 목청껏 울고 있었어요. “내일 수프가 될 처지라 마지막으로 노래하는 거야.” “우리랑 가자! 너는 목소리가 정말 좋구나.”'],
    ['🌲🏠','밤이 되자 넷은 숲속에서 불빛이 새어 나오는 집을 발견했어요. 창문으로 들여다보니 도둑들이 맛있는 음식을 차려 놓고 먹고 있었어요.'],
    ['🐓🐱🐶🐴','넷은 꾀를 냈어요. 당나귀 위에 개가, 개 위에 고양이가, 고양이 위에 수탉이 올라갔어요. 그리고 한꺼번에 소리를 질렀어요. “히힝! 멍멍! 야옹! 꼬끼오!”'],
    ['🏃‍♂️💨','무시무시한 소리에 깜짝 놀란 도둑들은 “괴물이다!” 하고 숲 밖으로 달아났어요.'],
    ['🏠🎶','네 친구는 그 집에서 배불리 먹고 사이좋게 살았어요. 브레멘에는 끝내 가지 않았지만, 서로가 있어 매일매일 즐거웠답니다.']],
    qs:[['동물들이 처음에 가려고 한 곳은?','브레멘',['서울','바다','왕궁'],'당나귀가 브레멘 음악대가 되자고 했어요.'],['도둑들이 달아난 까닭은?','무시무시한 소리에 놀라서',['경찰이 와서','비가 와서','음식이 없어서'],'넷이 한꺼번에 소리를 질렀어요.'],['이 이야기에서 알 수 있는 것은?','힘을 합치면 어려운 일도 해낼 수 있어요.',['혼자가 제일 좋아요.','도둑은 용감해요.','늙으면 아무것도 못 해요.'],'힘없는 동물들이 힘을 합쳐 도둑을 물리쳤어요.']]},
  {id:'duckling', e:'🦢', t:'미운 아기 오리', by:'안데르센', pages:[
    ['🥚🦆','어느 여름, 엄마 오리의 알들이 하나둘 깨어났어요. 그런데 가장 큰 알에서 나온 아기는 몸이 크고 회색이었어요. “어머, 정말 못생긴 아기네!”'],
    ['🐥😢','형제들은 미운 아기 오리를 놀리고 쪼았어요. 닭과 칠면조도 비웃었어요. 슬퍼진 아기 오리는 결국 혼자 농장을 떠났어요.'],
    ['🍂🌧️','가을이 되고 찬바람이 불었어요. 아기 오리는 갈대숲에 숨어 지냈어요. 어느 날 하늘을 나는 하얗고 아름다운 새들을 보고 넋을 잃었어요. “나도 저렇게 날 수 있으면 좋겠다.”'],
    ['❄️🥶','겨울은 너무나 추웠어요. 연못이 꽁꽁 얼어 아기 오리는 얼음에 갇힐 뻔했어요. 친절한 농부가 구해 주었지만, 아기 오리는 겁이 나서 또 도망쳤어요.'],
    ['🌸🌿','길고 긴 겨울이 지나고 봄이 왔어요. 아기 오리가 날개를 펴자 몸이 훨훨 하늘로 떠올랐어요. 날개가 어느새 크고 튼튼해져 있었어요.'],
    ['🦢🦢🦢','호수에 내려앉자 그 아름다운 새들이 다가왔어요. 아기 오리는 고개를 숙였어요. 그런데 물에 비친 모습은 더 이상 미운 오리가 아니었어요. 눈부시게 하얀 백조였어요!'],
    ['🦢✨','“새로 온 백조가 제일 아름다워!” 아이들이 외쳤어요. 백조는 행복했지만 뽐내지 않았어요. 힘들었던 날들을 잊지 않고, 따뜻한 마음을 가진 백조가 되었답니다.']],
    qs:[['미운 아기 오리가 농장을 떠난 까닭은?','모두가 놀리고 괴롭혀서',['먹이가 없어서','엄마를 찾으려고','여행을 하고 싶어서'],'형제들과 다른 동물들이 놀렸어요.'],['미운 아기 오리는 자라서 무엇이 되었나요?','백조',['독수리','닭','거위'],'물에 비친 모습은 하얀 백조였어요.'],['이 이야기가 전하는 생각으로 알맞은 것은?','겉모습으로 남을 놀리면 안 돼요.',['못생기면 떠나야 해요.','겨울은 따뜻해요.','백조는 뽐내야 해요.'],'다르다고 놀림받던 아기가 사실은 아름다운 백조였어요.']]},
  {id:'hansel', e:'🍭', t:'헨젤과 그레텔', by:'그림 형제', pages:[
    ['🌲👦👧','가난한 나무꾼의 아이 헨젤과 그레텔은 숲에서 길을 잃고 말았어요. 헨젤이 길에 뿌려 둔 빵 부스러기를 새들이 모두 먹어 버렸거든요.'],
    ['🍬🏠','배가 고파 헤매던 남매 앞에 놀라운 집이 나타났어요. 벽은 과자, 지붕은 케이크, 창문은 사탕으로 만든 집이었어요! 남매는 정신없이 과자를 뜯어 먹었어요.'],
    ['🧙‍♀️','그때 문이 열리고 할머니가 나왔어요. “어서 들어오렴. 맛있는 걸 더 주마.” 하지만 할머니는 아이들을 잡아먹으려는 무서운 마녀였어요.'],
    ['🔒👦','마녀는 헨젤을 우리에 가두고 매일 음식을 먹였어요. 눈이 나쁜 마녀가 헨젤의 손가락을 만져 살이 쪘는지 확인하면, 헨젤은 꾀를 내어 가느다란 뼈다귀를 내밀었어요.'],
    ['🔥👧','기다리다 지친 마녀가 그레텔에게 말했어요. “아궁이에 불이 잘 붙었는지 들어가 보렴.” 그레텔은 “어떻게 들어가는지 모르겠어요.” 하고 모르는 척했어요.'],
    ['💨🧙‍♀️','“이렇게 하면 되잖니!” 마녀가 몸을 숙여 아궁이를 들여다보는 순간, 그레텔은 힘껏 마녀를 밀고 문을 쾅 닫았어요.'],
    ['💎🏡','그레텔은 오빠를 구해 냈어요. 둘은 마녀의 집에서 보석을 챙겨 집으로 돌아왔고, 아버지와 함께 행복하게 살았답니다.']],
    qs:[['남매가 길을 잃은 까닭은?','새들이 빵 부스러기를 먹어 버려서',['비가 와서','지도를 잃어버려서','잠이 들어서'],'빵 부스러기가 없어져 돌아갈 길을 몰랐어요.'],['헨젤이 마녀를 속인 방법은?','손가락 대신 뼈다귀를 내밀었어요.',['숨어 버렸어요.','노래를 불렀어요.','잠든 척했어요.'],'눈이 나쁜 마녀를 뼈다귀로 속였어요.'],['헨젤과 그레텔에게서 배울 점은?','위험할 때 침착하게 꾀를 내요.',['모르는 사람을 따라가요.','과자를 많이 먹어요.','혼자 도망쳐요.'],'두 남매는 지혜로 위기를 이겨 냈어요.']]},
  {id:'emperor', e:'👑', t:'벌거숭이 임금님', by:'안데르센', pages:[
    ['👑👗','옛날에 새 옷을 무척 좋아하는 임금님이 살았어요. 임금님은 하루에도 몇 번씩 옷을 갈아입으며 거울 앞에서 뽐냈어요.'],
    ['🧵🤥','어느 날 두 재봉사가 찾아왔어요. “저희는 세상에서 가장 멋진 옷감을 짭니다. 이 옷감은 어리석은 사람 눈에는 보이지 않지요.”'],
    ['🪡❓','재봉사들은 빈 베틀 앞에서 열심히 옷을 짜는 척했어요. 신하들이 가 보니 아무것도 보이지 않았어요. 하지만 어리석다는 말을 들을까 봐 “정말 아름답군요!” 하고 거짓말을 했어요.'],
    ['👑😳','임금님도 옷을 입어 보았어요. 거울에는 아무것도 보이지 않았지만, 임금님 역시 “훌륭하구나!” 하고 말했어요.'],
    ['🎺👥','임금님은 새 옷을 입고 거리 행진에 나섰어요. 백성들도 모두 “멋진 옷이다!” 하고 외쳤어요. 아무도 보이지 않는다고 말하지 못했지요.'],
    ['👦☝️','그때 한 아이가 큰 소리로 말했어요. “임금님이 아무것도 안 입었어요!”'],
    ['😆👑','그 말에 사람들이 하나둘 웃음을 터뜨렸어요. “정말이네, 아무것도 안 입었어!” 임금님은 얼굴이 빨개졌지만 행진을 끝까지 해야 했답니다.']],
    qs:[['재봉사들이 말한 옷감의 비밀은?','어리석은 사람 눈에는 보이지 않는다.',['물에 젖지 않는다.','밤에 빛난다.','절대 찢어지지 않는다.'],'재봉사들이 이렇게 거짓말을 했어요.'],['사람들이 옷이 안 보인다고 말하지 못한 까닭은?','어리석다는 말을 들을까 봐',['옷이 정말 보여서','임금님이 무서워서 노래해서','잠이 와서'],'모두 어리석어 보이기 싫었어요.'],['진실을 말한 사람은?','한 아이',['신하','재봉사','임금님'],'아이가 “아무것도 안 입었어요!” 하고 말했어요.']]},
  {id:'antgrass', e:'🐜', t:'개미와 베짱이', by:'이솝', pages:[
    ['☀️🐜','뜨거운 여름, 개미들은 줄지어 부지런히 먹이를 날랐어요. 땀을 뻘뻘 흘리면서도 쉬지 않았어요.'],
    ['🎻🦗','나무 그늘에서는 베짱이가 바이올린을 켜며 노래했어요. “개미야, 이렇게 좋은 날에 왜 일만 하니? 나랑 놀자!”'],
    ['🐜💬','“겨울이 오면 먹을 것이 없어. 지금 모아 두어야 해.” 개미가 말했지만 베짱이는 코웃음을 쳤어요. “겨울은 아직 멀었어!”'],
    ['❄️🦗','드디어 겨울이 왔어요. 온 세상이 눈으로 덮이자 베짱이는 먹을 것을 찾을 수 없었어요. 춥고 배가 고파 덜덜 떨었어요.'],
    ['🚪🐜','베짱이는 개미네 집 문을 두드렸어요. “개미야, 먹을 것 좀 나눠 줄 수 있니?”'],
    ['🍲🦗','개미는 베짱이를 따뜻한 집 안으로 들였어요. “자, 먹어. 대신 봄이 오면 너도 준비하는 법을 배워 보자.” 베짱이는 고개를 끄덕였어요.'],
    ['🌸🎶','봄이 되자 베짱이는 개미와 함께 일했어요. 일이 끝나면 베짱이가 연주하는 음악에 모두 신나게 춤을 추었답니다.']],
    qs:[['여름에 개미가 열심히 일한 까닭은?','겨울에 먹을 것을 모아 두려고',['노래 대회에 나가려고','집을 크게 지으려고','베짱이에게 팔려고'],'겨울에는 먹을 것이 없기 때문이에요.'],['겨울에 베짱이가 어려움을 겪은 까닭은?','미리 먹을 것을 모아 두지 않아서',['바이올린이 부서져서','개미와 싸워서','길을 잃어서'],'여름 내내 놀기만 했어요.'],['이 이야기가 전하는 교훈은?','앞날을 생각해 미리 준비해요.',['노는 것이 가장 중요해요.','겨울에는 일하지 않아요.','친구를 돕지 말아요.'],'부지런히 준비한 개미는 겨울을 잘 났어요.']]},
  {id:'sunwind', e:'🌬️', t:'해님과 바람', by:'이솝', pages:[
    ['☀️🌬️','어느 날 해님과 바람이 서로 자기가 더 힘이 세다고 다투었어요. “내 입김 한 번이면 나무도 쓰러진다고!” 바람이 뽐냈어요.'],
    ['🚶🧥','그때 두꺼운 외투를 입은 나그네가 길을 걸어갔어요. 해님이 말했어요. “저 나그네의 외투를 먼저 벗기는 쪽이 이기는 걸로 하자.”'],
    ['🌪️🧥','바람이 먼저 나섰어요. 휘이잉! 세찬 바람을 불었어요. 그러자 나그네는 “아이, 추워!” 하며 외투를 더 꽁꽁 여몄어요.'],
    ['🌪️😣','바람은 더 세게, 더 세게 불었어요. 하지만 바람이 셀수록 나그네는 외투를 더 단단히 붙잡았어요. 결국 바람은 지쳐 버렸어요.'],
    ['☀️😊','이번에는 해님 차례예요. 해님은 따뜻한 햇볕을 부드럽게 비추었어요. 나그네는 “날씨가 좋아졌네.” 하며 단추를 풀었어요.'],
    ['☀️🥵','해님이 조금 더 따스하게 비추자, 나그네는 “아이, 더워!” 하며 스스로 외투를 벗었어요. 해님이 이긴 거예요.'],
    ['☀️🌬️🤝','바람은 부끄러워하며 말했어요. “힘으로 억지로 하는 것보다 따뜻한 마음이 더 힘이 세구나.”']],
    qs:[['해님과 바람이 한 내기는?','나그네의 외투를 먼저 벗기기',['나무를 먼저 쓰러뜨리기','구름을 먼저 없애기','비를 먼저 내리게 하기'],'해님이 내기를 제안했어요.'],['바람이 세게 불자 나그네는 어떻게 했나요?','외투를 더 꽁꽁 여몄어요.',['외투를 벗었어요.','집으로 달려갔어요.','노래를 불렀어요.'],'추워서 외투를 붙잡았어요.'],['이 이야기의 교훈은?','억지로 하는 것보다 따뜻한 마음이 더 힘이 세요.',['바람이 가장 세요.','외투는 필요 없어요.','내기는 나빠요.'],'바람의 마지막 말을 보세요.']]},
  {id:'matchgirl', e:'🕯️', t:'성냥팔이 소녀', by:'안데르센', pages:[
    ['❄️👧','눈이 펑펑 내리는 한 해의 마지막 날 밤이었어요. 맨발의 작은 소녀가 추위에 떨며 성냥을 팔고 있었어요. “성냥 사세요, 성냥 사세요.” 하지만 아무도 사 주지 않았어요.'],
    ['🔥✨','소녀는 너무 추워서 성냥 하나를 그었어요. 치익! 작은 불꽃 속에 따뜻한 난로가 보였어요. 그런데 불꽃이 꺼지자 난로도 사라졌어요.'],
    ['🍗🎄','두 번째 성냥을 긋자 맛있는 음식이 차려진 식탁이 나타났고, 세 번째 성냥을 긋자 반짝이는 크리스마스트리가 나타났어요.'],
    ['⭐👵','소녀는 다시 성냥을 그었어요. 그러자 세상에서 소녀를 가장 사랑해 주셨던 할머니가 환하게 웃고 계셨어요. “할머니, 저도 데려가 주세요!”'],
    ['🔥🔥🔥','소녀는 할머니가 사라질까 봐 남은 성냥을 한꺼번에 모두 그었어요. 할머니는 소녀를 꼭 안고 따뜻하고 밝은 하늘나라로 날아올랐어요.'],
    ['🌅','다음 날 아침, 사람들은 미소를 띤 채 잠든 소녀를 발견했어요. 사람들은 그제야 소녀를 돌보지 못한 것을 슬퍼했답니다.']],

    ['🐦🍂','“이제 왕자님은 앞을 볼 수 없으니, 제가 곁에 있을게요.” 제비는 남쪽으로 떠나지 않았어요. 그리고 왕자 몸의 금박을 한 장씩 떼어 가난한 사람들에게 나누어 주었어요.'],

  {id:'axe', e:'🪓', t:'금도끼 은도끼', by:'우리 옛이야기', pages:[

    ['🧙‍♂️✨','산신령은 번쩍이는 금도끼를 들고 물었어요. “이 금도끼가 네 도끼냐?” “아닙니다. 제 도끼는 그저 낡은 쇠도끼입니다.”'],

    ['🍃','하지만 아침에 창문을 열자, 벽돌담에 잎 하나가 꿋꿋이 매달려 있었어요. 다음 날 밤에도 비바람이 불었지만 그 잎은 떨어지지 않았어요.'],
    ['😌','존시는 그 잎을 오래 바라보다가 말했어요. “수, 나는 나쁜 아이였어. 죽기를 바라는 건 잘못이야. 수프 좀 줄래?” 존시는 조금씩 기운을 되찾았어요.'],
    ['🎨💧','며칠 뒤 수가 존시에게 말했어요. “베어먼 할아버지가 폐렴으로 돌아가셨대. 비바람 치던 밤, 흠뻑 젖은 채 사다리와 물감 곁에서 발견되셨대.”'],
    ['🖼️','“저 담쟁이 잎을 봐. 바람이 불어도 한 번도 흔들리지 않잖아. 저게 바로 베어먼 할아버지의 걸작이야. 마지막 잎이 떨어지던 그날 밤, 할아버지가 저기에 그려 놓으신 거야.”']],
    qs:[['존시가 마지막 잎에 대해 가졌던 생각은?','마지막 잎이 떨어지면 자신도 죽을 것이다.',['마지막 잎은 그림일 것이다.','잎이 떨어지면 봄이 온다.','잎을 세면 병이 낫는다.'],'존시는 잎의 수와 자기 목숨을 연결 지어 생각했어요.'],['베어먼이 그린 ‘걸작’은 무엇이었나요?','벽돌담에 그린 마지막 담쟁이 잎',['존시의 얼굴','뉴욕의 풍경','비바람 치는 밤'],'비바람 치던 밤, 담에 잎을 그려 놓았어요.'],['이 작품의 주제로 가장 알맞은 것은?','남을 위해 자신을 희생한 사랑과 희망의 힘',['그림을 잘 그리는 방법','날씨가 건강에 미치는 영향','화가라는 직업의 어려움'],'베어먼의 희생이 존시에게 살아갈 희망을 주었어요.']]},
  {id:'gift', lv:2, e:'🎁', t:'크리스마스 선물', by:'오 헨리', pages:[
    ['🏠','가난한 젊은 부부 짐과 델라가 살고 있었어요. 크리스마스를 하루 앞둔 날, 델라가 가진 돈은 1달러 87센트뿐이었어요. 몇 달 동안 한 푼 두 푼 아껴 모은 돈이었지요.'],
    ['💎⌚','이 부부에게는 자랑스러운 보물이 두 가지 있었어요. 하나는 짐이 할아버지에게 물려받은 금시계였고, 또 하나는 무릎까지 내려오는 델라의 길고 아름다운 머리카락이었어요.'],
    ['✂️💇‍♀️','델라는 거울 앞에 오래 서 있다가 결심했어요. 가발 가게로 가서 자기 머리카락을 20달러에 팔았어요. 그리고 짐의 금시계에 어울리는 백금 시곗줄을 샀어요.'],
    ['😰','저녁에 짐이 돌아왔어요. 짧아진 델라의 머리를 본 짐은 멍하니 서 있었어요. 델라는 떨리는 목소리로 말했어요. “머리카락은 금방 자라요. 당신에게 멋진 선물을 하고 싶었어요.”'],
    ['📦🪮','짐은 델라를 꼭 안아 주고 작은 꾸러미를 건넸어요. 그 안에는 델라가 가게 진열장에서 오랫동안 바라만 보던, 보석이 박힌 아름다운 머리빗 세트가 들어 있었어요.'],
    ['⌚❌','델라는 눈물을 글썽이며 시곗줄을 내밀었어요. “어서 시계를 줘 봐요. 줄을 달아 보게요.” 짐은 소파에 기대어 웃으며 말했어요. “그 시계는 빗을 사려고 팔았어.”'],
    ['💞','두 사람은 서로를 위해 가장 소중한 것을 팔았어요. 그래서 서로가 준 선물은 당장 쓸 수 없게 되었어요.'],
    ['⭐','하지만 글쓴이는 말해요. 선물을 주고받는 모든 사람 가운데 이 두 사람이야말로 가장 지혜로운 사람들이라고요. 가장 소중한 것을 기꺼이 내어 준 사랑이 담긴 선물이었으니까요.']],
    qs:[['델라가 짐의 선물을 사려고 판 것은?','자신의 긴 머리카락',['금시계','보석 빗','집'],'가발 가게에 머리카락을 팔았어요.'],['짐이 델라에게 준 선물이 쓸모없게 된 까닭은?','델라가 머리카락을 잘라서',['빗이 부서져서','가게에서 잘못 사서','델라가 빗을 싫어해서'],'머리빗은 긴 머리에 쓰는 선물이었어요.'],['글쓴이가 두 사람을 가장 지혜롭다고 한 까닭은?','서로를 위해 가장 소중한 것을 기꺼이 내어 주었기 때문에',['비싼 선물을 샀기 때문에','돈을 많이 모았기 때문에','선물을 바꾸었기 때문에'],'선물의 값보다 그 안에 담긴 사랑이 중요해요.']]},
  {id:'tolstoy', lv:2, e:'😇', t:'사람은 무엇으로 사는가', by:'톨스토이', pages:[
    ['❄️👞','가난한 구두장이 세몬은 겨울 외투를 사려고 길을 나섰다가 돈을 받지 못하고 빈손으로 돌아오고 있었어요. 그런데 교회 담벼락 아래에 벌거벗은 젊은이가 추위에 떨며 쓰러져 있었어요.'],
    ['🧥','세몬은 그냥 지나치려다 마음을 돌렸어요. 자기 외투를 벗어 입혀 주고 집으로 데려왔지요. 아내 마트료나는 처음엔 화를 냈지만, 이내 마음이 누그러져 남은 빵을 나누어 주었어요. 그러자 젊은이가 처음으로 빙그레 웃었어요.'],
    ['🪡','젊은이의 이름은 미하일이었어요. 미하일은 세몬에게 구두 만드는 법을 배웠는데, 솜씨가 어찌나 좋은지 마을에 소문이 퍼졌어요. 하지만 미하일은 거의 말이 없었고 웃지도 않았어요.'],
    ['🤵‍♂️','어느 날 덩치 큰 부자 신사가 비싼 가죽을 가져와 말했어요. “1년을 신어도 모양이 변하지 않는 장화를 만들어라!” 그때 미하일은 신사 뒤쪽을 보더니 두 번째로 웃었어요. 그리고 장화가 아닌 죽은 사람에게 신기는 부드러운 슬리퍼를 만들었어요.'],
    ['⚰️','얼마 뒤 하인이 달려왔어요. “주인님이 돌아가셨어요. 장화 대신 장례에 쓸 슬리퍼를 만들어 주세요.” 부자는 1년 뒤를 준비했지만, 오늘 저녁 자기에게 무엇이 필요한지 알지 못했던 거예요.'],
    ['👩‍👧‍👧','몇 년 뒤, 한 부인이 쌍둥이 여자아이를 데리고 구두를 맞추러 왔어요. 부인은 그 아이들이 친자식이 아니라고 했어요. 부모를 잃은 아기들을 데려다 정성껏 키웠다고요. 그 말을 들은 미하일은 세 번째로 웃었어요.'],
    ['✨👼','그러자 미하일의 몸에서 빛이 났어요. 미하일은 사실 하느님의 벌을 받아 땅에 내려온 천사였어요. 세 가지 물음의 답을 깨달으면 하늘로 돌아갈 수 있었지요.'],
    ['📜','“사람 안에 무엇이 있는가? 사랑이 있었습니다. 사람에게 허락되지 않은 것은 무엇인가? 자기에게 정말 필요한 것을 아는 힘이었습니다. 사람은 무엇으로 사는가? 사람은 사랑으로 삽니다.”'],
    ['🕊️','미하일은 노래를 부르며 하늘로 올라갔어요. 세몬의 집에는 따뜻한 빛만이 오래도록 남아 있었답니다.']],
    qs:[['미하일이 처음으로 웃은 때는?','마트료나가 화를 풀고 빵을 나누어 주었을 때',['장화를 주문받았을 때','쌍둥이를 보았을 때','구두를 처음 만들었을 때'],'사람 안에 사랑이 있음을 보았어요.'],['부자 신사의 이야기가 보여 주는 것은?','사람은 자기에게 정말 필요한 것을 알지 못한다.',['부자는 언제나 행복하다.','비싼 가죽이 좋은 장화를 만든다.','구두장이는 거짓말을 잘한다.'],'1년 뒤를 걱정했지만 그날 저녁에 세상을 떠났어요.'],['작품이 말하는 ‘사람이 사는 힘’은?','사랑',['돈','힘','지식'],'미하일이 깨달은 마지막 답이에요.']]},
  {id:'stoneface', lv:2, e:'🗿', t:'큰 바위 얼굴', by:'너새니얼 호손', pages:[
    ['⛰️','어느 골짜기 마을 앞 산에는 사람 얼굴을 닮은 커다란 바위가 있었어요. 사람들은 그것을 ‘큰 바위 얼굴’이라 불렀어요. 그 얼굴은 너그럽고 따뜻해서 바라보기만 해도 마음이 편안해졌어요.'],
    ['👦','마을에는 이런 전설이 있었어요. “언젠가 이 골짜기에서 큰 바위 얼굴을 닮은 훌륭한 사람이 나타날 것이다.” 어린 어니스트는 어머니에게 그 이야기를 듣고, 날마다 큰 바위 얼굴을 바라보며 그 사람을 기다렸어요.'],
    ['💰','어느 날 큰돈을 번 부자 ‘개더골드’가 돌아왔어요. 사람들은 “드디어 그분이 오셨다!” 하고 환호했어요. 하지만 어니스트가 본 그의 얼굴은 욕심으로 가득했어요.'],
    ['⚔️','다음에는 전쟁에서 이긴 장군 ‘올드 블러드 앤 선더’가 돌아왔어요. 그 다음에는 말솜씨가 뛰어난 정치가가 나타났어요. 그때마다 사람들은 기뻐했지만, 어니스트의 눈에는 큰 바위 얼굴의 따뜻함이 보이지 않았어요.'],
    ['👴📖','세월이 흘러 어니스트는 머리가 하얀 노인이 되었어요. 그는 평생 성실하게 일하고, 이웃을 돕고, 날마다 큰 바위 얼굴을 바라보며 생각했어요. 사람들은 어느새 어니스트의 이야기를 들으러 찾아왔어요.'],
    ['✍️','어느 날 유명한 시인이 어니스트를 찾아왔어요. 어니스트는 그 시인이야말로 기다리던 사람일까 기대했지만, 시인은 고개를 저었어요. “제 시는 아름답지만, 저는 제가 쓴 대로 살지 못했습니다.”'],
    ['🌅','해 질 무렵, 어니스트가 마을 사람들 앞에서 이야기를 했어요. 그의 말에는 평생 살아온 삶이 그대로 담겨 있었어요. 그때 시인이 외쳤어요. “보세요! 어니스트 씨가 바로 큰 바위 얼굴과 닮았습니다!”'],
    ['🙏','하지만 어니스트는 조용히 집으로 돌아가며 생각했어요. ‘언젠가 나보다 더 훌륭한 사람이 나타나겠지.’ 그는 끝까지 겸손했어요.']],
    qs:[['사람들이 처음에 기대했던 인물들의 공통점은?','돈, 힘, 말솜씨처럼 겉으로 드러난 것이 대단한 사람',['마음이 따뜻한 사람','골짜기에서 태어난 농부','큰 바위 얼굴을 조각한 사람'],'부자, 장군, 정치가는 모두 겉모습이 화려했어요.'],['결국 큰 바위 얼굴을 닮은 사람은?','어니스트',['개더골드','장군','시인'],'시인이 어니스트를 보고 외쳤어요.'],['어니스트가 큰 바위 얼굴을 닮게 된 까닭은?','평생 바르게 살며 큰 바위 얼굴을 닮고자 했기 때문에',['얼굴을 조각했기 때문에','유명해졌기 때문에','부자가 되었기 때문에'],'마음과 삶이 얼굴에 드러난다는 이야기예요.']]},
  {id:'lastlesson', lv:2, e:'🏫', t:'마지막 수업', by:'알퐁스 도데', pages:[
    ['🏃','그날 아침 프란츠는 학교에 늦었어요. 게다가 아멜 선생님이 분사 규칙을 물어보겠다고 하셨는데 하나도 공부하지 않았지요. 차라리 들판에서 놀까 하다가, 꾹 참고 학교로 달려갔어요.'],
    ['🏫🤫','그런데 교실이 이상했어요. 늘 시끌벅적하던 교실이 조용했고, 선생님은 특별한 날에만 입는 멋진 옷을 입고 계셨어요. 교실 뒤쪽에는 마을 어른들까지 슬픈 얼굴로 앉아 있었어요.'],
    ['📢','아멜 선생님이 천천히 말씀하셨어요. “여러분, 오늘이 나의 마지막 수업입니다. 베를린에서 명령이 왔습니다. 이제부터 알자스와 로렌의 학교에서는 독일어만 가르쳐야 합니다.”'],
    ['😢','프란츠는 가슴이 철렁했어요. ‘이제 프랑스어를 배울 수 없다니! 나는 겨우 글을 쓸 줄 아는 정도인데…….’ 귀찮기만 하던 문법책이 갑자기 오랜 친구처럼 느껴졌어요.'],
    ['🙋‍♂️','선생님이 프란츠에게 분사 규칙을 물으셨지만, 프란츠는 한마디도 대답하지 못했어요. 선생님은 꾸짖지 않으셨어요. “‘내일 하면 되지’ 하며 미루어 온 것이 우리 모두의 잘못이란다.”'],
    ['🔑','선생님은 말씀하셨어요. “프랑스어는 세상에서 가장 아름답고 분명한 말입니다. 그 말을 잘 지키고 절대 잊지 마세요. 나라를 빼앗긴 백성이라도 자기 말을 지키고 있으면, 감옥의 열쇠를 쥐고 있는 것과 같습니다.”'],
    ['✍️','그날 수업은 너무나 쉽게 느껴졌어요. 프란츠는 한 글자 한 글자 정성껏 글씨를 썼어요. 지붕 위에서는 비둘기가 구구 울었어요. ‘저 비둘기들에게도 독일어로 울라고 하려나?’'],
    ['🕛','정오를 알리는 종이 울리고, 밖에서 프로이센 군인들의 나팔 소리가 들렸어요. 선생님은 창백한 얼굴로 칠판에 커다랗게 쓰셨어요. “프랑스 만세!” 그리고 벽에 머리를 기댄 채, 손짓으로 말씀하셨어요. “이제 끝났습니다. 돌아가세요.”']],
    qs:[['오늘이 마지막 수업인 까닭은?','이제부터 독일어만 가르치라는 명령이 내려와서',['선생님이 이사를 가셔서','학교가 문을 닫아서','방학이 시작되어서'],'베를린에서 명령이 왔어요.'],['“감옥의 열쇠를 쥐고 있는 것과 같다”는 말의 뜻은?','자기 나라 말을 지키면 언젠가 자유를 되찾을 힘이 있다.',['감옥에 가지 말아야 한다.','열쇠를 잃어버리면 안 된다.','외국어를 빨리 배워야 한다.'],'말은 민족의 정신을 지키는 힘이에요.'],['이 작품이 우리에게 주는 교훈으로 알맞은 것은?','소중한 것은 잃기 전에 아끼고 미루지 말아야 한다.',['공부는 내일 해도 된다.','지각은 괜찮다.','선생님 옷은 중요하다.'],'프란츠는 ‘내일 하면 되지’ 했던 것을 후회했어요.']]},
  {id:'stars', lv:2, e:'✨', t:'별', by:'알퐁스 도데', pages:[
    ['⛰️🐑','나는 프로방스 지방의 높은 산 위에서 양을 치는 목동이었어요. 몇 주 동안 사람 얼굴은 한 번도 보지 못하고, 개 라브리와 양들하고만 지냈어요.'],
    ['🧺','보름마다 농장에서 식량을 실은 노새가 올라왔어요. 그때마다 나는 산 아래 소식, 특히 주인집 아가씨 스테파네트의 소식이 가장 궁금했어요. 스테파네트는 이 근방에서 가장 아름다운 아가씨였거든요.'],
    ['🐴👧','어느 일요일, 식량이 늦게 도착했어요. 그런데 노새를 몰고 온 사람은 뜻밖에도 스테파네트 아가씨였어요! 심부름꾼이 아파서 대신 왔다고 했어요. 나는 너무 놀라 말도 제대로 하지 못했어요.'],
    ['🌊🌧️','아가씨는 내 오두막을 신기한 듯 둘러보고 산을 내려갔어요. 그런데 얼마 뒤 흠뻑 젖은 채 돌아왔어요. 소나기로 강물이 불어나 건널 수가 없었던 거예요. 아가씨는 어쩔 수 없이 산에서 밤을 보내야 했어요.'],
    ['🔥','나는 오두막에 새 짚을 깔고 아가씨가 쉬게 해 드렸어요. 그리고 밖에 나와 모닥불 곁에 앉았어요. 잠시 뒤, 잠이 오지 않는다며 아가씨가 나와 모닥불 곁에 앉았어요.'],
    ['🌌','밤하늘에는 별이 가득했어요. 아가씨가 물었어요. “저 별들 이름을 아세요?” 나는 목동들이 부르는 별 이름을 하나하나 들려주었어요. 은하수는 ‘성 자크의 길’, 가장 밝은 별은 ‘목동의 별’이라고요.'],
    ['😴','이야기를 듣던 아가씨는 어느새 내 어깨에 머리를 기대고 잠이 들었어요. 나는 꼼짝도 하지 않고 밤새 그대로 앉아 있었어요. 마음은 맑고 깨끗했어요.'],
    ['⭐','나는 생각했어요. 저 수많은 별 가운데 가장 곱고 가장 빛나는 별 하나가 길을 잃고 내려와, 지금 내 어깨에 기대어 잠들어 있다고요.']],
    qs:[['스테파네트가 산에서 밤을 보내게 된 까닭은?','소나기로 강물이 불어 건널 수 없어서',['길을 잃어서','별을 보고 싶어서','노새가 도망가서'],'강을 건너지 못해 돌아왔어요.'],['목동이 밤새 꼼짝하지 않은 까닭은?','잠든 아가씨가 깨지 않도록 조심해서',['추워서','양을 지키느라','무서워서'],'어깨에 기대어 잠든 아가씨를 배려했어요.'],['마지막 문장에서 ‘길을 잃고 내려온 별’은 누구를 빗댄 말인가요?','스테파네트 아가씨',['목동','개 라브리','노새'],'가장 아름다운 존재를 별에 빗대었어요.']]},
  {id:'necklace', lv:2, e:'📿', t:'목걸이', by:'기 드 모파상', pages:[
    ['🏠💭','마틸드는 아름다웠지만 가난한 하급 공무원과 결혼해 살았어요. 그녀는 늘 화려한 저택과 값비싼 드레스, 보석을 꿈꾸며 자기 처지를 불행하다고 여겼어요.'],
    ['✉️','어느 날 남편이 장관이 여는 무도회 초대장을 가져왔어요. 하지만 마틸드는 울상이었어요. “입을 옷도, 걸칠 보석도 없는데 어떻게 가요?” 남편은 사냥총을 사려고 모아 둔 돈으로 드레스를 사 주었어요.'],
    ['💎','마틸드는 부자 친구 포레스티에 부인에게 다이아몬드 목걸이를 빌렸어요. 무도회에서 마틸드는 가장 아름다운 여인이었어요. 모두가 그녀에게 춤을 청했지요.'],
    ['😱','그런데 집에 돌아와 보니 목걸이가 없었어요! 부부는 밤새 길거리와 마차 회사를 뒤졌지만 끝내 찾지 못했어요.'],
    ['💸','부부는 보석 가게에서 똑같은 목걸이를 3만 6천 프랑에 샀어요. 가진 돈을 다 털고, 여기저기서 큰 빚을 졌지요. 그리고 친구에게 아무 말 없이 목걸이를 돌려주었어요.'],
    ['🧹','그 뒤 10년 동안 마틸드는 하녀를 내보내고 작은 다락방으로 이사했어요. 손수 빨래하고, 무거운 물통을 나르고, 시장에서 한 푼이라도 깎았어요. 곱던 손은 거칠어지고 얼굴은 부쩍 늙어 버렸어요.'],
    ['🌳','드디어 빚을 다 갚은 어느 날, 마틸드는 공원에서 여전히 젊고 아름다운 포레스티에 부인을 만났어요. 마틸드는 그동안의 일을 모두 털어놓았어요. “네 목걸이를 잃어버려서 그걸 갚느라 10년을 고생했어.”'],
    ['😨','포레스티에 부인은 깜짝 놀라 마틸드의 손을 잡았어요. “아, 가엾은 마틸드! 내 목걸이는 가짜였어. 기껏해야 500프랑짜리였단다!”']],
    qs:[['마틸드가 늘 불행하다고 여긴 까닭은?','화려하게 살고 싶은데 가난해서',['병이 들어서','친구가 없어서','남편이 나빠서'],'화려한 삶을 꿈꾸며 자기 처지를 불만스러워했어요.'],['마틸드가 10년 동안 고생한 까닭은?','잃어버린 목걸이 값의 빚을 갚느라',['무도회에 또 가려고','드레스를 사려고','이사를 가려고'],'새 목걸이를 사느라 큰 빚을 졌어요.'],['이 작품의 반전(뜻밖의 결말)은?','빌린 목걸이는 사실 값싼 가짜였다.',['목걸이를 다시 찾았다.','남편이 목걸이를 훔쳤다.','친구가 목걸이를 선물로 주었다.'],'마지막 한마디가 모든 고생을 허무하게 만들어요.']]},
  {id:'carol', lv:2, e:'🎄', t:'크리스마스 캐럴', by:'찰스 디킨스', pages:[
    ['💰🧓','런던의 스크루지 영감은 소문난 구두쇠였어요. 크리스마스이브에도 추운 사무실에서 점원 밥 크래칫에게 석탄 한 덩이 아끼라며 호통을 쳤어요. “크리스마스라고? 흥, 쓸데없는 소리!”'],
    ['👻⛓️','그날 밤, 7년 전에 죽은 동업자 말리의 유령이 무거운 쇠사슬을 끌고 나타났어요. “나는 살아서 돈만 알았던 벌로 이 사슬을 끌고 다닌다네. 오늘 밤 유령 셋이 자네를 찾아올 걸세.”'],
    ['🕯️','첫 번째는 ‘과거의 크리스마스 유령’이었어요. 스크루지는 외롭던 어린 시절과, 돈을 좇느라 사랑하던 사람을 떠나보낸 젊은 날의 자신을 보았어요. 스크루지의 눈시울이 붉어졌어요.'],
    ['🍗👨‍👩‍👧‍👦','두 번째는 ‘현재의 크리스마스 유령’이었어요. 밥 크래칫의 가난한 집에서는 가족이 작은 음식을 나누며 행복하게 웃고 있었어요. 하지만 다리가 불편한 막내 팀은 몹시 아파 보였어요. “팀은 살 수 있나요?” 스크루지가 물었어요.'],
    ['🌑','세 번째는 말이 없는 ‘미래의 크리스마스 유령’이었어요. 스크루지는 아무도 슬퍼하지 않는 한 남자의 죽음과, 팀이 없는 크래칫 가족의 슬픈 식탁을 보았어요. 이름 없는 묘비에는 ‘에버니저 스크루지’라고 쓰여 있었어요.'],
    ['🙏','“제발, 제가 달라지겠습니다! 과거와 현재와 미래를 모두 마음에 새기겠습니다!” 스크루지가 울부짖는 순간, 눈을 떠 보니 자기 침대였어요. 크리스마스 아침이었어요!'],
    ['🦃🎁','스크루지는 창문을 열고 소년에게 가장 큰 칠면조를 사서 크래칫 집에 보내 달라고 했어요. 그리고 가난한 사람들을 돕는 데 큰돈을 내고, 조카의 크리스마스 파티에도 찾아갔어요.'],
    ['😊','다음 날 스크루지는 밥의 월급을 올려 주었어요. 팀에게는 두 번째 아버지가 되어 주었고, 팀은 건강을 되찾았어요. 사람들은 말했어요. “스크루지만큼 크리스마스를 잘 보내는 사람은 없다!”']],
    qs:[['말리의 유령이 쇠사슬을 끌고 다닌 까닭은?','살아 있을 때 돈만 알았던 벌 때문에',['감옥에서 도망쳐서','크리스마스를 좋아해서','스크루지에게 선물하려고'],'욕심으로 살아온 삶의 무게예요.'],['스크루지가 달라지기로 결심한 결정적 장면은?','미래에 아무도 슬퍼하지 않는 자기 죽음을 보았을 때',['칠면조를 샀을 때','월급을 올렸을 때','석탄을 아꼈을 때'],'이름 없는 묘비에서 자기 이름을 보았어요.'],['이 작품의 주제로 알맞은 것은?','나누고 베푸는 삶의 소중함',['돈을 아끼는 방법','유령의 무서움','크리스마스 음식 만들기'],'구두쇠가 나눔의 기쁨을 깨닫는 이야기예요.']]},
  {id:'miserables', lv:2, e:'🕯️', t:'레 미제라블', by:'빅토르 위고', pages:[
    ['🍞','장 발장은 굶주린 조카들을 위해 빵 한 조각을 훔치다 붙잡혔어요. 탈옥을 하려다 형이 늘어나 무려 19년을 감옥에서 보냈어요. 풀려났을 때 그의 마음은 세상에 대한 분노로 가득 차 있었어요.'],
    ['🚪','전과자라는 노란 통행증 때문에 어느 여관도 그를 받아 주지 않았어요. 추위에 떨던 장 발장은 미리엘 주교의 집 문을 두드렸어요. 주교는 그를 “형제여” 하고 부르며 따뜻한 저녁을 차려 주고 잠자리를 내주었어요.'],
    ['🥄','그러나 한밤중, 장 발장은 주교의 은식기를 훔쳐 달아났어요. 다음 날 아침 헌병들이 그를 붙잡아 주교 앞에 끌고 왔어요.'],
    ['🕯️🕯️','주교는 뜻밖의 말을 했어요. “아, 왔구려! 은촛대도 드렸는데 왜 두고 가셨소?” 그리고 헌병들이 떠나자 조용히 말했어요. “이 은으로 정직한 사람이 되겠다고 약속하시오. 나는 당신의 영혼을 산 것이오.”'],
    ['😭','장 발장은 한참 동안 울었어요. 태어나 처음 받아 보는 용서와 사랑이었어요. 그는 그날부터 완전히 다른 사람이 되기로 결심했어요.'],
    ['🏭','몇 년 뒤, 장 발장은 이름을 바꾸고 공장을 세워 가난한 사람들에게 일자리를 주었어요. 사람들의 존경을 받아 시장까지 되었지요. 그는 가엾은 여인 판틴을 도와주고, 그녀의 딸 코제트를 끝까지 지켜 주겠다고 약속했어요.'],
    ['👮','그런데 끈질긴 경감 자베르가 늘 그를 의심하며 뒤쫓았어요. 게다가 다른 사람이 장 발장으로 몰려 재판을 받게 되자, 장 발장은 모든 것을 잃을 줄 알면서도 법정에 나가 말했어요. “내가 장 발장이오.”'],
    ['👧❤️','장 발장은 평생 쫓기면서도 코제트를 친딸처럼 사랑으로 키웠어요. 삶의 마지막 날, 그는 주교가 준 은촛대의 불빛 아래에서 코제트의 손을 잡고 평화롭게 눈을 감았어요.']],
    qs:[['장 발장이 처음 감옥에 간 까닭은?','굶주린 조카들을 위해 빵을 훔쳐서',['은식기를 훔쳐서','싸움을 해서','공장을 세워서'],'빵 한 조각 때문에 시작된 일이었어요.'],['주교가 은촛대까지 내어 준 까닭은?','장 발장을 용서하고 새 사람이 되게 하려고',['은촛대가 싫어서','헌병이 무서워서','장 발장이 친척이어서'],'“나는 당신의 영혼을 산 것이오.”'],['장 발장이 법정에 나가 자신을 밝힌 행동에서 알 수 있는 것은?','자기를 희생하더라도 정직하게 살려는 마음',['유명해지고 싶은 마음','자베르를 이기려는 마음','시장 자리를 지키려는 마음'],'죄 없는 사람이 벌받지 않게 했어요.']]},
  {id:'venice', lv:2, e:'⚖️', t:'베니스의 상인', by:'윌리엄 셰익스피어', pages:[
    ['⛵','베니스의 상인 안토니오는 마음씨 좋고 너그러운 사람이었어요. 친구 바사니오가 벨몬트의 지혜로운 여인 포샤에게 청혼하려는데 돈이 없다고 하자, 안토니오는 기꺼이 돕기로 했어요.'],

/* 📚 명작 도서관: 책장 → 한 장씩 읽기 → 퀴즈 3문제 (국어 기록으로 쳐요) */

const backBtn = (act, top) => `<div class="back-row ${top?'top':''}"><button class="back-btn" data-act="${act}">◀ 책장으로</button></div>`;
function libTileHTML(){
  const r=libDone(), n=LIB_BOOKS.filter(b=>r[b.id]!==undefined).length;
  return `<button class="subj lib-tile" data-act="libOpen"><span class="ico">📚</span><span><b>명작 도서관</b><br><small>세계 명작 · 우리 옛이야기 ${n} / ${LIB_BOOKS.length}권 읽음</small></span></button>`;
}
function libNext(id){ const r=libDone(), me=LIB_BOOKS.find(b=>b.id===id), L=LIB_BOOKS.filter(b=>(b.lv||1)===((me&&me.lv)||1)), i=L.findIndex(b=>b.id===id); return L.slice(i+1).find(b=>r[b.id]===undefined)||L.find(b=>r[b.id]===undefined&&b.id!==id)||L[(i+1)%L.length]; }
function renderLibrary(){
  const bk=LIB_BOOKS.find(b=>b.id===App.lib), r=libDone();

    view.innerHTML=`<div class="card"><p class="big" style="margin:0">📚 명작 도서관</p>
      <p class="sub" style="margin:6px 0 0">오래도록 사랑받은 세계 명작과 우리 옛이야기예요. 한 페이지에서 이어 읽거나 📖 책 읽기 모드로 들으며 읽고, 다 읽으면 퀴즈 3문제! (${LIB_BOOKS.filter(b=>r[b.id]!==undefined).length} / ${LIB_BOOKS.length}권 읽음)</p></div>
      ${LIB_LV.map(([lv,nm,sb])=>`<p class="lib-sec">${nm} <small>${sb}</small></p><div class="lib-shelf">${LIB_BOOKS.filter(b=>(b.lv||1)===lv).map(b=>`<button class="lib-book ${r[b.id]!==undefined?'read':''}" data-act="libOpen" data-v="${b.id}">${r[b.id]!==undefined?`<span class="done">${r[b.id]===3?'🏅':'✔'} ${r[b.id]}/3</span>`:''}<span class="bk-e">${b.e}</span><b>${b.t}</b><small>${b.by}</small></button>`).join('')}</div>`).join('')}`;

function drawLibQuiz(bk){
  if(LQ.done){
    const nx=libNext(bk.id);
    view.innerHTML=`<div class="card center"><p class="sub">${bk.e} ${bk.t}</p><p class="big">${LQ.score===3?'🏆 3문제 모두 한 번에!':`3문제 중 ${LQ.score}개를 한 번에 맞혔어요!`}</p>
      <p>받은 별 ⭐ ${LQ.earned}개</p>
      <button class="big-btn" data-act="libOpen" data-v="${nx.id}">📖 다음 책: ${nx.e} ${nx.t}</button>
      <div class="center"><button class="linkbtn" data-act="libOpen" data-v="${bk.id}">↺ 이 책 다시 읽기</button></div></div>${backBtn('libClose')}`;
    return;
  }
  const q=LQ.list[LQ.i], cls=i=>LQ.solved&&q.choices[i]===q.ans?'ok':(LQ.picked.includes(i)?'no':'');
  view.innerHTML=`${backBtn('libClose',true)}<div class="card"><div class="qtop"><span>${bk.e} ${bk.t} 퀴즈 · ${LQ.i+1} / 3</span><span>⭐ ${LQ.score}</span></div>
    <div class="sq ko-q">${esc(q.q)}</div>
    <div class="choices words">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="libPick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
    ${LQ.note?`<div class="hint">${LQ.note}</div>`:''}${LQ.solved?'':skipBtn('libSkip')}</div>`;
}
function libAnswer(i){
  if(!LQ||LQ.solved||LQ.done) return;
  const q=LQ.list[LQ.i], skip=i<0;
  if(!skip && q.choices[i]===q.ans){
    LQ.solved=true; beep(true); markO(); logToday('korean', !LQ.tried, '명작 도서관');
    if(!LQ.tried){ LQ.score++; addStar(1); }
    LQ.note=`<span class="praise">${praise()}</span>`;
  } else if(!skip){
    if(LQ.picked.includes(i)) return;
    LQ.tried=true; LQ.picked.push(i); beep(false); LQ.note='💡 이야기를 다시 떠올려 봐요. '+esc(q.explain); renderLibrary(); return;
  } else {
    LQ.tried=true; LQ.solved=true; beep(false); logToday('korean', false, '명작 도서관');
    LQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${esc(q.explain)}</small>`;
  }
  renderLibrary();
  const me=LQ;
  setTimeout(()=>{
    if(LQ!==me) return;
    LQ.i++; LQ.tried=false; LQ.solved=false; LQ.picked=[]; LQ.note='';
    if(LQ.i>=LQ.list.length){
      LQ.done=true; LQ.earned=LQ.score+(LQ.score===3?1:0);
      if(LQ.score===3){ addStar(1); burst(); }
      const r=libDone(); r[LQ.id]=Math.max(r[LQ.id]===undefined?-1:r[LQ.id], LQ.score); store.set('lib',r); cloudPush();
    }
    if(App.view==='library') renderLibrary();
  }, skip?2600:1400);
}

const cxDanTxt = (a,b) => Array.from({length:b},(_,i)=>a*(i+1)).join(', ');
/* 세로셈 판 */
function cxVert(P){
  const {a,b,op}=P.v, ans=op==='-'?a-b:a+b, n=Math.max(String(a).length,String(b).length,String(ans).length);
  const dig=(x,i)=>{ const s=String(x), k=s.length-1-i; return k>=0?s[k]:''; };
  const show=P.showHint||P.done, marks=Array(n).fill(''), strike=Array(n).fill(false);
  if(show){
    if(op==='+'){ let c=0; for(let i=0;i<n;i++){ c=((+dig(a,i)||0)+(+dig(b,i)||0)+c)>=10?1:0; if(c&&i+1<n) marks[i+1]='1'; } }
    else { const top=[...Array(n+1)].map((_,i)=>+dig(a,i)||0), org=top.slice();
      for(let i=0;i<n;i++) if(top[i]<(+dig(b,i)||0)){ top[i]+=10; top[i+1]-=1; }
      for(let i=0;i<n;i++) if(top[i]!==org[i]&&dig(a,i)!==''){ marks[i]=String(top[i]); strike[i]=true; } }
  }
  const cols=[...Array(n)].map((_,k)=>n-1-k), PL=['일','십','백','천','만'];
  const cell=i=>`<button class="cell ${!P.done&&P.sel===i?'active':''} ${P.cells[i]!==''?'done':''}" data-act="cxSel" data-v="${i}" aria-label="${PL[i]}의 자리">${P.cells[i]}</button>`;
  return `<div class="card board cx-v"><div class="vgrid" id="cxgrid" style="--n:${n}">
    <div></div>${cols.map(i=>`<div class="colname">${PL[i]}</div>`).join('')}
    <div></div>${cols.map(i=>`<div>${marks[i]?`<div class="cell carry done">${marks[i]}</div>`:''}</div>`).join('')}
    <div></div>${cols.map(i=>`<div class="dg" ${strike[i]?'style="text-decoration:line-through;text-decoration-color:var(--no)"':''}>${dig(a,i)}</div>`).join('')}
    <div class="dg op">${op==='-'?'−':'+'}</div>${cols.map(i=>`<div class="dg">${dig(b,i)}</div>`).join('')}
    <div class="bar"></div>
    <div></div>${cols.map(i=>`<div>${cell(i)}</div>`).join('')}
  </div><div class="hint">${P.done?P.msg:P.showHint?cxVHint(P):'칸을 눌러 자리를 고르고 답을 써요.'}</div></div>`;
}
function cxVHint(P){
  const {a,b,op}=P.v, PL=['일','십','백','천'], n=Math.max(String(a).length,String(b).length), d=(x,i)=>+String(x).padStart(n+1,'0').slice(-1-i)[0]||0, out=[];
  if(op==='+'){ let c=0; for(let i=0;i<n;i++){ const s=d(a,i)+d(b,i)+c; out.push(`${PL[i]}의 자리: ${c?'1 + ':''}${d(a,i)} + ${d(b,i)} = ${s}${s>=10?` → <b>${s%10}</b> 쓰고 1 올림`:''}`); c=s>=10?1:0; } }
  else { const top=[...Array(n+1)].map((_,i)=>d(a,i)); for(let i=0;i<n;i++){ const bi=d(b,i);
    if(top[i]<bi){ out.push(`${PL[i]}의 자리: ${top[i]}에서 ${bi}을(를) 뺄 수 없어요 → 10을 빌려 와요: ${top[i]+10} − ${bi} = <b>${top[i]+10-bi}</b>`); top[i]+=10; top[i+1]-=1; }
    else if(top[i]||bi||i<String(a).length) out.push(`${PL[i]}의 자리: ${top[i]} − ${bi} = <b>${top[i]-bi}</b>`); } }
  return out.join('<br>');
}
/* 가로식: {0} {1} … 자리에 답 칸 */
function cxHoriz(P){
  const slot=i=>`<span class="cx-sw"><button class="cx-slot ${!P.done&&P.sel===i?'on':''} ${P.done?'ok':''}" data-act="cxSel" data-v="${i}" aria-label="${P.lab?P.lab[i]:'답'} 칸">${P.in[i]||''}</button>${P.lab&&!P.hideLab?`<small>${P.lab[i]}</small>`:''}</span>`;
  return `<div class="card board cx-h">${P.fig||''}<div class="cx-q">${P.h.replace(/\{(\d)\}/g,(m,i)=>slot(+i))}</div>
    <div class="hint">${P.done?P.msg:P.showHint&&P.hint?P.hint:P.ans.length>1?'칸을 눌러 고르고 답을 써요.':'답을 누르고 확인!'}</div></div>`;
}
function cxPad(P){
  const ex=[]; if(P.dec) ex.push(['.','소수점 .']); if(P.ans&&P.ans.length>1) ex.push(['next','다음 칸 ▶']);
  return `<div class="keypad cx-pad">${[7,8,9,4,5,6,1,2,3].map(k=>`<button class="key" data-act="cxKey" data-v="${k}">${k}</button>`).join('')}
    <button class="key fn" data-act="cxKey" data-v="del">⌫ 지우기</button><button class="key" data-act="cxKey" data-v="0">0</button><button class="key ok" data-act="cxKey" data-v="ok">확인</button>
    ${ex.map(([v,l])=>`<button class="key fn ${ex.length===1?'wide':''}" data-act="cxKey" data-v="${v}">${l}</button>`).join('')}</div>`;
}
let CX=null;
function cxLv(){ if(App.clv===undefined) App.clv=store.get('clv',0); if(!CALC_LEVELS[App.clv]) App.clv=0; return CALC_LEVELS[App.clv]; }
function cxNew(){
  const lv=cxLv(), P=lv.g(App.cdan||'mix');
  if(P.v){ const {a,b,op}=P.v, ans=op==='-'?a-b:a+b; P.n=Math.max(String(a).length,String(b).length,String(ans).length); P.cells=Array(P.n).fill(''); }
  else P.in=P.ans.map(()=>'');
  return Object.assign(P,{lv:App.clv, dan:App.cdan, sel:0, wrong:0, miss:false, showHint:false, done:false, msg:''});
}
function renderCalc(){
  const lv=cxLv(), ok=store.get('cxok',{});
  view.innerHTML=`<div class="seg small cx-lvs">${CALC_LEVELS.map((l,i)=>`<button class="pill ${i===App.clv?'on':''}" data-act="cxLv" data-v="${i}">${i+1}. ${l.n}${ok[i]>=20?' 🏅':ok[i]?' ✔':''}</button>`).join('')}</div>
    ${lv.subs?`<div class="seg small">${Object.entries(lv.subs).map(([k,t])=>`<button class="pill ${(App.cdan||'mix')===k?'on':''}" data-act="cxDan" data-v="${k}">${t}</button>`).join('')}</div>`:''}
    <p class="desc">${lv.d}${ok[App.clv]?` · 이 단계에서 맞힌 문제 <b>${ok[App.clv]}</b>개`:''}</p><div id="cxbody"></div>`;
  drawCalc();
}
function drawCalc(){
  const b=document.getElementById('cxbody'); if(!b) return;
  if(!CX || CX.lv!==App.clv || CX.dan!==App.cdan) CX=cxNew();
  b.innerHTML=(CX.v?cxVert(CX):cxHoriz(CX)) + (CX.done?`<button class="big-btn" data-act="cxNext">다음 문제 ▶</button>`:cxPad(CX)+skipBtn('cxKey','skip'));
}
function cxAnsTxt(P){ if(P.v){ const {a,b,op}=P.v; return String(op==='-'?a-b:a+b); } return P.lab?P.ans.map((x,i)=>`${P.lab[i]} ${x}`).join(', '):P.ans.join(', '); }
function cxKey(v){
  const P=CX; if(!P||P.done) return;
  const lvName=CALC_LEVELS[P.lv].n;
  if(v==='skip'){
    P.done=true; logToday('math', false, lvName);
    if(P.v){ const s=cxAnsTxt(P); P.cells=P.cells.map((_,i)=>s[s.length-1-i]||''); } else P.in=P.ans.slice();
    P.msg=`정답은 <b>${cxAnsTxt(P)}</b> 이에요.${P.v?`<br><small>${cxVHint(P)}</small>`:P.hint?`<br><small>${P.hint}</small>`:''}`; drawCalc(); return;
  }
  if(P.v){
    if(/^\d$/.test(v)){ P.cells[P.sel]=v; if(P.sel<P.n-1) P.sel++; drawCalc(); return; }
    if(v==='del'){ if(P.cells[P.sel]===''&&P.sel>0) P.sel--; P.cells[P.sel]=''; drawCalc(); return; }
    if(v!=='ok') return;
    const hi=P.cells.slice().reverse(), f=hi.findIndex(x=>x!=='');
    if(P.cells[0]===''){ toast('일의 자리부터 써요'); return; }
    if(hi.slice(f).some(x=>x==='')){ toast('빈 칸이 있어요'); return; }
    return cxCheck(+hi.join('')===+cxAnsTxt(P));
  }
  const cur=P.in[P.sel]||'';
  if(/^\d$/.test(v)){ if(cur.length<8) P.in[P.sel]=cur+v; drawCalc(); return; }
  if(v==='.'){ if(!cur.includes('.')) P.in[P.sel]=(cur||'0')+'.'; drawCalc(); return; }
  if(v==='del'){ P.in[P.sel]=cur.slice(0,-1); drawCalc(); return; }
  if(v==='next'){ P.sel=(P.sel+1)%P.ans.length; drawCalc(); return; }
  if(v!=='ok') return;
  const empty=P.in.findIndex(x=>x===''||x==='.'); if(empty>=0){ P.sel=empty; toast(P.ans.length>1?'빈 칸을 모두 채워요':'답을 써요'); drawCalc(); return; }
  cxCheck(P.ans.every((x,i)=>Math.abs(parseFloat(P.in[i])-parseFloat(x))<1e-9));
}
function cxCheck(ok){
  const P=CX, lvName=CALC_LEVELS[P.lv].n;
  if(ok){
    P.done=true; beep(true); markO(); addStar(1); logToday('math', !P.miss, lvName); burst();
    const c=store.get('cxok',{}); c[P.lv]=(c[P.lv]||0)+1; store.set('cxok',c);
    P.msg=`<span class="praise">${praise()}</span>${P.hint&&P.miss?`<br><small>${P.hint}</small>`:''}`;
    drawCalc();
  } else {
    P.wrong++; P.miss=true; beep(false);
    if(P.v){ P.cells=P.cells.map(()=>''); P.sel=0; } else { P.in=P.in.map(()=>''); P.sel=0; }
    if(P.wrong>=2) P.showHint=true; else toast('다시 한번 해 봐요');
    drawCalc(); shake(P.v?'cxgrid':'cxbody');
  }
}
/* 연산 단계표 (초2) */
const CALC_LEVELS = [
  {n:'받아올림 두 번', d:'받아올림이 두 번 있는 덧셈 (합이 세 자리) · 예: 57 + 68 = 125', g:()=>{ const a1=cxR(1,9), b1=cxR(10-a1,9), a10=cxR(1,9), b10=cxR(Math.max(1,9-a10),9); return cxV(a10*10+a1,b10*10+b1,'+'); }},
  {n:'세 수의 덧셈', d:'세 수의 덧셈 · 예: 23 + 18 + 34', g:()=>{ const a=cxR(11,35), b=cxR(11,35), c=cxR(11,99-a-b);
    return cxH(`${a} + ${b} + ${c} = {0}`,[a+b+c],{hint:`앞의 두 수를 먼저 더해요: ${a} + ${b} = ${a+b} → ${a+b} + ${c} = <b>${a+b+c}</b>`}); }},
  {n:'두 자리 − 한 자리', d:'두 자리 − 한 자리 (받아내림) · 예: 32 − 7', g:()=>{ const a1=cxR(0,8), b1=cxR(a1+1,9), a10=cxR(2,9); return cxV(a10*10+a1,b1,'-'); }},
  {n:'몇십 − 두 자리', d:'몇십 − 두 자리 · 예: 50 − 23', g:()=>{ const a=cxR(3,9)*10, b=cxR(1,a/10-1)*10+cxR(1,9); return cxV(a,b,'-'); }},
  {n:'두 자리 − 두 자리', d:'두 자리 − 두 자리 (받아내림) · 예: 62 − 38', g:()=>{ const a1=cxR(0,8), b1=cxR(a1+1,9), a10=cxR(3,9), b10=cxR(1,a10-2); return cxV(a10*10+a1,b10*10+b1,'-'); }},
  {n:'덧셈 · 뺄셈 섞기', d:'덧셈과 뺄셈이 섞인 세 수 계산 · 예: 45 + 27 − 18', g:()=>{
    if(Math.random()<.5){ const a=cxR(12,50), b=cxR(12,99-a), c=cxR(11,a+b-10);
      return cxH(`${a} + ${b} − ${c} = {0}`,[a+b-c],{hint:`앞에서부터 차례로: ${a} + ${b} = ${a+b} → ${a+b} − ${c} = <b>${a+b-c}</b>`}); }
    const a=cxR(40,90), b=cxR(11,a-11), c=cxR(11,99-(a-b));
    return cxH(`${a} − ${b} + ${c} = {0}`,[a-b+c],{hint:`앞에서부터 차례로: ${a} − ${b} = ${a-b} → ${a-b} + ${c} = <b>${a-b+c}</b>`}); }},
  {n:'□ 구하기', d:'□ 구하기 (덧셈과 뺄셈의 관계) · 예: □ + 25 = 61, 72 − □ = 39', g:()=>{ const s=cxR(30,99), b=cxR(11,s-11), x=s-b, f=cxR(0,3);
    if(f===0) return cxH(`{0} + ${b} = ${s}`,[x],{hint:`□ + ${b} = ${s} → □ = ${s} − ${b} = <b>${x}</b>`});
    if(f===1) return cxH(`${b} + {0} = ${s}`,[x],{hint:`${b} + □ = ${s} → □ = ${s} − ${b} = <b>${x}</b>`});
    if(f===2) return cxH(`${s} − {0} = ${b}`,[x],{hint:`${s} − □ = ${b} → □ = ${s} − ${b} = <b>${x}</b>`});
    return cxH(`{0} − ${b} = ${x}`,[s],{hint:`□ − ${b} = ${x} → □ = ${x} + ${b} = <b>${s}</b>`}); }},
  {n:'곱셈의 기초', d:'묶어 세기 · 뛰어 세기 · "몇의 몇 배" → 곱셈식으로 나타내기', g:()=>{ const a=cxR(2,5), k=cxR(2,5), f=cxR(0,2);
    const fig=`<div class="cx-groups">${Array.from({length:k},()=>`<span class="cx-g">${'<i></i>'.repeat(a)}</span>`).join('')}</div>`, hint=`${a}씩 ${k}번 뛰어 세요: ${cxDanTxt(a,k)}`;
    if(f===0) return cxH(`${a}씩 ${k}묶음 → ${a} × ${k} = {0}`,[a*k],{fig,hint});
    if(f===1) return cxH(`${a}의 ${k}배는 {0}`,[a*k],{fig,hint});
    return cxH(`${Array(k).fill(a).join(' + ')} = ${a} × {0}`,[k],{fig,hint:`${a}을(를) ${k}번 더했어요 → ${a} × <b>${k}</b>`}); }},
  {n:'곱셈구구', d:'2 · 5단 → 3 · 6단 → 4 · 8단 → 7 · 9단 → 1단 · 0의 곱 순서로 익혀요', subs:{'25':'2단 · 5단','36':'3단 · 6단','48':'4단 · 8단','79':'7단 · 9단','10':'1단 · 0의 곱','mix':'섞어서'},
    g:d=>{ const G={'25':[2,5],'36':[3,6],'48':[4,8],'79':[7,9],'10':[1,0]}[d]||[2,3,4,5,6,7,8,9]; let a=cxPick(G), b=cxR(1,9); if(d==='10'&&Math.random()<.3) [a,b]=[b,a];
      return cxH(`${a} × ${b} = {0}`,[a*b],{hint:a===0||b===0?'0에 어떤 수를 곱해도, 어떤 수에 0을 곱해도 0이에요':`${a}단: ${cxDanTxt(a,b)}`}); }},
  {n:'세 자리 덧셈 · 뺄셈', d:'세 자리 수 덧셈 · 뺄셈 · 예: 365 + 278, 512 − 247 (초3 1학기 내용)', g:()=>{

    const a=cxR(300,999), b=cxR(101,a-50); return cxV(a,b,'-'); }}
];

const decoItem = id => DECO_ITEMS.find(x=>x.id===id);
/* 캐릭터마다 자기 모자 · 소품을 따로 입어요: wear = {캐릭터id: {hat, acc}}. 물건은 하나뿐이라 다른 캐릭터에게 주면 옮겨 가요 */
/* 몸 전체 그림인 캐릭터는 머리 자리가 달라서 모자를 옮겨 씌워요: [가로 px, 세로 px, 기울기] (큰 방 기준) */
const HAT_FIT = { squirrel:[-16,10,-10], koala:[0,4,0], otter:[-34,22,-14], monkey:[0,4,0], sloth:[-18,26,-10], seal:[-36,20,-16], llama:[-24,-8,-8], flamingo:[-6,-10,-10], owl:[0,8,0], hippo:[-34,18,-10], giraffe:[-30,-12,-10], elephant:[-28,6,-10], chickb:[0,8,0], sheep:[-26,10,-12], hedgehog:[-30,18,-14], whale:[-22,22,-14], octo:[0,10,0], bluefish:[-26,26,-18], phoenix:[-18,4,-10], penguin:[0,6,0], shark:[-36,30,-20], dolphin:[-30,20,-22], dino:[-24,-2,-10], dragon:[-36,4,-14], unicorn:[-8,2,-8] };
function decoGet(){
  const d=Object.assign({base:'dog', hat:null, acc:null, pet:null, bg:'plain', own:[], spent:0, at:0, wear:null}, store.get('deco',{}));
  DECO_ITEMS.forEach(x=>{ if(!x.p && !d.own.includes(x.id)) d.own.push(x.id); });
  if(!d.wear){ d.wear={}; if(d.hat||d.acc) d.wear[d.base]={hat:d.hat||null, acc:d.acc||null}; }   // 예전 기록 옮기기
  const w=d.wear[d.base]||{}; d.hat=w.hat||null; d.acc=w.acc||null;
  return d;
}
function decoSave(d){ const w=d.wear[d.base]||{}; d.hat=w.hat||null; d.acc=w.acc||null; d.at=Date.now(); store.set('deco',d); cloudPush(); drawMeTile(); }
const decoLeft = () => Math.max(0, stars + eStars() - (decoGet().spent||0));   // 쓸 수 있는 별
const decoWearer = (d,id) => Object.keys(d.wear).find(b=>d.wear[b] && (d.wear[b].hat===id || d.wear[b].acc===id)) || null;
function decoWear(d, base, k, id){
  let moved=null;
  if(id){ const prev=decoWearer(d,id); if(prev && prev!==base){ d.wear[prev][k]=null; moved=prev; } }
  d.wear[base]=Object.assign({hat:null, acc:null}, d.wear[base]||{}); d.wear[base][k]=id||null;
  return moved;
}
function decoChar(d, baseId){
  const base=decoItem(baseId)||decoItem('dog'), w=d.wear[baseId]||{}, hat=w.hat&&decoItem(w.hat), acc=w.acc&&decoItem(w.acc), f=HAT_FIT[baseId]||[0,0,0];
  /* 모자 · 소품은 캐릭터 그림(me-fig) 크기에 맞춰 em으로 놓아요 → 아이폰 · 안드로이드 · 윈도우에서 이모지 크기가 달라도 그림에 붙어 있어요 */
  return `<div class="me-char"><span class="me-fig"><span class="me-base ${base.fx?'fx-'+base.fx:''}">${base.e}</span>
    ${hat?`<span class="me-hat" style="transform:translate(calc(-50% + ${(f[0]/120).toFixed(3)}em),${(f[1]/120).toFixed(3)}em) rotate(${f[2]}deg)">${hat.e}</span>`:''}
    ${acc?`<span class="me-acc ${w.acc==='glasses'?'face':''}">${acc.e}</span>`:''}</span></div>`;
}
const decoMini = (d, baseId) => `<span class="cm-wrap"><span class="cm-in">${decoChar(d,baseId)}</span></span>`;
function decoStage(d, big=true){
  const bg=decoItem(d.bg)||decoItem('plain'), pet=d.pet?decoItem(d.pet):null;
  const spots=[[8,14],[82,10],[14,58],[86,52]];
  return `<div class="me-stage ${big?'':'mini'}" style="background:${bg.g}">
    ${bg.floor?`<div class="me-ground" style="background:${bg.floor}"></div>`:''}
    ${bg.scene?bg.scene.map(([e,x,y,s,h,col,rad])=>e==='#'?`<span class="me-box" style="left:${x}%;top:${y}%;width:${s}%;height:${h}%;background:${col};border-radius:${rad||0}px"></span>`:`<span class="me-deco sc" style="left:${x}%;top:${y}%;font-size:${s}px">${e}</span>`).join(''):bg.d.map((e,i)=>`<span class="me-deco" style="left:${spots[i%4][0]}%;top:${spots[i%4][1]}%">${e}</span>`).join('')}
    <div class="me-floor"></div>
    ${decoChar(d, d.base)}
    ${pet?`<span class="me-pet ${['butterfly','parrot','bee'].includes(pet.id)?'fly':''}"><span class="me-pet-in">${pet.e}</span></span>`:''}
  </div>`;
}
function drawMeTile(){ const t=document.getElementById('dkMe'); if(t) t.textContent=(decoItem(decoGet().base)||decoItem('dog')).e; }
function renderMyRoom(){
  const d=decoGet(), left=decoLeft();
  const bases=DECO_ITEMS.filter(x=>x.k==='base'), nb=bases.filter(x=>d.own.includes(x.id)).length;
  const nl=d.own.filter(id=>['hat','acc','pet'].includes((decoItem(id)||{}).k)).length;
  view.innerHTML=`<div class="me-head"><div><b>${josa(who,'이의','의')} 캐릭터 방</b><span class="sub">모은 별로 꾸며요 · 별을 써도 스티커는 그대로예요</span></div>
      <div class="me-bank"><span>쓸 수 있는 별</span><b>⭐ ${left}</b><small>모은 별 ${stars}${eStars()?` · 🌈 ${eStars()}`:''} · 쓴 별 ${d.spent||0}</small></div></div>
    <div class="seg oneline">${[['room','🏠 방 · 가게'],['chars',`🧸 모음 ${nb}/${bases.length}`],['locker',`🗄️ 사물함 ${nl}`]].map(([k,n])=>pill('roomv',k,n,App.roomv)).join('')}</div>
    <div id="roombody"></div>`;
  ({room:drawRoomShop, chars:drawCharBook, locker:drawDecoLocker})[App.roomv||'room'](d, left);
}
function drawRoomShop(d, left){
  const b=document.getElementById('roombody'); if(!b) return;
  const cat=App.decoCat||'base', pick=App.decoPick, P=pick?decoItem(pick):null;
  const card=x=>{ const own=d.own.includes(x.id), can=left>=x.p;
    const wearing=(x.k==='hat'||x.k==='acc') ? decoWearer(d,x.id) : null;
    const on = (x.k==='hat'||x.k==='acc') ? wearing===d.base : d[x.k]===x.id;
    const state = on ? (x.k==='base'||x.k==='bg'?'사용 중':'입는 중 · 벗기')
      : own ? (wearing ? `${decoItem(wearing).e} 쓰는 중` : (x.p?'가지고 있어요':'무료'))
      : `<span class="${can?'':'no'}">⭐ ${x.p}</span>`;
    return `<button class="me-item ${on?'on':''} ${own?'own':''} ${pick===x.id?'pick':''}" data-act="decoTap" data-v="${x.id}">
      <span class="me-ie ${x.fx?'fx-'+x.fx:''}">${x.e}</span><b>${x.n}</b><small>${state}</small></button>`; };
  // 모자 · 소품은 사기 전에 지금 캐릭터에게 씌워 보기
  const tryD = P && (P.k==='hat'||P.k==='acc') ? Object.assign({}, d, {wear:Object.assign({}, d.wear, {[d.base]:Object.assign({hat:null,acc:null}, d.wear[d.base]||{}, {[P.k]:P.id})})}) : d;
  const shown = P && P.k!=='hat' && P.k!=='acc' ? Object.assign({}, d, {[P.k]:P.id}, P.k==='base'?{base:P.id}:{}) : tryD;
  b.innerHTML=`<div class="card me-card">${decoStage(shown)}${P?'<div class="me-try">👀 미리 보기</div>':''}</div>
    ${P?`<div class="me-buy card"><span class="me-ie">${P.e}</span><div><b>${P.n}</b><div class="sub">${left>=P.p?`별 ${P.p}개로 살까요? 사고 나면 쓸 수 있는 별은 ${left-P.p}개예요.`:`별이 ${P.p-left}개 더 필요해요. 문제를 풀어서 별을 모아요!`}</div></div>
      ${left>=P.p?`<button class="big-btn me-yes" data-act="decoBuy" data-v="${P.id}">⭐ ${P.p} 사기</button>`:''}<button class="pill" data-act="decoTap" data-v="">닫기</button></div>`:''}
    <div class="seg small">${Object.entries(DECO_CATS).map(([k,n])=>`<button class="pill ${cat===k?'on':''}" data-act="decoCat" data-v="${k}">${n}</button>`).join('')}</div>
    <div class="me-grid">${DECO_ITEMS.filter(x=>x.k===cat).sort((a,b)=>a.p-b.p).map(card).join('')}</div>`;
}
function drawCharBook(d){
  const b=document.getElementById('roombody'); if(!b) return;
  const bases=DECO_ITEMS.filter(x=>x.k==='base').sort((a,b)=>a.p-b.p);
  b.innerHTML=`<p class="desc">누르면 그 캐릭터가 방에 나와요. 캐릭터마다 모자 · 소품을 따로 입어요.</p>
    <div class="cm-grid">${bases.map(x=>d.own.includes(x.id)

      : `<button class="cm none" data-act="decoGoShop" data-v="${x.id}"><span class="cm-sil">${x.e}</span><b>?</b><small>⭐ ${x.p}</small></button>`).join('')}</div>`;
}
function drawDecoLocker(d){
  const b=document.getElementById('roombody'); if(!b) return;
  const items=d.own.filter(id=>['hat','acc','pet'].includes((decoItem(id)||{}).k));
  const per=4, rows=Math.max(2, Math.ceil(items.length/per));
  let shelves='';
  for(let r=0;r<rows;r++){
    let cells='';
    for(let i=0;i<per;i++){
      const id=items[r*per+i];
      if(!id){ cells+='<span class="lk-cell empty"></span>'; continue; }
      const it=decoItem(id), wb=it.k==='pet' ? (d.pet===id?'🏠':'') : ((w=>w?decoItem(w).e:'')(decoWearer(d,id)));
      cells+=`<button class="lk-cell ${App.lockPick===id?'on':''}" data-act="lockPick" data-v="${id}"><span class="lk-e">${it.e}</span><small>${it.n}</small>${wb?`<i class="worn">${wb}</i>`:''}</button>`;
    }
    shelves+=`<div class="shelf">${cells}</div>`;
  }
  const P=decoItem(App.lockPick);
  let give='';
  if(P && P.k==='pet'){
    give=`<div class="card give"><p><b>${P.e} ${P.n}</b></p>${d.pet===P.id
      ? '<button class="pill" data-act="decoGive" data-v="">🗄️ 사물함에 두기</button>'
      : '<button class="pill" data-act="decoGive" data-v="room">🏠 방에 데려가기</button>'}</div>`;

    give=`<div class="card give"><p><b>${P.e} ${P.n}</b>, 누가 ${P.k==='hat'?'쓸까요':'가질까요'}?</p>
      <div class="cm-grid small">${mine.map(id=>`<button class="cm ${cur===id?'on':''}" data-act="decoGive" data-v="${id}">${decoMini(Object.assign({},d,{wear:Object.assign({},d.wear,{[id]:Object.assign({hat:null,acc:null},d.wear[id]||{},{[P.k]:P.id})})}),id)}<b>${decoItem(id).n}</b></button>`).join('')}</div>
      ${cur?'<button class="linkbtn" data-act="decoGive" data-v="">🗄️ 사물함에 다시 넣기</button>':''}</div>`;
  }
  b.innerHTML=`<div class="locker"><div class="lk-top">🗄️ ${esc(who||'')}의 사물함 <small>모자 · 소품 · 친구 ${items.length}개</small></div>${shelves}</div>
    ${items.length?'<p class="sub center" style="font-size:.85rem">물건을 누르면 누구에게 줄지 고를 수 있어요.</p>':'<p class="sub center">아직 비어 있어요. 가게에서 모자나 소품을 사면 여기에 들어와요.</p>'}${give}`;
}
function decoTap(id){
  const d=decoGet(), x=decoItem(id); if(!x){ App.decoPick=null; renderMyRoom(); return; }
  if(d.own.includes(id)){
    let moved=null;
    if(x.k==='base'||x.k==='bg') d[x.k]=id;
    else if(x.k==='pet') d.pet = d.pet===id ? null : id;
    else moved=decoWear(d, d.base, x.k, (d.wear[d.base]||{})[x.k]===id ? null : id);   // 한 번 더 누르면 벗어요
    App.decoPick=null; decoSave(d); renderMyRoom();
    if(moved) toast(`${decoItem(moved).e} ${decoItem(moved).n}에게서 가져왔어요`);
    return;
  }
  App.decoPick=App.decoPick===id?null:id; renderMyRoom();
}
function decoBuy(id){
  const d=decoGet(), x=decoItem(id); if(!x || d.own.includes(id)) return;
  if(decoLeft()<x.p){ toast('별이 조금 모자라요'); return; }
  d.spent=(d.spent||0)+x.p; d.own.push(id);
  if(x.k==='hat'||x.k==='acc') decoWear(d, d.base, x.k, id); else d[x.k]=id;
  App.decoPick=null; decoSave(d);
  beep(true); burst();
  toast(x.k==='base' ? `🎉 ${x.e} ${x.n} 캐릭터가 생겼어요! 캐릭터 모음에 들어갔어요` : x.k==='bg' ? `${x.e} ${x.n}${josa(x.n,'으로','로').slice(x.n.length)} 방을 꾸몄어요` : `${x.e} ${x.n}${josa(x.n,'을','를').slice(x.n.length)} 샀어요! 사물함에도 들어갔어요`);
  renderMyRoom();
}
function decoGive(v){
  const d=decoGet(), P=decoItem(App.lockPick); if(!P) return;
  if(P.k==='pet') d.pet = v==='room' ? P.id : (d.pet===P.id ? null : d.pet);
  else if(v){ const moved=decoWear(d, v, P.k, P.id); if(moved) toast(`${decoItem(moved).e}에게서 가져왔어요`); }
  else { const cur=decoWearer(d,P.id); if(cur) decoWear(d, cur, P.k, null); toast('🗄️ 사물함에 넣었어요'); }

/* ───── 책 읽기 모드: 문단을 차례로 읽어 주고, 읽는 문단을 색칠하고 화면이 따라가요 (명작 도서관 · 한국사 이야기책) ───── */
let RD=null; // {sel, texts, i, tok, paused}
function readStart(sel, texts, from=0){
  readStop();
  if(!('speechSynthesis' in window)){ toast('이 기기는 읽어 주기를 할 수 없어요'); return; }
  RD={sel, texts, i:from, tok:Math.random(), paused:false}; readStep();
}
function readStep(){
  const R=RD; if(!R) return;
  const els=document.querySelectorAll(R.sel);
  if(!els.length){ readStop(); return; }                         // 다른 화면으로 갔어요
  els.forEach((e,k)=>e.classList.toggle('reading',k===R.i));
  if(R.i>=R.texts.length){ readStop(); toast('📖 끝까지 다 읽었어요!'); return; }
  const el=els[R.i]; if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(R.texts[R.i].replace(/<[^>]+>/g,'')); u.lang='ko-KR'; u.rate=0.9; if(koVoice) u.voice=koVoice;
  const tok=R.tok; u.onend=()=>{ if(RD && RD.tok===tok && !RD.paused){ RD.i++; readStep(); } };
  speechSynthesis.speak(u); readBar();
}
function readPause(){ if(!RD) return; if(RD.paused){ RD.paused=false; RD.tok=Math.random(); readStep(); } else { RD.paused=true; RD.tok=0; try{ speechSynthesis.cancel(); }catch(e){} readBar(); } }
function readStop(){ RD=null; try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.reading').forEach(e=>e.classList.remove('reading')); readBar(); }
function readBar(){
  let f=document.getElementById('rdfloat');
  if(!RD){ if(f) f.remove(); return; }
  if(!f){ f=document.createElement('div'); f.id='rdfloat'; f.className='rd-float'; document.body.appendChild(f); }
  f.innerHTML=`<span>📖 ${Math.min(RD.i+1,RD.texts.length)} / ${RD.texts.length}</span><button class="pill on" data-act="rdPause">${RD.paused?'▶ 이어 읽기':'⏸ 멈춤'}</button><button class="pill" data-act="rdStop">■ 그만</button>`;
}
const readBtn = k => `<div class="rd-start"><button class="pill on" data-act="rdStart" data-k="${k}">📖 책 읽기 모드 · 처음부터 읽어 주기</button></div>`;

function drawCSLearn(s,u){

function drawCSQuiz(s,u){
  const b=document.getElementById('csbody'); if(!b) return;
  if(!CQ || CQ.s!==s || CQ.uid!==u.id) CQ={s, uid:u.id, i:0, score:0, tried:false, solved:false, picked:[], note:'', done:false, res:[],
    list:shuffle(u.qs).slice(0,10).map(([q,a,o,ex])=>({q, ans:a, choices:shuffle([a,...o]), explain:ex}))};
  if(CQ.done){
    b.innerHTML=`<div class="card center"><p class="sub">${u.e} ${u.n}</p><p class="big">${CQ.score===CQ.list.length?'🏆 모두 한 번에 맞혔어요!':`${CQ.list.length}문제 중 ${CQ.score}개를 한 번에 맞혔어요!`}</p>
      <p>받은 별: ⭐ ${CQ.earned}개</p><button class="big-btn" data-act="csAgain" data-k="${s}">다시 하기</button>
      <div class="center"><button class="linkbtn" data-act="csMode" data-k="${s}" data-v="learn">📖 설명 다시 보기</button></div></div>`;
    return;
  }
  const q=CQ.list[CQ.i], cls=i=>CQ.solved&&q.choices[i]===q.ans?'ok':(CQ.picked.includes(i)?'no':'');
  b.innerHTML=`<div class="card"><div class="qtop"><span>${u.e} ${u.n} · ${CQ.i+1} / ${CQ.list.length}</span><span>⭐ ${CQ.score}</span></div>
    <div class="dots">${CQ.list.map((_,i)=>`<span class="dot ${i<CQ.i?(CQ.res[i]?'ok':'no'):(i===CQ.i?'cur':'')}"></span>`).join('')}</div>
    <div class="sq ko-q">${esc(q.q)}</div>
    <div class="choices words">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="csPick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
    ${CQ.note?`<div class="hint">${CQ.note}</div>`:''}${CQ.solved?'':skipBtn('csSkip')}</div>`;
}
function csAnswer(i){
  if(!CQ||CQ.solved||CQ.done) return;
  const s=CQ.s, u=csUnitOf(s,CQ.uid), q=CQ.list[CQ.i], skip=i<0;
  const note=()=>{ if(!CQ.tried && typeof addWrong==='function') addWrong(s, u.n, {html:esc(q.q), choices:q.choices, ans:q.ans, explain:q.explain}); };
  if(!skip && q.choices[i]===q.ans){
    CQ.solved=true; CQ.res[CQ.i]=!CQ.tried; beep(true); markO(); logToday(s, !CQ.tried, u.n);
    if(!CQ.tried){ CQ.score++; addStar(1); }
    CQ.note=`<span class="praise">${praise()}</span><br><small>${esc(q.explain)}</small>`;
  } else if(!skip){
    if(CQ.picked.includes(i)) return;
    note(); CQ.tried=true; CQ.picked.push(i); beep(false); CQ.note='💡 '+esc(q.explain); drawCSQuiz(s,u); return;
  } else {
    note(); CQ.tried=true; CQ.solved=true; CQ.res[CQ.i]=false; beep(false); logToday(s, false, u.n);
    CQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${esc(q.explain)}</small>`;
  }
  drawCSQuiz(s,u);
  const me=CQ;
  setTimeout(()=>{
    if(CQ!==me) return;
    CQ.i++; CQ.tried=false; CQ.solved=false; CQ.picked=[]; CQ.note='';
    if(CQ.i>=CQ.list.length){
      CQ.done=true; const all=CQ.score===CQ.list.length; CQ.earned=CQ.score+(all?2:0); if(all) addStar(2); if(CQ.score>=8) burst();
      const B=store.get('csbest',{}), k=s+'|'+CQ.uid; B[k]=Math.max(B[k]===undefined?-1:B[k], CQ.score); store.set('csbest',B); cloudPush();
    }
    if(App.view===s && csState(s).mode==='quiz') drawCSQuiz(s,u);
  }, skip?2600:1600);
}

const hsChoices = (ans, pool, n=4) => shuffle([ans, ...shuffle(pool.filter(x=>x!==ans)).slice(0,n-1)]);
function qWho(it){
  const pool=HISTORY.filter(x=>x.type===it.type).map(x=>x.t);
  return {id:it.t, html:`<div class="hs-qd">${it.d}</div>${it.type==='p'?'이 사람은 누구일까요?':'무엇일까요?'}`, ans:it.t, choices:hsChoices(it.t,pool), explain:`${it.e} ${it.t} (${eraName(it.era)})`};
}
function qEra(it){
  return {id:it.t, html:`<div class="hs-qe">${it.e}</div><b>${it.t}</b>${josa(it.t,'은','는').slice(it.t.length)} 어느 시대일까요?`, ans:eraName(it.era), choices:hsChoices(eraName(it.era), ERAS.map(e=>e[1])), explain:it.d};
}
function qOrder(){
  const eras=shuffle(ERAS.map(e=>e[0])).slice(0,4);
  const its=eras.map(k=>one(HISTORY.filter(x=>x.era===k)));
  const first=Math.random()<0.6;
  const sorted=its.slice().sort((a,b)=>eraIdx(a.era)-eraIdx(b.era));
  const ans=(first?sorted[0]:sorted[3]).t;
  return {id:ans, html:`시대 순서를 생각해 봐요.<br><b>가장 ${first?'먼저':'나중에'}</b> 있었던 것은?`, ans, choices:shuffle(its.map(x=>x.t)),
    explain:sorted.map(x=>`${x.t}(${eraName(x.era)})`).join(' → ')};
}
const HQ_KIND = {quiz:'퀴즈', mock:'한능검 모의 시험', order:'시대 순서 맞히기', wrong:'오답 다시 풀기'};
function startHQ(kind){
  let list=[];
  if(kind==='quiz'){
    const pool=App.hqera==='all'?HISTORY:HISTORY.filter(x=>x.era===App.hqera);
    list=shuffle(pool).slice(0,10).map(it=> App.hqera==='all' && Math.random()<0.35 ? qEra(it) : qWho(it));
    while(list.length<10) list.push(qWho(one(pool)));
  } else if(kind==='mock'){
    list=shuffle(HISTORY).slice(0,14).map(it=>Math.random()<0.7?qWho(it):qEra(it));
    for(let i=0;i<6;i++) list.push(qOrder());
    list=shuffle(list);
  } else if(kind==='order'){
    list=Array.from({length:10},qOrder);
  } else if(kind==='wrong'){
    const w=Object.keys(store.get('hwrong',{}));
    list=shuffle(HISTORY.filter(x=>w.includes(x.t))).slice(0,10).map(qWho);

function drawHQ(){
  const b=document.getElementById('hsbody'); if(!b||!HQ) return;
  if(HQ.done){
    let res='';
    if(HQ.kind==='mock'){
      const pts=HQ.score*5, grade=pts>=80?'4급':pts>=70?'5급':pts>=60?'6급':'';
      res=`<p class="big">${pts}점</p><p>${grade?`기본 시험 <b>${grade}</b> 수준이에요! 🎉`:'조금만 더 공부하면 6급(60점)이에요. 힘내요!'}</p><p class="sub">걸린 시간: ${fmt(HQ.sec)}</p>`;
    } else res=`<p class="big">${HQ.score===HQ.list.length?'🏆 모두 한 번에 맞혔어요!':`${HQ.list.length}문제 중 ${HQ.score}개를 한 번에 맞혔어요!`}</p>`;
    b.innerHTML=`${hqEraPills()}<div class="card center"><p class="sub">${HQ_KIND[HQ.kind]}</p>${res}<p>받은 별: ⭐ ${HQ.score}개</p>
      ${HQ.wrong.length?`<p class="sub">틀린 ${HQ.wrong.length}문제는 📒 오답 노트에 모았어요.</p>`:''}
      <button class="big-btn" data-act="hqStart" data-v="${HQ.kind}">다시 하기</button>
      ${HQ.kind==='quiz'?'':'<div class="center"><button class="linkbtn" data-act="hqQuit">◀ 뒤로 가기</button></div>'}</div>`;
    return;
  }
  const q=HQ.list[HQ.i], n=HQ.list.length;
  const cls=i=> HQ.solved && q.choices[i]===q.ans ? 'ok' : (HQ.picked && HQ.picked.includes(i) ? 'no' : '');
  b.innerHTML=`${hqEraPills()}<div class="card">
      <div class="qtop"><span>${HQ_KIND[HQ.kind]} · ${HQ.i+1} / ${n}</span><span>⭐ ${HQ.score}</span></div>
      <div class="sq hs-q">${q.html}</div>
      <div class="choices words hs-ch">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="hqPick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
      ${HQ.solved && HQ.note ? `<div class="hint">${HQ.note}</div>` : ''}
      ${HQ.solved?'':skipBtn('hqSkip')}
      ${HQ.kind==='quiz'?'':'<div class="center"><button class="linkbtn" data-act="hqQuit">◀ 뒤로 가기</button></div>'}
    </div>`;
}
function hqPick(i){
  if(!HQ||HQ.solved||HQ.done) return;
  const q=HQ.list[HQ.i]; HQ.picked=HQ.picked||[];
  if(q.choices[i]===q.ans){
    HQ.solved=true; beep(true); markO(); logToday('history', !HQ.tried);
    if(!HQ.tried){ HQ.score++; addStar(1); if(HQ.kind==='wrong') hsWrongNote(q.id,false); }
    HQ.note=`<span class="praise">${praise()}</span>`;
    drawHQ(); hqNext(1300);
  } else {
    if(HQ.picked.includes(i)) return;
    HQ.picked.push(i); beep(false);
    if(!HQ.tried){ HQ.tried=true; HQ.wrong.push(q.id); hsWrongNote(q.id,true); }
    if(HQ.single){ HQ.solved=true; logToday('history', false); HQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${q.explain}</small>`; drawHQ(); hqNext(2600); return; }
    drawHQ();
  }
}
function hqSkip(){
  if(!HQ||HQ.solved||HQ.done) return;
  const q=HQ.list[HQ.i];
  if(!HQ.tried){ HQ.tried=true; HQ.wrong.push(q.id); hsWrongNote(q.id,true); }
  HQ.solved=true; beep(false); logToday('history', false);
  HQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${q.explain}</small>`;
  drawHQ(); hqNext(2600);
}
function hqNext(ms){
  const me=HQ;
  setTimeout(()=>{
    if(HQ!==me) return;
    HQ.i++; HQ.tried=false; HQ.solved=false; HQ.picked=[]; HQ.note='';
    if(HQ.i>=HQ.list.length){
      HQ.done=true; HQ.sec=Math.round((Date.now()-HQ.start)/1000);
      if(HQ.kind==='mock'){ const best=store.get('hmock',0); if(HQ.score*5>best){ store.set('hmock',HQ.score*5); cloudPush(); } }
      if(HQ.score>=HQ.list.length*0.8) burst();
    }
    if(App.view==='history') drawHQ();
  }, ms);
}

/* 관리자 로그인: 온라인 저장(Firebase)이 켜져 있으면 이메일/비밀번호로 들어가요.

const ADMIN_EMAIL_SHA256 = '22fa372a479af0929cadcbf6b12b6c2dace34800344067ef44b21a0c187487fb';
async function sha256Hex(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const isAdminUser=async u=>{ const em=((u&&u.email)||'').trim().toLowerCase(); return !!em && await sha256Hex(em)===ADMIN_EMAIL_SHA256; };
function admEnter(){
  setMode='admin'; pinBuf=''; drawSettings();
  const v=admView||who||getProfiles()[0]; cloudPull(v).then(ok=>{ if(ok && setMode==='admin') drawSettings(); });
}
function admEmailHTML(){
  const f='display:block;width:100%;box-sizing:border-box;font:inherit;padding:.6rem .8rem;border:2px solid var(--line);border-radius:12px;margin:4px 0 12px;background:var(--paper);color:inherit';
  return `<div class="adm-head"><h3>🔒 관리자 모드</h3><button class="adm-all" data-act="openAllAdmin">📚 전체 관리자 (5명) ↗</button></div>
    <p class="sub" style="margin:0 0 10px;font-size:.9rem">관리자 이메일과 비밀번호로 로그인하세요.</p>
    <label class="lbl" for="admEm">이메일</label>
    <input id="admEm" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" style="${f}">
    <label class="lbl" for="admPw">비밀번호</label>
    <input id="admPw" type="password" autocomplete="current-password" style="${f}">
    <button class="big-btn" data-act="admLogin">로그인</button>
    <button class="big-btn" data-act="closeSet" style="opacity:.8">닫기</button>
    <div class="center"><button class="linkbtn" data-act="admReset">비밀번호를 잊었어요</button></div>`;
}
async function admEmailLogin(){
  const em=((document.getElementById('admEm')||{}).value||'').trim().toLowerCase(), pw=(document.getElementById('admPw')||{}).value||'';
  if(!em||!pw){ toast('이메일과 비밀번호를 넣어 주세요'); return; }
  if(await sha256Hex(em)!==ADMIN_EMAIL_SHA256){ toast('관리자 이메일이 아니에요'); return; }
  if(!await cloudInit()){ toast('온라인 저장에 연결하지 못했어요'); return; }
  try{
    const r=await firebase.auth().signInWithEmailAndPassword(em,pw);
    if(await isAdminUser(r.user)){ if(setMode==='pin' && !isMom()) admEnter(); }
    else { await firebase.auth().signOut(); toast('관리자 계정이 아니에요'); }
  }catch(e){
    console.warn('로그인 실패',e);
    const m={'auth/invalid-credential':'이메일이나 비밀번호가 맞지 않아요','auth/wrong-password':'비밀번호가 맞지 않아요','auth/user-not-found':'등록되지 않은 이메일이에요','auth/too-many-requests':'여러 번 틀려서 잠시 막혔어요. 조금 뒤에 다시 해 주세요','auth/operation-not-allowed':'Firebase에서 이메일/비밀번호 로그인을 켜 주세요','auth/network-request-failed':'인터넷 연결을 확인해 주세요'}[e.code];
    toast(m||'로그인하지 못했어요');
  }
}
async function admEmailReset(){
  const em=((document.getElementById('admEm')||{}).value||'').trim().toLowerCase();
  if(!em){ toast('이메일을 먼저 넣어 주세요'); return; }
  if(await sha256Hex(em)!==ADMIN_EMAIL_SHA256){ toast('관리자 이메일이 아니에요'); return; }
  if(!await cloudInit()){ toast('온라인 저장에 연결하지 못했어요'); return; }
  try{ await firebase.auth().sendPasswordResetEmail(em); toast('비밀번호 재설정 메일을 보냈어요'); }catch(e){ console.warn(e); toast('메일을 보내지 못했어요'); }
}

    const k=el.dataset.k;
    if(k==='goal') admin.goal=+v;
    if(k==='subj') admin.subj[v]=!admin.subj[v];
    if(k==='dan'){ const d=+v; admin.dans = admin.dans.includes(d) ? admin.dans.filter(x=>x!==d) : admin.dans.concat(d).sort(); }
    saveAdmin(); drawSettings();
  },
  admMsg: ()=>{ admin.msg=document.getElementById('admMsg').value.trim(); saveAdmin(); toast('저장했어요'); },
  admStar: v=>{ if(isMom()) return; stars=Math.max(0,stars+ +v); store.set('stars',stars); store.set('starsAt',Date.now()); updateStars(); cloudPush(); drawSettings(); },
  admPin: ()=>{
    if(isMom()) return;
    const p=document.getElementById('admPin').value;
    if(!/^\d{4}$/.test(p)){ toast('숫자 4자리로 적어 주세요'); return; }
    admin.pinH=hashPin(p,'admin'); delete admin.pin; saveAdmin(); toast('비밀번호를 바꿨어요'); drawSettings();
  },
  reset: ()=>{
    if(isMom()) return;
    if(!confirm(`${who}의 별, 스티커, 학습 기록, 최고 기록을 모두 지울까요?`)) return;
    ['stars','today','starDay','log','visits','best_1','best_2','best_3','hmock','hwrong'].forEach(k=>store.del(k)); store.set('hwrongAt',Date.now());
    stars=0; store.set('starsAt',Date.now()); cloudReset(who); markVisit(); updateStars(); toast('기록을 지웠어요'); drawSettings();
  }
};
document.addEventListener('click',e=>{
  if(e.target.id==='settings'){ closeModal(); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const f=ACT[el.dataset.act]; if(f) f(el.dataset.v, el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ const o=document.getElementById('admPop'); if(o && !o.hidden){ o.hidden=true; return; } }
  if(!document.getElementById('login').hidden){
    if(LP){ if(/^[0-9]$/.test(e.key)) lpinKey(e.key); else if(e.key==='Backspace') lpinKey('del'); return; }
    if(e.key==='Enter' && e.target.id==='newWho') addWho(); return;
  }
  if(e.target.tagName==='INPUT'){ if(e.key==='Enter' && (e.target.id==='admEm'||e.target.id==='admPw')) ACT.admLogin(); return; }
  let fn=null;
  if(!document.getElementById('settings').hidden){ if(setMode==='pin') fn=pinKey; }
  else if(App.view==='math') fn=ACT.key;
  else if(App.view==='school') fn=sKey;
  if(!fn) return;
  if(/^[0-9]$/.test(e.key)) fn(e.key);
  else if(e.key==='Backspace') fn('del');
  else if(e.key==='Enter' && fn!==pinKey){ e.preventDefault(); fn('ok'); }
});

applySettings();
updateStars();
showLogin();
cloudPullSettings().then(ch=>{ if(ch && who && App.view==='home') render(); });
tick();
setInterval(tick,1000);
evListen();
</script>
</body>
