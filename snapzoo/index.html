<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3f8f5a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동물 왕국">
<title>동물 왕국</title>
<meta name="description" content="카메라 하나로 동물 친구를 찾아 도감을 채우는 사진 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene" aria-label="동물 왕국 3D 화면"></canvas>
<div class="vignette" aria-hidden="true"></div>

<!-- 위 알림판 -->
<div class="hud">
  <div class="left">
    <div class="whererow"><div class="where" id="zoneName">🚏 정거장 대기실</div><button class="gear" id="gearBtn" type="button" aria-label="설정">⚙️</button></div>
    <p class="goal" id="goal" hidden></p>
    <p class="friends" id="friends" hidden></p>
  </div>
  <div class="chips">
    <div class="chip coin" id="coinChip"><span class="ic">🪙</span><b id="coinTxt">0</b><small id="perSec">+1/초</small></div>
    <div class="chip dex"><span class="ic">📖</span><b id="dexTxt">0/26</b></div>
    <div class="timebox"><div class="timebar"><i id="timeBar"></i></div><small id="timeLeft">오늘 55분 남음</small></div>
  </div>
</div>

<div id="actbar" class="actbar" aria-label="광장 동작"></div>
<div id="goalArrow" class="goalarrow" hidden aria-hidden="true">➜</div>
<div id="rareMark" class="raremark" hidden aria-hidden="true"><i>✨</i><b></b></div>
<div id="nameTag" class="nametag"><span class="face"></span><span class="nm"></span></div>

<!-- 걷기 화면 B -->
<div class="walkui">
  <div id="joystick" class="joystick" aria-label="조이스틱"><div class="knob"></div></div>
  <button id="jumpBtn" class="jump" type="button" aria-label="점프"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l-7 8h4.5v6h5v-6H19z"/></svg></button>
</div>
<nav class="tabbar" aria-label="메뉴">
  <button id="tabChar" type="button"><span>👤</span>캐릭터</button>
  <button id="tabShop" type="button"><span>🛒</span>상점</button>
  <button id="tabFace" type="button"><span>😊</span>표정</button>
  <button id="tabPhoto" class="cam" type="button" aria-label="사진 찍기" hidden><span>📷</span></button>
  <button id="tabMap" type="button"><span>🗺️</span>지도</button>
  <button id="tabDex" type="button"><span>📖</span>도감</button>
</nav>

<!-- 사진 화면 C -->
<div class="photoui">
  <div class="camtop"><i id="camDot"></i><b id="camName">녹색 구리 렌즈</b><span id="zoomTxt">1배</span></div>
  <div id="frame" class="frame"><i class="cross"></i></div>
  <p id="photoHint" class="phint" hidden></p>
  <div class="zoomcol">
    <button id="zoomIn" type="button" aria-label="줌 당기기">＋</button>
    <button id="zoomOut" type="button" aria-label="줌 빼기">－</button>
  </div>
  <div class="camdock">
    <button id="lastPhoto" class="last" type="button" aria-label="방금 찍은 사진"></button>
    <button id="shutter" class="shutter" type="button" aria-label="찰칵"></button>
    <button id="photoClose" class="pclose" type="button" aria-label="사진 그만">✕</button>
  </div>
</div>

<div id="spotMenu" class="spotmenu" hidden role="dialog" aria-label="할 일"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="flash" class="flash"></div>
<div id="ride" class="ride" hidden></div>
<div id="veil" class="veil" hidden></div>

<noscript>이 게임은 자바스크립트가 필요해요.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
