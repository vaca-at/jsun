<script type="module">
// 귀여운 블록 동물 26종: 머리가 크고 몸이 작은 동글동글한 모양 · 큰 눈.
// 외부 3D 모델 없이 상자만으로 만들어요 (저작권 걱정 없음). 동물은 +z 쪽을 바라봐요.

//   act: 특별한 순간이 시작된 뒤 지난 초 (아니면 -1)
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const MATS = new Map();
function mat(color, emissive = 0, opacity = 1) {
  const k = `${color}|${emissive}|${opacity}`;
  if (!MATS.has(k)) {
    const m = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0 });
    if (emissive) { m.emissive = new THREE.Color(color); m.emissiveIntensity = emissive; }

}
const BOX = new THREE.BoxGeometry(1, 1, 1);
const CONE = new THREE.ConeGeometry(0.5, 1, 4);
// 둥근 모서리 상자: 동물 · 건물이 둥근 캐릭터와 로우폴리 배경에 어울리게 (크기마다 한 번만 만들어요)
const RB = new Map();
function roundGeo(w, h, d) {
  const k = `${w.toFixed(3)},${h.toFixed(3)},${d.toFixed(3)}`;
  if (!RB.has(k)) {
    const r = Math.min(w, h, d) * 0.22;
    RB.set(k, r < 0.012 ? new THREE.BoxGeometry(w, h, d) : new RoundedBoxGeometry(w, h, d, 2, r));   // 아주 작은 부품은 각진 채로 (크기는 그대로)
  }

  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
// 각진 상자 (1번 네모 탐험가 · 얇은 판처럼 각이 있어야 하는 것)
function sharpBox(parent, color, w, h, d, x = 0, y = 0, z = 0, glow = 0, opacity = 1) {
  const m = new THREE.Mesh(BOX, typeof color === 'string' ? mat(color, glow, opacity) : color);

  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
// =====================================================================
// 진짜 동물처럼: 실제 몸 비율 · 털 색 · 무늬를 매끈한 3D 로 (도감의 진짜 사진과 어울리게)
// 모든 동물은 +z 쪽을 바라봐요. BUILD[model]() → { root, update(t, moving, act) }
// =====================================================================
const sin = Math.sin, cos = Math.cos;
const SPH = new THREE.SphereGeometry(1, 14, 10);   // 휴대폰에 맞게 면 수는 적당히

const SMATS = new Map();
// 털 · 피부 재료 (살짝 거칠게), 눈은 반짝이게

function joint(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
// 타원 몸통 조각
function E(p, c, rx, ry, rz, x = 0, y = 0, z = 0, rot = null, lo = false) {

// 가늘어지는 원기둥 (다리 · 목 · 꼬리): 관절 아래로 len 만큼
const CYLS = new Map();
function taper(p, c, len, r0, r1, dir = -1) {

function eye(p, r, x, y, z, iris = null, pupil = 'round') {

const eyePair = (p, r, gap, y, z, iris, pupil, turn = 0.5) => [-1, 1].map((sx) => { const e = eye(p, r, sx * gap, y, z, iris, pupil); e.rotation.y = sx * turn; return e; });

    const nx = s * cos(th), ny = u, nz = s * sin(th);

    nrm.set(nx / rx, ny / ry, nz / rz).normalize();
    const k = size * (0.6 + rnd() * 0.7);
    const m = E(p, color, k * stretch, k, k * flat, q.x, q.y, q.z, null, true);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), nrm);
    if (cfg.ring) {   // 표범 꽃무늬: 까만 테두리 안이 밝은 색
      const c2 = E(p, cfg.ring, k * stretch * 0.62, k * 0.62, k * flat * 0.6, q.x + nrm.x * 0.006, q.y + nrm.y * 0.006, q.z + nrm.z * 0.006, null, true);

    }

const easeIn = (a, d = 0.3) => Math.min(1, a / d);
const SPINE = new THREE.ConeGeometry(0.012, 0.075, 4);

// ---------------- 네 발 짐승 (사자 · 치타 · 표범 · 하이에나 · 카피바라 · 낙타 · 사막여우 · 땅돼지 · 고슴도치) ----------------
function quadruped(o) {
  const rnd = mulberry(o.seed || 7);
  const root = new THREE.Group();
  const [bx, by, bz] = o.body, H = o.leg + by * 0.55;
  const body = joint(root, 0, H, 0);
  const torso = joint(body);
  E(torso, o.color, bx, by, bz);
  if (o.chest) E(torso, o.chest, bx * 0.82, by * 0.95, bz * 0.5, 0, 0.02, bz * 0.45);   // 가슴은 조금 더 두툼
  if (o.belly) E(torso, o.belly, bx * 0.86, by * 0.55, bz * 0.88, 0, -by * 0.45, 0);
  if (o.rump) E(torso, o.color, bx * 0.95, by * 0.92, bz * 0.45, 0, o.rump, -bz * 0.5);
  if (o.hump) E(torso, o.color, bx * 0.6, o.hump, bz * 0.38, 0, by * 0.75, -bz * 0.05);
  if (o.spots) spotsOn(torso, { rx: bx, ry: by, rz: bz, n: o.spots.n, color: o.spots.c, size: o.spots.s, where: (nx, ny) => ny > -0.35, stretch: o.spots.stretch || 1, ring: o.spots.ring }, rnd);
  if (o.spines) for (let i = 0; i < o.spines; i++) {
    const u = rnd(), th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u), nx = s * cos(th), nz = s * sin(th), ny = u;
    if (ny < 0.05 || nz > 0.85) continue;

  const legs = [[-1, 1], [1, 1], [-1, -1], [1, -1]].map(([sx, sz]) => {
    const rear = sz < 0, k = rear ? (o.rearLeg || 1) : 1;
    const top = H - by * 0.25 - (rear ? (1 - k) * o.leg : 0);

function buildAnimal(model) {

function mulberry(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  return `<section><h2 class="zhead">${label} <small>${list.length}종</small></h2><div class="grid">${list.map((a) => `
    <article class="card"><div class="pair"><figure class="photo"><img src="${PHOTOS[a.id]?.src}" alt="진짜 ${a.name} 사진"><figcaption>진짜</figcaption></figure><div class="view" data-model="${a.model}" data-zone="${z}" style="background:var(--st-${z})" role="img" aria-label="${a.name} 3D">${a.night ? '<span class="night" title="밤에만">🌙</span>' : ''}<span class="tag3d">게임</span></div></div>
    <div class="meta"><b>${a.name}<span class="rb r-${a.rarity}">${RN[a.rarity]}</span></b><small>✨ ${a.act}</small><small class="cr">사진 ${PHOTOS[a.id]?.by || ''} · ${PHOTOS[a.id]?.license || ''}</small></div></article>`).join('')}</div></section>`;
}).join('');
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.setScissorTest(true);
const views = [...document.querySelectorAll('.view')].map((el) => {
  const scene = new THREE.Scene(), deep = el.dataset.zone === 'deep';
  scene.add(new THREE.HemisphereLight(deep ? '#9fc0ff' : '#fff7e8', '#8a7a58', deep ? 1.1 : 1.5));
  const sun = new THREE.DirectionalLight('#fff1d6', deep ? 1.2 : 2.3); sun.position.set(3, 5, 4); scene.add(sun);
  const m = buildAnimal(el.dataset.model); scene.add(m.root);
  const b = new THREE.Box3().setFromObject(m.root), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const R = Math.max(s.x, s.y, s.z) * 0.62;
  const cam = new THREE.PerspectiveCamera(32, 1, 0.01, 50); cam.position.set(c.x, c.y + R * 0.5, c.z + R * 3.1); cam.lookAt(c);
  const sh = new THREE.Mesh(new THREE.CircleGeometry(R * 0.75, 24), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.1 }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = Math.max(0.003, b.min.y - 0.01); scene.add(sh);
  const v = { el, scene, m, cam, yaw: 1.15, drag: null };   // 사진처럼 옆모습부터
  el.addEventListener('pointerdown', (e) => { v.drag = e.clientX; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', (e) => { if (v.drag === null) return; v.yaw += (e.clientX - v.drag) * 0.012; v.drag = e.clientX; });
  const end = () => { v.drag = null; }; el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  return v;
});
let walking = false, acting = false, actT = 0, spinning = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const toggle = (id, get, set) => { const b = document.getElementById(id); b.setAttribute('aria-pressed', String(get())); b.onclick = () => { set(!get()); b.setAttribute('aria-pressed', String(get())); }; };
toggle('walkBtn', () => walking, (x) => { walking = x; });
toggle('actBtn', () => acting, (x) => { acting = x; actT = 0; });
toggle('spinBtn', () => spinning, (x) => { spinning = x; });
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (acting) { actT += dt; if (actT > 2.4) actT = 0; }
  const W = canvas.clientWidth, H = canvas.clientHeight, pr = renderer.getPixelRatio();
  if (canvas.width !== Math.floor(W * pr) || canvas.height !== Math.floor(H * pr)) renderer.setSize(W, H, false);
  renderer.setScissor(0, 0, W, H); renderer.setClearColor(0, 0); renderer.clear();
  for (const v of views) {
    const r = v.el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > H) continue;
    if (spinning && v.drag === null) v.yaw += dt * 0.4;
    v.m.root.rotation.y = v.yaw; v.m.update(t, walking, acting ? actT : -1);
    const y = H - r.bottom;
    renderer.setViewport(r.left, y, r.width, r.height); renderer.setScissor(r.left, y, r.width, r.height);
    v.cam.aspect = r.width / r.height; v.cam.updateProjectionMatrix(); renderer.render(v.scene, v.cam);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
