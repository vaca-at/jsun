<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// 1차에서 고른 1 · 5 · 8번 + 새 둥근 시안 11~15번
const DESIGNS = [
  { id: 'explorer', no: 1, kind: 'block', picked: true, name: '네모 탐험가', desc: '캠핑장 비율. 층진 앞머리, 사파리 조끼, 카메라 끈' },
  { id: 'plaid', no: 5, kind: 'block', picked: true, name: '체크 셔츠 네모', desc: '캠핑장처럼 무늬 옷, 긴 머리, 배낭' },
  { id: 'bean', no: 8, kind: 'round', picked: true, name: '콩알 탐험가', desc: '머리와 몸이 한 덩어리인 마스코트' },
  { id: 'mochi', no: 11, kind: 'round', name: '찹쌀떡', desc: '납작하고 말랑한 떡 모양, 멜빵바지, 머리 위 새싹' },
  { id: 'acorn', no: 12, kind: 'round', name: '도토리', desc: '달걀 모양 몸에 도토리 모자, 주황 반바지' },
  { id: 'drop', no: 13, kind: 'round', name: '물방울 잠수부', desc: '물방울 모양, 이마에 물안경, 스노클, 오리발' },
  { id: 'frog', no: 14, kind: 'round', name: '개구리 잠옷', desc: '콩알 몸에 개구리 후드 잠옷, 눈이 머리 위에' },
  { id: 'rain', no: 15, kind: 'round', name: '노란 우비', desc: '우비 후드를 쓴 동글이, 파란 단추, 장화' },
];

// ---------- 재료 ----------
const MATS = new Map();
const mat = (c) => { if (!MATS.has(c)) MATS.set(c, new THREE.MeshLambertMaterial({ color: c })); return MATS.get(c); };
const BOX = new THREE.BoxGeometry(1, 1, 1);
const SPH = new THREE.SphereGeometry(1, 28, 20);
const RBG = new Map();
function add(p, geo, m, x, y, z, sx = 1, sy = 1, sz = 1) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); p.add(o); return o; }
const B = (p, c, w, h, d, x = 0, y = 0, z = 0) => add(p, BOX, typeof c === 'string' ? mat(c) : c, x, y, z, w, h, d);
function RB(p, c, w, h, d, x = 0, y = 0, z = 0, r = 0.07) {
  const k = [w, h, d, r].join(',');
  if (!RBG.has(k)) RBG.set(k, new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001)));
  return add(p, RBG.get(k), mat(c), x, y, z);
}
const S = (p, c, rx, ry, rz, x = 0, y = 0, z = 0) => add(p, SPH, mat(c), x, y, z, rx, ry, rz);
const CAP = (p, c, r, len, x = 0, y = 0, z = 0) => add(p, new THREE.CapsuleGeometry(r, len, 6, 16), mat(c), x, y, z);
const cap = (r, frac) => new THREE.SphereGeometry(r, 28, 14, 0, Math.PI * 2, 0, Math.PI * frac);
const joint = (p, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); p.add(g); return g; };

// ---------- 얼굴 그림 (네모 얼굴 앞면) ----------
function faceTex(kind, skin) {
  const pixel = kind.startsWith('pixel');
  const N = pixel ? 64 : 256;
  const c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d');
  x.fillStyle = skin; x.fillRect(0, 0, N, N);
  if (pixel) {
    const px = (cx, cy, w, h, col) => { x.fillStyle = col; x.fillRect(cx * 4, cy * 4, w * 4, h * 4); };
    if (kind === 'pixelBig') {
      for (const ex of [3, 10]) { px(ex, 6, 3, 4, '#1b1b22'); px(ex, 6, 1, 1, '#ffffff'); px(ex + 2, 8, 1, 1, '#7a6aff'); px(ex + 1, 9, 2, 1, '#3a3060'); }
      px(2, 11, 2, 1, '#ff9aa8'); px(12, 11, 2, 1, '#ff9aa8');
      px(7, 11, 2, 1, '#c4574a'); px(6, 10, 1, 1, '#c4574a'); px(9, 10, 1, 1, '#c4574a');
    } else {
      for (const ex of [4, 10]) { px(ex, 7, 2, 3, '#1b1b22'); px(ex, 7, 1, 1, '#ffffff'); }
      px(2, 11, 3, 1, '#ff9aa8'); px(11, 11, 3, 1, '#ff9aa8');
      px(7, 12, 2, 1, '#c4574a');
    }
  } else {
    // 부드러운 얼굴: 동그란 눈 · 반짝 · 볼 · 웃는 입
    for (const ex of [0.33, 0.67]) {
      x.fillStyle = '#1b1b22'; x.beginPath(); x.ellipse(ex * N, 0.52 * N, 0.07 * N, 0.095 * N, 0, 0, 7); x.fill();
      x.fillStyle = '#fff'; x.beginPath(); x.arc(ex * N - 0.025 * N, 0.49 * N, 0.028 * N, 0, 7); x.fill();
      x.beginPath(); x.arc(ex * N + 0.025 * N, 0.565 * N, 0.013 * N, 0, 7); x.fill();
    }
    x.fillStyle = 'rgba(255,130,150,.55)';
    for (const ex of [0.2, 0.8]) { x.beginPath(); x.ellipse(ex * N, 0.66 * N, 0.07 * N, 0.04 * N, 0, 0, 7); x.fill(); }
    x.strokeStyle = '#a0463c'; x.lineWidth = 0.025 * N; x.lineCap = 'round';
    x.beginPath(); x.arc(0.5 * N, 0.66 * N, 0.05 * N, 0.15 * Math.PI, 0.85 * Math.PI); x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (pixel) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; }
  return t;
}
// 네모 머리: 앞면에만 얼굴 그림
function blockHead(p, skin, w, h, d, face, y) {
  const fm = new THREE.MeshLambertMaterial({ map: faceTex(face, skin) });
  const m = mat(skin);
  const o = new THREE.Mesh(BOX, [m, m, m, m, fm, m]);
  o.scale.set(w, h, d); o.position.y = y; p.add(o); return o;
}
// 체크무늬 천
function plaidMat(a, b, line) {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = a; x.fillRect(0, 0, 32, 32);
  x.fillStyle = b; x.fillRect(0, 12, 32, 8); x.fillRect(12, 0, 8, 32);
  x.fillStyle = line; x.fillRect(0, 15, 32, 2); x.fillRect(15, 0, 2, 32);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2);
  return new THREE.MeshLambertMaterial({ map: t });
}

// ---------- 둥근 얼굴 부품 (구 표면에 붙여요) ----------
function onSphere(head, r, lat, lon) {
  const g = new THREE.Group();
  g.rotation.order = 'YXZ'; g.rotation.set(-lat, lon, 0);
  const inner = new THREE.Group(); inner.position.z = r; g.add(inner);
  head.add(g); return inner;
}
function roundFace(head, r, o = {}) {
  const eyes = [];
  const es = o.eye || 1, gap = o.gap || 0.36, lat = o.lat ?? -0.05;
  for (const s of [-1, 1]) {
    const e = onSphere(head, r, lat, s * gap);
    const g = new THREE.Group(); e.add(g); eyes.push(g);
    S(g, '#1b1b22', 0.055 * es, 0.078 * es, 0.03);
    if (o.iris) S(g, o.iris, 0.04 * es, 0.05 * es, 0.03, 0, -0.018 * es, 0.006);
    S(g, '#ffffff', 0.02 * es, 0.02 * es, 0.02, -0.018 * es, 0.026 * es, 0.022);
    S(g, '#ffffff', 0.01 * es, 0.01 * es, 0.01, 0.02 * es, -0.025 * es, 0.024);
  }
  for (const s of [-1, 1]) { const b = onSphere(head, r, lat - 0.28, s * (gap + 0.2)); S(b, '#ff9aa8', 0.06, 0.035, 0.012); }
  const m = onSphere(head, r, lat - 0.32, 0);
  const smile = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.009, 6, 14, Math.PI), mat('#a0463c'));
  smile.rotation.z = Math.PI; m.add(smile);
  return eyes;
}

// ---------- 뼈대: 다리 · 몸 · 팔 · 머리 관절 ----------
function rig(leg) {
  const root = new THREE.Group();
  const hips = joint(root, 0, leg, 0);
  const legs = [-1, 1].map((s) => joint(hips, s * 0.12, 0, 0));
  const body = joint(hips, 0, 0, 0);
  return { root, hips, legs, body, leg, arms: [], head: null, eyes: [] };
}
function arms(R, y, x, build) {
  R.arms = [-1, 1].map((s) => { const a = joint(R.body, s * x, y, 0); build(a, s); return a; });
}
// 오른손에 카메라
function camera(a, y, col = '#ffffff') {
  const c = joint(a, 0, y, 0.1);
  B(c, col, 0.2, 0.13, 0.09); B(c, '#2b2b33', 0.09, 0.09, 0.07, 0, 0, 0.07); B(c, '#9fd8ff', 0.045, 0.045, 0.02, 0, 0, 0.11);
}
const SKIN = '#ffd9b8', SKIN2 = '#f1c19a';

// ================= 시안 =================
const BUILD = {
  // 지금 게임 속 탐험가 (비교용)
  now() {
    const R = rig(0.62);
    R.legs.forEach((l) => { B(l, '#5b6b7a', 0.2, 0.5, 0.22, 0, -0.27, 0); B(l, '#5a3a24', 0.22, 0.12, 0.3, 0, -0.56, 0.03); });
    B(R.body, '#3aa7a0', 0.5, 0.52, 0.3, 0, 0.27, 0);
    arms(R, 0.48, 0.33, (a) => { B(a, '#3aa7a0', 0.16, 0.42, 0.18, 0, -0.18, 0); B(a, '#ffd9b3', 0.15, 0.1, 0.16, 0, -0.42, 0); });
    camera(R.arms[1], -0.44);
    R.head = joint(R.body, 0, 0.78, 0);
    B(R.head, '#ffd9b3', 0.5, 0.46, 0.44, 0, 0.18, 0);
    for (const s of [-1, 1]) B(R.head, '#24242e', 0.08, 0.1, 0.02, s * 0.11, 0.2, 0.225);
    B(R.head, '#3a2a20', 0.54, 0.14, 0.48, 0, 0.44, -0.01); B(R.head, '#3a2a20', 0.54, 0.3, 0.12, 0, 0.3, -0.19);
    return R;
  },

  // 1 네모 탐험가
  explorer() {
    const R = rig(0.5);
    R.legs.forEach((l) => { B(l, '#7a7350', 0.2, 0.42, 0.22, 0, -0.21, 0); B(l, '#5a3a24', 0.22, 0.14, 0.3, 0, -0.44, 0.03); B(l, '#3a2a1a', 0.23, 0.03, 0.31, 0, -0.38, 0.03); });
    B(R.body, '#f2efe4', 0.5, 0.54, 0.3, 0, 0.27, 0);
    for (const s of [-1, 1]) { B(R.body, '#9a7a44', 0.16, 0.48, 0.32, s * 0.17, 0.29, 0); B(R.body, '#7d6236', 0.11, 0.09, 0.02, s * 0.17, 0.2, 0.165); B(R.body, '#7d6236', 0.11, 0.02, 0.025, s * 0.17, 0.245, 0.166); }
    B(R.body, '#4a3a2a', 0.52, 0.06, 0.32, 0, 0.04, 0); B(R.body, '#d9b44a', 0.07, 0.06, 0.02, 0, 0.04, 0.165);
    const strap = B(R.body, '#2b2b33', 0.05, 0.66, 0.02, 0, 0.3, 0.17); strap.rotation.z = 0.72;
    arms(R, 0.48, 0.33, (a) => { B(a, '#f2efe4', 0.16, 0.22, 0.18, 0, -0.1, 0); B(a, SKIN, 0.14, 0.24, 0.15, 0, -0.32, 0); });
    camera(R.arms[1], -0.44);
    R.head = joint(R.body, 0, 0.56, 0);
    blockHead(R.head, SKIN, 0.6, 0.56, 0.52, 'pixel', 0.28);
    const H = '#4a3226';
    B(R.head, H, 0.64, 0.14, 0.56, 0, 0.6, 0); B(R.head, H, 0.64, 0.44, 0.12, 0, 0.36, -0.23);
    for (const s of [-1, 1]) B(R.head, H, 0.07, 0.36, 0.52, s * 0.32, 0.4, -0.01);
    [[-0.21, 0.16], [-0.03, 0.12], [0.15, 0.17], [0.27, 0.1]].forEach(([x, h]) => B(R.head, H, 0.2, h, 0.06, x, 0.56 - h / 2 + 0.02, 0.27));
    B(R.head, '#6a4836', 0.12, 0.04, 0.5, 0.12, 0.675, 0);
    return R;
  },

  // 2 네모 꼬마
  chibi() {
    const R = rig(0.32);
    R.legs.forEach((l) => { B(l, '#3a6a8a', 0.18, 0.24, 0.2, 0, -0.12, 0); B(l, '#ffffff', 0.2, 0.1, 0.27, 0, -0.27, 0.03); B(l, '#ff6b4a', 0.21, 0.03, 0.28, 0, -0.23, 0.03); });
    B(R.body, '#3aa7a0', 0.44, 0.42, 0.28, 0, 0.21, 0);
    B(R.body, '#ffffff', 0.3, 0.07, 0.3, 0, 0.4, 0); B(R.body, '#ffd23c', 0.06, 0.06, 0.02, 0, 0.3, 0.15); B(R.body, '#ffd23c', 0.06, 0.06, 0.02, 0, 0.18, 0.15);
    arms(R, 0.38, 0.29, (a) => { B(a, '#3aa7a0', 0.14, 0.2, 0.16, 0, -0.09, 0); B(a, SKIN, 0.13, 0.13, 0.14, 0, -0.25, 0); });

    for (const s of [-1, 1]) {
      const g = onSphere(R.head, 0.36, 0.44, s * 0.27);
      add(g, new THREE.TorusGeometry(0.075, 0.022, 8, 20), mat('#ff6b4a'));
      add(g, new THREE.CircleGeometry(0.07, 20), new THREE.MeshLambertMaterial({ color: '#9fd8ff', transparent: true, opacity: 0.75 }), 0, 0, 0.005);
    }
    const sn = CAP(R.head, '#ffd23c', 0.025, 0.32, 0.36, 0.2, -0.02); sn.rotation.z = -0.15;
    S(R.head, '#ff6b4a', 0.04, 0.04, 0.04, 0.38, 0.4, -0.02);
    return R;
  },
  // 14 개구리 잠옷
  frog() {
    const R = rig(0.12);
    R.legs.forEach((l) => S(l, '#5fc25a', 0.12, 0.05, 0.17, 0, -0.07, 0.05));
    CAP(R.body, '#5fc25a', 0.36, 0.5, 0, 0.6, 0);
    S(R.body, '#d8f2a6', 0.25, 0.28, 0.08, 0, 0.42, 0.3);
    S(R.body, SKIN, 0.25, 0.21, 0.08, 0, 0.76, 0.3);
    arms(R, 0.52, 0.37, (a) => S(a, '#5fc25a', 0.075, 0.12, 0.075, 0, -0.08, 0));
    camera(R.arms[1], -0.16);
    R.head = joint(R.body, 0, 0, 0);
    R.eyes = flatFace(R.head, 0.77, 0.375, 1.05);
    for (const s of [-1, 1]) {
      S(R.head, '#5fc25a', 0.12, 0.11, 0.11, s * 0.17, 1.06, 0.1);
      S(R.head, '#ffffff', 0.08, 0.08, 0.06, s * 0.17, 1.08, 0.17);
      S(R.head, '#1b1b22', 0.04, 0.05, 0.03, s * 0.17, 1.08, 0.215);
    }
    return R;
  },
  // 15 노란 우비
  rain() {
    const R = rig(0.22);
    R.legs.forEach((l) => { CAP(l, '#ffd23c', 0.08, 0.1, 0, -0.1, 0); S(l, '#e6b800', 0.09, 0.04, 0.12, 0, -0.2, 0.03); });
    add(R.body, new THREE.CylinderGeometry(0.2, 0.34, 0.5, 32), mat('#ffd23c'), 0, 0.27, 0);
    for (let i = 0; i < 3; i++) S(R.body, '#3a7bd5', 0.03, 0.03, 0.02, 0, 0.38 - i * 0.12, 0.25 + i * 0.03);
    add(R.body, new THREE.TorusGeometry(0.2, 0.025, 8, 24), mat('#e6b800'), 0, 0.51, 0).rotation.x = Math.PI / 2;
    arms(R, 0.44, 0.24, (a) => { CAP(a, '#ffd23c', 0.06, 0.15, 0, -0.1, 0); S(a, SKIN, 0.055, 0.055, 0.055, 0, -0.25, 0); });
    camera(R.arms[1], -0.32);
    R.head = joint(R.body, 0, 0.5, 0);
    const r = 0.34;
    S(R.head, SKIN, r, r * 0.95, r, 0, r, 0);
    const hg = joint(R.head, 0, r, 0);
    R.eyes = roundFace(hg, r * 0.97, { eye: 1.1 });
    for (const [x, s] of [[-0.16, 0.1], [0, 0.12], [0.16, 0.1]]) S(hg, '#5a3a26', s, s * 0.6, s * 0.5, x, r * 0.62, r * 0.66);
    add(hg, HALF_TOP(0.62), mat('#ffd23c'), 0, 0.0, -0.03, r * 1.14, r * 1.12, r * 1.12).rotation.x = -0.55;
    S(hg, '#ffd23c', r * 1.06, r * 0.96, r * 0.95, 0, -0.04, -0.09);
    add(hg, new THREE.TorusGeometry(r * 1.06, 0.03, 8, 32), mat('#e6b800'), 0, 0.12, 0.13).rotation.x = Math.PI / 2 - 0.95;
    return R;
  },
});

// ---------- 카드 만들기 ----------
const grid = document.getElementById('grid');
grid.innerHTML = DESIGNS.map((d) => `
  <article class="card${d.picked ? ' picked' : ''}">
    <div class="view" data-design="${d.id}" role="img" aria-label="${d.no}번 ${d.name}"><span class="num">${d.no}</span></div>
    <div class="meta"><span class="tag ${d.picked ? 'pick' : d.kind}">${d.picked ? '고른 시안' : '새 둥근 시안'}</span><b>${d.name}</b><p>${d.desc}</p></div>
  </article>`).join('');

// ---------- 그리기: 캔버스 하나로 카드 창마다 ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setScissorTest(true);
const views = [...document.querySelectorAll('.view')].map((el) => {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#ffffff', '#8aa08f', 1.9));
  const sun = new THREE.DirectionalLight('#fff4e0', 1.5); sun.position.set(2, 4, 4); scene.add(sun);
  const R = BUILD[el.dataset.design]();
  scene.add(R.root);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(0.55, 32), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.12 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = 0.005; scene.add(ground);
  const cam = new THREE.PerspectiveCamera(28, 3 / 4, 0.1, 20);
  cam.position.set(0, 1.15, 4.3); cam.lookAt(0, 0.86, 0);
  const v = { el, scene, R, cam, yaw: 0.35, drag: null, phase: Math.random() * 6 };
  el.addEventListener('pointerdown', (e) => { v.drag = e.clientX; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', (e) => { if (v.drag === null) return; v.yaw += (e.clientX - v.drag) * 0.012; v.drag = e.clientX; });
  const end = () => { v.drag = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  return v;
});

let walking = false, spinning = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const walkBtn = document.getElementById('walkBtn'), spinBtn = document.getElementById('spinBtn');
spinBtn.setAttribute('aria-pressed', String(spinning));
walkBtn.onclick = () => { walking = !walking; walkBtn.setAttribute('aria-pressed', String(walking)); };
spinBtn.onclick = () => { spinning = !spinning; spinBtn.setAttribute('aria-pressed', String(spinning)); };

function animate(v, t, dt) {
  const R = v.R, k = t + v.phase;
  if (spinning && v.drag === null) v.yaw += dt * 0.45;
  R.root.rotation.y = v.yaw;
  const w = walking ? Math.sin(k * 8) * 0.6 : 0;
  R.legs[0].rotation.x = w; R.legs[1].rotation.x = -w;
  if (R.arms[0]) { R.arms[0].rotation.x = walking ? -w * 0.8 : Math.sin(k * 1.6) * 0.06; R.arms[0].rotation.z = -0.08; }
  if (R.arms[1]) { R.arms[1].rotation.x = walking ? w * 0.3 - 0.5 : -0.5; R.arms[1].rotation.z = 0.08; }
  R.hips.position.y = R.leg + (walking ? Math.abs(Math.sin(k * 8)) * 0.04 : Math.sin(k * 2) * 0.008);
  if (R.head) R.head.rotation.z = walking ? 0 : Math.sin(k * 0.9) * 0.05;
  if (R.tail) R.tail.rotation.y = Math.sin(k * 3) * 0.5;
  // 눈 깜빡
  const blink = (k % 3.4) < 0.12 ? 0.15 : 1;
  R.eyes.forEach((e) => { e.scale.y = blink; });
}

let bg = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { bg = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim(); });
new MutationObserver(() => { bg = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== Math.floor(W * renderer.getPixelRatio()) || canvas.height !== Math.floor(H * renderer.getPixelRatio())) renderer.setSize(W, H, false);
  renderer.setScissor(0, 0, W, H); renderer.setClearColor(0x000000, 0); renderer.clear();
  for (const v of views) {
    const r = v.el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > H || r.right < 0 || r.left > W) continue;
    animate(v, t, dt);
    const y = H - r.bottom;
    renderer.setViewport(r.left, y, r.width, r.height);
    renderer.setScissor(r.left, y, r.width, r.height);
    renderer.setClearColor(bg, 1); renderer.clear();
    v.cam.aspect = r.width / r.height; v.cam.updateProjectionMatrix();
    renderer.render(v.scene, v.cam);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
