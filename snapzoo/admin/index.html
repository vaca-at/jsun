<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>동물 왕국 관리자</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
@font-face {
  font-family: 'OngleipUnz';   /* 온글잎 언즈체 (눈누 · 상업용 무료, 웹 임베딩 가능) */
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2');
  font-weight: normal;
  font-display: swap;
}
/* 관리자 대시보드: 위에 숫자 카드, 가운데 14일 방문 막대 · 오늘 시간대, 아래 서버 12칸. 게임과 같은 색 */
:root {
  --bg: #eef5ef; --card: #fffdf6; --ink: #24342b; --soft: #5d6d62; --line: #d5e3d8;
  --leaf: #3f8f5a; --leaf-2: #8fd3a8; --sun: #ffc93c; --coral: #ff6b4a;
  --display: "OngleipUnz", "Jua", "Apple SD Gothic Neo", sans-serif; --body: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141d17; --card: #1f2b23; --ink: #e8f1ea; --soft: #a3b6a8; --line: #33463a; --leaf: #7fd39b; --leaf-2: #3f8f5a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #141d17; --card: #1f2b23; --ink: #e8f1ea; --soft: #a3b6a8; --line: #33463a; --leaf: #7fd39b; --leaf-2: #3f8f5a; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; }
h1 small { font-family: var(--body); font-size: 14px; color: var(--soft); margin-left: 6px; }
h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 400; font-size: 18px; }
.muted { color: var(--soft); font-size: 13px; }
button, input { font: inherit; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); font-family: var(--display); cursor: pointer; }
.btn.primary { background: var(--leaf); color: #fff; border-color: var(--leaf); }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.login { max-width: 380px; margin: 12vh auto 0; background: var(--card); border: 2px solid var(--ink); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.login input { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); padding: 0 14px; background: var(--bg); color: var(--ink); }
.err { color: var(--coral); min-height: 1.2em; margin: 0; font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font-family: var(--display); font-weight: 400; font-size: 32px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile.live { border-color: var(--leaf); }
.tile.live b::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--leaf); margin-right: 8px; vertical-align: 6px; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.panel { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
@media (max-width: 720px) { .row2 { grid-template-columns: 1fr; } }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--soft); font-size: 11px; font-family: var(--body); }
.chart .val { fill: var(--ink); font-size: 11px; }
.chart rect.bar { fill: var(--leaf-2); }
.chart rect.bar.today { fill: var(--leaf); }
.chart line { stroke: var(--line); }
.hours { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.hours div { aspect-ratio: 1; border-radius: 6px; background: color-mix(in srgb, var(--leaf) calc(var(--k) * 100%), var(--bg)); position: relative; }
.hours div span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; color: var(--soft); }
.servers { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .servers { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.srv { border: 1.5px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
.srv small { display: block; color: var(--soft); font-size: 12px; }
.srv b { font-family: var(--display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.srv .meter { height: 6px; border-radius: 999px; background: var(--line); margin-top: 6px; overflow: hidden; }
.srv .meter i { display: block; height: 100%; background: var(--leaf); }
.srv.busy { border-color: var(--leaf); }
</style>
</head>
<body>
<div class="wrap">
  <section class="login" id="login">
    <h1>동물 왕국 관리자</h1>
    <p class="muted">중계 서버에 넣어 둔 관리자 비밀번호로 들어가요. 숫자만 보여요 (누가 왔는지는 남기지 않아요).</p>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="err" role="alert"></p>
    <button class="btn primary" id="go" type="button">들어가기</button>
  </section>

  <main id="dash" hidden>
    <header>
      <h1>동물 왕국 <small id="updated">불러오는 중…</small></h1>
      <div><button class="btn" id="refresh" type="button">새로고침</button> <button class="btn" id="out" type="button">나가기</button></div>
    </header>
    <div class="tiles" id="tiles"></div>
    <div class="row2">
      <section class="panel"><h2>최근 14일 방문</h2><svg class="chart" id="days" viewBox="0 0 560 220" role="img" aria-label="최근 14일 방문 막대 그래프"></svg></section>
      <section class="panel"><h2>오늘 시간대</h2><div class="hours" id="hours"></div><p class="muted">한국 시간 기준 · 진할수록 많이 들어왔어요</p></section>
    </div>
    <section class="panel"><h2>서버 12개 지금 인원 <small class="muted">(정거장 대기실 · 서버 하나 100명까지)</small></h2><div class="servers" id="servers"></div></section>
  </main>
</div>

<script type="module">
import { RELAY_URL } from '../js/data.js';
const q = new URLSearchParams(location.search).get('relay');
const RELAY = (q && /^https?:\/\/[\w.:-]+$/.test(q) ? q : RELAY_URL).replace(/\/$/, '');
const $ = (s) => document.querySelector(s);
const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
let pass = '';
try { pass = sessionStorage.getItem('snapzoo-admin') || ''; } catch { /* 저장 안 됨 */ }

async function load() {
  let r;
  try { r = await fetch(`${RELAY}/admin/stats`, { headers: { Authorization: `Bearer ${pass}` } }); }
  catch { $('#err').textContent = '중계 서버에 닿지 않아요. 서버가 배포됐는지 확인해 주세요.'; showLogin(); return; }
  if (r.status === 401) { $('#err').textContent = '비밀번호가 맞지 않아요.'; showLogin(); return; }
  const s = await r.json();
  try { sessionStorage.setItem('snapzoo-admin', pass); } catch { /* 저장 안 됨 */ }
  $('#login').hidden = true; $('#dash').hidden = false;
  render(s);
}
function showLogin() { $('#dash').hidden = true; $('#login').hidden = false; $('#pw').focus(); }

function render(s) {
  const today = s.days[s.today] || { visits: 0, peak: 0, hours: Array(24).fill(0) };
  const keys = [...Array(14)].map((_, i) => { const d = new Date(s.today + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - (13 - i)); return d.toISOString().slice(0, 10); });
  const week = keys.slice(7).reduce((a, k) => a + (s.days[k]?.visits || 0), 0);
  $('#tiles').innerHTML = [
    ['지금 접속', s.online, 'live'], ['오늘 방문', today.visits], ['오늘 최고 동시접속', today.peak],
    ['최근 7일 방문', week], ['전체 방문', s.total], ['역대 최고 동시접속', s.best?.n || 0],
  ].map(([l, v, c]) => `<div class="tile ${c || ''}"><span class="muted">${l}</span><b>${fmt(v)}</b></div>`).join('');
  // 14일 막대
  const vals = keys.map((k) => s.days[k]?.visits || 0), max = Math.max(5, ...vals), W = 560, H = 220, P = 26, bw = (W - P) / 14;
  const nice = Math.ceil(max / 5) * 5;
  let svg = '';
  for (let i = 0; i <= 4; i++) { const y = 10 + (H - 40) * (1 - i / 4); svg += `<line x1="${P}" x2="${W}" y1="${y}" y2="${y}"/><text x="${P - 6}" y="${y + 4}" text-anchor="end">${Math.round(nice * i / 4)}</text>`; }
  vals.forEach((v, i) => {
    const h = (H - 40) * v / nice, x = P + i * bw + 4, y = H - 30 - h;
    svg += `<rect class="bar ${i === 13 ? 'today' : ''}" x="${x}" y="${y}" width="${bw - 8}" height="${Math.max(0, h)}" rx="4"><title>${keys[i]} · ${v}명</title></rect>`;
    if (v) svg += `<text class="val" x="${x + (bw - 8) / 2}" y="${y - 4}" text-anchor="middle">${v}</text>`;
    if (i % 2 === 1 || i === 13) svg += `<text x="${x + (bw - 8) / 2}" y="${H - 12}" text-anchor="middle">${i === 13 ? '오늘' : keys[i].slice(5).replace('-', '/')}</text>`;
  });
  $('#days').innerHTML = svg;
  const hmax = Math.max(1, ...today.hours);
  $('#hours').innerHTML = today.hours.map((n, h) => `<div style="--k:${(n / hmax).toFixed(2)}" title="${h}시 · ${n}명"><span>${h}</span></div>`).join('');
  $('#servers').innerHTML = s.rooms.map((n, i) => `<div class="srv ${n ? 'busy' : ''}"><small>${i + 1}번</small><b>${n}</b><div class="meter"><i style="width:${Math.min(100, n)}%"></i></div></div>`).join('');
  $('#updated').textContent = `${new Date(s.now).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })} 기준`;
}

$('#go').onclick = () => { pass = $('#pw').value.trim(); $('#err').textContent = ''; load(); };
$('#pw').onkeydown = (e) => { if (e.key === 'Enter') $('#go').click(); };
$('#refresh').onclick = load;
$('#out').onclick = () => { pass = ''; try { sessionStorage.removeItem('snapzoo-admin'); } catch { /* 없음 */ } showLogin(); };
setInterval(() => { if (!$('#dash').hidden) load(); }, 30000);
if (pass) load(); else showLogin();
</script>
</body>
</html>
