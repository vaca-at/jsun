<!DOCTYPE html>
<html lang="ko" data-design="toss" data-font="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루 10분 외국어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Zen+Maru+Gothic:wght@500;700&family=Nanum+Pen+Script&family=Klee+One:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@500;700;900&family=Playfair+Display:ital,wght@1,500&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root,:root[data-design="toss"]{
  --bg:#f2f4f6; --card:#ffffff; --line:#e5e8eb; --line2:#f2f4f6;
  --ink:#191f28; --sub:#6b7684; --faint:#b0b8c1;
  --accent:#3182f6; --accent-ink:#ffffff; --accent-soft:#e8f3ff;
  --gold:#3182f6; --gold-soft:#f2f4f6; --ok:#12a150; --ok-soft:#e5f6ec;
  --shadow:none; --r-card:22px; --r-btn:14px;
}
:root[data-design="note"]{
  --bg:#f4efe2; --card:#fffdf5; --line:#e2d8bf; --line2:#ebe3cc;
  --ink:#2b2b2b; --sub:#7d7466; --faint:#b5aa94;
  --accent:#e05a47; --accent-ink:#ffffff; --accent-soft:#fff1a6;
  --gold:#c28a2c; --gold-soft:#fbf3dc; --ok:#3f7d58; --ok-soft:#e3f1e7;
  --shadow:2px 3px 0 rgba(120,100,60,.12); --r-card:4px; --r-btn:6px;
}
:root[data-design="pass"]{
  --bg:#e9eef5; --card:#ffffff; --line:#d5dde8; --line2:#e6ebf2;
  --ink:#1f2a3d; --sub:#6b7a90; --faint:#a3b0c2;
  --accent:#1f3a68; --accent-ink:#ffffff; --accent-soft:#eef3fa;
  --gold:#c0392b; --gold-soft:#f3f6fa; --ok:#2f7a55; --ok-soft:#e2f2ea;
  --shadow:0 6px 18px rgba(31,58,104,.08); --r-card:14px; --r-btn:10px;
}
:root[data-design="wafu"]{
  --bg:#efe7d6; --card:#f7f1e3; --line:#d9cdb5; --line2:#e6dcc6;
  --ink:#2b2622; --sub:#7b6f60; --faint:#b3a690;
  --accent:#b7282e; --accent-ink:#ffffff; --accent-soft:#fffaf0;
  --gold:#8a6d3b; --gold-soft:#fffaf0; --ok:#4d6b3c; --ok-soft:#eaf0df;
  --shadow:none; --r-card:2px; --r-btn:2px;
}
:root,:root[data-font="1"]{--f-title:"Pretendard",sans-serif;--f-body:"Pretendard",sans-serif;--f-card:"Noto Sans JP","Pretendard",sans-serif}
:root[data-font="2"]{--f-title:"Gowun Dodum",sans-serif;--f-body:"Gowun Dodum",sans-serif;--f-card:"Zen Maru Gothic","Gowun Dodum",sans-serif}
:root[data-font="3"]{--f-title:"Nanum Pen Script",cursive;--f-body:"Gowun Dodum",sans-serif;--f-card:"Klee One","Gowun Dodum",sans-serif}
:root[data-font="9"]{--f-title:"IBM Plex Sans KR",sans-serif;--f-body:"Noto Sans KR",sans-serif;--f-card:"BIZ UDPGothic","Noto Sans KR",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.jp,.word,.kana{font-family:var(--f-card)}
.card-title,.hello{font-family:var(--f-title)}

#app{max-width:480px;margin:0 auto;min-height:100%;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:19px;font-weight:900;letter-spacing:-.02em;flex:1}
header h1 small{display:block;font-size:12px;font-weight:500;color:var(--sub);letter-spacing:0}
.hero{position:relative;height:214px;border-radius:var(--r-card);overflow:hidden;margin-bottom:14px;font-family:Pretendard,sans-serif;box-shadow:var(--shadow)}
.hero .in{position:absolute;inset:0;padding:22px 20px 16px;display:flex;flex-direction:column;z-index:3}
.hero h1{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin:0}
.hero .sub{font-size:14px;margin-top:8px;opacity:.9}
.hero .note{font-size:11.5px;opacity:.7;margin-top:3px}
.hero .tg{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;border-radius:999px;padding:4px;gap:4px}
.hero .tg button{padding:10px 0;border-radius:999px;font-weight:800;font-size:15px;color:inherit;opacity:.8}
.hero .tg button.on{background:var(--tg-bg);color:var(--tg-ink);opacity:1}
.hero .tg b{font-size:11px;font-weight:800;letter-spacing:.06em;margin-right:5px;padding:2px 5px;border-radius:4px;border:1px solid currentColor}
.hero .pal{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;z-index:4}
.hero .deco{position:absolute;inset:0;z-index:1;pointer-events:none}
@keyframes h-dash{to{stroke-dashoffset:0}}
@keyframes h-sky{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes h-blink{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes h-fly{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes h-rise{0%,100%{transform:translateY(20px)}50%{transform:translateY(-6px)}}
@keyframes h-slide{from{background-position:0 0}to{background-position:80px 0}}
@keyframes h-flick{0%,18%,22%,100%{opacity:1}20%{opacity:.35}60%{opacity:.85}}
@keyframes h-fade{from{opacity:0}to{opacity:1}}
.hero .in{animation:h-fade .5s ease-out}
@media (prefers-reduced-motion:reduce){.hero *{animation:none!important}}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px;display:grid;place-items:center}

.lang-switch{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:18px}
.lang-switch button{padding:10px;border-radius:999px;font-weight:700;font-size:15px;color:var(--sub)}
.lang-switch button.on{background:var(--accent);color:var(--accent-ink)}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card.framed{outline:1px solid var(--line);outline-offset:5px;margin:6px 6px 22px}
.card-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line2);margin-bottom:16px;position:relative;z-index:1}
.seal{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--gold-soft);display:grid;place-items:center;font-weight:900;color:var(--gold);font-size:17px;flex:none}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--gold)}
.card-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
.count{margin-left:auto;font-size:14px;font-weight:700;color:var(--sub)}
.watermark{position:absolute;right:-6px;top:-8px;font-size:84px;font-weight:900;color:var(--line2);opacity:.7;pointer-events:none;line-height:1}

.word{font-size:40px;font-weight:900;letter-spacing:.02em;line-height:1.25;word-break:keep-all;position:relative;z-index:1}
.word.phrase{font-size:27px;letter-spacing:0}
.kana{font-size:16px;color:var(--sub);margin-top:2px}
.reading{color:var(--accent);font-weight:700;font-size:16px;margin-top:6px}
.meaning{font-size:22px;font-weight:500;margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.ess{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:linear-gradient(90deg,#9a7433,#e9cf8e);color:#2a2320}
.tip{display:flex;gap:10px;background:var(--accent-soft);border-radius:var(--r-btn);padding:12px 14px;margin-top:16px;font-size:14px;font-weight:500;line-height:1.5}
.tip svg{flex:none;margin-top:2px;color:var(--accent)}

.btns{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:18px}
.btn{padding:14px 10px;border-radius:var(--r-btn);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{border:1px solid var(--line);background:var(--card)}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--gold-soft);color:var(--ink);border:1px solid var(--line)}
.btn.okb{background:var(--ok-soft);color:var(--ok);border:1px solid transparent}
.btn:disabled{opacity:.4;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:16px}
.dots i{width:8px;height:8px;border-radius:999px;background:var(--line2)}
.dots i.done{background:var(--gold);opacity:.7}
.dots i.cur{width:22px;background:var(--accent);opacity:1}
.foot{border-top:1px solid var(--line2);margin-top:16px;padding-top:12px;font-size:13px;color:var(--sub);line-height:1.6}

.hello{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:4px 2px 14px;line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900}
.stat span{font-size:12px;color:var(--sub)}
.big-start{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-card);padding:18px 20px;text-align:left;margin-bottom:18px;display:flex;align-items:center;gap:14px}
.big-start b{display:block;font-size:18px}
.big-start span{font-size:13px;opacity:.85}
.big-start em{margin-left:auto;font-style:normal;font-size:26px}
.sec-title{font-size:15px;font-weight:700;color:var(--sub);margin:6px 4px 10px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;text-align:left}
.topic .ic{font-size:26px}
.topic b{display:block;font-size:16px;margin-top:6px}
.topic small{color:var(--sub);font-size:12px}
.bar{height:6px;border-radius:9px;background:var(--line2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px 4px}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;color:var(--sub)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.back{font-weight:700;color:var(--sub);padding:6px 2px;margin-bottom:8px;font-size:14px}

.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:500;margin-top:10px}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.list-item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line2)}
.list-item:last-child{border-bottom:none}
.list-item .t{flex:1;min-width:0}
.list-item .t b{display:block;font-size:17px}
.list-item .t span{font-size:13px;color:var(--sub)}
.mini{padding:7px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;background:var(--card)}
.empty{text-align:center;color:var(--sub);padding:24px 10px;line-height:1.7;font-size:14px}
.star-btn{position:absolute;right:18px;top:78px;z-index:2;font-size:22px;color:var(--gold)}

nav.tabs{position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0 12px;margin:-6px 0 6px}
nav.tabs div{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:5px;box-shadow:var(--shadow)}
nav.tabs button{padding:8px 0 7px;font-size:12px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:var(--r-btn);word-break:keep-all;line-height:1.2}
nav.tabs button span{font-size:19px;filter:grayscale(1);opacity:.55}
nav.tabs button.on{background:var(--accent);color:var(--accent-ink)}
nav.tabs button.on span{filter:none;opacity:1}

.mode{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold);margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;white-space:nowrap}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.row-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px;color:var(--ink)}
.row-item .no{width:34px;height:34px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center;font-weight:800;color:var(--gold);flex:none;border:1px solid var(--line)}
.row-item.done .no{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.row-item b{display:block;font-size:16px}
.row-item small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px;font-family:var(--f-card)}
.form-box{margin-top:12px;background:var(--gold-soft);border:1px solid var(--line);border-radius:var(--r-btn);padding:11px 13px;font-family:var(--f-card);font-weight:700;font-size:15px}
.ex{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
.ex:last-child{border-bottom:none}
.ex-w{font-family:var(--f-card);font-size:18px;font-weight:700}
.ex-r{font-size:13px;color:var(--sub);margin-top:2px}
.q-guide{color:var(--sub);font-size:13.5px;line-height:1.6;margin:0 0 10px}
.q-sent{font-family:var(--f-card);font-size:24px;font-weight:700;line-height:1.5;margin-bottom:4px}
.q-mean{font-size:18px;font-weight:700;margin-bottom:8px}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--accent);text-align:center;padding:0 6px;color:var(--accent)}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.blank.no{color:var(--accent)}
.ans-line{min-height:56px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tok{padding:10px 13px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--card);font-family:var(--f-card);font-size:16px;font-weight:700;color:var(--ink)}
.ans-line .tok{background:var(--accent-soft);border-color:transparent}
.tok.used{opacity:.25}
.bub-row{display:flex;margin:10px 0}
.bub-row.me{justify-content:flex-end}
.bub-row.me .who{text-align:right}
.who{font-size:11.5px;color:var(--sub);margin:0 4px 3px}
.bub{display:block;text-align:left;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--gold-soft);border:1px solid var(--line);color:var(--ink);transition:box-shadow .2s}
.me .bub{border-radius:16px 16px 4px 16px;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bub .w{font-family:var(--f-card);font-size:18px;font-weight:700;line-height:1.4}
.bub .r{font-size:12.5px;opacity:.8;margin-top:2px}
.bub .m{font-size:13.5px;opacity:.92;margin-top:2px}
.bub.q{background:var(--card);border:2px dashed var(--accent);color:var(--ink)}
.bub.q .m{font-size:16px;font-weight:700;opacity:1}
.bub.playing{box-shadow:0 0 0 3px var(--gold)}
.watermark{display:none}
.card.framed{outline:none}
.style-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 14px 4px;margin-bottom:14px}
.privacy{font-size:12.5px;color:var(--sub);line-height:1.6;margin:0 0 12px}
.style-panel .lbl{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
[data-design="toss"] .card{border:none}
[data-design="toss"] .stat,[data-design="toss"] .topic{border:none}
[data-design="note"] .card{background:repeating-linear-gradient(var(--card) 0 27px,#dbe6f0 27px 28px);border-left:3px solid #f2a7a0}
[data-design="note"] .card.framed::before{content:"";position:absolute;top:6px;left:50%;width:78px;height:16px;transform:translateX(-50%) rotate(-3deg);background:rgba(240,190,90,.55);z-index:2}
[data-design="note"] .card.framed .card-head{margin-top:8px}
[data-design="note"] .tip{color:#5c4a00}
[data-design="pass"] .card-head{margin:-20px -20px 16px;padding:12px 20px;background:var(--accent);color:#fff;border-bottom:none}
[data-design="pass"] .card-head .eyebrow,[data-design="pass"] .card-head .count{color:#cfd9ea}
[data-design="pass"] .card-head .seal{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
[data-design="pass"] .foot{border-top:1px dashed var(--faint)}
[data-design="pass"] .ess{background:none;border:2px solid #c0392b;color:#c0392b;transform:rotate(-8deg)}
[data-design="pass"] .reading{color:#c0392b}
[data-design="pass"] .star-btn{top:86px}
[data-design="wafu"] .card{background:repeating-linear-gradient(90deg,var(--card) 0 34px,#efe6d2 34px 35px)}
[data-design="wafu"] .seal{border-radius:2px;background:var(--accent);color:#fff;border:none}
[data-design="wafu"] .tip{border:1px solid var(--line)}
[data-design="wafu"] .ess{background:var(--accent);color:#fff}
[data-font="3"] .card-title{font-size:27px}
[data-font="3"] .hello{font-size:31px;line-height:1.15}
[data-font="9"] body{font-size:17px}
[data-font="9"] .meaning{font-size:24px}
[data-font="9"] .tip{font-size:15.5px}
[data-font="9"] .foot,[data-font="9"] .stat span,[data-font="9"] .topic small{font-size:14px}
[data-font="9"] nav.tabs button{font-size:13px}

/* 수업 테마 */
.big-start.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.src{font-size:13px;color:var(--gold);font-weight:700;margin-top:8px;position:relative;z-index:1}
.word.long{font-size:21px;line-height:1.4}
.subj{margin-bottom:10px}
.lead{font-size:13px;color:var(--sub);margin:0 4px 12px;line-height:1.5}

/* 히라가나·가타카나 */
.kcard{padding:14px 12px}
.kgrid{display:grid;grid-template-columns:30px repeat(5,1fr);gap:6px;align-items:center}
.kvow{text-align:center;font-size:11px;font-weight:700;color:var(--faint)}
.klabel{font-size:13px;font-weight:700;color:var(--gold);text-align:center}
.kcell{border:1px solid var(--line);background:var(--card);border-radius:var(--r-btn);min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;color:var(--ink)}
.kcell b{font-size:24px;font-weight:700;font-family:var(--f-card)}
.kcell small{font-size:11px;color:var(--sub);margin-top:3px;font-family:var(--f-body)}
.kcell.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kcell.on small{color:var(--accent-ink)}
.kex{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--gold-soft);border:1px solid var(--line2);border-radius:var(--r-btn);padding:8px 10px;margin-bottom:8px}
.kex .t{flex:1;min-width:0}
.kex b{display:block;font-size:15px;font-family:var(--f-card)}
.kex span{display:block;font-size:12px;color:var(--sub)}
.kex em{display:block;font-style:normal;font-size:12px;margin-top:3px;opacity:.85}
.kdetail{grid-column:1/-1;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r-btn);padding:12px 14px}
.kd-top{display:flex;align-items:center;gap:12px}
.kbig{font-size:60px;font-weight:900;line-height:1;font-family:var(--f-card)}

const KEY = "lang10_data";
function loadData(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return Object.assign(blank(), JSON.parse(raw)); }catch(e){}
  return blank();
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){ toast("이 브라우저에서는 기록을 저장할 수 없어요"); } }, 300);

function exportData(){

function today(d){ d = d || new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function yesterday(){ const d = new Date(); d.setDate(d.getDate()-1); return today(d); }
function curStreak(){ return (D.lastDate === today() || D.lastDate === yesterday()) ? D.streak : 0; }
function markStudy(){
  const t = today(); if(D.lastDate === t) return;
  D.streak = (D.lastDate === yesterday()) ? D.streak + 1 : 1;
  D.lastDate = t; save();
}
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1800); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function isJa(){ return S.lang === "ja"; }
function langLabel(){ return isJa() ? "JAPANESE" : "ENGLISH"; }
function seal(){ return isJa() ? "あ" : "A"; }

function speak(text, onend, pitch){
  if(!("speechSynthesis" in window)) return toast("이 기기는 음성 읽기를 지원하지 않아요");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/○○/g, isJa() ? "キム" : "Kim"));
  u.lang = isJa() ? "ja-JP" : "en-US"; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace("_","-").toLowerCase().startsWith(u.lang.slice(0,2)));
  if(v) u.voice = v;
  u.pitch = pitch || 1;
  if(onend){ u.onend = onend; u.onerror = onend; }
  speechSynthesis.speak(u);
}
if("speechSynthesis" in window){ speechSynthesis.getVoices(); }

function allWords(lang){
  lang = lang || S.lang; const out = [];
  VOCAB[lang].forEach((tp,ti)=> tp.items.forEach((a,i)=>{
    const o = lang === "ja" ? {w:a[0], kana:a[1], r:a[2], m:a[3]} : {w:a[0], kana:"", r:a[1], m:a[2]};
    o.id = lang + "-v-" + ti + "-" + i; o.topic = tp.name; out.push(o);
  }));
  return out;
}
function allPhrases(lang){
  lang = lang || S.lang; const out = [];
  TRAVEL[lang].forEach((c,ci)=> c.items.forEach((a,i)=> out.push({id:lang+"-t-"+ci+"-"+i, w:a[0], r:a[1], m:a[2], tip:a[3], ess:a[4], cat:c.name})));
  return out;
}
function allTheme(lang){
  lang = lang || S.lang; const out = [];
  Object.keys(THEME[lang]).forEach(key => THEME[lang][key].forEach((c,ci)=> c.items.forEach((a,i)=> out.push({
    id:lang+"-m-"+key+"-"+ci+"-"+i, w:a[0], kana:a[1], r:a[2], m:a[3], src:a[4], tip:a[5], cat:c.name}))));
  return out;
}
const byId = id => { const l = id.slice(0,2); return allWords(l).concat(allPhrases(l), allTheme(l)).find(x=>x.id===id); };

    if(D.known.includes(id)){ D.known = D.known.filter(x => x !== id); }

    if(D.review.includes(id)){ D.review = D.review.filter(x => x !== id); }
    else { D.review.push(id); D.known = D.known.filter(x => x !== id); toast("복습함에 넣었어요"); }
  }

function startQuiz(){

    const wrong = shuffle(pool.filter(p => p.m !== it.m)).slice(0,3).map(p => p.m);
    return {it, opts:shuffle([it.m].concat(wrong))};
  });

}
function renderQuiz(){

    return `<div class="card framed" style="text-align:center">

    : "가타카나는 커피·호텔 같은 외래어를 쓰는 글자예요. 소리는 히라가나와 똑같고 모양만 달라요. 영어 단어를 떠올리면 쉽게 읽혀요.";

    </div>

function startKanaQuiz(){
  const pool = []; KANA[S.kn.set][S.kn.grp].forEach(r => r.cells.forEach(c => { if(c) pool.push(c); }));
  const reads = [...new Set(pool.map(c => c[1]))];
  const qs = shuffle(pool).slice(0,10).map(c => ({c, opts:shuffle([c[1]].concat(shuffle(reads.filter(x => x !== c[1])).slice(0,3)))}));
  S.kq = {qs, idx:0, score:0, picked:null}; S.vocabView = "kquiz"; render(); window.scrollTo(0,0);
}
function renderKanaQuiz(){
  const q = S.kq, name = S.kn.set === "hira" ? "히라가나" : "가타카나";
  if(q.idx >= q.qs.length){
    return `<div class="card framed" style="text-align:center">
      <div style="font-size:48px">${q.score >= q.qs.length*0.8 ? "🏆" : "💪"}</div>
      <div class="card-title" style="margin-top:8px">${q.qs.length}문제 중 ${q.score}개 맞혔어요</div>
      <div class="row2" style="margin-top:18px">
        <button class="btn ghost" onclick="S.vocabView='kana';render()">글자표로 돌아가기</button>
        <button class="btn main" onclick="startKanaQuiz()">다시 풀기</button>
      </div></div>`;
  }
  const cur = q.qs[q.idx];
  return `<button class="back" onclick="S.vocabView='kana';render()">‹ 글자표로 돌아가기</button>
    <div class="card framed">
      <div class="card-head"><div class="seal">${S.kn.set === "hira" ? "あ" : "ア"}</div><div><div class="eyebrow">QUIZ</div><div class="card-title">${name} 읽기</div></div><div class="count">${q.idx+1} / ${q.qs.length}</div></div>
      <div class="kq-char">${cur.c[0]}</div>
      <p style="color:var(--sub);font-size:14px;margin:4px 0 2px;text-align:center">어떻게 읽을까요?</p>
      ${cur.opts.map((o,i)=>{
        let cls = "";
        if(q.picked !== null){ if(o === cur.c[1]) cls = " right"; else if(i === q.picked) cls = " wrong"; }
        return `<button class="opt${cls}" onclick="kPick(${i})" ${q.picked !== null ? "disabled" : ""}>${o}</button>`;
      }).join("")}
      ${q.picked !== null ? `${cur.c[2] ? `<div class="tip"><p><b class="jp">${hl(cur.c[2], cur.c[0])}</b> [${cur.c[3]}] ${cur.c[4]}</p></div>` : ""}
        <button class="btn main" style="width:100%;margin-top:12px" onclick="S.kq.idx++;S.kq.picked=null;render()">${q.idx === q.qs.length-1 ? "결과 보기" : "다음 문제 ›"}</button>` : ""}
      ${dots(q.qs.length, q.idx)}
    </div>`;
}
function kPick(i){ const q = S.kq, cur = q.qs[q.idx]; q.picked = i; if(cur.opts[i] === cur.c[1]) q.score++; speak(cur.c[0]); markStudy(); render(); }

function themeCats(){
  const T = THEME[S.lang];
  return (T[D.subject] || []).map((c,ci)=>({c, key:D.subject, ci})).concat((T.common || []).map((c,ci)=>({c, key:"common", ci})));
}
function setSubject(s){ D.subject = s; save(); S.th = null; S.thCat = 0; render(); }
function setThCat(i){ S.thCat = i; S.th = null; render(); }
function renderTheme(){

    const en = !isJa();
    return `<div class="hello">어떤 과목<br>선생님이세요?</div>
      <button class="big-start" onclick="setSubject('ethics')"><div><b>🧭 윤리 선생님</b><span>${en ? "미국 철학자들의 유명한 한마디로 영어를 익혀요" : "일본의 마음·예절 말과 애니·영화·여행지 이야기"}</span></div><em>›</em></button>
      <button class="big-start alt" onclick="setSubject('music')"><div><b>🎵 음악 선생님</b><span>${en ? "누구나 아는 서양 명곡 제목으로 영어를 익혀요" : "일본 노래·전통 악기와 애니·영화·여행지 이야기"}</span></div><em>›</em></button>
      <p class="lead">언제든 위쪽에서 과목을 바꿀 수 있어요.</p>`;
  }
  const cats = themeCats(); if(S.thCat >= cats.length) S.thCat = 0;
  const cur = cats[S.thCat], prefix = S.lang + "-m-" + cur.key + "-" + cur.ci + "-";
  if(!S.th || S.th.prefix !== prefix){ S.th = {prefix, list:allTheme().filter(x => x.id.startsWith(prefix)), idx:0}; }
  const it = S.th.list[S.th.idx];
  const lead = !isJa()
    ? (D.subject === "ethics" ? "미국 철학자들의 유명한 한마디와 윤리 핵심 단어로 영어를 익혀요." : "서양 명곡 제목과 음악 용어로 영어를 익혀요.")
    : "일본 애니메이션·영화 표현과 여행지 이야기로 일본어를 익혀요.";
  return `<div class="lang-switch subj">
      <button class="${D.subject==="ethics" ? "on" : ""}" onclick="setSubject('ethics')">🧭 윤리</button>
      <button class="${D.subject==="music" ? "on" : ""}" onclick="setSubject('music')">🎵 음악</button>
    </div>

    ${cardHTML({title:cur.c.name, idx:S.th.idx, len:S.th.list.length, item:it, phrase:true,
      star:D.star.includes(it.id), starFn:"thStar()", prev:"thMove(-1)", next:"thMove(1)", say:"speakTh()",
      foot:"수업 도입 1분 활동으로 써 보세요 · ☆를 누르면 복습함에 저장돼요"})}`;
}
function thMove(d){ const th = S.th; th.idx = Math.max(0, Math.min(th.list.length-1, th.idx + d)); markStudy(); render(); }
function speakTh(){ speak(S.th.list[S.th.idx].w); markStudy(); }
function thStar(){
  const id = S.th.list[S.th.idx].id; const i = D.star.indexOf(id);
  if(i >= 0){ D.star.splice(i,1); toast("복습함에서 뺐어요"); } else { D.star.push(id); toast("복습함에 저장했어요"); }
  save(); render();
}

/* ---------- 문법 ---------- */
function gHead(title, idx, len, eyebrow){
  return `<div class="card-head"><div class="seal">${seal()}</div><div><div class="eyebrow">${eyebrow}</div><div class="card-title">${title}</div></div><div class="count">${idx+1} / ${len}</div></div>`;
}
function renderGrammar(){
  if(S.gm) return S.gm.step === "learn" ? gLearn() : gPractice();
  const G = GRAMMAR[S.lang]; const done = G.filter((g,i)=>D.gdone.includes(S.lang+"-g-"+i)).length;
  return `<div class="sec-title">기초 문법 ${G.length}가지 · ${done}개 완료</div>` +
    G.map((g,i)=>`<button class="row-item${D.gdone.includes(S.lang+"-g-"+i) ? " done" : ""}" onclick="openGrammar(${i})">
      <span class="no">${D.gdone.includes(S.lang+"-g-"+i) ? "✓" : i+1}</span>
      <span style="flex:1;min-width:0"><b>${g.t}</b><small>${g.f}</small></span><span style="color:var(--faint)">›</span></button>`).join("");
}
function openGrammar(i){ S.gm = {i, step:"learn"}; render(); window.scrollTo(0,0); }
function gLearn(){
  const G = GRAMMAR[S.lang], g = G[S.gm.i];
  return `<button class="back" onclick="S.gm=null;render()">‹ 문법 목록</button>
  <div class="card framed">${gHead(g.t, S.gm.i, G.length, "GRAMMAR")}
    <div class="tip" style="margin-top:0">${ICON_BULB}<p>${g.d}</p></div>
    <div class="form-box">${g.f}</div>
    <div class="sec-title" style="margin:16px 0 4px">예문</div>
    ${g.ex.map((e,k)=>`<div class="ex"><div style="flex:1;min-width:0"><div class="ex-w">${e[0]}</div><div class="ex-r">[${e[1]}] ${e[2]}</div></div>
      <button class="mini" onclick="speak(GRAMMAR[S.lang][${S.gm.i}].ex[${k}][0]);markStudy()" aria-label="듣기">🔊</button></div>`).join("")}
  </div>
  <button class="btn main" style="width:100%" onclick="startGPractice()">✏️ 연습 문제 3개 풀기</button>`;
}
function startGPractice(){
  const g = GRAMMAR[S.lang][S.gm.i];
  S.gm = {i:S.gm.i, step:"practice", qi:0, picked:null, score:0, pool:shuffle(g.o.map((w,k)=>k)), ans:[], checked:null};
  render(); window.scrollTo(0,0);
}
function gPractice(){
  const G = GRAMMAR[S.lang], g = G[S.gm.i], st = S.gm;
  const head = `<button class="back" onclick="S.gm={i:${st.i},step:'learn'};render()">‹ 설명 다시 보기</button>`;
  if(st.qi >= 3){
    const next = st.i < G.length-1 ? `<button class="btn main" onclick="openGrammar(${st.i+1})">다음 문법 ›</button>` : `<button class="btn main" onclick="S.gm=null;render()">목록으로</button>`;
    return `<div class="card framed" style="text-align:center"><div style="font-size:46px">${st.score===3?"🏆":"💪"}</div>
      <div class="card-title" style="margin-top:8px">3문제 중 ${st.score}개 맞혔어요</div>
      <p style="color:var(--sub);font-size:14px;margin-top:8px">'${g.t}'을(를) 완료로 표시했어요.</p>
      <div class="row2" style="margin-top:18px"><button class="btn ghost" onclick="startGPractice()">다시 풀기</button>${next}</div></div>`;
  }
  let body = "";
  if(st.qi < 2){
    const q = g.q[st.qi];
    const filled = st.picked === null ? `<span class="blank">　　</span>` : `<span class="blank ${st.picked===q[2]?"ok":"no"}">${q[1][st.picked]}</span>`;
    body = `<p class="q-guide">빈칸에 알맞은 말을 골라 주세요</p>
      <div class="q-sent">${q[0].replace("___", filled)}</div>
      ${q[1].map((o,k)=>{ let c=""; if(st.picked!==null){ if(k===q[2]) c=" right"; else if(k===st.picked) c=" wrong"; }
        return `<button class="opt${c}" onclick="gPick(${k})" ${st.picked!==null?"disabled":""}>${o}</button>`; }).join("")}
      ${st.picked!==null ? `<button class="btn main" style="width:100%;margin-top:14px" onclick="gNext()">다음 문제 ›</button>` : ""}`;
  } else {
    const sep = isJa() ? "" : " ";
    body = `<p class="q-guide">조각을 순서대로 눌러 문장을 완성해 주세요</p>
      <div class="q-mean">${g.om}</div>
      <div class="ans-line">${st.ans.map((k,j)=>`<button class="tok" onclick="gUnpick(${j})" ${st.checked!==null?"disabled":""}>${g.o[k]}</button>`).join("") || '<span style="color:var(--faint);font-size:14px;align-self:center">여기에 문장이 만들어져요</span>'}</div>
      <div class="pool">${st.pool.map(k=>`<button class="tok${st.ans.includes(k)?" used":""}" onclick="gAdd(${k})" ${st.ans.includes(k)||st.checked!==null?"disabled":""}>${g.o[k]}</button>`).join("")}</div>
      ${st.checked===null ? `<button class="btn main" style="width:100%;margin-top:14px" onclick="gCheck()" ${st.ans.length<g.o.length?"disabled":""}>정답 확인</button>`
        : `<div class="tip" style="background:${st.checked?"var(--ok-soft)":"var(--accent-soft)"}">${st.checked?"⭕":"❌"}<p>${st.checked?"정답이에요!":"정답: "+g.o.join(sep)}</p></div>
           <div class="row2"><button class="btn ghost" onclick="speak(GRAMMAR[S.lang][${st.i}].o.join('${sep}'))">🔊 듣기</button><button class="btn main" onclick="gNext()">결과 보기 ›</button></div>`}`;
  }
  return head + `<div class="card framed">${gHead(g.t, st.qi, 3, "PRACTICE")}${body}${dots(3, st.qi)}</div>`;
}
function gPick(k){ const st = S.gm, q = GRAMMAR[S.lang][st.i].q[st.qi]; st.picked = k; if(k===q[2]) st.score++; speak(q[0].replace("___", q[1][q[2]])); markStudy(); render(); }
function gAdd(k){ S.gm.ans.push(k); render(); }
function gUnpick(j){ S.gm.ans.splice(j,1); render(); }
function gCheck(){
  const st = S.gm, g = GRAMMAR[S.lang][st.i];
  st.checked = st.ans.every((k,j)=>g.o[k]===g.o[j]); if(st.checked) st.score++;
  speak(g.o.join(isJa() ? "" : " ")); markStudy(); render();
}
function gNext(){
  const st = S.gm; st.qi++; st.picked = null;
  if(st.qi >= 3){ const id = S.lang+"-g-"+st.i; if(!D.gdone.includes(id)){ D.gdone.push(id); save(); } }
  render();
}

/* ---------- 회화 ---------- */
let playToken = 0;
function renderTalk(){
  if(S.tk) return tScene();
  const T = TALK[S.lang]; const done = T.filter((s,i)=>D.tdone.includes(S.lang+"-c-"+i)).length;
  return `<div class="sec-title">상황별 대화 ${T.length}장면 · ${done}개 완료</div><div class="grid">` +
    T.map((s,i)=>`<button class="topic" onclick="openScene(${i})"><div class="ic">${s.ic}</div><b>${s.t}</b>
      <small>${D.tdone.includes(S.lang+"-c-"+i) ? "✓ 역할 연습 완료" : s.l.length+"줄 대화"}</small></button>`).join("") + `</div>`;
}
function openScene(i){ playToken++; S.tk = {i, mode:"view", shown:[]}; render(); window.scrollTo(0,0); }
function tScene(){
  const T = TALK[S.lang], s = T[S.tk.i], role = S.tk.mode === "role";
  const mine = s.l.map((L,k)=>L[0]===1?k:-1).filter(k=>k>=0);
  const left = mine.filter(k=>!S.tk.shown.includes(k)).length;
  return `<button class="back" onclick="playToken++;speechSynthesis.cancel();S.tk=null;render()">‹ 장면 목록</button>
  <div class="card framed">${gHead(s.ic+" "+s.t, S.tk.i, T.length, "CONVERSATION")}
    <div class="chips" style="padding-bottom:8px">
      <button class="chip${!role?" on":""}" onclick="setTalkMode('view')">대화 보기</button>
      <button class="chip${role?" on":""}" onclick="setTalkMode('role')">'${s.roles[1]}' 역할 연습</button>
    </div>
    ${role ? `<p class="q-guide">점선 말풍선의 뜻을 보고 먼저 소리 내어 말해 본 뒤, 눌러서 정답을 확인하세요. ${left ? "남은 차례 "+left+"개" : "🎉 모두 확인했어요!"}</p>`
           : `<button class="btn soft" style="width:100%;margin-bottom:6px" onclick="playAll()">▶ 대화 전체 듣기</button>`}
    ${s.l.map((L,k)=>{
      const me = L[0]===1, hide = role && me && !S.tk.shown.includes(k);
      return `<div class="bub-row${me?" me":""}"><div style="max-width:84%"><div class="who">${s.roles[L[0]]}</div>
        ${hide ? `<button class="bub q" onclick="reveal(${k})"><div class="m">${L[3]}</div><div class="r">눌러서 확인 👆</div></button>`
               : `<button class="bub" id="bub-${k}" onclick="speakLine(${k})"><div class="w">${L[1]}</div><div class="r">[${L[2]}]</div><div class="m">${L[3]}</div></button>`}
      </div></div>`; }).join("")}
  </div>`;
}
function setTalkMode(m){ playToken++; speechSynthesis.cancel(); S.tk.mode = m; S.tk.shown = []; render(); }
function speakLine(k, cb){ const L = TALK[S.lang][S.tk.i].l[k]; speak(L[1], cb, L[0]===1 ? 1.2 : 0.95); markStudy(); }
function reveal(k){
  S.tk.shown.push(k); speakLine(k); render();
  const s = TALK[S.lang][S.tk.i]; const mine = s.l.filter(L=>L[0]===1).length;
  if(S.tk.shown.length >= mine){ const id = S.lang+"-c-"+S.tk.i; if(!D.tdone.includes(id)){ D.tdone.push(id); save(); toast("이 장면 역할 연습을 완료했어요"); } }
}
function playAll(){
  const my = ++playToken; const n = TALK[S.lang][S.tk.i].l.length; let k = 0;
  const step = ()=>{
    if(my !== playToken || !S.tk) return;
    document.querySelectorAll(".bub.playing").forEach(b=>b.classList.remove("playing"));
    if(k >= n) return;
    const el = document.getElementById("bub-"+k); if(el){ el.classList.add("playing"); el.scrollIntoView({block:"nearest", behavior:"smooth"}); }
    const cur = k++; speakLine(cur, ()=>setTimeout(step, 350));
  };
  step();
}

/* ---------- 시작 ---------- */
(function init(){
  let look = null; try{ look = JSON.parse(localStorage.getItem("lang10_look")); }catch(e){}
  applyLook(look && look.d, look && look.f);
  try{ const l = localStorage.getItem("lang10_lang"); if(l === "en" || l === "ja") S.lang = l; }catch(e){}
  D = loadData();
  pickHero(S.lang); renderHero();
  render();
})();
</script>
</body>
