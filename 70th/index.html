<style>
:root{
  --bg:#F1EEE9; --card:#FBFAF7; --ink:#3E3A35; --sub:#7A746B; --mute:#A8A196; --line:#E4E0D8;
  --sage:#8E9A83; --sage-d:#6F7B66; --dark:#3E3A35;
  --en:'Cormorant Garamond',serif; --sans:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#E7E3DD;color:var(--ink);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.8;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
#inv{max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;overflow:hidden;box-shadow:0 0 50px rgba(60,50,40,.08)}

/* 표지 — 사진이 화면 가득 */
.cover{position:relative;height:100vh;height:100svh;min-height:560px;max-height:960px;background:linear-gradient(160deg,#A9B39E,#7F8B75);overflow:hidden}
.cover .ph{position:absolute;inset:0}
.cover .ph img{width:100%;height:100%;object-fit:cover}
.cover .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04) 0%,rgba(0,0,0,0) 40%,rgba(30,24,18,.5) 66%,rgba(30,24,18,.78) 100%)}
.cover .tx{position:absolute;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));text-align:center;color:#fff;padding:0 24px}
.cover .sc{font-family:var(--en);font-style:italic;font-weight:300;font-size:46px;line-height:1.06;text-shadow:0 1px 12px rgba(0,0,0,.15)}
.cover .who{font-size:12.5px;letter-spacing:.3em;margin-top:16px;font-weight:400;padding-left:.3em}
.cover .ln{width:1px;height:28px;background:rgba(255,255,255,.7);margin:16px auto}
.cover .d{font-size:14px;letter-spacing:.06em;font-weight:400;line-height:1.75}
.cover .d b{font-weight:500}
.cover .open{position:absolute;inset:0}
.cover .hint{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));width:1px;height:22px;background:rgba(255,255,255,.55);overflow:hidden}
.cover .hint::after{content:"";position:absolute;left:0;top:-22px;width:1px;height:22px;background:#fff;animation:drip 2.2s ease-in-out infinite}
@keyframes drip{to{top:22px}}

/* 공통 카드 */
.sec{padding:0 16px 16px;text-align:center}
.sec.first{padding-top:56px}
.card{background:var(--card);border-radius:4px;padding:44px 24px}
.en{font-family:var(--en);font-style:italic;font-size:27px;color:var(--sage);line-height:1}
h3{font-size:12px;font-weight:400;letter-spacing:.26em;color:#9A948B;margin:12px 0 30px;padding-left:.26em}
.fade{opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1s ease}
.fade.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;transition:none}.cover .hint::after{animation:none}}
.tlink{display:inline-flex;align-items:center;gap:6px;margin-top:24px;font-size:12.5px;color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:3px;letter-spacing:.04em}
.tlink svg{width:14px;height:14px}

/* 모시는 글 */
.msg{font-size:14.5px;line-height:2.15}
.sig{margin-top:30px;font-size:13px;color:var(--sub)}
.sig b{font-weight:500;color:var(--ink)}

/* 날짜 */
.dl{font-size:20px;font-weight:400}
.dl2{font-size:13px;color:var(--sub);margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);margin:28px auto 0;max-width:300px;font-size:13.5px;row-gap:6px;font-weight:400}
.cal span{height:34px;display:flex;align-items:center;justify-content:center}
.cal .h{font-size:11px;color:var(--mute);height:24px}
.cal .su{color:#B86B5E}
.cal .on{background:var(--sage);color:#fff;border-radius:50%;width:34px;margin:0 auto}
.cnt{display:flex;justify-content:center;gap:8px;margin-top:28px}
.cnt div{width:60px;padding:10px 0 8px;background:var(--bg);border-radius:4px}
.cnt b{display:block;font-family:var(--en);font-size:25px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.cnt small{font-size:10px;color:#9A948B;letter-spacing:.14em}
.dd{margin-top:16px;font-size:13px;color:var(--sub)}
.dd b{color:var(--sage-d);font-weight:500}

/* 사진첩 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid button{aspect-ratio:1;overflow:hidden;border-radius:2px;background:#E4E0D8;position:relative}
.grid button:first-child{grid-column:span 2;grid-row:span 2}
.grid img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.grid button:active img{transform:scale(1.03)}
.grid .more{position:absolute;inset:0;background:rgba(40,34,28,.55);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.gnote{margin-top:16px;font-size:12.5px;color:var(--sub);letter-spacing:.04em}
.empty{aspect-ratio:4/5;background:var(--card);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;letter-spacing:.06em}

/* 오시는 길 */
.pl{font-size:17px;font-weight:500}
.ad{font-size:13px;color:var(--sub);margin-top:6px}
.tel{display:inline-block;margin-top:4px;font-size:13px;color:var(--sage-d);border-bottom:1px solid var(--line)}
.map{margin:24px -8px 0;height:200px;border-radius:4px;overflow:hidden;background:#E4E1D9;position:relative}
.map iframe{width:100%;height:100%;border:0;display:block;filter:saturate(.75)}
.map.img{height:auto}
.map.img button{display:block;width:100%}
.map .no{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.lk{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px -8px 0}
.lk a,.lk button{font-size:12.5px;padding:12px 0;background:var(--bg);border-radius:4px;font-weight:400;text-align:center}
.ways{margin-top:26px;text-align:left;border-top:1px solid var(--line)}
.ways div{padding:14px 2px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.ways b{display:block;font-weight:500;font-size:12px;letter-spacing:.1em;color:var(--sage-d);margin-bottom:2px}

/* 연락하기 · 마음 전하실 곳 */
.rows{text-align:left;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;padding:13px 2px;border-bottom:1px solid var(--line)}
.row .nm{flex:1;min-width:0;font-size:14px;font-weight:400}
.row .nm small{display:block;color:var(--sub);font-size:12.5px;font-weight:300}
.ic{width:38px;height:38px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--ink)}
.ic svg{width:16px;height:16px}
.ic.cp{width:auto;border-radius:4px;padding:0 14px;font-size:12px;font-weight:400}
details.acc summary{list-style:none;cursor:pointer;padding:13px;background:var(--bg);border-radius:4px;font-size:13.5px;font-weight:400;display:flex;align-items:center;justify-content:center;gap:6px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary svg{width:14px;height:14px;transition:transform .3s}
details.acc[open] summary svg{transform:rotate(180deg)}
details.acc[open] summary{margin-bottom:6px}

/* 끝 */
.end{padding:20px 16px 0;text-align:center}
.end .bt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;background:var(--dark);color:#F1EEE9;font-size:14px;border-radius:4px;letter-spacing:.06em;font-weight:400}
.end .bt svg{width:16px;height:16px}
.end .bt2{margin-top:8px;background:transparent;color:var(--ink);border:1px solid #D9D4CB}
.end p{font-size:12.5px;color:#9A948B;margin-top:26px;line-height:1.9}
.foot{padding:34px 20px calc(40px + env(safe-area-inset-bottom));text-align:center;font-size:11.5px;color:var(--mute);letter-spacing:.04em}
.foot summary{cursor:pointer;list-style:none;margin-top:6px}
.foot summary::-webkit-details-marker{display:none}
.foot .pol{text-align:left;margin-top:10px;padding:14px;background:var(--card);border-radius:4px;line-height:1.75;color:var(--sub);letter-spacing:0}
.foot .lock{display:inline-block;margin-top:14px;opacity:.5}
.foot .lock svg{width:13px;height:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(50,44,38,.94);color:#fff;padding:11px 18px;border-radius:4px;font-size:13.5px;opacity:0;transition:.3s;z-index:80;pointer-events:none;max-width:calc(100% - 32px);text-align:center;font-weight:400}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 크게 보기 */
#lb{position:fixed;inset:0;z-index:50;background:#141210;display:flex;flex-direction:column}
#lb[hidden]{display:none}
.lb-bar{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 8px 8px 22px;color:#ddd;font-family:var(--en);font-size:16px;letter-spacing:.14em}
.lb-x{width:46px;height:46px;color:#fff;display:flex;align-items:center;justify-content:center}
.lb-x svg{width:22px;height:22px}
.lb-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.lb-track::-webkit-scrollbar{display:none}
.lb-track figure{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:6px 6px 78px}
.lb-track img{max-width:100%;max-height:100%;object-fit:contain}
.lb-arrows{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px}
.lb-arrows button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center}
.lb-arrows svg{width:18px;height:18px}

/* 🔐 관리자 화면 */
#adm{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;font-weight:400}
#adm[hidden]{display:none}
.aw{max-width:480px;margin:0 auto;padding:18px 16px 120px}
.ahead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ahead h1{font-size:19px;font-weight:500;flex:1}
.acard{background:var(--card);border-radius:6px;padding:18px 16px;margin-bottom:12px}
.acard h2{font-size:15px;margin-bottom:12px;font-weight:500}
.acard h2 small{font-weight:300;color:var(--sub);font-size:12.5px;margin-left:4px}
.fld{display:block;margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.fld span{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px;line-height:1.55;font-weight:300}
.fld input,.fld textarea{width:100%;font:inherit;font-size:16px;font-weight:400;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fff;-webkit-appearance:none;appearance:none}
.fld input[type=date],.fld input[type=time]{min-height:46px}
.fld textarea{min-height:96px;resize:vertical;line-height:1.6}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--sage);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.abtn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:400}
.abtn.main{background:var(--dark);border-color:var(--dark);color:#fff}
.abtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.up{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:90px;border:1.5px dashed var(--sage);border-radius:8px;background:#F6F7F2;color:var(--sage-d);text-align:center;cursor:pointer;padding:12px;font-size:14.5px}
.up small{color:var(--sub);font-size:12px;font-weight:300}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.pi{position:relative;border-radius:6px;overflow:hidden;background:var(--bg);aspect-ratio:1}
.pi img{width:100%;height:100%;object-fit:cover}
.pi .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px}
.pi .cv{position:absolute;right:6px;top:6px;background:var(--sage-d);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px}
.pi .tl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:14px 2px 2px}
.pi .tl button{width:32px;height:30px;color:#fff;font-size:14px;border-radius:6px}
.pi .tl button:active{background:rgba(255,255,255,.2)}
.amsg{font-size:13.5px;color:var(--sub);margin-top:10px;white-space:pre-line;text-align:left}
.amsg:empty{display:none}
.amsg.err{color:#B3261E}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--sage);transition:width .3s}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:41;background:rgba(251,250,247,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.savebar .abtn{flex:1;max-width:220px}
.savebar[hidden]{display:none}
.dirty{color:#B86B5E;font-size:12.5px;text-align:center;margin:-4px 0 10px}
.login{text-align:center;padding:48px 20px}
.login h1{font-size:20px;font-weight:500;margin-bottom:10px}
.login p{color:var(--sub);margin-bottom:22px;font-weight:300}
.mob{display:none}.pc{display:inline}
@media (hover:none),(max-width:600px){.mob{display:inline}.pc{display:none}}

/* ✂ 사진 자르기 (진불동과 같은 방식) */
#crop{position:fixed;inset:0;z-index:70;background:rgba(20,18,16,.96);display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px 10px calc(12px + env(safe-area-inset-bottom));color:#fff;font-weight:400}
#crop.on{display:flex}
#crop .cw{position:relative;line-height:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;padding:18px}
#crop .cw img{max-width:calc(100vw - 56px);max-height:calc(100vh - 250px);max-height:calc(100svh - 250px);display:block;pointer-events:none}
#crop .box{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55);outline:2px solid #fff;cursor:move;touch-action:none}
#crop .box::before,#crop .box::after{content:"";position:absolute;inset:33.33% 0;border-top:1px solid #fff8;border-bottom:1px solid #fff8;pointer-events:none}
#crop .box::after{inset:0 33.33%;border:0;border-left:1px solid #fff8;border-right:1px solid #fff8}
#crop .h{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;touch-action:none;z-index:2}
#crop .h::after{content:"";position:absolute;left:10px;top:10px;width:16px;height:16px;background:#fff;border-radius:4px;box-shadow:0 1px 4px #0008}
#crop .h.n::after,#crop .h.s::after{width:26px;height:8px;left:5px;top:14px}#crop .h.e::after,#crop .h.w::after{width:8px;height:26px;left:14px;top:5px}
#crop .cbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
#crop .cbar button,#crop .cbar label{font-size:13px;border:1px solid #fff5;color:#fff;border-radius:99px;padding:8px 13px;cursor:pointer;background:transparent}
#crop .cbar button.on{background:#fff;color:var(--ink)}
#crop .cbar .go{background:var(--sage);border-color:var(--sage);font-weight:500}
#crop .cbar button:disabled{opacity:.5}
#crop .cbar input{position:absolute;width:1px;height:1px;opacity:0}
#crop .ct{font-size:13.5px;margin-bottom:8px;text-align:center;line-height:1.6;opacity:.92;white-space:pre-line;max-width:420px}
#crop[data-st="load"] .cw,#crop[data-st="load"] .cbar.r,#crop[data-st="load"] .go,#crop[data-st="pick"] .cw,#crop[data-st="pick"] .cbar.r,#crop[data-st="pick"] .go{display:none}
#crop:not([data-st="pick"]) .repick{display:none}
</style>
</head>
<body>
<main id="inv"></main>

<div id="lb" hidden role="dialog" aria-label="사진 크게 보기">
  <div class="lb-bar"><span class="lb-n"></span><button class="lb-x" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
  <div class="lb-track"></div>
  <div class="lb-arrows"><button class="lb-l" aria-label="앞 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><button class="lb-r" aria-label="다음 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
</div>
<div id="adm" hidden><div class="aw"></div></div>
<div class="savebar" id="saveBar" hidden><button class="abtn" data-a="preview">초대장 미리 보기</button><button class="abtn main" data-a="save">저장하기</button></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   ✏️ 처음 내용 — 관리자 화면에서 저장하면 그 내용으로 바뀌어요
   ============================================================ */
const DEF = {
  script: 'Seventy years\nof love',
  title: '칠순 잔치에 초대합니다',
  whoSub: '아버지',
  who: '○○○',
  kind: '칠순',
  hosts: '자녀 일동 올림',
  date: '2027-01-16',
  time: '12:00',
  place: '○○ 한정식',
  hall: '2층 연회장',

let fadeObs = null;
function setupFade(){
  if (fadeObs) fadeObs.disconnect();
  const els = document.querySelectorAll('#inv .fade');
  if (!('IntersectionObserver' in window)) return els.forEach(e => e.classList.add('in'));
  fadeObs = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); fadeObs.unobserve(x.target); } }), { rootMargin: '0px 0px -6% 0px' });
  els.forEach(e => fadeObs.observe(e));
}

}

  b.querySelectorAll('.h').forEach(h => { const [l, t] = P[h.dataset.h]; h.style.left = l + '%'; h.style.top = t + '%'; });
}
async function cropLoad(src, remote){
  const el = cropEl(), img = el.querySelector('img');
  if (CR.url) URL.revokeObjectURL(CR.url); CR.url = remote ? '' : src;
  if (remote) img.crossOrigin = 'anonymous'; else img.removeAttribute('crossorigin');
  img.src = src;
  await img.decode();
  CR.img = img; CR.r = { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight };
  CR.ratio = 0; el.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', x.dataset.r === '0'));
  cropSt('edit', CROP_HINT);
  requestAnimationFrame(drawBox);
}
async function openCrop(p){
  CR.p = p; CR.img = null;
  const el = cropEl(); el.classList.add('on'); cropSt('load', '사진을 불러오는 중…');
  try { await cropLoad(fullURL(p) + '&cb=' + Date.now(), true); }   // 잘라서 다시 그리려면 CORS 로 받아야 해요
  catch { cropSt('pick', '저장된 사진을 이 화면으로 불러오지 못했어요.\n아래 [같은 사진 다시 고르기]로 휴대폰 · 컴퓨터에 있는 같은 사진을 고르면 바로 자를 수 있어요.'); }
}
function closeCrop(){ const el = $('#crop'); if (el) el.classList.remove('on'); CR.p = null; if (CR.url) { URL.revokeObjectURL(CR.url); CR.url = ''; } }
async function saveCrop(btn){
  if (CR.busy || !CR.img) return;
  const p = CR.p, r = CR.r, img = CR.img;
  if (!CR.url && r.w >= img.naturalWidth - 2 && r.h >= img.naturalHeight - 2) return closeCrop();   // 자른 곳이 없으면 그냥 닫아요
  CR.busy = true; btn.disabled = true; btn.textContent = '올리는 중…';
  try {
    readForm();
    const c = document.createElement('canvas'); c.width = Math.round(r.w); c.height = Math.round(r.h);
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
    const full = await toJpeg(c, 1800, .88), thumb = await toJpeg(c, 600, .8);
    const old = p.id, id = old.replace(/c[0-9a-z]{4}$/, '') + 'c' + Math.random().toString(36).slice(2, 6);
    const meta = { contentType: 'image/jpeg', cacheControl: 'public, max-age=31536000' }, st = firebase.storage().ref();
    await st.child(`70th/photos/${id}.jpg`).put(full, meta);
    await st.child(`70th/photos/${id}_t.jpg`).put(thumb, meta);
    p.id = id; if (D.cover === old) D.cover = id;
    await saveData(true);
    st.child(`70th/photos/${old}.jpg`).delete().catch(() => {}); st.child(`70th/photos/${old}_t.jpg`).delete().catch(() => {});
    closeCrop(); renderAdmin(); setMsg('✂ 잘라서 바꿨어요. 초대장에도 잘린 사진이 나와요.');
  } catch (e) { cropSt('edit', '자르지 못했어요: ' + errText(e)); }
  CR.busy = false; btn.disabled = false; btn.textContent = '✂ 자른 사진으로 바꾸기';
}
addEventListener('keydown', e => { if (e.key === 'Escape' && CR.p) closeCrop(); });

$('#adm').addEventListener('change', e => {
  const up = e.target.closest('[data-up]'); if (up) { if (up.files.length) upload(up.files, up.dataset.up); up.value = ''; }
});
$('#adm').addEventListener('input', e => {
  if (!e.target.matches('[data-k]') || dirty) return;
  dirty = true; const h = $('.ahead'); if (h && !$('.dirty')) h.insertAdjacentHTML('afterend', '<div class="dirty">● 아직 저장하지 않은 내용이 있어요</div>');
});
document.addEventListener('click', async e => {
  const lock = e.target.closest('.foot .lock');
  if (lock) { e.preventDefault(); history.replaceState(null, '', '/70th/?admin'); return openAdm(); }
  const t = e.target.closest('#adm [data-a], #adm [data-p], #saveBar [data-a]'); if (!t) return;

    if (busy) return; busy = true; t.disabled = true;
    try { await saveData(); } catch (err) { toast('저장하지 못했어요'); setMsg('저장하지 못했어요: ' + errText(err), true); }
    busy = false; t.disabled = false;
  }
});
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

const DATA_READY = loadData();
if (ADMIN_MODE) openAdm();
