<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="description" content="늘 한결같은 사랑으로 저희를 키워 주신 부모님의 칠순, 귀한 걸음으로 함께해 주세요.">
<meta property="og:title" content="칠순 잔치에 초대합니다">
<meta property="og:description" content="귀한 걸음으로 함께해 주세요 — 날짜 · 오시는 길 · 가족 사진첩">

<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<link rel="apple-touch-icon" href="/70th/icon-512.png">

<!--
  🎉 가족 초대장 (jsun.site/70th) — 2026-11-28
  - 휴대폰 세로 화면용 모바일 초대장 (돌잔치 · 결혼식 모바일 청첩장처럼)
  - 글 · 사진은 관리자 화면(jsun.site/70th/admin)에서 고쳐요
    → Firebase moon-15f88 Storage: 70th/invite.js(글) · 70th/photos/(사진), 규칙은 70th/storage.rules
  - 보는 분은 로그인 없이 봐요 (카카오톡 안에서 열어도 돼요)
-->
<style>
:root{
  --bg:#F3EEE6; --paper:#FFFDF9; --ink:#3B302A; --sub:#8C7D71; --line:#EADFD2; --soft:#F7F0E7;
  --accent:#B0533E; --accent2:#C9826B; --gold:#B8923A; --sun:#C2453A;
  --serif:'Gowun Batang','Noto Serif KR',serif; --sans:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
#inv{max-width:440px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 40px rgba(80,50,30,.08);overflow:hidden}

/* 공통 */
.sec{padding:64px 28px;text-align:center;position:relative}
.sec+.sec{border-top:1px solid var(--line)}
.eyebrow{font-family:var(--serif);font-size:12px;letter-spacing:.32em;color:var(--accent2);margin-bottom:8px}
h2{font-family:var(--serif);font-size:23px;font-weight:700;margin-bottom:26px;letter-spacing:-.01em}
.orn{display:block;width:54px;height:20px;margin:0 auto 18px;color:var(--accent2)}
.fade{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s ease}
.fade.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;transition:none}.petal{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;color:var(--ink);text-decoration:none;transition:background .2s}
.btn:active{background:var(--soft)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}

/* 표지 */
.cover{min-height:100vh;min-height:100svh;padding:46px 26px 54px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%,#FFF6EA 0%,var(--paper) 62%)}
.c-top{font-family:var(--serif);font-size:11px;letter-spacing:.42em;color:var(--sub);padding-left:.42em}
.c-mark{font-family:'Noto Serif KR',serif;font-weight:700;font-size:20px;letter-spacing:.3em;color:var(--sun);margin:8px 0 22px;padding-left:.3em}
.c-photo{width:78%;max-width:300px;aspect-ratio:3/4;border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--soft);box-shadow:0 18px 40px -18px rgba(90,50,30,.45);border:6px solid #fff;outline:1px solid var(--line)}
.c-photo button{display:block;width:100%;height:100%}
.c-photo img{width:100%;height:100%;object-fit:cover}
.c-photo .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--accent2)}
.c-photo .ph svg{width:46%;opacity:.75}
.c-title{font-family:var(--serif);font-size:26px;font-weight:700;margin-top:30px;letter-spacing:-.01em;line-height:1.45}
.c-who{margin-top:12px;font-size:16px;color:var(--sub)}
.c-who b{font-family:var(--serif);font-size:20px;color:var(--ink);margin-left:6px}
.c-line{width:28px;height:1px;background:var(--accent2);margin:20px auto}
.c-when{font-family:var(--serif);font-size:17px}
.c-where{font-size:15px;color:var(--sub);margin-top:2px}
.c-down{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--sub);letter-spacing:.2em;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,5px)}}
.petal{position:absolute;top:-20px;width:12px;height:10px;border-radius:12px 0 12px 0;background:#F2C4B5;opacity:.7;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg)}}

/* 모시는 글 */
.greet{font-family:var(--serif);font-size:16.5px;line-height:2.05}
.hosts{margin-top:30px;font-size:15px;color:var(--sub)}
.hosts b{font-family:var(--serif);color:var(--ink);font-size:16px}

/* 날짜 */
.big-date{font-family:var(--serif);font-size:21px;font-weight:700}
.big-time{color:var(--sub);margin-top:2px}
.cal{margin:26px auto 0;max-width:320px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 4px}
.cal-m{font-family:var(--serif);font-size:15px;margin-bottom:10px;color:var(--accent)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;font-size:14px}
.cal-g span{height:36px;display:flex;align-items:center;justify-content:center}
.cal-g .h{font-size:12px;color:var(--sub);height:24px}
.cal-g .su{color:var(--sun)}
.cal-g .sa{color:#4A6FA5}
.cal-g .on{background:var(--accent);color:#fff;border-radius:50%;width:36px;margin:0 auto;font-weight:700;box-shadow:0 4px 12px -4px rgba(176,83,62,.6)}
.dday{margin-top:22px;font-size:15px}
.dday b{color:var(--accent);font-family:var(--serif);font-size:18px}

/* 사진첩 */
.gal-sec{padding-left:0;padding-right:0}
.gal-wrap{position:relative}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.gal::-webkit-scrollbar{display:none}
.gs{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:0 22px}
.gs button{display:block;width:100%;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--soft)}
.gs img{width:100%;height:100%;object-fit:cover}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:opacity .2s}
.gnav.l{left:30px}.gnav.r{right:30px}
.gnav[disabled]{opacity:0;pointer-events:none}
.gcount{margin-top:14px;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.gcount b{color:var(--ink)}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:12px 22px 4px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 52px;height:52px;border-radius:8px;overflow:hidden;opacity:.5;outline:2px solid transparent;outline-offset:-2px;transition:opacity .2s}
.thumbs button.on{opacity:1;outline-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.hint{font-size:13px;color:var(--sub);margin-top:10px}
.empty-gal{margin:0 22px;aspect-ratio:4/5;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub);font-size:14px}
.empty-gal svg{width:64px;color:var(--accent2);opacity:.7}

/* 오시는 길 */
.place{font-family:var(--serif);font-size:20px;font-weight:700}
.hall{color:var(--sub);margin-top:2px}
.addr{margin-top:10px;font-size:15px}
.tel{display:inline-block;margin-top:4px;font-size:15px;color:var(--accent);text-decoration:none}
.map{margin:22px -28px 0;height:260px;background:var(--soft);position:relative}
.map iframe{width:100%;height:100%;border:0;display:block}
.map.img{height:auto}
.map.img button{display:block;width:100%}
.map .noaddr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.maps .btn{padding:0 6px;font-size:13.5px}
.ways{margin-top:28px;text-align:left;border-top:1px solid var(--line)}
.ways div{padding:14px 2px;border-bottom:1px solid var(--line);font-size:15px}
.ways b{display:block;font-family:var(--serif);color:var(--accent);font-size:14.5px;margin-bottom:2px}

/* 연락하기 · 마음 전하실 곳 */
.rows{text-align:left;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px solid var(--line)}
.row .nm{flex:1;min-width:0;font-size:15px}
.row .nm small{display:block;color:var(--sub);font-size:13px}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;text-decoration:none;background:#fff;flex:0 0 auto}
.ic.cp{width:auto;border-radius:999px;padding:0 14px;font-size:13px}
details.acc{margin-top:8px;text-align:left}
details.acc summary{list-style:none;cursor:pointer;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:15px}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary{margin-bottom:10px}

/* 끝 */
.end{padding:70px 28px 40px;text-align:center;background:linear-gradient(var(--paper),#FBF3EA)}
.end h3{font-family:var(--serif);font-size:20px;line-height:1.7}
.end p{color:var(--sub);margin-top:10px;font-size:15px}
.foot{padding:26px 20px 40px;text-align:center;font-size:12px;color:#A99A8C;background:#FBF3EA}
.foot details{margin-top:8px}
.foot summary{cursor:pointer;list-style:none}
.foot summary::-webkit-details-marker{display:none}
.foot .pol{text-align:left;margin-top:10px;padding:14px;background:#fff;border-radius:12px;line-height:1.7;color:var(--sub)}
.foot .lock{display:inline-block;margin-top:12px;text-decoration:none;opacity:.45;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(40,30,25,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 크게 보기 */
#lb{position:fixed;inset:0;z-index:50;background:#0E0B0A;display:flex;flex-direction:column}
#lb[hidden]{display:none}
.lb-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.lb-track::-webkit-scrollbar{display:none}
.lb-track figure{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:8px 8px 80px}
.lb-track img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.lb-bar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px 20px;color:#EEE;font-size:14px}
.lb-x{width:44px;height:44px;font-size:28px;color:#fff;line-height:1}
.lb-n{font-variant-numeric:tabular-nums}
.lb-arrows{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:16px}
.lb-arrows button{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:22px}

/* 🔐 관리자 화면 */
#adm{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#adm[hidden]{display:none}
.aw{max-width:480px;margin:0 auto;padding:18px 16px 120px}
.ahead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ahead h1{font-family:var(--serif);font-size:20px;flex:1}
.card{background:#fff;border-radius:16px;padding:18px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(60,40,20,.06)}
.card h2{font-size:16px;margin-bottom:12px;text-align:left;font-family:var(--sans);font-weight:700}
.card h2 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:4px}
.fld{display:block;margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.fld span{display:block;font-size:13.5px;color:var(--sub);margin-bottom:4px;line-height:1.5}
.fld input,.fld textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FFFEFC;-webkit-appearance:none;appearance:none}
.fld input[type=date],.fld input[type=time]{min-height:46px}
.fld textarea{min-height:96px;resize:vertical;line-height:1.6}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--accent2);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:92px;border:2px dashed var(--accent2);border-radius:14px;background:#FFF8F2;color:var(--accent);text-align:center;cursor:pointer;padding:12px;font-size:15px}
.up small{color:var(--sub);font-size:12.5px}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pi{position:relative;border-radius:10px;overflow:hidden;background:var(--soft);aspect-ratio:1}
.pi img{width:100%;height:100%;object-fit:cover}
.pi .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px}
.pi .cv{position:absolute;right:6px;top:6px;background:var(--accent);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px}
.pi .tl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:14px 2px 2px}
.pi .tl button{width:30px;height:30px;color:#fff;font-size:14px;border-radius:8px}
.pi .tl button:active{background:rgba(255,255,255,.2)}
.amsg{font-size:14px;color:var(--sub);margin-top:10px;white-space:pre-line;text-align:left}
.amsg:empty{display:none}
.amsg.err{color:#B3261E}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:41;background:rgba(255,253,249,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.savebar .btn{flex:1;max-width:220px}
.savebar[hidden]{display:none}
.dirty{color:var(--accent);font-size:13px;text-align:center;margin:-4px 0 10px}
.login{text-align:center;padding:40px 20px}
.login h1{font-family:var(--serif);font-size:22px;margin-bottom:10px}
.login p{color:var(--sub);margin-bottom:20px}
.mob{display:none}.pc{display:inline}
@media (hover:none),(max-width:600px){.mob{display:inline}.pc{display:none}}
</style>
</head>
<body>
<main id="inv"></main>

<div id="lb" hidden role="dialog" aria-label="사진 크게 보기">
  <div class="lb-bar"><span class="lb-n"></span><button class="lb-x" aria-label="닫기">×</button></div>
  <div class="lb-track"></div>
  <div class="lb-arrows"><button class="lb-l" aria-label="앞 사진">‹</button><button class="lb-r" aria-label="다음 사진">›</button></div>
</div>
<div id="adm" hidden><div class="aw"></div></div>
<div class="savebar" id="saveBar" hidden><button class="btn" data-a="preview">👀 초대장 미리 보기</button><button class="btn main" data-a="save">💾 저장하기</button></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   ✏️ 처음 내용 — 관리자 화면에서 저장하면 그 내용으로 바뀌어요
   ============================================================ */
const DEF = {
  mark: '七旬',
  title: '칠순 잔치에 초대합니다',
  whoSub: '아버지',
  who: '○ ○ ○',
  hosts: '자녀 일동 올림',
  date: '2027-01-16',
  time: '12:00',
  place: '○○ 한정식',
  hall: '2층 연회장',
  addr: '',
  tel: '',
  greet: '어느덧 일흔 해,\n늘 한결같은 사랑으로\n저희를 키워 주신 부모님께서\n칠순을 맞으셨습니다.\n\n그동안의 고마움을 담아\n가족이 한자리에 모여\n따뜻한 식사를 나누려 합니다.\n\n귀한 걸음 하시어\n자리를 빛내 주시면 감사하겠습니다.',
  traffic: '',
  contacts: '',
  accounts: '',
  cover: '',
  photos: []
};
/* 관리자 화면에 나오는 칸 — [이름, 설명, 모양] */
const FIELDS = [
  ['💌 첫 화면', [
    ['mark', '표지 위 한자 (예: 七旬 · 古稀 · 壽宴, 비우면 안 보여요)'],
    ['title', '초대 제목'],
    ['whoSub', '주인공 앞에 붙는 말 (예: 아버지 · 어머니 · 부모님)'],
    ['who', '주인공 이름'],
    ['hosts', '보내는 사람 (예: 아들 ○○ · 딸 ○○ 올림)']]],
  ['📅 언제', [['date', '날짜', 'date'], ['time', '시각', 'time']]],
  ['✉️ 모시는 글', [['greet', '줄을 바꾸면 초대장에서도 줄이 바뀌어요', 'area']]],
  ['📍 어디서', [
    ['place', '장소 이름 (예: ○○ 한정식)'],
    ['hall', '층 · 방 (예: 2층 연회장)'],
    ['addr', '주소 — 지도가 이 주소로 나와요 (예: 서울 강남구 테헤란로 123)'],
    ['tel', '장소 전화번호'],

let galGo = () => {}, galNow = () => 0;
function setupGallery(){
  const g = $('#gal'); if (!g) return;
  const th = $('#thumbs'), n = album().length;
  let cur = -1;
  galNow = () => Math.round(g.scrollLeft / Math.max(1, g.clientWidth));
  galGo = i => g.scrollTo({ left: Math.max(0, Math.min(n - 1, i)) * g.clientWidth, behavior: 'smooth' });
  const upd = () => {
    const i = galNow(); if (i === cur) return; cur = i;
    $('#gNow').textContent = i + 1;
    const l = $('.gnav.l'), r = $('.gnav.r'); if (l) l.disabled = i <= 0; if (r) r.disabled = i >= n - 1;
    if (th) { [...th.children].forEach((b, k) => b.classList.toggle('on', k === i)); const b = th.children[i]; if (b) th.scrollTo({ left: b.offsetLeft - th.clientWidth / 2 + b.offsetWidth / 2, behavior: 'smooth' }); }
  };
  let f = 0;
  g.addEventListener('scroll', () => { cancelAnimationFrame(f); f = requestAnimationFrame(upd); }, { passive: true });
  upd();
}
let fadeObs = null;
function setupFade(){
  if (fadeObs) fadeObs.disconnect();
  const els = document.querySelectorAll('#inv .fade');
  if (!('IntersectionObserver' in window)) return els.forEach(e => e.classList.add('in'));
  fadeObs = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); fadeObs.unobserve(x.target); } }), { rootMargin: '0px 0px -6% 0px' });
  els.forEach(e => fadeObs.observe(e));
}

/* 사진 올리기 */
async function decodeImg(f){
  try { return await createImageBitmap(f); } catch {}
  try { const im = new Image(); im.src = URL.createObjectURL(f); await im.decode(); return im; } catch {}
  if (/hei[cf]/i.test(f.type) || /\.hei[cf]$/i.test(f.name)) {   // 크롬은 아이폰 HEIC 를 못 열어서 바꿔요 (사파리는 바로 열려요)
    try {
      if (!window.HeicTo) await loadScript('https://cdn.jsdelivr.net/npm/heic-to@1.6.7/dist/iife/heic-to.js');
      const j = await HeicTo({ blob: f, type: 'image/jpeg', quality: .92 });
      return await createImageBitmap(j);
    } catch (e) { console.warn('heic-to', e); }
    throw new Error('이 HEIC 사진을 열지 못했어요. 사파리에서 올리거나, 사진 앱에서 JPG 로 내보내 올려 주세요');
  }
  throw new Error('이 사진 형식은 열 수 없어요');
}
function toJpeg(src, max, q){
  const W = src.width || src.naturalWidth, H = src.height || src.naturalHeight, k = Math.min(1, max / Math.max(W, H));
  const c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(H * k);
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, c.width, c.height);
  return new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error('사진을 줄이지 못했어요')), 'image/jpeg', q));
}
async function upload(files, kind){
  if (busy) return; busy = true;
  readForm();
  const L = [...files]; let ok = 0; const bad = [];
  setBar(0);
  for (let i = 0; i < L.length; i++) {
    setMsg(`${i + 1} / ${L.length} 올리는 중이에요… 창을 닫지 말아 주세요`);
    try {
      const f = L[i], key = `${f.name}|${f.size}`;
      if (kind === 'album' && D.photos.some(p => p.src === key)) { bad.push(`${f.name}: 이미 올린 사진`); continue; }
      const img = await decodeImg(f);
      const full = await toJpeg(img, 1800, .86), thumb = await toJpeg(img, 600, .8);
      if (img.close) img.close();
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const meta = { contentType: 'image/jpeg', cacheControl: 'public, max-age=31536000' }, st = firebase.storage().ref();
      await st.child(`70th/photos/${id}.jpg`).put(full, meta);
      await st.child(`70th/photos/${id}_t.jpg`).put(thumb, meta);
      D.photos.push(kind === 'map' ? { id, map: true, src: key } : { id, src: key });
      ok++;
    } catch (e) { bad.push(`${L[i].name}: ${errText(e)}`); }
    setBar((i + 1) / L.length);
  }
  try { if (ok) await saveData(true); } catch (e) { bad.push('목록 저장: ' + errText(e)); }
  busy = false; setBar(null);
  renderAdmin();
  setMsg(`${ok ? `✅ ${ok}장을 올렸어요.` : ''}${bad.length ? `\n못 올린 것 ${bad.length}개:\n` + bad.join('\n') : ''}`.trim(), !!bad.length && !ok);
}
async function photoAct(act, id){
  if (busy) return;
  readForm();
  const p = D.photos.find(x => x.id === id); if (!p) return;
  try {
    if (act === 'del') {
      if (!confirm(p.map ? '약도 그림을 지울까요?' : '이 사진을 지울까요?')) return;
      busy = true; setMsg('지우는 중이에요…');
      D.photos = D.photos.filter(x => x !== p); if (D.cover === id) D.cover = '';
      await saveData(true);
      const st = firebase.storage().ref();
      await Promise.all([`${id}.jpg`, `${id}_t.jpg`].map(n => st.child(`70th/photos/${n}`).delete().catch(() => {})));
      setMsg('🗑 지웠어요.');
    } else if (act === 'cover') {
      D.cover = id; busy = true; await saveData(true); setMsg('★ 표지 사진으로 바꿨어요.');
    } else {
      const A = album(), i = A.indexOf(p), j = act === 'left' ? i - 1 : i + 1;
      if (j < 0 || j >= A.length) return;
      const a = D.photos.indexOf(p), b = D.photos.indexOf(A[j]);
      [D.photos[a], D.photos[b]] = [D.photos[b], D.photos[a]];
      busy = true; await saveData(true); setMsg(`순서를 바꿨어요 (${j + 1}번째).`);
    }
  } catch (e) { setMsg('바꾸지 못했어요: ' + errText(e), true); }
  busy = false; renderAdmin();
}
