<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>봉인된 아틀란티스와 크라켄 던전 정복기</title>
<meta name="theme-color" content="#0b2a55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#8ad8ff;--light:.35;--ink:#16304f;--sub:#5a6f8c;--card:rgba(255,255,255,.94);--accent:#ff8a3d;--ok:#1fae68;--bad:#e95454;--gw:84px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background-color:var(--bg);transition:background-color 2.4s ease;color:var(--ink);font-size:20px;overflow-x:hidden;-webkit-user-select:none;user-select:none}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,255,255,var(--light)),rgba(255,255,255,0) 55%);pointer-events:none;z-index:0}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubbles span{position:absolute;bottom:-30px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px)}}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(0,22,55,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff}
header h1{flex:1;margin:0;font-size:17px;font-weight:400;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.4);text-align:center}
.hbtn{background:rgba(255,255,255,.2);border-radius:12px;padding:7px 10px;font-size:14px;color:#fff;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.3)}
.sync{font-size:14px;opacity:.85;min-width:22px;text-align:center}

.wrap{position:relative;z-index:1;display:grid;grid-template-columns:var(--gw) 1fr;gap:10px;padding:10px 10px 30px;max-width:980px;margin:0 auto}
/* 수심 게이지 */
.gauge{position:sticky;top:64px;height:calc(100dvh - 84px);min-height:380px;display:flex;flex-direction:column;align-items:center;color:#fff}
.gnum{text-align:center;background:rgba(0,20,50,.45);border-radius:16px;padding:6px 4px;width:100%;margin-bottom:8px;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.gnum b{display:block;font-size:26px;font-weight:400;line-height:1.05}
.gnum small{font-size:13px;opacity:.85}
.gtrack{position:relative;flex:1;width:34px;margin:22px 0 14px;border-radius:18px;overflow:visible;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.gz{position:absolute;left:0;right:0;height:20%;}
.gz:first-child{border-radius:18px 18px 0 0}.gz:nth-child(5){border-radius:0 0 18px 18px}
.gmark{position:absolute;left:40px;font-size:11px;transform:translateY(-50%);white-space:nowrap;opacity:.9;text-shadow:0 1px 2px #000}
.gzl{display:none}
.gsub{position:absolute;left:50%;width:58px;transform:translate(-50%,-50%);transition:top 2.4s ease;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.gsub svg{display:block;width:100%;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@media(min-width:700px){:root{--gw:150px} .gnum b{font-size:38px} .gtrack{width:44px} .gmark{left:52px;font-size:13px} .gzl{display:block;position:absolute;left:52px;font-size:13px;opacity:.75;top:50%;transform:translateY(-50%)} .gmark{display:none} .gmark.always{display:block} body{font-size:22px}}

/* 메인 카드 */
.main{min-width:0}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 20px rgba(0,20,60,.25);margin-bottom:12px}
.zone{display:inline-block;background:#e6f3ff;color:#1d5a99;border-radius:999px;padding:4px 12px;font-size:15px}
.mlabel{color:var(--sub);font-size:17px;margin:10px 0 2px}
.mtitle{font-size:30px;margin:0 0 6px;line-height:1.2}
.mdesc{color:var(--sub);font-size:17px;margin:0 0 12px}
.big-btn{display:block;width:100%;padding:18px;border-radius:18px;font-size:26px;background:linear-gradient(180deg,#ffa25a,#ff7a2a);color:#fff;box-shadow:0 5px 0 #c85412;margin-top:10px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c85412}
.big-btn.boss{background:linear-gradient(180deg,#9b6cff,#6a3df0);box-shadow:0 5px 0 #4320b0}
.big-btn[disabled]{background:#b9c4d2;box-shadow:0 5px 0 #8b97a6;cursor:default}
.week{display:flex;gap:6px;margin:12px 0 4px}
.week div{flex:1;text-align:center;border-radius:12px;padding:6px 0;background:#eef3f9;color:#8193ab;font-size:16px}
.week .done{background:#d8f5e6;color:#14814b}.week .now{background:#ffe7d4;color:#c4561a;outline:3px solid #ffb27a}
.wait{display:flex;align-items:center;gap:12px;background:#f2f6fb;border-radius:16px;padding:10px;margin-top:6px}
.wait .pic{width:110px;flex:none}
.wait p{margin:0;font-size:17px;color:var(--sub)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{background:var(--card);border-radius:18px;padding:14px 6px;font-size:18px;box-shadow:0 4px 14px rgba(0,20,60,.2);line-height:1.3}
.menu button .ic{display:block;font-size:34px}
.menu button small{display:block;color:var(--sub);font-size:14px}
.foot{text-align:center;margin-top:14px}
.foot button{background:rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:8px 14px;font-size:14px}

/* 생물 그림 */
.pic{position:relative;aspect-ratio:200/140;width:100%}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;opacity:0;transition:opacity .4s}
.pic img.on{opacity:1}
.sil svg{filter:brightness(0) opacity(.5)}

/* 전체 화면 */
.screen{position:fixed;inset:0;z-index:50;overflow-y:auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(4,16,40,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.screen .inner{max-width:720px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px}
.qtop .x{background:rgba(255,255,255,.2);color:#fff;border-radius:12px;width:44px;height:44px;font-size:22px;flex:none}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.25)}
.dots i.o{background:#4be39a}.dots i.w{background:#ff7b7b}.dots i.c{background:#ffd166}
.qcount{font-size:18px;min-width:52px;text-align:right}
.qcard{position:relative;background:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.qtext{font-size:25px;line-height:1.45;margin-bottom:10px;word-break:keep-all}
.qtext .bignum{display:block;text-align:center;font-size:44px;color:#1d4f91;margin:6px 0;letter-spacing:1px}
.qsvg{text-align:center;margin:6px 0 10px}
.qsvg svg{max-width:100%;height:auto}
.disp{font-size:42px;text-align:center;border:3px solid #cfe0f3;border-radius:16px;padding:8px;min-height:72px;margin-bottom:10px;color:#1d4f91;background:#f6faff;letter-spacing:2px}
.disp.empty{color:#b6c4d6}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{font-size:30px;padding:14px 0;border-radius:16px;background:#eaf2fc;box-shadow:0 4px 0 #c4d4e8;color:var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #c4d4e8}
.pad .ok{grid-column:4;grid-row:2/span 3;background:linear-gradient(180deg,#46d18c,#1fae68);color:#fff;box-shadow:0 4px 0 #148250;font-size:26px}
.pad .del{background:#ffe6e6;box-shadow:0 4px 0 #f0bcbc}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{font-size:24px;padding:16px 8px;border-radius:16px;background:#eaf2fc;box-shadow:0 4px 0 #c4d4e8;line-height:1.3;word-break:keep-all}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choices.three button{font-size:44px;padding:10px 0}
.choices button:active{transform:translateY(3px);box-shadow:0 1px 0 #c4d4e8}
.fb{position:absolute;inset:0;border-radius:24px;background:rgba(255,255,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;animation:pop .25s ease}
.fb .mark{font-size:84px;line-height:1}
.fb h3{margin:8px 0;font-size:30px;font-weight:400}
.fb p{margin:6px 0;font-size:20px;color:var(--sub);word-break:keep-all;line-height:1.5}
.fb .ans{font-size:34px;color:var(--ok)}
.fb button{margin-top:14px;padding:14px 34px;border-radius:16px;font-size:24px;background:#1d6fd1;color:#fff;box-shadow:0 4px 0 #13509a}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.8em;margin:0 2px}
.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:2px solid currentColor}

.bossbar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:18px;padding:8px;margin-bottom:10px;color:#fff}
.bossbar .pic{width:120px;flex:none}
.bossbar .bn{font-size:20px}
.hp{font-size:22px;letter-spacing:1px}
.hit{animation:hit .45s}
@keyframes hit{25%{transform:translateX(-8px) rotate(-4deg);filter:brightness(2)}75%{transform:translateX(8px) rotate(4deg)}}
.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 모달 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(2,10,28,.7);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.sheet{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:760px;margin:auto 0;box-shadow:0 10px 40px rgba(0,0,0,.4);position:relative}
.sheet h2{margin:0 0 10px;font-size:26px;font-weight:400;padding-right:44px}
.close{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:12px;background:#eef3f9;font-size:22px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.dexc{background:#f2f7fd;border-radius:16px;padding:8px;text-align:center;font-size:16px}
.dexc.got{background:linear-gradient(180deg,#e9f6ff,#d6ecff)}
.dexc .nm{margin-top:4px}.dexc .dp{font-size:13px;color:var(--sub)}
.zh{margin:16px 0 8px;font-size:19px;color:#1d5a99}
.zh small{color:var(--sub);font-size:14px}
.creature{text-align:center}
.creature .pic{max-width:420px;margin:0 auto;background:radial-gradient(circle,#e3f3ff,#cfe6fb);border-radius:18px}
.creature h3{font-size:34px;margin:10px 0 4px;font-weight:400}
.creature .badge{display:inline-block;background:#1d4f91;color:#fff;border-radius:999px;padding:4px 14px;font-size:16px}
.creature ul{text-align:left;font-size:20px;line-height:1.55;padding-left:22px;margin:14px 0 4px;word-break:keep-all}
.flip{animation:flip .7s ease}
@keyframes flip{from{transform:perspective(800px) rotateY(90deg) scale(.8);opacity:0}}
.new{display:inline-block;background:#ff5d8f;color:#fff;border-radius:10px;padding:2px 10px;font-size:16px;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:12px 16px;border-radius:14px;font-size:18px;background:#1d6fd1;color:#fff;box-shadow:0 3px 0 #13509a}
.btn.gray{background:#e3e9f1;color:var(--ink);box-shadow:0 3px 0 #bfc9d6}
.btn.red{background:#e95454;box-shadow:0 3px 0 #b03636}
.btn.wide{width:100%;font-size:22px;padding:14px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;background:#f2f7fd;border-radius:14px;padding:10px 12px;font-size:17px}
.li .t{flex:1}.li small{color:var(--sub)}
.li.cur{background:#fff0e3;outline:2px solid #ffb27a}
.li button{padding:8px 12px;border-radius:12px;background:#1d6fd1;color:#fff;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:8px 6px;border-bottom:1px solid #e3e9f1;text-align:center}
th{color:var(--sub);font-weight:400}
.pinrow{display:flex;justify-content:center;gap:14px;margin:14px 0}
.pinrow i{width:22px;height:22px;border-radius:50%;border:3px solid #9fb3cc}
.pinrow i.on{background:#1d4f91;border-color:#1d4f91}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.pinpad button{font-size:28px;padding:12px 0;border-radius:14px;background:#eef3f9}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(10,25,50,.92);color:#fff;padding:12px 20px;border-radius:14px;z-index:99;font-size:18px;animation:pop .2s}

/* 잠수 연출 */
.dive{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:rgba(0,0,0,.25)}
.dive .subbig{width:180px;animation:sink 2.6s ease-in-out}
@keyframes sink{from{transform:translateY(-60px)}to{transform:translateY(40px)}}
.dive .dn{font-size:64px;text-shadow:0 3px 8px rgba(0,0,0,.5)}
.dive p{font-size:22px;margin:6px}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<header>
  <a class="hbtn" href="../doyun/">🏠 공부방</a>
  <h1>봉인된 아틀란티스와<br>크라켄 던전 정복기</h1>
  <span class="sync" id="sync" title="온라인 저장">⏳</span>
</header>
<div class="wrap">
  <aside class="gauge" id="gauge"></aside>
  <main class="main" id="main"></main>
</div>
<div id="layer"></div>

<script>
/* ════════════════════════════════════════════════════════════
   봉인된 아틀란티스와 크라켄 던전 정복기 — 초4 2학기 수학 (도윤)
   · 미션 순서로 진행: 한 주 = 월~목 새 진도 4개 + 금 복습 보스전
   · 저장: Firebase moon-15f88 › e4/doyun-math (공부방 e4/doyun 과 따로)
   · 생물 사진: images/fish/생물이름.jpg 를 올리면 그림 대신 사진이 나와요
     (이름은 띄어쓰기 없이. 예: images/fish/흰동가리.jpg, images/fish/머리없는닭괴물.jpg)
   · 새 구역을 채우려면: WEEKS 의 g(문제 만들기 이름)를 넣고 G 에 문제 만들기를 추가해요
   ════════════════════════════════════════════════════════════ */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBHMmNT-TxBAJqarHqLAYtM3VhaUhynzEw",
  authDomain: "moon-15f88.firebaseapp.com",
  projectId: "moon-15f88",
  storageBucket: "moon-15f88.firebasestorage.app",
  messagingSenderId: "124372121061",
  appId: "1:124372121061:web:b1596628daae0bb08eab0c",
  measurementId: "G-NV17H8CTJE"
};
const DOC_PATH = ['e4','doyun-math'];
const LS_KEY = 'atlan-doyun-math';

/* ───── 공통 도구 ───── */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const $=id=>document.getElementById(id);
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const hashPin=(p,salt='')=>{let h=2166136261;for(const ch of salt+'#'+p){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h.toString(16);};
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
/* 정수 n 을 10^dp 로 나눈 소수 문자열 (끝의 0은 빼요). fmt(245,2) → "2.45" */
function fmt(n,dp){ if(!dp) return String(n); const neg=n<0; let s=String(Math.abs(n)).padStart(dp+1,'0'); let i=s.slice(0,-dp), f=s.slice(-dp).replace(/0+$/,''); return (neg?'-':'')+i+(f?'.'+f:''); }
const notTen=(a,b)=>{let n;do{n=rnd(a,b);}while(n%10===0);return n;};
const frac=(a,b)=>`<span class="fr"><i>${a}</i><i>${b}</i></span>`;
const BIG=s=>`<span class="bignum">${s}</span>`;
/* 받침에 따라 조사 붙이기. 숫자로 끝나면 0(영)·1(일)·3(삼)·6(육)·7(칠)·8(팔) 이 받침이 있어요 */
const jo=(s,a,b)=>{ const ch=String(s).trim().slice(-1); let bat=false;
  if(/[0-9]/.test(ch)) bat='013678'.includes(ch); else { const c=ch.charCodeAt(0); bat=c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0; }
  return s+(bat?a:b); };
const pp=(s,a,b)=>jo(s,a,b).slice(String(s).length);   // 조사만
const ye=s=>jo(s,'이에요','예요');
const DIG=['영','일','이','삼','사','오','육','칠','팔','구'];
function readInt(n){ if(n===0) return '영'; const u=['','십','백','천'], s=String(n); let r=''; for(let i=0;i<s.length;i++){ const d=+s[i], un=u[s.length-1-i]; if(!d) continue; r+=(d===1&&un?'':DIG[d])+un; } return r; }
function readDec(str){ const [i,f]=String(str).split('.'); return readInt(+i)+(f?' 점 '+[...f].map(c=>DIG[+c]).join(''):''); }
function distinctDigits(k){ const d=shuffle([1,2,3,4,5,6,7,8,9]); return d.slice(0,k); }

/* ───── 소리 ───── */
let AC;
function tone(f,d,type='sine',t0=0,v=.14){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,AC.currentTime+t0); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+d); o.connect(g).connect(AC.destination); o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+d+.02);}catch(e){} }
const sOK=()=>{tone(660,.14);tone(880,.22,'sine',.11);};
const sNO=()=>{tone(240,.28,'triangle');};
const sWIN=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.25,'sine',i*.13));};

/* ════════ 생물 그림 (SVG) ════════ */
const eyeS=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x+r*.18}" cy="${y}" r="${r*.62}" fill="#1b1b2f"/><circle cx="${x+r*.4}" cy="${y-r*.32}" r="${r*.24}" fill="#fff"/>`;
const blush=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="5" ry="3" fill="#ff7aa8" opacity=".45"/>`;
const smile=(x,y)=>`<path d="M${x-5},${y} q5,4 10,0" stroke="#2a2a3a" stroke-width="2" fill="none" stroke-linecap="round"/>`;

function fishS(o){

/* SVG: 수직선 (왼쪽~오른쪽을 10칸, k번째 눈금에 화살표) */
function numberLine(left,right,k){
  let s=`<svg viewBox="0 0 340 100" width="340" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="60" x2="320" y2="60" stroke="#1d4f91" stroke-width="3"/>`;
  for(let i=0;i<=10;i++){ const x=20+i*30, big=i===0||i===10||i===5; s+=`<line x1="${x}" y1="${big?46:52}" x2="${x}" y2="${big?74:68}" stroke="#1d4f91" stroke-width="${big?3:2}"/>`; }
  const ax=20+k*30;
  s+=`<path d="M${ax},44 l-9,-14 h18z" fill="#ff7a2a"/><text x="${ax}" y="22" text-anchor="middle" font-size="20" fill="#ff7a2a">?</text>`;
  s+=`<text x="20" y="96" text-anchor="middle" font-size="18" fill="#16304f">${left}</text><text x="320" y="96" text-anchor="middle" font-size="18" fill="#16304f">${right}</text></svg>`;
  return s;
}
/* SVG: 모눈 100칸 중 n칸 색칠 (한 줄 = 0.1) */
function grid100(n){
  let s=`<svg viewBox="0 0 204 204" width="204" xmlns="http://www.w3.org/2000/svg">`;
  for(let c=0;c<10;c++) for(let r=0;r<10;r++){ const idx=c*10+r; s+=`<rect x="${2+c*20}" y="${2+r*20}" width="20" height="20" fill="${idx<n?'#7fc4ff':'#fff'}" stroke="#9fb3cc" stroke-width="1"/>`; }
  return s+`<rect x="2" y="2" width="200" height="200" fill="none" stroke="#1d4f91" stroke-width="3"/></svg>`;
}
/* SVG: 자리표 */
function placeChart(str,cols){
  const [ip,fp='']=String(str).split('.'); const heads=['일의 자리','소수 첫째 자리','소수 둘째 자리','소수 셋째 자리'].slice(0,cols);
  const digits=[ip.slice(-1),...[...fp.padEnd(cols-1,'0')]].slice(0,cols); const w=84;
  let s=`<svg viewBox="0 0 ${cols*w+4} 96" width="${cols*w+4}" xmlns="http://www.w3.org/2000/svg">`;
  heads.forEach((h,i)=>{ s+=`<rect x="${2+i*w}" y="2" width="${w}" height="36" fill="#e6f3ff" stroke="#9fb3cc"/><text x="${2+i*w+w/2}" y="26" text-anchor="middle" font-size="14" fill="#1d4f91">${h}</text><rect x="${2+i*w}" y="38" width="${w}" height="56" fill="#fff" stroke="#9fb3cc"/><text x="${2+i*w+w/2}" y="78" text-anchor="middle" font-size="32" fill="#16304f">${digits[i]}</text>`; });
  return s+'</svg>';
}
function readChoices(str){
  const [i,f]=str.split('.'), right=readDec(str), opts=new Set([right]);
  if(f&&f.length>1) opts.add(readInt(+i)+' 점 '+readInt(+f));
  if(f&&f.length>1) opts.add(readInt(+(i+f[0]))+' 점 '+[...f.slice(1)].map(c=>DIG[+c]).join(''));
  opts.add(readInt(+(i+f)));
  while(opts.size<4) opts.add(readDec(fmt(rnd(101,999),2)));
  return [right,[...opts].slice(0,4)];
}

function makeQs(m){

  while(out.length<n && guard++<300){
    let f;
    if(m.boss){ const key=m.wgens[out.length%m.wgens.length]; f=pick(G[key]); }

function quizHead(){
  const n=Q.list.length;
  return `<div class="qtop"><button class="x" onclick="quitQuiz()">✕</button><div class="dots">${Q.list.map((_,j)=>`<i class="${Q.res[j]===true?'o':Q.res[j]===false?'w':j===Q.i?'c':''}"></i>`).join('')}</div><span class="qcount">${Math.min(Q.i+1,n)}/${n}</span></div>`;
}
function drawQuiz(){
  const q=Q.list[Q.i]; let h=`<div class="screen" id="qs"><div class="inner">${quizHead()}`;
  if(Q.mode==='boss') h+=`<div class="bossbar"><div class="pic" id="bosspic">${creSVG(Q.m.cre)}</div><div><div class="bn">⚔️ ${Q.m.cre.n}</div><div class="hp" id="hp">${'❤️'.repeat(Q.hp)}${'🤍'.repeat(7-Q.hp)}</div><small style="opacity:.8">맞힐 때마다 ❤️ 하나씩 줄어요</small></div></div>`;
  if(Q.mode==='vortex') h+=`<div class="bossbar"><div style="font-size:44px">🌀</div><div><div class="bn">오답 소용돌이</div><small style="opacity:.85">맞히면 소용돌이에서 빠져나와요 (${q.from||''})</small></div></div>`;
  h+=`<div class="qcard" id="qcard"><div class="qtext">${q.q}</div>${q.svg?`<div class="qsvg">${q.svg}</div>`:''}`;
  if(q.t==='num'){
    Q.buf='';
    h+=`<div class="disp empty" id="disp">답을 눌러요</div><div class="pad">
      ${[7,8,9].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}<button class="del" onclick="key('del')">⌫</button>
      ${[4,5,6].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}<button class="ok" onclick="submitNum()">확인</button>
      ${[1,2,3].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}
      <button onclick="key('0')" style="grid-column:1/span 2">0</button><button onclick="key('.')">.</button></div>`;
  } else {
    const three=q.ch.length===3&&q.ch.every(c=>c.length===1);
    h+=`<div class="choices ${three?'three':''}">${q.ch.map((c,j)=>`<button onclick="choose(${j})">${choLabel(c)}</button>`).join('')}</div>`;
  }
  h+=`</div></div></div>`;
  $('layer').innerHTML=h;
}
function key(k){
  if(k==='del') Q.buf=Q.buf.slice(0,-1);
  else if(k==='.'){ if(!Q.buf.includes('.')) Q.buf=(Q.buf||'0')+'.'; }
  else if(Q.buf.length<8) Q.buf=(Q.buf==='0'?'':Q.buf)+k;
  const d=$('disp'); if(!d) return; d.textContent=Q.buf||'답을 눌러요'; d.classList.toggle('empty',!Q.buf);
}
function submitNum(){
  if(!Q.buf||Q.buf==='.'){ $('disp').classList.add('shake'); setTimeout(()=>$('disp')&&$('disp').classList.remove('shake'),400); return; }
  const q=Q.list[Q.i]; judge(Math.abs(parseFloat(Q.buf)-parseFloat(q.a))<1e-9);
}
function choose(j){ const q=Q.list[Q.i]; judge(q.ch[j]===q.a); }
function judge(ok){
  const q=Q.list[Q.i]; Q.res[Q.i]=ok; logAnswer(ok);
  if(ok){ Q.c++; sOK(); } else sNO();
  if(Q.mode==='vortex'){ if(ok) S.wrong=S.wrong.filter(w=>w.id!==q.id); }
  else if(!ok){ S.wrong.push(Object.assign({},q,{id:'w'+Date.now().toString(36)+rnd(100,999),from:Q.m.title})); if(S.wrong.length>80) S.wrong.shift(); }
  save();
  if(Q.mode==='boss'&&ok){ Q.hp--; const hp=$('hp'); if(hp) hp.innerHTML=`${'❤️'.repeat(Q.hp)}${'🤍'.repeat(7-Q.hp)}`; const bp=$('bosspic'); if(bp){ bp.classList.remove('hit'); void bp.offsetWidth; bp.classList.add('hit'); } }
  const fb=document.createElement('div'); fb.className='fb';
  const ansTxt=q.t==='cho'?choLabel(q.a):q.a;
  fb.innerHTML=ok?`<div class="mark">⭕</div><h3>${pick(['정답!','멋져요!','훌륭해요!','바로 그거예요!'])}</h3>${Q.mode==='boss'?`<p>${Q.m.cre.n}에게 공격 성공! 💥</p>`:''}`
    :`<div class="mark">❌</div><h3>아쉬워요!</h3><p>정답은</p><div class="ans">${ansTxt}</div><p>${q.ex||''}</p>${Q.mode!=='vortex'?'<p style="font-size:16px">🌀 오답 소용돌이에 넣어 둘게요</p>':''}<button onclick="nextQ()">알겠어요</button>`;
  $('qcard').appendChild(fb);
  if(ok) setTimeout(nextQ,950);
}
function nextQ(){
  if(!Q) return;
  if(Q.mode==='boss'&&Q.hp<=0) return finishQuiz();
  Q.i++; if(Q.i>=Q.list.length) return finishQuiz();
  drawQuiz();
}
function quitQuiz(){ if(confirm('잠수를 멈출까요?\n지금까지 푼 문제는 기록돼요.')){ Q=null; $('layer').innerHTML=''; render(); } }
document.addEventListener('keydown',e=>{
  if(!Q||!$('disp')||document.querySelector('.fb')) { if(e.key==='Enter'){ const b=document.querySelector('.fb button'); if(b) b.click(); } return; }
  if(/^[0-9]$/.test(e.key)) key(e.key); else if(e.key==='.') key('.'); else if(e.key==='Backspace') key('del'); else if(e.key==='Enter') submitNum();
});

function finishQuiz(){
  const n=Q.list.length, done=Q.res.filter(r=>r!==undefined).length;
  if(Q.mode==='vortex'){
    const c=Q.c; Q=null; render(); sWIN();
    modal(`<h2>🌀 소용돌이 탈출!</h2><p style="font-size:22px;text-align:center">${c}문제를 소용돌이에서 구해 냈어요!<br><small style="color:var(--sub)">남은 문제: ${S.wrong.length}개</small></p><button class="btn wide" onclick="closeModal()">좋아요</button>`);
    return;
  }
  const m=Q.m, win=Q.mode!=='boss'||Q.hp<=0, replay=Q.replay, score=`${Q.c}/${done}`;
  if(Q.mode==='boss'&&!win){
    Q=null; $('layer').innerHTML=''; render(); sNO();
    modal(`<h2>💨 ${jo(m.cre.n,'이','가')} 도망갔어요!</h2><div style="max-width:260px;margin:0 auto">${picHTML(m.cre,true)}</div><p style="font-size:20px;text-align:center">${score} 맞혔어요. 7문제를 맞히면 물리칠 수 있어요!<br>틀린 문제는 오답 소용돌이에서 연습해 봐요.</p><div class="row"><button class="btn gray" style="flex:1" onclick="closeModal()">다음에</button><button class="btn" style="flex:1" onclick="closeModal();startMission(${m.i},${replay})">⚔️ 다시 도전</button></div>`);
    return;
  }
  S.done[m.id]=Math.max(S.done[m.id]||0,Q.c);
  logMission(`${mLabel(m)} ${m.title} (${score})`);
  Q=null; $('layer').innerHTML='';
  if(replay||m.i!==S.mission){ save(); render(); sWIN(); modal(`<h2>✅ 다시 풀기 끝!</h2><p style="font-size:22px;text-align:center">${m.title}<br>${score} 맞혔어요!</p><button class="btn wide" onclick="closeModal()">좋아요</button>`); return; }
  const from=curDepth(); S.mission++;
  const c=m.cre, isNew=!S.dex.includes(c.id); if(isNew) S.dex.push(c.id);
  save(); diveTo(from,m.depth,()=>{ render(); showCreature(c,isNew,`${m.boss?'보스를 물리쳤어요! ':''}${score} 맞혔어요`); });
}

/* 잠수 연출 */
function diveTo(from,to,done){
  setBg(to); const g=$('gsub'); if(g) g.style.top=depthFrac(to)*100+'%';
  const el=document.createElement('div'); el.className='dive';
  el.innerHTML=`<div class="subbig">${SUB}</div><div class="dn"><span id="dn">${from.toLocaleString()}</span>m</div><p>더 깊이 내려가는 중… 🫧</p>`;
  document.body.appendChild(el); sWIN();
  const t0=performance.now(), dur=2300;
  (function step(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3), v=Math.round(from+(to-from)*e); const dn=$('dn'); if(dn) dn.textContent=v.toLocaleString(); const gd=$('gd'); if(gd) gd.textContent=v.toLocaleString(); if(p<1) requestAnimationFrame(step); else setTimeout(()=>{ el.remove(); done(); },500); })(t0);
}

/* ════════ 모달 · 도감 ════════ */
function modal(html){ $('layer').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">✕</button>${html}</div></div>`; }
function closeModal(){ $('layer').innerHTML=''; }
function creatureHTML(c){
  return `<div class="creature">${picHTML(c)}<h3>${c.n}</h3><span class="badge">🌊 사는 곳: ${c.r}</span><ul>${c.f.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}
function showCreature(c,isNew,sub){
  modal(`<div class="flip" style="text-align:center">${isNew?'<span class="new">NEW! 새 친구</span>':'<span class="new" style="background:#8aa">이미 만난 친구</span>'}<p style="margin:4px 0;color:var(--sub);font-size:18px">${c.d.toLocaleString()}m에서 만났어요${sub?' · '+sub:''}</p>${creatureHTML(c)}</div><button class="btn wide" style="margin-top:12px" onclick="closeModal()">📖 도감에 넣기</button>`);
}
function openDex(){
  let h=`<h2>📖 바다 생물 도감 <small style="color:var(--sub);font-size:18px">${S.dex.length} / ${CRE.length}</small></h2>`;
  ZONES.forEach(z=>{
    const list=CRE.map((c,i)=>({c,m:MISSIONS[i]})).filter(x=>x.m.z===z.n);
    const got=list.filter(x=>S.dex.includes(x.c.id)).length;
    h+=`<div class="zh">${z.n}구역 ${z.name} <small>${z.range} · ${got}/${list.length}</small></div><div class="dexgrid">`;
    list.forEach(({c})=>{ const has=S.dex.includes(c.id); h+=`<button class="dexc ${has?'got':''}" onclick="dexOne('${c.id}')">${picHTML(c,!has)}<div class="nm">${has?c.n:'???'}</div><div class="dp">${c.d.toLocaleString()}m${c.boss?' · 보스':''}</div></button>`; });
    h+=`</div>`;
  });
  modal(h);
}
function dexOne(id){
  const c=CRE.find(x=>x.id===id), has=S.dex.includes(id);
  if(has) modal(`${creatureHTML(c)}<button class="btn gray wide" style="margin-top:12px" onclick="openDex()">◀ 도감으로</button>`);
  else modal(`<div class="creature"><div class="pic sil" style="max-width:360px;margin:0 auto">${creSVG(c)}</div><h3>???</h3><p style="font-size:20px">아직 못 만났어요.<br><b>${c.d.toLocaleString()}m</b> 근처까지 내려가면 만날 수 있어요!</p></div><button class="btn gray wide" onclick="openDex()">◀ 도감으로</button>`);
}

/* ════════ 항해 일지 ════════ */
function openVoyage(){
  let h=`<h2>🗺️ 항해 일지</h2><p style="color:var(--sub);font-size:16px;margin-top:0">지나온 미션은 다시 풀 수 있어요 (카드는 처음 한 번만 받아요)</p>`;
  WEEKS.forEach((w,wi)=>{
    const ms=MISSIONS.filter(m=>m.week===wi+1), z=ZONES[w.z-1];
    if(wi===0||WEEKS[wi-1].z!==w.z) h+=`<div class="zh">${z.n}구역 ${z.name} · ${z.unit}</div>`;
    h+=`<div class="list" style="margin-bottom:8px">`;
    ms.forEach(m=>{
      const st=m.i<S.mission?'✅':m.i===S.mission?'▶️':!m.ready?'🚧':'🔒';
      h+=`<div class="li ${m.i===S.mission?'cur':''}"><span>${st}</span><span class="t">${m.title}<br><small>${mLabel(m)} · ${m.depth.toLocaleString()}m${S.done[m.id]!==undefined?` · 최고 ${S.done[m.id]}개 맞힘`:''}</small></span>${m.i<S.mission&&m.ready?`<button onclick="closeModal();startMission(${m.i},true)">다시 풀기</button>`:''}</div>`;
    });
    h+=`</div>`;
  });
  modal(h);
}

/* ════════ 엄마 모드 (비밀번호는 엄마 모드 안에서 바꿀 수 있어요. 처음은 0000) ════════ */
let PIN='', SETTINGS=null;
async function openAdmin(){
  PIN=''; drawPin('설정을 불러오는 중…');
  try{ if(await timeout(cloudInit(),6000)){ const s=await timeout(cloud.db.collection('e4').doc('settings').get(),6000); SETTINGS=s.exists?s.data():{}; } }catch(e){ SETTINGS=null; }
  drawPin();
}
const usingDefaultPin=()=>!S.pinH&&!(SETTINGS&&(SETTINGS.momH||SETTINGS.pinH));
function drawPin(msg){
  modal(`<h2>🔒 엄마 모드</h2><p style="text-align:center;color:var(--sub);font-size:17px">${msg||'엄마 비밀번호 4자리를 눌러 주세요'}${usingDefaultPin()?'<br><small>처음 비밀번호는 0000 이에요. 들어가서 꼭 바꿔 주세요.</small>':''}</p><div class="pinrow">${[0,1,2,3].map(i=>`<i class="${i<PIN.length?'on':''}"></i>`).join('')}</div><div class="pinpad" id="pinpad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('')}<button onclick="pinKey('del')">⌫</button><button onclick="pinKey('0')">0</button><button onclick="closeModal()" style="font-size:18px">닫기</button></div>`);
}
function pinKey(k){
  if(k==='del') PIN=PIN.slice(0,-1); else if(PIN.length<4) PIN+=k;
  if(PIN.length<4) return drawPin();
  /* 이 앱에서 정한 비밀번호가 있으면 그것만, 없으면 공부방(e4/settings)의 엄마·관리자 비밀번호, 그것도 없으면 0000 */
  const st=SETTINGS||{};
  const ok=S.pinH ? hashPin(PIN,'atlan')===S.pinH
    : (st.momH&&hashPin(PIN,'mom')===st.momH)||hashPin(PIN,'admin')===(st.pinH||hashPin('0000','admin'));
  if(ok){ PIN=''; drawAdmin(); } else { PIN=''; sNO(); drawPin('비밀번호가 틀렸어요. 다시 눌러 주세요'); const p=$('pinpad'); if(p) p.classList.add('shake'); }
}
function drawAdmin(){
  const m=MISSIONS[S.mission];
  const keys=Object.keys(S.log).sort().reverse();
  let h=`<h2>👩 엄마 모드</h2>
   <div class="card" style="background:#f2f7fd;box-shadow:none"><b>지금 미션</b><p style="margin:6px 0 10px;font-size:19px">${m?`${m.i+1}번째 · ${mLabel(m)} · ${m.title}<br><small style="color:var(--sub)">${ZONES[m.z-1].n}구역 ${ZONES[m.z-1].name} · 지금 수심 ${curDepth().toLocaleString()}m ${m.ready?'':'· 🚧 아직 준비 중인 미션'}</small>`:'모든 미션 완료'}</p>
   <div class="row"><button class="btn gray" onclick="moveMission(-1)">◀ 한 칸 뒤로</button><button class="btn" onclick="moveMission(1)">한 칸 앞으로 ▶</button></div>
   <p style="margin:12px 0 6px;font-size:16px">바로 옮기기</p>
   <select id="jump" style="width:100%;font-size:17px;padding:10px;border-radius:12px;font-family:inherit">${MISSIONS.map(x=>`<option value="${x.i}" ${x.i===S.mission?'selected':''}>${x.i+1}. ${mLabel(x)} · ${x.title}${x.ready?'':' (준비 중)'}</option>`).join('')}<option value="${MISSIONS.length}" ${S.mission>=MISSIONS.length?'selected':''}>모두 완료</option></select>
   <label style="display:flex;gap:8px;align-items:center;font-size:16px;margin:10px 0"><input type="checkbox" id="grant" checked style="width:22px;height:22px"> 앞으로 옮길 때 건너뛴 미션의 생물 카드도 주기</label>
   <button class="btn wide" onclick="setMission(+$('jump').value)">이 미션으로 옮기기</button></div>
   <div class="card" style="background:#f2f7fd;box-shadow:none"><b>날짜별 기록</b>
   ${keys.length?`<table><tr><th>날짜</th><th>푼 문제</th><th>맞힘</th><th>정답률</th></tr>${keys.map(k=>{const L=S.log[k];return `<tr><td>${k.slice(5).replace('-','/')}</td><td>${L.q}</td><td>${L.c}</td><td>${L.q?Math.round(L.c/L.q*100):0}%</td></tr>${(L.m||[]).length?`<tr><td colspan="4" style="text-align:left;font-size:14px;color:var(--sub)">${L.m.map(x=>'✔ '+x).join('<br>')}</td></tr>`:''}`;}).join('')}</table>`:'<p style="color:var(--sub)">아직 기록이 없어요</p>'}</div>
   <div class="card" style="background:#f2f7fd;box-shadow:none"><b>오답 소용돌이</b> <span style="color:var(--sub)">${S.wrong.length}문제</span>
   <div class="row" style="margin-top:8px"><button class="btn red" onclick="if(confirm('오답 소용돌이를 비울까요?')){S.wrong=[];save();drawAdmin();}">비우기</button></div></div>
   <div class="card" style="background:#f2f7fd;box-shadow:none"><b>엄마 비밀번호 바꾸기</b> <span style="color:var(--sub);font-size:15px">${S.pinH?'(정해져 있어요)':'(아직 0000 이에요)'}</span>
   <div class="row" style="margin-top:8px"><input id="newpin" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" style="flex:1;font-size:20px;padding:10px;border-radius:12px;border:2px solid #cfe0f3;font-family:inherit"><button class="btn" onclick="setPin()">바꾸기</button></div></div>
   <button class="btn gray wide" onclick="closeModal();render()">닫기</button>`;
  modal(h);
}
function setPin(){
  const v=($('newpin').value||'').trim();
  if(!/^\d{4}$/.test(v)){ toast('숫자 4자리를 넣어 주세요'); return; }
  S.pinH=hashPin(v,'atlan'); save(); drawAdmin(); toast('엄마 비밀번호를 바꿨어요 🔒');
}
function moveMission(d){ setMission(Math.max(0,Math.min(MISSIONS.length,S.mission+d))); }
function setMission(n){
  const grant=$('grant')?$('grant').checked:true;
  if(n>S.mission&&grant) for(let i=S.mission;i<n;i++){ const id=CRE[i].id; if(!S.dex.includes(id)) S.dex.push(id); }
  S.mission=n; save(); render(); drawAdmin(); toast('미션을 옮겼어요');
}

/* ════════ 시작 ════════ */
(function bubbles(){ let h=''; for(let i=0;i<14;i++){ const s=rnd(8,26); h+=`<span style="left:${rnd(0,100)}%;width:${s}px;height:${s}px;animation-duration:${rnd(9,20)}s;animation-delay:-${rnd(0,20)}s"></span>`; } $('bubbles').innerHTML=h; })();
render();
cloudLoad();
</script>
</body>
</html>
