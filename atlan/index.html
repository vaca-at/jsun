<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta property="og:type" content="website">

<style>
:root{--bg:#8ad8ff;--light:.35;--ink:#16304f;--sub:#5a6f8c;--card:rgba(255,255,255,.94);--accent:#ff8a3d;--ok:#1fae68;--bad:#e95454;--gw:84px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
@font-face{font-family:'OngleipUnz';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2');font-weight:400;font-display:swap}
body{font-family:'OngleipUnz','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background-color:var(--bg);transition:background-color 2.4s ease;color:var(--ink);font-size:20px;overflow-x:hidden;-webkit-user-select:none;user-select:none}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,255,255,var(--light)),rgba(255,255,255,0) 55%);pointer-events:none;z-index:0}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubbles span{position:absolute;bottom:-30px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px)}}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(0,22,55,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff}
header h1{flex:1;margin:0;font-size:17px;font-weight:400;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.4);text-align:center}
.hbtn{background:rgba(255,255,255,.2);border-radius:12px;padding:7px 10px;font-size:14px;color:#fff;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.3)}
.hbtn.dia{display:inline-flex;align-items:center;gap:6px}
.hbtn.dia img{width:20px;height:20px;border-radius:5px;display:block}
.sync{font-size:14px;opacity:.85;min-width:22px;text-align:center}

.wrap{position:relative;z-index:1;display:grid;grid-template-columns:var(--gw) 1fr;gap:10px;padding:10px 10px 30px;max-width:980px;margin:0 auto}
/* 수심 게이지 */
.gauge{position:sticky;top:64px;height:calc(100dvh - 84px);min-height:380px;display:flex;flex-direction:column;align-items:center;color:#fff}
.gnum{text-align:center;background:rgba(0,20,50,.45);border-radius:16px;padding:6px 4px;width:100%;margin-bottom:8px;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.gnum b{display:block;font-size:26px;font-weight:400;line-height:1.05}
.gnum small{font-size:13px;opacity:.85}
.gtrack{position:relative;flex:1;width:34px;margin:22px 0 14px;border-radius:18px;overflow:visible;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.gz{position:absolute;left:0;right:0;height:20%;}
.gz:first-child{border-radius:18px 18px 0 0}.gz:nth-child(5){border-radius:0 0 18px 18px}
.gmark{position:absolute;left:40px;font-size:11px;transform:translateY(-50%);white-space:nowrap;opacity:.9;text-shadow:0 1px 2px #000}
.gzl{display:none}
.gsub{position:absolute;left:50%;width:58px;transform:translate(-50%,-50%);transition:top 2.4s ease;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.gsub svg{display:block;width:100%;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@media(min-width:700px){:root{--gw:150px} .gnum b{font-size:38px} .gtrack{width:44px} .gmark{left:52px;font-size:13px} .gzl{display:block;position:absolute;left:52px;font-size:13px;opacity:.75;top:50%;transform:translateY(-50%)} .gmark{display:none} .gmark.always{display:block} body{font-size:22px}}

/* 메인 카드 */
.main{min-width:0}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 20px rgba(0,20,60,.25);margin-bottom:12px}
.zone{display:inline-block;background:#e6f3ff;color:#1d5a99;border-radius:999px;padding:4px 12px;font-size:15px}
.mlabel{color:var(--sub);font-size:17px;margin:10px 0 2px}
.mtitle{font-size:30px;margin:0 0 6px;line-height:1.2}
.mdesc{color:var(--sub);font-size:17px;margin:0 0 12px}
.big-btn{display:block;width:100%;padding:18px;border-radius:18px;font-size:26px;background:linear-gradient(180deg,#ffa25a,#ff7a2a);color:#fff;box-shadow:0 5px 0 #c85412;margin-top:10px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c85412}
.big-btn.boss{background:linear-gradient(180deg,#9b6cff,#6a3df0);box-shadow:0 5px 0 #4320b0}
.big-btn[disabled]{background:#b9c4d2;box-shadow:0 5px 0 #8b97a6;cursor:default}
.week{display:flex;gap:6px;margin:12px 0 4px}
.week button{flex:1;min-width:0;text-align:center;border-radius:12px;padding:6px 0;background:#e6f0fb;color:#2d5a8c;font-size:15px;line-height:1.25;box-shadow:0 2px 0 #c9daee}
.week button small{display:block;font-size:12px;opacity:.85}
.week button:active{transform:translateY(2px);box-shadow:none}
.week .done{background:#d8f5e6;color:#14814b;box-shadow:0 2px 0 #a8dfc1}.week .now{background:#ffe7d4;color:#c4561a;outline:3px solid #ffb27a}
.week .tdy{box-shadow:0 0 0 3px #ffd34d inset}
/* 엄마의 한마디 (초록 띠) · 오늘 상자 */
.mommsg{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,#2fbf71,#1f9e5c);color:#fff;border-radius:18px;padding:12px 16px;margin-bottom:12px;box-shadow:0 6px 16px rgba(20,90,50,.25)}
.mbtn{margin-top:8px;background:rgba(255,255,255,.22);color:#fff;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:5px 14px;font-size:15px;font-family:inherit;cursor:pointer}
.mbox{background:#effaf3;border-left:5px solid #2fbf71;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.mbox .mb-d{font-size:14px;color:#1f9e5c}.mbox p{margin:4px 0 0;font-size:19px;line-height:1.45;white-space:pre-wrap;word-break:keep-all}
.mhist{margin-top:10px;max-height:260px;overflow-y:auto}.mhist .mbox{display:flex;gap:8px;align-items:flex-start}.mhist .mbox>div{flex:1;min-width:0}.mhist .mbox p{font-size:16px}
.mhist .mbox button{border:0;background:#fff;border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer;flex:none}
.mommsg .mm-ic{font-size:26px;line-height:1.2}
.mommsg b{font-size:15px;opacity:.9;font-weight:400}
.mommsg p{margin:2px 0 0;font-size:20px;line-height:1.45;white-space:pre-wrap;word-break:keep-all}
.todaybox{background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:12px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.tb-date{font-size:22px;color:#1d4f91}
.tb-todo{font-size:18px;margin-top:4px;line-height:1.45;word-break:keep-all}
.tb-stat{font-size:15px;color:var(--sub);margin-top:4px}
/* 오늘 푼 문제 (큰 숫자) · 최근 7일 · 🤖 AI 응원 */
.tb-nums{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin-top:10px}
.tb-n{background:#eef6ff;border-radius:16px;padding:8px 6px;text-align:center;font-size:15px;color:var(--sub);line-height:1.2}
.tb-n b{display:block;font-size:40px;font-weight:400;line-height:1.1;color:#1d4f91}
.tb-n b small{font-size:18px}
.tb-n.main{background:linear-gradient(180deg,#fff3e6,#ffe3cc);color:#a8501a}
.tb-n.main b{font-size:56px;color:#ff7a2a}
.tb-n.zero b{color:#9fb3c8}
.tb-week{display:flex;gap:5px;align-items:flex-end;margin-top:10px}
.tb-week div{flex:1;text-align:center;font-size:12px;color:var(--sub);line-height:1.25}
.tb-week i{display:block;margin:2px auto;width:70%;max-width:34px;min-height:5px;border-radius:7px 7px 3px 3px;background:#7cc4ff}
.tb-week i.no{background:#dde6f0}
.tb-week .tdy{color:#c4561a}.tb-week .tdy i{background:#ff8a3d}
.tb-week b{font-weight:400;font-size:13px;color:var(--ink)}
.tb-week i.goal{background:#2fbf71}
/* 하루 목표 문제 수 막대 */
.tb-goal{margin-top:10px;font-size:16px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.tb-goal b{font-weight:400;color:var(--ink)}
.tb-gbar{height:14px;background:#e6edf6;border-radius:8px;overflow:hidden;margin-top:4px}
.tb-gbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb35c,#ff7a2a);border-radius:8px;transition:width .6s}
.tb-gbar.full i{background:linear-gradient(90deg,#46d18c,#1fae68)}
/* 엄마의 한마디 아래 🤖 AI 응원 (같은 초록 띠 안) */
.mm-ai.sep{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.45)}
.mm-ai p{font-size:18px}
.mm-ai.loading p{opacity:.65}
.tb-send{margin-top:10px;width:100%;font-size:19px;padding:10px;border-radius:14px;background:linear-gradient(180deg,#46d18c,#1fae68);color:#fff;box-shadow:0 4px 0 #168a52}
.today.late{background:#ffe1dc;color:#b3261e}.today.ahead{background:#e4ecff;color:#2b4ea8}
.pv-q{background:#f4f8fd;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:18px;line-height:1.45}
.pv-q .bignum{display:block;text-align:center;font-size:28px;color:#1d4f91}
.pv-q svg{max-width:260px;height:auto;display:block;margin:6px auto 0}
.wait{display:flex;align-items:center;gap:12px;background:#f2f6fb;border-radius:16px;padding:10px;margin-top:6px}
.wait .pic{width:110px;flex:none}
.wait p{margin:0;font-size:17px;color:var(--sub)}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.menu{grid-template-columns:repeat(4,1fr)}}
.menu button{background:var(--card);border-radius:18px;padding:14px 6px;font-size:18px;box-shadow:0 4px 14px rgba(0,20,60,.2);line-height:1.3}
.menu button .ic{display:block;font-size:34px}
.menu button small{display:block;color:var(--sub);font-size:14px}
.legal{text-align:center;font-size:13px;margin:10px 0 0;opacity:.8}.legal a{color:inherit}
.foot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.foot button{background:rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:8px 14px;font-size:14px}

/* 생물 그림 */
.pic{position:relative;aspect-ratio:200/140;width:100%}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;opacity:0;transition:opacity .4s}
.pic img.on{opacity:1}
.sil svg{filter:brightness(0) opacity(.5)}

/* 전체 화면 */
.screen{position:fixed;inset:0;z-index:50;overflow-y:auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(4,16,40,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.screen .inner{max-width:720px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px}
.qtop .x{background:rgba(255,255,255,.2);color:#fff;border-radius:12px;width:44px;height:44px;font-size:22px;flex:none}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.25)}
.dots i.o{background:#4be39a}.dots i.w{background:#ff7b7b}.dots i.c{background:#ffd166}
.qcount{font-size:18px;min-width:52px;text-align:right}
.qcard{position:relative;background:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.qtext{font-size:25px;line-height:1.45;margin-bottom:10px;word-break:keep-all}
.qtext .bignum{display:block;text-align:center;font-size:44px;color:#1d4f91;margin:6px 0;letter-spacing:1px}
.qsvg{text-align:center;margin:6px 0 10px}
.qsvg svg{max-width:100%;height:auto}
.disp{font-size:42px;text-align:center;border:3px solid #cfe0f3;border-radius:16px;padding:8px;min-height:72px;margin-bottom:10px;color:#1d4f91;background:#f6faff;letter-spacing:2px}
.disp.empty{color:#b6c4d6}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{font-size:30px;padding:14px 0;border-radius:16px;background:#eaf2fc;box-shadow:0 4px 0 #c4d4e8;color:var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #c4d4e8}
.pad .ok{grid-column:4;grid-row:2/span 3;background:linear-gradient(180deg,#46d18c,#1fae68);color:#fff;box-shadow:0 4px 0 #148250;font-size:26px}
.pad .del{background:#ffe6e6;box-shadow:0 4px 0 #f0bcbc}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{font-size:24px;padding:16px 8px;border-radius:16px;background:#eaf2fc;box-shadow:0 4px 0 #c4d4e8;line-height:1.3;word-break:keep-all}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choices.three button{font-size:44px;padding:10px 0}
.choices button:active{transform:translateY(3px);box-shadow:0 1px 0 #c4d4e8}
.fb{position:absolute;inset:0;border-radius:24px;background:rgba(255,255,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;animation:pop .25s ease}
.fb .mark{font-size:84px;line-height:1}
.fb h3{margin:8px 0;font-size:30px;font-weight:400}
.fb p{margin:6px 0;font-size:20px;color:var(--sub);word-break:keep-all;line-height:1.5}
.fb .ans{font-size:34px;color:var(--ok)}
.fb button{margin-top:14px;padding:14px 34px;border-radius:16px;font-size:24px;background:#1d6fd1;color:#fff;box-shadow:0 4px 0 #13509a}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.8em;margin:0 2px}
.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:2px solid currentColor}

.bossbar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:18px;padding:8px;margin-bottom:10px;color:#fff}
.bossbar .pic{width:120px;flex:none}
.bossbar .bn{font-size:20px}
.hp{font-size:22px;letter-spacing:1px}
.hit{animation:hit .45s}
@keyframes hit{25%{transform:translateX(-8px) rotate(-4deg);filter:brightness(2)}75%{transform:translateX(8px) rotate(4deg)}}
.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 🤿 바닷속 로비: 왼쪽 조이스틱으로 헤엄치고 ⬆ 로 위로 솟구쳐요 */
.lobby{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,20,60,.3)}
.lobby canvas{display:block;width:100%;height:260px;touch-action:none}
.lobby .lb-tag{position:absolute;left:10px;top:10px;background:rgba(0,20,50,.55);color:#fff;border-radius:10px;padding:5px 10px;font-size:15px}
.lb-ctl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:10px;align-items:flex-end;pointer-events:none}
.lb-joy{pointer-events:auto;position:relative;width:104px;height:104px;border-radius:50%;background:rgba(0,20,50,.3);border:3px solid rgba(255,255,255,.75);touch-action:none;flex:none}
.lb-joy.act{background:rgba(0,20,50,.45)}
.lb-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.lb-b{pointer-events:auto;width:70px;height:70px;border-radius:50%;background:rgba(0,20,50,.3);border:3px solid rgba(255,255,255,.8);touch-action:none;display:flex;align-items:center;justify-content:center;padding:0}
.lb-b svg{width:34px;height:34px}.lb-b.on{background:rgba(255,255,255,.45);transform:scale(.93)}
/* 🛒 상점 */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.sh{background:#f3f5f9;border-radius:14px;padding:8px;text-align:center;font-size:15px}
.sh canvas{width:80px;height:92px;display:block;margin:0 auto}
.sh .pr{color:#b07800;font-size:15px;margin:2px 0 6px}
.sh button{width:100%;padding:7px 4px;border-radius:10px;font-size:15px;background:#1d6fd1;color:#fff}
.sh.wear{background:#d6f7e6;outline:3px solid #00b06f}
.sh.wear button{background:#00b06f}
.sh button.buy{background:#ffb000;color:#3a2500}
.sh button[disabled]{background:#c9cfd9;color:#fff}
/* 모달 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(2,10,28,.7);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.sheet{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:760px;margin:auto 0;box-shadow:0 10px 40px rgba(0,0,0,.4);position:relative}
.sheet h2{margin:0 0 10px;font-size:26px;font-weight:400;padding-right:44px}
.close{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:12px;background:#eef3f9;font-size:22px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.dexc{background:#f2f7fd;border-radius:16px;padding:8px;text-align:center;font-size:16px}
.dexc.got{background:linear-gradient(180deg,#e9f6ff,#d6ecff)}
.dexc .nm{margin-top:4px}.dexc .dp{font-size:13px;color:var(--sub)}
.zh{margin:16px 0 8px;font-size:19px;color:#1d5a99}
.zh small{color:var(--sub);font-size:14px}
.creature{text-align:center}
.creature .pic{max-width:420px;margin:0 auto;background:radial-gradient(circle,#e3f3ff,#cfe6fb);border-radius:18px}
.creature h3{font-size:34px;margin:10px 0 4px;font-weight:400}
.creature .badge{display:inline-block;background:#1d4f91;color:#fff;border-radius:999px;padding:4px 14px;font-size:16px}
.creature .credit{font-size:12px;color:var(--sub);margin:8px 0 0;word-break:break-all}.creature .credit a{color:inherit}
.creature ul{text-align:left;font-size:20px;line-height:1.55;padding-left:22px;margin:14px 0 4px;word-break:keep-all}
.flip{animation:flip .7s ease}

/* ════════ 소리 (게임 효과음 + 배경 음악, 파일 없이 직접 만들어요) ════════

function setMusic(name,key=0){
  SND.want=name; SND.key=key;
  if(!SND.ctx||SND.ctx.state!=='running') return;
  if(SND.track===name&&SND.curKey===key) return;
  clearInterval(SND.timer); SND.track=name; SND.curKey=key; if(!name) return;
  const tr=TRACKS[name]; SND.step=0; SND.next=SND.ctx.currentTime+.08;

}

    c.save(); c.globalAlpha=Math.max(0,.18-f*.2); c.fillStyle='#fff'; for(let i=0;i<4;i++){ const x=((i*.3+sec*.01)%1.2-.1)*w; c.beginPath(); c.moveTo(x,0); c.lineTo(x+40,0); c.lineTo(x-30,h); c.lineTo(x-80,h); c.fill(); } c.restore();

  const m=MISSIONS[i]; if(!m||!m.ready) return;
  if(isSheet(m)) return startSheet(m,!!replay);

  Q={mode:m.boss?'boss':'mission',m,list:makeQs(m),i:0,c:0,res:[],replay:!!replay,hp:7*QX(),hpMax:7*QX(),buf:''};
  setMusic(m.boss?'boss':'quiz'); sStart();
  drawQuiz();
}
function startVortex(){

  Q={mode:'vortex',list:shuffle(S.wrong).slice(0,10),i:0,c:0,res:[],buf:''};

}

let W=null, draftT=null;

const intLen=(v,dp)=>String(Math.floor(v/P10[dp])).length;

const keypadHTML=()=>`<div class="kp hide" id="kp"><div class="now" id="kpNow"></div>${[1,2,3,4,5,6,7,8,9,0].map(k=>`<button class="k${k}" onclick="sheetKey('${k}')">${k}</button>`).join('')}<button class="kdot" onclick="sheetKey('.')">.</button><button class="del" onclick="sheetKey('del')">⌫</button><button class="nx" onclick="sheetKey('next')">✔ 제출</button><button class="cl" onclick="sheetKey('close')">닫기</button></div>`;

/* 숫자판 맨 위: '7번 ▸ 2.45' (숫자판에 칸이 가려도 무엇을 쓰는지 보여요) */

function sheetKey(k){

/* ✔ 제출: 이 칸은 끝 → 아직 빈 답칸으로. 빈 칸이 없으면 숫자판을 닫고 채점하기 단추로 */

/* ════════ 개념 학습지 (1주차): 문제 15개를 한 장에, 숫자는 키패드 · 고르는 문제는 눌러서 ════════ */
function genCQ(m){
  const gens=G[m.gen], per=Math.ceil(CQN()/gens.length), out=[], seen=new Set();
  /* 문제집처럼 같은 종류끼리 모아서 (종류 순서대로) */
  gens.forEach((f,gi)=>{ let made=0, g=0; while(made<per&&g++<40){ const q=f(); const k=q.q+q.svg; if(seen.has(k)) continue; seen.add(k); q.g=gi; out.push(q); made++; } });
  /* 어떤 종류는 만들 수 있는 문제가 적어요 → 다른 종류로 채우고, 종류 순서대로 다시 모아요 */
  for(let g=0;out.length<CQN()&&g<400;g++){ const gi=g%gens.length, q=gens[gi](), k=q.q+q.svg; if(seen.has(k)) continue; seen.add(k); q.g=gi; out.push(q); }
  out.sort((a,b)=>a.g-b.g);
  /* 많으면 종류마다 고르게 덜어 내요 */
  while(out.length>CQN()){ const cnt={}; out.forEach(q=>cnt[q.g]=(cnt[q.g]||0)+1); const most=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]; const k=out.map(q=>q.g).lastIndexOf(most); out.splice(k,1); }
  return out;
}

  else W={mid:m.id,mi:m.i,replay,step:0,c:0,n:0,sheets:[{kind:'q',probs:genCQ(m),vals:{},res:{},graded:false,fix:false,fixedOnce:false,open:{}}]};

async function sendMom(){
  const mom=getMom(), body=momText(), phone=(mom.phone||'').replace(/[^\d+]/g,'');
  if(phone){ const ios=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document; location.href=`sms:${phone}${ios?'&':'?'}body=${encodeURIComponent(body)}`; return; }
  if(navigator.share){ try{ await navigator.share({text:body}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(body); toast('내용을 복사했어요. 문자에 붙여 넣어 보내요'); }catch(e){ toast('엄마 전화번호를 관리자 모드에서 먼저 정해 주세요'); }
}
function openDex(){
  let h=`<h2>📖 바다 생물 도감 <small style="color:var(--sub);font-size:18px">${S.dex.length} / ${CRE.length}</small></h2>`;
  ZONES.forEach(z=>{
    const list=CRE.map((c,i)=>({c,m:MISSIONS[i]})).filter(x=>x.m.z===z.n);
    const got=list.filter(x=>S.dex.includes(x.c.id)).length;
    h+=`<div class="zh">${z.n}구역 ${z.name} <small>${z.range} · ${got}/${list.length}</small></div><div class="dexgrid">`;
    list.forEach(({c})=>{ const has=S.dex.includes(c.id); h+=`<button class="dexc ${has?'got':''}" onclick="dexOne('${c.id}')">${picHTML(c,!has)}<div class="nm">${has?c.n:'???'}</div><div class="dp">${c.d.toLocaleString()}m${c.boss?' · 보스':''}</div></button>`; });
    h+=`</div>`;
  });
  modal(h);
}
function dexOne(id){
  const c=CRE.find(x=>x.id===id), has=S.dex.includes(id);
  if(has) modal(`${creatureHTML(c)}<button class="btn gray wide" style="margin-top:12px" onclick="openDex()">◀ 도감으로</button>`);
  else modal(`<div class="creature"><div class="pic sil" style="max-width:360px;margin:0 auto">${creSVG(c)}</div><h3>???</h3><p style="font-size:20px">아직 못 만났어요.<br><b>${c.d.toLocaleString()}m</b> 근처까지 내려가면 만날 수 있어요!</p></div><button class="btn gray wide" onclick="openDex()">◀ 도감으로</button>`);
}

/* ════════ 엄마 모드 (비밀번호는 엄마 모드 안에서 바꿀 수 있어요. 처음은 0000) ════════ */
let PIN='', SETTINGS=null;
async function openAdmin(){
  PIN=''; drawPin('설정을 불러오는 중…');
  try{ if(await timeout(cloudInit(),6000)){
    /* 이 기기에 관리자 구글 로그인이 남아 있으면 비밀번호 없이 바로 */
    const u=await timeout(new Promise(res=>{ const off=firebase.auth().onAuthStateChanged(x=>{ off(); res(x); }); }),4000).catch(()=>null);
    if(u&&await isAdminUser(u)){ ADMIN_G=true; return drawAdmin(); }
    const s=await timeout(cloud.db.collection('e4').doc('settings').get(),6000); SETTINGS=s.exists?s.data():{};
  } }catch(e){ SETTINGS=null; }
  drawPin();
}
/* 🔐 관리자: 공부방(새싹 · 자성동이)과 같은 관리자 구글 계정 */
const ADMIN_EMAIL_SHA256='22fa372a479af0929cadcbf6b12b6c2dace34800344067ef44b21a0c187487fb';
let ADMIN_G=false;
async function sha256Hex(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const isAdminUser=async u=>{ const em=((u&&u.email)||'').trim().toLowerCase(); return !!em&&await sha256Hex(em)===ADMIN_EMAIL_SHA256; };
async function adminGoogle(){
  const msg=t=>{ const m=$('pinmsg'); if(m) m.innerHTML=t; else if(t) toast(t.replace(/<[^>]+>/g,'')); };
  if(!cloud.ok||!window.firebase||!firebase.auth){ msg('로그인을 준비하고 있어요…'); const ok=await cloudInit(); msg(ok?'준비됐어요! 한 번 더 눌러 주세요':'인터넷 연결을 확인해 주세요'); return; }
  const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
  try{
    const r=await firebase.auth().signInWithPopup(p);
    if(await isAdminUser(r.user)){ ADMIN_G=true; drawAdmin(); }
    else { await firebase.auth().signOut(); msg('관리자 계정이 아니에요 ('+(r.user.email||'')+')'); }
  }catch(e){
    if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request') return msg('');
    if(window.top!==window&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')) return msg('이 창 안에서는 로그인 창을 열 수 없어요. 위의 <b>[새 창으로]</b>를 눌러 주세요');
    msg(({'auth/popup-blocked':'팝업이 막혔어요. 팝업을 허용해 주세요','auth/unauthorized-domain':'이 주소가 Firebase 승인된 도메인에 없어요','auth/network-request-failed':'인터넷 연결을 확인해 주세요'})[e.code]||('로그인하지 못했어요'+(e.code?' ('+e.code+')':'')));
  }
}
/* 하단 🔐 관리자: 이미 관리자로 로그인돼 있으면 바로, 아니면 구글 로그인 창 (누른 순간 열어야 팝업이 안 막혀요) */
function adminOpen(){
  const u=cloud.ok&&window.firebase&&firebase.auth&&firebase.auth().currentUser;
  if(u) return isAdminUser(u).then(y=>{ if(y){ ADMIN_G=true; drawAdmin(); } else adminGoogle(); });
  adminGoogle();
}
async function adminSignOut(){ try{ await firebase.auth().signOut(); }catch(e){} ADMIN_G=false; closeModal(); render(); toast('관리자에서 나왔어요'); }
const usingDefaultPin=()=>!S.pinH&&!(SETTINGS&&(SETTINGS.momH||SETTINGS.pinH));
function drawPin(msg){
  modal(`<h2>🔒 엄마 모드</h2><p style="text-align:center;color:var(--sub);font-size:17px">${msg||'엄마 비밀번호 4자리를 눌러 주세요'}${usingDefaultPin()?'<br><small>처음 비밀번호는 0000 이에요. 들어가서 꼭 바꿔 주세요.</small>':''}</p><div class="pinrow">${[0,1,2,3].map(i=>`<i class="${i<PIN.length?'on':''}"></i>`).join('')}</div><div class="pinpad" id="pinpad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('')}<button onclick="pinKey('del')">⌫</button><button onclick="pinKey('0')">0</button><button onclick="closeModal()" style="font-size:18px">닫기</button></div>
    <button class="btn gray wide" style="margin-top:14px;font-size:18px" onclick="adminGoogle()">🔐 관리자 (구글 로그인)</button><p id="pinmsg" style="text-align:center;color:var(--sub);font-size:15px;min-height:20px;margin:8px 0 0"></p>`);
}
function pinKey(k){
  if(k==='del') PIN=PIN.slice(0,-1); else if(PIN.length<4) PIN+=k;
  if(PIN.length<4) return drawPin();
  /* 이 앱에서 정한 비밀번호가 있으면 그것만, 없으면 공부방(e4/settings)의 엄마·관리자 비밀번호, 그것도 없으면 0000 */
  const st=SETTINGS||{};
  const ok=S.pinH ? hashPin(PIN,'atlan')===S.pinH
    : (st.momH&&hashPin(PIN,'mom')===st.momH)||hashPin(PIN,'admin')===(st.pinH||hashPin('0000','admin'));
  if(ok){ PIN=''; drawAdmin(); } else { PIN=''; sNO(); drawPin('비밀번호가 틀렸어요. 다시 눌러 주세요'); const p=$('pinpad'); if(p) p.classList.add('shake'); }
}

function setPerDay(n){ S.perDay=n; save(); render(); drawAdmin(); toast(`하루 미션 ${n}개로 바꿨어요`); }
function setStart(){
  const v=$('startD').value; if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ toast('날짜를 골라 주세요'); return; }
  S.start=v; save(); render(); drawAdmin(); toast('시작한 날을 바꿨어요 📅');
}
function moveMission(d){ setMission(Math.max(0,Math.min(MISSIONS.length,S.mission+d))); }
function setMission(n){
  const grant=$('grant')?$('grant').checked:true;
  if(n>S.mission&&grant) for(let i=S.mission;i<n;i++){ const id=CRE[i].id; if(!S.dex.includes(id)) S.dex.push(id); }
  S.mission=n; save(); render(); drawAdmin(); toast('미션을 옮겼어요');
}

/* ════════ 시작 ════════ */
(function bubbles(){ let h=''; for(let i=0;i<14;i++){ const s=rnd(8,26); h+=`<span style="left:${rnd(0,100)}%;width:${s}px;height:${s}px;animation-duration:${rnd(9,20)}s;animation-delay:-${rnd(0,20)}s"></span>`; } $('bubbles').innerHTML=h; })();
render(); soundBtn();
cloudLoad();
/* 주소 끝이 #admin (또는 ?admin)이면 관리자 로그인부터: moontr.site 관리자 허브에서 바로 열어요 */
if(/^#admin$/.test(location.hash)||/[?&]admin\b/.test(location.search)) openAdmin();
</script>
