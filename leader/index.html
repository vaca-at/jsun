<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>도진이의 수학 연산 대모험</title>
<meta name="theme-color" content="#1b1f2a">
<meta name="description" content="도진 탐험대장의 수학 연산 모험! 사막 · 정글 · 산 · 바다 · 섬 · 빙하를 지나며 매일 미션 2개(60문제) 덧셈을 풀어요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="도진이의 수학 연산 대모험">
<meta property="og:title" content="도진이의 수학 연산 대모험">
<meta property="og:description" content="사막을 건너고 정글을 지나 빙하까지! 하루 60문제, 미션마다 탐험 아이템 🎒">
<meta property="og:image" content="https://jsun.site/leader/og.png?v=20261016">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://jsun.site/leader/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jsun.site/leader/og.png?v=20261016">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--sub:#667085;--ok:#00b06f;--bad:#e5484d;--gold:#ffd84d;--bg1:#ffe9b0;--bg2:#f4c46a;--dark:#1b1f2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
/* 아이패드 · 아이폰: 버튼을 빠르게 두 번 누르면 화면이 확대되던 것 막기 (두 번 탭 확대 끔) */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,.kp2,.qcard{touch-action:manipulation}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;background-color:var(--bg2);min-height:100vh;font-size:19px;-webkit-user-select:none;user-select:none;overflow-x:hidden;transition:background .8s}
body.lock{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--dark);color:#fff}
header h1{flex:1;margin:0;font-size:18px;font-weight:400;text-align:center;line-height:1.2}
.hbtn{background:rgba(255,255,255,.14);border-radius:10px;padding:7px 10px;font-size:14px;color:#fff;text-decoration:none;white-space:nowrap}
.hbtn.dia{display:inline-flex;align-items:center;gap:6px}
.hbtn.dia img{width:20px;height:20px;border-radius:5px;display:block}
.sync{font-size:14px;min-width:22px;text-align:center}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 40px}

/* 엄마의 한마디 (초록 띠) */
.mommsg{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,#2fbf71,#1f9e5c);color:#fff;border-radius:16px;padding:12px 16px;margin-bottom:12px;box-shadow:0 6px 16px rgba(20,90,50,.25)}
.mbtn{margin-top:8px;background:rgba(255,255,255,.22);color:#fff;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:5px 14px;font-size:15px;font-family:inherit;cursor:pointer}
.mbox{background:#effaf3;border-left:5px solid #2fbf71;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.mbox .mb-d{font-size:14px;color:#1f9e5c}.mbox p{margin:4px 0 0;font-size:19px;line-height:1.45;white-space:pre-wrap;word-break:keep-all}
.mhist{margin-top:10px;max-height:260px;overflow-y:auto}.mhist .mbox{display:flex;gap:8px;align-items:flex-start}.mhist .mbox>div{flex:1;min-width:0}.mhist .mbox p{font-size:16px}
.mhist .mbox button{border:0;background:#fff;border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer;flex:none}
.mommsg .mm-ic{font-size:26px;line-height:1.2}
.mommsg b{font-size:15px;opacity:.9;font-weight:400}
.mommsg p{margin:2px 0 0;font-size:20px;line-height:1.45;white-space:pre-wrap;word-break:keep-all}

.card{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(60,40,0,.16)}
/* 오늘 상자 */
.tb-top{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;flex-wrap:wrap}
.tb-date{font-size:20px;color:#7a4a00;white-space:nowrap}
.tb-goal{font-size:15px;background:#fff3c4;color:#8a5a00;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tb-goal.done{background:#d6f7e6;color:#0b7a4b}
.tb-num{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}
.tb-num b{font-size:46px;font-weight:400;color:#e86a10;line-height:1}
.tb-num span{font-size:18px;color:var(--sub)}
.bar{height:16px;background:#f0e6d2;border-radius:10px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb83d,#ff8a1f);border-radius:10px;transition:width .6s}
.bar.green i{background:linear-gradient(90deg,#3ddc84,#00b06f)}
.bar em{position:absolute;top:0;bottom:0;width:3px;background:rgba(0,0,0,.25);font-style:normal}
.tb-stat{font-size:15px;color:var(--sub);margin-top:6px;line-height:1.5}
.tb-send{margin-top:10px;width:100%;font-size:18px;padding:10px;border-radius:12px;background:linear-gradient(180deg,#46d18c,#1fae68);color:#fff;box-shadow:0 4px 0 #168a52}

/* 로블록스 HUD 칩 */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(27,31,42,.86);color:#fff;border-radius:10px;padding:6px 10px;font-size:16px}
.chip b{font-weight:400;color:#7dffb0}
.chip.y b{color:var(--gold)}

/* 로비 */
.lobby{position:relative;border-radius:18px;overflow:hidden;background:#000;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.lobby canvas{display:block;width:100%;height:260px}
.lobby .lb-tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:5px 10px;font-size:15px}
.lobby canvas{touch-action:none}
.lb-ctl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:10px;align-items:flex-end;pointer-events:none}
.lb-b{pointer-events:auto;width:60px;height:60px;border-radius:50%;background:rgba(30,30,30,.35);border:3px solid rgba(255,255,255,.8);color:#fff;font-size:24px;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0;-webkit-touch-callout:none}
.lb-b.jump{width:70px;height:70px}.lb-b svg{width:34px;height:34px}
.lb-joy{pointer-events:auto;position:relative;width:104px;height:104px;border-radius:50%;background:rgba(30,30,30,.28);border:3px solid rgba(255,255,255,.75);touch-action:none;flex:none}
.lb-joy.act{background:rgba(30,30,30,.4)}
.lb-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.lb-b.on{background:rgba(255,255,255,.5);transform:scale(.93)}
.lb-prog{font-size:15px;color:var(--sub);margin:0 2px 8px}
.lb-prog .bar{height:10px;margin-top:4px}
.next{font-size:17px;line-height:1.45;margin:2px 0 10px;word-break:keep-all}
.next small{color:var(--sub);font-size:15px}
.next .ex{display:inline-block;background:#f2f4f8;border-radius:8px;padding:1px 8px;margin-left:4px;color:#1d4f91}
.bossnext{color:#8b2bd8}
.play small{display:block;font-size:16px;opacity:.92;margin-top:4px}
.howto{margin:6px 2px 8px;padding:10px 12px;border-radius:12px;background:#eafaf1;border:2px dashed #2fbf71;color:#1f6b46;font-size:16px;line-height:1.5;word-break:keep-all}
.howto b{color:#0b8a55}
.play{display:block;width:100%;font-size:26px;padding:15px;border-radius:14px;background:linear-gradient(180deg,#14c97f,#00a564);color:#fff;box-shadow:0 5px 0 #007a4a;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #007a4a}
.play.boss{background:linear-gradient(180deg,#a274ff,#7442f0);box-shadow:0 5px 0 #4d22b8}

/* 동그란 아이콘 버튼 (로블록스 오른쪽 버튼처럼) */
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin:4px 0 14px}
.ib{background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:var(--ink);padding:0}
.ib .c{width:58px;height:58px;border-radius:50%;background:var(--gold);border:3px solid var(--dark);display:flex;align-items:center;justify-content:center;font-size:27px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.ib.p .c{background:#b48cff}.ib.b .c{background:#7cc7ff}.ib.g .c{background:#7be39b}
.ib:active .c{transform:translateY(2px);box-shadow:none}
.ib .bd{position:absolute;top:-6px;right:-8px;background:var(--bad);color:#fff;border-radius:999px;font-size:12px;min-width:22px;height:22px;line-height:22px;padding:0 5px;border:2px solid #fff}

/* 여행 지도 */
.journey svg{display:block;width:100%;height:auto}
.journey h3{margin:0 0 6px;font-size:19px;font-weight:400}
.legal{text-align:center;font-size:13px;margin:10px 0 0;opacity:.8}.legal a{color:inherit}
.foot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.foot button{background:rgba(27,31,42,.75);color:#fff;border-radius:10px;padding:8px 14px;font-size:14px}

/* 전체 화면 */
.screen{position:fixed;inset:0;z-index:50;display:none}
.screen.on{display:block}

/* 이동 맵 */
#game{background:#000;touch-action:none;overflow:hidden}
#gc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.g-top{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:10px;padding-top:max(10px,env(safe-area-inset-top));pointer-events:none}
.g-top>*{pointer-events:auto}
.g-x{width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.5);color:#fff;font-size:22px;flex:none}
.g-chip{background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:6px 10px;font-size:16px;white-space:nowrap}
.g-chip b{font-weight:400;color:var(--gold)}
.g-mode{font-family:inherit;border:2px solid rgba(255,255,255,.55);cursor:pointer}
.g-mode.hard{background:rgba(200,40,40,.8);border-color:#ffb3a1}
.g-title{flex:1;min-width:0;text-align:right;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.7);font-size:15px;line-height:1.25}
#gmini{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));opacity:.9;pointer-events:none;border-radius:8px;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.g-hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 64px);background:rgba(0,0,0,.65);color:#fff;border-radius:14px;padding:10px 14px;font-size:16px;text-align:center;width:min(92%,460px);transition:opacity .6s;pointer-events:none;line-height:1.45;word-break:keep-all}
.g-pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);color:#fff;font-size:34px;text-shadow:0 3px 0 #000,0 0 12px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;animation:popup 1.1s ease forwards}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
.joyzone{position:absolute;left:0;bottom:0;width:58%;height:62%;touch-action:none}
.joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.55);opacity:.75;pointer-events:none}
.joy.act{opacity:1}
.knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.jumpbtn{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));width:100px;height:100px;border-radius:50%;background:rgba(40,40,40,.35);border:4px solid rgba(255,255,255,.75);touch-action:none;display:flex;align-items:center;justify-content:center;padding:0}
.jumpbtn svg{width:50px;height:50px}
.jumpbtn.on{background:rgba(255,255,255,.45);transform:scale(.93)}
.keyhelp{position:absolute;right:14px;top:calc(max(10px,env(safe-area-inset-top)) + 56px);color:#fff;font-size:13px;opacity:.8;text-shadow:0 1px 2px #000;text-align:right}

/* 문제 풀기 */
#quiz{background:linear-gradient(180deg,#273048,#151a26);color:#fff;overflow-y:auto}
.qz{max-width:560px;margin:0 auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));min-height:100%;display:flex;flex-direction:column}
.qtop{display:flex;align-items:center;gap:10px}
.qtop .x{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;flex:none}
.qbar{flex:1;height:16px;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#14c97f,#7dffb0);transition:width .3s}
.qcnt{font-size:18px;min-width:64px;text-align:right}
.qinfo{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:15px;color:#c8d2e6;gap:8px}
.combo{color:#ffcf4d;font-size:17px;white-space:nowrap}
.bossbox{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 12px;margin-top:10px}
.bossbox .be{font-size:50px;line-height:1}
.bossbox .bn{font-size:17px;margin-bottom:4px}
.hpbar{height:14px;background:#4a1d27;border-radius:8px;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ff9a5a);transition:width .3s}
.hit{animation:hit .4s}
@keyframes hit{25%{transform:translateX(-8px) rotate(-6deg);filter:brightness(2)}75%{transform:translateX(8px) rotate(6deg)}}
.qcard{background:#fff;color:var(--ink);border-radius:20px;padding:22px 12px 16px;margin-top:12px;text-align:center;position:relative;transition:box-shadow .15s}
.qexpr{font-size:42px;line-height:1.3;word-break:keep-all;white-space:nowrap}
.qexpr.w{font-size:26px;white-space:normal;line-height:1.45}
.qword{margin-bottom:10px}
.qexpr.w .qans{font-size:40px;min-width:140px}
.qans{display:inline-block;min-width:100px;border:3px solid #cdd6e4;border-radius:14px;padding:0 12px;color:#1d6fd1;background:#f5f9ff;vertical-align:middle;line-height:1.25}
.qans.ph{color:#b9c3d3}
.qcard.ok{box-shadow:0 0 0 6px #14c97f}.qcard.bad{box-shadow:0 0 0 6px #e5484d}
.qcard.ok .qans{border-color:#14c97f;color:#0b8a55;background:#e9fbf2}
.qcard.bad .qans{border-color:#e5484d;color:#c62f34;background:#fff0f0;text-decoration:line-through}
.qfb{min-height:30px;font-size:21px;margin-top:10px;color:var(--sub)}
.qfb b{color:#0b8a55;font-weight:400;font-size:26px}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.coinfly{position:absolute;right:16px;top:10px;color:#e3a400;font-size:22px;animation:cf .7s ease forwards;pointer-events:none}
@keyframes cf{to{transform:translateY(-30px);opacity:0}}
.kp2{display:grid;grid-template-columns:repeat(4,1fr);grid-template-areas:"k7 k8 k9 del" "k4 k5 k6 cl" "k1 k2 k3 ok" "k0 k0 k0 ok";gap:8px;margin-top:auto;padding-top:14px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.kp2 button{height:62px;border-radius:14px;font-size:32px;background:#3a4560;color:#fff;box-shadow:0 4px 0 #222a3b}
.kp2 button:active{transform:translateY(3px);box-shadow:0 1px 0 #222a3b}
.kp2 .del{grid-area:del;background:#6b3a48;font-size:26px}.kp2 .cl{grid-area:cl;background:#4c5672;font-size:18px}
.kp2 .ok{grid-area:ok;height:auto;background:linear-gradient(180deg,#14c97f,#00a564);box-shadow:0 4px 0 #007a4a;font-size:24px}
.kp2 .k0{grid-area:k0}.kp2 .k1{grid-area:k1}.kp2 .k2{grid-area:k2}.kp2 .k3{grid-area:k3}.kp2 .k4{grid-area:k4}.kp2 .k5{grid-area:k5}.kp2 .k6{grid-area:k6}.kp2 .k7{grid-area:k7}.kp2 .k8{grid-area:k8}.kp2 .k9{grid-area:k9}
@media(min-width:600px){.qexpr{font-size:54px}.kp2 button{height:68px}}
/* 아이패드처럼 큰 화면: 문제와 키패드를 가운데로 모으고 크게 (세로 화면에서 가운데가 텅 비던 것) */
@media(min-width:700px) and (min-height:700px){
  .qz{max-width:720px;justify-content:center;padding-left:20px;padding-right:20px}
  .qcard{padding:34px 16px 22px;margin-top:18px}
  .qexpr{font-size:66px}.qexpr.w{font-size:32px}.qexpr.w .qans{font-size:48px}
  .qans{min-width:130px}
  .qfb{font-size:24px}
  .kp2{margin-top:28px;gap:12px}
  .kp2 button{height:86px;font-size:40px;border-radius:18px}
  .kp2 .del{font-size:32px}.kp2 .cl{font-size:22px}.kp2 .ok{font-size:30px}
}
/* 가로로 눕힌 아이패드(높이가 낮을 때): 보스 체력 줄까지 한 화면에 들어오게 키패드를 조금 낮게 */
@media(min-width:700px) and (min-height:700px) and (max-height:900px){ .kp2 button{height:74px} .qcard{padding:26px 16px 18px} }

/* 결과 · 체크포인트 화면 */
.res{text-align:center;padding-top:10px}
.res h2{font-size:34px;font-weight:400;margin:8px 0}
.res .sub{color:#c8d2e6;font-size:17px;margin:4px 0;line-height:1.5;word-break:keep-all}
.stars{font-size:52px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;animation:pop .4s ease backwards}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
.stars .off{filter:grayscale(1) opacity(.3)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.prize{background:#fff;color:var(--ink);border-radius:20px;padding:16px;margin:14px auto 0;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.prize .new{display:inline-block;background:#ff5d8f;color:#fff;border-radius:10px;padding:2px 12px;font-size:16px}
.prize .em{font-size:84px;line-height:1.1;margin:6px 0}
.prize h3{font-size:28px;font-weight:400;margin:4px 0}
.prize p{margin:4px 0;color:var(--sub);font-size:17px;word-break:keep-all}
.prize.pet{background:linear-gradient(180deg,#fff7d6,#ffe9a0)}
.flip{animation:flip .7s ease backwards}
@keyframes flip{from{transform:perspective(800px) rotateY(90deg) scale(.8);opacity:0}}
.rbtns{display:flex;gap:10px;margin-top:18px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.rbtns button{flex:1;padding:15px 8px;border-radius:14px;font-size:20px;background:#3a4560;color:#fff;box-shadow:0 4px 0 #222a3b}
.rbtns .go{background:linear-gradient(180deg,#14c97f,#00a564);box-shadow:0 4px 0 #007a4a}
.goalbar{background:rgba(255,216,77,.16);border:2px solid rgba(255,216,77,.5);border-radius:14px;padding:10px;margin-top:14px;font-size:18px;color:#ffe9a6;line-height:1.45;word-break:keep-all}
.cpbig{font-size:80px;line-height:1;margin-top:20px}
.exbox{background:rgba(255,255,255,.1);border-radius:14px;padding:10px;margin:12px auto 0;max-width:360px;font-size:24px}

  if(/[0-9]/.test(ch)) bat='013678'.includes(ch); else { const c=ch.charCodeAt(0); bat=c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0; }

/* ════════ 소리 (게임 효과음 + 배경 음악, 파일 없이 직접 만들어요) ════════
   🔊 음악+효과음 · 🔉 효과음만 · 🔇 끄기 (위쪽 버튼, 이 기기에 기억) */

try{ SND.mode=localStorage.getItem('leader-sound')||'all'; }catch(e){}
function audio(){
  if(SND.ctx){ if(SND.ctx.state==='suspended') SND.ctx.resume(); return SND.ctx; }
  try{ const C=new (window.AudioContext||window.webkitAudioContext)(); SND.ctx=C;
    SND.master=C.createGain(); SND.master.connect(C.destination);
    SND.sfx=C.createGain(); SND.sfx.gain.value=.9; SND.sfx.connect(SND.master);
    SND.mus=C.createGain(); SND.mus.connect(SND.master);

function applySound(){ if(!SND.ctx) return; SND.master.gain.value=SND.mode==='off'?0:1; SND.mus.gain.value=SND.mode==='all'?.55:0; }
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,d,type='square',t0=0,v=.1,f2,out){
  const C=audio(); if(!C||SND.mode==='off') return;
  try{ const t=C.currentTime+t0, o=C.createOscillator(), g=C.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.006); g.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(g).connect(out||SND.sfx); o.start(t); o.stop(t+d+.03); }catch(e){}
}
function noise(d,t0=0,v=.12,fq=1500,type='bandpass',out){
  const C=audio(); if(!C||!SND.noise||SND.mode==='off') return;

    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0008,t+d); s.connect(f).connect(g).connect(out||SND.sfx); s.start(t,Math.random()*.3); s.stop(t+d+.02); }catch(e){}
}
const arp=(notes,gap,d=.14,type='square',v=.08)=>notes.forEach((m,i)=>tone(mtof(m),d,type,i*gap,v));

/* 배경 음악: 16분음표 칸마다 [멜로디, 베이스], 드럼은 박자마다 */
const TRACKS={
  home:{bpm:116,mel:[72,0,76,0,79,0,76,79, 77,0,81,0,79,77,76,0, 74,0,77,0,81,0,79,77, 76,74,72,74,76,0,72,0],bass:[48,53,55,48],drum:1,mv:.035},

function playStep(tr,s,t,key){
  const C=SND.ctx, out=SND.mus, nt=(m,d,type,v)=>{ const o=C.createOscillator(),g=C.createGain(); o.type=type; o.frequency.value=mtof(m+key); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0008,t+d); o.connect(g).connect(out); o.start(t); o.stop(t+d+.02); };

  if(tr.chords){ const ch=tr.chords[Math.floor(s/8)%4]; nt(ch[[0,1,2,3,2,1,2,1][s%8]]+12,sp*1.8,'triangle',tr.mv); if(s%8===0) nt(ch[0]-12,sp*7,'triangle',tr.mv*1.6); return; }

    if(s%8===0){ const o=C.createOscillator(),g=C.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+.12); g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.14); o.connect(g).connect(out); o.start(t); o.stop(t+.16); }

    if(tr.drum>1&&s%2===1) nz(.03,.025,7000,'highpass'); }

/* 장면에 맞는 음악: 'home' · 'map' · 'quiz' · 'boss' · null(끄기) */
function setMusic(name,key=0){
  SND.want=name; SND.key=key;
  if(!SND.ctx||SND.ctx.state!=='running') return;
  if(SND.track===name&&SND.curKey===key) return;
  clearInterval(SND.timer); SND.track=name; SND.curKey=key; if(!name) return;

/* 자리마다 받아올림이 있는지: [일→십, 십→백, 백→천] */
const cpos=(a,b)=>{ const r=[]; let c=0; for(let k=0;k<3;k++){ c=dg(a,k)+dg(b,k)+c>=10?1:0; r.push(c); } return r; };
/* pat: '0'(받아올림 없음) · '1'(있음) · '?'(상관없음) 를 일 · 십 · 백 자리 순서로 */

function addP(fa,fb,pat,ok=()=>true){

  const a=fa(),b=fb(); return P(`${a} + ${b}`,a+b);
}

const ok2=(a,b)=>nz(a)&&nz(b);
const boxP=(a,b)=>Math.random()<.5?P(`□ + ${b} = ${a+b}`,a):P(`${a} + □ = ${a+b}`,b);
const DIG=['영','일','이','삼','사','오','육','칠','팔','구'];

  box31:()=>{ for(;;){ const a=r3(),b=r1(); if(a+b<=999&&a%10+b>=10) return boxP(a,b); } },

  box32:()=>{ for(;;){ const a=r3(),b=r2(); if(a+b<=999&&nz(a)&&nz(b)) return boxP(a,b); } },

  /* 네 자리 수 알아보기 */
  n1000:()=>{ const f=rnd(0,3);

  nCompose:()=>{ const n=r4(), d=[3,2,1,0].map(k=>dg(n,k)), nm=[1000,100,10,1];

  nSkip:()=>{ const s=pick([1000,100,10,1]); for(;;){ const a=rnd(1000,9999-3*s); if(dg(a,0)||s===1) return P(`${a} → ${a+s} → ${a+2*s} → □`,a+3*s); } },
  nCmp:()=>{ for(;;){ const a=r4(.15); let b=a; const k=rnd(0,2); b=a-dg(a,k)*10**k+rnd(0,9)*10**k; if(b!==a&&b>=1000) return P(`더 큰 수를 쓰세요: ${a}, ${b}`,Math.max(a,b),1); } },
  n1000b:()=>{ const x=Math.random()<.5?rnd(1,9)*100:rnd(11,99)*10; return P(`${x} + □ = 1000`,1000-x); },
  k4:()=>{ if(Math.random()<.5){ const a=rnd(1,8),b=rnd(1,9-a); return P(`${a}000 + ${b}000`,(a+b)*1000); } const a=rnd(1,9),b=rnd(1,9); return P(`${a}000 + ${b}00`,a*1000+b*100); },
  nExpand:()=>{ const n=r4(.15), parts=[3,2,1,0].map(k=>dg(n,k)*10**k).filter(Boolean);

  /* 세 자리 + 세 자리 = 네 자리 수 */
  k1000:()=>{ const a=rnd(2,9),b=rnd(10-a,9); return P(`${a}00 + ${b}00`,(a+b)*100); },

function genOne(spec){ const [k,arg]=spec.split(':'); return G[k](arg); }
function makeQs(mi){
  const st=stageOf(mi), specs=st.g.split(' '), out=[], seen=new Set();
  const order=[]; while(order.length<QN) order.push(...shuffle(specs)); order.length=QN;
  order.forEach(sp=>{ let q; for(let t=0;t<30;t++){ q=genOne(sp); if(!seen.has(q.q)) break; }
    if(out.length&&out[out.length-1].q===q.q){ for(let t=0;t<10&&out[out.length-1].q===q.q;t++) q=genOne(sp); }
    seen.add(q.q); out.push(q); });
  return out;
}

function mergeState(a,b){
  const nb=(b.updatedAt||0)>=(a.updatedAt||0), n=nb?b:a, o=nb?a:b;   // n: 더 최근에 저장한 쪽 (설정 · 엄마 메시지 등은 이쪽)
  const r=Object.assign(defState(),o,n), un=(x,y)=>[...new Set([...(x||[]),...(y||[])])];
  r.mission=Math.max(a.mission||0,b.mission||0);
  r.coins=Math.max(a.coins||0,b.coins||0);
  r.own=un(a.own,b.own); r.pets=un(a.pets,b.pets);
  if(r.pet<0&&r.pets.length) r.pet=r.pets[0];
  r.log=Object.assign({},o.log); Object.entries(n.log||{}).forEach(([k,v])=>{ const w=(o.log||{})[k]; r.log[k]=!w||(v.q||0)>=(w.q||0)?v:w; });
  r.best=Object.assign({},o.best); Object.entries(n.best||{}).forEach(([k,v])=>{ r.best[k]=Math.max(v,(o.best||{})[k]||0); });
  r.mgBest=Object.assign({},o.mgBest); Object.entries(n.mgBest||{}).forEach(([k,v])=>{ r.mgBest[k]=Math.max(v,(o.mgBest||{})[k]||0); });
  r.weeks=Object.assign({},o.weeks,n.weeks); r.spin=Object.assign({},o.spin,n.spin);
  const seen=new Set(); r.momHist=[...(o.momHist||[]),...(n.momHist||[])].filter(x=>{ const k=x.t+'|'+x.msg; if(seen.has(k)) return false; seen.add(k); return true; }).sort((x,y)=>x.t-y.t);

}

    if(snap.exists){ const d=snap.data();
      if((d.updatedAt||0)!==(S.updatedAt||0)){
        /* 이 기기 기록과 온라인 기록이 다르면 합쳐요 (진도 · 코인 · 날짜별 푼 문제는 큰 쪽, 친구 · 옷은 둘 다) → 어느 기기가 먼저 저장해도 기록이 안 사라져요 */
        const had=!!S.updatedAt; S=mergeState(S,d); saveLocal(); if(!OB&&!QZ) render();
        if(had){ S.updatedAt=Date.now(); saveLocal(); await pushCloud(); }

/* ════════ 아바타 그리기 (로블록스 네모 캐릭터) ════════ */
const SKIN='#f7d154';
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function shirtFill(c,id,u){
  // 골든 다이아: 노란 피부색과 헷갈리지 않게 진한 금색 → 밝은 금색으로 반짝이는 줄무늬
  if(id==='s:gold'){ const g=c.createLinearGradient(-2.3*u,-8.6*u,2.3*u,-4.1*u); [['#a86a00',0],['#f2b600',.3],['#fff1a8',.5],['#e0a100',.7],['#9a5f00',1]].forEach(([k,p])=>g.addColorStop(p,k)); return g; }
  if(id==='s:rainbow'){ const g=c.createLinearGradient(-2.2*u,-8.5*u,2.2*u,-4.2*u); ['#ff5a5a','#ffb03a','#ffe14d','#4cd964','#3aa0ff','#a46bff'].forEach((k,i)=>g.addColorStop(i/5,k)); return g; }
  return (SHOPI[id]||SHOPI['s:blue']).c;
}
/* x, y = 발 가운데 · s = 키 */
function drawAvatar(c,x,y,s,o={}){
  const u=s/12, w=o.wear||S.wear, ph=o.phase||0, f=o.face||1, mv=!!o.moving, sw=Math.sin(ph);
  c.save(); c.translate(x,y); c.scale(f,1);
  if(o.alpha!=null) c.globalAlpha=o.alpha;
  c.fillStyle=(SHOPI[w.pants]||SHOPI['p:green']).c;
  rr(c,-2.15*u,-4.4*u-(mv?Math.max(0,sw)*u*1.1:0),2.05*u,4.4*u,.45*u); c.fill();
  rr(c,.1*u,-4.4*u-(mv?Math.max(0,-sw)*u*1.1:0),2.05*u,4.4*u,.45*u); c.fill();
  /* 운동화 (바지 끝에 발) */
  { const la=mv?Math.max(0,sw)*u*1.1:0, lb=mv?Math.max(0,-sw)*u*1.1:0;
    c.fillStyle='#3b3f4a'; rr(c,-2.25*u,-.9*u-la,2.4*u,.9*u,.4*u); c.fill(); rr(c,0,-.9*u-lb,2.4*u,.9*u,.4*u); c.fill();
    c.fillStyle='#ffffff'; c.fillRect(-2.15*u,-.3*u-la,2.2*u,.18*u); c.fillRect(.1*u,-.3*u-lb,2.2*u,.18*u); }
  const aw=mv?sw*u*.8:0;
  c.fillStyle=SKIN; rr(c,-3.5*u,-8.3*u+aw,1.25*u,4.1*u,.5*u); c.fill(); rr(c,2.25*u,-8.3*u-aw,1.25*u,4.1*u,.5*u); c.fill();
  c.fillStyle=shirtFill(c,w.shirt,u); rr(c,-2.3*u,-8.6*u,4.6*u,4.5*u,.55*u); c.fill();
  if(w.shirt==='s:gold') drawDiamondShirt(c,u);
  c.fillStyle=SKIN; rr(c,-1.85*u,-12*u,3.7*u,3.4*u,.95*u); c.fill();
  /* 짧은 갈색 머리 (뾰족뾰족 앞머리 · 뒤쪽 구레나룻) */
  c.fillStyle='#3a2a20'; c.beginPath(); c.moveTo(-1.97*u,-10.3*u); c.quadraticCurveTo(-2.15*u,-12.7*u,0,-12.6*u); c.quadraticCurveTo(2.15*u,-12.7*u,1.97*u,-10.9*u);
  [[1.45,-11.3],[.95,-10.95],[.4,-11.35],[-.15,-11.0],[-.7,-11.4],[-1.25,-11.05],[-1.55,-10.3]].forEach(([a,b])=>c.lineTo(a*u,b*u)); c.closePath(); c.fill();
  c.fillStyle='#1d2433';
  c.beginPath(); c.arc(-.45*u,-10.6*u,.32*u,0,7); c.fill();
  c.beginPath(); c.arc(.95*u,-10.6*u,.32*u,0,7); c.fill();
  c.strokeStyle='#1d2433'; c.lineWidth=.3*u; c.lineCap='round'; c.beginPath(); c.arc(.25*u,-10.15*u,.85*u,.2*Math.PI,.8*Math.PI); c.stroke();
  drawHat(c,w.hat,u);
  c.restore();
}
// 골든 다이아 티셔츠: 진한 금 테두리 + 가운데 큰 다이아 + 작은 다이아 두 개 + 반짝이
function drawDiamondShirt(c,u){
  c.save();
  c.strokeStyle='#7a4a00'; c.lineWidth=.28*u; rr(c,-2.3*u,-8.6*u,4.6*u,4.5*u,.55*u); c.stroke();
  const gem=(x,y,r)=>{
    c.beginPath(); c.moveTo(x,y-r); c.lineTo(x+r*.8,y-r*.25); c.lineTo(x,y+r); c.lineTo(x-r*.8,y-r*.25); c.closePath();
    const g=c.createLinearGradient(x-r,y-r,x+r,y+r); g.addColorStop(0,'#ffffff'); g.addColorStop(.45,'#9ff0ff'); g.addColorStop(1,'#3aa7e0');
    c.fillStyle=g; c.fill(); c.strokeStyle='#1d6fa8'; c.lineWidth=.16*u; c.stroke();
    c.beginPath(); c.moveTo(x-r*.8,y-r*.25); c.lineTo(x+r*.8,y-r*.25); c.stroke();
  };
  gem(0,-6.5*u,1.05*u); gem(-1.45*u,-7.6*u,.48*u); gem(1.45*u,-7.6*u,.48*u);
  c.fillStyle='#fff';
  [[-1.5,-5.0,.16],[1.6,-5.3,.2],[.9,-7.9,.13]].forEach(([a,b,r])=>{ c.beginPath(); c.arc(a*u,b*u,r*u,0,7); c.fill(); });
  c.restore();
}
/* 🐶 하얀 소형견 퍼니: 복슬복슬 하얀 털, 축 늘어진 크림색 귀, 까만 눈 · 코
   x, y = 발 가운데 · s = 키 · face = 보는 쪽(1 오른쪽, -1 왼쪽) · t = 시간(초) */
function drawDog(c,x,y,s,face,t,moving){
  const u=s/10, b=moving?Math.abs(Math.sin(t*9))*u*.5:0;
  const W='#fffaf2', C='#ecdcc6', D='#d8c4a8';
  /* 둥근 털뭉치 여러 개로 복슬복슬하게 */
  const fluff=(cx,cy,r,n,col)=>{ c.fillStyle=col; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; c.beginPath(); c.arc(cx+Math.cos(a)*r*.72,cy+Math.sin(a)*r*.72,r*.42,0,7); c.fill(); } c.beginPath(); c.arc(cx,cy,r*.82,0,7); c.fill(); };
  c.save(); c.translate(x,y); c.scale(face<0?-1:1,1);
  c.fillStyle='rgba(0,0,0,.14)'; c.beginPath(); c.ellipse(0,0,4*u,1*u,0,0,7); c.fill();
  c.translate(0,-b);
  /* 살랑살랑 꼬리 */
  const tw=Math.sin(t*(moving?14:5))*.5*u;
  fluff(-3.5*u,-5.2*u+tw,1.15*u,6,D); fluff(-3.5*u,-5.25*u+tw,.95*u,6,W);
  /* 다리 */
  [-2.6,-1.3,.9,2.1].forEach((a,i)=>{ const lift=moving?Math.max(0,Math.sin(t*12+i*Math.PI/2))*u*.6:0;
    c.fillStyle=D; rr(c,a*u-.68*u,-1.9*u-lift,1.36*u,1.95*u,.6*u); c.fill(); c.fillStyle=W; rr(c,a*u-.58*u,-1.85*u-lift,1.16*u,1.8*u,.55*u); c.fill(); });
  /* 몸통 */
  fluff(-.5*u,-3.5*u,2.75*u,9,D); fluff(-.5*u,-3.55*u,2.55*u,9,W);
  /* 머리 */
  const hx=2.3*u, hy=-6.5*u;
  fluff(hx,hy,2.55*u,10,D); fluff(hx,hy,2.35*u,10,W);
  fluff(hx-.2*u,hy-2.2*u,.95*u,6,W);   /* 정수리 털 */
  /* 축 늘어진 귀 */
  c.fillStyle=C; c.beginPath(); c.ellipse(hx-2.15*u,hy+.6*u,1*u,1.9*u,.25,0,7); c.fill(); c.beginPath(); c.ellipse(hx+2.15*u,hy+.6*u,1*u,1.9*u,-.25,0,7); c.fill();
  c.strokeStyle='rgba(255,255,255,.8)'; c.lineWidth=.18*u; [[-2.3,-.2],[-2,.8],[2.3,-.2],[2,.8]].forEach(([a,b2])=>{ c.beginPath(); c.moveTo(hx+a*u-.3*u,hy+b2*u); c.lineTo(hx+a*u+.3*u,hy+b2*u+.6*u); c.stroke(); });
  /* 주둥이 · 눈 · 코 · 입 */
  c.fillStyle=W; c.beginPath(); c.ellipse(hx+.15*u,hy+1*u,1.25*u,.95*u,0,0,7); c.fill();
  c.fillStyle='#1d1d22'; c.beginPath(); c.arc(hx-.95*u,hy-.25*u,.46*u,0,7); c.fill(); c.beginPath(); c.arc(hx+1.15*u,hy-.25*u,.46*u,0,7); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.arc(hx-.8*u,hy-.45*u,.16*u,0,7); c.fill(); c.beginPath(); c.arc(hx+1.3*u,hy-.45*u,.16*u,0,7); c.fill();
  c.fillStyle='#1d1d22'; c.beginPath(); c.ellipse(hx+.15*u,hy+.75*u,.55*u,.42*u,0,0,7); c.fill();
  c.fillStyle='rgba(255,255,255,.7)'; c.beginPath(); c.arc(hx-.02*u,hy+.62*u,.12*u,0,7); c.fill();
  c.strokeStyle='#6b5a4a'; c.lineWidth=.16*u; c.beginPath(); c.moveTo(hx+.15*u,hy+1.15*u); c.quadraticCurveTo(hx-.25*u,hy+1.6*u,hx-.6*u,hy+1.35*u); c.moveTo(hx+.15*u,hy+1.15*u); c.quadraticCurveTo(hx+.55*u,hy+1.6*u,hx+.9*u,hy+1.35*u); c.stroke();
  c.fillStyle='#ff8fa6'; c.beginPath(); c.ellipse(hx+.15*u,hy+1.62*u,.28*u,.22*u,0,0,Math.PI); c.fill();   /* 혀 */
  c.restore();
}
function drawHat(c,h,u){
  if(h==='h:cap'){ c.fillStyle='#e5484d'; c.beginPath(); c.ellipse(0,-11.55*u,1.98*u,1.35*u,0,Math.PI,0); c.fill(); c.fillStyle='#b4232a'; rr(c,.3*u,-11.85*u,2.7*u,.6*u,.3*u); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(0,-12.75*u,.25*u,0,7); c.fill(); }
  else if(h==='h:beanie'){ c.fillStyle='#3aa0ff'; c.beginPath(); c.ellipse(0,-11.4*u,2*u,1.7*u,0,Math.PI,0); c.fill(); c.fillStyle='#1f6fc4'; rr(c,-2.05*u,-11.9*u,4.1*u,.9*u,.4*u); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(0,-13.2*u,.62*u,0,7); c.fill(); }
  else if(h==='h:explorer'){ c.fillStyle='#a8743f'; c.beginPath(); c.ellipse(0,-11.6*u,3.1*u,.65*u,0,0,7); c.fill(); rr(c,-1.65*u,-13.5*u,3.3*u,2.1*u,.7*u); c.fill(); c.fillStyle='#5b3b1a'; c.fillRect(-1.65*u,-12.15*u,3.3*u,.45*u); }
  else if(h==='h:crown'||h==='h:domino'){
    const dm=h==='h:domino', top=dm?-14.6*u:-13.8*u;
    c.save(); if(dm){ c.shadowColor='#7fd8ff'; c.shadowBlur=8*u; }
    c.fillStyle=dm?'#1b1f2a':'#ffcc1a'; c.beginPath(); c.moveTo(-1.85*u,-11.7*u); c.lineTo(-1.85*u,top+.6*u); c.lineTo(-.95*u,-12.6*u); c.lineTo(0,top); c.lineTo(.95*u,-12.6*u); c.lineTo(1.85*u,top+.6*u); c.lineTo(1.85*u,-11.7*u); c.closePath(); c.fill(); c.restore();
    c.fillStyle=dm?'#fff':'#e5484d'; (dm?[[-1.2,-12.3],[0,-12.9],[1.2,-12.3],[-.6,-12],[.6,-12]]:[[0,-12.4]]).forEach(([a,b])=>{ c.beginPath(); c.arc(a*u,b*u,(dm?.22:.35)*u,0,7); c.fill(); });
  }
}

/* 이모지 그림 (캔버스에 빠르게 그리려고 미리 만들어 둬요) */
const EMO={};
function emoji(ch,size){
  size=Math.max(8,Math.round(size)); const k=ch+'|'+size; if(EMO[k]) return EMO[k];
  const cv=document.createElement('canvas'), p=Math.ceil(size*1.3); cv.width=cv.height=p;
  const c=cv.getContext('2d'); c.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(ch,p/2,p/2+size*.06);
  return EMO[k]=cv;
}
function drawEmoji(c,ch,x,y,size,flip){ const e=emoji(ch,size*(window.devicePixelRatio||1)), w=e.width/(window.devicePixelRatio||1); c.save(); c.translate(x,y); if(flip) c.scale(-1,1); c.drawImage(e,-w/2,-w/2,w,w); c.restore(); }
function fitCanvas(cv){ const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight; if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); } const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); return {c,w,h}; }

function drawGround(c,reg,x,y,T,col,row){ c.fillStyle=reg.gnd[(col+row)&1]; c.fillRect(x,y,T+.5,T+.5); }
function drawHazard(c,ri,x,y,T,t,row){
  const reg=REG[ri]; c.fillStyle=reg.haz; c.fillRect(x,y,T+.5,T+.5);
  c.save(); c.beginPath(); c.rect(x,y,T,T); c.clip();
  if(ri===0){ c.fillStyle='rgba(255,230,170,.35)'; for(let i=0;i<5;i++){ const a=t*1.2+i*1.7+row; c.beginPath(); c.arc(x+T*(.2+.6*((Math.sin(a)+1)/2)),y+T*((i+.5)/5),T*.06,0,7); c.fill(); } }
  else if(ri===2){ const g=c.createLinearGradient(x,y,x+T,y); g.addColorStop(0,'#3d424d'); g.addColorStop(.5,'#0d0f13'); g.addColorStop(1,'#3d424d'); c.fillStyle=g; c.fillRect(x,y,T,T); }
  else if(ri===4){ c.fillStyle='rgba(255,220,80,.6)'; for(let i=0;i<3;i++){ const ph=(t*.8+i*.33+row*.17)%1; c.beginPath(); c.arc(x+T*(.25+.25*i),y+T*(1-ph),T*.09*(1-ph)+1,0,7); c.fill(); } c.fillStyle='rgba(255,140,40,.35)'; c.fillRect(x,y,T,T); }
  else { c.strokeStyle='rgba(255,255,255,.45)'; c.lineWidth=Math.max(1.5,T*.05); for(let i=0;i<3;i++){ c.beginPath(); const yy=y+T*(.2+.3*i); for(let k=0;k<=8;k++){ const xx=x+T*k/8; const w=Math.sin(k/8*Math.PI*2+t*3+i+row)*T*.05; k?c.lineTo(xx,yy+w):c.moveTo(xx,yy+w); } c.stroke(); } if(ri===5){ c.strokeStyle='rgba(255,255,255,.8)'; c.lineWidth=T*.06; c.strokeRect(x+1,y+1,T-2,T-2); } }
  c.restore();
}

function journeySVG(){

  const cur=stageOf(S.mission).r, done=S.mission>=TOTAL;
  let path=`M${P[0][0]},${P[0][1]}`; for(let i=1;i<P.length;i++){ const [x0,y0]=P[i-1],[x1,y1]=P[i]; path+=` Q${(x0+x1)/2+(i%2?-30:30)},${(y0+y1)/2-20} ${x1},${y1}`; }
  let s=`<svg viewBox="0 0 360 230" role="img" aria-label="탐험 경로"><path d="${path}" fill="none" stroke="#8a6a3a" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round"/>`;
  REG.forEach((g,i)=>{ const [x,y]=P[i], st=regStart(i), n=STAGES[i].length, got=Math.max(0,Math.min(n,S.mission-st)), fin=got>=n, isCur=!done&&i===cur;

      <circle cx="${x}" cy="${y}" r="25" fill="${fin||isCur?g.col:'#c9c3b8'}" stroke="#fff" stroke-width="3"/>
      ${got>0&&!fin?`<path d="M${x},${y-r} A${r},${r} 0 ${ang>Math.PI?1:0} 1 ${ax.toFixed(1)},${ay.toFixed(1)}" fill="none" stroke="#ffd84d" stroke-width="5" stroke-linecap="round"/>`:''}
      <text x="${x}" y="${y+8}" text-anchor="middle" font-size="24">${g.ico}</text>
      <text x="${x}" y="${y+44}" text-anchor="middle" font-size="13" fill="#3b2a10" font-family="Jua">${g.name} ${fin?'✔':`${got}/${n}`}</text>
      ${isCur?`<text x="${x+18}" y="${y-18}" text-anchor="middle" font-size="22">📍</text>`:''}</g>`; });
  return s+`</svg>`;
}

function genMap(mi){
  const st=stageOf(mi), R=mulberry32(mi*7919+101), ri=(a,b)=>a+Math.floor(R()*(b-a+1));
  const COLS=28+Math.min(16,st.s)+st.r*2, ROWS=9, mid=4;

  for(let c=0;c<COLS;c++){ g[0][c]=1; g[ROWS-1][c]=1; }
  for(let r=0;r<ROWS;r++){ g[r][0]=1; g[r][COLS-1]=1; }
  /* 점프로 넘어야 하는 줄 (모래 늪 · 강물 · 낭떠러지 …) */
  const nh=Math.min(obHard()?9:7,2+Math.floor(st.s/3)+(st.r>=2?1:0)+(obHard()?2:0)), span=(COLS-11)/nh, haz=[];

  return {g,COLS,ROWS,mid,haz,coins,enemies,gx,st};
}

const MOM_KEY='leader-mom';
const getMom=()=>{ try{ return JSON.parse(localStorage.getItem(MOM_KEY)||'null')||{}; }catch(e){ return {}; } };
function momText(){
  const tk=todayKey(), d=new Date(), L=S.log[tk]||{q:0,c:0,ms:0}, st=stageOf(S.mission);
  let t=`[도진이의 수학 연산 대모험] ${d.getMonth()+1}/${d.getDate()}(${WDK[d.getDay()]}) 🧭\n오늘 푼 문제 ${L.q}개 · 맞힘 ${L.c}개 · 미션 ${L.ms||0}개${(L.ms||0)>=perDay()?' (목표 달성!)':''}\n${L.r?`(처음에 틀려서 다시 푼 문제 ${L.r}개)\n`:''}`;
  (L.m||[]).forEach(x=>{ t+=`✔ ${x}\n`; });
  if(L.gq) t+=`👾 곱셈 몬스터 게임: ${L.gq}번 밟아 ${L.gc||0}개 맞힘${L.gh?` (⭐ 하이클래스 ${L.gh}개)`:''}\n`;

async function sendMom(){
  const mom=getMom(), body=momText(), phone=(mom.phone||'').replace(/[^\d+]/g,'');
  if(phone){ const ios=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document; location.href=`sms:${phone}${ios?'&':'?'}body=${encodeURIComponent(body)}`; return; }
  if(navigator.share){ try{ await navigator.share({text:body}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(body); toast('내용을 복사했어요. 문자에 붙여 넣어 보내요'); }catch(e){ toast('엄마 전화번호를 엄마 모드에서 먼저 정해 주세요'); }
}

  return h;
}
function buyPet(i){ const p=PETS[i]; if(S.pets.includes(i)||S.coins<p.p||!petOpen(p)) return; if(!confirm(`${p.e} ${jo(p.n,'을','를')} 🪙 ${p.p}코인에 데려올까요?`)) return; S.coins-=p.p; S.pets.push(i); S.pet=i; save(); sWin(); openShop(); render(); toast(`${p.e} ${jo(p.n,'이','가')} 친구가 됐어요! ${jo(DOG,'이랑','랑')} 같이 따라다녀요`); }
function setPetShop(i){ S.pet=i; save(); openShop(); render(); }
function buyIt(id){ const x=SHOPI[id]; if(S.own.includes(id)||S.coins<x.p) return; if(!confirm(`${jo(x.n,'을','를')} 🪙 ${x.p}코인에 살까요?`)) return; S.coins-=x.p; S.own.push(id); S.wear[x.t]=id; save(); sWin(); openShop(); render(); toast(`${x.n} 샀어요! 🛍️`); }
function wearIt(id){ const x=SHOPI[id]; S.wear[x.t]=id; save(); openShop(); render(); }

/* ════════ 엄마 모드 (비밀번호: 이 앱에서 정한 것 → 공부방(e2/settings) 엄마 · 관리자 비밀번호 → 0000) ════════ */
let PIN='', SETTINGS=null;
async function openAdmin(){
  PIN=''; drawPin('설정을 불러오는 중…');
  try{ if(await timeout(cloudInit(),6000)){
    const u=await timeout(new Promise(res=>{ const off=firebase.auth().onAuthStateChanged(x=>{ off(); res(x); }); }),4000).catch(()=>null);
    if(u&&await isAdminUser(u)){ ADMIN_G=true; return drawAdmin(); }
    const s=await timeout(cloud.db.collection('e2').doc('settings').get(),6000); SETTINGS=s.exists?s.data():{};
  } }catch(e){ SETTINGS=null; }
  drawPin();
}
/* 🔐 관리자: 공부방과 같은 관리자 구글 계정 */
const ADMIN_EMAIL_SHA256='22fa372a479af0929cadcbf6b12b6c2dace34800344067ef44b21a0c187487fb';
let ADMIN_G=false;
async function sha256Hex(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const isAdminUser=async u=>{ const em=((u&&u.email)||'').trim().toLowerCase(); return !!em&&await sha256Hex(em)===ADMIN_EMAIL_SHA256; };
async function adminGoogle(){
  const msg=t=>{ const m=$('pinmsg'); if(m) m.innerHTML=t; else if(t) toast(t.replace(/<[^>]+>/g,'')); };
  if(!cloud.ok||!window.firebase||!firebase.auth){ msg('로그인을 준비하고 있어요…'); const ok=await cloudInit(); msg(ok?'준비됐어요! 한 번 더 눌러 주세요':'인터넷 연결을 확인해 주세요'); return; }
  const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
  try{
    const r=await firebase.auth().signInWithPopup(p);
    if(await isAdminUser(r.user)){ ADMIN_G=true; drawAdmin(); }
    else { await firebase.auth().signOut(); msg('관리자 계정이 아니에요 ('+(r.user.email||'')+')'); }
  }catch(e){
    if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request') return msg('');
    msg(({'auth/popup-blocked':'팝업이 막혔어요. 팝업을 허용해 주세요','auth/unauthorized-domain':'이 주소가 Firebase 승인된 도메인에 없어요','auth/network-request-failed':'인터넷 연결을 확인해 주세요'})[e.code]||('로그인하지 못했어요'+(e.code?' ('+e.code+')':'')));
  }
}
function adminOpen(){
  const u=cloud.ok&&window.firebase&&firebase.auth&&firebase.auth().currentUser;
  if(u) return isAdminUser(u).then(y=>{ if(y){ ADMIN_G=true; drawAdmin(); } else adminGoogle(); });
  adminGoogle();
}
async function adminSignOut(){ try{ await firebase.auth().signOut(); }catch(e){} ADMIN_G=false; closeModal(); render(); toast('관리자에서 나왔어요'); }
const usingDefaultPin=()=>!S.pinH&&!(SETTINGS&&(SETTINGS.momH||SETTINGS.pinH));
function drawPin(msg){
  modal(`<h2>🔒 엄마 모드</h2><p style="text-align:center;color:var(--sub);font-size:17px">${msg||'엄마 비밀번호 4자리를 눌러 주세요'}${usingDefaultPin()?'<br><small>처음 비밀번호는 0000 이에요. 들어가서 꼭 바꿔 주세요.</small>':''}</p><div class="pinrow">${[0,1,2,3].map(i=>`<i class="${i<PIN.length?'on':''}"></i>`).join('')}</div><div class="pinpad" id="pinpad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('')}<button onclick="pinKey('del')">⌫</button><button onclick="pinKey('0')">0</button><button onclick="closeModal()" style="font-size:18px">닫기</button></div>
    <button class="btn gray wide" style="margin-top:14px;font-size:18px" onclick="adminGoogle()">🔐 관리자 (구글 로그인)</button><p id="pinmsg" style="text-align:center;color:var(--sub);font-size:15px;min-height:20px;margin:8px 0 0"></p>`);
}
function pinKey(k){
  if(k==='del') PIN=PIN.slice(0,-1); else if(PIN.length<4) PIN+=k;
  if(PIN.length<4) return drawPin();
  const st=SETTINGS||{};
  const ok=S.pinH ? hashPin(PIN,'leader')===S.pinH
    : (st.momH&&hashPin(PIN,'mom')===st.momH)||hashPin(PIN,'admin')===(st.pinH||hashPin('0000','admin'));
  if(ok){ PIN=''; drawAdmin(); } else { PIN=''; sNO(); drawPin('비밀번호가 틀렸어요. 다시 눌러 주세요'); const p=$('pinpad'); if(p) p.classList.add('shake'); }
}
function drawAdmin(){
  const st=stageOf(S.mission), keys=Object.keys(S.log).sort().reverse(), at=S.momMsgAt?new Date(S.momMsgAt):null;
  let h=`<h2>${ADMIN_G?'🔐 관리자 모드':'👩 엄마 모드'}</h2>
   <div class="box"><b>💚 엄마의 한마디</b> <span style="color:var(--sub);font-size:15px">첫 화면 맨 위 초록 띠에 보여요 (비우면 숨겨요)</span>
   <div style="margin-top:8px;padding:10px 12px;border-radius:12px;background:${S.momMsg?'linear-gradient(135deg,#2fbf71,#1f9e5c)':'#e6eaf0'};color:${S.momMsg?'#fff':'var(--sub)'};font-size:17px;line-height:1.45;white-space:pre-wrap;word-break:keep-all">${S.momMsg?`<small style="opacity:.85;font-size:13px">지금 첫 화면에 보이는 멘트${at?` · ${at.getMonth()+1}/${at.getDate()} ${pad2(at.getHours())}:${pad2(at.getMinutes())} 저장`:''}</small><br>💚 ${esc(S.momMsg)}`:'아직 저장된 멘트가 없어요'}</div>
   <textarea id="momMsg" class="inp" maxlength="200" rows="3" placeholder="예) 도진아, 오늘도 사막 건너기 화이팅! 60문제 다 풀면 엄마한테 보내 줘 💚" style="margin-top:8px;resize:vertical">${esc(S.momMsg||'')}</textarea>
   <div class="row" style="margin-top:6px"><button class="btn" style="flex:1" onclick="setMomMsg()">저장하기</button><button class="btn gray" onclick="$('momMsg').value='';setMomMsg()">지우기</button></div>${momHistAdmin()}</div>
   <div class="box"><b>🎯 하루 목표</b> <span style="color:var(--sub);font-size:15px">미션 1개 = ${QN}문제 · 목표를 채운 날이 한 주에 5일이면 🪙 100코인</span>
   <div class="row" style="margin-top:8px">${[1,2,3,4].map(n=>`<button class="btn ${perDay()===n?'':'gray'}" style="flex:1;padding:10px 4px" onclick="setPerDay(${n})">${n}개<br><small>${n*QN}문제</small></button>`).join('')}</div>
   <label style="display:flex;gap:8px;align-items:center;font-size:16px;margin-top:12px"><input type="checkbox" ${S.noMap?'':'checked'} onchange="S.noMap=!this.checked;save();render()" style="width:22px;height:22px"> 미션 사이에 🕹️ 이동 맵 (조이스틱 · 점프) 하기</label></div>
   <div class="box"><b>📍 지금 미션</b><p style="margin:6px 0 10px;font-size:18px">${S.mission+1}번째 · ${REG[st.r].ico} ${REG[st.r].name} · ${esc(st.t)}</p>
   <div class="row"><button class="btn gray" onclick="setMission(S.mission-1)">◀ 한 칸 뒤로</button><button class="btn" onclick="setMission(S.mission+1)">한 칸 앞으로 ▶</button></div>
   <select id="jump" class="inp" style="margin-top:10px">${Array.from({length:TOTAL+1},(_,i)=>{ const x=stageOf(i); return `<option value="${i}" ${i===S.mission?'selected':''}>${i+1}. ${REG[x.r].name} · ${esc(x.t)}</option>`; }).join('')}</select>
   <button class="btn wide" style="margin-top:8px" onclick="setMission(+$('jump').value)">이 미션으로 옮기기</button>
   <p style="margin:6px 0 0;font-size:14px;color:var(--sub)">앞으로 옮기면 건너뛴 미션의 아이템도 함께 생겨요</p></div>
   <div class="box"><b>📊 날짜별 기록</b>
   ${keys.length?`<table><tr><th>날짜</th><th>푼 문제</th><th>맞힘</th><th>정답률</th><th>미션</th></tr>${keys.slice(0,40).map(k=>{ const L=S.log[k]; return `<tr><td>${k.slice(5).replace('-','/')}</td><td>${L.q}</td><td>${L.c}</td><td>${L.q?Math.round(L.c/L.q*100):0}%</td><td>${L.ms||0}${dayDone(k)?' ✅':''}</td></tr>${(L.m||[]).length||L.gq?`<tr><td colspan="5" style="text-align:left;font-size:13px;color:var(--sub)">${(L.m||[]).map(x=>'✔ '+esc(x)).join('<br>')}${L.gq?`${(L.m||[]).length?'<br>':''}👾 곱셈 몬스터 게임 ${L.gc||0}/${L.gq} 맞힘${L.gh?` · ⭐ 하이클래스 ${L.gh}개`:''}`:''}</td></tr>`:''}`; }).join('')}</table>`:'<p style="color:var(--sub)">아직 기록이 없어요</p>'}</div>
   <div class="box"><b>🐾 동물 친구 · 🪙 코인</b><p style="margin:6px 0;font-size:16px">친구 ${S.pets.length}명 ${S.pets.map(i=>PETS[i].e).join(' ')} · 코인 ${S.coins} · 이번 주 ${weekCount()}/5일</p>
   <div class="row"><button class="btn gray" onclick="givePet()">🐾 친구 한 명 주기</button><button class="btn gray" onclick="giveCoins()">🪙 코인 주기</button></div></div>
   <div class="box"><b>👩 엄마 프로필</b> <span style="color:var(--sub);font-size:15px">'📩 엄마한테 보내기'가 이 번호로 문자를 열어요 · 이 기기에만 저장</span>
   <input id="momPhone" class="inp" type="tel" inputmode="tel" maxlength="15" placeholder="010-0000-0000" value="${esc(getMom().phone||'')}" style="margin-top:8px">
   <div class="row" style="margin-top:6px"><button class="btn" style="flex:1" onclick="setMom()">저장</button><button class="btn gray" onclick="sendMom()">📩 시험해 보기</button></div></div>
   <div class="box"><b>🌀 오답</b> <span style="color:var(--sub)">${S.wrong.length}문제</span>
   <div class="row" style="margin-top:8px"><button class="btn red" onclick="if(confirm('오답을 모두 비울까요?')){S.wrong=[];save();drawAdmin();}">비우기</button></div></div>
   <div class="box"><b>🔒 엄마 비밀번호 바꾸기</b> <span style="color:var(--sub);font-size:15px">${S.pinH?'(정해져 있어요)':'(공부방 비밀번호 또는 0000)'}</span>
   <div class="row" style="margin-top:8px"><input id="newpin" class="inp" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" style="flex:1"><button class="btn" onclick="setPin()">바꾸기</button></div></div>
   <div class="row">${ADMIN_G?'<button class="btn gray" style="flex:1" onclick="adminSignOut()">관리자 로그아웃</button>':''}<button class="btn gray" style="flex:1" onclick="closeModal();render()">닫기</button></div>`;
  modal(h);
}
/* 💌 엄마의 한마디 기록: 저장할 때마다 날짜와 함께 쌓아요 (아이는 편지함, 엄마는 엄마 모드에서 봐요) */
const momHist=()=>{ if(!Array.isArray(S.momHist)) S.momHist=S.momMsg?[{t:S.momMsgAt||Date.now(),msg:S.momMsg}]:[]; return S.momHist; };
const fmtAt=t=>{ const d=new Date(t); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WDK[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
function openMomBox(){ const L=momHist().slice().reverse(); modal(`<h2>💌 엄마 편지함 <small style="color:var(--sub);font-size:17px">${L.length}개</small></h2>${L.length?L.map(x=>`<div class="mbox"><div class="mb-d">${fmtAt(x.t)}</div><p>${esc(x.msg)}</p></div>`).join(''):'<p style="color:var(--sub)">아직 엄마 편지가 없어요</p>'}`); }
function momHistAdmin(){ const H=momHist(); return H.length?`<p style="margin:12px 0 0;font-size:16px"><b>📜 지난 한마디</b> <span style="color:var(--sub);font-size:14px">${H.length}개 · 아이는 '💌 지난 편지 보기'로 봐요</span></p><div class="mhist">${H.map((x,i)=>({x,i})).reverse().map(({x,i})=>`<div class="mbox"><div><div class="mb-d">${fmtAt(x.t)}</div><p>${esc(x.msg)}</p></div><button onclick="delMomHist(${i})" aria-label="지우기">✕</button></div>`).join('')}</div>`:''; }
function delMomHist(i){ if(!confirm('이 한마디를 기록에서 지울까요?')) return; momHist().splice(i,1); save(); drawAdmin(); }
function setMomMsg(){ const H=momHist(); S.momMsg=($('momMsg').value||'').trim().slice(0,200); S.momMsgAt=Date.now(); if(S.momMsg&&(!H.length||H[H.length-1].msg!==S.momMsg)){ H.push({t:S.momMsgAt,msg:S.momMsg}); if(H.length>200) H.shift(); } save(); render(); drawAdmin(); toast(S.momMsg?'엄마의 한마디를 저장했어요 💚':'엄마의 한마디를 지웠어요'); }
function setPerDay(n){ S.perDay=n; save(); render(); drawAdmin(); toast(`하루 목표: 미션 ${n}개 (${n*QN}문제)`); }
function setMission(n){ n=Math.max(0,Math.min(TOTAL,n)); S.mission=n; clearDraft(); save(); render(); drawAdmin(); toast('미션을 옮겼어요'); }
function setPin(){ const v=($('newpin').value||'').trim(); if(!/^\d{4}$/.test(v)){ toast('숫자 4자리를 넣어 주세요'); return; } S.pinH=hashPin(v,'leader'); save(); drawAdmin(); toast('엄마 비밀번호를 바꿨어요 🔒'); }
function setMom(){ const phone=($('momPhone').value||'').trim(); if(phone&&!/^[0-9+\-\s]{8,15}$/.test(phone)){ toast('전화번호를 확인해 주세요'); return; } try{ localStorage.setItem(MOM_KEY,JSON.stringify({phone})); }catch(e){} toast('저장했어요'); }
function givePet(){ const i=S.pets.length; if(i>=PETS.length){ toast('친구를 모두 만났어요'); return; } S.pets.push(i); if(S.pet<0) S.pet=i; save(); render(); drawAdmin(); toast(`${PETS[i].e} ${jo(PETS[i].n,'을','를')} 줬어요`); }
function giveCoins(){ const v=parseInt(prompt('몇 코인을 줄까요? (빼려면 -50 처럼)','50'),10); if(!v) return; S.coins=Math.max(0,S.coins+v); save(); render(); drawAdmin(); }

/* ════════ 시작 ════════ */
render(); soundBtn();
cloudLoad();
window.addEventListener('keydown',e=>{ if(!QZ||QZ.lock&&e.key!=='Enter') return; if(/^[0-9]$/.test(e.key)) qKey(e.key); else if(e.key==='Backspace') qKey('del'); else if(e.key==='Enter'){ if(QZ.lock){ /* 틀렸을 때 Enter로 넘기기 */ } else qSubmit(); } });
window.addEventListener('resize',()=>{ if(QZ) fitExpr(); });
if(/^#admin$/.test(location.hash)||/[?&]admin\b/.test(location.search)) openAdmin();
</script>
