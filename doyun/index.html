@font-face{font-family:'OngleipStudyWell';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_StudyHard-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;}

/* 좋아하는 글씨체 */
@font-face{font-family:'NexonLv2Gothic';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv2 Gothic Light.woff') format('woff');font-weight:300;font-display:swap;}
@font-face{font-family:'NexonLv2Gothic';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv2 Gothic.woff') format('woff');font-weight:normal;font-display:swap;}
@font-face{font-family:'NexonLv2Gothic';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv2 Gothic Bold.woff') format('woff');font-weight:700;font-display:swap;}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff');font-weight:300;font-display:swap;}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-weight:500;font-display:swap;}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap;}
@font-face{font-family:'OwnglyphYuntaeng';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/온글잎 윤탱체.woff2') format('woff2');font-weight:400;font-display:swap;size-adjust:118%;}
@font-face{font-family:'OngleipKimkonghae';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408@1.0/Ownglyph_kimkonghae.woff2') format('woff2');font-weight:normal;font-display:swap;}
@font-face{font-family:'OngleipTterom';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-4@1.0/Ownglyph_ttaerom-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;size-adjust:135%;}
@font-face{font-family:'MitmiFont';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_1@1.0/Ownglyph_meetme-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;}
@font-face{font-family:'GangwonEducationSaeum';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEduSaeeum_OTFMediumA.woff') format('woff');font-weight:normal;font-display:swap;}

:root{--size:1;--fsc:1;--font:'Jua';--font-t:var(--font);--font-p:var(--font);--tw:normal;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{font-size:calc(17px * var(--size) * var(--fsc));scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;min-height:100vh;font-family:var(--font),'Jua',system-ui,sans-serif;color:var(--ink);background-color:var(--bg);-webkit-tap-highlight-color:transparent;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
/* 글씨 조합: 제목(--font-t) · 본문(--font) · 포인트(--font-p) */
h1,.big,.tab,.pill,.big-btn,.subj b,.sheet h3,.grass-head b,.bigtime,.hq,.qtop,.letters,.abc-word,.ww,.ph-eq{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw)}
.praise,.bn-p,.msg,.hj-mean,.hj-qm,.ph-ko,.toast,.hello .big{font-family:var(--font-p),var(--font),'Jua',sans-serif;font-weight:normal}
.en{font-family:'Andika',system-ui,sans-serif}
.hanja{font-family:'Noto Serif KR','Batang','Noto Serif CJK KR',serif;font-weight:700}

/* ───── 디자인 3종 ───── */
body[data-theme="note"]{--bg:#F6F9FF;--paper:#FFFFFF;--ink:#1F3354;--sub:#6A7FA0;--line:#D5E3F5;--accent:#2F6FDB;--accent-ink:#FFFFFF;--hi:#FFD84D;--ok:#23A065;--no:#E5484D;--carry:#E5484D;--card:#FFFFFF;--shadow:0 3px 0 #D5E3F5;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,#E3ECF8 35px,#E3ECF8 36px)}
body[data-theme="note"]::before{content:"";position:fixed;top:0;bottom:0;left:18px;width:2px;background:#F4B4B4;pointer-events:none}
body[data-theme="chalk"]{--bg:#26433A;--paper:#2E5145;--ink:#F3F1E7;--sub:#B7CABD;--line:#40685A;--accent:#F7D96B;--accent-ink:#26433A;--hi:#F7D96B;--ok:#8FE3A8;--no:#FF9A9A;--carry:#FFB4C2;--card:#2E5145;--shadow:0 3px 0 #1B3129}
body[data-theme="crayon"]{--bg:#FFF0F3;--paper:#FFFFFF;--ink:#3A2E4D;--sub:#8A7A9C;--line:#F6CCD6;--accent:#7B5CFF;--accent-ink:#FFFFFF;--hi:#FFB23F;--ok:#18A97C;--no:#F0506E;--carry:#F0506E;--card:#FFFFFF;--shadow:0 4px 0 #F6CCD6}
body[data-theme="crayon"] .card{border-style:dashed}

/* ───── 상단 ───── */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line);padding:8px 12px 8px 28px}
.toprow,.tabs,.nowbar,main{max-width:780px;margin:0 auto}
.toprow{display:flex;align-items:center;gap:8px}
.grade{display:flex;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px;flex:none}
.grade a{padding:.3rem .85rem;border-radius:999px;text-decoration:none;color:var(--sub);font-size:1rem}
.grade a.on{background:var(--accent);color:var(--accent-ink)}
h1{flex:1;margin:0;font-size:1.3rem;font-weight:normal;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.starbox{display:flex;align-items:center;gap:4px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:.25rem .7rem;font-size:1.05rem}
.iconbtn{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-size:1.15rem}
.nowbar{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:.95rem;color:var(--sub);font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
h1 button{font:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1 button::after{content:" ▾";font-size:.7em;color:var(--sub)}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login[hidden]{display:none}
.login-box{width:100%;max-width:420px;text-align:center}
.login-ico{font-size:3.4rem}
.login h2{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw);font-size:1.8rem;margin:4px 0 16px}
.who-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.who{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 8px;border-radius:22px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow)}
.who-ico{font-size:3.2rem;line-height:1.1}
.who-ico.black-dragon{filter:grayscale(1) brightness(.38) contrast(1.4) drop-shadow(0 0 5px rgba(140,70,220,.85))}
.who-ico.black-cat{filter:grayscale(1) brightness(.4) contrast(1.3)}
.who b{font-weight:normal;font-size:1.5rem;font-family:var(--font-t),var(--font),'Jua',sans-serif}
.who small{color:var(--sub)}
.lp{grid-column:1/-1}
.lp-who{display:flex;align-items:center;justify-content:center;gap:10px}
.lp-who b{font-weight:normal;font-size:1.6rem;font-family:var(--font-t),var(--font),'Jua',sans-serif}
.lp .keypad{max-width:300px}
.sea-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:360px;margin:0 auto}
.sea{aspect-ratio:1;font-size:2.6rem;border-radius:20px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow)}
.sea:active{transform:scale(.94)}
#loginNew[hidden]{display:none}
.tab{flex:1 1 0;white-space:nowrap;padding:.5rem .2rem;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-size:1.02rem;color:var(--sub)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[hidden]{display:none}

main{padding:16px 12px 40px 28px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.center{text-align:center}
.sub{color:var(--sub)}
.big{font-size:1.5rem}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{padding:.45rem .9rem;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-size:1rem}
.pill.on{background:var(--hi);border-color:var(--hi);color:#3A2E1A}
.seg.oneline{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg.oneline::-webkit-scrollbar{display:none}
.seg.oneline .pill{flex:none;white-space:nowrap;padding:.4rem .7rem}
/* 큰 분류(윗줄)는 크게, 그 안의 거르기(아랫줄 .small)는 작은 칩으로 */
.seg:not(.small) .pill{font-size:1.05rem;padding:.5rem 1rem}
.seg.small{gap:5px}
.seg.small .pill{font-size:.82rem;padding:.25rem .65rem;border-width:1.5px;font-family:var(--font),'Jua',sans-serif;font-weight:normal}
.desc{margin:-2px 0 12px;color:var(--sub);font-size:.95rem}
.big-btn{display:block;width:100%;max-width:420px;margin:14px auto 0;padding:.85rem;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:1.3rem;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

/* ───── 시계 ───── */
.clock{width:7.5rem;height:7.5rem;flex:none;display:block}
.ck-face{fill:var(--paper);stroke:var(--ink);stroke-width:4}
.ck-tick{stroke:var(--sub);stroke-width:1.5}
.ck-tick.b{stroke:var(--ink);stroke-width:3}
.ck-num{fill:var(--ink);font-size:17px;text-anchor:middle;dominant-baseline:central;font-family:'Jua',sans-serif}
.ck-h{stroke:var(--ink);stroke-width:8;stroke-linecap:round}
.ck-m{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.ck-s{stroke:var(--no);stroke-width:2;stroke-linecap:round}
.ck-c{fill:var(--ink)}

/* ───── 홈 ───── */
.clockcard{display:flex;align-items:center;gap:18px}
.bigtime{font-size:2.1rem;line-height:1.2;font-variant-numeric:tabular-nums}
.msg{margin-top:12px;font-size:1.15rem;background:color-mix(in srgb,var(--hi) 22%,var(--card))}
.hello{margin-top:12px}
.hello .big{margin-bottom:4px}
.goal{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.goal i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.banner{margin-bottom:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--hi) 30%,var(--card)),var(--card))}
.bn-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.bn-tag{font-size:.9rem;color:var(--sub)}
.bn-p{font-size:1.6rem;line-height:1.35;text-align:center;margin:6px 0}
.bn-m{text-align:center;font-size:.92rem;color:var(--sub);margin:2px 0}
.bn-ex{margin:6px 0 0;padding:8px 10px;border-radius:12px;background:var(--paper);border:2px dashed var(--line);font-size:.92rem;line-height:1.5;color:var(--sub);text-align:center}
.bn-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.bn-btns .pill{font-size:.95rem;padding:.35rem .8rem}
/* 오른쪽 위에 떠 있는 시계 · 스티커 타일 */
.dock{position:fixed;top:128px;right:max(12px, calc((100vw - 780px) / 2 - 104px));z-index:30;display:flex;flex-direction:column;gap:10px}
.dock-t{width:84px;padding:10px 4px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 6px 16px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.dock-t small{font-size:.75rem;color:var(--sub)}
.dock-t i{font-style:normal;font-size:.72rem;color:var(--sub)}
.dock-t b{font-size:1.35rem;font-weight:normal;font-family:var(--font-t),var(--font),'Jua',sans-serif;font-variant-numeric:tabular-nums}
.dk-ico{font-size:1.7rem;line-height:1.1}
@media (max-width:1000px){ main{padding-right:100px} }
.decobar{max-width:780px;margin:6px auto 0;display:flex;align-items:center;justify-content:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.decobar::-webkit-scrollbar{display:none}
.dchip{flex:none;white-space:nowrap;padding:.18rem .55rem;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:.78rem;color:var(--sub);font-family:var(--font),'Jua',sans-serif}
.dchip i{font-style:normal}
.dchip.on{background:var(--hi);border-color:var(--hi);color:#3A2E1A}
.dsep{flex:none;width:1.5px;height:1rem;background:var(--line);margin:0 4px}
.grasscard{margin-top:12px}
.deco{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.deco-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.deco-row b{font-weight:normal;color:var(--sub);min-width:4.5em}
.deco-row .seg{margin:0}
.grass-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px}
.grass-head b{font-weight:normal;font-size:1.2rem}
.grass-wrap{display:flex;gap:4px;overflow-x:auto;padding:2px 2px 4px}
.grass-d,.grass{display:grid;grid-template-rows:repeat(7,24px);gap:4px}
.grass-d{font-size:.78rem;line-height:24px;color:var(--sub);padding-right:4px}
.grass{grid-auto-flow:column;grid-auto-columns:24px}
.g{width:24px;height:24px;border-radius:6px;padding:0;background:color-mix(in srgb,var(--line) 75%,transparent)}
.g.v{background:transparent;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ok) 60%,transparent)}
.g.g1{background:color-mix(in srgb,var(--ok) 30%,var(--paper))}
.g.g2{background:color-mix(in srgb,var(--ok) 55%,var(--paper))}
.g.g3{background:color-mix(in srgb,var(--ok) 80%,var(--paper))}
.g.g4{background:var(--ok)}
.g.t{outline:2px solid var(--accent);outline-offset:1px}
.grass-leg{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:.8rem;color:var(--sub);margin-top:6px}
.grass-leg .g{display:inline-block;cursor:default;width:13px;height:13px;border-radius:3px}
.g.out{visibility:hidden}
.g.fut{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.grass-wrap{justify-content:center}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.subj{text-align:left;padding:18px;border-radius:22px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.subj .ico{font-size:2.6rem;line-height:1}
.subj b{font-size:1.5rem;font-weight:normal}
.subj small{color:var(--sub);font-size:.95rem}
.clocktile{align-items:center;text-align:center;justify-content:center;gap:2px}
.clocktile .clock{width:5rem;height:5rem}
.clocktile .bigtime{font-size:1.25rem;line-height:1.2}
.subj.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px}

/* ───── 연산: 세로셈 모눈판 ───── */
.board{display:flex;flex-direction:column;align-items:center}
.vgrid{display:grid;grid-template-columns:2.6rem repeat(3,4.4rem);align-items:center;justify-items:center;row-gap:4px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:4.4rem 4.4rem;background-position:2.6rem 0;padding:6px 8px 10px;border-radius:12px}
.colname{font-size:.85rem;color:var(--sub)}
.dg{font-size:3rem;line-height:1.2;height:4.2rem;display:flex;align-items:center}
.dg.op{font-size:2.6rem}
.bar{grid-column:1/-1;width:100%;height:4px;background:var(--ink);border-radius:2px;margin:2px 0 6px}
.cell{width:3.7rem;height:4.1rem;border:3px dashed var(--sub);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.9rem;background:var(--paper);transition:transform .15s}
button.cell{padding:0;color:var(--ink)}
.cell.carry{width:2.6rem;height:2.8rem;font-size:1.9rem;border-color:var(--carry);color:var(--carry)}
.cell.active{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
.cell.carry.active{border-color:var(--carry);box-shadow:0 0 0 5px color-mix(in srgb,var(--carry) 25%,transparent)}
.cell.done{border-style:solid;border-color:var(--ok)}
.cell.carry.done{border-color:var(--carry)}
.hint{margin-top:12px;min-height:3.2em;text-align:center;font-size:1.15rem;line-height:1.5}
.hint b{color:var(--no);font-weight:normal;font-size:1.3em}
.hint small{color:var(--sub);font-size:.9em}
.praise{font-size:1.6rem;color:var(--ok)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:14px auto 0}
.key{padding:.6rem 0;font-size:1.9rem;border-radius:16px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.fn{font-size:1.15rem}
.key.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.key.hint{background:var(--hi);border-color:var(--hi);color:#3A2E1A}

.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--accent)}
.dot.ok{background:var(--ok)}
.dot.no{background:var(--no)}
.hq{font-size:2.6rem;display:flex;align-items:center;gap:.3em;flex-wrap:wrap;justify-content:center}
.ansbox{min-width:3.2em;padding:0 .2em;border-bottom:4px solid var(--accent);text-align:center}
.ansbox.ok{color:var(--ok);border-color:var(--ok)}
.ansbox.no{color:var(--no);border-color:var(--no)}

/* ───── 학교수학 ───── */
.sq{text-align:center;font-size:1.45rem;line-height:1.75;width:100%}
.sq .clock{width:11rem;height:11rem;margin:0 auto 8px}
.sq .ansbox{display:inline-block;min-width:2.2em;line-height:1.3;font-size:1.25em}
.sq .big{font-size:2.2rem}
.box{display:inline-block;min-width:1.7em;border:3px dashed var(--sub);border-radius:8px;line-height:1.25}
.unit-tag{display:inline-block;font-size:.85rem;color:var(--sub);border:2px solid var(--line);border-radius:999px;padding:0 .6rem;margin-bottom:6px}
.tbl{border-collapse:collapse;margin:4px auto 12px;font-size:1rem;line-height:1.3}
.tbl th,.tbl td{border:2px solid var(--line);padding:.3rem .5rem;text-align:center;font-weight:normal}
.tbl th{color:var(--sub)}
.gtbl td{width:3.4rem;height:1.9rem;padding:0 .3rem;color:var(--accent);font-size:1.4rem;line-height:1}
.gtbl .ax{border:none;font-size:.85rem}
.gcap{font-size:1rem;color:var(--sub)}
.choice .ct{font-size:1.5rem}

/* ───── 영어 ───── */
.abc-hero{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"let pic" "word word" "spk spk";align-items:center;gap:6px 16px;text-align:center}
.letters{grid-area:let;font-size:4.2rem;line-height:1}
.letters span{font-size:.8em;margin-left:.15em;color:var(--sub)}
.abc-pic{grid-area:pic;font-size:5rem;line-height:1}
.abc-word{grid-area:word;font-size:2.2rem}
.abc-word b{color:var(--no)}
.spk{grid-area:spk;justify-self:center;padding:.5rem 1.4rem;border-radius:999px;background:var(--hi);color:#3A2E1A;font-size:1.15rem}
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.6rem,1fr));gap:8px;margin-top:14px}
.abc-tile{padding:.5rem 0;font-size:1.45rem;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.abc-tile.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.4rem,1fr));gap:10px}
.wcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow)}
.wcard.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.08)}}
.ww{font-size:1.45rem}
.wk{font-size:.95rem;color:var(--sub)}
.emo{font-size:3rem;line-height:1.1}
.num{font-size:2.8rem;line-height:1.1}
.sw{width:3rem;height:3rem;border-radius:50%;border:3px solid var(--ink);display:inline-block}

.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--sub)}
.replay{display:block;margin:4px auto 16px;width:6rem;height:6rem;border-radius:50%;background:var(--hi);font-size:2.8rem;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px;margin:12px auto 0}
.choice{padding:16px 6px;border-radius:18px;background:var(--paper);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:6.2rem;justify-content:center}
.choice .emo{font-size:3.4rem}
.choice.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.choice.no{opacity:.35}
.choice .en{font-size:1.5rem}
.readpic{text-align:center;margin:0 0 14px}
.readpic .emo{font-size:6rem}.readpic .num{font-size:5.5rem}.readpic .sw{width:6rem;height:6rem}
.choices.words{grid-template-columns:1fr}
.choices.words .choice{min-height:0;padding:12px}
.choices.words .en{font-size:1.8rem}
.ph-hero{text-align:center}
.ph-eq{font-size:3.4rem;line-height:1.2}
.ph-eq small{font-size:.45em;color:var(--sub)}
.ph-ko{font-size:1.7rem;margin:2px 0 6px}
.ph-tip{font-size:.95rem;color:var(--sub);margin:6px 0 0}
.c-con{color:var(--accent)}
.c-vow{color:var(--no)}
body[data-theme="chalk"] .c-con{color:#9FD3FF}
.choices.short .choice{min-height:4rem;padding:10px 6px}

/* ───── 한자 ───── */
.era-line{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px}
.era{display:flex;align-items:center;gap:5px;padding:.35rem .75rem;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-size:.95rem;white-space:nowrap}
.era span{display:inline-flex;align-items:center;justify-content:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--line);font-size:.8rem}
.era.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.era.on span{background:var(--accent-ink);color:var(--accent)}
.hs-hero{text-align:center}
.hs-emo{font-size:4rem;line-height:1.1}
.hs-t{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw);font-size:1.9rem;margin-top:4px}
.hs-y{display:inline-block;margin-top:4px;padding:.1rem .7rem;border-radius:999px;background:color-mix(in srgb,var(--hi) 35%,var(--paper));font-size:.95rem}
.hs-d{font-size:1.15rem;line-height:1.6;margin:10px 0 12px}
.hs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:8px;margin-top:12px}
.hs-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:.95rem}
.hs-tile span{font-size:1.8rem}
.hs-tile.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.hs-q{font-size:1.25rem;line-height:1.6}
.hs-qd{background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;text-align:left}
.hs-qe{font-size:3.4rem;line-height:1.1}
.hs-ch .ct{font-size:1.3rem}
.exam-info p{margin:.4rem 0}
.exam-info .tbl{margin:8px 0}
.exam-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.note-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px dashed var(--line)}
.note-e{font-size:2rem;line-height:1}
.lesson{margin-bottom:12px}
.lesson p{margin:.45rem 0;line-height:1.6;font-size:1.1rem}
.ls-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ls-top b{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw);font-size:1.3rem}
.ls-spk{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--hi);font-size:1.1rem}
.ls-big{text-align:center;font-size:1.5rem;line-height:1.6;margin:8px 0;padding:8px;border-radius:14px;background:var(--paper);border:2px dashed var(--line)}
.ls-big u{color:var(--no);text-decoration:none;font-weight:bold}
.ls-clock .clock{width:10rem;height:10rem;margin:0 auto}
.dan{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0;text-align:center;font-size:1.15rem}
.dan span{padding:6px;border-radius:10px;background:var(--paper);border:2px solid var(--line)}
.lesson .tbl{margin:8px auto}
.ko-q{font-size:1.35rem;line-height:1.7}
.ko-q ~ .choices .ct{font-size:1.1rem;line-height:1.4}
.ko-q ~ .choices.words .choice{padding:10px 12px}
.ko-para{text-align:left;font-size:1.1rem;line-height:1.7;background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.lvtabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lvtab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:18px;background:var(--card);border:3px solid var(--line);box-shadow:var(--shadow)}
.lvtab b{font-weight:var(--tw);font-family:var(--font-t),var(--font),'Jua',sans-serif;font-size:1.6rem;line-height:1.1}
.lvtab small{color:var(--sub);font-size:.85rem}
.lvtab.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.lvtab.on b{color:var(--accent)}
.hj-hero{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;text-align:center}
.hj-big{font-size:7rem;line-height:1}
.hj-mean{font-size:2.3rem}
.hj-hero .spk{margin-top:8px}
.hj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.6rem,1fr));gap:8px;margin-top:14px}
.hj-tile{padding:.35rem 0;font-size:1.9rem;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.hj-tile.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hj-q{font-size:6.5rem;text-align:center;line-height:1.1;margin:0 0 6px}
.hj-qm{font-size:2.4rem;text-align:center;margin:0 0 4px}
.choice .hanja{font-size:3.2rem;line-height:1.1}
.choice .ct.km{font-size:1.6rem}

/* ───── 스티커 ───── */
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2rem,1fr));gap:10px;margin-top:14px}
.stk{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:var(--paper);border:3px solid var(--hi)}
.stk.empty{border:3px dashed var(--line);color:var(--line);font-size:1.4rem}

/* ───── 설정 / 관리자 ───── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 8px;font-weight:normal;font-size:1.4rem}
.lbl{margin:14px 0 6px;color:var(--sub)}
.danger{margin-top:18px;color:var(--no);text-decoration:underline;font-size:.95rem}
.linkbtn{margin-top:16px;color:var(--sub);text-decoration:underline;font-size:.95rem}
.pinrow{display:flex;justify-content:center;gap:14px;margin:14px 0 4px}
.pinrow span{width:20px;height:20px;border-radius:50%;border:3px solid var(--sub)}
.pinrow span.f{background:var(--accent);border-color:var(--accent)}
.scroll-x{overflow-x:auto}
.logtbl{width:100%;min-width:420px;font-size:.92rem;margin:0}
.logtbl td.z{color:var(--line)}
.logtbl tr.today td,.logtbl tr.today th{background:color-mix(in srgb,var(--hi) 20%,transparent)}
.inrow{display:flex;gap:6px}
.inrow input{flex:1;min-width:0;font:inherit;padding:.45rem .7rem;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.inrow .pill{flex:none}

.grade-o{position:fixed;left:50%;top:42%;width:10rem;height:10rem;margin:-5rem 0 0 -5rem;border:13px solid #E5484D;border-radius:50%;z-index:45;pointer-events:none;animation:oPop .9s ease-out forwards}
@keyframes oPop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.06);opacity:.95}75%{transform:scale(1);opacity:.9}100%{opacity:0}}
.skipbtn{display:block;margin:12px auto 0;padding:.45rem 1.1rem;border-radius:999px;border:2px dashed var(--line);background:var(--paper);color:var(--sub);font-size:1rem}
.adminbtn{margin-top:18px;padding:.45rem 1.1rem;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--sub);font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:999px;z-index:60;font-size:1.1rem;white-space:nowrap}
.burst{position:fixed;pointer-events:none;font-size:2rem;z-index:40;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}

@media (max-width:520px){
  header{padding-left:22px}
  main{padding-left:22px;padding-right:76px}
  .dock{top:150px;right:8px;gap:6px}
  .dock-t{width:60px;padding:6px 2px;border-radius:14px}
  .dock-t b{font-size:1.05rem}
  .dk-ico{font-size:1.3rem}
  body[data-theme="note"]::before{left:12px}
  h1{font-size:1.1rem}
  .grade a{padding:.3rem .6rem}
  html{font-size:calc(15px * var(--size) * min(var(--fsc),1.1))}
  header{position:static;padding-top:6px;padding-bottom:6px}
  .dchip{font-size:.74rem;padding:.15rem .45rem}
  .dchip i{display:none}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .tab{padding:.35rem .1rem;font-size:.84rem;border-radius:12px;overflow:hidden;text-overflow:ellipsis}
  main{padding-top:10px}
  .card{padding:14px}
  .vgrid{grid-template-columns:1.8rem repeat(3,3.3rem);background-size:3.3rem 3.3rem;background-position:1.8rem 0;padding:4px 6px 6px}
  .dg{font-size:2.3rem;height:3.2rem}
  .dg.op{font-size:2rem}
  .cell{width:2.8rem;height:3.1rem;font-size:2.1rem;border-width:2px}
  .cell.carry{width:2rem;height:2.2rem;font-size:1.4rem}
  .hint{margin-top:6px;min-height:2.4em;font-size:1.05rem}
  .hq{font-size:2.1rem}
  .keypad{gap:6px;margin-top:10px}
  .key{padding:.4rem 0;font-size:1.6rem}
  .sq .clock{width:9rem;height:9rem}
  .choice{min-height:4.6rem;padding:10px 6px}
  .choice .emo{font-size:2.8rem}
  .hj-q{font-size:5rem}
  .hj-big{font-size:5.5rem}
  .replay{width:4.8rem;height:4.8rem;font-size:2.2rem}
  .bn-btns{gap:4px}
  .bn-btns .pill{font-size:.85rem;padding:.3rem .6rem}
  .bn-p{font-size:1.35rem}
  .subjects{gap:8px}
  .subj{padding:12px}
  .subj .ico{font-size:2rem}
  .subj b{font-size:1.25rem}
  .subj small{font-size:.82rem}
  .clocktile .clock{width:4.2rem;height:4.2rem}
  .clocktile .bigtime{font-size:1.05rem}
  .clock{width:6rem;height:6rem}
  .bigtime{font-size:1.7rem}
  .sq{font-size:1.3rem}
  .gtbl td{width:2.8rem}
}
/* ───── 초4: 분수 · 도형 · 그래프 ───── */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-size:.9em}
.frac>i{font-style:normal;padding:0 .18em;min-width:1em;text-align:center}
.frac>i:first-child{border-bottom:.12em solid currentColor}
.frac .ansbox{min-width:1.3em;padding:0 .1em;border:2px dashed var(--accent);border-radius:6px;font-size:1em;line-height:1.2}
.mixed{white-space:nowrap}
.shape{display:block;width:100%;max-width:17rem;height:auto;margin:0 auto 6px;overflow:visible}
.shape .sp{fill:color-mix(in srgb,var(--accent) 12%,var(--paper));stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.shape .sd{stroke:var(--no);stroke-width:2;stroke-dasharray:5 4}
.shape text{fill:var(--ink);font-size:15px;text-anchor:middle;dominant-baseline:central;font-family:'Jua',sans-serif}
.shape .sq-mark{fill:none;stroke:var(--ink);stroke-width:1.5}
.shape .tk{stroke:var(--no);stroke-width:2.5}
.lgraph{display:block;width:100%;max-width:24rem;height:auto;margin:0 auto 4px}
.lgraph .gl{stroke:var(--line);stroke-width:1}
.lgraph .ax{stroke:var(--ink);stroke-width:1.5}
.lgraph .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.lgraph circle{fill:var(--paper);stroke:var(--accent);stroke-width:2.5}
.lgraph text{fill:var(--sub);font-size:11px;text-anchor:middle;dominant-baseline:central;font-family:'Jua',sans-serif}
.lgraph .wave{fill:none;stroke:var(--ink);stroke-width:1.5}
.keypad .wide{grid-column:1/-1}
.okx .choice{min-height:4.2rem}
.okx .ct{font-size:2rem}
/* 60초 게임 */
.gm-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:1.1rem;margin-bottom:6px}
.gm-bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:12px}
.gm-bar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.gm-bar i.low{background:var(--no)}
.combo{color:var(--no)}
/* 국어: 긴 글 읽기 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:10px}
.book{text-align:left;display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);position:relative}
.book .bk-e{font-size:2rem;line-height:1.1}
.book b{font-weight:normal;font-size:1.12rem;font-family:var(--font-t),var(--font),'Jua',sans-serif}
.book small{color:var(--sub);font-size:.82rem}
.book .done{position:absolute;top:8px;right:10px;font-size:.85rem;color:var(--ok)}
.book.read{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.gtag{display:inline-block;align-self:flex-start;font-size:.75rem;padding:0 .5rem;border-radius:999px;background:color-mix(in srgb,var(--hi) 35%,var(--paper));color:var(--ink)}
.passage{margin-bottom:12px}
.pa-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.pa-top h2{margin:2px 0 0;font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw);font-size:1.45rem}
.pa-body p{font-size:1.12rem;line-height:1.85;margin:.5rem 0;text-indent:.6em}
.pa-body p .pn{display:inline-block;text-indent:0;min-width:1.4em;color:var(--accent);font-weight:bold}
.pa-body.poem p{text-indent:0;text-align:center;margin:.15rem 0}
.pa-body.poem p.gap{height:.7rem}
.pa-body u{text-decoration:underline;text-decoration-color:var(--no);text-decoration-thickness:2px;text-underline-offset:4px}
.pa-by{color:var(--sub);font-size:.9rem;text-align:right;margin:4px 0 0}
.rq-q{font-size:1.18rem;line-height:1.6;margin:0 0 8px}
.rq-q b{color:var(--accent);font-weight:normal}
.rq .choices{grid-template-columns:1fr;max-width:none}
.rq .choice{min-height:0;padding:10px 12px;align-items:flex-start;text-align:left}
.rq .choice .ct{font-size:1.05rem;line-height:1.5}
.rv{padding:10px 0;border-bottom:2px dashed var(--line);text-align:left;font-size:1rem;line-height:1.6}
.rv:last-child{border-bottom:none}
.today-read{display:flex;align-items:center;gap:12px;text-align:left;width:100%;margin-top:12px}
.today-read .bk-e{font-size:2.6rem}
/* 한국사: 이야기책 */
.story{text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--hi) 16%,var(--card)),var(--card))}
.st-cover{font-size:.95rem;color:var(--sub)}
.st-title{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw);font-size:1.6rem;margin:2px 0 6px}
.st-pic{font-size:5.2rem;line-height:1.15;margin:6px 0;letter-spacing:.05em}
.st-text{font-family:var(--font-p),var(--font),'Jua',sans-serif;font-size:1.3rem;line-height:1.85;text-align:left;margin:8px 4px 12px;min-height:7.5em;word-break:keep-all}
.st-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st-nav .pill{font-size:1.05rem}
.st-dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.st-dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.st-dots span.on{background:var(--accent)}
.word-hint{display:inline-block;margin:0 2px;padding:0 .35rem;border-radius:6px;background:color-mix(in srgb,var(--hi) 35%,transparent)}
/* 영어: 철자 · 문장 만들기 */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:3.4rem;margin:8px 0 12px;padding:8px;border-radius:14px;border:2px dashed var(--line);background:var(--paper)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{min-width:2.8rem;padding:.45rem .7rem;border-radius:12px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.45rem}
.tile.used{visibility:hidden}
.slots .tile{background:color-mix(in srgb,var(--accent) 14%,var(--paper));border-color:var(--accent)}
.tile.w{font-size:1.2rem}
.sent-card{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);margin-bottom:8px}
.sent-card .emo{font-size:2.2rem}
.sent-card .en{font-size:1.3rem;display:block}
.sent-card small{color:var(--sub);font-size:.95rem}

  {id:'dangun', lv:9, era:'gojo', e:'🐻', t:'곰이 사람이 된 이야기', sub:'고조선을 세운 단군왕검', pages:[
    ['☁️👑','아주아주 먼 옛날, 하늘나라 임금 환인에게는 환웅이라는 아들이 있었어요. 환웅은 늘 땅 아래 사람들이 사는 세상을 내려다보며 생각했어요. “저 사람들을 널리 이롭게 해 주고 싶구나.”'],
    ['🌬️🌧️☁️','환웅은 바람을 다스리는 풍백, 비를 다스리는 우사, 구름을 다스리는 운사와 함께 태백산으로 내려왔어요. 그리고 곡식, 목숨, 병, 착하고 나쁜 일 같은 사람들의 360여 가지 일을 돌보았어요.'],
    ['🐻🐯','어느 날 곰과 호랑이가 찾아와 간절히 빌었어요. “저희도 사람이 되고 싶어요!” 환웅은 쑥 한 줌과 마늘 스무 개를 주며 말했어요. “이것만 먹고 백 날 동안 햇빛을 보지 않으면 사람이 될 것이다.”'],
    ['🕳️🐻','캄캄한 동굴 속에서 호랑이는 참지 못하고 뛰쳐나가 버렸어요. 하지만 곰은 쓰디쓴 쑥과 매운 마늘을 먹으며 꾹 참았어요. 그리고 스무하루 만에 아름다운 여자, 웅녀가 되었어요.'],
    ['👶👑','웅녀는 환웅과 결혼해 아들을 낳았어요. 그 아들이 바로 단군왕검이에요. 단군왕검은 자라서 우리 역사의 첫 나라, <b>고조선</b>을 세웠어요.'],
    ['🤝📜','이 이야기는 아주 오래전부터 전해 오는 건국 이야기예요. ‘널리 사람을 이롭게 하라’는 <b>홍익인간</b>의 뜻은 지금도 우리나라 교육이 꿈꾸는 모습으로 남아 있어요.']],
    quiz:[['단군왕검이 세운 나라는?','고조선',['고구려','신라','고려']],['곰이 사람이 되려고 먹은 것은?','쑥과 마늘',['사과와 배','떡과 꿀','쌀과 보리']],['‘널리 사람을 이롭게 하라’는 뜻의 말은?','홍익인간',['해동성국','훈민정음','8조법']]]},
  {id:'jumong', lv:9, era:'samguk', e:'🏹', t:'알에서 태어난 활 잘 쏘는 아이', sub:'고구려를 세운 주몽', pages:[
    ['🥚✨','옛날 부여라는 나라에 유화 부인이 살았어요. 어느 날 유화 부인이 커다란 알을 하나 낳았어요. 사람들은 놀라서 알을 버렸지만, 짐승들이 알을 피해 가고 새들이 날개로 따뜻하게 덮어 주었어요.'],
    ['👶🏹','얼마 뒤 알을 깨고 씩씩한 사내아이가 나왔어요. 아이는 일곱 살 때부터 활을 만들어 쏘았는데, 쏘는 것마다 백 번 쏘면 백 번 다 맞혔어요. 그래서 ‘활 잘 쏘는 사람’이라는 뜻의 <b>주몽</b>이라고 불렀어요.'],
    ['😠🐎','부여 왕의 아들들은 주몽이 너무 뛰어나서 샘을 냈어요. “주몽을 그냥 두면 큰일 나겠어!” 위험을 느낀 주몽은 믿을 만한 친구들과 함께 몰래 부여를 떠났어요.'],
    ['🌊🐟🐢','쫓아오는 군사들을 피해 달리다 보니 커다란 강이 앞을 막았어요. 주몽이 외쳤어요. “나는 하늘 임금의 자손이다! 길을 열어 다오!” 그러자 물고기와 자라들이 떠올라 다리를 만들어 주었어요.'],
    ['🏯🎉','무사히 강을 건넌 주몽은 졸본이라는 곳에 새 나라를 세웠어요. 그 나라가 바로 <b>고구려</b>예요. 주몽은 고구려의 첫 임금 동명성왕이 되었어요.']],
    quiz:[['주몽이라는 이름의 뜻은?','활 잘 쏘는 사람',['말 잘 타는 사람','노래 잘하는 사람','힘센 사람']],['강을 건널 때 다리가 되어 준 것은?','물고기와 자라',['곰과 호랑이','새들','나무들']],['주몽이 세운 나라는?','고구려',['백제','신라','가야']]]},
  {id:'hyeokgeose', lv:9, era:'samguk', e:'🥚', t:'하얀 말이 두고 간 알', sub:'신라를 세운 박혁거세', pages:[
    ['⛰️👴👴','아주 먼 옛날, 지금의 경주 땅에는 여섯 마을이 있었어요. 여섯 마을의 촌장들은 한자리에 모여 의논했어요. “우리를 잘 이끌어 줄 훌륭한 임금님이 있으면 좋겠소.”'],
    ['🐴✨','그때 우물가 숲에 신기한 빛이 비치더니, 하얀 말이 무릎을 꿇고 절을 하고 있었어요. 촌장들이 다가가자 하얀 말은 길게 울며 하늘로 날아올랐어요.'],
    ['🥚🟣','말이 있던 자리에는 커다란 자줏빛 알이 하나 놓여 있었어요. 알을 깨 보니 얼굴이 환한 사내아이가 나왔어요. 아이를 씻기자 몸에서 빛이 나고 새와 짐승들이 춤을 추었대요.'],
    ['👑🌏','사람들은 아이의 이름을 ‘세상을 밝게 다스린다’는 뜻의 <b>혁거세</b>라고 지었어요. 알이 박처럼 생겼다고 해서 성은 ‘박’이 되었지요.'],
    ['🏯','혁거세가 자라자 여섯 마을 사람들은 그를 임금으로 모셨어요. 이렇게 시작된 나라가 천 년 가까이 이어진 <b>신라</b>예요.']],
    quiz:[['박혁거세가 세운 나라는?','신라',['고구려','백제','발해']],['알을 두고 하늘로 날아간 동물은?','하얀 말',['검은 소','파란 용','빨간 새']],['‘박’이라는 성은 무엇에서 왔을까요?','박처럼 생긴 알',['박 넝쿨이 있는 집','박수 소리','박물관']]]},
  {id:'gwanggaeto', lv:9, era:'samguk', e:'🐎', t:'땅을 넓힌 씩씩한 임금', sub:'광개토대왕과 커다란 비석', pages:[
    ['👦🏹','고구려에 담덕이라는 왕자가 있었어요. 담덕은 어릴 때부터 몸집이 크고 말타기와 활쏘기를 아주 잘했어요. 그리고 겨우 열여덟 살에 고구려의 임금이 되었어요.'],
    ['🐎🐎🐎','젊은 임금은 날쌘 기마 부대를 이끌고 북쪽과 서쪽의 넓은 땅으로 나아갔어요. 싸우는 곳마다 이겨서 고구려의 땅은 점점 넓어졌어요.'],
    ['🛡️🤝','남쪽의 신라가 왜군에게 공격받자 도와 달라고 부탁했어요. 임금은 군사 5만 명을 보내 신라를 구해 주었어요. 고구려는 동북아시아에서 가장 힘센 나라가 되었어요.'],
    ['🗺️👑','사람들은 이 임금을 ‘나라 땅을 크게 넓힌 임금’이라는 뜻으로 <b>광개토대왕</b>이라고 불러요.'],
    ['🗿📜','광개토대왕이 세상을 떠난 뒤, 아들 <b>장수왕</b>은 아버지의 일을 기록한 커다란 비석을 세웠어요. 높이가 6미터가 넘는 이 비석은 지금도 중국 땅에 남아 있어요.']],
    quiz:[['광개토대왕은 어느 나라 임금이었나요?','고구려',['백제','신라','고려']],['광개토대왕이 가장 크게 한 일은?','나라 땅을 크게 넓혔어요',['한글을 만들었어요','거북선을 만들었어요','불국사를 지었어요']],['광개토대왕릉비를 세운 사람은?','장수왕',['주몽','세종대왕','왕건']]]},
  {id:'euljimundeok', lv:9, era:'samguk', e:'⚔️', t:'살수에 넘친 물', sub:'을지문덕과 살수 대첩', pages:[
    ['🏰😤','중국을 통일한 수나라는 고구려까지 차지하고 싶었어요. 수나라 임금은 백만 명이 넘는 어마어마한 군사를 이끌고 고구려로 쳐들어왔어요.'],
    ['🧠🗺️','고구려에는 꾀가 많은 장군 <b>을지문덕</b>이 있었어요. 을지문덕은 적의 진지에 직접 찾아가 수나라 군사들이 배고프고 지쳐 있다는 것을 알아냈어요.'],
    ['🏃‍♂️🏃‍♂️','을지문덕은 싸우다가 일부러 지는 척 뒤로 물러났어요. 수나라 군사들은 신이 나서 평양 가까이까지 쫓아왔지만, 먹을 것이 떨어져 더 힘들어졌어요.'],
    ['✉️😏','을지문덕은 적장에게 시 한 편을 보냈어요. “그대의 꾀는 하늘의 이치를 다 알고, 싸움에 이겨 공이 이미 높으니, 만족함을 알고 그만두는 게 어떠한가.” 칭찬하는 척 놀리는 시였어요.'],
    ['🌊🎉','화가 난 적들이 되돌아가다 살수(지금의 청천강)를 건널 때, 고구려군이 한꺼번에 공격했어요. 살아서 돌아간 수나라 군사는 아주 적었어요. 612년에 있었던 이 싸움을 <b>살수 대첩</b>이라고 해요.']],
    quiz:[['을지문덕은 어느 나라 장군인가요?','고구려',['신라','백제','조선']],['을지문덕이 크게 이긴 싸움은?','살수 대첩',['귀주 대첩','한산도 대첩','행주 대첩']],['을지문덕이 적장에게 보낸 것은?','놀리는 시',['금은보화','항복 편지','맛있는 음식']]]},
  {id:'seondeok', lv:9, era:'samguk', e:'👸', t:'향기 없는 모란꽃', sub:'지혜로운 선덕여왕과 첨성대', pages:[
    ['👧📚','신라 진평왕에게는 아들이 없고 덕만 공주가 있었어요. 덕만 공주는 어릴 때부터 무척 똑똑했어요.'],
    ['🌸🖼️','어느 날 당나라에서 모란꽃 그림과 꽃씨를 보내왔어요. 그림을 본 공주가 말했어요. “이 꽃은 향기가 없을 거예요.” “어떻게 아느냐?” “그림에 벌과 나비가 한 마리도 없잖아요.”'],
    ['🌱🌺','꽃씨를 심어 보니 정말로 예쁜 꽃이 피었지만 향기가 나지 않았어요. 사람들은 공주의 지혜에 깜짝 놀랐어요.'],
    ['👑','덕만 공주는 신라의 첫 여왕, <b>선덕여왕</b>이 되었어요. 여왕은 가난한 백성을 돌보고, 황룡사 9층 목탑 같은 큰 절도 세웠어요.'],
    ['🔭⭐','선덕여왕 때 경주에는 돌을 차곡차곡 쌓은 <b>첨성대</b>도 세워졌어요. 별과 하늘을 살펴 날씨와 농사 때를 알려고 만든 것으로 알려져 있어요. 첨성대는 지금도 경주에 서 있어요.']],
    quiz:[['신라의 첫 여왕은?','선덕여왕',['진성여왕','유화 부인','신사임당']],['공주가 모란꽃에 향기가 없다고 생각한 까닭은?','그림에 벌과 나비가 없어서',['꽃이 작아서','꽃 색깔이 빨개서','꽃씨가 없어서']],['선덕여왕 때 경주에 세운 것은?','첨성대',['자격루','거북선','수원 화성']]]},
  {id:'tongil', lv:9, era:'nambuk', e:'🐉', t:'바다의 용이 된 임금', sub:'김유신, 문무왕과 삼국 통일', pages:[
    ['⚔️🐴','신라에는 어릴 때부터 화랑으로 몸과 마음을 닦은 장군 <b>김유신</b>이 있었어요. 김유신은 친구이자 뒷날 임금이 되는 김춘추와 함께 삼국을 하나로 만들 꿈을 키웠어요.'],
    ['🤝⛵','신라는 당나라와 힘을 합쳐 660년에 백제를, 668년에 고구려를 무너뜨렸어요. 그런데 당나라는 그 땅을 자기들이 차지하려고 했어요.'],
    ['🛡️🔥','김춘추의 아들 <b>문무왕</b>은 당나라군과 끈질기게 싸웠어요. 매소성과 기벌포 싸움에서 이겨 당나라군을 몰아내고, 676년 삼국 통일을 이루었어요.'],
    ['🌊🐉','문무왕은 세상을 떠나기 전에 말했어요. “내가 죽으면 동해 바다에 묻어 다오. 용이 되어 왜적으로부터 나라를 지키겠다.”'],
    ['🪨🌅','그래서 사람들은 경주 앞바다의 바위, <b>대왕암</b>에 문무왕을 모셨다고 전해요. 지금도 아침이면 대왕암 위로 해가 떠올라요.']],
    quiz:[['삼국 통일을 완성한 임금은?','문무왕',['광개토대왕','근초고왕','왕건']],['삼국 통일에 큰 공을 세운 화랑 출신 장군은?','김유신',['을지문덕','계백','강감찬']],['문무왕이 죽어서 되겠다고 한 것은?','바다의 용',['하늘의 별','큰 호랑이','높은 산']]]},
  {id:'balhae', lv:8, era:'nambuk', e:'🐯', t:'고구려의 꿈을 이은 나라', sub:'대조영과 발해', pages:[
    ['😢🏯','고구려가 무너진 뒤, 많은 고구려 사람들이 당나라에 끌려가 힘들게 살았어요. 그중에 고구려 장수 출신 <b>대조영</b>이 있었어요.'],
    ['🏃‍♂️🏔️','대조영은 고구려 사람들과 말갈 사람들을 이끌고 당나라를 빠져나왔어요. 뒤쫓아 온 당나라군을 천문령에서 크게 물리쳤어요.'],
    ['🏯🎉','698년, 대조영은 동모산에 새 나라를 세웠어요. 이 나라가 <b>발해</b>예요. 발해 사람들은 스스로 고구려를 이은 나라라고 생각했어요.'],
    ['🌏✨','발해는 점점 커져서 옛 고구려 땅을 거의 되찾았어요. 이웃 나라들은 발해를 ‘바다 동쪽의 크게 번성한 나라’라는 뜻으로 <b>해동성국</b>이라고 불렀어요.'],
    ['🗺️','이때 남쪽에는 통일 신라, 북쪽에는 발해가 있었어요. 그래서 이 시대를 <b>남북국 시대</b>라고 불러요.']],
    quiz:[['발해를 세운 사람은?','대조영',['대왕암','왕건','주몽']],['발해를 부르던 ‘바다 동쪽의 번성한 나라’라는 말은?','해동성국',['홍익인간','조선','대한제국']],['통일 신라와 발해가 함께 있던 시대는?','남북국 시대',['삼국 시대','선사 시대','근대']]]},
  {id:'jangbogo', lv:8, era:'nambuk', e:'🚢', t:'바다의 왕', sub:'장보고와 청해진', pages:[
    ['🌊👦','통일 신라의 바닷가 섬마을에 궁복이라는 소년이 살았어요. 궁복은 헤엄을 잘 치고 창과 활 솜씨가 뛰어났어요. 뒷날 이 소년은 <b>장보고</b>라는 이름으로 불렸어요.'],
    ['⛵🇨🇳','장보고는 당나라로 건너가 군인이 되어 이름을 떨쳤어요. 그런데 그곳에서 해적에게 잡혀 와 노비로 팔리는 신라 사람들을 보고 가슴이 아팠어요.'],
    ['🏝️🏰','신라로 돌아온 장보고는 임금에게 말했어요. “바다를 지키는 기지를 세우게 해 주십시오.” 그리고 지금의 완도에 <b>청해진</b>을 세웠어요.'],
    ['🏴‍☠️❌','장보고의 군사들은 바다의 해적을 모조리 물리쳤어요. 바다가 안전해지자 신라, 당나라, 일본을 오가는 배들이 청해진에 모였어요.'],
    ['⚓💰','장보고는 세 나라를 잇는 바닷길 무역을 이끌었어요. 그래서 사람들은 장보고를 ‘바다의 왕’, 해상왕이라고 불러요.']],
    quiz:[['장보고가 완도에 세운 기지는?','청해진',['첨성대','규장각','집현전']],['장보고가 바다에서 물리친 것은?','해적',['상어','몽골군','거란군']],['장보고를 부르는 다른 이름은?','해상왕',['녹두장군','해동성국','성웅']]]},
  {id:'wanggeon', lv:9, era:'goryeo', e:'🏰', t:'다시 하나가 된 나라', sub:'왕건과 고려', pages:[
    ['💔🗺️','통일 신라가 약해지자 나라가 다시 셋으로 갈라졌어요. 신라, 견훤이 세운 후백제, 궁예가 세운 후고구려가 서로 다투었어요. 이때를 <b>후삼국 시대</b>라고 해요.'],
    ['⛵👨','송악(지금의 개성)의 바다 상인 집안에서 태어난 <b>왕건</b>은 궁예 밑에서 뛰어난 장수가 되었어요. 특히 배를 이끌고 바다에서 싸우는 데 뛰어났어요.'],
    ['😠👑','그런데 궁예는 점점 사나워져서 백성과 신하를 괴롭혔어요. 신하들은 마음이 넓은 왕건을 새 임금으로 모셨어요. 918년, 왕건은 나라 이름을 <b>고려</b>라고 지었어요.'],
    ['🤝','왕건은 싸우기보다 마음을 얻으려고 애썼어요. 신라의 임금은 스스로 고려에 나라를 넘겼고, 936년 고려는 후백제를 물리쳐 <b>후삼국을 통일</b>했어요.'],
    ['🌏','발해가 무너지자 왕건은 발해 사람들도 따뜻하게 받아들였어요. 고려(Korea)라는 이름은 오늘날 우리나라의 영어 이름 ‘코리아’가 되었어요.']],
    quiz:[['고려를 세운 사람은?','왕건',['궁예','견훤','이성계']],['‘코리아’라는 이름은 어느 나라 이름에서 왔을까요?','고려',['고조선','조선','신라']],['신라, 후백제, 후고구려가 다투던 시대는?','후삼국 시대',['삼국 시대','남북국 시대','근대']]]},
  {id:'seohui', lv:8, era:'goryeo', e:'🗣️', t:'말로 이긴 싸움', sub:'서희의 담판', pages:[
    ['🐎🐎😤','993년, 북쪽의 거란이 80만 대군이라며 고려에 쳐들어왔어요. 거란 장수 소손녕은 “고려가 차지한 옛 고구려 땅을 내놓아라!” 하고 큰소리쳤어요.'],
    ['😰👑','겁이 난 신하들 가운데는 땅을 떼어 주자는 사람도 있었어요. 그때 <b>서희</b>가 나섰어요. “제가 적장을 만나 보겠습니다.”'],
    ['🗣️🤔','서희는 당당하게 말했어요. “고려는 고구려를 이은 나라요. 나라 이름도 고려이고, 도읍도 고구려의 평양이오. 오히려 거란 땅이 옛 고구려 땅이오.”'],
    ['🧠🤝','서희는 거란이 정말 바라는 것이 고려가 송나라와 친하게 지내지 않는 것임을 알아챘어요. “길을 막고 있는 여진을 몰아내면 거란과도 오갈 수 있소.”'],
    ['🏯🎉','거란군은 싸우지 않고 물러났고, 고려는 오히려 압록강 동쪽의 <b>강동 6주</b>를 얻었어요. 칼 대신 말로 나라를 지킨 이 일을 ‘서희의 담판’이라고 해요.']],
    quiz:[['서희가 담판을 지은 나라는?','거란',['몽골','수나라','일본']],['서희의 담판으로 고려가 얻은 땅은?','강동 6주',['대마도','청해진','한양']],['서희는 무엇으로 나라를 지켰나요?','말(대화)',['활','거북선','성벽']]]},
  {id:'palman', lv:9, era:'goryeo', e:'📚', t:'8만 장의 나무 책', sub:'팔만대장경', pages:[
    ['🐎🔥','고려 때 몽골군이 쳐들어와 온 나라를 휩쓸었어요. 몽골군은 절과 마을을 불태웠고, 백성들은 무척 괴로웠어요.'],
    ['🙏','고려 사람들은 마음을 모았어요. “부처님의 힘을 빌려 나라를 지키자!” 그래서 부처님의 가르침을 나무판에 새기기로 했어요.'],
    ['🪵🌊','먼저 좋은 나무를 골라 바닷물에 담갔다가 소금물에 쪘어요. 그래야 나무가 뒤틀리거나 썩지 않거든요. 그다음 햇볕 없는 곳에서 천천히 말렸어요.'],
    ['✍️','사람들은 한 글자 새길 때마다 절을 세 번씩 했다고 전해요. 그렇게 16년 동안 새긴 나무판이 8만 장이 넘었어요. 그래서 <b>팔만대장경</b>이라고 불러요.'],
    ['🏯🌍','팔만대장경은 지금 합천 <b>해인사</b>의 장경판전에 보관되어 있어요. 바람이 잘 통하게 지은 이 건물 덕분에 750년이 넘도록 잘 남아 있고, 유네스코 세계 기록 유산이 되었어요.']],
    quiz:[['팔만대장경을 만들게 된 까닭은?','부처님의 힘으로 몽골을 물리치려고',['돈을 벌려고','한글을 알리려고','놀이를 하려고']],['팔만대장경이 보관된 절은?','해인사',['불국사','황룡사','석굴암']],['팔만대장경은 무엇에 새겼나요?','나무판',['돌','금속','종이']]]},
  {id:'sejong', lv:9, era:'joseon', e:'📝', t:'백성을 위한 스물여덟 글자', sub:'세종대왕과 훈민정음', pages:[
    ['😢📜','옛날 우리나라 사람들은 말은 우리말로 하면서 글은 어려운 중국 글자, 한자로 썼어요. 한자는 너무 어려워서 백성들은 억울한 일이 있어도 글로 쓸 수 없었어요.'],
    ['👑💭','조선의 넷째 임금 <b>세종대왕</b>은 그런 백성들을 보며 마음 아파했어요. “누구나 쉽게 배워 날마다 편하게 쓸 수 있는 글자를 만들어야겠다.”'],
    ['👄🔍','세종대왕은 밤낮으로 소리를 연구했어요. 자음은 소리 낼 때 입과 혀의 모양을 본떠 만들고, 모음은 하늘(·), 땅(ㅡ), 사람(ㅣ)을 본떠 만들었어요.'],
    ['🔤🎉','1443년, 드디어 스물여덟 글자가 완성되었어요. 이름은 ‘백성을 가르치는 바른 소리’라는 뜻의 <b>훈민정음</b>. 1446년에 온 백성에게 널리 알렸어요.'],
    ['💡⏰','세종대왕은 집현전에서 학자들과 함께 공부하고, 장영실 같은 과학자를 아껴 해시계와 측우기도 만들게 했어요. 한글이 널리 알려진 날을 기념하는 날이 10월 9일 <b>한글날</b>이에요.']],
    quiz:[['훈민정음의 뜻은?','백성을 가르치는 바른 소리',['바다 동쪽의 번성한 나라','널리 사람을 이롭게 하라','나라를 지키는 소리']],['모음 ‘·, ㅡ, ㅣ’가 본뜬 것은?','하늘, 땅, 사람',['해, 달, 별','산, 강, 바다','입, 코, 귀']],['한글날은 언제일까요?','10월 9일',['3월 1일','8월 15일','5월 5일']]]},
  {id:'jangyeongsil', lv:9, era:'joseon', e:'⏰', t:'스스로 울리는 시계', sub:'과학자 장영실', pages:[
    ['🔧👦','장영실은 동래(지금의 부산)에서 관청의 노비로 태어났어요. 하지만 무엇이든 뚝딱뚝딱 잘 만들고 고치는 솜씨가 소문이 날 만큼 뛰어났어요.'],
    ['👑🤝','이 소문을 들은 세종대왕은 신분을 따지지 않고 장영실을 궁궐로 불렀어요. 그리고 벼슬을 주어 마음껏 발명하게 했어요.'],
    ['💧🔔','장영실은 물이 흘러내리는 힘으로 때가 되면 저절로 종과 북을 울리는 물시계, <b>자격루</b>를 만들었어요. 사람이 밤새 지켜보지 않아도 시간을 알 수 있었지요.'],
    ['☀️⌛','해 그림자로 시간을 알려 주는 해시계 <b>앙부일구</b>도 만들어 길거리에 두었어요. 글을 모르는 백성도 볼 수 있게 시각을 동물 그림으로 나타냈어요.'],
    ['☔📏','비가 온 양을 재는 <b>측우기</b>도 이 무렵 만들어졌어요. 비의 양을 알면 농사를 더 잘 지을 수 있었어요. 장영실은 조선을 대표하는 과학자가 되었어요.']],
    quiz:[['장영실이 만든, 저절로 시각을 알려 주는 물시계는?','자격루',['측우기','거중기','첨성대']],['장영실을 궁궐로 불러 아낀 임금은?','세종대왕',['정조','태조 이성계','문무왕']],['측우기는 무엇을 재는 기구인가요?','비가 온 양',['바람의 세기','땅의 넓이','별의 위치']]]},
  {id:'yisunsin', lv:9, era:'joseon', e:'🐢', t:'열두 척의 배', sub:'이순신과 거북선', pages:[
    ['🔥⛵','1592년, 일본이 조선에 쳐들어왔어요. <b>임진왜란</b>이 시작된 거예요. 일본군은 순식간에 한양까지 올라왔어요.'],
    ['🐢⚓','하지만 바다에는 <b>이순신</b> 장군이 있었어요. 이순신은 전쟁이 나기 전부터 배를 고치고 군사를 훈련했어요. 등에 뾰족한 쇠못을 박은 튼튼한 배, <b>거북선</b>도 만들었어요.'],
    ['🌊🦅','한산도 앞바다에서 이순신은 배들을 학의 날개처럼 펼쳐 적을 둘러싸는 ‘학익진’으로 일본 수군을 크게 물리쳤어요. 이것이 <b>한산도 대첩</b>이에요.'],
    ['😢⛵','그러나 이순신은 억울한 누명을 쓰고 벼슬에서 쫓겨났어요. 그사이 조선 수군은 크게 져서 배가 겨우 열두 척만 남았어요.'],
    ['🗣️⚔️','다시 돌아온 이순신은 말했어요. “신에게는 아직 열두 척의 배가 남아 있습니다.” 그리고 물살이 거센 울돌목에서 130척이 넘는 적을 물리쳤어요. 이것이 <b>명량 대첩</b>이에요.'],
    ['🙏🇰🇷','이순신은 마지막 싸움인 노량 해전에서 적의 총알을 맞았어요. “싸움이 급하다. 나의 죽음을 알리지 마라.” 나라를 끝까지 지킨 이순신을 우리는 ‘성웅’이라 불러요.']],
    quiz:[['이순신이 만든, 등에 쇠못을 박은 배는?','거북선',['판옥선','뗏목','유람선']],['명량 대첩 때 남아 있던 조선의 배는 몇 척?','12척',['3척','100척','1척']],['이순신이 싸운 전쟁은?','임진왜란',['6·25 전쟁','살수 대첩','병자호란']]]},
  {id:'jeongyakyong', lv:8, era:'joseon', e:'🏗️', t:'무거운 돌을 번쩍!', sub:'정약용과 수원 화성', pages:[
    ['👑🏯','조선의 임금 <b>정조</b>는 백성이 살기 좋은 새 도시를 꿈꾸었어요. 그래서 수원에 튼튼하고 아름다운 성, <b>수원 화성</b>을 쌓기로 했어요.'],
    ['🪨😓','성을 쌓으려면 커다란 돌을 수없이 옮겨야 했어요. 사람의 힘만으로는 오래 걸리고 다치는 사람도 많았어요.'],
    ['📖💡','정조는 젊은 학자 <b>정약용</b>에게 방법을 찾아보라고 했어요. 정약용은 중국에서 들어온 과학책을 열심히 공부했어요.'],
    ['⚙️🏗️','정약용은 도르래 여러 개를 이용해 작은 힘으로 무거운 물건을 들어 올리는 <b>거중기</b>를 만들었어요. 덕분에 적은 힘으로 큰 돌을 번쩍번쩍 들어 올렸어요.'],
    ['🏰🌍','거중기 덕분에 10년 걸릴 거라던 공사가 2년 9개월 만에 끝났어요. 수원 화성은 지금 유네스코 세계 유산이 되었어요.']],
    quiz:[['정약용이 만든, 도르래로 무거운 돌을 드는 기계는?','거중기',['자격루','측우기','거북선']],['거중기를 이용해 쌓은 성은?','수원 화성',['행주산성','남한산성','경복궁']],['수원 화성을 쌓게 한 임금은?','정조',['세종대왕','태조','고종']]]},
  {id:'kimjeongho', lv:8, era:'joseon', e:'🗺️', t:'발로 그린 지도', sub:'김정호와 대동여지도', pages:[
    ['🗺️❓','조선 후기의 <b>김정호</b>는 지도를 좋아했어요. 그런데 그때 지도들은 서로 달랐고 틀린 곳도 많았어요.'],

      ['③문단의 ‘마음이 무거웠어요’에 담긴 서준이의 마음은?','미안하고 걱정되는 마음',['신나고 기쁜 마음','배가 부른 마음','졸리고 피곤한 마음'],'‘마음이 무겁다’는 걱정이나 미안함으로 편하지 않다는 뜻이에요.',3],
      ['서준이가 하린이에게 마음을 전한 방법은?','쪽지와 지우개 조각을 주었어요.',['선생님께 말씀드렸어요.','전화를 걸었어요.','새 필통을 사 주었어요.'],'④문단을 보세요.',4],
      ['이 이야기에서 배울 수 있는 것으로 가장 알맞은 것은?','잘못했을 때는 용기 내어 사과해요.',['물건은 절대 빌려주지 않아요.','화가 나면 크게 소리쳐요.','친구와는 말하지 않는 게 좋아요.'],'서준이가 먼저 사과해서 두 사람이 다시 웃게 되었어요.',0]]},
  {id:'hallway', g:'opinion', e:'🚶', t:'복도에서는 천천히 걸어요', paras:[
    '쉬는 시간이 되면 복도는 금세 시끌벅적해져요. 화장실에 가는 친구, 다른 반에 놀러 가는 친구로 가득하지요. 그런데 그중에는 복도를 운동장처럼 뛰어다니는 친구들도 있어요. 저는 복도에서 뛰지 말고 천천히 걸어야 한다고 생각해요.',
    '첫째, 복도에서 뛰면 다칠 수 있어요. 복도는 좁고 모퉁이가 많아서 앞에서 오는 사람을 미리 보기 어려워요. 뛰다가 부딪히면 넘어져 머리를 다치거나 이가 부러질 수도 있어요.',
    '둘째, 다른 사람에게 [[피해]]를 줘요. 쿵쿵 뛰는 소리는 아직 수업 중인 반을 방해해요. 또 뛰는 친구를 피하려다 들고 있던 물건을 떨어뜨리는 친구도 생겨요.',
    '셋째, 천천히 걷는 습관은 나를 지켜 줘요. 학교에서 걷는 습관이 들면 길거리나 계단에서도 조심하게 돼요.',
    '복도는 모두가 함께 쓰는 곳이에요. 나와 친구들의 안전을 위해 오늘부터 복도에서는 오른쪽으로 천천히 걸어요.'],
    qs:[['글쓴이의 주장은 무엇인가요?','복도에서는 뛰지 말고 천천히 걸어야 한다.',['쉬는 시간을 늘려야 한다.','복도를 넓게 만들어야 한다.','운동장에서 뛰면 안 된다.'],'①문단 끝과 ⑤문단에 주장이 나와요.',1],
      ['글쓴이가 든 근거가 아닌 것은?','복도에서 뛰면 달리기 실력이 는다.',['뛰면 다칠 수 있다.','다른 사람에게 피해를 준다.','걷는 습관이 나를 지켜 준다.'],'②③④문단의 근거를 다시 살펴봐요.',0],
      ['③문단의 ‘피해’와 뜻이 가장 비슷한 것은?','손해나 괴로움',['도움','칭찬','선물'],'‘피해’는 다른 사람 때문에 손해를 입거나 괴로움을 당하는 것이에요.',3],
      ['이 글처럼 주장하는 글을 쓸 때 가장 중요한 것은?','주장에 알맞은 까닭(근거)을 드는 것',['재미있는 흉내 내는 말을 많이 쓰는 것','등장인물을 많이 만드는 것','날씨를 자세히 쓰는 것'],'주장하는 글은 ‘주장 + 근거’로 이루어져요.',0]]},
  {id:'bangjeonghwan', g:'bio', e:'🎈', t:'어린이를 사랑한 방정환', paras:[
    '5월 5일 어린이날에는 누구나 신이 나요. 그런데 100여 년 전에는 어린이날도 없었고, ‘어린이’라는 말도 널리 쓰이지 않았어요. 아이들을 ‘애놈’, ‘어린것’처럼 낮추어 부르는 일이 많았지요.',
    '방정환은 1899년 서울에서 태어났어요. 어릴 때 집안이 어려워져 고생을 많이 했지만, 책 읽기와 이야기하기를 무척 좋아했어요.',
    '어른이 된 방정환은 ‘어린이’라는 말을 널리 알렸어요. 어린이는 ‘늙은이’, ‘젊은이’처럼 한 사람으로 [[존중]]받아야 할 소중한 사람이라는 뜻을 담았지요.',
    '1923년, 방정환은 친구들과 ‘색동회’를 만들고 어린이날 행사를 열었어요. 같은 해에 어린이를 위한 잡지 『어린이』도 펴냈어요. 이 잡지에는 동화, 동요, 재미있는 이야기가 가득했어요.',
    '방정환은 “어린이를 내려다보지 마시고 쳐다보아 주시오.”라고 말했어요. 어린이를 사랑하고 아낀 방정환의 마음은 오늘날 어린이날에 고스란히 남아 있어요.'],
    qs:[['방정환이 한 일로 알맞지 않은 것은?','한글을 만들었다.',['‘어린이’라는 말을 널리 알렸다.','어린이날 행사를 열었다.','잡지 『어린이』를 펴냈다.'],'한글은 세종대왕이 만들었어요.',0],
      ['③문단의 ‘존중’의 뜻으로 알맞은 것은?','높이어 귀하게 대함',['무시하고 모른 척함','크게 꾸짖음','함께 놀아 줌'],'‘존중’은 높이어 귀중하게 대한다는 뜻이에요.',3],
      ['방정환과 친구들이 만든 모임의 이름은?','색동회',['집현전','화랑도','신간회'],'④문단에 나와요.',4],
      ['“어린이를 내려다보지 마시고 쳐다보아 주시오.”에 담긴 뜻은?','어린이를 소중한 사람으로 대해 달라.',['어린이는 키가 작다.','어린이는 하늘을 좋아한다.','어린이를 혼내야 한다.'],'어린이를 낮추지 말고 존중해 달라는 말이에요.',5]]},
  {id:'birds', g:'info', e:'🕊️', t:'계절 따라 오가는 철새', paras:[
    '해마다 계절이 바뀌면 먼 곳에서 우리나라를 찾아오는 새들이 있어요. 이렇게 계절에 따라 사는 곳을 옮기는 새를 ‘철새’라고 해요. 한곳에 머물러 사는 참새나 까치 같은 새는 ‘텃새’라고 하지요.',
    '봄에 남쪽 따뜻한 나라에서 날아와 우리나라에서 여름을 나는 새를 ‘여름 철새’라고 해요. 제비, 뻐꾸기, 꾀꼬리가 여름 철새예요. 여름 철새는 우리나라에서 알을 낳고 새끼를 키운 뒤, 가을이 되면 다시 남쪽으로 떠나요.',
    '가을에 북쪽 추운 곳에서 날아와 우리나라에서 겨울을 나는 새는 ‘겨울 철새’예요. 기러기, 두루미, 청둥오리 같은 새들이지요. 이 새들이 사는 북쪽은 겨울에 너무 추워 먹이를 찾기 어렵기 때문에 [[비교적]] 따뜻한 우리나라로 오는 거예요.',
    '철새들은 수천 킬로미터를 쉬지 않고 날아가기도 해요. 해와 별의 위치, 땅의 모양을 보고 길을 찾는다고 알려져 있어요.',
    '요즘은 철새들이 쉬어 가는 갯벌과 습지가 줄어들고 있어요. 먼 길을 날아온 철새들이 편히 쉬어 갈 수 있도록 자연을 지켜야 해요.'],
    qs:[['제비는 어떤 새인가요?','여름 철새',['겨울 철새','텃새','바닷새'],'②문단: 제비는 여름 철새예요.',2],
      ['겨울 철새가 우리나라로 오는 까닭은?','북쪽은 너무 추워 먹이를 찾기 어려워서',['우리나라가 더 시원해서','알을 낳을 둥지가 없어서','길을 잃어서'],'③문단을 보세요.',3],
      ['텃새끼리 바르게 묶은 것은?','참새, 까치',['제비, 뻐꾸기','기러기, 두루미','꾀꼬리, 청둥오리'],'①문단: 참새, 까치는 텃새예요.',1],
      ['③문단의 ‘비교적’의 뜻으로 알맞은 것은?','다른 것에 견주어 보아서',['아주 조금도','언제나 똑같이','처음으로'],'북쪽에 견주어 보면 우리나라가 따뜻하다는 뜻이에요.',3]]},
  {id:'kimjang', g:'life', e:'🥬', t:'할머니 댁 김장하는 날', by:'○월 ○일 토요일 · 바람이 차가운 날', paras:[
    '오늘은 할머니 댁에서 김장을 하는 날이었다. 아침 일찍 도착했더니 마당에 소금에 절인 배추가 산처럼 쌓여 있었다. 할머니는 어젯밤부터 배추를 절이셨다고 했다.',
    '나는 엄마와 함께 빨간 양념을 배춧잎 사이사이에 골고루 발랐다. 처음에는 양념이 자꾸 뭉쳐서 어려웠는데, 할머니께서 “잎을 한 장씩 들추고 쓱쓱 문질러야지.” 하고 알려 주셨다. 그대로 해 보니 훨씬 쉬웠다.',
    '한참 하다 보니 허리도 아프고 손도 [[얼얼했다]]. 그래도 식구들이 모두 모여 웃고 떠들며 일하니 힘든 줄 몰랐다. 삼촌은 김치통 나르기를 맡았고, 사촌 동생은 배추 꼬리를 모으는 일을 했다.',
    '김장이 끝나자 할머니께서 따끈한 수육을 삶아 주셨다. 방금 버무린 김치에 수육을 싸서 먹었더니 정말 꿀맛이었다.',
    '돌아오는 차 안에서 김치통을 안고 생각했다. 겨우내 먹을 김치에는 할머니의 정성과 우리 가족의 웃음이 함께 담겨 있다. 내년 김장 때도 꼭 돕고 싶다.'],
    qs:[['글쓴이가 김장할 때 한 일은?','배춧잎 사이에 양념을 발랐다.',['배추를 소금에 절였다.','김치통을 날랐다.','배추 꼬리를 모았다.'],'②문단: 나는 엄마와 함께 양념을 발랐어요.',2],
      ['③문단의 ‘얼얼했다’는 어떤 느낌일까요?','맵거나 차가워서 아리고 따끔한 느낌',['보들보들 부드러운 느낌','따뜻하고 포근한 느낌','간지러운 느낌'],'‘얼얼하다’는 맵거나 차거나 맞아서 아린 느낌이에요.',3],
      ['이 글은 어떤 종류의 글인가요?','겪은 일과 느낌을 쓴 일기',['물건을 파는 광고','주장하는 글','설명서'],'날짜와 날씨, 겪은 일과 생각이 들어 있어요.',0],
      ['글쓴이가 마지막에 느낀 마음으로 알맞은 것은?','가족과 함께해서 뿌듯하고 따뜻한 마음',['힘들어서 다시는 하기 싫은 마음','김치가 싫어진 마음','혼나서 속상한 마음'],'⑤문단: 내년에도 꼭 돕고 싶다고 했어요.',5]]},
  {id:'firefighter', g:'letter', e:'🚒', t:'소방관 아저씨께', by:'20○○년 ○월 ○일 · 행복초등학교 4학년 김민재 올림', paras:[
    '소방관 아저씨께. 안녕하세요? 저는 행복초등학교 4학년 김민재예요. 지난주 우리 아파트에 불이 났을 때 달려와 주신 소방관 아저씨께 꼭 감사 인사를 드리고 싶어서 편지를 써요.',
    '그날 밤, 아래층에서 매캐한 연기가 올라와서 우리 가족은 너무 무서웠어요. 엄마가 젖은 수건으로 제 코와 입을 막아 주셨고, 우리는 몸을 낮추고 계단으로 내려갔어요.',
    '밖에 나와 보니 소방차 여러 대가 벌써 와 있었어요. 아저씨들은 무거운 장비를 메고 연기 속으로 [[망설임]] 없이 들어가셨어요. 그 모습을 보니 무서운 마음이 조금씩 사라졌어요.',
    '다행히 다친 사람 없이 불이 꺼졌어요. 뜨거운 불 앞에서 얼마나 힘드셨을까 생각하니 마음이 뭉클했어요. 저도 커서 아저씨들처럼 다른 사람을 돕는 사람이 되고 싶어요.',
    '늘 건강하시고 다치지 마세요. 정말 고맙습니다!'],
    qs:[['민재가 편지를 쓴 까닭은?','불을 꺼 준 소방관께 감사하려고',['소방관이 되는 방법을 물으려고','아파트 이사를 알리려고','불조심 포스터를 부탁하려고'],'①문단에 편지를 쓴 까닭이 나와요.',1],
      ['불이 났을 때 민재네 가족이 한 일로 알맞은 것은?','젖은 수건으로 코와 입을 막고 몸을 낮춰 계단으로 내려갔다.',['엘리베이터를 타고 내려갔다.','창문을 열고 기다렸다.','불을 직접 끄려고 물을 뿌렸다.'],'②문단: 불이 나면 엘리베이터 대신 계단으로 가요.',2],
      ['③문단의 ‘망설임 없이’와 뜻이 가장 비슷한 것은?','머뭇거리지 않고',['천천히 쉬면서','무서워하며','몰래 숨어서'],'망설이다 = 이리저리 생각만 하고 머뭇거리다',3],
      ['편지의 짜임에서 ‘20○○년 ○월 ○일, 김민재 올림’은 무엇에 해당할까요?','쓴 날짜와 쓴 사람',['받을 사람','첫인사','끝인사'],'편지 끝에는 쓴 날짜와 쓴 사람을 써요.',0]]},
  {id:'camel', g:'info', e:'🐫', t:'사막의 배, 낙타', paras:[
    '낮에는 뜨겁고 밤에는 추운 사막. 모래바람이 불고 물도 거의 없는 곳이에요. 이런 사막에서 무거운 짐을 지고 먼 길을 가는 동물이 있어요. 바로 ‘사막의 배’라고 불리는 낙타예요.',
    '낙타의 등에 있는 혹에는 물이 아니라 지방이 들어 있어요. 먹이를 구하기 어려울 때 이 지방을 에너지로 써요. 그래서 오랫동안 먹지 못해도 [[견딜]] 수 있어요.',
    '낙타는 물을 한 번에 아주 많이 마실 수 있어요. 목이 몹시 마를 때는 몇 분 만에 100리터 가까이 마시기도 해요. 그리고 땀을 잘 흘리지 않아 몸속의 물을 아껴 써요.',
    '모래바람을 막는 몸도 가졌어요. 속눈썹이 길고 두 줄로 나 있어 모래가 눈에 들어가지 않고, 콧구멍을 꽉 닫을 수도 있어요. 발바닥은 넓고 푹신해서 모래 속에 잘 빠지지 않아요.',
    '이렇게 낙타는 사막에서 살아가기 알맞은 몸을 가지고 있어요. 사막 사람들에게 낙타는 짐을 나르고 젖을 주는 고마운 친구예요.'],
    qs:[['낙타의 혹에 들어 있는 것은?','지방',['물','모래','공기'],'②문단: 혹에는 물이 아니라 지방이 있어요.',2],
      ['낙타의 몸과 그 까닭을 바르게 짝 지은 것은?','넓고 푹신한 발바닥 - 모래에 잘 빠지지 않는다',['긴 속눈썹 - 물을 많이 마신다','혹 - 모래바람을 막는다','닫히는 콧구멍 - 짐을 많이 나른다'],'④문단을 다시 읽어 봐요.',4],
      ['②문단의 ‘견딜’의 기본 모양은?','견디다',['견디','견딜다','견들다'],'국어사전에는 기본 모양 ‘견디다’로 실려 있어요.',2],
      ['이 글의 제목을 ‘사막의 배, 낙타’라고 한 까닭으로 알맞은 것은?','사막에서 짐을 싣고 먼 길을 가기 때문에',['낙타가 배를 타고 다녀서','낙타 배가 볼록해서','사막에 강이 많아서'],'①문단: 배가 짐을 나르듯 낙타가 사막에서 짐을 날라요.',1]]},
  {id:'saltmill', g:'folk', e:'🧂', t:'바닷물은 왜 짤까?', paras:[
    '옛날 어느 임금님에게 신기한 맷돌이 있었어요. “나와라, 쌀!” 하고 돌리면 쌀이 쏟아지고, “나와라, 금!” 하면 금이 나왔어요. 멈추게 하려면 “그쳐라!” 하고 말하면 됐지요.',
    '욕심 많은 도둑이 이 소문을 들었어요. 도둑은 몰래 궁궐에 들어가 맷돌을 훔쳐서 배를 타고 멀리 달아났어요.',
    '바다 한가운데에 이른 도둑은 생각했어요. ‘무엇을 달라고 할까? 그래, 요즘 제일 귀한 소금을 잔뜩 만들어 팔면 큰 부자가 될 거야!’ 도둑은 신이 나서 맷돌을 돌렸어요. “나와라, 소금!”',
    '하얀 소금이 쉴 새 없이 쏟아졌어요. 배 안에 소금이 가득 차올랐지만 도둑은 멈추는 말을 몰랐어요. “그만! 이제 됐어! 멈춰!” 아무리 외쳐도 소금은 [[하염없이]] 쏟아졌어요.',
    '결국 배는 소금의 무게를 이기지 못하고 바닷속으로 가라앉고 말았어요. 사람들은 그 맷돌이 지금도 바다 밑에서 빙글빙글 돌며 소금을 만들고 있어서 바닷물이 짠 거라고 이야기한답니다.'],
    qs:[['맷돌을 멈추게 하는 말은?','그쳐라!',['멈춰!','그만!','됐어!'],'①문단에 나와요. 도둑은 이 말을 몰랐어요.',1],
      ['배가 가라앉은 까닭은?','멈추는 말을 몰라 소금이 너무 많이 나와서',['폭풍이 불어서','임금님이 쫓아와서','맷돌이 깨져서'],'④⑤문단을 보세요.',4],
      ['④문단의 ‘하염없이’와 뜻이 가장 비슷한 말은?','끝없이 계속',['조금씩 천천히','딱 한 번만','갑자기 뚝'],'‘하염없이’는 그치지 않고 계속되는 모양이에요.',4],
      ['이 이야기가 들려주는 교훈으로 알맞은 것은?','지나친 욕심은 화를 부른다.',['소금은 몸에 좋다.','맷돌은 무겁다.','바다는 넓다.'],'욕심 많은 도둑이 결국 모든 것을 잃었어요.',0]]},
  {id:'gyeongju', g:'travel', e:'🛕', t:'천 년의 도시, 경주', paras:[
    '지난 토요일, 우리 가족은 신라의 수도였던 경주로 여행을 떠났다. 경주는 도시 전체가 박물관이라고 불릴 만큼 옛 유적이 많은 곳이다.',
    '맨 처음 간 곳은 불국사였다. 돌계단인 청운교와 백운교를 올라가니 다보탑과 석가탑이 나란히 서 있었다. 다보탑은 모양이 화려하고, 석가탑은 단순하면서도 [[단정해]] 보였다. 두 탑이 서로 달라서 더 멋있었다.',
    '다음으로 토함산에 있는 석굴암에 갔다. 유리창 너머로 부처님이 동해를 바라보며 앉아 계셨다. 돌을 쌓아 굴을 만들고 그 안에 부처님을 모셨다니, 신라 사람들의 솜씨가 정말 놀라웠다.',
    '저녁에는 첨성대를 보러 갔다. 불빛을 받은 첨성대는 생각보다 작았지만, 1,300년이 넘도록 그 자리에 서 있다는 것이 신기했다.',
    '경주 여행을 하며 신라 사람들이 얼마나 뛰어났는지 알 수 있었다. 다음에는 국립경주박물관에 가서 금관도 꼭 보고 싶다.'],
    qs:[['글쓴이가 여행한 차례로 알맞은 것은?','불국사 → 석굴암 → 첨성대',['첨성대 → 불국사 → 석굴암','석굴암 → 첨성대 → 불국사','불국사 → 첨성대 → 석굴암'],'기행문은 간 곳의 차례(여정)를 따라 써요.',0],
      ['불국사에서 본 두 탑은?','다보탑과 석가탑',['첨성대와 석굴암','청운교와 백운교','황룡사 9층 목탑과 석가탑'],'②문단을 보세요.',2],
      ['②문단의 ‘단정해’와 뜻이 가장 비슷한 것은?','깔끔하고 바르게',['어지럽고 복잡하게','크고 무섭게','낡고 오래되게'],'‘단정하다’는 옷차림이나 모양이 깔끔하고 바르다는 뜻이에요.',2],
      ['기행문에 들어가는 세 가지를 바르게 고른 것은?','여정, 견문, 감상',['주장, 근거, 결론','인물, 사건, 배경','처음 인사, 할 말, 끝인사'],'여정(간 곳), 견문(보고 들은 것), 감상(생각과 느낌)이에요.',0]]},
  {id:'moon', g:'info', e:'🌙', t:'달의 얼굴이 바뀌어요', paras:[
    '밤하늘의 달은 날마다 모양이 조금씩 바뀌어요. 가느다란 눈썹 같다가, 반쪽이 되었다가, 동그란 쟁반처럼 되기도 하지요. 왜 이렇게 모양이 바뀌는 걸까요?',
    '달은 스스로 빛을 내지 못해요. 햇빛을 받아 되비치기 때문에 밝게 보이는 거예요. 달이 지구 둘레를 돌면서 햇빛을 받는 부분 가운데 우리 눈에 보이는 부분이 달라져서 모양이 바뀌어 보여요.',
    '음력 2~3일 무렵에는 저녁 서쪽 하늘에 오른쪽이 가늘게 빛나는 초승달이 떠요. 7~8일 무렵에는 오른쪽 반이 밝은 상현달, 15일 무렵에는 동그란 보름달이 돼요.',
    '보름달이 지나면 달은 다시 조금씩 줄어들어요. 22~23일 무렵에는 왼쪽 반이 밝은 하현달, 27~28일 무렵에는 왼쪽이 가늘게 빛나는 그믐달이 돼요.',
    '이렇게 달의 모양은 약 30일(한 달)마다 [[되풀이돼요]]. 옛날 사람들은 달의 모양을 보고 날짜를 셈했는데, 이것이 바로 ‘음력’이에요.'],
    qs:[['달이 밝게 보이는 까닭은?','햇빛을 받아 되비치기 때문에',['스스로 빛을 내기 때문에','별빛을 모아서','지구가 빛을 비춰서'],'②문단: 달은 스스로 빛을 내지 못해요.',2],
      ['음력 15일 무렵에 볼 수 있는 달은?','보름달',['초승달','상현달','그믐달'],'③문단을 보세요.',3],
      ['달의 모양이 바뀌는 차례로 알맞은 것은?','초승달 → 상현달 → 보름달 → 하현달 → 그믐달',['보름달 → 초승달 → 상현달 → 그믐달 → 하현달','그믐달 → 하현달 → 초승달 → 보름달 → 상현달','상현달 → 초승달 → 보름달 → 그믐달 → 하현달'],'③④문단에 날짜 차례로 나와요.',0],
      ['⑤문단의 ‘되풀이돼요’와 뜻이 비슷한 말은?','반복돼요',['사라져요','멈춰요','커져요'],'같은 일이 자꾸 일어난다는 뜻이에요.',5]]},
  {id:'breakfast', g:'opinion', e:'🍚', t:'아침밥을 꼭 먹어요', paras:[
    '아침마다 “늦었어!” 하며 밥을 거르고 학교에 가는 친구들이 많아요. 조사해 보면 초등학생 열 명 가운데 한두 명은 아침을 자주 거른다고 해요. 하지만 저는 아침밥을 꼭 먹어야 한다고 생각해요.',
    '첫째, 아침밥은 공부하는 힘을 줘요. 우리 뇌는 밤새 쉬고 나면 배가 고픈 상태가 돼요. 아침을 먹으면 뇌에 에너지가 전해져서 수업 시간에 집중이 잘돼요.',
    '둘째, 아침밥을 먹으면 건강해져요. 아침을 거르면 점심때 너무 배가 고파서 [[허겁지겁]] 많이 먹게 되고, 배탈이 나기 쉬워요. 세끼를 제때 먹어야 몸이 튼튼해져요.',
    '셋째, 가족과 함께하는 시간이 생겨요. 아침 식탁에 모여 오늘 할 일을 이야기하면 하루를 기분 좋게 시작할 수 있어요.',
    '아침밥을 먹을 시간이 없다면 10분만 일찍 일어나 보세요. 밥이 어렵다면 과일이나 우유라도 먹어요. 튼튼한 몸과 맑은 머리를 위해 아침밥을 꼭 먹어요.'],
    qs:[['글쓴이의 주장은?','아침밥을 꼭 먹어야 한다.',['점심을 많이 먹어야 한다.','아침에 늦잠을 자야 한다.','우유만 마셔야 한다.'],'①문단 마지막 문장과 ⑤문단에 주장이 나와요.',1],
      ['‘아침밥은 공부하는 힘을 준다’의 까닭은?','뇌에 에너지가 전해져 집중이 잘되어서',['밥이 맛있어서','학교에 늦지 않아서','친구를 만날 수 있어서'],'②문단을 보세요.',2],
      ['③문단의 ‘허겁지겁’은 어떤 모양일까요?','몹시 급하게 서두르는 모양',['아주 천천히 먹는 모양','조금만 먹는 모양','웃으며 먹는 모양'],'‘허겁지겁’은 조급한 마음으로 몹시 서두르는 모양이에요.',3],
      ['⑤문단에서 글쓴이가 제안한 방법이 아닌 것은?','아침을 먹지 말고 간식을 많이 먹는다.',['10분 일찍 일어난다.','과일을 먹는다.','우유라도 마신다.'],'⑤문단에 나온 방법을 확인해요.',5]]},
  {id:'rainpoem', g:'poem', e:'🌧️', t:'빗방울 음악회', poem:true, paras:[
    '톡 톡 톡','장독 뚜껑 위에서','빗방울이 작은북을 쳐요','',
    '똑 똑 똑','처마 끝에 매달려','빗방울이 [[실로폰]]을 쳐요','',
    '퐁 퐁 퐁','웅덩이에 뛰어들며','빗방울이 큰북을 쳐요','',
    '우산 속의 나는','귀를 쫑긋 세운','하나뿐인 관객'],
    qs:[['이 시에서 빗방울을 무엇에 빗대어 나타냈나요?','악기를 연주하는 사람',['춤추는 무용수','달리기 선수','요리사'],'빗방울이 작은북, 실로폰, 큰북을 친다고 했어요.',0],
      ['‘톡 톡 톡’, ‘똑 똑 똑’, ‘퐁 퐁 퐁’ 같은 말을 무엇이라고 할까요?','소리를 흉내 내는 말',['모양을 흉내 내는 말','높임 표현','반대말'],'소리를 흉내 내어 시를 생생하게 해 줘요.',0],
      ['빗방울이 큰북을 치는 곳은?','웅덩이',['장독 뚜껑','처마 끝','우산 위'],'셋째 연을 보세요.',0],
      ['마지막 연에서 ‘나’는 어떤 마음일까요?','빗소리를 즐겁게 듣고 있다.',['비가 와서 짜증이 난다.','우산을 잃어버려 속상하다.','무서워서 숨고 싶다.'],'귀를 쫑긋 세운 관객이 되어 음악회를 즐겨요.',0]]},
  {id:'recycle', g:'info', e:'♻️', t:'페트병의 두 번째 인생', paras:[
    '우리가 마신 음료수 페트병은 어디로 갈까요? 잘 버리면 새 물건으로 다시 태어나지만, 아무렇게나 버리면 쓰레기 산이 되거나 바다로 흘러가 물고기와 바다거북을 아프게 해요.',
    '페트병을 제대로 버리려면 네 단계를 기억하면 돼요. 먼저 안에 남은 음료를 비우고 물로 헹궈요. 다음으로 겉에 붙은 비닐 라벨을 떼어 내요. 그리고 병을 꾹 눌러 부피를 줄이고, 뚜껑을 닫아서 내놓아요.',
    '특히 투명한 페트병은 다른 플라스틱과 따로 모아 버려야 해요. 투명 페트병은 깨끗하게 모이면 가느다란 실로 뽑아낼 수 있어서 옷이나 가방으로 다시 만들어지거든요. 페트병 몇 개면 티셔츠 한 벌을 만들 수 있다고 해요.',
    '이렇게 버린 물건을 다시 쓸 수 있게 만드는 것을 ‘재활용’이라고 해요. 재활용을 하면 새로 만드는 데 드는 자원과 에너지를 [[아낄]] 수 있어요.',
    '오늘 마신 페트병 하나부터 제대로 버려 볼까요? 작은 습관이 지구를 지키는 큰 힘이 돼요.'],
    qs:[['페트병을 버리는 방법으로 알맞지 않은 것은?','라벨을 붙인 채로 버린다.',['안을 비우고 헹군다.','눌러서 부피를 줄인다.','투명 페트병은 따로 모은다.'],'②문단: 라벨은 떼어 내야 해요.',2],
      ['깨끗한 투명 페트병으로 만들 수 있는 것은?','옷이나 가방',['유리컵','종이책','나무 의자'],'③문단을 보세요.',3],
      ['‘재활용’의 뜻으로 알맞은 것은?','버린 물건을 다시 쓸 수 있게 만드는 것',['물건을 아주 많이 사는 것','쓰레기를 태우는 것','물건을 새로 만드는 것'],'④문단에 뜻이 나와요.',4],
      ['④문단의 ‘아낄’과 바꾸어 쓸 수 있는 말은?','절약할',['낭비할','버릴','잃어버릴'],'아끼다 = 함부로 쓰지 않다 = 절약하다',4]]},

    const s=document.createElement('span'); s.className='burst'; s.textContent=['⭐','✨','🌟'][i%3];

let actx;
function beep(ok){
  if(!settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type='triangle'; o.connect(g); g.connect(actx.destination);
    if(ok){ o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+0.1); }
    else { o.frequency.setValueAtTime(240,t); o.frequency.setValueAtTime(180,t+0.12); }
    g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    o.start(t); o.stop(t+0.36);
  }catch(e){}
}

function clockSVG(h,m,s){
  let t='';
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30, b=i%5===0, r1=b?82:88;
    t+=`<line class="ck-tick${b?' b':''}" x1="${(Math.sin(a)*r1).toFixed(1)}" y1="${(-Math.cos(a)*r1).toFixed(1)}" x2="${(Math.sin(a)*93).toFixed(1)}" y2="${(-Math.cos(a)*93).toFixed(1)}"/>`;
  }
  for(let i=1;i<=12;i++){ const a=i*Math.PI/6; t+=`<text class="ck-num" x="${(Math.sin(a)*67).toFixed(1)}" y="${(-Math.cos(a)*67).toFixed(1)}">${i}</text>`; }
  const sec=s||0, ha=(h%12)*30+m*0.5+sec/120, ma=m*6+sec*0.1;
  return `<svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="${h%12||12}시 ${m}분"><circle class="ck-face" r="96"/>${t}
    <line class="ck-h" x1="0" y1="0" x2="0" y2="-46" transform="rotate(${ha})"/>
    <line class="ck-m" x1="0" y1="0" x2="0" y2="-74" transform="rotate(${ma})"/>
    ${s!==undefined?`<line class="ck-s" x1="0" y1="14" x2="0" y2="-82" transform="rotate(${s*6})"/>`:''}
    <circle class="ck-c" r="5"/></svg>`;
}

/* ───── 온라인 저장 (Firebase Firestore) ─────
   아이 문서(e4/doyun): { name, stars, starsAt, hmock, hwrong, hwrongAt, kread, hstory, mbest, stat, wrongs, wrongsAt, books, booksAt, pinH, pinAt, updatedAt }
   설정 문서(e4/settings): { goal, subj, course, msg, pinH, at }  ← 관리자 모드 설정 (모든 기기가 같이 써요)
   날짜 문서(e4/doyun/daily/날짜): { visited, total, sec, korean:{n,ok}, school:{n,ok}, eng:{n,ok}, hanja:{n,ok}, history:{n,ok} }
   여러 기기에서 쓰면 문제 수 · 점수는 큰 쪽을, 별 · 목록은 나중에 바뀐 쪽을 따라요. */
const cloud = { ready:null, db:null, ok:false };
function cloudInit(){
  if(!FIREBASE_CONFIG) return Promise.resolve(null);
  if(cloud.ready) return cloud.ready;
  const load=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  cloud.ready = load(base+'firebase-app-compat.js').then(()=>load(base+'firebase-firestore-compat.js')).then(()=>load(base+'firebase-auth-compat.js')).then(()=>{
    firebase.initializeApp(FIREBASE_CONFIG); cloud.db=firebase.firestore(); cloud.ok=true; return cloud.db;
  }).catch(e=>{ console.warn('온라인 저장을 쓸 수 없어요', e); return null; });
  return cloud.ready;
}
const kidRef = name => cloud.db && KID_IDS[name] ? cloud.db.collection(GRADE_ID).doc(KID_IDS[name]) : null;
/* {키: 숫자} 또는 {키: {n,ok}} 를 큰 쪽으로 합쳐요 */
function mergeMax(a, b){
  const o=Object.assign({}, a||{});
  for(const k in (b||{})){
    const x=o[k], y=b[k];
    if(typeof y==='number') o[k]=Math.max(x||0,y);
    else if(y && typeof y==='object') o[k]=x&&typeof x==='object' ? {n:Math.max(x.n||0,y.n||0), ok:Math.max(x.ok||0,y.ok||0)} : y;
  }
  return o;
}
const MAX_KEYS = ['kread','hstory','mbest','stat'];
const LATEST_KEYS = [['hwrong','hwrongAt'],['wrongs','wrongsAt'],['books','booksAt']];
async function cloudPull(name, docOnly){
  if(!KID_IDS[name] || !await cloudInit()) return false;
  try{
    const ref=kidRef(name), snap=await ref.get();
    if(snap.exists){
      const d=snap.data();
      // 관리자(대시보드 · 관리자 모드)가 기록을 지웠으면 이 기기에 남은 기록도 지워요
      if(d.resetAt && d.resetAt > store.get('resetAt',0,name)){
        PROFILE_KEYS.filter(k=>!KEEP_ON_RESET.includes(k)).forEach(k=>store.del(k,name));
        store.set('resetAt',d.resetAt,name);
        if(name===who){ stars=0; updateStars(); }
      }
      if(typeof d.stars==='number' && (d.starsAt||0) > store.get('starsAt',0,name)){ store.set('stars',d.stars,name); store.set('starsAt',d.starsAt,name); }
      if(typeof d.hmock==='number' && d.hmock>store.get('hmock',0,name)) store.set('hmock',d.hmock,name);
      MAX_KEYS.forEach(k=>{ if(d[k]) store.set(k, mergeMax(store.get(k,{},name), d[k]), name); });
      LATEST_KEYS.forEach(([k,at])=>{ if(d[k] && (d[at]||0) > store.get(at,0,name)){ store.set(k,d[k],name); store.set(at,d[at],name); } });
      const lp=kidPinsRaw()[name];
      if(d.pinAt && (!lp || d.pinAt > lp.at)){ const r=kidPinsRaw(); r[name]={h:d.pinH||null, at:d.pinAt}; store.set('kidpins',r); }
    }
    if(docOnly) return true;
    const L=getLog(name), vis=store.get('visits',{},name), sec=store.get('studysec',{},name), qs=await ref.collection('daily').get();
    qs.forEach(doc=>{
      const k=doc.id, d=doc.data();
      if(d.visited) vis[k]=1;
      if(d.sec) sec[k]=Math.max(sec[k]||0, d.sec);
      Object.keys(SUBJ).forEach(s=>{
        if(!d[s]) return;
        const day=L[k]||(L[k]={}), e=day[s]||(day[s]={n:0,ok:0});
        e.n=Math.max(e.n,d[s].n||0); e.ok=Math.max(e.ok,d[s].ok||0);
      });
    });
    store.set('log',L,name); store.set('visits',vis,name); store.set('studysec',sec,name);
    return true;
  }catch(e){ console.warn('불러오기 실패', e); return false; }
}

const KEEP_ON_RESET = ['settings','unit','mlv','hlv','hslv','elv','level','op','klv'];
async function cloudPushNow(name){
  if(!await cloudInit()) return;
  const ref=kidRef(name); if(!ref) return;

async function cloudReset(name){

async function cloudPullSettings(){

function lpinKey(v){
  if(!LP) return;
  if(v==='ok'){ LP=null; showLogin(); return; }
  if(v==='del'){ LP.buf=LP.buf.slice(0,-1); drawLoginPin(); return; }
  if(LP.mode==='wait' || !/^\d$/.test(v) || LP.buf.length>=4) return;
  LP.buf+=v; drawLoginPin();
  if(LP.buf.length<4) return;
  const name=LP.name, pins=kidPins();
  if(LP.mode==='enter'){
    if(hashPin(LP.buf,name)===pins[name]){ LP=null; loadProfile(name); return; }
    beep(false); shake('lpinrow'); toast('비밀번호가 틀렸어요');
  } else if(LP.mode==='make'){
    LP.first=LP.buf; LP.mode='again'; LP.buf=''; drawLoginPin(); return;
  } else {
    if(LP.buf===LP.first){ setKidPin(name,LP.buf); cloudPushNow(name); toast('비밀번호를 만들었어요 🔒'); LP=null; loadProfile(name); return; }

const BAL_DAYS = 7;
function balDays(){ const t=new Date(); return Array.from({length:BAL_DAYS},(_,i)=>{ const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-(BAL_DAYS-1-i)); return {k:dayKey(d), w:WD[d.getDay()], dd:d.getDate()}; }); }
const balN = (L,k,s) => (L[k]&&L[k][s]&&L[k][s].n)||0;
const balLv = n => n===0 ? 0 : n<10 ? 1 : n<20 ? 2 : n<40 ? 3 : 4;
/* 과목 타일: 오늘 푼 문제 수 + 최근 7일 칸 (진할수록 많이 풀었어요) */
function subjTodayHTML(s){
  const L=getLog(), days=balDays(), n=balN(L,days[BAL_DAYS-1].k,s);
  return `<span class="subj-today">${n?`오늘 <b>${n}</b>문제`:'오늘 아직 안 했어요'}<span class="bal-dots" aria-hidden="true">${days.map((d,i)=>`<i class="l${balLv(balN(L,d.k,s))}${i===BAL_DAYS-1?' today':''}"></i>`).join('')}</span></span>`;
}
function balanceHTML(){
  const L=getLog(), days=balDays(), on=Object.keys(SUBJ).filter(k=>admin.subj[k]), today=days[BAL_DAYS-1].k;
  if(!on.length) return '';
  const full=days.filter(d=>on.every(s=>balN(L,d.k,s)>0)).length;
  const miss=on.filter(s=>!balN(L,today,s));
  const wk=on.map(s=>[s,days.reduce((a,d)=>a+balN(L,d.k,s),0)]);
  const sum=wk.reduce((a,x)=>a+x[1],0), low=wk.slice().sort((a,b)=>a[1]-b[1])[0];

function renderReview(){
  const w=store.get('wrongs',[]);
  if(!RV || RV.done===undefined){
    if(!w.length){ view.innerHTML=`<div class="card center"><p class="big">🔁 틀린 문제 복습함</p><p>아직 모인 문제가 없어요 👍<br><span class="sub">문제를 틀리거나 넘어가면 여기에 모여요.</span></p><button class="big-btn" data-act="tab" data-v="home">🏠 홈으로</button></div>`; return; }
  }
  if(!RV) startRV();
  drawRV();
}
let RV = null;
function startRV(){
  const w=shuffle(store.get('wrongs',[])).slice(0,10);
  RV={list:w.map(x=>Object.assign({}, x, {choices: x.choices ? shuffle(x.choices) : numChoices(+x.ans)})), i:0, score:0, tried:false, solved:false, picked:[], note:'', done:false};
}
const fracText = s => String(s).replace(/(?:(\d+) )?(\d+)\/(\d+)/g, (m,w,n,d)=>fr(n,d,w));
const mathText = s => fracText(esc(s));
function drawRV(){
  if(App.view!=='review') return;
  if(!RV.list.length){ RV=null; renderReview(); return; }
  if(RV.done){
    view.innerHTML=`<div class="card center"><p class="sub">🔁 틀린 문제 복습함</p><p class="big">${RV.list.length}문제 중 ${RV.score}개를 한 번에 맞혔어요!</p>
      <p>맞힌 문제는 복습함에서 빠졌어요. 남은 문제 ${store.get('wrongs',[]).length}개</p>
      <button class="big-btn" data-act="rvAgain">한 번 더 복습</button><div class="center"><button class="linkbtn" data-act="tab" data-v="home">🏠 홈으로</button></div></div>`;
    return;
  }
  const q=RV.list[RV.i], cls=i=> RV.solved && q.choices[i]===q.ans ? 'ok' : (RV.picked.includes(i)?'no':'');
  const txt = c => q.s==='school' ? mathText(c) : esc(c);
  view.innerHTML=`<div class="card">
    <div class="qtop"><span>🔁 ${SUBJ[q.s]?SUBJ[q.s].name:''}${q.sub?' › '+esc(q.sub):''} · ${RV.i+1} / ${RV.list.length}</span><span>⭐ ${RV.score}</span></div>
    <div class="sq ${q.s==='korean'?'ko-q':q.s==='history'?'hs-q':''}">${q.html}</div>
    <div class="choices ${q.choices.join('').length>24?'words':''}">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="rvPick" data-v="${i}"><span class="ct ${q.s==='hanja'&&/^[一-鿿]$/.test(c)?'hanja':''}">${txt(c)}</span></button>`).join('')}</div>
    ${RV.note?`<div class="hint">${RV.note}</div>`:''}
    ${RV.solved?'':skipBtn('rvSkip')}</div>`;
}
function rvPick(i){
  if(!RV||RV.solved||RV.done) return;
  const q=RV.list[RV.i];
  if(q.choices[i]===q.ans){
    RV.solved=true; beep(true); markO(); logToday(q.s, !RV.tried, q.sub);
    if(!RV.tried){ RV.score++; addStar(1); removeWrong(q.id); }
    RV.note=`<span class="praise">${praise()}</span>${q.explain?`<br><small>${q.s==='school'?fracText(q.explain):q.explain}</small>`:''}`; drawRV(); rvNext(1800);
  } else {
    if(RV.picked.includes(i)) return;
    RV.tried=true; RV.picked.push(i); beep(false); drawRV();
  }
}
function rvNext(ms){
  const me=RV;
  setTimeout(()=>{ if(RV!==me) return; RV.i++; RV.tried=false; RV.solved=false; RV.picked=[]; RV.note=''; if(RV.i>=RV.list.length) RV.done=true; drawRV(); }, ms);
}

/* ───── 학교수학 (4학년 2학기) ─────
   문제 형식: 숫자 입력(type:'num', html 안의 □ 자리에 답 입력) 또는 고르기(type:'choice') */
const numQ = (html, ans, explain='') => ({type:'num', html, ans, explain});
const choQ = (html, ans, others, explain='', cls='') => {
  const list=[...new Set([String(ans), ...shuffle(others.map(String))])].slice(0,4);
  return {type:'choice', html, ans:String(ans), choices:shuffle(list), explain, cls};
};
const BOX = '<span class="box">&nbsp;?&nbsp;</span>';
const r3 = x => Math.round(x*1000)/1000;
const fmtNum = x => String(r3(x));
/* 분수 그리기: fr(분자, 분모, 자연수) */
const fr = (n,d,w) => `<span class="mixed">${w?w:''}<span class="frac" data-say="${w&&w!=='□'?w+'과 ':''}${d}분의 ${n==='□'?'몇':n}"><i>${n}</i><i>${d}</i></span></span>`;
const frS = (n,d,w) => `${w?w+' ':''}${n}/${d}`; // 고르기 보기용 글자 (mathText 가 분수로 그려요)
function numChoices(ans){
  const dec=!Number.isInteger(ans), c=new Set([fmtNum(ans)]);
  const offs = dec ? [0.1,-0.1,0.01,-0.01,1,-1,ans*9,-ans*0.9] : [1,-1,2,-2,10,-10,5,-5,ans,Math.round(ans/2)];
  for(const o of shuffle(offs)){ const v=r3(ans+o); if(v>=0 && c.size<4) c.add(fmtNum(v)); }
  let k=3; while(c.size<4) c.add(fmtNum(ans+(k++)));
  return shuffle([...c]);
}
const fbar = (n,d,n2=0) => `<span class="fbar">${Array.from({length:d},(_,i)=>`<i class="${i<n?'on':i<n+n2?'on2':''}"></i>`).join('')}</span>`;

/* 도형 그리기: 수학 좌표(위가 +) 점들을 받아 SVG 로. al 각 글자, sl 변 글자, tk 같은 길이 표시 개수, ra 직각 표시, diag 대각선 */
function polySVG(pts, o={}){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const sc=200/Math.max(maxx-minx, maxy-miny, 1e-6), P=34;
  const q=pts.map(([x,y])=>[P+(x-minx)*sc, P+(maxy-y)*sc]);
  const W=(maxx-minx)*sc+P*2, H=(maxy-miny)*sc+P*2;
  const cx=q.reduce((a,p)=>a+p[0],0)/q.length, cy=q.reduce((a,p)=>a+p[1],0)/q.length;
  const unit=(x,y)=>{ const l=Math.hypot(x,y)||1; return [x/l,y/l]; };
  const n=q.length, f=v=>v.toFixed(1);
  let s=`<polygon class="sp" points="${q.map(p=>p.map(f).join(',')).join(' ')}"/>`;
  if(o.diag) for(let i=0;i<n;i++) for(let j=i+2;j<n;j++){ if(i===0&&j===n-1) continue; s+=`<line class="sd" x1="${f(q[i][0])}" y1="${f(q[i][1])}" x2="${f(q[j][0])}" y2="${f(q[j][1])}"/>`; }
  (o.ra||[]).forEach(i=>{ const v=q[i], a=q[(i+n-1)%n], b=q[(i+1)%n], u1=unit(a[0]-v[0],a[1]-v[1]), u2=unit(b[0]-v[0],b[1]-v[1]), k=11;
    s+=`<path class="sq-mark" d="M${f(v[0]+u1[0]*k)},${f(v[1]+u1[1]*k)} L${f(v[0]+u1[0]*k+u2[0]*k)},${f(v[1]+u1[1]*k+u2[1]*k)} L${f(v[0]+u2[0]*k)},${f(v[1]+u2[1]*k)}"/>`; });
  (o.tk||[]).forEach((c,i)=>{ if(!c) return; const a=q[i], b=q[(i+1)%n], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], d=unit(b[0]-a[0],b[1]-a[1]), nn=[-d[1],d[0]];
    for(let t=0;t<c;t++){ const off=(t-(c-1)/2)*6, x=m[0]+d[0]*off, y=m[1]+d[1]*off; s+=`<line class="tk" x1="${f(x-nn[0]*7)}" y1="${f(y-nn[1]*7)}" x2="${f(x+nn[0]*7)}" y2="${f(y+nn[1]*7)}"/>`; } });
  (o.al||[]).forEach((t,i)=>{ if(!t) return; const v=q[i], u=unit(cx-v[0],cy-v[1]); s+=`<text x="${f(v[0]+u[0]*30)}" y="${f(v[1]+u[1]*30)}">${t}</text>`; });
  (o.sl||[]).forEach((t,i)=>{ if(!t) return; const a=q[i], b=q[(i+1)%n], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], u=unit(m[0]-cx,m[1]-cy); s+=`<text x="${f(m[0]+u[0]*16)}" y="${f(m[1]+u[1]*16)}">${t}</text>`; });
  return `<svg class="shape" viewBox="0 0 ${f(W)} ${f(H)}" role="img" aria-label="도형">${s}</svg>`;
}
/* 삼각형: 밑변 양 끝 각 A, B 로 그려요 */
function triPts(A,B){
  const C=180-A-B, rad=Math.PI/180, L=10, b=L*Math.sin(B*rad)/Math.sin(C*rad);
  return [[0,0],[L,0],[b*Math.cos(A*rad), b*Math.sin(A*rad)]];
}
const regPts = n => Array.from({length:n},(_,i)=>{ const a=(90+180/n*(n%2?0:1)+360*i/n)*Math.PI/180; return [Math.cos(a),Math.sin(a)]; });
const POLY_NAME = {3:'삼각형',4:'사각형',5:'오각형',6:'육각형',7:'칠각형',8:'팔각형',9:'구각형',10:'십각형'};

/* 꺾은선그래프 그리기 */
function lineSVG(xs, ys, unit, title){
  const mn=Math.min(...ys), mx=Math.max(...ys);
  const wave = mn>=10, lo = wave ? Math.max(0,Math.floor((mn-2)/2)*2) : 0, hi = Math.ceil((mx+1)/2)*2;
  const step = hi-lo>12 ? 2 : 1, W=320, H=210, L=42, T=14, B=34, R=12;
  const X=i=>L+18+i*(W-L-R-36)/(xs.length-1), Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let s='';
  for(let v=lo; v<=hi; v+=step){ s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/>`; if((v-lo)%(step*(hi-lo>8?2:1))===0) s+=`<text x="${L-12}" y="${Y(v)}">${v}</text>`; }
  s+=`<line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}"/><line class="ax" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>`;
  if(wave){ const y=H-B-8; s+=`<path class="wave" d="M${L-6},${y+3} q3,-6 6,0 t6,0"/>`; }
  s+=`<polyline class="ln" points="${ys.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}"/>`;
  s+=ys.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5"/>`).join('');
  s+=xs.map((x,i)=>`<text x="${X(i)}" y="${H-B+14}">${x}</text>`).join('');
  s+=`<text x="${L-14}" y="${H-10}" style="font-size:10px">(${unit})</text>`;
  return `<div class="gcap">${title}</div><svg class="lgraph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} 꺾은선그래프">${s}</svg>`;
}

/* 1. 분수의 덧셈과 뺄셈 */
function genFrac(){
  const t=rnd(1,7), d=rnd(4,12);
  if(t===1){ const a=rnd(1,d-2), b=rnd(1,d-1-a); return numQ(`<span class="big">${fr(a,d)} + ${fr(b,d)} = ${fr('□',d)}</span>`, a+b, `분모는 그대로, 분자끼리 더해요: ${a} + ${b} = ${a+b}`); }
  if(t===2){ const a=rnd(2,d-1), b=rnd(d-a+1,d-1); return numQ(`<span class="big">${fr(a,d)} + ${fr(b,d)} = ${fr('□',d,1)}</span>`, a+b-d, `${a} + ${b} = ${a+b} → ${frS(a+b,d)} = ${frS(a+b-d,d,1)}`); }
  if(t===3){ const a=rnd(3,d-1), b=rnd(1,a-1); return numQ(`<span class="big">${fr(a,d)} − ${fr(b,d)} = ${fr('□',d)}</span>`, a-b, `분자끼리 빼요: ${a} − ${b} = ${a-b}`); }
  if(t===4){ const a=rnd(1,d-1); return numQ(`<span class="big">1 − ${fr(a,d)} = ${fr('□',d)}</span>`, d-a, `1 = ${frS(d,d)} 이니까 ${d} − ${a} = ${d-a}`); }
  if(t===5){ const w1=rnd(1,5), w2=rnd(1,4), a=rnd(1,d-2), b=rnd(1,d-1-a);
    return Math.random()<0.5 ? numQ(`<span class="big">${fr(a,d,w1)} + ${fr(b,d,w2)} = ${fr(a+b,d,'□')}</span>`, w1+w2, `자연수끼리 더해요: ${w1} + ${w2} = ${w1+w2}`)
                             : numQ(`<span class="big">${fr(a,d,w1)} + ${fr(b,d,w2)} = ${fr('□',d,w1+w2)}</span>`, a+b, `분수끼리 더해요: ${a} + ${b} = ${a+b}`); }
  if(t===6){ const w1=rnd(3,6), w2=rnd(1,w1-2), b=rnd(2,d-1), a=rnd(1,b-1);
    const ans=frS(d+a-b,d,w1-w2-1);
    return choQ(`<span class="big">${fr(a,d,w1)} − ${fr(b,d,w2)}</span><br>계산한 값은?`, ans, [frS(b-a,d,w1-w2), frS(d+a-b,d,w1-w2), frS(a+b,d,w1-w2-1), frS(b-a,d,w1-w2-1)],
      `분수끼리 뺄 수 없으면 자연수 1을 ${frS(d,d)}로 바꿔요: ${frS(d+a,d,w1-1)} − ${frS(b,d,w2)} = ${ans}`); }
  const q=rnd(1,4), r=rnd(1,d-1), n=q*d+r;
  return Math.random()<0.5 ? numQ(`가분수를 대분수로 나타내요.<br><span class="big">${fr(n,d)} = ${fr(r,d,'□')}</span>`, q, `${n} ÷ ${d} = ${q} … ${r}`)
                           : numQ(`대분수를 가분수로 나타내요.<br><span class="big">${fr(r,d,q)} = ${fr('□',d)}</span>`, n, `${q} × ${d} + ${r} = ${n}`);
}
/* 2. 삼각형 */
function genTri(){
  const t=rnd(1,6);
  if(t===1){ const T=10*rnd(2,14), B=(180-T)/2;
    return numQ(`${polySVG(triPts(B,B),{al:['?','',T+'°'],tk:[0,1,1]})}이등변삼각형이에요. ? 의 각도는 □°`, B, `두 각이 같아요: (180 − ${T}) ÷ 2 = ${B}`); }
  if(t===2){ const B=5*rnd(7,16), T=180-2*B;
    return numQ(`${polySVG(triPts(B,B),{al:[B+'°','','?'],tk:[0,1,1]})}이등변삼각형이에요. ? 의 각도는 □°`, T, `아래 두 각이 ${B}°로 같아요: 180 − ${B} − ${B} = ${T}`); }
  if(t===3){ const s=rnd(3,15);
    return Math.random()<0.5 ? numQ(`${polySVG(triPts(60,60),{sl:[s+' cm','',''],tk:[1,1,1]})}정삼각형의 세 변의 길이의 합은 □ cm`, 3*s, `세 변의 길이가 모두 같아요: ${s} × 3 = ${3*s}`)
                             : numQ(`${polySVG(triPts(60,60),{al:['?','',''],tk:[1,1,1]})}정삼각형의 한 각의 크기는 □°`, 60, '세 각이 모두 같아요: 180 ÷ 3 = 60'); }
  if(t===4){ const kind=rnd(0,2); let A,B;
    if(kind===0){ A=10*rnd(5,7); B=10*rnd(5,7); } else if(kind===1){ A=90; B=10*rnd(3,6); } else { A=10*rnd(10,13); B=10*rnd(2,3); }
    if(Math.random()<0.5) [A,B]=[B,A];
    const C=180-A-B, ans=['예각삼각형','직각삼각형','둔각삼각형'][kind];
    return choQ(`${polySVG(triPts(A,B),{al:[A+'°',B+'°',C+'°'],ra:[A,B,C].map((x,i)=>x===90?i:-1).filter(i=>i>=0)})}각의 크기로 나누면 어떤 삼각형일까요?`, ans, ['예각삼각형','직각삼각형','둔각삼각형','정삼각형'],
