/* 도형 그리기: 수학 좌표(위가 +) 점들을 받아 SVG 로. al 각 글자, sl 변 글자, tk 같은 길이 표시 개수, ra 직각 표시, diag 대각선 */
function polySVG(pts, o={}){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const sc=200/Math.max(maxx-minx, maxy-miny, 1e-6), P=34;
  const q=pts.map(([x,y])=>[P+(x-minx)*sc, P+(maxy-y)*sc]);
  const W=(maxx-minx)*sc+P*2, H=(maxy-miny)*sc+P*2;
  const cx=q.reduce((a,p)=>a+p[0],0)/q.length, cy=q.reduce((a,p)=>a+p[1],0)/q.length;
  const unit=(x,y)=>{ const l=Math.hypot(x,y)||1; return [x/l,y/l]; };
  const n=q.length, f=v=>v.toFixed(1);
  let s=`<polygon class="sp" points="${q.map(p=>p.map(f).join(',')).join(' ')}"/>`;
  if(o.diag) for(let i=0;i<n;i++) for(let j=i+2;j<n;j++){ if(i===0&&j===n-1) continue; s+=`<line class="sd" x1="${f(q[i][0])}" y1="${f(q[i][1])}" x2="${f(q[j][0])}" y2="${f(q[j][1])}"/>`; }
  (o.ra||[]).forEach(i=>{ const v=q[i], a=q[(i+n-1)%n], b=q[(i+1)%n], u1=unit(a[0]-v[0],a[1]-v[1]), u2=unit(b[0]-v[0],b[1]-v[1]), k=11;
    s+=`<path class="sq-mark" d="M${f(v[0]+u1[0]*k)},${f(v[1]+u1[1]*k)} L${f(v[0]+u1[0]*k+u2[0]*k)},${f(v[1]+u1[1]*k+u2[1]*k)} L${f(v[0]+u2[0]*k)},${f(v[1]+u2[1]*k)}"/>`; });
  (o.tk||[]).forEach((c,i)=>{ if(!c) return; const a=q[i], b=q[(i+1)%n], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], d=unit(b[0]-a[0],b[1]-a[1]), nn=[-d[1],d[0]];
    for(let t=0;t<c;t++){ const off=(t-(c-1)/2)*6, x=m[0]+d[0]*off, y=m[1]+d[1]*off; s+=`<line class="tk" x1="${f(x-nn[0]*7)}" y1="${f(y-nn[1]*7)}" x2="${f(x+nn[0]*7)}" y2="${f(y+nn[1]*7)}"/>`; } });
  (o.al||[]).forEach((t,i)=>{ if(!t) return; const v=q[i], u=unit(cx-v[0],cy-v[1]); s+=`<text x="${f(v[0]+u[0]*30)}" y="${f(v[1]+u[1]*30)}">${t}</text>`; });
  (o.sl||[]).forEach((t,i)=>{ if(!t) return; const a=q[i], b=q[(i+1)%n], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], u=unit(m[0]-cx,m[1]-cy); s+=`<text x="${f(m[0]+u[0]*16)}" y="${f(m[1]+u[1]*16)}">${t}</text>`; });
  return `<svg class="shape" viewBox="0 0 ${f(W)} ${f(H)}" role="img" aria-label="도형">${s}</svg>`;
}
/* 삼각형: 밑변 양 끝 각 A, B 로 그려요 */
function triPts(A,B){
  const C=180-A-B, rad=Math.PI/180, L=10, b=L*Math.sin(B*rad)/Math.sin(C*rad);
  return [[0,0],[L,0],[b*Math.cos(A*rad), b*Math.sin(A*rad)]];
}
const regPts = n => Array.from({length:n},(_,i)=>{ const a=(90+180/n*(n%2?0:1)+360*i/n)*Math.PI/180; return [Math.cos(a),Math.sin(a)]; });
const POLY_NAME = {3:'삼각형',4:'사각형',5:'오각형',6:'육각형',7:'칠각형',8:'팔각형',9:'구각형',10:'십각형'};

/* 꺾은선그래프 그리기 */
function lineSVG(xs, ys, unit, title){
  const mn=Math.min(...ys), mx=Math.max(...ys);
  const wave = mn>=10, lo = wave ? Math.max(0,Math.floor((mn-2)/2)*2) : 0, hi = Math.ceil((mx+1)/2)*2;
  const step = hi-lo>12 ? 2 : 1, W=320, H=210, L=42, T=14, B=34, R=12;
  const X=i=>L+18+i*(W-L-R-36)/(xs.length-1), Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);

  if(t===4){ const n=one([3,4,5,6,8]); return numQ(`${polySVG(regPts(n),{al:['?']})}정${POLY_NAME[n]}의 한 각의 크기는 □°`, (n-2)*180/n, `삼각형 ${n-2}개로 나누면 모든 각의 합은 ${(n-2)*180}°: ${(n-2)*180} ÷ ${n} = ${(n-2)*180/n}`); }
  const [s,a]=one([['정다각형은 변의 길이와 각의 크기가 모두 같아요.','O'],['삼각형에는 대각선이 없어요.','O'],['원은 다각형이에요.','X'],['직사각형의 두 대각선은 길이가 같아요.','O'],
    ['마름모의 두 대각선은 서로 수직으로 만나요.','O'],['다각형은 곡선으로 둘러싸인 도형이에요.','X'],['평행사변형의 두 대각선은 항상 길이가 같아요.','X'],['정사각형의 두 대각선은 길이가 같고 서로 수직이에요.','O']]);
  return choQ(`맞으면 O, 틀리면 X<br><b style="font-weight:normal">${s}</b>`, a, ['O','X'], '', 'okx');
}

function drawLesson(){
  const sb=document.getElementById('sbody'); if(!sb) return;

}
function startS(){
  const list=[]; let guard=0;
  while(list.length<10 && guard++<300){ const q=genUnit(App.unit); if(!list.some(x=>x.html===q.html)) list.push(q); }
  S={unit:App.unit,list,i:0,input:'',res:[],correct:0,done:false,lock:false,flash:'',note:'',picked:-1};
  drawS();
}
function qBody(q, input, flash){
  return q.type==='num' ? q.html.replace('□',`<span class="ansbox ${flash}">${input||'&nbsp;'}</span>`) : q.html;
}
function drawS(){
  const sb=document.getElementById('sbody'); if(!sb) return;
  if(!S || S.unit!==App.unit){ startS(); return; }
  if(S.done){
    sb.innerHTML=`<div class="card center">
      <p class="big">${S.correct===10?'🏆 10문제 모두 정답!':`10문제 중 ${S.correct}개 맞았어요!`}</p>
      <p>받은 별: ⭐ ${S.earned}개</p>
      <button class="big-btn" data-act="startS">다시 하기</button>
      <div class="center"><button class="linkbtn" data-act="smode" data-v="game">⚡ 60초 게임 하러 가기</button></div></div>`;
    return;
  }
  const q=S.list[S.i];
  const dots=`<div class="dots">${S.list.map((_,i)=>`<span class="dot ${i<S.i?(S.res[i]?'ok':'no'):(i===S.i?'cur':'')}"></span>`).join('')}</div>`;
  const tag = App.unit==='mix' ? `<div class="unit-tag">${UNITS[q.unit].name}</div>` : '';
  let below='';
  if(q.type==='num') below=keypad('d','skey');
  else below=`<div class="choices ${q.cls}">${q.choices.map((c,i)=>{
      const cls = S.lock ? (c===q.ans?'ok':(i===S.picked?'no':'')) : '';
      return `<button class="choice ${cls}" data-act="spick" data-v="${i}"><span class="ct">${mathText(c)}</span></button>`;
    }).join('')}</div>`;
  sb.innerHTML=`<div class="card board">${dots}${tag}<div class="sq">${qBody(q,S.input,S.flash)}</div>
    <div class="hint">${S.note||(q.type==='num'?'답을 누르고 확인!':'알맞은 것을 골라요.')}</div></div>${below}${S.lock?'':skipBtn('skey','skip')}`;
}
function answerS(ok){
  const q=S.list[S.i];
  S.res.push(ok); beep(ok); logToday('school', ok, UNITS[q.unit].short);
  if(ok){ markO(); S.correct++; S.flash='ok'; S.note=`<span class="praise">${praise()}</span>`; }
  else { addWrong('school', UNITS[q.unit].short, q); S.flash='no'; S.note=`아쉬워요! 정답은 <b>${mathText(String(q.type==='num'?fmtNum(q.ans):q.ans))}</b>${q.explain?`<br><small>${fracText(q.explain)}</small>`:''}`; }
  S.lock=true; drawS();
  const me=S;
  setTimeout(()=>{
    if(S!==me) return;
    S.i++; S.input=''; S.flash=''; S.note=''; S.lock=false; S.picked=-1;
    if(S.i>=10){ S.done=true; S.earned=S.correct+(S.correct===10?2:0); addStar(S.earned); if(S.correct>=8) burst(); }
    if(App.view==='school') drawS();
  }, ok?900:2800);
}
function sKey(v){
  if(App.smode==='game'){ return; }
  if(!S||S.done||S.lock) return;
  if(v==='skip'){ answerS(false); return; }
  const q=S.list[S.i]; if(q.type!=='num') return;

  if(!S||S.done||S.lock) return;

let gameTimer=null;

function nextGameQ(){

function gPick(i){

function nextQ(){
  const pool=quizPool(Q.cat), cur=Q.order[Q.i], n = Q.mode==='listen' ? 4 : 3;

  Q.cur=cur; Q.choices=shuffle([cur,...others]); Q.tried=false; Q.solved=false; Q.wrong=[];
}

  } else {
    const q=R.qs[R.i], cls=i=> R.solved && q.choices[i]===q.ans ? 'ok' : (R.picked.includes(i)?'no':'');
    below=`<div class="card rq">
      <div class="qtop"><span>문제 ${R.i+1} / 4</span><span>⭐ ${R.score}</span></div>
      <div class="dots">${R.qs.map((_,i)=>`<span class="dot ${i<R.i?(R.res[i]?'ok':'no'):(i===R.i?'cur':'')}"></span>`).join('')}</div>
      <p class="rq-q"><b>${R.i+1}.</b> ${esc(q.q)}</p>
      <div class="choices">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="rpick" data-v="${i}"><span class="ct">${'①②③④'[i]} ${esc(c)}</span></button>`).join('')}</div>

}
function rNote(q){ return q.p ? `💡 글의 ${CIRC[q.p]}문단을 다시 읽어 봐요. (노랗게 칠했어요)` : '💡 글 전체를 다시 떠올려 봐요.'; }
function rWrongQ(q){
  const p=PASSAGE_BY_ID[R.pid];
  const ctx = q.p && !p.poem ? `<div class="ko-para">${paraHTML(p.paras[q.p-1])}</div>` : `<div class="sub">『${p.t}』에서</div>`;
  return {html:`${ctx}${esc(q.q)}`, choices:q.choices, ans:q.ans, explain:q.explain};
}
function rPick(i){
  if(!R||R.solved||R.done||R.phase!=='quiz') return;
  const q=R.qs[R.i], sub='긴 글 · '+genreName(PASSAGE_BY_ID[R.pid].g);
  if(q.choices[i]===q.ans){
    R.solved=true; R.res[R.i]=!R.tried; beep(true); markO(); logToday('korean', !R.tried, sub);
    if(!R.tried){ R.score++; addStar(1); }
    R.note=`<span class="praise">${praise()}</span><br><small>${esc(q.explain)}</small>`; drawPassage(); rNext(1800);
  } else {
    if(R.picked.includes(i)) return;
    if(!R.tried){ R.tried=true; addWrong('korean', sub, rWrongQ(q)); }
    R.picked.push(i); beep(false); R.note=rNote(q); drawPassage();
  }
}
function rSkip(){
  if(!R||R.solved||R.done) return;
  const q=R.qs[R.i], sub='긴 글 · '+genreName(PASSAGE_BY_ID[R.pid].g);
  if(!R.tried) addWrong('korean', sub, rWrongQ(q));
  R.tried=true; R.solved=true; R.res[R.i]=false; beep(false); logToday('korean', false, sub);
  R.note=`정답은 <b>${esc(q.ans)}</b><br><small>${esc(q.explain)}</small>`; drawPassage(); rNext(3000);
}
function rNext(ms){
  const me=R;
  setTimeout(()=>{
    if(R!==me) return;
    R.i++; R.tried=false; R.solved=false; R.picked=[]; R.note='';
    if(R.i>=4){
      R.done=true; R.earned=R.score+(R.score===4?1:0); if(R.score===4) addStar(1);
      const k=store.get('kread',{}); k[R.pid]=Math.max(k[R.pid]===undefined?-1:k[R.pid], R.score); store.set('kread',k); cloudPush();
      if(R.score>=3) burst();
    }
    if(App.view==='korean' && App.kact==='read'){ drawPassage(); if(R.done) window.scrollTo({top:document.querySelector('.passage').offsetHeight,behavior:'smooth'}); }
  }, ms);
}

/* 관용 표현 · 헷갈리는 말 · 높임 표현: 10문제 */
function startK(){
  const list=[]; let guard=0;
  while(list.length<10 && guard++<200){ const q=KO_GEN[App.kact](); if(!list.some(x=>x.html===q.html&&x.ans===q.ans)) list.push(q); }
  while(list.length<10) list.push(KO_GEN[App.kact]());
  K={act:App.kact, list, i:0, score:0, tried:false, solved:false, picked:[], note:'', done:false};
}
function drawK(){
  const b=document.getElementById('kbody'); if(!b) return;
  if(!K || K.act!==App.kact) startK();
  if(K.done){
    b.innerHTML=`<div class="card center"><p class="big">${K.score===10?'🏆 모두 한 번에 맞혔어요!':`10문제 중 ${K.score}개를 한 번에 맞혔어요!`}</p>
      <p>받은 별: ⭐ ${K.score}개</p><button class="big-btn" data-act="kAgain">다시 하기</button></div>`;
    return;
  }
  const q=K.list[K.i];
  const cls=i=> K.solved && q.choices[i]===q.ans ? 'ok' : (K.picked.includes(i)?'no':'');
  b.innerHTML=`<div class="card">
    <div class="qtop"><span>${KO_ACTS[K.act]} · ${K.i+1} / 10</span><span>⭐ ${K.score}</span></div>
    <div class="sq ko-q">${q.html}</div>
    <div class="choices ${q.cls}">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="kpick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
    ${K.note?`<div class="hint">${K.note}</div>`:''}
    ${K.solved?'':skipBtn('kskip')}
  </div>`;
}
function kNext(ms){
  const me=K;
  setTimeout(()=>{
    if(K!==me) return;
    K.i++; K.tried=false; K.solved=false; K.picked=[]; K.note='';
    if(K.i>=10){ K.done=true; if(K.score>=8) burst(); }
    if(App.view==='korean') drawK();
  }, ms);
}
const kSub = () => KO_ACTS[K.act].replace(/^\S+ /,'');
function kPick(i){
  if(!K||K.solved||K.done) return;
  const q=K.list[K.i];
  if(q.choices[i]===q.ans){
    K.solved=true; beep(true); markO(); logToday('korean', !K.tried, kSub());
    if(!K.tried){ K.score++; addStar(1); }
    K.note=`<span class="praise">${praise()}</span>`; drawK(); kNext(1300);
  } else {
    if(K.picked.includes(i)) return;
    if(!K.tried) addWrong('korean', kSub(), q);
    K.tried=true; K.picked.push(i); beep(false);
    K.note=q.explain?`<small>💡 ${q.explain}</small>`:''; drawK();
  }
}
function kSkip(){
  if(!K||K.solved||K.done) return;
  const q=K.list[K.i];
  if(!K.tried) addWrong('korean', kSub(), q);
  K.tried=true; K.solved=true; beep(false); logToday('korean', false, kSub());
  K.note=`정답은 <b>${esc(q.ans)}</b>${q.explain?`<br><small>${q.explain}</small>`:''}`; drawK(); kNext(2600);
}

  {id:'emperor', e:'👑', t:'벌거숭이 임금님', by:'안데르센', pages:[

    ['🧵🤥','어느 날 두 재봉사가 찾아왔어요. “저희는 세상에서 가장 멋진 옷감을 짭니다. 이 옷감은 어리석은 사람 눈에는 보이지 않지요.”'],
    ['🪡❓','재봉사들은 빈 베틀 앞에서 열심히 옷을 짜는 척했어요. 신하들이 가 보니 아무것도 보이지 않았어요. 하지만 어리석다는 말을 들을까 봐 “정말 아름답군요!” 하고 거짓말을 했어요.'],
    ['👑😳','임금님도 옷을 입어 보았어요. 거울에는 아무것도 보이지 않았지만, 임금님 역시 “훌륭하구나!” 하고 말했어요.'],
    ['🎺👥','임금님은 새 옷을 입고 거리 행진에 나섰어요. 백성들도 모두 “멋진 옷이다!” 하고 외쳤어요. 아무도 보이지 않는다고 말하지 못했지요.'],
    ['👦☝️','그때 한 아이가 큰 소리로 말했어요. “임금님이 아무것도 안 입었어요!”'],
    ['😆👑','그 말에 사람들이 하나둘 웃음을 터뜨렸어요. “정말이네, 아무것도 안 입었어!” 임금님은 얼굴이 빨개졌지만 행진을 끝까지 해야 했답니다.']],
    qs:[['재봉사들이 말한 옷감의 비밀은?','어리석은 사람 눈에는 보이지 않는다.',['물에 젖지 않는다.','밤에 빛난다.','절대 찢어지지 않는다.'],'재봉사들이 이렇게 거짓말을 했어요.'],['사람들이 옷이 안 보인다고 말하지 못한 까닭은?','어리석다는 말을 들을까 봐',['옷이 정말 보여서','임금님이 무서워서 노래해서','잠이 와서'],'모두 어리석어 보이기 싫었어요.'],['진실을 말한 사람은?','한 아이',['신하','재봉사','임금님'],'아이가 “아무것도 안 입었어요!” 하고 말했어요.']]},
  {id:'antgrass', e:'🐜', t:'개미와 베짱이', by:'이솝', pages:[
    ['☀️🐜','뜨거운 여름, 개미들은 줄지어 부지런히 먹이를 날랐어요. 땀을 뻘뻘 흘리면서도 쉬지 않았어요.'],
    ['🎻🦗','나무 그늘에서는 베짱이가 바이올린을 켜며 노래했어요. “개미야, 이렇게 좋은 날에 왜 일만 하니? 나랑 놀자!”'],
    ['🐜💬','“겨울이 오면 먹을 것이 없어. 지금 모아 두어야 해.” 개미가 말했지만 베짱이는 코웃음을 쳤어요. “겨울은 아직 멀었어!”'],
    ['❄️🦗','드디어 겨울이 왔어요. 온 세상이 눈으로 덮이자 베짱이는 먹을 것을 찾을 수 없었어요. 춥고 배가 고파 덜덜 떨었어요.'],
    ['🚪🐜','베짱이는 개미네 집 문을 두드렸어요. “개미야, 먹을 것 좀 나눠 줄 수 있니?”'],
    ['🍲🦗','개미는 베짱이를 따뜻한 집 안으로 들였어요. “자, 먹어. 대신 봄이 오면 너도 준비하는 법을 배워 보자.” 베짱이는 고개를 끄덕였어요.'],
    ['🌸🎶','봄이 되자 베짱이는 개미와 함께 일했어요. 일이 끝나면 베짱이가 연주하는 음악에 모두 신나게 춤을 추었답니다.']],
    qs:[['여름에 개미가 열심히 일한 까닭은?','겨울에 먹을 것을 모아 두려고',['노래 대회에 나가려고','집을 크게 지으려고','베짱이에게 팔려고'],'겨울에는 먹을 것이 없기 때문이에요.'],['겨울에 베짱이가 어려움을 겪은 까닭은?','미리 먹을 것을 모아 두지 않아서',['바이올린이 부서져서','개미와 싸워서','길을 잃어서'],'여름 내내 놀기만 했어요.'],['이 이야기가 전하는 교훈은?','앞날을 생각해 미리 준비해요.',['노는 것이 가장 중요해요.','겨울에는 일하지 않아요.','친구를 돕지 말아요.'],'부지런히 준비한 개미는 겨울을 잘 났어요.']]},
  {id:'sunwind', e:'🌬️', t:'해님과 바람', by:'이솝', pages:[
    ['☀️🌬️','어느 날 해님과 바람이 서로 자기가 더 힘이 세다고 다투었어요. “내 입김 한 번이면 나무도 쓰러진다고!” 바람이 뽐냈어요.'],
    ['🚶🧥','그때 두꺼운 외투를 입은 나그네가 길을 걸어갔어요. 해님이 말했어요. “저 나그네의 외투를 먼저 벗기는 쪽이 이기는 걸로 하자.”'],
    ['🌪️🧥','바람이 먼저 나섰어요. 휘이잉! 세찬 바람을 불었어요. 그러자 나그네는 “아이, 추워!” 하며 외투를 더 꽁꽁 여몄어요.'],
    ['🌪️😣','바람은 더 세게, 더 세게 불었어요. 하지만 바람이 셀수록 나그네는 외투를 더 단단히 붙잡았어요. 결국 바람은 지쳐 버렸어요.'],
    ['☀️😊','이번에는 해님 차례예요. 해님은 따뜻한 햇볕을 부드럽게 비추었어요. 나그네는 “날씨가 좋아졌네.” 하며 단추를 풀었어요.'],
    ['☀️🥵','해님이 조금 더 따스하게 비추자, 나그네는 “아이, 더워!” 하며 스스로 외투를 벗었어요. 해님이 이긴 거예요.'],
    ['☀️🌬️🤝','바람은 부끄러워하며 말했어요. “힘으로 억지로 하는 것보다 따뜻한 마음이 더 힘이 세구나.”']],
    qs:[['해님과 바람이 한 내기는?','나그네의 외투를 먼저 벗기기',['나무를 먼저 쓰러뜨리기','구름을 먼저 없애기','비를 먼저 내리게 하기'],'해님이 내기를 제안했어요.'],['바람이 세게 불자 나그네는 어떻게 했나요?','외투를 더 꽁꽁 여몄어요.',['외투를 벗었어요.','집으로 달려갔어요.','노래를 불렀어요.'],'추워서 외투를 붙잡았어요.'],['이 이야기의 교훈은?','억지로 하는 것보다 따뜻한 마음이 더 힘이 세요.',['바람이 가장 세요.','외투는 필요 없어요.','내기는 나빠요.'],'바람의 마지막 말을 보세요.']]},
  {id:'matchgirl', e:'🕯️', t:'성냥팔이 소녀', by:'안데르센', pages:[
    ['❄️👧','눈이 펑펑 내리는 한 해의 마지막 날 밤이었어요. 맨발의 작은 소녀가 추위에 떨며 성냥을 팔고 있었어요. “성냥 사세요, 성냥 사세요.” 하지만 아무도 사 주지 않았어요.'],
    ['🔥✨','소녀는 너무 추워서 성냥 하나를 그었어요. 치익! 작은 불꽃 속에 따뜻한 난로가 보였어요. 그런데 불꽃이 꺼지자 난로도 사라졌어요.'],
    ['🍗🎄','두 번째 성냥을 긋자 맛있는 음식이 차려진 식탁이 나타났고, 세 번째 성냥을 긋자 반짝이는 크리스마스트리가 나타났어요.'],
    ['⭐👵','소녀는 다시 성냥을 그었어요. 그러자 세상에서 소녀를 가장 사랑해 주셨던 할머니가 환하게 웃고 계셨어요. “할머니, 저도 데려가 주세요!”'],
    ['🔥🔥🔥','소녀는 할머니가 사라질까 봐 남은 성냥을 한꺼번에 모두 그었어요. 할머니는 소녀를 꼭 안고 따뜻하고 밝은 하늘나라로 날아올랐어요.'],
    ['🌅','다음 날 아침, 사람들은 미소를 띤 채 잠든 소녀를 발견했어요. 사람들은 그제야 소녀를 돌보지 못한 것을 슬퍼했답니다.']],
    qs:[['소녀가 성냥을 그은 까닭은?','너무 추워서',['집에 불을 켜려고','놀이를 하려고','성냥을 팔려고'],'추위를 녹이려고 성냥을 그었어요.'],['마지막에 불꽃 속에 나타난 사람은?','할머니',['엄마','선생님','임금님'],'소녀를 가장 사랑해 주셨던 할머니가 나타났어요.'],['이 이야기를 읽고 생각해 볼 점으로 알맞은 것은?','어려운 이웃에게 관심을 가져야 해요.',['성냥은 비싸게 팔아야 해요.','눈 오는 날은 재미있어요.','혼자 있는 것이 좋아요.'],'아무도 소녀를 돌보지 않았던 것을 생각해 봐요.']]},
  {id:'happyprince', e:'🗿', t:'행복한 왕자', by:'오스카 와일드', pages:[
    ['🗿✨','도시 높은 곳에 행복한 왕자 동상이 서 있었어요. 온몸은 금박으로 덮여 있었고, 두 눈은 파란 보석, 칼자루에는 빨간 루비가 박혀 있었어요.'],
    ['🐦🌙','따뜻한 남쪽 나라로 떠나던 제비 한 마리가 왕자의 발밑에서 쉬었어요. 그때 물방울이 뚝 떨어졌어요. 왕자가 울고 있었던 거예요.'],
    ['😢🏚️','“여기서는 가난한 사람들이 보여. 저기 아픈 아이가 있는데, 엄마는 오렌지 하나 살 돈이 없단다. 제비야, 내 칼의 루비를 저 집에 갖다줄래?”'],
    ['🐦💎','제비는 루비를 물어다 주었어요. 다음 날에는 왕자의 한쪽 눈 보석을 가난한 작가에게, 또 다음 날에는 다른 눈 보석을 성냥팔이 소녀에게 가져다주었어요.'],
    ['🐦🍂','“이제 왕자님은 앞을 볼 수 없으니, 제가 곁에 있을게요.” 제비는 남쪽으로 떠나지 않았어요. 그리고 왕자 몸의 금박을 한 장씩 떼어 가난한 사람들에게 나누어 주었어요.'],
    ['❄️🐦','겨울이 왔어요. 추위를 견디지 못한 제비는 왕자의 발밑에서 조용히 눈을 감았어요. 그 순간 왕자의 납으로 된 심장이 쩍 하고 갈라졌어요.'],
    ['😇','초라해진 동상을 보고 사람들은 녹여 버리자고 했어요. 하지만 하늘에서는 이 도시에서 가장 귀한 것 두 가지로 갈라진 심장과 작은 제비를 골랐답니다.']],
    qs:[['왕자가 운 까닭은?','가난하고 힘든 사람들이 보여서',['비가 와서','제비가 떠나서','보석을 잃어버려서'],'높은 곳에서 가난한 사람들을 보았어요.'],['제비가 한 일은?','왕자의 보석과 금박을 가난한 사람들에게 나누어 주었어요.',['남쪽 나라로 먼저 떠났어요.','보석을 몰래 가졌어요.','왕자에게 노래만 불러 주었어요.'],'제비는 왕자의 부탁을 들어주었어요.'],['이 이야기에서 가장 귀한 것은 무엇이라고 했나요?','왕자의 갈라진 심장과 제비',['파란 보석','빨간 루비','금박'],'남을 위해 모든 것을 나눈 마음이 가장 귀했어요.']]},
  {id:'axe', e:'🪓', t:'금도끼 은도끼', by:'우리 옛이야기', pages:[
    ['🌲🪓','옛날에 마음씨 착한 나무꾼이 연못가에서 나무를 하고 있었어요. 그런데 그만 손이 미끄러져 쇠도끼가 연못에 퐁당 빠지고 말았어요.'],
    ['😭💧','“아이고, 하나뿐인 도끼인데 이제 어쩌나.” 나무꾼이 엉엉 울자 연못에서 하얀 옷을 입은 산신령이 나타났어요.'],
    ['🧙‍♂️✨','산신령은 번쩍이는 금도끼를 들고 물었어요. “이 금도끼가 네 도끼냐?” “아닙니다. 제 도끼는 그저 낡은 쇠도끼입니다.”'],
    ['🧙‍♂️🥈','산신령은 은도끼를 들고 다시 물었어요. “그럼 이 은도끼가 네 것이냐?” “아닙니다.” 마지막으로 쇠도끼를 보여 주자 나무꾼은 “네, 그것이 제 도끼입니다!” 하고 기뻐했어요.'],
    ['🎁','“참으로 정직하구나.” 산신령은 쇠도끼와 함께 금도끼와 은도끼도 모두 주었어요.'],
    ['😏🪓','이 소문을 들은 욕심쟁이 나무꾼은 일부러 도끼를 연못에 던졌어요. 산신령이 금도끼를 들고 나타나자 “네, 그게 제 도끼예요!” 하고 거짓말을 했지요.'],
    ['🧙‍♂️💢','“거짓말을 하다니!” 산신령은 금도끼는커녕 욕심쟁이의 쇠도끼까지 돌려주지 않고 사라져 버렸답니다.']],
    qs:[['착한 나무꾼의 도끼는 어떤 도끼였나요?','쇠도끼',['금도끼','은도끼','나무 도끼'],'낡은 쇠도끼라고 말했어요.'],['산신령이 착한 나무꾼에게 금도끼와 은도끼까지 준 까닭은?','정직하게 말해서',['많이 울어서','힘이 세서','노래를 잘해서'],'“참으로 정직하구나.”'],['욕심쟁이 나무꾼은 어떻게 되었나요?','자기 쇠도끼까지 잃었어요.',['금도끼를 받았어요.','은도끼를 받았어요.','부자가 되었어요.'],'거짓말을 해서 벌을 받았어요.']]},
  {id:'simcheong', e:'🌸', t:'효녀 심청', by:'우리 옛이야기', pages:[
    ['👴👧','옛날 황해도에 앞을 보지 못하는 심 봉사와 딸 심청이 살았어요. 심청은 어려서부터 마을을 돌며 일을 해서 아버지를 정성껏 모셨어요.'],
    ['🙏🍚','어느 날 스님이 말했어요. “부처님께 공양미 삼백 석을 바치면 아버지 눈을 뜰 수 있습니다.” 하지만 가난한 집에는 쌀 한 가마니도 없었어요.'],
    ['⛵💰','마침 뱃사람들이 거친 바다에 바칠 처녀를 찾고 있었어요. 심청은 아버지를 위해 쌀 삼백 석을 받고 배를 타기로 했어요.'],
    ['🌊👧','깊은 인당수에 이르자 심청은 “아버지, 부디 눈을 뜨세요.” 하고 치마를 뒤집어쓰고 바다에 몸을 던졌어요.'],
    ['🐉🌸','하지만 바닷속 용왕님이 심청의 효심에 감동했어요. 용왕님은 심청을 커다란 연꽃에 태워 다시 바다 위로 올려 보냈어요.'],
    ['👑🌸','바다에 떠 있는 아름다운 연꽃을 임금님께 바치자, 그 안에서 심청이 나왔어요. 심청은 왕비가 되었어요.'],

    ['✨👼','그러자 미하일의 몸에서 빛이 났어요. 미하일은 사실 하느님의 벌을 받아 땅에 내려온 천사였어요. 세 가지 물음의 답을 깨달으면 하늘로 돌아갈 수 있었지요.'],
    ['📜','“사람 안에 무엇이 있는가? 사랑이 있었습니다. 사람에게 허락되지 않은 것은 무엇인가? 자기에게 정말 필요한 것을 아는 힘이었습니다. 사람은 무엇으로 사는가? 사람은 사랑으로 삽니다.”'],
    ['🕊️','미하일은 노래를 부르며 하늘로 올라갔어요. 세몬의 집에는 따뜻한 빛만이 오래도록 남아 있었답니다.']],
    qs:[['미하일이 처음으로 웃은 때는?','마트료나가 화를 풀고 빵을 나누어 주었을 때',['장화를 주문받았을 때','쌍둥이를 보았을 때','구두를 처음 만들었을 때'],'사람 안에 사랑이 있음을 보았어요.'],['부자 신사의 이야기가 보여 주는 것은?','사람은 자기에게 정말 필요한 것을 알지 못한다.',['부자는 언제나 행복하다.','비싼 가죽이 좋은 장화를 만든다.','구두장이는 거짓말을 잘한다.'],'1년 뒤를 걱정했지만 그날 저녁에 세상을 떠났어요.'],['작품이 말하는 ‘사람이 사는 힘’은?','사랑',['돈','힘','지식'],'미하일이 깨달은 마지막 답이에요.']]},
  {id:'stoneface', lv:2, e:'🗿', t:'큰 바위 얼굴', by:'너새니얼 호손', pages:[
    ['⛰️','어느 골짜기 마을 앞 산에는 사람 얼굴을 닮은 커다란 바위가 있었어요. 사람들은 그것을 ‘큰 바위 얼굴’이라 불렀어요. 그 얼굴은 너그럽고 따뜻해서 바라보기만 해도 마음이 편안해졌어요.'],
    ['👦','마을에는 이런 전설이 있었어요. “언젠가 이 골짜기에서 큰 바위 얼굴을 닮은 훌륭한 사람이 나타날 것이다.” 어린 어니스트는 어머니에게 그 이야기를 듣고, 날마다 큰 바위 얼굴을 바라보며 그 사람을 기다렸어요.'],
    ['💰','어느 날 큰돈을 번 부자 ‘개더골드’가 돌아왔어요. 사람들은 “드디어 그분이 오셨다!” 하고 환호했어요. 하지만 어니스트가 본 그의 얼굴은 욕심으로 가득했어요.'],
    ['⚔️','다음에는 전쟁에서 이긴 장군 ‘올드 블러드 앤 선더’가 돌아왔어요. 그 다음에는 말솜씨가 뛰어난 정치가가 나타났어요. 그때마다 사람들은 기뻐했지만, 어니스트의 눈에는 큰 바위 얼굴의 따뜻함이 보이지 않았어요.'],
    ['👴📖','세월이 흘러 어니스트는 머리가 하얀 노인이 되었어요. 그는 평생 성실하게 일하고, 이웃을 돕고, 날마다 큰 바위 얼굴을 바라보며 생각했어요. 사람들은 어느새 어니스트의 이야기를 들으러 찾아왔어요.'],
    ['✍️','어느 날 유명한 시인이 어니스트를 찾아왔어요. 어니스트는 그 시인이야말로 기다리던 사람일까 기대했지만, 시인은 고개를 저었어요. “제 시는 아름답지만, 저는 제가 쓴 대로 살지 못했습니다.”'],
    ['🌅','해 질 무렵, 어니스트가 마을 사람들 앞에서 이야기를 했어요. 그의 말에는 평생 살아온 삶이 그대로 담겨 있었어요. 그때 시인이 외쳤어요. “보세요! 어니스트 씨가 바로 큰 바위 얼굴과 닮았습니다!”'],
    ['🙏','하지만 어니스트는 조용히 집으로 돌아가며 생각했어요. ‘언젠가 나보다 더 훌륭한 사람이 나타나겠지.’ 그는 끝까지 겸손했어요.']],
    qs:[['사람들이 처음에 기대했던 인물들의 공통점은?','돈, 힘, 말솜씨처럼 겉으로 드러난 것이 대단한 사람',['마음이 따뜻한 사람','골짜기에서 태어난 농부','큰 바위 얼굴을 조각한 사람'],'부자, 장군, 정치가는 모두 겉모습이 화려했어요.'],['결국 큰 바위 얼굴을 닮은 사람은?','어니스트',['개더골드','장군','시인'],'시인이 어니스트를 보고 외쳤어요.'],['어니스트가 큰 바위 얼굴을 닮게 된 까닭은?','평생 바르게 살며 큰 바위 얼굴을 닮고자 했기 때문에',['얼굴을 조각했기 때문에','유명해졌기 때문에','부자가 되었기 때문에'],'마음과 삶이 얼굴에 드러난다는 이야기예요.']]},
  {id:'lastlesson', lv:2, e:'🏫', t:'마지막 수업', by:'알퐁스 도데', pages:[
    ['🏃','그날 아침 프란츠는 학교에 늦었어요. 게다가 아멜 선생님이 분사 규칙을 물어보겠다고 하셨는데 하나도 공부하지 않았지요. 차라리 들판에서 놀까 하다가, 꾹 참고 학교로 달려갔어요.'],
    ['🏫🤫','그런데 교실이 이상했어요. 늘 시끌벅적하던 교실이 조용했고, 선생님은 특별한 날에만 입는 멋진 옷을 입고 계셨어요. 교실 뒤쪽에는 마을 어른들까지 슬픈 얼굴로 앉아 있었어요.'],
    ['📢','아멜 선생님이 천천히 말씀하셨어요. “여러분, 오늘이 나의 마지막 수업입니다. 베를린에서 명령이 왔습니다. 이제부터 알자스와 로렌의 학교에서는 독일어만 가르쳐야 합니다.”'],
    ['😢','프란츠는 가슴이 철렁했어요. ‘이제 프랑스어를 배울 수 없다니! 나는 겨우 글을 쓸 줄 아는 정도인데…….’ 귀찮기만 하던 문법책이 갑자기 오랜 친구처럼 느껴졌어요.'],
    ['🙋‍♂️','선생님이 프란츠에게 분사 규칙을 물으셨지만, 프란츠는 한마디도 대답하지 못했어요. 선생님은 꾸짖지 않으셨어요. “‘내일 하면 되지’ 하며 미루어 온 것이 우리 모두의 잘못이란다.”'],
    ['🔑','선생님은 말씀하셨어요. “프랑스어는 세상에서 가장 아름답고 분명한 말입니다. 그 말을 잘 지키고 절대 잊지 마세요. 나라를 빼앗긴 백성이라도 자기 말을 지키고 있으면, 감옥의 열쇠를 쥐고 있는 것과 같습니다.”'],
    ['✍️','그날 수업은 너무나 쉽게 느껴졌어요. 프란츠는 한 글자 한 글자 정성껏 글씨를 썼어요. 지붕 위에서는 비둘기가 구구 울었어요. ‘저 비둘기들에게도 독일어로 울라고 하려나?’'],
    ['🕛','정오를 알리는 종이 울리고, 밖에서 프로이센 군인들의 나팔 소리가 들렸어요. 선생님은 창백한 얼굴로 칠판에 커다랗게 쓰셨어요. “프랑스 만세!” 그리고 벽에 머리를 기댄 채, 손짓으로 말씀하셨어요. “이제 끝났습니다. 돌아가세요.”']],
    qs:[['오늘이 마지막 수업인 까닭은?','이제부터 독일어만 가르치라는 명령이 내려와서',['선생님이 이사를 가셔서','학교가 문을 닫아서','방학이 시작되어서'],'베를린에서 명령이 왔어요.'],['“감옥의 열쇠를 쥐고 있는 것과 같다”는 말의 뜻은?','자기 나라 말을 지키면 언젠가 자유를 되찾을 힘이 있다.',['감옥에 가지 말아야 한다.','열쇠를 잃어버리면 안 된다.','외국어를 빨리 배워야 한다.'],'말은 민족의 정신을 지키는 힘이에요.'],['이 작품이 우리에게 주는 교훈으로 알맞은 것은?','소중한 것은 잃기 전에 아끼고 미루지 말아야 한다.',['공부는 내일 해도 된다.','지각은 괜찮다.','선생님 옷은 중요하다.'],'프란츠는 ‘내일 하면 되지’ 했던 것을 후회했어요.']]},
  {id:'stars', lv:2, e:'✨', t:'별', by:'알퐁스 도데', pages:[
    ['⛰️🐑','나는 프로방스 지방의 높은 산 위에서 양을 치는 목동이었어요. 몇 주 동안 사람 얼굴은 한 번도 보지 못하고, 개 라브리와 양들하고만 지냈어요.'],
    ['🧺','보름마다 농장에서 식량을 실은 노새가 올라왔어요. 그때마다 나는 산 아래 소식, 특히 주인집 아가씨 스테파네트의 소식이 가장 궁금했어요. 스테파네트는 이 근방에서 가장 아름다운 아가씨였거든요.'],
    ['🐴👧','어느 일요일, 식량이 늦게 도착했어요. 그런데 노새를 몰고 온 사람은 뜻밖에도 스테파네트 아가씨였어요! 심부름꾼이 아파서 대신 왔다고 했어요. 나는 너무 놀라 말도 제대로 하지 못했어요.'],
    ['🌊🌧️','아가씨는 내 오두막을 신기한 듯 둘러보고 산을 내려갔어요. 그런데 얼마 뒤 흠뻑 젖은 채 돌아왔어요. 소나기로 강물이 불어나 건널 수가 없었던 거예요. 아가씨는 어쩔 수 없이 산에서 밤을 보내야 했어요.'],
    ['🔥','나는 오두막에 새 짚을 깔고 아가씨가 쉬게 해 드렸어요. 그리고 밖에 나와 모닥불 곁에 앉았어요. 잠시 뒤, 잠이 오지 않는다며 아가씨가 나와 모닥불 곁에 앉았어요.'],
    ['🌌','밤하늘에는 별이 가득했어요. 아가씨가 물었어요. “저 별들 이름을 아세요?” 나는 목동들이 부르는 별 이름을 하나하나 들려주었어요. 은하수는 ‘성 자크의 길’, 가장 밝은 별은 ‘목동의 별’이라고요.'],
    ['😴','이야기를 듣던 아가씨는 어느새 내 어깨에 머리를 기대고 잠이 들었어요. 나는 꼼짝도 하지 않고 밤새 그대로 앉아 있었어요. 마음은 맑고 깨끗했어요.'],
    ['⭐','나는 생각했어요. 저 수많은 별 가운데 가장 곱고 가장 빛나는 별 하나가 길을 잃고 내려와, 지금 내 어깨에 기대어 잠들어 있다고요.']],
    qs:[['스테파네트가 산에서 밤을 보내게 된 까닭은?','소나기로 강물이 불어 건널 수 없어서',['길을 잃어서','별을 보고 싶어서','노새가 도망가서'],'강을 건너지 못해 돌아왔어요.'],['목동이 밤새 꼼짝하지 않은 까닭은?','잠든 아가씨가 깨지 않도록 조심해서',['추워서','양을 지키느라','무서워서'],'어깨에 기대어 잠든 아가씨를 배려했어요.'],['마지막 문장에서 ‘길을 잃고 내려온 별’은 누구를 빗댄 말인가요?','스테파네트 아가씨',['목동','개 라브리','노새'],'가장 아름다운 존재를 별에 빗대었어요.']]},
  {id:'necklace', lv:2, e:'📿', t:'목걸이', by:'기 드 모파상', pages:[
    ['🏠💭','마틸드는 아름다웠지만 가난한 하급 공무원과 결혼해 살았어요. 그녀는 늘 화려한 저택과 값비싼 드레스, 보석을 꿈꾸며 자기 처지를 불행하다고 여겼어요.'],
    ['✉️','어느 날 남편이 장관이 여는 무도회 초대장을 가져왔어요. 하지만 마틸드는 울상이었어요. “입을 옷도, 걸칠 보석도 없는데 어떻게 가요?” 남편은 사냥총을 사려고 모아 둔 돈으로 드레스를 사 주었어요.'],
    ['💎','마틸드는 부자 친구 포레스티에 부인에게 다이아몬드 목걸이를 빌렸어요. 무도회에서 마틸드는 가장 아름다운 여인이었어요. 모두가 그녀에게 춤을 청했지요.'],
    ['😱','그런데 집에 돌아와 보니 목걸이가 없었어요! 부부는 밤새 길거리와 마차 회사를 뒤졌지만 끝내 찾지 못했어요.'],
    ['💸','부부는 보석 가게에서 똑같은 목걸이를 3만 6천 프랑에 샀어요. 가진 돈을 다 털고, 여기저기서 큰 빚을 졌지요. 그리고 친구에게 아무 말 없이 목걸이를 돌려주었어요.'],
    ['🧹','그 뒤 10년 동안 마틸드는 하녀를 내보내고 작은 다락방으로 이사했어요. 손수 빨래하고, 무거운 물통을 나르고, 시장에서 한 푼이라도 깎았어요. 곱던 손은 거칠어지고 얼굴은 부쩍 늙어 버렸어요.'],
    ['🌳','드디어 빚을 다 갚은 어느 날, 마틸드는 공원에서 여전히 젊고 아름다운 포레스티에 부인을 만났어요. 마틸드는 그동안의 일을 모두 털어놓았어요. “네 목걸이를 잃어버려서 그걸 갚느라 10년을 고생했어.”'],
    ['😨','포레스티에 부인은 깜짝 놀라 마틸드의 손을 잡았어요. “아, 가엾은 마틸드! 내 목걸이는 가짜였어. 기껏해야 500프랑짜리였단다!”']],
    qs:[['마틸드가 늘 불행하다고 여긴 까닭은?','화려하게 살고 싶은데 가난해서',['병이 들어서','친구가 없어서','남편이 나빠서'],'화려한 삶을 꿈꾸며 자기 처지를 불만스러워했어요.'],['마틸드가 10년 동안 고생한 까닭은?','잃어버린 목걸이 값의 빚을 갚느라',['무도회에 또 가려고','드레스를 사려고','이사를 가려고'],'새 목걸이를 사느라 큰 빚을 졌어요.'],['이 작품의 반전(뜻밖의 결말)은?','빌린 목걸이는 사실 값싼 가짜였다.',['목걸이를 다시 찾았다.','남편이 목걸이를 훔쳤다.','친구가 목걸이를 선물로 주었다.'],'마지막 한마디가 모든 고생을 허무하게 만들어요.']]},
  {id:'carol', lv:2, e:'🎄', t:'크리스마스 캐럴', by:'찰스 디킨스', pages:[
    ['💰🧓','런던의 스크루지 영감은 소문난 구두쇠였어요. 크리스마스이브에도 추운 사무실에서 점원 밥 크래칫에게 석탄 한 덩이 아끼라며 호통을 쳤어요. “크리스마스라고? 흥, 쓸데없는 소리!”'],
    ['👻⛓️','그날 밤, 7년 전에 죽은 동업자 말리의 유령이 무거운 쇠사슬을 끌고 나타났어요. “나는 살아서 돈만 알았던 벌로 이 사슬을 끌고 다닌다네. 오늘 밤 유령 셋이 자네를 찾아올 걸세.”'],
    ['🕯️','첫 번째는 ‘과거의 크리스마스 유령’이었어요. 스크루지는 외롭던 어린 시절과, 돈을 좇느라 사랑하던 사람을 떠나보낸 젊은 날의 자신을 보았어요. 스크루지의 눈시울이 붉어졌어요.'],
    ['🍗👨‍👩‍👧‍👦','두 번째는 ‘현재의 크리스마스 유령’이었어요. 밥 크래칫의 가난한 집에서는 가족이 작은 음식을 나누며 행복하게 웃고 있었어요. 하지만 다리가 불편한 막내 팀은 몹시 아파 보였어요. “팀은 살 수 있나요?” 스크루지가 물었어요.'],
    ['🌑','세 번째는 말이 없는 ‘미래의 크리스마스 유령’이었어요. 스크루지는 아무도 슬퍼하지 않는 한 남자의 죽음과, 팀이 없는 크래칫 가족의 슬픈 식탁을 보았어요. 이름 없는 묘비에는 ‘에버니저 스크루지’라고 쓰여 있었어요.'],
    ['🙏','“제발, 제가 달라지겠습니다! 과거와 현재와 미래를 모두 마음에 새기겠습니다!” 스크루지가 울부짖는 순간, 눈을 떠 보니 자기 침대였어요. 크리스마스 아침이었어요!'],
    ['🦃🎁','스크루지는 창문을 열고 소년에게 가장 큰 칠면조를 사서 크래칫 집에 보내 달라고 했어요. 그리고 가난한 사람들을 돕는 데 큰돈을 내고, 조카의 크리스마스 파티에도 찾아갔어요.'],
    ['😊','다음 날 스크루지는 밥의 월급을 올려 주었어요. 팀에게는 두 번째 아버지가 되어 주었고, 팀은 건강을 되찾았어요. 사람들은 말했어요. “스크루지만큼 크리스마스를 잘 보내는 사람은 없다!”']],
    qs:[['말리의 유령이 쇠사슬을 끌고 다닌 까닭은?','살아 있을 때 돈만 알았던 벌 때문에',['감옥에서 도망쳐서','크리스마스를 좋아해서','스크루지에게 선물하려고'],'욕심으로 살아온 삶의 무게예요.'],['스크루지가 달라지기로 결심한 결정적 장면은?','미래에 아무도 슬퍼하지 않는 자기 죽음을 보았을 때',['칠면조를 샀을 때','월급을 올렸을 때','석탄을 아꼈을 때'],'이름 없는 묘비에서 자기 이름을 보았어요.'],['이 작품의 주제로 알맞은 것은?','나누고 베푸는 삶의 소중함',['돈을 아끼는 방법','유령의 무서움','크리스마스 음식 만들기'],'구두쇠가 나눔의 기쁨을 깨닫는 이야기예요.']]},
  {id:'miserables', lv:2, e:'🕯️', t:'레 미제라블', by:'빅토르 위고', pages:[
    ['🍞','장 발장은 굶주린 조카들을 위해 빵 한 조각을 훔치다 붙잡혔어요. 탈옥을 하려다 형이 늘어나 무려 19년을 감옥에서 보냈어요. 풀려났을 때 그의 마음은 세상에 대한 분노로 가득 차 있었어요.'],
    ['🚪','전과자라는 노란 통행증 때문에 어느 여관도 그를 받아 주지 않았어요. 추위에 떨던 장 발장은 미리엘 주교의 집 문을 두드렸어요. 주교는 그를 “형제여” 하고 부르며 따뜻한 저녁을 차려 주고 잠자리를 내주었어요.'],
    ['🥄','그러나 한밤중, 장 발장은 주교의 은식기를 훔쳐 달아났어요. 다음 날 아침 헌병들이 그를 붙잡아 주교 앞에 끌고 왔어요.'],
    ['🕯️🕯️','주교는 뜻밖의 말을 했어요. “아, 왔구려! 은촛대도 드렸는데 왜 두고 가셨소?” 그리고 헌병들이 떠나자 조용히 말했어요. “이 은으로 정직한 사람이 되겠다고 약속하시오. 나는 당신의 영혼을 산 것이오.”'],
    ['😭','장 발장은 한참 동안 울었어요. 태어나 처음 받아 보는 용서와 사랑이었어요. 그는 그날부터 완전히 다른 사람이 되기로 결심했어요.'],
    ['🏭','몇 년 뒤, 장 발장은 이름을 바꾸고 공장을 세워 가난한 사람들에게 일자리를 주었어요. 사람들의 존경을 받아 시장까지 되었지요. 그는 가엾은 여인 판틴을 도와주고, 그녀의 딸 코제트를 끝까지 지켜 주겠다고 약속했어요.'],
    ['👮','그런데 끈질긴 경감 자베르가 늘 그를 의심하며 뒤쫓았어요. 게다가 다른 사람이 장 발장으로 몰려 재판을 받게 되자, 장 발장은 모든 것을 잃을 줄 알면서도 법정에 나가 말했어요. “내가 장 발장이오.”'],
    ['👧❤️','장 발장은 평생 쫓기면서도 코제트를 친딸처럼 사랑으로 키웠어요. 삶의 마지막 날, 그는 주교가 준 은촛대의 불빛 아래에서 코제트의 손을 잡고 평화롭게 눈을 감았어요.']],
    qs:[['장 발장이 처음 감옥에 간 까닭은?','굶주린 조카들을 위해 빵을 훔쳐서',['은식기를 훔쳐서','싸움을 해서','공장을 세워서'],'빵 한 조각 때문에 시작된 일이었어요.'],['주교가 은촛대까지 내어 준 까닭은?','장 발장을 용서하고 새 사람이 되게 하려고',['은촛대가 싫어서','헌병이 무서워서','장 발장이 친척이어서'],'“나는 당신의 영혼을 산 것이오.”'],['장 발장이 법정에 나가 자신을 밝힌 행동에서 알 수 있는 것은?','자기를 희생하더라도 정직하게 살려는 마음',['유명해지고 싶은 마음','자베르를 이기려는 마음','시장 자리를 지키려는 마음'],'죄 없는 사람이 벌받지 않게 했어요.']]},
  {id:'venice', lv:2, e:'⚖️', t:'베니스의 상인', by:'윌리엄 셰익스피어', pages:[
    ['⛵','베니스의 상인 안토니오는 마음씨 좋고 너그러운 사람이었어요. 친구 바사니오가 벨몬트의 지혜로운 여인 포샤에게 청혼하려는데 돈이 없다고 하자, 안토니오는 기꺼이 돕기로 했어요.'],
    ['💰📜','하지만 안토니오의 재산은 모두 바다 위 배에 실려 있었어요. 그래서 고리대금업자 샤일록에게 3천 더컷을 빌렸어요. 샤일록은 이상한 조건을 걸었어요. “석 달 안에 못 갚으면 당신 살 1파운드를 베어 내겠소.”'],
    ['💍','바사니오는 지혜를 겨루는 상자 고르기에서 금 · 은 · 납 상자 가운데 겉모습이 초라한 납 상자를 골라 포샤와 결혼하게 되었어요.'],
    ['🌊😰','그런데 나쁜 소식이 들려왔어요. 안토니오의 배들이 모두 바다에서 사라졌다는 거예요. 약속한 날까지 돈을 갚지 못하자, 샤일록은 법정에 가서 약속대로 살 1파운드를 달라고 요구했어요.'],
    ['⚖️','법정에 젊은 재판관이 나타났어요. 사실 남장을 한 포샤였어요. 포샤는 먼저 샤일록에게 자비를 베풀라고 부탁했지만, 샤일록은 차갑게 거절했어요. “나는 증서대로 하겠소!”'],
    ['🔪❌','“좋소. 증서대로 살 1파운드를 가져가시오. 그러나 증서에는 ‘피’라는 말이 없소. 피를 한 방울이라도 흘리면 당신 재산은 모두 몰수될 것이오. 또 1파운드에서 조금이라도 많거나 적으면 안 되오.”'],
    ['😲','샤일록은 할 말을 잃었어요. 결국 그는 돈도 받지 못하고, 남의 목숨을 노린 죄로 재산의 절반을 내놓아야 했어요.'],
    ['🎉','안토니오는 목숨을 건졌고, 얼마 뒤 사라졌던 배들도 무사히 돌아왔어요. 모두가 포샤의 지혜에 감탄했답니다.']],
    qs:[['안토니오가 샤일록에게 돈을 빌린 까닭은?','친구 바사니오의 청혼을 돕기 위해',['배를 사려고','빚을 갚으려고','집을 지으려고'],'친구를 위해서였어요.'],['포샤가 안토니오를 구한 논리는?','증서에 ‘피’라는 말이 없으니 피를 흘리면 안 된다.',['돈을 두 배로 갚았다.','샤일록을 감옥에 보냈다.','증서를 찢어 버렸다.'],'증서의 글자를 그대로 따지는 지혜였어요.'],['바사니오가 납 상자를 고른 일에서 알 수 있는 것은?','겉모습보다 속에 담긴 것이 중요하다.',['금이 가장 값지다.','상자는 무거울수록 좋다.','운이 가장 중요하다.'],'초라한 납 상자에 포샤의 초상화가 들어 있었어요.']]},
  {id:'heosaeng', lv:2, e:'📚', t:'허생전', by:'박지원', pages:[
    ['🏚️📖','조선 시대 한양 남산골에 허생이라는 선비가 살았어요. 그는 10년 동안 방에 틀어박혀 글만 읽었어요. 살림은 아내가 삯바느질로 겨우 꾸려 나갔지요.'],
    ['😤','어느 날 아내가 울며 말했어요. “평생 과거도 보지 않고 글만 읽으면 무엇 하나요? 도둑질이라도 해 오세요!” 허생은 책을 덮으며 탄식했어요. “아깝다, 10년을 채우려 했는데 7년밖에 못 읽었구나.”'],
    ['💰','허생은 한양에서 제일가는 부자 변 씨를 찾아가 다짜고짜 돈 만 냥을 빌려 달라고 했어요. 변 씨는 허생의 초라한 옷차림에도 당당한 눈빛을 보고, 이름도 묻지 않고 돈을 내주었어요.'],
    ['🍎🍐','허생은 안성으로 가서 제사에 꼭 필요한 대추, 밤, 감, 배 같은 과일을 몽땅 사들였어요. 얼마 뒤 과일이 모자라 잔치도 제사도 못 치르게 되자, 과일값이 열 배로 뛰었어요. 허생은 이번에는 제주도에서 말총을 모조리 사들여 또 큰돈을 벌었어요.'],
    ['😔','허생은 탄식했어요. “겨우 만 냥으로 온 나라의 물건값을 흔들 수 있다니, 이 나라 경제가 얼마나 약한지 알겠구나.”'],
    ['🏝️','허생은 먹고살 길이 없어 도둑이 된 사람들을 모아 빈 섬으로 데려갔어요. 그들에게 땅과 소를 나누어 주고 농사를 짓게 하자, 섬은 곧 풍요로워졌어요. 허생은 쓸 만큼만 남기고 나머지 돈을 바다에 던져 버렸어요.'],
    ['💸🙇','허생은 변 씨에게 돌아가 빌린 돈의 열 배인 10만 냥을 갚았어요. 변 씨가 이자를 받지 않겠다고 해도, 허생은 “재물로 사람의 얼굴을 바꾸는 일은 하지 않소.” 하며 부귀를 거절했어요.'],
    ['🏛️','변 씨의 소개로 나라의 높은 관리 이완이 인재를 구하러 찾아왔어요. 허생이 나라를 튼튼히 할 세 가지 계책을 말했지만, 이완은 체면과 예법을 핑계로 모두 어렵다고 했어요. 허생은 크게 꾸짖고 칼을 들어 쫓아냈어요.'],
    ['🚪','다음 날 이완이 다시 찾아갔을 때, 허생의 집은 텅 비어 있었어요. 허생은 어디론가 사라져 다시는 볼 수 없었답니다.']],
    qs:[['허생이 과일과 말총을 몽땅 사들여 보여 준 것은?','적은 돈으로도 물건값이 흔들릴 만큼 나라 경제가 약하다는 것',['과일이 몸에 좋다는 것','말총으로 모자를 만드는 법','제사를 지내지 말아야 한다는 것'],'허생 스스로 이 점을 탄식했어요.'],['허생이 도둑들을 섬으로 데려간 까닭은?','먹고살 길을 마련해 주려고',['벌을 주려고','보물을 찾으려고','군대를 만들려고'],'땅과 소를 주어 농사를 짓게 했어요.'],['이완을 꾸짖은 장면에서 드러나는 작가의 생각은?','체면과 형식만 따지는 양반들을 비판한다.',['관리들은 모두 훌륭하다.','돈이 가장 중요하다.','책은 읽지 않아도 된다.'],'실제로 나라를 위한 일보다 체면을 앞세운 태도를 꾸짖었어요.']]},
  {id:'camellia', lv:2, e:'🐓', t:'동백꽃', by:'김유정', pages:[
    ['🐓💢','오늘도 또 우리 수탉이 막 쫓기었다. 점순이네 수탉이 덩치 큰 몸으로 우리 수탉의 볏을 쪼아 피가 뚝뚝 흘렀다. 닭싸움을 붙인 건 역시 점순이였다.'],
    ['🥔','며칠 전 일이다. 내가 울타리를 엮고 있는데 점순이가 오더니 앞치마 속에서 뭔가를 쓱 내밀었다. “느 집엔 이거 없지?” 하얗게 김이 나는 감자 세 개였다.'],
    ['🙅‍♂️','나는 괜히 퉁명스러워졌다. “난 감자 안 먹는다. 너나 먹어라.” 그랬더니 점순이는 얼굴이 새빨개지더니, 눈물까지 글썽이며 홱 돌아서 가 버렸다.'],
    ['😤','그날부터 점순이는 나를 못살게 굴었다. 우리 씨암탉을 때리지 않나, 틈만 나면 자기네 수탉과 우리 수탉을 싸움 붙이지 않나. 우리 집은 점순이네 땅을 부쳐 먹고 사는 처지라 나는 속으로만 끙끙 앓았다.'],
    ['🌶️','약이 오른 나는 우리 수탉에게 고추장을 먹였다. 힘이 나라고 말이다. 그러나 수탉은 잠깐 기운을 차리는 듯하더니 또 지고 말았다.'],

    LQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${esc(q.explain)}</small>`;

/* ───── 연산 (단계별): 두 수 덧셈 · 뺄셈은 세로셈 판, 나머지는 가로식 □ 칸 (엔진은 방마다 같고, 단계표 CALC_LEVELS만 달라요) ───── */

function cxVert(P){

    <div></div>${cols.map(i=>`<div class="dg" ${strike[i]?'style="text-decoration:line-through;text-decoration-color:var(--no)"':''}>${dig(a,i)}</div>`).join('')}

function cxVHint(P){
  const {a,b,op}=P.v, PL=['일','십','백','천'], n=Math.max(String(a).length,String(b).length), d=(x,i)=>+String(x).padStart(n+1,'0').slice(-1-i)[0]||0, out=[];

  else { const top=[...Array(n+1)].map((_,i)=>d(a,i)); for(let i=0;i<n;i++){ const bi=d(b,i);

/* 가로식: {0} {1} … 자리에 답 칸 */
function cxHoriz(P){

function cxAnsTxt(P){ if(P.v){ const {a,b,op}=P.v; return String(op==='-'?a-b:a+b); } return P.lab?P.ans.map((x,i)=>`${P.lab[i]} ${x}`).join(', '):P.ans.join(', '); }

    if(P.v){ const s=cxAnsTxt(P); P.cells=P.cells.map((_,i)=>s[s.length-1-i]||''); } else P.in=P.ans.slice();
    P.msg=`정답은 <b>${cxAnsTxt(P)}</b> 이에요.${P.v?`<br><small>${cxVHint(P)}</small>`:P.hint?`<br><small>${P.hint}</small>`:''}`; drawCalc(); return;
  }
  if(P.v){
    if(/^\d$/.test(v)){ P.cells[P.sel]=v; if(P.sel<P.n-1) P.sel++; drawCalc(); return; }
    if(v==='del'){ if(P.cells[P.sel]===''&&P.sel>0) P.sel--; P.cells[P.sel]=''; drawCalc(); return; }

/* 연산 단계표 (초4) */
const cxHund = () => cxR(10,89)*10+cxR(1,9);   // 소수 둘째 자리까지 (100배 정수, 끝자리 0 아님)
const CALC_LEVELS = [
  {n:'세 자리 × 두 자리', d:'세 자리 × 두 자리 · 예: 426 × 37', g:()=>{ const a=cxR(101,999), b=cxR(11,99), o=b%10, t=b-o;
    return cxH(`${a} × ${b} = {0}`,[a*b],{hint:`${a} × ${o} = ${a*o}, ${a} × ${t} = ${a*t} → ${a*o} + ${a*t} = <b>${a*b}</b>`}); }},

    return Math.random()<.6 ? cxH(`${top}검산: ${d} × ${q} + ${r} = {0}`,[a],{hint}) : cxH(`${top}검산: ${d} × {0} + ${r} = ${a}`,[q],{hint:`검산식에는 몫이 들어가요 → ${d} × <b>${q}</b> + ${r} = ${a}`}); }},
  {n:'분수의 덧셈 · 뺄셈', d:'분모가 같은 분수 (진분수) · 예: 2/7 + 3/7, 6/9 − 2/9', g:()=>{ const d=cxR(3,12), o={lab:['분자','분모'],hideLab:true};

    if(Math.random()<.5){ const W=cxR(3,7), w=cxR(1,W-2), n=cxR(1,d-1);

    let a=cxR(21,99); if(a%10===0) a++; const b=cxR(10,a-1)*10+cxR(1,9), ans=cxTrim(cxD(a*10-b,2));
    return cxH(`${(a/10).toFixed(1)} − ${cxD(b,2)} = {0}`,[ans],{dec:true,hint:`${(a/10).toFixed(1)}을(를) ${cxD(a*10,2)}으로 자리를 맞춰요: ${cxD(a*10,2)} − ${cxD(b,2)} = <b>${ans}</b>`}); }}

const decoItem = id => DECO_ITEMS.find(x=>x.id===id);
function decoGet(){
  const d=Object.assign({base:'dog', hat:null, acc:null, pet:null, bg:'plain', own:[], spent:0, at:0}, store.get('deco',{}));
  DECO_ITEMS.forEach(x=>{ if(!x.p && !d.own.includes(x.id)) d.own.push(x.id); });
  return d;
}
function decoSave(d){ d.at=Date.now(); store.set('deco',d); cloudPush(); drawMeTile(); }
const decoLeft = () => Math.max(0, stars - (decoGet().spent||0));   // 쓸 수 있는 별
function decoStage(d, big=true){
  const bg=decoItem(d.bg)||decoItem('plain'), it=k=>d[k]?decoItem(d[k]):null, base=decoItem(d.base)||decoItem('dog');
  const spots=[[8,14],[82,10],[14,58],[86,52]];
  return `<div class="me-stage ${big?'':'mini'}" style="background:${bg.g}">
    ${bg.d.map((e,i)=>`<span class="me-deco" style="left:${spots[i%4][0]}%;top:${spots[i%4][1]}%">${e}</span>`).join('')}
    <div class="me-floor"></div>
    <div class="me-char"><span class="me-base">${base.e}</span>
      ${it('hat')?`<span class="me-hat">${it('hat').e}</span>`:''}
      ${it('acc')?`<span class="me-acc ${d.acc==='glasses'?'face':''}">${it('acc').e}</span>`:''}</div>
    ${it('pet')?`<span class="me-pet">${it('pet').e}</span>`:''}
  </div>`;
}
function drawMeTile(){ const t=document.getElementById('dkMe'); if(t) t.textContent=(decoItem(decoGet().base)||decoItem('dog')).e; }
function renderMyRoom(){
  const d=decoGet(), cat=App.decoCat||'base', pick=App.decoPick, left=decoLeft();
  const card=x=>{ const own=d.own.includes(x.id), on=d[x.k]===x.id, can=left>=x.p;
    return `<button class="me-item ${on?'on':''} ${own?'own':''} ${pick===x.id?'pick':''}" data-act="decoTap" data-v="${x.id}">
      <span class="me-ie">${x.e}</span><b>${x.n}</b>
      <small>${on?(x.k==='base'||x.k==='bg'?'사용 중':'입는 중 · 벗기'):own?(x.p?'가지고 있어요':'무료'):`<span class="${can?'':'no'}">⭐ ${x.p}</span>`}</small></button>`; };
  const P=pick?decoItem(pick):null;
  view.innerHTML=`<div class="me-head"><div><b>${josa(who,'이의','의')} 캐릭터 방</b><span class="sub">모은 별로 꾸며요 · 별을 써도 스티커는 그대로예요</span></div>
      <div class="me-bank"><span>쓸 수 있는 별</span><b>⭐ ${left}</b><small>모은 별 ${stars} · 쓴 별 ${d.spent||0}</small></div></div>
    <div class="card me-card">${decoStage(d)}</div>
    ${P?`<div class="me-buy card"><span class="me-ie">${P.e}</span><div><b>${P.n}</b><div class="sub">${left>=P.p?`별 ${P.p}개로 살까요? 사고 나면 쓸 수 있는 별은 ${left-P.p}개예요.`:`별이 ${P.p-left}개 더 필요해요. 문제를 풀어서 별을 모아요!`}</div></div>
      ${left>=P.p?`<button class="big-btn me-yes" data-act="decoBuy" data-v="${P.id}">⭐ ${P.p} 사기</button>`:''}<button class="pill" data-act="decoTap" data-v="">닫기</button></div>`:''}
    <div class="seg">${Object.entries(DECO_CATS).map(([k,n])=>`<button class="pill ${cat===k?'on':''}" data-act="decoCat" data-v="${k}">${n}</button>`).join('')}</div>
    <div class="me-grid">${DECO_ITEMS.filter(x=>x.k===cat).map(card).join('')}</div>`;
}
function decoTap(id){
  const d=decoGet(), x=decoItem(id); if(!x){ App.decoPick=null; renderMyRoom(); return; }
  if(d.own.includes(id)){
    if(x.k==='base'||x.k==='bg') d[x.k]=id; else d[x.k]=d[x.k]===id?null:id;   // 모자 · 소품 · 친구는 한 번 더 누르면 벗어요
    App.decoPick=null; decoSave(d); renderMyRoom(); return;
  }
  App.decoPick=App.decoPick===id?null:id; renderMyRoom();
}
function decoBuy(id){
  const d=decoGet(), x=decoItem(id); if(!x || d.own.includes(id)) return;
  if(decoLeft()<x.p){ toast('별이 조금 모자라요'); return; }
  d.spent=(d.spent||0)+x.p; d.own.push(id); d[x.k]=id; App.decoPick=null; decoSave(d);
  beep(true); burst(); toast(`${x.e} ${x.n}을(를) 샀어요!`); renderMyRoom();
}

function drawCSQuiz(s,u){
  const b=document.getElementById('csbody'); if(!b) return;
  if(!CQ || CQ.s!==s || CQ.uid!==u.id) CQ={s, uid:u.id, i:0, score:0, tried:false, solved:false, picked:[], note:'', done:false, res:[],
    list:shuffle(u.qs).slice(0,10).map(([q,a,o,ex])=>({q, ans:a, choices:shuffle([a,...o]), explain:ex}))};
  if(CQ.done){
    b.innerHTML=`<div class="card center"><p class="sub">${u.e} ${u.n}</p><p class="big">${CQ.score===CQ.list.length?'🏆 모두 한 번에 맞혔어요!':`${CQ.list.length}문제 중 ${CQ.score}개를 한 번에 맞혔어요!`}</p>
      <p>받은 별: ⭐ ${CQ.earned}개</p><button class="big-btn" data-act="csAgain" data-k="${s}">다시 하기</button>
      <div class="center"><button class="linkbtn" data-act="csMode" data-k="${s}" data-v="learn">📖 설명 다시 보기</button></div></div>`;
    return;
  }
  const q=CQ.list[CQ.i], cls=i=>CQ.solved&&q.choices[i]===q.ans?'ok':(CQ.picked.includes(i)?'no':'');
  b.innerHTML=`<div class="card"><div class="qtop"><span>${u.e} ${u.n} · ${CQ.i+1} / ${CQ.list.length}</span><span>⭐ ${CQ.score}</span></div>
    <div class="dots">${CQ.list.map((_,i)=>`<span class="dot ${i<CQ.i?(CQ.res[i]?'ok':'no'):(i===CQ.i?'cur':'')}"></span>`).join('')}</div>
    <div class="sq ko-q">${esc(q.q)}</div>
    <div class="choices words">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="csPick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
    ${CQ.note?`<div class="hint">${CQ.note}</div>`:''}${CQ.solved?'':skipBtn('csSkip')}</div>`;
}
function csAnswer(i){
  if(!CQ||CQ.solved||CQ.done) return;
  const s=CQ.s, u=csUnitOf(s,CQ.uid), q=CQ.list[CQ.i], skip=i<0;
  const note=()=>{ if(!CQ.tried && typeof addWrong==='function') addWrong(s, u.n, {html:esc(q.q), choices:q.choices, ans:q.ans, explain:q.explain}); };
  if(!skip && q.choices[i]===q.ans){
    CQ.solved=true; CQ.res[CQ.i]=!CQ.tried; beep(true); markO(); logToday(s, !CQ.tried, u.n);
    if(!CQ.tried){ CQ.score++; addStar(1); }
    CQ.note=`<span class="praise">${praise()}</span><br><small>${esc(q.explain)}</small>`;
  } else if(!skip){
    if(CQ.picked.includes(i)) return;
    note(); CQ.tried=true; CQ.picked.push(i); beep(false); CQ.note='💡 '+esc(q.explain); drawCSQuiz(s,u); return;
  } else {
    note(); CQ.tried=true; CQ.solved=true; CQ.res[CQ.i]=false; beep(false); logToday(s, false, u.n);
    CQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${esc(q.explain)}</small>`;
  }
  drawCSQuiz(s,u);
  const me=CQ;
  setTimeout(()=>{
    if(CQ!==me) return;
    CQ.i++; CQ.tried=false; CQ.solved=false; CQ.picked=[]; CQ.note='';
    if(CQ.i>=CQ.list.length){
      CQ.done=true; const all=CQ.score===CQ.list.length; CQ.earned=CQ.score+(all?2:0); if(all) addStar(2); if(CQ.score>=8) burst();
      const B=store.get('csbest',{}), k=s+'|'+CQ.uid; B[k]=Math.max(B[k]===undefined?-1:B[k], CQ.score); store.set('csbest',B); cloudPush();
    }
    if(App.view===s && csState(s).mode==='quiz') drawCSQuiz(s,u);
  }, skip?2600:1600);
}

function sqAnswer(i, skip){
  if(!SQ||SQ.solved||SQ.done) return;
  const st=STORIES.find(s=>s.id===SQ.id), q=SQ.list[SQ.i], sub='이야기 퀴즈';
  const wq={html:`<div class="sub">『${st.t}』 이야기에서</div>${esc(q.q)}`, choices:q.choices, ans:q.ans, explain:`${st.e} ${st.t} (${st.sub})`};

    SQ.solved=true; beep(true); markO(); logToday('history', !SQ.tried, sub);
    if(!SQ.tried){ SQ.score++; addStar(1); }

  } else {
    if(!skip && SQ.picked.includes(i)) return;

const hsChoices = (ans, pool, n=4) => shuffle([ans, ...shuffle([...new Set(pool)].filter(x=>x!==ans)).slice(0,n-1)]);
function qWho(it){
  const pool=hisPool().filter(x=>x.type===it.type).map(x=>x.t);
  return {id:it.t, html:`<div class="hs-qd">${it.d}</div>${it.type==='p'?'이 사람은 누구일까요?':'무엇일까요?'}`, ans:it.t, choices:hsChoices(it.t,pool), explain:`${it.e} ${it.t} (${eraName(it.era)})`};
}
function qEra(it){
  return {id:it.t, html:`<div class="hs-qe">${it.e}</div><b>${it.t}</b>${josa(it.t,'은','는').slice(it.t.length)} 어느 시대일까요?`, ans:eraName(it.era), choices:hsChoices(eraName(it.era), hisEras().map(e=>e[1])), explain:it.d};
}
function qOrder(){
  const eras=shuffle(hisEras().map(e=>e[0])).slice(0,4);
  const its=eras.map(k=>one(hisPool().filter(x=>x.era===k)));
  const first=Math.random()<0.6;
  const sorted=its.slice().sort((a,b)=>eraIdx(a.era)-eraIdx(b.era));
  const ans=(first?sorted[0]:sorted[3]).t;
  return {id:ans, html:`시대 순서를 생각해 봐요.<br><b>가장 ${first?'먼저':'나중에'}</b> 있었던 것은?`, ans, choices:shuffle(its.map(x=>x.t)),
    explain:sorted.map(x=>`${x.t}(${eraName(x.era)})`).join(' → ')};
}
const HQ_KIND = {quiz:'퀴즈', mock:'급수 연습 시험', order:'시대 순서 맞히기', wrong:'오답 다시 풀기'};
function startHQ(kind){
  let list=[];
  const P=hisPool();
  if(kind==='quiz'){
    const pool=App.hqera==='all'?P:P.filter(x=>x.era===App.hqera);
    list=shuffle(pool).slice(0,10).map(it=> App.hqera==='all' && Math.random()<0.35 ? qEra(it) : qWho(it));
    while(list.length<10) list.push(qWho(one(pool)));
  } else if(kind==='mock'){
    list=shuffle(P).slice(0,14).map(it=>Math.random()<0.7?qWho(it):qEra(it));
    for(let i=0;i<6;i++) list.push(qOrder());
    list=shuffle(list);
  } else if(kind==='order'){
    list=Array.from({length:10},qOrder);
  } else if(kind==='wrong'){
    const w=Object.keys(store.get('hwrong',{}));
    list=shuffle(HISTORY.filter(x=>w.includes(x.t))).slice(0,10).map(qWho);
    if(!list.length){ toast('오답 노트가 비어 있어요 👍'); return; }
  }
  HQ={kind, list, i:0, score:0, tried:false, solved:false, wrong:[], done:false, start:Date.now(), single:kind==='mock', lv:App.hslv};
  drawHQ();
}

}

function drawHQ(){
  const b=document.getElementById('hsbody'); if(!b||!HQ) return;
  if(HQ.done){
    let res='';
    if(HQ.kind==='mock'){
      const pts=HQ.score*5, msg=pts>=90?'아주 잘했어요! 시험 준비 완료 🏆':pts>=70?'조금만 더! 틀린 문제를 복습해요 💪':'📚 이야기책부터 다시 읽어 봐요';
      res=`<p class="big">${pts}점</p><p>${msg}</p><p class="sub">걸린 시간: ${fmt(HQ.sec)}</p>`;
    } else res=`<p class="big">${HQ.score===HQ.list.length?'🏆 모두 한 번에 맞혔어요!':`${HQ.list.length}문제 중 ${HQ.score}개를 한 번에 맞혔어요!`}</p>`;
    b.innerHTML=`${hqEraPills()}<div class="card center"><p class="sub">${HQ.lv}급 ${HQ_KIND[HQ.kind]}</p>${res}<p>받은 별: ⭐ ${HQ.score}개</p>
      ${HQ.wrong.length?`<p class="sub">틀린 ${HQ.wrong.length}문제는 📒 오답 노트와 🔁 복습함에 모았어요.</p>`:''}
      <button class="big-btn" data-act="hqStart" data-v="${HQ.kind}">다시 하기</button>
      ${HQ.kind==='quiz'?'':'<div class="center"><button class="linkbtn" data-act="hqQuit">◀ 뒤로 가기</button></div>'}</div>`;
    return;
  }
  const q=HQ.list[HQ.i], n=HQ.list.length;
  const cls=i=> HQ.solved && q.choices[i]===q.ans ? 'ok' : (HQ.picked && HQ.picked.includes(i) ? 'no' : '');
  b.innerHTML=`${hqEraPills()}<div class="card">
      <div class="qtop"><span>${HQ_KIND[HQ.kind]} · ${HQ.i+1} / ${n}</span><span>⭐ ${HQ.score}</span></div>
      <div class="sq hs-q">${q.html}</div>
      <div class="choices words hs-ch">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="hqPick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
      ${HQ.solved && HQ.note ? `<div class="hint">${HQ.note}</div>` : ''}
      ${HQ.solved?'':skipBtn('hqSkip')}
      ${HQ.kind==='quiz'?'':'<div class="center"><button class="linkbtn" data-act="hqQuit">◀ 뒤로 가기</button></div>'}
    </div>`;
}
const hqSub = () => HQ_KIND[HQ.kind==='wrong'?'quiz':HQ.kind];
function hqMiss(q){ if(!HQ.tried){ HQ.tried=true; HQ.wrong.push(q.id); hsWrongNote(q.id,true); addWrong('history', hqSub(), q); } }
function hqPick(i){
  if(!HQ||HQ.solved||HQ.done) return;
  const q=HQ.list[HQ.i]; HQ.picked=HQ.picked||[];
  if(q.choices[i]===q.ans){
    HQ.solved=true; beep(true); markO(); logToday('history', !HQ.tried, hqSub());
    if(!HQ.tried){ HQ.score++; addStar(1); if(HQ.kind==='wrong') hsWrongNote(q.id,false); }
    HQ.note=`<span class="praise">${praise()}</span>`;
    drawHQ(); hqNext(1300);
  } else {
    if(HQ.picked.includes(i)) return;
    HQ.picked.push(i); beep(false); hqMiss(q);
    if(HQ.single){ HQ.solved=true; logToday('history', false, hqSub()); HQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${q.explain}</small>`; drawHQ(); hqNext(2600); return; }
    drawHQ();
  }
}
function hqSkip(){
  if(!HQ||HQ.solved||HQ.done) return;
  const q=HQ.list[HQ.i];
  hqMiss(q);
  HQ.solved=true; beep(false); logToday('history', false, hqSub());
  HQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${q.explain}</small>`;
  drawHQ(); hqNext(2600);
}
function hqNext(ms){
  const me=HQ;
  setTimeout(()=>{
    if(HQ!==me) return;
    HQ.i++; HQ.tried=false; HQ.solved=false; HQ.picked=[]; HQ.note='';
    if(HQ.i>=HQ.list.length){
      HQ.done=true; HQ.sec=Math.round((Date.now()-HQ.start)/1000);
      if(HQ.kind==='mock'){ const best=store.get('hmock',0); if(HQ.score*5>best){ store.set('hmock',HQ.score*5); cloudPush(); } }
      if(HQ.score>=HQ.list.length*0.8) burst();
    }
    if(App.view==='history') drawHQ();
  }, ms);
}

/* 관리자 로그인: 온라인 저장(Firebase)이 켜져 있으면 이메일/비밀번호로 들어가요.
   메일 주소가 소스에 드러나지 않도록 SHA-256 값만 적어요. (가스 · 방 앱과 같은 관리자 계정) */
const ADMIN_EMAIL_SHA256 = '22fa372a479af0929cadcbf6b12b6c2dace34800344067ef44b21a0c187487fb';
async function sha256Hex(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const isAdminUser=async u=>{ const em=((u&&u.email)||'').trim().toLowerCase(); return !!em && await sha256Hex(em)===ADMIN_EMAIL_SHA256; };
function admEnter(){
  setMode='admin'; pinBuf=''; drawSettings();

}
function admEmailHTML(){
  const f='display:block;width:100%;box-sizing:border-box;font:inherit;padding:.6rem .8rem;border:2px solid var(--line);border-radius:12px;margin:4px 0 12px;background:var(--paper);color:inherit';
  return `<div class="adm-head"><h3>🔒 관리자 모드</h3><button class="adm-all" data-act="openAllAdmin">📚 전체 관리자 (5명) ↗</button></div>
    <p class="sub" style="margin:0 0 10px;font-size:.9rem">관리자 이메일과 비밀번호로 로그인하세요.</p>

    <input id="admEm" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" style="${f}">
    <label class="lbl" for="admPw">비밀번호</label>
    <input id="admPw" type="password" autocomplete="current-password" style="${f}">
    <button class="big-btn" data-act="admLogin">로그인</button>
    <button class="big-btn" data-act="closeSet" style="opacity:.8">닫기</button>
    <div class="center"><button class="linkbtn" data-act="admReset">비밀번호를 잊었어요</button></div>`;
}
async function admEmailLogin(){
  const em=((document.getElementById('admEm')||{}).value||'').trim().toLowerCase(), pw=(document.getElementById('admPw')||{}).value||'';
  if(!em||!pw){ toast('이메일과 비밀번호를 넣어 주세요'); return; }
  if(await sha256Hex(em)!==ADMIN_EMAIL_SHA256){ toast('관리자 이메일이 아니에요'); return; }
  if(!await cloudInit()){ toast('온라인 저장에 연결하지 못했어요'); return; }
  try{
    const r=await firebase.auth().signInWithEmailAndPassword(em,pw);
    if(await isAdminUser(r.user)){ if(setMode==='pin') admEnter(); }
    else { await firebase.auth().signOut(); toast('관리자 계정이 아니에요'); }
  }catch(e){
    console.warn('로그인 실패',e);
    const m={'auth/invalid-credential':'이메일이나 비밀번호가 맞지 않아요','auth/wrong-password':'비밀번호가 맞지 않아요','auth/user-not-found':'등록되지 않은 이메일이에요','auth/too-many-requests':'여러 번 틀려서 잠시 막혔어요. 조금 뒤에 다시 해 주세요','auth/operation-not-allowed':'Firebase에서 이메일/비밀번호 로그인을 켜 주세요','auth/network-request-failed':'인터넷 연결을 확인해 주세요'}[e.code];
    toast(m||'로그인하지 못했어요');
  }
}
async function admEmailReset(){
  const em=((document.getElementById('admEm')||{}).value||'').trim().toLowerCase();
  if(!em){ toast('이메일을 먼저 넣어 주세요'); return; }
  if(await sha256Hex(em)!==ADMIN_EMAIL_SHA256){ toast('관리자 이메일이 아니에요'); return; }
  if(!await cloudInit()){ toast('온라인 저장에 연결하지 못했어요'); return; }
  try{ await firebase.auth().sendPasswordResetEmail(em); toast('비밀번호 재설정 메일을 보냈어요'); }catch(e){ console.warn(e); toast('메일을 보내지 못했어요'); }

}

/* 한국어로 여러 문장을 차례로 읽어 줘요 */
function speakList(list){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  list.forEach(t=>{ const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=0.9; if(koVoice) u.voice=koVoice; speechSynthesis.speak(u); });
}
const spokenText = el => { const c=el.cloneNode(true); c.querySelectorAll('[data-say]').forEach(x=>{ x.textContent=' '+x.dataset.say+' '; }); c.querySelectorAll('button,svg').forEach(x=>x.remove());
  return c.textContent.replace(/×/g,' 곱하기 ').replace(/−/g,' 빼기 ').replace(/÷/g,' 나누기 ').replace(/°/g,'도').replace(/\s+/g,' ').trim(); };

document.addEventListener('click',e=>{
  lastAct=Date.now();
  if(e.target.id==='settings'){ closeModal(); return; }
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const f=ACT[el.dataset.act]; if(f) f(el.dataset.v, el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ const o=document.getElementById('admPop'); if(o && !o.hidden){ o.hidden=true; return; } }
  lastAct=Date.now();
  if(!document.getElementById('login').hidden){
    if(LP){ if(/^[0-9]$/.test(e.key)) lpinKey(e.key); else if(e.key==='Backspace') lpinKey('del'); return; }
    if(e.key==='Enter' && e.target.id==='newWho') addWho(); return;
  }
  if(e.target.tagName==='INPUT'){ if(e.key==='Enter' && (e.target.id==='admEm'||e.target.id==='admPw')){ ACT.admLogin(); return; } if(e.key==='Enter' && (e.target.id==='bkT'||e.target.id==='bkL')) ACT.addBook(); return; }
  let fn=null;
  if(!document.getElementById('settings').hidden){ if(setMode==='pin') fn=pinKey; }
  else if(App.view==='school' && App.smode==='quiz') fn=sKey;
  if(!fn) return;
  if(/^[0-9]$/.test(e.key)) fn(e.key);
  else if(e.key==='.' && fn===sKey) fn('.');
  else if(e.key==='Backspace') fn('del');
  else if(e.key==='Enter' && fn!==pinKey){ e.preventDefault(); fn('ok'); }
});
