<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#1F8FA8"/>
      <stop offset="1" stop-color="#0A3A5C"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0B3"/>
      <stop offset="0.35" stop-color="#F2C14E"/>
      <stop offset="0.7" stop-color="#C58A22"/>
      <stop offset="1" stop-color="#8A5A12"/>
    </linearGradient>
    <linearGradient id="brassIn" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFE48A"/>
      <stop offset="0.5" stop-color="#D99A2B"/>
      <stop offset="1" stop-color="#7A4D0E"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FE6FA"/>
      <stop offset="0.5" stop-color="#1FA0E0"/>
      <stop offset="1" stop-color="#0A4E9E"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skin" gradientUnits="userSpaceOnUse" x1="0" y1="-50" x2="0" y2="20">
      <stop offset="0" stop-color="#B5CCE8"/>
      <stop offset="0.5" stop-color="#7393C6"/>
      <stop offset="1" stop-color="#4A6CA6"/>
    </linearGradient>
    <clipPath id="glass"><circle cx="90" cy="90" r="52"/></clipPath>
    <clipPath id="body">
      <path d="M130,0 C124,-10 110,-18 88,-20 C80,-31 70,-43 56,-53 C60,-44 60,-27 66,-18 C48,-15 30,-10 16,-5 C8,-14 0,-28 -8,-42 C-4,-28 -2,-12 2,0 C-2,8 -4,18 -6,26 C2,18 10,10 16,5 C34,11 56,17 82,18 C100,18 120,10 130,0 Z"/>
    </clipPath>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#021A30" flood-opacity="0.55"/>
    </filter>
    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="sdrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#04245C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="180" height="180" fill="url(#bg)"/>

  <!-- ring -->
  <g filter="url(#drop)">
    <circle cx="90" cy="90" r="70" fill="url(#brass)"/>
  </g>
  <circle cx="90" cy="90" r="66" fill="none" stroke="#FFF6CC" stroke-width="1" opacity="0.5"/>
  <circle cx="90" cy="90" r="58" fill="url(#brassIn)"/>
  <g fill="#8A5A12">
    <circle cx="90" cy="26" r="3.6"/><circle cx="90" cy="154" r="3.6"/>
    <circle cx="26" cy="90" r="3.6"/><circle cx="154" cy="90" r="3.6"/>
    <circle cx="44.7" cy="44.7" r="3.6"/><circle cx="135.3" cy="44.7" r="3.6"/>
    <circle cx="44.7" cy="135.3" r="3.6"/><circle cx="135.3" cy="135.3" r="3.6"/>
  </g>
  <g fill="#FFF3BF">
    <circle cx="89" cy="25" r="1.4"/><circle cx="89" cy="153" r="1.4"/>
    <circle cx="25" cy="89" r="1.4"/><circle cx="153" cy="89" r="1.4"/>
    <circle cx="43.7" cy="43.7" r="1.4"/><circle cx="134.3" cy="43.7" r="1.4"/>
    <circle cx="43.7" cy="134.3" r="1.4"/><circle cx="134.3" cy="134.3" r="1.4"/>
  </g>

  <!-- window -->
  <g clip-path="url(#glass)">
    <rect x="30" y="30" width="120" height="120" fill="url(#water)"/>
    <path d="M70,30 L84,30 L74,150 L50,150 Z" fill="url(#ray)"/>
    <path d="M100,30 L110,30 L124,150 L104,150 Z" fill="url(#ray)" opacity="0.7"/>
    <path d="M30,140 C50,130 70,134 90,140 C110,146 130,140 150,132 L150,150 L30,150 Z" fill="#0A3F82" opacity="0.6"/>
    <g transform="translate(93,94) scale(0.68) translate(-62,4)" filter="url(#sdrop)">
      <path d="M130,0 C124,-10 110,-18 88,-20 C80,-31 70,-43 56,-53 C60,-44 60,-27 66,-18 C48,-15 30,-10 16,-5 C8,-14 0,-28 -8,-42 C-4,-28 -2,-12 2,0 C-2,8 -4,18 -6,26 C2,18 10,10 16,5 C34,11 56,17 82,18 C100,18 120,10 130,0 Z" fill="url(#skin)"/>
      <g clip-path="url(#body)">
        <path d="M136,1 C120,6 104,5 88,6 C66,7 40,4 14,1 L14,40 L136,40 Z" fill="#F4FAFF"/>
      </g>
      <path d="M98,12 C92,25 80,36 66,44 C72,34 76,25 80,15 Z" fill="#5A7CB4"/>
      <path d="M125,6 Q118,10 109,9" stroke="#24508F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle cx="111" cy="-5" r="4" fill="#0C1F45"/>
      <circle cx="112.4" cy="-6.4" r="1.4" fill="#FFFFFF"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8">
      <circle cx="132" cy="66" r="3.2"/><circle cx="138" cy="54" r="2.2"/><circle cx="134" cy="46" r="1.5"/>
    </g>
    <!-- inner shadow of glass -->
    <circle cx="90" cy="90" r="56" fill="none" stroke="#02203F" stroke-width="10" opacity="0.45" filter="url(#inner)"/>
    <!-- glass reflection -->
    <path d="M52,70 A42,42 0 0 1 82,46" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M50,84 A42,42 0 0 1 51,78" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>
  <circle cx="90" cy="90" r="52" fill="none" stroke="#6B420B" stroke-width="1.5"/>
</svg>
