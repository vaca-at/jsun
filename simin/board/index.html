<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전자칠판 · 행원심인당 자성동이 공부방</title>
<meta name="theme-color" content="#FFF7F0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%AA%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* ───── 🖥️ 전자칠판 (jsun.site/simin/board/) ─────
   가로 전자칠판 한 화면(1280×720)을 화면 크기에 맞춰 늘이고 줄여요. 색은 입구와 같아요 (연분홍 · 연두 · 금빛) */
@font-face{font-family:"OwnglyphYuntaeng";src:url("https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/온글잎 윤탱체.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"OngleipUnz";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2") format("woff2");font-weight:normal;font-display:swap}
:root{
  --bg:#FFF7F0; --paper:#FFFFFF; --ink:#4A3B36; --sub:#8C7A72; --line:#F1DED3;
  --lotus:#F291B2; --lotus-d:#DD6590; --lotus-s:#FDE3EC; --leaf:#7FC39A; --leaf-d:#4E9E70; --leaf-s:#E3F4E8;
  --gold:#D4A24C; --gold-s:#FBF0D9; --no:#E35D5D;
  --font:'Gowun Dodum',system-ui,sans-serif; --font-t:'Jua','Gowun Dodum',sans-serif;
}
:root[data-font="yuntaeng"]{--font:"OwnglyphYuntaeng","Gowun Dodum",sans-serif;--font-t:"OwnglyphYuntaeng","Jua",sans-serif}
:root[data-font="unz"]{--font:"OngleipUnz","Gowun Dodum",sans-serif;--font-t:"OngleipUnz","Jua",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3B3431}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:20px;overflow:hidden}
.t{font-family:var(--font-t);font-weight:normal}
.lbl{font-family:var(--font-t);font-size:18px;color:var(--sub);letter-spacing:.04em}
/* 윗줄 */
.bar{display:flex;align-items:center;gap:14px;height:64px;padding:0 30px}
.bar h1{margin:0;font-family:var(--font-t);font-weight:normal;font-size:32px;flex:1}
.bar .mantra{font-family:var(--font-t);color:var(--gold);letter-spacing:.3em;font-size:15px}
.home{padding:8px 16px;border-radius:999px;background:var(--paper);border:3px solid var(--line);font-family:var(--font-t);font-size:18px}
/* ── 1. 책갈피 네 장 (시작 화면) ── */
.marks{display:grid;grid-template-columns:1.25fr 1.1fr 1fr .95fr;gap:16px;height:636px;padding:0 30px 20px}
.mark{position:relative;padding:58px 14px 50px;background:var(--paper);border:3px solid var(--line);border-top:0;display:flex;flex-direction:column;gap:10px;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 26px),0 100%);min-height:0}
.mark::before{content:"";position:absolute;left:0;right:0;top:0;height:44px;background:var(--c)}
.mark h4{position:absolute;left:16px;top:6px;margin:0;font-family:var(--font-t);font-weight:normal;font-size:24px;color:#fff}
.m1{--c:var(--lotus)} .m2{--c:var(--leaf)} .m3{--c:var(--gold)} .m4{--c:var(--lotus-d)}
.m4{align-items:center;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-t);font-size:21px;padding:7px 12px;border-radius:18px;background:var(--paper);border:3px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--lotus-d);background:var(--lotus-s)}
.cnt{display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0}
.cnt div{display:flex;align-items:center;gap:6px;font-size:17px;background:var(--lotus-s);border-radius:12px;padding:3px 8px}
.cnt div span{flex:1}
.cnt button{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #F7C9D8;font-family:var(--font-t);font-size:18px;line-height:1}
.cnt b{min-width:1.6em;text-align:center;font-family:var(--font-t)}
.mode{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:20px;background:var(--paper);border:3px solid var(--line)}
.mode.on{border-color:var(--leaf-d);background:var(--leaf-s)}
.mode b{font-family:var(--font-t);font-weight:normal;font-size:23px;display:block}
.mode small{font-size:15px;color:var(--sub);line-height:1.45;display:block}
.mode .n{font-family:var(--font-t);color:var(--leaf-d);font-size:16px;white-space:nowrap;letter-spacing:-.3px}
.how{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:18px;background:var(--paper);border:3px solid var(--line);text-align:left}
.how.on{border-color:var(--gold);background:var(--gold-s)}
.how b{font-family:var(--font-t);font-weight:normal;font-size:21px}
.how i{font-style:normal;font-size:28px}
.how em{font-style:normal;margin-left:auto;font-size:14px;color:var(--sub)}
.how:disabled{opacity:.5}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cardf{width:50px;height:68px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-t);font-size:15px;border:2px solid var(--lotus);background:repeating-linear-gradient(45deg,var(--lotus-s) 0 8px,#fff 8px 16px);line-height:1.1;text-align:center;transition:transform .25s}
.cardf.up{background:var(--paper);border-color:var(--lotus-d);color:var(--lotus-d);cursor:default}
.cardf.up b{display:block;font-size:22px}
.picker{font-family:var(--font-t);font-size:18px;color:var(--lotus-d);text-align:center;background:var(--lotus-s);border-radius:14px;padding:6px 8px}
.order{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;font-family:var(--font-t);font-size:19px}
.order span{padding:2px 8px;border-radius:14px;background:var(--lotus-s)}
.order i{font-style:normal;color:var(--sub);font-size:16px}.promise{font-size:15px;background:var(--gold-s);border-radius:16px;padding:6px 10px;line-height:1.5}
.go{font-family:var(--font-t);font-size:28px;border-radius:26px;background:var(--lotus-d);color:#fff;padding:10px 26px;box-shadow:0 6px 0 #B94873}
.go:disabled{background:#E7C2D0;box-shadow:0 6px 0 #D8A9BA}
.go:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #B94873}
.small-link{font-size:15px;color:var(--lotus-d);text-decoration:underline}
.note{font-size:15px;color:var(--sub);line-height:1.45}
/* ── 2. 함께 풀기 ── */
.play{display:grid;grid-template-columns:1fr 330px;gap:18px;height:636px;padding:0 30px 20px}
.turn{display:flex;align-items:center;gap:12px;font-family:var(--font-t);font-size:30px;padding:10px 18px;border-radius:22px;background:var(--lotus-s);border:3px solid #F7C9D8}
.turn .ico{font-size:40px}
.qcard{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:18px 22px;margin-top:12px;height:calc(100% - 78px);display:flex;flex-direction:column}
.qbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;font-size:30px;min-height:0;overflow:hidden}
.qbody .q-pic{font-size:88px;line-height:1.1}
.qbody .q-pic svg{width:190px;height:190px}
.qbody .q-bigl{font-size:78px;font-family:var(--font-t)}
.qbody .q-eq{font-family:var(--font-t);font-size:46px}
.qbody .q-mark{color:var(--lotus-d);border-bottom:4px solid var(--lotus-d);padding:0 .3em}
.qbody .q-p{line-height:1.45}
.qbody .count-pics{font-size:46px;line-height:1.2}
.qbody .two-sides{display:flex;gap:18px;justify-content:center;font-size:40px}
.qbody .two-sides div{padding:6px 14px;border-radius:16px;border:2px solid var(--line)}
.qbody .big{font-size:48px;font-family:var(--font-t)}
.qbody .box,.qbody .blank,.qbody .slot-mark{display:inline-block;min-width:2em;border-bottom:4px solid var(--lotus-d);color:var(--lotus-d)}
.qbody table{border-collapse:collapse;margin:0 auto;font-size:22px}
.qbody td,.qbody th{border:1.5px solid var(--line);padding:4px 10px}
.qbody small{font-size:22px;color:var(--sub)}
.qbody svg{max-height:230px}
.choices{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px;margin-top:12px}
.choice{min-height:86px;padding:8px 10px;border-radius:22px;background:#fff;border:4px solid var(--line);font-family:var(--font-t);font-size:30px;line-height:1.2;box-shadow:0 5px 0 var(--line)}
.choice.pic{font-size:56px}
.choice.long{font-size:21px;font-family:var(--font)}
.choice:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.choice.no{opacity:.35;text-decoration:line-through}
.choice.yes{border-color:var(--leaf-d);background:var(--leaf-s)}
.qtools{position:absolute;right:16px;top:14px;display:flex;gap:8px}
.tool{padding:8px 14px;border-radius:999px;background:var(--gold-s);border:3px solid #EED9A8;font-family:var(--font-t);font-size:18px}
.tool:disabled{opacity:.4}
/* 룰렛 · 사다리 */
.wheel{position:relative;width:176px;height:176px;margin:4px auto 0}
.wheel svg{width:176px;height:176px;display:block}
.wheel .rot{transform-origin:100px 100px;transition:transform 3s cubic-bezier(.17,.67,.2,1)}
.wheel .pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--lotus-d);filter:drop-shadow(0 2px 1px rgba(0,0,0,.2))}
.spin-btn{display:block;margin:4px auto 0;padding:8px 22px;border-radius:999px;background:var(--lotus-d);color:#fff;font-family:var(--font-t);font-size:20px}
.spin-btn:disabled{opacity:.45}
.ladder svg{width:100%;display:block}
.ladder .walk{stroke-dasharray:1;stroke-dashoffset:1;animation:walk 2.2s ease-in-out forwards}
@keyframes walk{to{stroke-dashoffset:0}}
.say-msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);padding:18px 30px;border-radius:26px;background:#fff;border:4px solid var(--leaf);font-family:var(--font-t);font-size:40px;box-shadow:0 10px 30px rgba(0,0,0,.12);pointer-events:none;animation:pop .25s ease-out}
.say-msg.oops{border-color:var(--gold)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.7);opacity:0}}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:12px 14px;overflow:auto;min-height:0}
.panel h3{margin:0 0 6px;font-family:var(--font-t);font-weight:normal;font-size:22px}
.grp{padding:6px 8px;border-radius:14px;margin-bottom:6px}
.grp.cur{background:var(--lotus-s);outline:3px solid #F7C9D8}
.grp.done{opacity:.7}
.grp .gh{display:flex;justify-content:space-between;font-family:var(--font-t);font-size:20px}
.gbar{height:14px;border-radius:99px;background:#F6E3EA;overflow:hidden;margin-top:4px}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lotus),var(--gold));transition:width .4s}
.total{font-family:var(--font-t);font-size:24px;text-align:center}
.total b{font-size:40px;color:var(--lotus-d);display:block;line-height:1.1}
.rules{font-size:16px;line-height:1.55}
.banner{position:absolute;left:50%;top:78px;transform:translateX(-50%);z-index:20;padding:12px 26px;border-radius:999px;background:var(--gold-s);border:3px solid #EED9A8;font-family:var(--font-t);font-size:26px;white-space:nowrap;animation:drop .3s ease-out;box-shadow:0 8px 20px rgba(0,0,0,.1)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
/* ── 3. 축하 · 결과 ── */
.full{height:656px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:0 40px}
.bloom{font-size:120px;line-height:1;animation:bloom 1.4s ease-in-out infinite alternate}
@keyframes bloom{to{transform:scale(1.12) rotate(4deg)}}
.full h2{margin:0;font-family:var(--font-t);font-weight:normal;font-size:52px;color:var(--lotus-d)}
.full p{margin:0;font-size:26px;line-height:1.5}
.btns{display:flex;gap:14px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.btn2{font-family:var(--font-t);font-size:24px;padding:10px 22px;border-radius:22px;background:#fff;border:3px solid var(--line)}
.rain{position:absolute;top:-60px;font-size:40px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(820px) rotate(200deg)}}
/* ── 4. 내 공부방: 나 확인 ── */
.login{display:grid;grid-template-columns:1fr 1fr;gap:24px;height:636px;padding:0 60px 20px;align-items:start}
.lcard{background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:18px 22px}
.lcard h3{margin:0 0 8px;font-family:var(--font-t);font-weight:normal;font-size:26px}
.field{display:block;width:100%;padding:12px 16px;border-radius:18px;border:3px solid var(--line);font:inherit;font-size:28px;text-align:center;background:#FFFDFB;color:var(--ink)}
.field:focus{outline:none;border-color:var(--lotus)}
.pinrow{display:flex;justify-content:center;gap:16px;margin:12px 0}
.pinrow i{width:26px;height:26px;border-radius:50%;border:3px solid var(--lotus);background:#fff}
.pinrow i.f{background:var(--lotus)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto}
.key{height:64px;border-radius:20px;background:#fff;border:3px solid var(--line);font-family:var(--font-t);font-size:30px;box-shadow:0 4px 0 var(--line)}
.key.fn{font-size:18px;font-family:var(--font)}
.msg{min-height:1.5em;text-align:center;color:var(--no);font-size:19px;margin-top:8px}
.msg.ok{color:var(--leaf-d)}
.timer{font-family:var(--font-t);font-size:44px;text-align:center;color:var(--lotus-d)}
/* @@ROOM-CSS START — 나이별 공부방 문제 모양 (build: board-css.js) */
.qbody{--accent:var(--lotus-d);--accent-ink:#fff;--ok:var(--leaf-d);--hi:#FFD84D;--soft:var(--lotus-s);--card:#fff;--muted:var(--sub)}
.qbody h1,.qbody .big,.qbody .tab,.qbody .pill,.qbody .big-btn,.qbody .subj b,.qbody .sheet h3,.qbody .grass-head b,.qbody .bigtime,.qbody .hq,.qbody .qtop,.qbody .letters,.qbody .abc-word,.qbody .ww,.qbody .ph-eq{font-family:var(--font-t),var(--font),'Jua',sans-serif;font-weight:var(--tw)}
.qbody .praise,.qbody .bn-p,.qbody .msg,.qbody .hj-mean,.qbody .hj-qm,.qbody .ph-ko,.qbody .toast,.qbody .hello .big{font-family:var(--font-p),var(--font),'Jua',sans-serif;font-weight:normal}
.qbody .center{text-align:center}
.qbody .sub{color:var(--sub)}
.qbody .big{font-size:1.5rem}
.qbody .clock{width:7.5rem;height:7.5rem;flex:none;display:block}
.qbody .ck-face{fill:var(--paper);stroke:var(--ink);stroke-width:4}
.qbody .ck-tick{stroke:var(--sub);stroke-width:1.5}
.qbody .ck-tick.b{stroke:var(--ink);stroke-width:3}
.qbody .ck-num{fill:var(--ink);font-size:17px;text-anchor:middle;dominant-baseline:central;font-family:'Jua',sans-serif}
.qbody .ck-h{stroke:var(--ink);stroke-width:8;stroke-linecap:round}
.qbody .ck-m{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.qbody .ck-s{stroke:var(--no);stroke-width:2;stroke-linecap:round}
.qbody .ck-c{fill:var(--ink)}
.qbody .hello .big{margin-bottom:4px}
.qbody .clocktile .clock{width:5rem;height:5rem}
.qbody .dg.op{font-size:2.6rem}
.qbody .sq .clock{width:11rem;height:11rem;margin:0 auto 8px}
.qbody .sq .big{font-size:2.2rem}
.qbody .box{display:inline-block;min-width:1.7em;border:3px dashed var(--sub);border-radius:8px;line-height:1.25}
.qbody .tbl{border-collapse:collapse;margin:4px auto 12px;font-size:1rem;line-height:1.3}
.qbody .tbl th,.qbody .tbl td{border:2px solid var(--line);padding:.3rem .5rem;text-align:center;font-weight:normal}
.qbody .tbl th{color:var(--sub)}
.qbody .gtbl td{width:3.4rem;height:1.9rem;padding:0 .3rem;color:var(--accent);font-size:1.4rem;line-height:1}
.qbody .gtbl .ax{border:none;font-size:.85rem}
.qbody .gcap{font-size:1rem;color:var(--sub)}
.qbody .exam-info .tbl{margin:8px 0}
.qbody .ls-big{text-align:center;font-size:1.5rem;line-height:1.6;margin:8px 0;padding:8px;border-radius:14px;background:var(--paper);border:2px dashed var(--line)}
.qbody .ls-big u{color:var(--no);text-decoration:none;font-weight:bold}
.qbody .ls-clock .clock{width:10rem;height:10rem;margin:0 auto}
.qbody .lesson .tbl{margin:8px auto}
.qbody .ko-para{text-align:left;font-size:1.1rem;line-height:1.7;background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.qbody .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-size:.9em}
.qbody .frac>i{font-style:normal;padding:0 .18em;min-width:1em;text-align:center}
.qbody .frac>i:first-child{border-bottom:.12em solid currentColor}
.qbody .frac .ansbox{min-width:1.3em;padding:0 .1em;border:2px dashed var(--accent);border-radius:6px;font-size:1em;line-height:1.2}
.qbody .mixed{white-space:nowrap}
.qbody .shape{display:block;width:100%;max-width:17rem;height:auto;margin:0 auto 6px;overflow:visible}
.qbody .shape .sp{fill:color-mix(in srgb,var(--accent) 12%,var(--paper));stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.qbody .shape .sd{stroke:var(--no);stroke-width:2;stroke-dasharray:5 4}
.qbody .shape text{fill:var(--ink);font-size:15px;text-anchor:middle;dominant-baseline:central;font-family:'Jua',sans-serif}
.qbody .shape .sq-mark{fill:none;stroke:var(--ink);stroke-width:1.5}
.qbody .shape .tk{stroke:var(--no);stroke-width:2.5}
.qbody .lgraph{display:block;width:100%;max-width:24rem;height:auto;margin:0 auto 4px}
.qbody .lgraph .gl{stroke:var(--line);stroke-width:1}
.qbody .lgraph .ax{stroke:var(--ink);stroke-width:1.5}
.qbody .lgraph .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.qbody .lgraph circle{fill:var(--paper);stroke:var(--accent);stroke-width:2.5}
.qbody .lgraph text{fill:var(--sub);font-size:11px;text-anchor:middle;dominant-baseline:central;font-family:'Jua',sans-serif}
.qbody .lgraph .wave{fill:none;stroke:var(--ink);stroke-width:1.5}
.qbody .lgraph .bar{fill:color-mix(in srgb,var(--accent) 45%,var(--paper));stroke:var(--accent);stroke-width:1.5}
.qbody .mv-orig .shape{max-width:7rem}
.qbody .mv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.qbody .mv-grid>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:12px;border:2px dashed var(--line)}
.qbody .mv-grid b{font-weight:normal;font-size:.95rem}
.qbody .mv-grid .shape{max-width:5.2rem;margin:0}
.qbody .hello .big{font-size:1.6rem}
.qbody .cx-sub{width:100%;font-size:.7em;color:var(--sub);margin-bottom:4px}
.qbody .cx-fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;font-size:.85em;margin:0 .1em}
.qbody .cx-fr>i{font-style:normal;padding:0 .2em;min-width:1em;text-align:center}

/* ═════════ 온라인 (내 공부방 들어가기에만 써요) ═════════ */

/* 사다리: 칸마다 가로줄을 무작위로 (옆 가로줄과 붙지 않게, 이웃한 두 줄 사이엔 적어도 하나) */
function makeLadder(n){
  const L=8, rungs=[...Array(L)].map(()=>Array(n-1).fill(false));
  for(let l=0;l<L;l++) for(let c=0;c<n-1;c++) if(!(c>0 && rungs[l][c-1]) && Math.random()<.42) rungs[l][c]=true;
  for(let c=0;c<n-1;c++) if(!rungs.some(r=>r[c])){ let l=rungs.findIndex(r=>!r[c-1] && !r[c+1]); if(l<0){ l=0; rungs[0][c-1]=false; rungs[0][c+1]=false; } rungs[l][c]=true; }
  const ends=[...Array(n)].map((_,s)=>{ let c=s; for(let l=0;l<L;l++){ if(c<n-1 && rungs[l][c]) c++; else if(c>0 && rungs[l][c-1]) c--; } return c; });
  return {n, L, rungs, ends, run:false, done:false};
}
function ladderPath(s, lad, X, Y){   // 위 s번째 줄에서 내려가는 길
  let c=s; const pts=[[X(c),Y(-0.5)]];
  for(let l=0;l<lad.L;l++){ pts.push([X(c),Y(l)]); if(c<lad.n-1 && lad.rungs[l][c]) c++; else if(c>0 && lad.rungs[l][c-1]) c--; pts.push([X(c),Y(l)]); }
  pts.push([X(c),Y(lad.L-0.5)]); return pts.map(p=>p.join(',')).join(' ');
}
const WHEEL_COL = ['#F7B6C8','#BFE3B4','#FFE08A','#B9D8F5','#E4C9F2','#FFC9A8','#CDEBE4'];

function wheelHTML(){
  const left=ST.ages.filter(k=>!ST.spin.list.includes(k)), s=360/Math.max(1,left.length), P=a=>[100+92*Math.sin(a*Math.PI/180), 100-92*Math.cos(a*Math.PI/180)].map(v=>v.toFixed(1)).join(',');
  const seg=left.map((k,i)=>{ const a0=i*s, a1=(i+1)*s, m=(a0+a1)/2, tx=100+60*Math.sin(m*Math.PI/180), ty=100-60*Math.cos(m*Math.PI/180);

${wheelHTML()}
        ${left>0?`<button class="spin-btn" data-act="spin" ${ST.spin.busy?'disabled':''}>🎡 돌리기</button>`:''}
        <button class="small-link" data-act="reshuffle" ${ST.spin.busy?'disabled':''}>🔄 처음부터</button>`;
    } else if(n>1 && ST.how==='ladder'){
      const lad=ST.ladder;
      cards = `<div class="picker">${lad.done?'순서가 정해졌어요!':lad.run?'내려가는 중…':'위에서 아래로 따라가요'}</div>${ladderHTML()}
        ${lad.done||lad.run?'':`<button class="spin-btn" data-act="climb">🪜 사다리 타기</button>`}
        <button class="small-link" data-act="reshuffle" ${lad.run?'disabled':''}>🔄 새 사다리</button>`;
    } else if(n>1 && ST.how==='card'){
      const picker = !orderDone() ? ST.ages.filter(k=>!Object.values(c.up).includes(k))[0] : null;
      // 다 뒤집으면 카드가 숫자 순서(1, 2, 3…)로 다시 늘어서요 → 왼쪽부터 읽으면 그대로 순서
      const slots = picker ? c.nums.map((_,i)=>i) : c.nums.map((_,i)=>i).sort((a,b)=>c.nums[a]-c.nums[b]);
      cards = `${picker?`<div class="picker">${ageOf(picker)[2]} ${nameOf(picker)} 모둠 친구가<br>카드를 한 장 골라요</div><p class="note" style="margin:0;text-align:center">동생부터 한 장씩 뒤집어요 · 카드에 적힌 숫자가 순서예요</p>`:'<div class="picker">순서가 정해졌어요! (숫자 순서대로)</div>'}
        <div class="cards">${slots.map(i=>{ const num=c.nums[i]; return c.up[i]?`<div class="cardf up"><span><b>${num}</b>${nameOf(c.up[i])}</span></div>`:`<button class="cardf" data-card="${i}" aria-label="카드 뒤집기" ${picker?'':'disabled'}>?</button>`; }).join('')}</div>
        <button class="small-link" data-act="reshuffle">🔄 다시 섞기</button>`;
    } else if(n===1) cards='<div class="picker">한 연령대라 바로 시작해요</div>';
    else cards='<p class="note">먼저 ① 연령대를 골라요</p>';
    const busy=(ST.spin&&ST.spin.busy) || (ST.ladder&&ST.ladder.run);
    m3 = `${HOWS.map(([k,nm,e])=>`<button class="how ${ST.how===k?'on':''}" data-how="${k}" ${busy?'disabled':''} ${n>1&&ST.how!==k?'style="padding:3px 12px"':''}><i>${e}</i><b>${nm}</b></button>`).join('')}${cards}`;
  }
  const ready = solo || (ST.ages.length && orderDone());
  const ordPart = ord.length ? ord : ST.how==='roulette' && ST.spin ? ST.spin.list : [];   // 룰렛은 뽑는 대로 바로 보여요
  const goalTxt = solo ? '📚 내 나이 공부방' : ST.mode==='all' ? `🪷 ${per()*(ST.ages.length||1)}송이 (연령대마다 ${per()})` : '🪷 연령대마다 100송이';
  const m4 = `<span class="lbl">${solo?'들어갈 곳':'순서'}</span>
    ${solo?'':`<div class="order">${ordPart.length?ordPart.map((k,i)=>`${i?'<i>→</i>':''}<span>${nameOf(k)}</span>`).join('')+'<i>→</i><span>?</span>'.repeat(ord.length?0:ST.ages.length-ordPart.length):'<span style="background:none;color:var(--sub)">③에서 정해요</span>'}</div>`}
    <span class="t" style="font-size:21px;color:var(--leaf-d)">${goalTxt}</span>
    <div class="promise">${solo?'🙈 친구가 비밀번호 누를 때는<br>살짝 눈 감아 줘요':'🙏 놀리지 않기 · 대신 풀지 않기<br>🙂 틀려도 괜찮다고 말해 주기'}</div>
    <button class="go" data-act="start" ${ready?'':'disabled'}>${solo?'들어가기':'시작하기'}</button>
    <p class="note" style="margin:0">${solo?'🔑 공부한 기록은 내 공부방에 저장돼요':'다 같이 · 학년별은 저장하지 않아요'}</p>`;
  stage.innerHTML = barHTML('다 같이 연꽃 피우기') + `<div class="marks">
    <div class="mark m1"><h4>① 누가 할까요?</h4>${m1}</div>
    <div class="mark m2"><h4>② 어떻게 할까요?</h4>${m2}</div>
    <div class="mark m3"><h4>③ ${solo?'들어가는 법':'순서 정하기'}</h4>${m3}</div>
    <div class="mark m4"><h4>④ 시작!</h4>${m4}</div></div>`;
}

/* ── 함께 풀기 ── */
function startTeam(){
  const ord=orderList(), goal = ST.mode==='all' ? per() : 100;
  G = { kind:'team', mode:ST.mode, groups:ord.map(k=>({k, cnt:ST.cnt[k]||1, friend:0, got:0, goal})), pos:0, q:null, lock:false, loading:false };
  ord.forEach(k=>bankOf(ROOM_OF[k]));   // 미리 열어 둬요
  ST.screen='play'; newTurn(true);
}
const curGroup = () => G.groups[G.pos];
function turnLabel(g){ const a=ageOf(g.k); return `${a[2]} ${a[1]} ${g.cnt>1?`모둠 · ${ORD[g.friend%g.cnt]||`${g.friend%g.cnt+1}번째`} 친구 차례`:'친구 차례'}`; }
async function newTurn(first){
  const g=curGroup(), g0=G; G.q=null; G.lock=false; G.off=new Set(); G.loading=true; render();
  let q=null; try{ q=await nextQ(g.k); }catch(e){ g0.err=e.message; }
  if(G!==g0 || ST.screen!=='play') return;   // 기다리는 동안 그만했으면 그대로
  G.q=q; G.loading=false; render(); showBanner(first?`${turnLabel(g)} · ${PROMISE}`:PROMISE);
  if(G.q){ const s=G.q.say; setTimeout(()=>{ if(G===g0) speak(s); },600); }
}
function showBanner(text){ const old=stage.querySelector('.banner'); if(old) old.remove(); const b=document.createElement('div'); b.className='banner'; b.textContent=text; stage.appendChild(b); setTimeout(()=>b.remove(),2600); }
function choicesHTML(q){ const long=q.choices.some(c=>String(c).length>7); return `<div class="choices" style="--n:${Math.min(4,q.choices.length)}">${q.choices.map((c,i)=>`<button class="choice ${q.pic?'pic':''} ${long?'long':''} ${G.off.has(c)?'no':''}" data-ch="${i}" ${G.off.has(c)||G.lock?'disabled':''}>${esc(c)}</button>`).join('')}</div>`; }
function play(){
  const g=curGroup(), total=G.groups.reduce((a,x)=>a+x.got,0), goalAll=G.groups.reduce((a,x)=>a+x.goal,0);
  const body = G.loading ? '<div class="qbody"><div style="font-size:60px">🪷</div><p>문제를 준비하고 있어요…</p></div>'
    : !G.q ? `<div class="qbody"><p>${esc(G.err||'문제를 불러오지 못했어요')}</p><button class="btn2" data-act="retryQ">다시 불러오기</button></div>`
    : `<div class="qbody">${G.q.html}</div>${choicesHTML(G.q)}`;
  stage.innerHTML = barHTML(G.mode==='all'?'🤝 다 같이 협동':'🎓 학년별 협동') + `<div class="play">
    <div style="min-height:0"><div class="turn"><span class="ico">${ageOf(g.k)[2]}</span><span>${turnLabel(g).replace(/^\S+ /,'')}</span></div>
      <div class="qcard">${G.q?`<div class="qtools"><button class="tool" data-act="sayQ">🔊 다시 듣기</button></div>`:''}${body}</div></div>
    <div class="side">
      <div class="panel total">🪷 우리가 피운 연꽃<b>${total}</b><span style="font-size:18px;color:var(--sub)">목표 ${goalAll}송이</span></div>
      <div class="panel" style="flex:1"><h3>${G.mode==='all'?'모둠마다 연꽃':'연령대 차례'}</h3>${G.groups.map((x,i)=>`<div class="grp ${i===G.pos?'cur':''} ${x.got>=x.goal?'done':''}"><div class="gh"><span>${ageOf(x.k)[2]} ${nameOf(x.k)}${x.cnt>1?` <small style="font-size:14px;color:var(--sub)">${x.cnt}명</small>`:''}</span><span>${x.got>=x.goal?'🌸 활짝!':`${x.got} / ${x.goal}`}</span></div><div class="gbar"><i style="width:${Math.min(100,x.got/x.goal*100)}%"></i></div></div>`).join('')}</div>
      <div class="panel rules">✋ 정답은 <b>차례인 친구만</b> 눌러요<br>📚 각자 <b>자기 나이 문제</b>를 스스로 풀어요<br>🪷 맞히면 <b>한 송이</b><br><button class="small-link" data-act="stop">그만하고 처음 화면으로</button></div>
    </div></div>`;
}
function flash(text, oops){ const m=document.createElement('div'); m.className='say-msg'+(oops?' oops':''); m.textContent=text; stage.appendChild(m); setTimeout(()=>m.remove(), oops?1300:1200); }
function answer(i){
  if(!G.q || G.lock) return; const c=G.q.choices[i];
  if(String(c)===String(G.q.ans)){
    G.lock=true; const add = 1;
    curGroup().got += add;
    render(); const btn=stage.querySelector(`[data-ch="${i}"]`); if(btn) btn.classList.add('yes');
    flash(`딩동댕! 🪷 +${add}`); speak(G.q.after ? `딩동댕! ${G.q.after}` : '딩동댕! 잘했어요!');
    const g0=G; setTimeout(()=>{ if(G!==g0) return; afterTeam(); }, 1500);
  } else {
    G.off.add(c); render(); flash('괜찮아요, 다시 해 봐요!', true); speak('괜찮아요, 다시 해 봐요!');
  }
}
function afterTeam(){
  const g=curGroup(); g.friend++;
  if(G.groups.every(x=>x.got>=x.goal)){ ST.screen='win'; render(); return; }
  if(g.got>=g.goal){ const nx=G.groups.findIndex(x=>x.got<x.goal); showBanner(`🎉 ${nameOf(g.k)} ${g.goal}송이! 다음은 ${nameOf(G.groups[nx].k)} 차례`); G.pos=nx; }   // 한 연령대가 다 채우면 다음 차례
  newTurn(false);
}
function rain(){ for(let i=0;i<34;i++){ const s=document.createElement('span'); s.className='rain'; s.textContent=['🪷','🌸','✨','🎉'][i%4]; s.style.left=Math.random()*1240+'px'; s.style.animationDuration=(2.2+Math.random()*2)+'s'; s.style.animationDelay=(Math.random()*1.2)+'s'; stage.appendChild(s); setTimeout(()=>s.remove(),5000); } }
function win(){
  const total=G.groups.reduce((a,x)=>a+x.got,0);
  stage.innerHTML = barHTML('연꽃 활짝!') + `<div class="full"><div class="bloom">🪷</div><h2>연꽃이 활짝 피었어요!</h2>
    <p>${G.groups.map(x=>nameOf(x.k)).join(' · ')} 친구들이 함께 <b>${total}송이</b>를 피웠어요.<br>도와준 형 · 언니 · 동생 모두 고마워요! 모두 함께 박수 👏</p>
    <div class="btns"><button class="go" data-act="again">🔁 한 번 더</button><button class="btn2" data-act="toSetup">처음 화면</button></div></div>`;
  rain(); speak('연꽃이 활짝 피었어요! 모두 함께 박수!');
}

/* ── 🔑 내 공부방: 이름 · 나이 · 비밀번호 → 집과 같은 내 공부방으로 ── */
function soloLogin(){
  const f=ST.form;
  stage.innerHTML = barHTML('🔑 내 공부방 들어가기') + `<div class="login">
    <div class="lcard"><h3>① 내 이름 두 글자</h3><input class="field" id="nameIn" maxlength="2" autocomplete="off" placeholder="이름 두 글자" value="${esc(f.name)}">
      <h3 style="margin-top:14px">② 내 나이</h3><div class="chips">${AGES.map(([k,n,e])=>`<button class="chip ${f.age===k?'on':''}" data-lage="${k}">${e} ${n}</button>`).join('')}</div>
      <p class="note">집의 ‘부모님 핸드폰’ 공부방과 같은 이름 · 나이 · 비밀번호예요. 기록은 내 공부방에 쌓이고 부모님도 볼 수 있어요.</p></div>
    <div class="lcard"><h3>③ ${f.first?'한 번 더 눌러요':'내 비밀번호 4자리'}</h3>
      <div class="pinrow">${[0,1,2,3].map(i=>`<i class="${i<f.pin.length?'f':''}"></i>`).join('')}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-pin="${n}">${n}</button>`).join('')}<button class="key fn" data-pin="back">◀ 처음 화면</button><button class="key" data-pin="0">0</button><button class="key fn" data-pin="del">⌫ 지우기</button></div>
      <div class="msg" id="msg">${esc(f.msg||'')}</div></div></div>`;
  const inp=$('nameIn'); inp.addEventListener('input', ()=>{ f.name=inp.value; });
}
async function soloPin(){
  const f=ST.form; f.name=cleanName(($('nameIn')||{}).value||f.name);
  if(!/^[가-힣]{2}$/.test(f.name) || !f.age){ f.pin=''; f.msg='이름 두 글자(한글)와 나이를 먼저 골라요'; render(); return; }
  try{
    const d=await db(), k=await keyOf(f.name,f.age,f.pin);
    if(f.first){   // 처음 만들기: 두 번째 입력
      if(f.pin!==f.first){ f.pin=''; f.first=''; f.msg='두 번이 달라요. 처음부터 다시 눌러요'; render(); return; }
      const id=[...crypto.getRandomValues(new Uint8Array(15))].map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,24), now=Date.now();
      await d.collection('simin_kids').doc(id).set({name:f.name, age:f.age, keyId:k, pkeyId:null, ppinSet:false, stars:0, createdAt:now, updatedAt:now});
      await d.collection('simin_key').doc(k).set({kid:id});
      return enterRoom({id, name:f.name, age:f.age});
    }
    const s=await d.collection('simin_key').doc(k).get();
    if(s.exists) return enterRoom({id:s.data().kid, name:f.name, age:f.age});
    f.first=f.pin; f.pin=''; f.msg='처음 온 친구예요? 같은 번호를 한 번 더 누르면 만들어요. (집에서 만든 적 있으면 이름 · 나이 · 번호를 다시 봐요)'; render();
  }catch(e){ f.pin=''; f.msg=e.message||'확인하지 못했어요'; render(); }
}
/* 집 공부방과 같은 방으로: 입구와 같은 자리(simin:kids · simin:cur)에 적고, 칠판에서 들어온 아이라고 표시해 둬요 */
function enterRoom(kid){
  try{
    const L=JSON.parse(localStorage.getItem('simin:kids')||'[]').filter(k=>k.id!==kid.id); L.unshift(kid);
    localStorage.setItem('simin:kids', JSON.stringify(L.slice(0,6))); localStorage.setItem('simin:cur', JSON.stringify(kid.id)); localStorage.setItem('simin:boardKid', JSON.stringify(kid.id));
  }catch(e){}
  speak(`${josa(kid.name,'이','')} 공부방으로 가요!`);
  setTimeout(()=>{ location.href=`../${ROOM_OF[kid.age]}/`; }, 600);
}

/* ═════════ 누르기 ═════════ */
stage.addEventListener('click', e=>{
  const t=e.target.closest('button,[data-card]'); if(!t || t.disabled) return; const d=t.dataset;
  if(d.sage){ ST.soloAge = ST.soloAge===d.sage ? null : d.sage; render(); return; }
  if(d.age){ const k=d.age; if(!ST.ages.includes(k)) ST.lastAge=k; ST.ages=ST.ages.includes(k)?ST.ages.filter(x=>x!==k):[...ST.ages,k]; ST.ages.sort((x,y)=>AGES.findIndex(q=>q[0]===x)-AGES.findIndex(q=>q[0]===y)); resetCards(); render(); return; }
  if(d.cnt){ const k=d.cnt; ST.cnt[k]=Math.min(10,Math.max(1,(ST.cnt[k]||1)+ +d.d)); render(); return; }
  if(d.mode){ ST.mode=d.mode;
    // 내 공부방으로 바꾸면 ①에서 마지막으로 누른 연령대(하나만 골랐으면 그것)를 내 나이로
    if(d.mode==='solo' && !ST.soloAge) ST.soloAge = ST.ages.length===1 ? ST.ages[0] : ST.ages.includes(ST.lastAge) ? ST.lastAge : null;
    render(); return; }
  if(d.how){ ST.how=d.how; render(); return; }
  if(d.card!==undefined){ const c=ST.cards, picker=ST.ages.filter(k=>!Object.values(c.up).includes(k))[0]; if(!picker) return; c.up[d.card]=picker; render(); speak(`${nameOf(picker)}, ${c.nums[d.card]}번!`); return; }
  if(d.ch!==undefined){ answer(+d.ch); return; }
  if(d.lage){ ST.form.age=d.lage; ST.form.name=cleanName(($('nameIn')||{}).value||ST.form.name); render(); return; }
  if(d.pin){ const f=ST.form, v=d.pin; if(v==='back'){ ST.screen='setup'; ST.form={name:'',age:null,pin:'',first:''}; render(); return; }
    f.name=cleanName(($('nameIn')||{}).value||f.name); if(v==='del') f.pin=f.pin.slice(0,-1); else if(f.pin.length<4) f.pin+=v; f.msg='';
    stage.querySelectorAll('.pinrow i').forEach((x,i)=>x.classList.toggle('f', i<f.pin.length)); if(f.pin.length===4) setTimeout(soloPin,120); return; }
  const a=d.act;
  if(a==='reshuffle'){ resetCards(); render(); }
  else if(a==='spin') spinWheel();
  else if(a==='climb') climbLadder();
  else if(a==='start'){ if(ST.mode==='solo'){ ST.screen='soloLogin'; ST.form={name:'',age:ST.soloAge||null,pin:'',first:''}; render(); $('nameIn')?.focus(); } else startTeam(); }
  else if(a==='sayQ'){ if(G&&G.q) speak(G.q.say); }
  else if(a==='retryQ') newTurn(false);
  else if(a==='stop'){ if(confirm('그만하고 처음 화면으로 갈까요?')){ G=null; ST.screen='setup'; render(); } }
  else if(a==='again'){ resetCards(); G=null; ST.screen='setup'; render(); }
  else if(a==='toSetup'){ G=null; ST.screen='setup'; render(); }
});
render();
</script>
</body>
</html>
