<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
<defs>
<linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF86D2"/><stop offset="1" stop-color="#E23C9E"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F45CBA"/><stop offset="1" stop-color="#C92A86"/></linearGradient>
<linearGradient id="mid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F866C4"/><stop offset=".7" stop-color="#EE45AE"/><stop offset="1" stop-color="#D8359C"/></linearGradient>
<linearGradient id="low" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E63FA6"/><stop offset="1" stop-color="#C4248A"/></linearGradient>
<radialGradient id="front" cx=".45" cy=".45" r=".65"><stop offset="0" stop-color="#FF8DD6"/><stop offset=".7" stop-color="#F258BA"/><stop offset="1" stop-color="#DE3AA2"/></radialGradient>
<linearGradient id="cupSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB13A"/><stop offset=".5" stop-color="#FFD23A"/><stop offset="1" stop-color="#FFA22E"/></linearGradient>
<linearGradient id="cupTop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE23A"/><stop offset="1" stop-color="#FFF23A"/></linearGradient>
</defs>
<rect width="180" height="180" fill="#FDE6EE"/>
<!-- 이모지 칸(300×300) 좌표로 그리고 줄여요 -->
<g transform="translate(20 22) scale(.4667)">
  <!-- 뒤 가운데 뾰족한 꽃잎 -->
  <path d="M150 0C185 38 212 80 206 128H94C88 80 115 38 150 0Z" fill="url(#back)"/>
  <!-- 뒤 양옆 꽃잎 (끝이 둥글게 잘린 모양) -->
