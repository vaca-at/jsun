  <path d="M278 66C238 58 188 70 150 112L180 172C228 162 266 140 276 92C278 82 280 72 278 66Z" fill="url(#side)"/>
  <!-- 노란 원통 꽃술 -->
  <path d="M98 96L202 96L190 168H110Z" fill="url(#cupSide)"/>
  <ellipse cx="150" cy="96" rx="52" ry="20" fill="url(#cupTop)"/>
  <!-- 아래로 처진 꽃잎 -->
  <path d="M2 192C42 210 112 232 156 262L150 294C104 304 50 300 26 276C10 260 3 230 2 192Z" fill="url(#low)"/>
  <path d="M298 192C258 210 188 232 144 262L150 294C196 304 250 300 274 276C290 260 297 230 298 192Z" fill="url(#low)"/>
  <!-- 가운데 양옆 큰 꽃잎 -->
  <path d="M0 128C54 118 124 140 152 214C124 254 62 254 30 222C10 202 0 164 0 128Z" fill="url(#mid)"/>
  <path d="M300 128C246 118 176 140 148 214C176 254 238 254 270 222C290 202 300 164 300 128Z" fill="url(#mid)"/>
  <!-- 앞 가운데 꽃잎 -->
  <path d="M150 100C186 134 214 170 212 214C210 254 184 278 150 278C116 278 90 254 88 214C86 170 114 134 150 100Z" fill="url(#front)"/>
</g>
</svg>
