/* ⭐ 별 · 스티커 약속 (맨 위 별을 누르면 캐릭터 방 '🧾 쓴 별'에서 보여요) */
button.starbox,button.star{border:0;cursor:pointer;font-family:inherit}
.sp-rule{padding:16px 18px;border:2px solid var(--accent)}
.sp-rule-h{margin:0 0 8px;font-size:1.2rem;font-weight:700;color:var(--accent)}
.sp-rule ul{margin:0;padding-left:1.2em;line-height:1.75;font-size:1.02rem}
.sp-rule ul b{color:var(--accent)}
.sp-today{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.sp-today div{background:var(--soft,rgba(127,127,127,.12));border-radius:14px;padding:8px 12px}
.sp-today span{display:block;font-size:.8rem;opacity:.75}
.sp-today b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.sp-today i{display:block;height:7px;border-radius:99px;background:rgba(127,127,127,.2);overflow:hidden;margin-top:4px}
.sp-today em{display:block;height:100%;border-radius:99px;background:var(--accent)}
.sp-chips span{background:var(--soft,rgba(127,127,127,.12));border-radius:999px;padding:3px 10px;font-size:.85rem}
/* ───── 🪷 연꽃 테마 (기본): 전자칠판 · 입구와 같은 연분홍 · 연두 · 금빛, 어린 아이를 위한 부드럽고 둥근 모양 ───── */
body[data-theme="lotus"]{--bg:#FFF7F0;--paper:#FFFFFF;--card:#FFFFFF;--ink:#4A3B36;--sub:#8C7A72;--line:#F1DED3;--accent:#DD6590;--accent-ink:#FFFFFF;--soft:#FDE3EC;--hi:#F2C35B;--ok:#4E9E70;--no:#E35D5D;--carry:#E35D5D;--shadow:0 5px 0 #F6E6DC;--rad:24px;
  background:radial-gradient(circle at 6% 3%,#FDE3EC 0 170px,transparent 171px),radial-gradient(circle at 97% 30%,#E3F4E8 0 150px,transparent 151px),radial-gradient(circle at 92% 98%,#FBF0D9 0 190px,transparent 191px),#FFF7F0;background-attachment:fixed}
body[data-theme="lotus"] header{background:rgba(255,247,240,.92);backdrop-filter:blur(6px);border-bottom:3px solid var(--line)}
body[data-theme="lotus"] .logo-m{background:#FDE3EC;border-radius:50%;font-size:0}
body[data-theme="lotus"] .logo-m .sico{display:none}
body[data-theme="lotus"] .logo-m::after{content:"🪷";font-size:20px}
body[data-theme="lotus"] :is(.card,.subj,.dock-t,.wcard,.lvtab,.book,.lib-book,.sent-card,.hs-tile){border:3px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
body[data-theme="lotus"] .hello{background:linear-gradient(120deg,#FDE3EC,#FFF7F0 55%,#E3F4E8);border-color:#F7D3DF}
body[data-theme="lotus"] .big-btn{border-radius:26px;box-shadow:0 6px 0 #B94873}
body[data-theme="lotus"] .big-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #B94873}
body[data-theme="lotus"] .starbox{background:#FDE3EC;color:#DD6590}
body[data-theme="lotus"] .dayrule{background:#FBF0D9;border-color:#EFD9AE;color:#6B5433}
</style>

    ['☁️👑','아주아주 먼 옛날, 하늘나라 임금 환인에게는 환웅이라는 아들이 있었어요. 환웅은 늘 땅 아래 사람들이 사는 세상을 내려다보며 생각했어요. “저 사람들을 널리 이롭게 해 주고 싶구나.”'],
    ['🌬️🌧️☁️','환웅은 바람을 다스리는 풍백, 비를 다스리는 우사, 구름을 다스리는 운사와 함께 태백산으로 내려왔어요. 그리고 곡식, 목숨, 병, 착하고 나쁜 일 같은 사람들의 360여 가지 일을 돌보았어요.'],
    ['🐻🐯','어느 날 곰과 호랑이가 찾아와 간절히 빌었어요. “저희도 사람이 되고 싶어요!” 환웅은 쑥 한 줌과 마늘 스무 개를 주며 말했어요. “이것만 먹고 백 날 동안 햇빛을 보지 않으면 사람이 될 것이다.”'],
    ['🕳️🐻','캄캄한 동굴 속에서 호랑이는 참지 못하고 뛰쳐나가 버렸어요. 하지만 곰은 쓰디쓴 쑥과 매운 마늘을 먹으며 꾹 참았어요. 그리고 스무하루 만에 아름다운 여자, 웅녀가 되었어요.'],
    ['👶👑','웅녀는 환웅과 결혼해 아들을 낳았어요. 그 아들이 바로 단군왕검이에요. 단군왕검은 자라서 우리 역사의 첫 나라, <b>고조선</b>을 세웠어요.'],
    ['🤝📜','이 이야기는 아주 오래전부터 전해 오는 건국 이야기예요. ‘널리 사람을 이롭게 하라’는 <b>홍익인간</b>의 뜻은 지금도 우리나라 교육이 꿈꾸는 모습으로 남아 있어요.']],
    quiz:[['단군왕검이 세운 나라는?','고조선',['고구려','신라','고려']],['곰이 사람이 되려고 먹은 것은?','쑥과 마늘',['사과와 배','떡과 꿀','쌀과 보리']],['‘널리 사람을 이롭게 하라’는 뜻의 말은?','홍익인간',['해동성국','훈민정음','8조법']]]},
  {id:'jumong', lv:9, era:'samguk', e:'🏹', t:'알에서 태어난 활 잘 쏘는 아이', sub:'고구려를 세운 주몽', pages:[
    ['🥚✨','옛날 부여라는 나라에 유화 부인이 살았어요. 어느 날 유화 부인이 커다란 알을 하나 낳았어요. 사람들은 놀라서 알을 버렸지만, 짐승들이 알을 피해 가고 새들이 날개로 따뜻하게 덮어 주었어요.'],
    ['👶🏹','얼마 뒤 알을 깨고 씩씩한 사내아이가 나왔어요. 아이는 일곱 살 때부터 활을 만들어 쏘았는데, 쏘는 것마다 백 번 쏘면 백 번 다 맞혔어요. 그래서 ‘활 잘 쏘는 사람’이라는 뜻의 <b>주몽</b>이라고 불렀어요.'],
    ['😠🐎','부여 왕의 아들들은 주몽이 너무 뛰어나서 샘을 냈어요. “주몽을 그냥 두면 큰일 나겠어!” 위험을 느낀 주몽은 믿을 만한 친구들과 함께 몰래 부여를 떠났어요.'],
    ['🌊🐟🐢','쫓아오는 군사들을 피해 달리다 보니 커다란 강이 앞을 막았어요. 주몽이 외쳤어요. “나는 하늘 임금의 자손이다! 길을 열어 다오!” 그러자 물고기와 자라들이 떠올라 다리를 만들어 주었어요.'],
    ['🏯🎉','무사히 강을 건넌 주몽은 졸본이라는 곳에 새 나라를 세웠어요. 그 나라가 바로 <b>고구려</b>예요. 주몽은 고구려의 첫 임금 동명성왕이 되었어요.']],
    quiz:[['주몽이라는 이름의 뜻은?','활 잘 쏘는 사람',['말 잘 타는 사람','노래 잘하는 사람','힘센 사람']],['강을 건널 때 다리가 되어 준 것은?','물고기와 자라',['곰과 호랑이','새들','나무들']],['주몽이 세운 나라는?','고구려',['백제','신라','가야']]]},
  {id:'hyeokgeose', lv:9, era:'samguk', e:'🥚', t:'하얀 말이 두고 간 알', sub:'신라를 세운 박혁거세', pages:[
    ['⛰️👴👴','아주 먼 옛날, 지금의 경주 땅에는 여섯 마을이 있었어요. 여섯 마을의 촌장들은 한자리에 모여 의논했어요. “우리를 잘 이끌어 줄 훌륭한 임금님이 있으면 좋겠소.”'],
    ['🐴✨','그때 우물가 숲에 신기한 빛이 비치더니, 하얀 말이 무릎을 꿇고 절을 하고 있었어요. 촌장들이 다가가자 하얀 말은 길게 울며 하늘로 날아올랐어요.'],
    ['🥚🟣','말이 있던 자리에는 커다란 자줏빛 알이 하나 놓여 있었어요. 알을 깨 보니 얼굴이 환한 사내아이가 나왔어요. 아이를 씻기자 몸에서 빛이 나고 새와 짐승들이 춤을 추었대요.'],
    ['👑🌏','사람들은 아이의 이름을 ‘세상을 밝게 다스린다’는 뜻의 <b>혁거세</b>라고 지었어요. 알이 박처럼 생겼다고 해서 성은 ‘박’이 되었지요.'],
    ['🏯','혁거세가 자라자 여섯 마을 사람들은 그를 임금으로 모셨어요. 이렇게 시작된 나라가 천 년 가까이 이어진 <b>신라</b>예요.']],
    quiz:[['박혁거세가 세운 나라는?','신라',['고구려','백제','발해']],['알을 두고 하늘로 날아간 동물은?','하얀 말',['검은 소','파란 용','빨간 새']],['‘박’이라는 성은 무엇에서 왔을까요?','박처럼 생긴 알',['박 넝쿨이 있는 집','박수 소리','박물관']]]},
  {id:'gwanggaeto', lv:9, era:'samguk', e:'🐎', t:'땅을 넓힌 씩씩한 임금', sub:'광개토대왕과 커다란 비석', pages:[
    ['👦🏹','고구려에 담덕이라는 왕자가 있었어요. 담덕은 어릴 때부터 몸집이 크고 말타기와 활쏘기를 아주 잘했어요. 그리고 겨우 열여덟 살에 고구려의 임금이 되었어요.'],
    ['🐎🐎🐎','젊은 임금은 날쌘 기마 부대를 이끌고 북쪽과 서쪽의 넓은 땅으로 나아갔어요. 싸우는 곳마다 이겨서 고구려의 땅은 점점 넓어졌어요.'],
    ['🛡️🤝','남쪽의 신라가 왜군에게 공격받자 도와 달라고 부탁했어요. 임금은 군사 5만 명을 보내 신라를 구해 주었어요. 고구려는 동북아시아에서 가장 힘센 나라가 되었어요.'],
    ['🗺️👑','사람들은 이 임금을 ‘나라 땅을 크게 넓힌 임금’이라는 뜻으로 <b>광개토대왕</b>이라고 불러요.'],
    ['🗿📜','광개토대왕이 세상을 떠난 뒤, 아들 <b>장수왕</b>은 아버지의 일을 기록한 커다란 비석을 세웠어요. 높이가 6미터가 넘는 이 비석은 지금도 중국 땅에 남아 있어요.']],
    quiz:[['광개토대왕은 어느 나라 임금이었나요?','고구려',['백제','신라','고려']],['광개토대왕이 가장 크게 한 일은?','나라 땅을 크게 넓혔어요',['한글을 만들었어요','거북선을 만들었어요','불국사를 지었어요']],['광개토대왕릉비를 세운 사람은?','장수왕',['주몽','세종대왕','왕건']]]},
  {id:'euljimundeok', lv:9, era:'samguk', e:'⚔️', t:'살수에 넘친 물', sub:'을지문덕과 살수 대첩', pages:[
    ['🏰😤','중국을 통일한 수나라는 고구려까지 차지하고 싶었어요. 수나라 임금은 백만 명이 넘는 어마어마한 군사를 이끌고 고구려로 쳐들어왔어요.'],
    ['🧠🗺️','고구려에는 꾀가 많은 장군 <b>을지문덕</b>이 있었어요. 을지문덕은 적의 진지에 직접 찾아가 수나라 군사들이 배고프고 지쳐 있다는 것을 알아냈어요.'],
    ['🏃‍♂️🏃‍♂️','을지문덕은 싸우다가 일부러 지는 척 뒤로 물러났어요. 수나라 군사들은 신이 나서 평양 가까이까지 쫓아왔지만, 먹을 것이 떨어져 더 힘들어졌어요.'],
    ['✉️😏','을지문덕은 적장에게 시 한 편을 보냈어요. “그대의 꾀는 하늘의 이치를 다 알고, 싸움에 이겨 공이 이미 높으니, 만족함을 알고 그만두는 게 어떠한가.” 칭찬하는 척 놀리는 시였어요.'],
    ['🌊🎉','화가 난 적들이 되돌아가다 살수(지금의 청천강)를 건널 때, 고구려군이 한꺼번에 공격했어요. 살아서 돌아간 수나라 군사는 아주 적었어요. 612년에 있었던 이 싸움을 <b>살수 대첩</b>이라고 해요.']],
    quiz:[['을지문덕은 어느 나라 장군인가요?','고구려',['신라','백제','조선']],['을지문덕이 크게 이긴 싸움은?','살수 대첩',['귀주 대첩','한산도 대첩','행주 대첩']],['을지문덕이 적장에게 보낸 것은?','놀리는 시',['금은보화','항복 편지','맛있는 음식']]]},
  {id:'seondeok', lv:9, era:'samguk', e:'👸', t:'향기 없는 모란꽃', sub:'지혜로운 선덕여왕과 첨성대', pages:[
    ['👧📚','신라 진평왕에게는 아들이 없고 덕만 공주가 있었어요. 덕만 공주는 어릴 때부터 무척 똑똑했어요.'],
    ['🌸🖼️','어느 날 당나라에서 모란꽃 그림과 꽃씨를 보내왔어요. 그림을 본 공주가 말했어요. “이 꽃은 향기가 없을 거예요.” “어떻게 아느냐?” “그림에 벌과 나비가 한 마리도 없잖아요.”'],
    ['🌱🌺','꽃씨를 심어 보니 정말로 예쁜 꽃이 피었지만 향기가 나지 않았어요. 사람들은 공주의 지혜에 깜짝 놀랐어요.'],
    ['👑','덕만 공주는 신라의 첫 여왕, <b>선덕여왕</b>이 되었어요. 여왕은 가난한 백성을 돌보고, 황룡사 9층 목탑 같은 큰 절도 세웠어요.'],
    ['🔭⭐','선덕여왕 때 경주에는 돌을 차곡차곡 쌓은 <b>첨성대</b>도 세워졌어요. 별과 하늘을 살펴 날씨와 농사 때를 알려고 만든 것으로 알려져 있어요. 첨성대는 지금도 경주에 서 있어요.']],
    quiz:[['신라의 첫 여왕은?','선덕여왕',['진성여왕','유화 부인','신사임당']],['공주가 모란꽃에 향기가 없다고 생각한 까닭은?','그림에 벌과 나비가 없어서',['꽃이 작아서','꽃 색깔이 빨개서','꽃씨가 없어서']],['선덕여왕 때 경주에 세운 것은?','첨성대',['자격루','거북선','수원 화성']]]},
  {id:'tongil', lv:9, era:'nambuk', e:'🐉', t:'바다의 용이 된 임금', sub:'김유신, 문무왕과 삼국 통일', pages:[
    ['⚔️🐴','신라에는 어릴 때부터 화랑으로 몸과 마음을 닦은 장군 <b>김유신</b>이 있었어요. 김유신은 친구이자 뒷날 임금이 되는 김춘추와 함께 삼국을 하나로 만들 꿈을 키웠어요.'],
    ['🤝⛵','신라는 당나라와 힘을 합쳐 660년에 백제를, 668년에 고구려를 무너뜨렸어요. 그런데 당나라는 그 땅을 자기들이 차지하려고 했어요.'],
    ['🛡️🔥','김춘추의 아들 <b>문무왕</b>은 당나라군과 끈질기게 싸웠어요. 매소성과 기벌포 싸움에서 이겨 당나라군을 몰아내고, 676년 삼국 통일을 이루었어요.'],
    ['🌊🐉','문무왕은 세상을 떠나기 전에 말했어요. “내가 죽으면 동해 바다에 묻어 다오. 용이 되어 왜적으로부터 나라를 지키겠다.”'],
    ['🪨🌅','그래서 사람들은 경주 앞바다의 바위, <b>대왕암</b>에 문무왕을 모셨다고 전해요. 지금도 아침이면 대왕암 위로 해가 떠올라요.']],
    quiz:[['삼국 통일을 완성한 임금은?','문무왕',['광개토대왕','근초고왕','왕건']],['삼국 통일에 큰 공을 세운 화랑 출신 장군은?','김유신',['을지문덕','계백','강감찬']],['문무왕이 죽어서 되겠다고 한 것은?','바다의 용',['하늘의 별','큰 호랑이','높은 산']]]},
  {id:'balhae', lv:8, era:'nambuk', e:'🐯', t:'고구려의 꿈을 이은 나라', sub:'대조영과 발해', pages:[
    ['😢🏯','고구려가 무너진 뒤, 많은 고구려 사람들이 당나라에 끌려가 힘들게 살았어요. 그중에 고구려 장수 출신 <b>대조영</b>이 있었어요.'],
    ['🏃‍♂️🏔️','대조영은 고구려 사람들과 말갈 사람들을 이끌고 당나라를 빠져나왔어요. 뒤쫓아 온 당나라군을 천문령에서 크게 물리쳤어요.'],
    ['🏯🎉','698년, 대조영은 동모산에 새 나라를 세웠어요. 이 나라가 <b>발해</b>예요. 발해 사람들은 스스로 고구려를 이은 나라라고 생각했어요.'],
    ['🌏✨','발해는 점점 커져서 옛 고구려 땅을 거의 되찾았어요. 이웃 나라들은 발해를 ‘바다 동쪽의 크게 번성한 나라’라는 뜻으로 <b>해동성국</b>이라고 불렀어요.'],
    ['🗺️','이때 남쪽에는 통일 신라, 북쪽에는 발해가 있었어요. 그래서 이 시대를 <b>남북국 시대</b>라고 불러요.']],
    quiz:[['발해를 세운 사람은?','대조영',['대왕암','왕건','주몽']],['발해를 부르던 ‘바다 동쪽의 번성한 나라’라는 말은?','해동성국',['홍익인간','조선','대한제국']],['통일 신라와 발해가 함께 있던 시대는?','남북국 시대',['삼국 시대','선사 시대','근대']]]},
  {id:'jangbogo', lv:8, era:'nambuk', e:'🚢', t:'바다의 왕', sub:'장보고와 청해진', pages:[
    ['🌊👦','통일 신라의 바닷가 섬마을에 궁복이라는 소년이 살았어요. 궁복은 헤엄을 잘 치고 창과 활 솜씨가 뛰어났어요. 뒷날 이 소년은 <b>장보고</b>라는 이름으로 불렸어요.'],
    ['⛵🇨🇳','장보고는 당나라로 건너가 군인이 되어 이름을 떨쳤어요. 그런데 그곳에서 해적에게 잡혀 와 노비로 팔리는 신라 사람들을 보고 가슴이 아팠어요.'],
    ['🏝️🏰','신라로 돌아온 장보고는 임금에게 말했어요. “바다를 지키는 기지를 세우게 해 주십시오.” 그리고 지금의 완도에 <b>청해진</b>을 세웠어요.'],
    ['🏴‍☠️❌','장보고의 군사들은 바다의 해적을 모조리 물리쳤어요. 바다가 안전해지자 신라, 당나라, 일본을 오가는 배들이 청해진에 모였어요.'],
    ['⚓💰','장보고는 세 나라를 잇는 바닷길 무역을 이끌었어요. 그래서 사람들은 장보고를 ‘바다의 왕’, 해상왕이라고 불러요.']],
    quiz:[['장보고가 완도에 세운 기지는?','청해진',['첨성대','규장각','집현전']],['장보고가 바다에서 물리친 것은?','해적',['상어','몽골군','거란군']],['장보고를 부르는 다른 이름은?','해상왕',['녹두장군','해동성국','성웅']]]},
  {id:'wanggeon', lv:9, era:'goryeo', e:'🏰', t:'다시 하나가 된 나라', sub:'왕건과 고려', pages:[
    ['💔🗺️','통일 신라가 약해지자 나라가 다시 셋으로 갈라졌어요. 신라, 견훤이 세운 후백제, 궁예가 세운 후고구려가 서로 다투었어요. 이때를 <b>후삼국 시대</b>라고 해요.'],
    ['⛵👨','송악(지금의 개성)의 바다 상인 집안에서 태어난 <b>왕건</b>은 궁예 밑에서 뛰어난 장수가 되었어요. 특히 배를 이끌고 바다에서 싸우는 데 뛰어났어요.'],
    ['😠👑','그런데 궁예는 점점 사나워져서 백성과 신하를 괴롭혔어요. 신하들은 마음이 넓은 왕건을 새 임금으로 모셨어요. 918년, 왕건은 나라 이름을 <b>고려</b>라고 지었어요.'],
    ['🤝','왕건은 싸우기보다 마음을 얻으려고 애썼어요. 신라의 임금은 스스로 고려에 나라를 넘겼고, 936년 고려는 후백제를 물리쳐 <b>후삼국을 통일</b>했어요.'],
    ['🌏','발해가 무너지자 왕건은 발해 사람들도 따뜻하게 받아들였어요. 고려(Korea)라는 이름은 오늘날 우리나라의 영어 이름 ‘코리아’가 되었어요.']],
    quiz:[['고려를 세운 사람은?','왕건',['궁예','견훤','이성계']],['‘코리아’라는 이름은 어느 나라 이름에서 왔을까요?','고려',['고조선','조선','신라']],['신라, 후백제, 후고구려가 다투던 시대는?','후삼국 시대',['삼국 시대','남북국 시대','근대']]]},
  {id:'seohui', lv:8, era:'goryeo', e:'🗣️', t:'말로 이긴 싸움', sub:'서희의 담판', pages:[
    ['🐎🐎😤','993년, 북쪽의 거란이 80만 대군이라며 고려에 쳐들어왔어요. 거란 장수 소손녕은 “고려가 차지한 옛 고구려 땅을 내놓아라!” 하고 큰소리쳤어요.'],
    ['😰👑','겁이 난 신하들 가운데는 땅을 떼어 주자는 사람도 있었어요. 그때 <b>서희</b>가 나섰어요. “제가 적장을 만나 보겠습니다.”'],
    ['🗣️🤔','서희는 당당하게 말했어요. “고려는 고구려를 이은 나라요. 나라 이름도 고려이고, 도읍도 고구려의 평양이오. 오히려 거란 땅이 옛 고구려 땅이오.”'],
    ['🧠🤝','서희는 거란이 정말 바라는 것이 고려가 송나라와 친하게 지내지 않는 것임을 알아챘어요. “길을 막고 있는 여진을 몰아내면 거란과도 오갈 수 있소.”'],
    ['🏯🎉','거란군은 싸우지 않고 물러났고, 고려는 오히려 압록강 동쪽의 <b>강동 6주</b>를 얻었어요. 칼 대신 말로 나라를 지킨 이 일을 ‘서희의 담판’이라고 해요.']],
    quiz:[['서희가 담판을 지은 나라는?','거란',['몽골','수나라','일본']],['서희의 담판으로 고려가 얻은 땅은?','강동 6주',['대마도','청해진','한양']],['서희는 무엇으로 나라를 지켰나요?','말(대화)',['활','거북선','성벽']]]},
  {id:'palman', lv:9, era:'goryeo', e:'📚', t:'8만 장의 나무 책', sub:'팔만대장경', pages:[
    ['🐎🔥','고려 때 몽골군이 쳐들어와 온 나라를 휩쓸었어요. 몽골군은 절과 마을을 불태웠고, 백성들은 무척 괴로웠어요.'],
    ['🙏','고려 사람들은 마음을 모았어요. “부처님의 힘을 빌려 나라를 지키자!” 그래서 부처님의 가르침을 나무판에 새기기로 했어요.'],
    ['🪵🌊','먼저 좋은 나무를 골라 바닷물에 담갔다가 소금물에 쪘어요. 그래야 나무가 뒤틀리거나 썩지 않거든요. 그다음 햇볕 없는 곳에서 천천히 말렸어요.'],
    ['✍️','사람들은 한 글자 새길 때마다 절을 세 번씩 했다고 전해요. 그렇게 16년 동안 새긴 나무판이 8만 장이 넘었어요. 그래서 <b>팔만대장경</b>이라고 불러요.'],
    ['🏯🌍','팔만대장경은 지금 합천 <b>해인사</b>의 장경판전에 보관되어 있어요. 바람이 잘 통하게 지은 이 건물 덕분에 750년이 넘도록 잘 남아 있고, 유네스코 세계 기록 유산이 되었어요.']],
    quiz:[['팔만대장경을 만들게 된 까닭은?','부처님의 힘으로 몽골을 물리치려고',['돈을 벌려고','한글을 알리려고','놀이를 하려고']],['팔만대장경이 보관된 절은?','해인사',['불국사','황룡사','석굴암']],['팔만대장경은 무엇에 새겼나요?','나무판',['돌','금속','종이']]]},
  {id:'sejong', lv:9, era:'joseon', e:'📝', t:'백성을 위한 스물여덟 글자', sub:'세종대왕과 훈민정음', pages:[
    ['😢📜','옛날 우리나라 사람들은 말은 우리말로 하면서 글은 어려운 중국 글자, 한자로 썼어요. 한자는 너무 어려워서 백성들은 억울한 일이 있어도 글로 쓸 수 없었어요.'],
    ['👑💭','조선의 넷째 임금 <b>세종대왕</b>은 그런 백성들을 보며 마음 아파했어요. “누구나 쉽게 배워 날마다 편하게 쓸 수 있는 글자를 만들어야겠다.”'],
    ['👄🔍','세종대왕은 밤낮으로 소리를 연구했어요. 자음은 소리 낼 때 입과 혀의 모양을 본떠 만들고, 모음은 하늘(·), 땅(ㅡ), 사람(ㅣ)을 본떠 만들었어요.'],
    ['🔤🎉','1443년, 드디어 스물여덟 글자가 완성되었어요. 이름은 ‘백성을 가르치는 바른 소리’라는 뜻의 <b>훈민정음</b>. 1446년에 온 백성에게 널리 알렸어요.'],
    ['💡⏰','세종대왕은 집현전에서 학자들과 함께 공부하고, 장영실 같은 과학자를 아껴 해시계와 측우기도 만들게 했어요. 한글이 널리 알려진 날을 기념하는 날이 10월 9일 <b>한글날</b>이에요.']],
    quiz:[['훈민정음의 뜻은?','백성을 가르치는 바른 소리',['바다 동쪽의 번성한 나라','널리 사람을 이롭게 하라','나라를 지키는 소리']],['모음 ‘·, ㅡ, ㅣ’가 본뜬 것은?','하늘, 땅, 사람',['해, 달, 별','산, 강, 바다','입, 코, 귀']],['한글날은 언제일까요?','10월 9일',['3월 1일','8월 15일','5월 5일']]]},
  {id:'jangyeongsil', lv:9, era:'joseon', e:'⏰', t:'스스로 울리는 시계', sub:'과학자 장영실', pages:[
    ['🔧👦','장영실은 동래(지금의 부산)에서 관청의 노비로 태어났어요. 하지만 무엇이든 뚝딱뚝딱 잘 만들고 고치는 솜씨가 소문이 날 만큼 뛰어났어요.'],
    ['👑🤝','이 소문을 들은 세종대왕은 신분을 따지지 않고 장영실을 궁궐로 불렀어요. 그리고 벼슬을 주어 마음껏 발명하게 했어요.'],
    ['💧🔔','장영실은 물이 흘러내리는 힘으로 때가 되면 저절로 종과 북을 울리는 물시계, <b>자격루</b>를 만들었어요. 사람이 밤새 지켜보지 않아도 시간을 알 수 있었지요.'],
    ['☀️⌛','해 그림자로 시간을 알려 주는 해시계 <b>앙부일구</b>도 만들어 길거리에 두었어요. 글을 모르는 백성도 볼 수 있게 시각을 동물 그림으로 나타냈어요.'],
    ['☔📏','비가 온 양을 재는 <b>측우기</b>도 이 무렵 만들어졌어요. 비의 양을 알면 농사를 더 잘 지을 수 있었어요. 장영실은 조선을 대표하는 과학자가 되었어요.']],
    quiz:[['장영실이 만든, 저절로 시각을 알려 주는 물시계는?','자격루',['측우기','거중기','첨성대']],['장영실을 궁궐로 불러 아낀 임금은?','세종대왕',['정조','태조 이성계','문무왕']],['측우기는 무엇을 재는 기구인가요?','비가 온 양',['바람의 세기','땅의 넓이','별의 위치']]]},
  {id:'yisunsin', lv:9, era:'joseon', e:'🐢', t:'열두 척의 배', sub:'이순신과 거북선', pages:[
    ['🔥⛵','1592년, 일본이 조선에 쳐들어왔어요. <b>임진왜란</b>이 시작된 거예요. 일본군은 순식간에 한양까지 올라왔어요.'],
    ['🐢⚓','하지만 바다에는 <b>이순신</b> 장군이 있었어요. 이순신은 전쟁이 나기 전부터 배를 고치고 군사를 훈련했어요. 등에 뾰족한 쇠못을 박은 튼튼한 배, <b>거북선</b>도 만들었어요.'],
    ['🌊🦅','한산도 앞바다에서 이순신은 배들을 학의 날개처럼 펼쳐 적을 둘러싸는 ‘학익진’으로 일본 수군을 크게 물리쳤어요. 이것이 <b>한산도 대첩</b>이에요.'],
    ['😢⛵','그러나 이순신은 억울한 누명을 쓰고 벼슬에서 쫓겨났어요. 그사이 조선 수군은 크게 져서 배가 겨우 열두 척만 남았어요.'],
    ['🗣️⚔️','다시 돌아온 이순신은 말했어요. “신에게는 아직 열두 척의 배가 남아 있습니다.” 그리고 물살이 거센 울돌목에서 130척이 넘는 적을 물리쳤어요. 이것이 <b>명량 대첩</b>이에요.'],
    ['🙏🇰🇷','이순신은 마지막 싸움인 노량 해전에서 적의 총알을 맞았어요. “싸움이 급하다. 나의 죽음을 알리지 마라.” 나라를 끝까지 지킨 이순신을 우리는 ‘성웅’이라 불러요.']],
    quiz:[['이순신이 만든, 등에 쇠못을 박은 배는?','거북선',['판옥선','뗏목','유람선']],['명량 대첩 때 남아 있던 조선의 배는 몇 척?','12척',['3척','100척','1척']],['이순신이 싸운 전쟁은?','임진왜란',['6·25 전쟁','살수 대첩','병자호란']]]},
  {id:'jeongyakyong', lv:8, era:'joseon', e:'🏗️', t:'무거운 돌을 번쩍!', sub:'정약용과 수원 화성', pages:[
    ['👑🏯','조선의 임금 <b>정조</b>는 백성이 살기 좋은 새 도시를 꿈꾸었어요. 그래서 수원에 튼튼하고 아름다운 성, <b>수원 화성</b>을 쌓기로 했어요.'],
    ['🪨😓','성을 쌓으려면 커다란 돌을 수없이 옮겨야 했어요. 사람의 힘만으로는 오래 걸리고 다치는 사람도 많았어요.'],
    ['📖💡','정조는 젊은 학자 <b>정약용</b>에게 방법을 찾아보라고 했어요. 정약용은 중국에서 들어온 과학책을 열심히 공부했어요.'],
    ['⚙️🏗️','정약용은 도르래 여러 개를 이용해 작은 힘으로 무거운 물건을 들어 올리는 <b>거중기</b>를 만들었어요. 덕분에 적은 힘으로 큰 돌을 번쩍번쩍 들어 올렸어요.'],
    ['🏰🌍','거중기 덕분에 10년 걸릴 거라던 공사가 2년 9개월 만에 끝났어요. 수원 화성은 지금 유네스코 세계 유산이 되었어요.']],
    quiz:[['정약용이 만든, 도르래로 무거운 돌을 드는 기계는?','거중기',['자격루','측우기','거북선']],['거중기를 이용해 쌓은 성은?','수원 화성',['행주산성','남한산성','경복궁']],['수원 화성을 쌓게 한 임금은?','정조',['세종대왕','태조','고종']]]},
  {id:'kimjeongho', lv:8, era:'joseon', e:'🗺️', t:'발로 그린 지도', sub:'김정호와 대동여지도', pages:[
    ['🗺️❓','조선 후기의 <b>김정호</b>는 지도를 좋아했어요. 그런데 그때 지도들은 서로 달랐고 틀린 곳도 많았어요.'],
    ['📚🧭','김정호는 나라와 관청에 있던 여러 지도와 책을 모아 비교하며, 가장 정확한 지도를 만들려고 오랫동안 연구했어요.'],

      ['서준이가 하린이에게 마음을 전한 방법은?','쪽지와 지우개 조각을 주었어요.',['선생님께 말씀드렸어요.','전화를 걸었어요.','새 필통을 사 주었어요.'],'④문단을 보세요.',4],
      ['이 이야기에서 배울 수 있는 것으로 가장 알맞은 것은?','잘못했을 때는 용기 내어 사과해요.',['물건은 절대 빌려주지 않아요.','화가 나면 크게 소리쳐요.','친구와는 말하지 않는 게 좋아요.'],'서준이가 먼저 사과해서 두 사람이 다시 웃게 되었어요.',0]]},
  {id:'hallway', g:'opinion', e:'🚶', t:'복도에서는 천천히 걸어요', paras:[
    '쉬는 시간이 되면 복도는 금세 시끌벅적해져요. 화장실에 가는 친구, 다른 반에 놀러 가는 친구로 가득하지요. 그런데 그중에는 복도를 운동장처럼 뛰어다니는 친구들도 있어요. 저는 복도에서 뛰지 말고 천천히 걸어야 한다고 생각해요.',
    '첫째, 복도에서 뛰면 다칠 수 있어요. 복도는 좁고 모퉁이가 많아서 앞에서 오는 사람을 미리 보기 어려워요. 뛰다가 부딪히면 넘어져 머리를 다치거나 이가 부러질 수도 있어요.',
    '둘째, 다른 사람에게 [[피해]]를 줘요. 쿵쿵 뛰는 소리는 아직 수업 중인 반을 방해해요. 또 뛰는 친구를 피하려다 들고 있던 물건을 떨어뜨리는 친구도 생겨요.',
    '셋째, 천천히 걷는 습관은 나를 지켜 줘요. 학교에서 걷는 습관이 들면 길거리나 계단에서도 조심하게 돼요.',
    '복도는 모두가 함께 쓰는 곳이에요. 나와 친구들의 안전을 위해 오늘부터 복도에서는 오른쪽으로 천천히 걸어요.'],
    qs:[['글쓴이의 주장은 무엇인가요?','복도에서는 뛰지 말고 천천히 걸어야 한다.',['쉬는 시간을 늘려야 한다.','복도를 넓게 만들어야 한다.','운동장에서 뛰면 안 된다.'],'①문단 끝과 ⑤문단에 주장이 나와요.',1],
      ['글쓴이가 든 근거가 아닌 것은?','복도에서 뛰면 달리기 실력이 는다.',['뛰면 다칠 수 있다.','다른 사람에게 피해를 준다.','걷는 습관이 나를 지켜 준다.'],'②③④문단의 근거를 다시 살펴봐요.',0],
      ['③문단의 ‘피해’와 뜻이 가장 비슷한 것은?','손해나 괴로움',['도움','칭찬','선물'],'‘피해’는 다른 사람 때문에 손해를 입거나 괴로움을 당하는 것이에요.',3],
      ['이 글처럼 주장하는 글을 쓸 때 가장 중요한 것은?','주장에 알맞은 까닭(근거)을 드는 것',['재미있는 흉내 내는 말을 많이 쓰는 것','등장인물을 많이 만드는 것','날씨를 자세히 쓰는 것'],'주장하는 글은 ‘주장 + 근거’로 이루어져요.',0]]},
  {id:'bangjeonghwan', g:'bio', e:'🎈', t:'어린이를 사랑한 방정환', paras:[
    '5월 5일 어린이날에는 누구나 신이 나요. 그런데 100여 년 전에는 어린이날도 없었고, ‘어린이’라는 말도 널리 쓰이지 않았어요. 아이들을 ‘애놈’, ‘어린것’처럼 낮추어 부르는 일이 많았지요.',
    '방정환은 1899년 서울에서 태어났어요. 어릴 때 집안이 어려워져 고생을 많이 했지만, 책 읽기와 이야기하기를 무척 좋아했어요.',
    '어른이 된 방정환은 ‘어린이’라는 말을 널리 알렸어요. 어린이는 ‘늙은이’, ‘젊은이’처럼 한 사람으로 [[존중]]받아야 할 소중한 사람이라는 뜻을 담았지요.',
    '1923년, 방정환은 친구들과 ‘색동회’를 만들고 어린이날 행사를 열었어요. 같은 해에 어린이를 위한 잡지 『어린이』도 펴냈어요. 이 잡지에는 동화, 동요, 재미있는 이야기가 가득했어요.',
    '방정환은 “어린이를 내려다보지 마시고 쳐다보아 주시오.”라고 말했어요. 어린이를 사랑하고 아낀 방정환의 마음은 오늘날 어린이날에 고스란히 남아 있어요.'],
    qs:[['방정환이 한 일로 알맞지 않은 것은?','한글을 만들었다.',['‘어린이’라는 말을 널리 알렸다.','어린이날 행사를 열었다.','잡지 『어린이』를 펴냈다.'],'한글은 세종대왕이 만들었어요.',0],
      ['③문단의 ‘존중’의 뜻으로 알맞은 것은?','높이어 귀하게 대함',['무시하고 모른 척함','크게 꾸짖음','함께 놀아 줌'],'‘존중’은 높이어 귀중하게 대한다는 뜻이에요.',3],
      ['방정환과 친구들이 만든 모임의 이름은?','색동회',['집현전','화랑도','신간회'],'④문단에 나와요.',4],
      ['“어린이를 내려다보지 마시고 쳐다보아 주시오.”에 담긴 뜻은?','어린이를 소중한 사람으로 대해 달라.',['어린이는 키가 작다.','어린이는 하늘을 좋아한다.','어린이를 혼내야 한다.'],'어린이를 낮추지 말고 존중해 달라는 말이에요.',5]]},
  {id:'birds', g:'info', e:'🕊️', t:'계절 따라 오가는 철새', paras:[
    '해마다 계절이 바뀌면 먼 곳에서 우리나라를 찾아오는 새들이 있어요. 이렇게 계절에 따라 사는 곳을 옮기는 새를 ‘철새’라고 해요. 한곳에 머물러 사는 참새나 까치 같은 새는 ‘텃새’라고 하지요.',
    '봄에 남쪽 따뜻한 나라에서 날아와 우리나라에서 여름을 나는 새를 ‘여름 철새’라고 해요. 제비, 뻐꾸기, 꾀꼬리가 여름 철새예요. 여름 철새는 우리나라에서 알을 낳고 새끼를 키운 뒤, 가을이 되면 다시 남쪽으로 떠나요.',
    '가을에 북쪽 추운 곳에서 날아와 우리나라에서 겨울을 나는 새는 ‘겨울 철새’예요. 기러기, 두루미, 청둥오리 같은 새들이지요. 이 새들이 사는 북쪽은 겨울에 너무 추워 먹이를 찾기 어렵기 때문에 [[비교적]] 따뜻한 우리나라로 오는 거예요.',
    '철새들은 수천 킬로미터를 쉬지 않고 날아가기도 해요. 해와 별의 위치, 땅의 모양을 보고 길을 찾는다고 알려져 있어요.',
    '요즘은 철새들이 쉬어 가는 갯벌과 습지가 줄어들고 있어요. 먼 길을 날아온 철새들이 편히 쉬어 갈 수 있도록 자연을 지켜야 해요.'],
    qs:[['제비는 어떤 새인가요?','여름 철새',['겨울 철새','텃새','바닷새'],'②문단: 제비는 여름 철새예요.',2],
      ['겨울 철새가 우리나라로 오는 까닭은?','북쪽은 너무 추워 먹이를 찾기 어려워서',['우리나라가 더 시원해서','알을 낳을 둥지가 없어서','길을 잃어서'],'③문단을 보세요.',3],
      ['텃새끼리 바르게 묶은 것은?','참새, 까치',['제비, 뻐꾸기','기러기, 두루미','꾀꼬리, 청둥오리'],'①문단: 참새, 까치는 텃새예요.',1],
      ['③문단의 ‘비교적’의 뜻으로 알맞은 것은?','다른 것에 견주어 보아서',['아주 조금도','언제나 똑같이','처음으로'],'북쪽에 견주어 보면 우리나라가 따뜻하다는 뜻이에요.',3]]},
  {id:'kimjang', g:'life', e:'🥬', t:'할머니 댁 김장하는 날', by:'○월 ○일 토요일 · 바람이 차가운 날', paras:[
    '오늘은 할머니 댁에서 김장을 하는 날이었다. 아침 일찍 도착했더니 마당에 소금에 절인 배추가 산처럼 쌓여 있었다. 할머니는 어젯밤부터 배추를 절이셨다고 했다.',
    '나는 엄마와 함께 빨간 양념을 배춧잎 사이사이에 골고루 발랐다. 처음에는 양념이 자꾸 뭉쳐서 어려웠는데, 할머니께서 “잎을 한 장씩 들추고 쓱쓱 문질러야지.” 하고 알려 주셨다. 그대로 해 보니 훨씬 쉬웠다.',
    '한참 하다 보니 허리도 아프고 손도 [[얼얼했다]]. 그래도 식구들이 모두 모여 웃고 떠들며 일하니 힘든 줄 몰랐다. 삼촌은 김치통 나르기를 맡았고, 사촌 동생은 배추 꼬리를 모으는 일을 했다.',
    '김장이 끝나자 할머니께서 따끈한 수육을 삶아 주셨다. 방금 버무린 김치에 수육을 싸서 먹었더니 정말 꿀맛이었다.',
    '돌아오는 차 안에서 김치통을 안고 생각했다. 겨우내 먹을 김치에는 할머니의 정성과 우리 가족의 웃음이 함께 담겨 있다. 내년 김장 때도 꼭 돕고 싶다.'],
    qs:[['글쓴이가 김장할 때 한 일은?','배춧잎 사이에 양념을 발랐다.',['배추를 소금에 절였다.','김치통을 날랐다.','배추 꼬리를 모았다.'],'②문단: 나는 엄마와 함께 양념을 발랐어요.',2],
      ['③문단의 ‘얼얼했다’는 어떤 느낌일까요?','맵거나 차가워서 아리고 따끔한 느낌',['보들보들 부드러운 느낌','따뜻하고 포근한 느낌','간지러운 느낌'],'‘얼얼하다’는 맵거나 차거나 맞아서 아린 느낌이에요.',3],
      ['이 글은 어떤 종류의 글인가요?','겪은 일과 느낌을 쓴 일기',['물건을 파는 광고','주장하는 글','설명서'],'날짜와 날씨, 겪은 일과 생각이 들어 있어요.',0],
      ['글쓴이가 마지막에 느낀 마음으로 알맞은 것은?','가족과 함께해서 뿌듯하고 따뜻한 마음',['힘들어서 다시는 하기 싫은 마음','김치가 싫어진 마음','혼나서 속상한 마음'],'⑤문단: 내년에도 꼭 돕고 싶다고 했어요.',5]]},
  {id:'firefighter', g:'letter', e:'🚒', t:'소방관 아저씨께', by:'20○○년 ○월 ○일 · 행복초등학교 4학년 김예나 올림', paras:[
    '소방관 아저씨께. 안녕하세요? 저는 행복초등학교 4학년 김예나예요. 지난주 우리 아파트에 불이 났을 때 달려와 주신 소방관 아저씨께 꼭 감사 인사를 드리고 싶어서 편지를 써요.',
    '그날 밤, 아래층에서 매캐한 연기가 올라와서 우리 가족은 너무 무서웠어요. 엄마가 젖은 수건으로 제 코와 입을 막아 주셨고, 우리는 몸을 낮추고 계단으로 내려갔어요.',
    '밖에 나와 보니 소방차 여러 대가 벌써 와 있었어요. 아저씨들은 무거운 장비를 메고 연기 속으로 [[망설임]] 없이 들어가셨어요. 그 모습을 보니 무서운 마음이 조금씩 사라졌어요.',
    '다행히 다친 사람 없이 불이 꺼졌어요. 뜨거운 불 앞에서 얼마나 힘드셨을까 생각하니 마음이 뭉클했어요. 저도 커서 아저씨들처럼 다른 사람을 돕는 사람이 되고 싶어요.',
    '늘 건강하시고 다치지 마세요. 정말 고맙습니다!'],
    qs:[['예나가 편지를 쓴 까닭은?','불을 꺼 준 소방관께 감사하려고',['소방관이 되는 방법을 물으려고','아파트 이사를 알리려고','불조심 포스터를 부탁하려고'],'①문단에 편지를 쓴 까닭이 나와요.',1],
      ['불이 났을 때 예나네 가족이 한 일로 알맞은 것은?','젖은 수건으로 코와 입을 막고 몸을 낮춰 계단으로 내려갔다.',['엘리베이터를 타고 내려갔다.','창문을 열고 기다렸다.','불을 직접 끄려고 물을 뿌렸다.'],'②문단: 불이 나면 엘리베이터 대신 계단으로 가요.',2],
      ['③문단의 ‘망설임 없이’와 뜻이 가장 비슷한 것은?','머뭇거리지 않고',['천천히 쉬면서','무서워하며','몰래 숨어서'],'망설이다 = 이리저리 생각만 하고 머뭇거리다',3],
      ['편지의 짜임에서 ‘20○○년 ○월 ○일, 김예나 올림’은 무엇에 해당할까요?','쓴 날짜와 쓴 사람',['받을 사람','첫인사','끝인사'],'편지 끝에는 쓴 날짜와 쓴 사람을 써요.',0]]},
  {id:'camel', g:'info', e:'🐫', t:'사막의 배, 낙타', paras:[
    '낮에는 뜨겁고 밤에는 추운 사막. 모래바람이 불고 물도 거의 없는 곳이에요. 이런 사막에서 무거운 짐을 지고 먼 길을 가는 동물이 있어요. 바로 ‘사막의 배’라고 불리는 낙타예요.',
    '낙타의 등에 있는 혹에는 물이 아니라 지방이 들어 있어요. 먹이를 구하기 어려울 때 이 지방을 에너지로 써요. 그래서 오랫동안 먹지 못해도 [[견딜]] 수 있어요.',
    '낙타는 물을 한 번에 아주 많이 마실 수 있어요. 목이 몹시 마를 때는 몇 분 만에 100리터 가까이 마시기도 해요. 그리고 땀을 잘 흘리지 않아 몸속의 물을 아껴 써요.',
    '모래바람을 막는 몸도 가졌어요. 속눈썹이 길고 두 줄로 나 있어 모래가 눈에 들어가지 않고, 콧구멍을 꽉 닫을 수도 있어요. 발바닥은 넓고 푹신해서 모래 속에 잘 빠지지 않아요.',
    '이렇게 낙타는 사막에서 살아가기 알맞은 몸을 가지고 있어요. 사막 사람들에게 낙타는 짐을 나르고 젖을 주는 고마운 친구예요.'],
    qs:[['낙타의 혹에 들어 있는 것은?','지방',['물','모래','공기'],'②문단: 혹에는 물이 아니라 지방이 있어요.',2],
      ['낙타의 몸과 그 까닭을 바르게 짝 지은 것은?','넓고 푹신한 발바닥 - 모래에 잘 빠지지 않는다',['긴 속눈썹 - 물을 많이 마신다','혹 - 모래바람을 막는다','닫히는 콧구멍 - 짐을 많이 나른다'],'④문단을 다시 읽어 봐요.',4],
      ['②문단의 ‘견딜’의 기본 모양은?','견디다',['견디','견딜다','견들다'],'국어사전에는 기본 모양 ‘견디다’로 실려 있어요.',2],
      ['이 글의 제목을 ‘사막의 배, 낙타’라고 한 까닭으로 알맞은 것은?','사막에서 짐을 싣고 먼 길을 가기 때문에',['낙타가 배를 타고 다녀서','낙타 배가 볼록해서','사막에 강이 많아서'],'①문단: 배가 짐을 나르듯 낙타가 사막에서 짐을 날라요.',1]]},
  {id:'saltmill', g:'folk', e:'🧂', t:'바닷물은 왜 짤까?', paras:[
    '옛날 어느 임금님에게 신기한 맷돌이 있었어요. “나와라, 쌀!” 하고 돌리면 쌀이 쏟아지고, “나와라, 금!” 하면 금이 나왔어요. 멈추게 하려면 “그쳐라!” 하고 말하면 됐지요.',
    '욕심 많은 도둑이 이 소문을 들었어요. 도둑은 몰래 궁궐에 들어가 맷돌을 훔쳐서 배를 타고 멀리 달아났어요.',
    '바다 한가운데에 이른 도둑은 생각했어요. ‘무엇을 달라고 할까? 그래, 요즘 제일 귀한 소금을 잔뜩 만들어 팔면 큰 부자가 될 거야!’ 도둑은 신이 나서 맷돌을 돌렸어요. “나와라, 소금!”',
    '하얀 소금이 쉴 새 없이 쏟아졌어요. 배 안에 소금이 가득 차올랐지만 도둑은 멈추는 말을 몰랐어요. “그만! 이제 됐어! 멈춰!” 아무리 외쳐도 소금은 [[하염없이]] 쏟아졌어요.',
    '결국 배는 소금의 무게를 이기지 못하고 바닷속으로 가라앉고 말았어요. 사람들은 그 맷돌이 지금도 바다 밑에서 빙글빙글 돌며 소금을 만들고 있어서 바닷물이 짠 거라고 이야기한답니다.'],
    qs:[['맷돌을 멈추게 하는 말은?','그쳐라!',['멈춰!','그만!','됐어!'],'①문단에 나와요. 도둑은 이 말을 몰랐어요.',1],
      ['배가 가라앉은 까닭은?','멈추는 말을 몰라 소금이 너무 많이 나와서',['폭풍이 불어서','임금님이 쫓아와서','맷돌이 깨져서'],'④⑤문단을 보세요.',4],
      ['④문단의 ‘하염없이’와 뜻이 가장 비슷한 말은?','끝없이 계속',['조금씩 천천히','딱 한 번만','갑자기 뚝'],'‘하염없이’는 그치지 않고 계속되는 모양이에요.',4],
      ['이 이야기가 들려주는 교훈으로 알맞은 것은?','지나친 욕심은 화를 부른다.',['소금은 몸에 좋다.','맷돌은 무겁다.','바다는 넓다.'],'욕심 많은 도둑이 결국 모든 것을 잃었어요.',0]]},
  {id:'gyeongju', g:'travel', e:'🛕', t:'천 년의 도시, 경주', paras:[
    '지난 토요일, 우리 가족은 신라의 수도였던 경주로 여행을 떠났다. 경주는 도시 전체가 박물관이라고 불릴 만큼 옛 유적이 많은 곳이다.',
    '맨 처음 간 곳은 불국사였다. 돌계단인 청운교와 백운교를 올라가니 다보탑과 석가탑이 나란히 서 있었다. 다보탑은 모양이 화려하고, 석가탑은 단순하면서도 [[단정해]] 보였다. 두 탑이 서로 달라서 더 멋있었다.',
    '다음으로 토함산에 있는 석굴암에 갔다. 유리창 너머로 부처님이 동해를 바라보며 앉아 계셨다. 돌을 쌓아 굴을 만들고 그 안에 부처님을 모셨다니, 신라 사람들의 솜씨가 정말 놀라웠다.',
    '저녁에는 첨성대를 보러 갔다. 불빛을 받은 첨성대는 생각보다 작았지만, 1,300년이 넘도록 그 자리에 서 있다는 것이 신기했다.',
    '경주 여행을 하며 신라 사람들이 얼마나 뛰어났는지 알 수 있었다. 다음에는 국립경주박물관에 가서 금관도 꼭 보고 싶다.'],
    qs:[['글쓴이가 여행한 차례로 알맞은 것은?','불국사 → 석굴암 → 첨성대',['첨성대 → 불국사 → 석굴암','석굴암 → 첨성대 → 불국사','불국사 → 첨성대 → 석굴암'],'기행문은 간 곳의 차례(여정)를 따라 써요.',0],
      ['불국사에서 본 두 탑은?','다보탑과 석가탑',['첨성대와 석굴암','청운교와 백운교','황룡사 9층 목탑과 석가탑'],'②문단을 보세요.',2],
      ['②문단의 ‘단정해’와 뜻이 가장 비슷한 것은?','깔끔하고 바르게',['어지럽고 복잡하게','크고 무섭게','낡고 오래되게'],'‘단정하다’는 옷차림이나 모양이 깔끔하고 바르다는 뜻이에요.',2],
      ['기행문에 들어가는 세 가지를 바르게 고른 것은?','여정, 견문, 감상',['주장, 근거, 결론','인물, 사건, 배경','처음 인사, 할 말, 끝인사'],'여정(간 곳), 견문(보고 들은 것), 감상(생각과 느낌)이에요.',0]]},
  {id:'moon', g:'info', e:'🌙', t:'달의 얼굴이 바뀌어요', paras:[
    '밤하늘의 달은 날마다 모양이 조금씩 바뀌어요. 가느다란 눈썹 같다가, 반쪽이 되었다가, 동그란 쟁반처럼 되기도 하지요. 왜 이렇게 모양이 바뀌는 걸까요?',
    '달은 스스로 빛을 내지 못해요. 햇빛을 받아 되비치기 때문에 밝게 보이는 거예요. 달이 지구 둘레를 돌면서 햇빛을 받는 부분 가운데 우리 눈에 보이는 부분이 달라져서 모양이 바뀌어 보여요.',
    '음력 2~3일 무렵에는 저녁 서쪽 하늘에 오른쪽이 가늘게 빛나는 초승달이 떠요. 7~8일 무렵에는 오른쪽 반이 밝은 상현달, 15일 무렵에는 동그란 보름달이 돼요.',
    '보름달이 지나면 달은 다시 조금씩 줄어들어요. 22~23일 무렵에는 왼쪽 반이 밝은 하현달, 27~28일 무렵에는 왼쪽이 가늘게 빛나는 그믐달이 돼요.',
    '이렇게 달의 모양은 약 30일(한 달)마다 [[되풀이돼요]]. 옛날 사람들은 달의 모양을 보고 날짜를 셈했는데, 이것이 바로 ‘음력’이에요.'],
    qs:[['달이 밝게 보이는 까닭은?','햇빛을 받아 되비치기 때문에',['스스로 빛을 내기 때문에','별빛을 모아서','지구가 빛을 비춰서'],'②문단: 달은 스스로 빛을 내지 못해요.',2],
      ['음력 15일 무렵에 볼 수 있는 달은?','보름달',['초승달','상현달','그믐달'],'③문단을 보세요.',3],
      ['달의 모양이 바뀌는 차례로 알맞은 것은?','초승달 → 상현달 → 보름달 → 하현달 → 그믐달',['보름달 → 초승달 → 상현달 → 그믐달 → 하현달','그믐달 → 하현달 → 초승달 → 보름달 → 상현달','상현달 → 초승달 → 보름달 → 그믐달 → 하현달'],'③④문단에 날짜 차례로 나와요.',0],
      ['⑤문단의 ‘되풀이돼요’와 뜻이 비슷한 말은?','반복돼요',['사라져요','멈춰요','커져요'],'같은 일이 자꾸 일어난다는 뜻이에요.',5]]},
  {id:'breakfast', g:'opinion', e:'🍚', t:'아침밥을 꼭 먹어요', paras:[
    '아침마다 “늦었어!” 하며 밥을 거르고 학교에 가는 친구들이 많아요. 조사해 보면 초등학생 열 명 가운데 한두 명은 아침을 자주 거른다고 해요. 하지만 저는 아침밥을 꼭 먹어야 한다고 생각해요.',
    '첫째, 아침밥은 공부하는 힘을 줘요. 우리 뇌는 밤새 쉬고 나면 배가 고픈 상태가 돼요. 아침을 먹으면 뇌에 에너지가 전해져서 수업 시간에 집중이 잘돼요.',
    '둘째, 아침밥을 먹으면 건강해져요. 아침을 거르면 점심때 너무 배가 고파서 [[허겁지겁]] 많이 먹게 되고, 배탈이 나기 쉬워요. 세끼를 제때 먹어야 몸이 튼튼해져요.',
    '셋째, 가족과 함께하는 시간이 생겨요. 아침 식탁에 모여 오늘 할 일을 이야기하면 하루를 기분 좋게 시작할 수 있어요.',
    '아침밥을 먹을 시간이 없다면 10분만 일찍 일어나 보세요. 밥이 어렵다면 과일이나 우유라도 먹어요. 튼튼한 몸과 맑은 머리를 위해 아침밥을 꼭 먹어요.'],
    qs:[['글쓴이의 주장은?','아침밥을 꼭 먹어야 한다.',['점심을 많이 먹어야 한다.','아침에 늦잠을 자야 한다.','우유만 마셔야 한다.'],'①문단 마지막 문장과 ⑤문단에 주장이 나와요.',1],
      ['‘아침밥은 공부하는 힘을 준다’의 까닭은?','뇌에 에너지가 전해져 집중이 잘되어서',['밥이 맛있어서','학교에 늦지 않아서','친구를 만날 수 있어서'],'②문단을 보세요.',2],
      ['③문단의 ‘허겁지겁’은 어떤 모양일까요?','몹시 급하게 서두르는 모양',['아주 천천히 먹는 모양','조금만 먹는 모양','웃으며 먹는 모양'],'‘허겁지겁’은 조급한 마음으로 몹시 서두르는 모양이에요.',3],
      ['⑤문단에서 글쓴이가 제안한 방법이 아닌 것은?','아침을 먹지 말고 간식을 많이 먹는다.',['10분 일찍 일어난다.','과일을 먹는다.','우유라도 마신다.'],'⑤문단에 나온 방법을 확인해요.',5]]},
  {id:'rainpoem', g:'poem', e:'🌧️', t:'빗방울 음악회', poem:true, paras:[
    '톡 톡 톡','장독 뚜껑 위에서','빗방울이 작은북을 쳐요','',
    '똑 똑 똑','처마 끝에 매달려','빗방울이 [[실로폰]]을 쳐요','',
    '퐁 퐁 퐁','웅덩이에 뛰어들며','빗방울이 큰북을 쳐요','',
    '우산 속의 나는','귀를 쫑긋 세운','하나뿐인 관객'],
    qs:[['이 시에서 빗방울을 무엇에 빗대어 나타냈나요?','악기를 연주하는 사람',['춤추는 무용수','달리기 선수','요리사'],'빗방울이 작은북, 실로폰, 큰북을 친다고 했어요.',0],
      ['‘톡 톡 톡’, ‘똑 똑 똑’, ‘퐁 퐁 퐁’ 같은 말을 무엇이라고 할까요?','소리를 흉내 내는 말',['모양을 흉내 내는 말','높임 표현','반대말'],'소리를 흉내 내어 시를 생생하게 해 줘요.',0],
      ['빗방울이 큰북을 치는 곳은?','웅덩이',['장독 뚜껑','처마 끝','우산 위'],'셋째 연을 보세요.',0],
      ['마지막 연에서 ‘나’는 어떤 마음일까요?','빗소리를 즐겁게 듣고 있다.',['비가 와서 짜증이 난다.','우산을 잃어버려 속상하다.','무서워서 숨고 싶다.'],'귀를 쫑긋 세운 관객이 되어 음악회를 즐겨요.',0]]},
  {id:'recycle', g:'info', e:'♻️', t:'페트병의 두 번째 인생', paras:[
    '우리가 마신 음료수 페트병은 어디로 갈까요? 잘 버리면 새 물건으로 다시 태어나지만, 아무렇게나 버리면 쓰레기 산이 되거나 바다로 흘러가 물고기와 바다거북을 아프게 해요.',
    '페트병을 제대로 버리려면 네 단계를 기억하면 돼요. 먼저 안에 남은 음료를 비우고 물로 헹궈요. 다음으로 겉에 붙은 비닐 라벨을 떼어 내요. 그리고 병을 꾹 눌러 부피를 줄이고, 뚜껑을 닫아서 내놓아요.',
    '특히 투명한 페트병은 다른 플라스틱과 따로 모아 버려야 해요. 투명 페트병은 깨끗하게 모이면 가느다란 실로 뽑아낼 수 있어서 옷이나 가방으로 다시 만들어지거든요. 페트병 몇 개면 티셔츠 한 벌을 만들 수 있다고 해요.',
    '이렇게 버린 물건을 다시 쓸 수 있게 만드는 것을 ‘재활용’이라고 해요. 재활용을 하면 새로 만드는 데 드는 자원과 에너지를 [[아낄]] 수 있어요.',
    '오늘 마신 페트병 하나부터 제대로 버려 볼까요? 작은 습관이 지구를 지키는 큰 힘이 돼요.'],
    qs:[['페트병을 버리는 방법으로 알맞지 않은 것은?','라벨을 붙인 채로 버린다.',['안을 비우고 헹군다.','눌러서 부피를 줄인다.','투명 페트병은 따로 모은다.'],'②문단: 라벨은 떼어 내야 해요.',2],
      ['깨끗한 투명 페트병으로 만들 수 있는 것은?','옷이나 가방',['유리컵','종이책','나무 의자'],'③문단을 보세요.',3],
      ['‘재활용’의 뜻으로 알맞은 것은?','버린 물건을 다시 쓸 수 있게 만드는 것',['물건을 아주 많이 사는 것','쓰레기를 태우는 것','물건을 새로 만드는 것'],'④문단에 뜻이 나와요.',4],
      ['④문단의 ‘아낄’과 바꾸어 쓸 수 있는 말은?','절약할',['낭비할','버릴','잃어버릴'],'아끼다 = 함부로 쓰지 않다 = 절약하다',4]]},

function rowArrows(){

        b.onclick=()=>{ r.scrollBy({left:(d==='l'?-1:1)*Math.max(120,r.clientWidth*.7)}); setTimeout(()=>rowArrowSet(w,r),450); }; w.append(b); });
      r.addEventListener('scroll',()=>rowArrowSet(w,r),{passive:true});
      const on=r.querySelector('.on'); if(on && on.offsetLeft+on.offsetWidth>r.clientWidth) r.style.scrollBehavior='auto', r.scrollLeft=on.offsetLeft-40, r.style.scrollBehavior='';
    }
    rowArrowSet(w,r);
  });
}

  if(!settings.sound) return;

    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    clearTimeout(actxRest);
    if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type='triangle'; o.connect(g); g.connect(actx.destination);
    if(ok){ o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+0.1); }
    else { o.frequency.setValueAtTime(240,t); o.frequency.setValueAtTime(180,t+0.12); }
    g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    o.start(t); o.stop(t+0.36);
    actxRest=setTimeout(()=>{ try{ if(actx) actx.suspend(); }catch(e){} },700);
  }catch(e){}
}

    t+=`<line class="ck-tick${b?' b':''}" x1="${(Math.sin(a)*r1).toFixed(1)}" y1="${(-Math.cos(a)*r1).toFixed(1)}" x2="${(Math.sin(a)*93).toFixed(1)}" y2="${(-Math.cos(a)*93).toFixed(1)}"/>`;
  }
  for(let i=1;i<=12;i++){ const a=i*Math.PI/6; t+=`<text class="ck-num" x="${(Math.sin(a)*67).toFixed(1)}" y="${(-Math.cos(a)*67).toFixed(1)}">${i}</text>`; }
  const sec=s||0, ha=(h%12)*30+m*0.5+sec/120, ma=m*6+sec*0.1;
  return `<svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="${h%12||12}시 ${m}분"><circle class="ck-face" r="96"/>${t}
    <line class="ck-h" x1="0" y1="0" x2="0" y2="-46" transform="rotate(${ha})"/>
    <line class="ck-m" x1="0" y1="0" x2="0" y2="-74" transform="rotate(${ma})"/>
    ${s!==undefined?`<line class="ck-s" x1="0" y1="14" x2="0" y2="-82" transform="rotate(${s*6})"/>`:''}
    <circle class="ck-c" r="5"/></svg>`;
}

/* ───── 온라인 저장 (Firebase Firestore) ─────
   아이 문서(e4/doyun): { name, stars, starsAt, hmock, hwrong, hwrongAt, kread, hstory, mbest, stat, wrongs, wrongsAt, books, booksAt, pinH, pinAt, updatedAt }

   여러 기기에서 쓰면 문제 수 · 점수는 큰 쪽을, 별 · 목록은 나중에 바뀐 쪽을 따라요. */
const cloud = { ready:null, db:null, ok:false };
function cloudInit(){
  if(typeof SIM_BOARD!=='undefined' && SIM_BOARD) return Promise.resolve(null);   // 🖥️ 전자칠판: 저장 안 함
  if(!FIREBASE_CONFIG) return Promise.resolve(null);
  if(cloud.ready) return cloud.ready;
  const load=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  cloud.ready = load(base+'firebase-app-compat.js').then(()=>load(base+'firebase-firestore-compat.js')).then(()=>load(base+'firebase-auth-compat.js')).then(()=>{
    firebase.initializeApp(FIREBASE_CONFIG); cloud.db=firebase.firestore(); cloud.ok=true; return cloud.db;
  }).catch(e=>{ console.warn('온라인 저장을 쓸 수 없어요', e); return null; });
  return cloud.ready;
}
const kidRef = name => cloud.db && KID_IDS[name] ? cloud.db.collection(GRADE_ID).doc(KID_IDS[name]) : null;
/* {키: 숫자} 또는 {키: {n,ok}} 를 큰 쪽으로 합쳐요 */
function mergeMax(a, b){
  const o=Object.assign({}, a||{});
  for(const k in (b||{})){
    const x=o[k], y=b[k];
    if(typeof y==='number') o[k]=Math.max(x||0,y);
    else if(y && typeof y==='object') o[k]=x&&typeof x==='object' ? {n:Math.max(x.n||0,y.n||0), ok:Math.max(x.ok||0,y.ok||0)} : y;
  }
  return o;
}
const MAX_KEYS = ['lib','csbest','kread','hstory','mbest','stat'];
const LATEST_KEYS = [['hwrong','hwrongAt'],['wrongs','wrongsAt'],['books','booksAt']];
async function cloudPull(name, docOnly){
  if(!KID_IDS[name] || !await cloudInit()) return false;
  try{
    const ref=kidRef(name), snap=await ref.get();
    if(snap.exists){
      const d=snap.data();
      // 관리자(대시보드 · 관리자 모드)가 기록을 지웠으면 이 기기에 남은 기록도 지워요
      if(d.resetAt && d.resetAt > store.get('resetAt',0,name)){
        PROFILE_KEYS.filter(k=>!KEEP_ON_RESET.includes(k)).forEach(k=>store.del(k,name));
        store.set('resetAt',d.resetAt,name);
        if(name===who){ stars=0; updateStars(); }
      }
      ledgerApply(d, name);   // 별 · 🌈 · 쓴 별 · 산 물건 (별 장부)
      if(typeof d.hmock==='number' && d.hmock>store.get('hmock',0,name)) store.set('hmock',d.hmock,name);
      MAX_KEYS.forEach(k=>{ if(d[k]) store.set(k, mergeMax(store.get(k,{},name), d[k]), name); });
      LATEST_KEYS.forEach(([k,at])=>{ if(d[k] && (d[at]||0) > store.get(at,0,name)){ store.set(k,d[k],name); store.set(at,d[at],name); } });
      const lp=kidPinsRaw()[name];
      if(d.pinAt && (!lp || d.pinAt > lp.at)){ const r=kidPinsRaw(); r[name]={h:d.pinH||null, at:d.pinAt}; store.set('kidpins',r); }
    }
    if(docOnly) return true;
    const L=getLog(name), vis=store.get('visits',{},name), sec=store.get('studysec',{},name), qs=await ref.collection('daily').get();
    qs.forEach(doc=>{
      const k=doc.id, d=doc.data();
      if(k===dayKey()){ [['starDay','starsGot'],['stkDay','stkGot']].forEach(([lk,rk])=>{ const o=store.get(lk,{},name); if((d[rk]||0) > (o.d===k?o.n:0)) store.set(lk,{d:k,n:d[rk]},name); }); }
      if(d.visited) vis[k]=1;
      if(d.sec) sec[k]=Math.max(sec[k]||0, d.sec);
      Object.keys(SUBJ).forEach(s=>{
        if(!d[s]) return;
        const day=L[k]||(L[k]={}), e=day[s]||(day[s]={n:0,ok:0});
        e.n=Math.max(e.n,d[s].n||0); e.ok=Math.max(e.ok,d[s].ok||0);
      });
    });
    store.set('log',L,name); store.set('visits',vis,name); store.set('studysec',sec,name);
    return true;
  }catch(e){ console.warn('불러오기 실패', e); return false; }
}

const KEEP_ON_RESET = ['settings','unit','mlv','hlv','hslv','elv','level','op','klv'];
async function cloudPushNow(name){
  if(!await cloudInit()) return;
  const ref=kidRef(name); if(!ref) return;

  const k=dayKey(), L=getLog(name);

    const doc={name, estars:eStars(name), estarsAt:store.get('estarsAt',0,name), stk:stkCount(name), deco:store.get('deco',{},name), stars:store.get('stars',0,name), starsAt:store.get('starsAt',0,name), updatedAt:Date.now(),
      hmock:store.get('hmock',0,name), pinH:pin.h||null, pinAt:pin.at||0};
    MAX_KEYS.forEach(x=>{ doc[x]=store.get(x,{},name); });
    LATEST_KEYS.forEach(([x,at])=>{ doc[x]=store.get(x, x==='hwrong'?{}:[], name); doc[at]=store.get(at,0,name); });
    const lg=ledgerDoc(doc, name);

    if(!who || who!==name) return; // 비밀번호만 바꾼 경우 날짜 기록은 건드리지 않아요
    const sdn=(o=>o.d===k?o.n:0)(store.get('starDay',{},name)), kdn=(o=>o.d===k?o.n:0)(store.get('stkDay',{},name));

  }catch(e){ console.warn('저장 실패', e); }
}

  if(!RV||RV.solved||RV.done) return;
  const q=RV.list[RV.i];
  if(q.choices[i]===q.ans){
    RV.solved=true; beep(true); markO(); logToday(q.s, !RV.tried, q.sub);

const numQ = (html, ans, explain='') => ({type:'num', html, ans, explain});
const choQ = (html, ans, others, explain='', cls='') => {

const BOX = '<span class="box">&nbsp;?&nbsp;</span>';
const r3 = x => Math.round(x*1000)/1000;
const fmtNum = x => String(r3(x));
/* 분수 그리기: fr(분자, 분모, 자연수) */
const fr = (n,d,w) => `<span class="mixed">${w?w:''}<span class="frac" data-say="${w&&w!=='□'?w+'과 ':''}${d}분의 ${n==='□'?'몇':n}"><i>${n}</i><i>${d}</i></span></span>`;

function numChoices(ans){
  const dec=!Number.isInteger(ans), c=new Set([fmtNum(ans)]);
  const offs = dec ? [0.1,-0.1,0.01,-0.01,1,-1,ans*9,-ans*0.9] : [1,-1,2,-2,10,-10,5,-5,ans,Math.round(ans/2)];
  for(const o of shuffle(offs)){ const v=r3(ans+o); if(v>=0 && c.size<4) c.add(fmtNum(v)); }
  let k=3; while(c.size<4) c.add(fmtNum(ans+(k++)));

}

/* 도형 그리기: 수학 좌표(위가 +) 점들을 받아 SVG 로. al 각 글자, sl 변 글자, tk 같은 길이 표시 개수, ra 직각 표시, diag 대각선 */
function polySVG(pts, o={}){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const sc=200/Math.max(maxx-minx, maxy-miny, 1e-6), P=34;
  const q=pts.map(([x,y])=>[P+(x-minx)*sc, P+(maxy-y)*sc]);
  const W=(maxx-minx)*sc+P*2, H=(maxy-miny)*sc+P*2;
  const cx=q.reduce((a,p)=>a+p[0],0)/q.length, cy=q.reduce((a,p)=>a+p[1],0)/q.length;
  const unit=(x,y)=>{ const l=Math.hypot(x,y)||1; return [x/l,y/l]; };
  const n=q.length, f=v=>v.toFixed(1);
  let s=`<polygon class="sp" points="${q.map(p=>p.map(f).join(',')).join(' ')}"/>`;
  if(o.diag) for(let i=0;i<n;i++) for(let j=i+2;j<n;j++){ if(i===0&&j===n-1) continue; s+=`<line class="sd" x1="${f(q[i][0])}" y1="${f(q[i][1])}" x2="${f(q[j][0])}" y2="${f(q[j][1])}"/>`; }
  (o.ra||[]).forEach(i=>{ const v=q[i], a=q[(i+n-1)%n], b=q[(i+1)%n], u1=unit(a[0]-v[0],a[1]-v[1]), u2=unit(b[0]-v[0],b[1]-v[1]), k=11;
    s+=`<path class="sq-mark" d="M${f(v[0]+u1[0]*k)},${f(v[1]+u1[1]*k)} L${f(v[0]+u1[0]*k+u2[0]*k)},${f(v[1]+u1[1]*k+u2[1]*k)} L${f(v[0]+u2[0]*k)},${f(v[1]+u2[1]*k)}"/>`; });
  (o.tk||[]).forEach((c,i)=>{ if(!c) return; const a=q[i], b=q[(i+1)%n], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], d=unit(b[0]-a[0],b[1]-a[1]), nn=[-d[1],d[0]];
    for(let t=0;t<c;t++){ const off=(t-(c-1)/2)*6, x=m[0]+d[0]*off, y=m[1]+d[1]*off; s+=`<line class="tk" x1="${f(x-nn[0]*7)}" y1="${f(y-nn[1]*7)}" x2="${f(x+nn[0]*7)}" y2="${f(y+nn[1]*7)}"/>`; } });
  (o.al||[]).forEach((t,i)=>{ if(!t) return; const v=q[i], u=unit(cx-v[0],cy-v[1]); s+=`<text x="${f(v[0]+u[0]*30)}" y="${f(v[1]+u[1]*30)}">${t}</text>`; });
  (o.sl||[]).forEach((t,i)=>{ if(!t) return; const a=q[i], b=q[(i+1)%n], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], u=unit(m[0]-cx,m[1]-cy); s+=`<text x="${f(m[0]+u[0]*16)}" y="${f(m[1]+u[1]*16)}">${t}</text>`; });
  return `<svg class="shape" viewBox="0 0 ${f(W)} ${f(H)}" role="img" aria-label="도형">${s}</svg>`;
}
/* 삼각형: 밑변 양 끝 각 A, B 로 그려요 */
function triPts(A,B){
  const C=180-A-B, rad=Math.PI/180, L=10, b=L*Math.sin(B*rad)/Math.sin(C*rad);
  return [[0,0],[L,0],[b*Math.cos(A*rad), b*Math.sin(A*rad)]];
}
const regPts = n => Array.from({length:n},(_,i)=>{ const a=(90+180/n*(n%2?0:1)+360*i/n)*Math.PI/180; return [Math.cos(a),Math.sin(a)]; });
const POLY_NAME = {3:'삼각형',4:'사각형',5:'오각형',6:'육각형',7:'칠각형',8:'팔각형',9:'구각형',10:'십각형'};

/* 꺾은선그래프 그리기 */
function lineSVG(xs, ys, unit, title){
  const mn=Math.min(...ys), mx=Math.max(...ys);
  const wave = mn>=10, lo = wave ? Math.max(0,Math.floor((mn-2)/2)*2) : 0, hi = Math.ceil((mx+1)/2)*2;
  const step = hi-lo>12 ? 2 : 1, W=320, H=210, L=42, T=14, B=34, R=12;
  const X=i=>L+18+i*(W-L-R-36)/(xs.length-1), Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let s='';
  for(let v=lo; v<=hi; v+=step){ s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/>`; if((v-lo)%(step*(hi-lo>8?2:1))===0) s+=`<text x="${L-12}" y="${Y(v)}">${v}</text>`; }
  s+=`<line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}"/><line class="ax" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>`;
  if(wave){ const y=H-B-8; s+=`<path class="wave" d="M${L-6},${y+3} q3,-6 6,0 t6,0"/>`; }
  s+=`<polyline class="ln" points="${ys.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}"/>`;
  s+=ys.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5"/>`).join('');
  s+=xs.map((x,i)=>`<text x="${X(i)}" y="${H-B+14}">${x}</text>`).join('');
  s+=`<text x="${L-14}" y="${H-10}" style="font-size:10px">(${unit})</text>`;
  return `<div class="gcap">${title}</div><svg class="lgraph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} 꺾은선그래프">${s}</svg>`;
}

/* 5학년 2학기 공통 도우미 */
const gcdS5 = (a,b) => b ? gcdS5(b, a%b) : a;
const redS5 = (n,d) => { const g=gcdS5(n,d); return [n/g, d/g]; };

const two5 = (a,b) => `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${a}${b}</div>`;
/* 직육면체 겨냥도: 가로 a, 세로(깊이) b, 높이 c. 보이지 않는 모서리는 점선 */
function cuboidSVG5(a,b,c,o={}){

function drawLesson(){
  const sb=document.getElementById('sbody'); if(!sb) return;
  sb.innerHTML = LESSONS[App.unit]().join('') + `<button class="big-btn" data-act="smode" data-v="quiz">✏️ 이제 퀴즈 풀어 보기</button>`;
}
function startS(){
  const list=[]; let guard=0;
  while(list.length<10 && guard++<300){ const q=genUnit(App.unit); if(!list.some(x=>x.html===q.html)) list.push(q); }
  S={unit:App.unit,list,i:0,input:'',res:[],correct:0,done:false,lock:false,flash:'',note:'',picked:-1};
  drawS();
}
function qBody(q, input, flash){
  return q.type==='num' ? q.html.replace('□',`<span class="ansbox ${flash}">${input||'&nbsp;'}</span>`) : q.html;
}
function drawS(){
  const sb=document.getElementById('sbody'); if(!sb) return;
  if(!S || S.unit!==App.unit){ startS(); return; }
  if(S.done){
    sb.innerHTML=`<div class="card center">
      <p class="big">${S.correct===10?'🏆 10문제 모두 정답!':`10문제 중 ${S.correct}개 맞았어요!`}</p>
      <p>받은 별: ⭐ ${S.earned}개</p>
      <button class="big-btn" data-act="startS">다시 하기</button>
</div>`;
    return;
  }
  const q=S.list[S.i];
  const dots=`<div class="dots">${S.list.map((_,i)=>`<span class="dot ${i<S.i?(S.res[i]?'ok':'no'):(i===S.i?'cur':'')}"></span>`).join('')}</div>`;
  const tag = App.unit==='mix' ? `<div class="unit-tag">${UNITS[q.unit].name}</div>` : '';
  let below='';
  if(q.type==='num') below=keypad('d','skey');
  else below=`<div class="choices ${q.cls}">${q.choices.map((c,i)=>{
      const cls = S.lock ? (c===q.ans?'ok':(i===S.picked?'no':'')) : '';
      return `<button class="choice ${cls}" data-act="spick" data-v="${i}"><span class="ct">${mathText(c)}</span></button>`;
    }).join('')}</div>`;
  sb.innerHTML=`<div class="card board">${dots}${tag}<div class="sq">${qBody(q,S.input,S.flash)}</div>
    <div class="hint">${S.note||(q.type==='num'?'답을 누르고 확인!':'알맞은 것을 골라요.')}</div></div>${below}${S.lock?'':skipBtn('skey','skip')}`;
}
function answerS(ok){
  const q=S.list[S.i];
  S.res.push(ok); beep(ok); logToday('school', ok, UNITS[q.unit].short);
  if(ok){ markO(); S.correct++; S.flash='ok'; S.note=`<span class="praise">${praise()}</span>`; }
  else { addWrong('school', UNITS[q.unit].short, q); S.flash='no'; S.note=`아쉬워요! 정답은 <b>${mathText(String(q.type==='num'?fmtNum(q.ans):q.ans))}</b>${q.explain?`<br><small>${fracText(q.explain)}</small>`:''}`; }
  S.lock=true; drawS();
  const me=S;
  setTimeout(()=>{
    if(S!==me) return;
    S.i++; S.input=''; S.flash=''; S.note=''; S.lock=false; S.picked=-1;
    if(S.i>=10){ S.done=true; S.earned=S.correct+(S.correct===10?2:0); addStar(S.earned); if(S.correct>=8) burst(); }
    if(App.view==='school') drawS();
  }, ok?900:2800);
}
function sKey(v){
  if(App.smode==='game'){ return; }
  if(!S||S.done||S.lock) return;
  if(v==='skip'){ answerS(false); return; }
  const q=S.list[S.i]; if(q.type!=='num') return;
  if(v==='del') S.input=S.input.slice(0,-1);
  else if(v==='ok'){ if(!S.input||S.input==='.') return; answerS(Math.abs(parseFloat(S.input)-q.ans)<1e-9); return; }
  else if(v==='.'){ if(!S.input.includes('.') && S.input.length<6) S.input=(S.input||'0')+'.'; }
  else if(/^\d$/.test(v)){ if(S.input.length<6) S.input+=v; }
  drawS();
}
function sPick(i){
  if(!S||S.done||S.lock) return;
  const q=S.list[S.i]; S.picked=i; answerS(q.choices[i]===q.ans);
}

/* ⚡ 60초 게임: 60초 동안 고르기 문제를 최대한 많이! 틀리면 ❤️ 하나씩 줄어요 */
let gameTimer=null;
function startGame(){
  clearInterval(gameTimer);
  G={unit:App.unit, score:0, combo:0, maxCombo:0, lives:3, end:Date.now()+60000, q:null, flash:-1, lock:false, done:false};
  nextGameQ(); drawGame();
  gameTimer=setInterval(()=>{
    if(!G || G.done){ clearInterval(gameTimer); return; }
    const left=Math.max(0,G.end-Date.now());
    const bar=document.getElementById('gmbar'), tx=document.getElementById('gmleft');
    if(bar){ bar.style.width=(left/600)+'%'; bar.classList.toggle('low',left<10000); }
    if(tx) tx.textContent=Math.ceil(left/1000);
    if(left<=0) finishGame();
  },250);
}
function nextGameQ(){
  let q=genUnit(G.unit);
  if(q.type==='num') q=Object.assign({}, q, {type:'choice', ans:fmtNum(q.ans), choices:numChoices(q.ans), cls:'short', html:q.html.replace('□',BOX)});
  G.q=q; G.flash=-1; G.lock=false;
}
function drawGame(){
  const sb=document.getElementById('sbody'); if(!sb) return;
  if(!G || G.unit!==App.unit){
    const best=store.get('mbest',{})[App.unit]||0;
    sb.innerHTML=`<div class="card center"><p class="big">⚡ 60초 게임</p><p>60초 동안 문제를 최대한 많이 맞혀요!<br>틀리면 ❤️가 하나씩 줄어요. 연속으로 맞히면 🔥콤보!</p>
      <p class="sub">🏆 ${UNITS[App.unit].short} 최고 기록: ${best}점 · 2점마다 ⭐ 1개</p><button class="big-btn" data-act="gameStart">▶ 시작!</button></div>`;
    return;
  }
  if(G.done){
    sb.innerHTML=`<div class="card center"><p class="sub">⚡ 60초 게임 · ${UNITS[G.unit].short}</p><p class="big">${G.score}점!</p>
      <p>최고 콤보 🔥 ${G.maxCombo} · 받은 별 ⭐ ${G.earned}개</p>${G.newBest?'<p class="praise">새 최고 기록이에요!</p>':`<p class="sub">최고 기록 ${store.get('mbest',{})[G.unit]||0}점</p>`}
      <button class="big-btn" data-act="gameStart">다시 도전</button></div>`;
    return;
  }
  const q=G.q, left=Math.max(0,G.end-Date.now());
  sb.innerHTML=`<div class="card board">
    <div class="gm-top" style="width:100%"><span>⏱ <b id="gmleft">${Math.ceil(left/1000)}</b>초</span><span>${'❤️'.repeat(G.lives)}${'🤍'.repeat(3-G.lives)}</span><span>⭐ ${G.score}${G.combo>=3?` <span class="combo">🔥${G.combo}</span>`:''}</span></div>
    <div class="gm-bar" style="width:100%"><i id="gmbar" style="width:${left/600}%"></i></div>
    ${App.unit==='mix'?`<div class="unit-tag">${UNITS[q.unit].name}</div>`:''}
    <div class="sq">${q.html}</div></div>
    <div class="choices ${q.cls}">${q.choices.map((c,i)=>`<button class="choice ${G.flash===i?(c===q.ans?'ok':'no'):(G.lock&&c===q.ans?'ok':'')}" data-act="gpick" data-v="${i}"><span class="ct">${mathText(c)}</span></button>`).join('')}</div>`;
}
function gPick(i){
  if(!G||G.done||G.lock) return;
  const q=G.q, ok=q.choices[i]===q.ans;
  G.lock=true; G.flash=i; beep(ok); logToday('school', ok, UNITS[q.unit].short);
  if(ok){ G.score++; G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); }
  else { G.combo=0; G.lives--; addWrong('school', UNITS[q.unit].short, q); }
  drawGame();
  const me=G;
  setTimeout(()=>{ if(G!==me||G.done) return; if(G.lives<=0){ finishGame(); return; } nextGameQ(); if(App.view==='school'&&App.smode==='game') drawGame(); }, ok?350:1100);
}
function finishGame(){
  if(!G||G.done) return;
  clearInterval(gameTimer); G.done=true;
  G.earned=Math.min(15,Math.floor(G.score/2)); addStar(G.earned);
  const b=store.get('mbest',{}); G.newBest=G.score>(b[G.unit]||0);
  if(G.newBest){ b[G.unit]=G.score; store.set('mbest',b); cloudPush(); burst(); }
  if(App.view==='school'&&App.smode==='game') drawGame();
}

function newH(){
  const pool=hPool(App.hgrp);
  let order=[];
  while(order.length<10){
    const s=shuffle(pool);
    if(order.length && s[0].h===order[order.length-1].h) s.push(s.shift());
    order=order.concat(s);
  }
  H={mode:App.hmode, grp:App.hgrp, lv:App.hlv, order:order.slice(0,10), i:0, score:0, done:false};
  nextH();
}
function nextH(){
  const cur=H.order[H.i];
  const others=shuffle(hPool(H.grp).filter(x=>x.h!==cur.h)).slice(0,3);
  H.cur=cur; H.choices=shuffle([cur,...others]); H.tried=false; H.solved=false; H.wrong=[];
}
function drawHQuiz(){
  const hb=document.getElementById('hbody'); if(!hb) return;

  } else {
    hb.innerHTML=`${grpPills()}<div class="card">${top}
      <div class="hj-qm">${H.cur.m}</div>

function advanceH(ms){

const hWrongQ = () => ({html:`<div class="hj-q hanja">${H.cur.h}</div>이 한자의 뜻과 소리는?`, choices:H.choices.map(c=>c.m), ans:H.cur.m, explain:`${H.cur.h} (${H.cur.m}) · 쓰임: ${H.cur.ex}`});

function rNote(q){ return q.p ? `💡 글의 ${CIRC[q.p]}문단을 다시 읽어 봐요. (노랗게 칠했어요)` : '💡 글 전체를 다시 떠올려 봐요.'; }
function rWrongQ(q){

function rPick(i){

  }
}
function kSkip(){
  if(!K||K.solved||K.done) return;

  {id:'matchgirl', e:'🕯️', t:'성냥팔이 소녀', by:'안데르센', pages:[

  {id:'happyprince', e:'🗿', t:'행복한 왕자', by:'오스카 와일드', pages:[

    ['🐦💎','제비는 루비를 물어다 주었어요. 다음 날에는 왕자의 한쪽 눈 보석을 가난한 작가에게, 또 다음 날에는 다른 눈 보석을 성냥팔이 소녀에게 가져다주었어요.'],
    ['🐦🍂','“이제 왕자님은 앞을 볼 수 없으니, 제가 곁에 있을게요.” 제비는 남쪽으로 떠나지 않았어요. 그리고 왕자 몸의 금박을 한 장씩 떼어 가난한 사람들에게 나누어 주었어요.'],

  {id:'axe', e:'🪓', t:'금도끼 은도끼', by:'우리 옛이야기', pages:[

  {id:'lastleaf', lv:2, e:'🍃', t:'마지막 잎새', by:'오 헨리', pages:[
    ['🏙️','뉴욕의 오래된 동네, 그리니치빌리지의 작은 3층 집에 두 젊은 화가 수와 존시가 함께 살았어요. 11월이 되자 차가운 폐렴이 동네를 휩쓸었고, 존시도 그만 병에 걸려 침대에 눕게 되었어요.'],
    ['🩺','의사는 수를 불러 조용히 말했어요. “환자가 살고 싶다는 마음을 잃었어요. 이대로라면 살 가능성은 열에 하나뿐입니다. 무언가 기대할 것이 있어야 해요.”'],
    ['🪟🍂','존시는 창밖의 벽돌담을 타고 오른 늙은 담쟁이덩굴만 바라보았어요. 그리고 잎을 거꾸로 세고 있었어요. “열둘, 열하나, 열…… 마지막 잎이 떨어지면 나도 가게 될 거야.”'],
    ['👨‍🎨','아래층에는 늙은 화가 베어먼이 살았어요. 그는 40년 동안 “언젠가 걸작을 그리겠다.”고 말만 하고 한 번도 그리지 못한 사람이었어요. 존시 이야기를 들은 베어먼은 “그런 바보 같은 생각을 하다니!” 하고 버럭 화를 냈어요.'],
    ['🌧️🌬️','그날 밤, 차가운 비바람이 밤새도록 몰아쳤어요. 수는 아침이 오는 것이 두려웠어요. 이제 잎은 하나도 남지 않았을 테니까요.'],
    ['🍃','하지만 아침에 창문을 열자, 벽돌담에 잎 하나가 꿋꿋이 매달려 있었어요. 다음 날 밤에도 비바람이 불었지만 그 잎은 떨어지지 않았어요.'],
    ['😌','존시는 그 잎을 오래 바라보다가 말했어요. “수, 나는 나쁜 아이였어. 죽기를 바라는 건 잘못이야. 수프 좀 줄래?” 존시는 조금씩 기운을 되찾았어요.'],
    ['🎨💧','며칠 뒤 수가 존시에게 말했어요. “베어먼 할아버지가 폐렴으로 돌아가셨대. 비바람 치던 밤, 흠뻑 젖은 채 사다리와 물감 곁에서 발견되셨대.”'],
    ['🖼️','“저 담쟁이 잎을 봐. 바람이 불어도 한 번도 흔들리지 않잖아. 저게 바로 베어먼 할아버지의 걸작이야. 마지막 잎이 떨어지던 그날 밤, 할아버지가 저기에 그려 놓으신 거야.”']],
    qs:[['존시가 마지막 잎에 대해 가졌던 생각은?','마지막 잎이 떨어지면 자신도 죽을 것이다.',['마지막 잎은 그림일 것이다.','잎이 떨어지면 봄이 온다.','잎을 세면 병이 낫는다.'],'존시는 잎의 수와 자기 목숨을 연결 지어 생각했어요.'],['베어먼이 그린 ‘걸작’은 무엇이었나요?','벽돌담에 그린 마지막 담쟁이 잎',['존시의 얼굴','뉴욕의 풍경','비바람 치는 밤'],'비바람 치던 밤, 담에 잎을 그려 놓았어요.'],['이 작품의 주제로 가장 알맞은 것은?','남을 위해 자신을 희생한 사랑과 희망의 힘',['그림을 잘 그리는 방법','날씨가 건강에 미치는 영향','화가라는 직업의 어려움'],'베어먼의 희생이 존시에게 살아갈 희망을 주었어요.']]},
  {id:'gift', lv:2, e:'🎁', t:'크리스마스 선물', by:'오 헨리', pages:[
    ['🏠','가난한 젊은 부부 짐과 델라가 살고 있었어요. 크리스마스를 하루 앞둔 날, 델라가 가진 돈은 1달러 87센트뿐이었어요. 몇 달 동안 한 푼 두 푼 아껴 모은 돈이었지요.'],
    ['💎⌚','이 부부에게는 자랑스러운 보물이 두 가지 있었어요. 하나는 짐이 할아버지에게 물려받은 금시계였고, 또 하나는 무릎까지 내려오는 델라의 길고 아름다운 머리카락이었어요.'],
    ['✂️💇‍♀️','델라는 거울 앞에 오래 서 있다가 결심했어요. 가발 가게로 가서 자기 머리카락을 20달러에 팔았어요. 그리고 짐의 금시계에 어울리는 백금 시곗줄을 샀어요.'],
    ['😰','저녁에 짐이 돌아왔어요. 짧아진 델라의 머리를 본 짐은 멍하니 서 있었어요. 델라는 떨리는 목소리로 말했어요. “머리카락은 금방 자라요. 당신에게 멋진 선물을 하고 싶었어요.”'],
    ['📦🪮','짐은 델라를 꼭 안아 주고 작은 꾸러미를 건넸어요. 그 안에는 델라가 가게 진열장에서 오랫동안 바라만 보던, 보석이 박힌 아름다운 머리빗 세트가 들어 있었어요.'],
    ['⌚❌','델라는 눈물을 글썽이며 시곗줄을 내밀었어요. “어서 시계를 줘 봐요. 줄을 달아 보게요.” 짐은 소파에 기대어 웃으며 말했어요. “그 시계는 빗을 사려고 팔았어.”'],
    ['💞','두 사람은 서로를 위해 가장 소중한 것을 팔았어요. 그래서 서로가 준 선물은 당장 쓸 수 없게 되었어요.'],
    ['⭐','하지만 글쓴이는 말해요. 선물을 주고받는 모든 사람 가운데 이 두 사람이야말로 가장 지혜로운 사람들이라고요. 가장 소중한 것을 기꺼이 내어 준 사랑이 담긴 선물이었으니까요.']],
    qs:[['델라가 짐의 선물을 사려고 판 것은?','자신의 긴 머리카락',['금시계','보석 빗','집'],'가발 가게에 머리카락을 팔았어요.'],['짐이 델라에게 준 선물이 쓸모없게 된 까닭은?','델라가 머리카락을 잘라서',['빗이 부서져서','가게에서 잘못 사서','델라가 빗을 싫어해서'],'머리빗은 긴 머리에 쓰는 선물이었어요.'],['글쓴이가 두 사람을 가장 지혜롭다고 한 까닭은?','서로를 위해 가장 소중한 것을 기꺼이 내어 주었기 때문에',['비싼 선물을 샀기 때문에','돈을 많이 모았기 때문에','선물을 바꾸었기 때문에'],'선물의 값보다 그 안에 담긴 사랑이 중요해요.']]},
  {id:'tolstoy', lv:2, e:'😇', t:'사람은 무엇으로 사는가', by:'톨스토이', pages:[
    ['❄️👞','가난한 구두장이 세몬은 겨울 외투를 사려고 길을 나섰다가 돈을 받지 못하고 빈손으로 돌아오고 있었어요. 그런데 교회 담벼락 아래에 벌거벗은 젊은이가 추위에 떨며 쓰러져 있었어요.'],
    ['🧥','세몬은 그냥 지나치려다 마음을 돌렸어요. 자기 외투를 벗어 입혀 주고 집으로 데려왔지요. 아내 마트료나는 처음엔 화를 냈지만, 이내 마음이 누그러져 남은 빵을 나누어 주었어요. 그러자 젊은이가 처음으로 빙그레 웃었어요.'],
    ['🪡','젊은이의 이름은 미하일이었어요. 미하일은 세몬에게 구두 만드는 법을 배웠는데, 솜씨가 어찌나 좋은지 마을에 소문이 퍼졌어요. 하지만 미하일은 거의 말이 없었고 웃지도 않았어요.'],
    ['🤵‍♂️','어느 날 덩치 큰 부자 신사가 비싼 가죽을 가져와 말했어요. “1년을 신어도 모양이 변하지 않는 장화를 만들어라!” 그때 미하일은 신사 뒤쪽을 보더니 두 번째로 웃었어요. 그리고 장화가 아닌 죽은 사람에게 신기는 부드러운 슬리퍼를 만들었어요.'],
    ['⚰️','얼마 뒤 하인이 달려왔어요. “주인님이 돌아가셨어요. 장화 대신 장례에 쓸 슬리퍼를 만들어 주세요.” 부자는 1년 뒤를 준비했지만, 오늘 저녁 자기에게 무엇이 필요한지 알지 못했던 거예요.'],
    ['👩‍👧‍👧','몇 년 뒤, 한 부인이 쌍둥이 여자아이를 데리고 구두를 맞추러 왔어요. 부인은 그 아이들이 친자식이 아니라고 했어요. 부모를 잃은 아기들을 데려다 정성껏 키웠다고요. 그 말을 들은 미하일은 세 번째로 웃었어요.'],
    ['✨👼','그러자 미하일의 몸에서 빛이 났어요. 미하일은 사실 하느님의 벌을 받아 땅에 내려온 천사였어요. 세 가지 물음의 답을 깨달으면 하늘로 돌아갈 수 있었지요.'],
    ['📜','“사람 안에 무엇이 있는가? 사랑이 있었습니다. 사람에게 허락되지 않은 것은 무엇인가? 자기에게 정말 필요한 것을 아는 힘이었습니다. 사람은 무엇으로 사는가? 사람은 사랑으로 삽니다.”'],
    ['🕊️','미하일은 노래를 부르며 하늘로 올라갔어요. 세몬의 집에는 따뜻한 빛만이 오래도록 남아 있었답니다.']],
    qs:[['미하일이 처음으로 웃은 때는?','마트료나가 화를 풀고 빵을 나누어 주었을 때',['장화를 주문받았을 때','쌍둥이를 보았을 때','구두를 처음 만들었을 때'],'사람 안에 사랑이 있음을 보았어요.'],['부자 신사의 이야기가 보여 주는 것은?','사람은 자기에게 정말 필요한 것을 알지 못한다.',['부자는 언제나 행복하다.','비싼 가죽이 좋은 장화를 만든다.','구두장이는 거짓말을 잘한다.'],'1년 뒤를 걱정했지만 그날 저녁에 세상을 떠났어요.'],['작품이 말하는 ‘사람이 사는 힘’은?','사랑',['돈','힘','지식'],'미하일이 깨달은 마지막 답이에요.']]},
  {id:'stoneface', lv:2, e:'🗿', t:'큰 바위 얼굴', by:'너새니얼 호손', pages:[
    ['⛰️','어느 골짜기 마을 앞 산에는 사람 얼굴을 닮은 커다란 바위가 있었어요. 사람들은 그것을 ‘큰 바위 얼굴’이라 불렀어요. 그 얼굴은 너그럽고 따뜻해서 바라보기만 해도 마음이 편안해졌어요.'],
    ['👦','마을에는 이런 전설이 있었어요. “언젠가 이 골짜기에서 큰 바위 얼굴을 닮은 훌륭한 사람이 나타날 것이다.” 어린 어니스트는 어머니에게 그 이야기를 듣고, 날마다 큰 바위 얼굴을 바라보며 그 사람을 기다렸어요.'],
    ['💰','어느 날 큰돈을 번 부자 ‘개더골드’가 돌아왔어요. 사람들은 “드디어 그분이 오셨다!” 하고 환호했어요. 하지만 어니스트가 본 그의 얼굴은 욕심으로 가득했어요.'],
    ['⚔️','다음에는 전쟁에서 이긴 장군 ‘올드 블러드 앤 선더’가 돌아왔어요. 그 다음에는 말솜씨가 뛰어난 정치가가 나타났어요. 그때마다 사람들은 기뻐했지만, 어니스트의 눈에는 큰 바위 얼굴의 따뜻함이 보이지 않았어요.'],
    ['👴📖','세월이 흘러 어니스트는 머리가 하얀 노인이 되었어요. 그는 평생 성실하게 일하고, 이웃을 돕고, 날마다 큰 바위 얼굴을 바라보며 생각했어요. 사람들은 어느새 어니스트의 이야기를 들으러 찾아왔어요.'],
    ['✍️','어느 날 유명한 시인이 어니스트를 찾아왔어요. 어니스트는 그 시인이야말로 기다리던 사람일까 기대했지만, 시인은 고개를 저었어요. “제 시는 아름답지만, 저는 제가 쓴 대로 살지 못했습니다.”'],
    ['🌅','해 질 무렵, 어니스트가 마을 사람들 앞에서 이야기를 했어요. 그의 말에는 평생 살아온 삶이 그대로 담겨 있었어요. 그때 시인이 외쳤어요. “보세요! 어니스트 씨가 바로 큰 바위 얼굴과 닮았습니다!”'],
    ['🙏','하지만 어니스트는 조용히 집으로 돌아가며 생각했어요. ‘언젠가 나보다 더 훌륭한 사람이 나타나겠지.’ 그는 끝까지 겸손했어요.']],
    qs:[['사람들이 처음에 기대했던 인물들의 공통점은?','돈, 힘, 말솜씨처럼 겉으로 드러난 것이 대단한 사람',['마음이 따뜻한 사람','골짜기에서 태어난 농부','큰 바위 얼굴을 조각한 사람'],'부자, 장군, 정치가는 모두 겉모습이 화려했어요.'],['결국 큰 바위 얼굴을 닮은 사람은?','어니스트',['개더골드','장군','시인'],'시인이 어니스트를 보고 외쳤어요.'],['어니스트가 큰 바위 얼굴을 닮게 된 까닭은?','평생 바르게 살며 큰 바위 얼굴을 닮고자 했기 때문에',['얼굴을 조각했기 때문에','유명해졌기 때문에','부자가 되었기 때문에'],'마음과 삶이 얼굴에 드러난다는 이야기예요.']]},
  {id:'lastlesson', lv:2, e:'🏫', t:'마지막 수업', by:'알퐁스 도데', pages:[
    ['🏃','그날 아침 프란츠는 학교에 늦었어요. 게다가 아멜 선생님이 분사 규칙을 물어보겠다고 하셨는데 하나도 공부하지 않았지요. 차라리 들판에서 놀까 하다가, 꾹 참고 학교로 달려갔어요.'],
    ['🏫🤫','그런데 교실이 이상했어요. 늘 시끌벅적하던 교실이 조용했고, 선생님은 특별한 날에만 입는 멋진 옷을 입고 계셨어요. 교실 뒤쪽에는 마을 어른들까지 슬픈 얼굴로 앉아 있었어요.'],
    ['📢','아멜 선생님이 천천히 말씀하셨어요. “여러분, 오늘이 나의 마지막 수업입니다. 베를린에서 명령이 왔습니다. 이제부터 알자스와 로렌의 학교에서는 독일어만 가르쳐야 합니다.”'],
    ['😢','프란츠는 가슴이 철렁했어요. ‘이제 프랑스어를 배울 수 없다니! 나는 겨우 글을 쓸 줄 아는 정도인데…….’ 귀찮기만 하던 문법책이 갑자기 오랜 친구처럼 느껴졌어요.'],
    ['🙋‍♂️','선생님이 프란츠에게 분사 규칙을 물으셨지만, 프란츠는 한마디도 대답하지 못했어요. 선생님은 꾸짖지 않으셨어요. “‘내일 하면 되지’ 하며 미루어 온 것이 우리 모두의 잘못이란다.”'],
    ['🔑','선생님은 말씀하셨어요. “프랑스어는 세상에서 가장 아름답고 분명한 말입니다. 그 말을 잘 지키고 절대 잊지 마세요. 나라를 빼앗긴 백성이라도 자기 말을 지키고 있으면, 감옥의 열쇠를 쥐고 있는 것과 같습니다.”'],
    ['✍️','그날 수업은 너무나 쉽게 느껴졌어요. 프란츠는 한 글자 한 글자 정성껏 글씨를 썼어요. 지붕 위에서는 비둘기가 구구 울었어요. ‘저 비둘기들에게도 독일어로 울라고 하려나?’'],
    ['🕛','정오를 알리는 종이 울리고, 밖에서 프로이센 군인들의 나팔 소리가 들렸어요. 선생님은 창백한 얼굴로 칠판에 커다랗게 쓰셨어요. “프랑스 만세!” 그리고 벽에 머리를 기댄 채, 손짓으로 말씀하셨어요. “이제 끝났습니다. 돌아가세요.”']],
    qs:[['오늘이 마지막 수업인 까닭은?','이제부터 독일어만 가르치라는 명령이 내려와서',['선생님이 이사를 가셔서','학교가 문을 닫아서','방학이 시작되어서'],'베를린에서 명령이 왔어요.'],['“감옥의 열쇠를 쥐고 있는 것과 같다”는 말의 뜻은?','자기 나라 말을 지키면 언젠가 자유를 되찾을 힘이 있다.',['감옥에 가지 말아야 한다.','열쇠를 잃어버리면 안 된다.','외국어를 빨리 배워야 한다.'],'말은 민족의 정신을 지키는 힘이에요.'],['이 작품이 우리에게 주는 교훈으로 알맞은 것은?','소중한 것은 잃기 전에 아끼고 미루지 말아야 한다.',['공부는 내일 해도 된다.','지각은 괜찮다.','선생님 옷은 중요하다.'],'프란츠는 ‘내일 하면 되지’ 했던 것을 후회했어요.']]},
  {id:'stars', lv:2, e:'✨', t:'별', by:'알퐁스 도데', pages:[
    ['⛰️🐑','나는 프로방스 지방의 높은 산 위에서 양을 치는 목동이었어요. 몇 주 동안 사람 얼굴은 한 번도 보지 못하고, 개 라브리와 양들하고만 지냈어요.'],
    ['🧺','보름마다 농장에서 식량을 실은 노새가 올라왔어요. 그때마다 나는 산 아래 소식, 특히 주인집 아가씨 스테파네트의 소식이 가장 궁금했어요. 스테파네트는 이 근방에서 가장 아름다운 아가씨였거든요.'],
    ['🐴👧','어느 일요일, 식량이 늦게 도착했어요. 그런데 노새를 몰고 온 사람은 뜻밖에도 스테파네트 아가씨였어요! 심부름꾼이 아파서 대신 왔다고 했어요. 나는 너무 놀라 말도 제대로 하지 못했어요.'],
    ['🌊🌧️','아가씨는 내 오두막을 신기한 듯 둘러보고 산을 내려갔어요. 그런데 얼마 뒤 흠뻑 젖은 채 돌아왔어요. 소나기로 강물이 불어나 건널 수가 없었던 거예요. 아가씨는 어쩔 수 없이 산에서 밤을 보내야 했어요.'],
    ['🔥','나는 오두막에 새 짚을 깔고 아가씨가 쉬게 해 드렸어요. 그리고 밖에 나와 모닥불 곁에 앉았어요. 잠시 뒤, 잠이 오지 않는다며 아가씨가 나와 모닥불 곁에 앉았어요.'],
    ['🌌','밤하늘에는 별이 가득했어요. 아가씨가 물었어요. “저 별들 이름을 아세요?” 나는 목동들이 부르는 별 이름을 하나하나 들려주었어요. 은하수는 ‘성 자크의 길’, 가장 밝은 별은 ‘목동의 별’이라고요.'],
    ['😴','이야기를 듣던 아가씨는 어느새 내 어깨에 머리를 기대고 잠이 들었어요. 나는 꼼짝도 하지 않고 밤새 그대로 앉아 있었어요. 마음은 맑고 깨끗했어요.'],
    ['⭐','나는 생각했어요. 저 수많은 별 가운데 가장 곱고 가장 빛나는 별 하나가 길을 잃고 내려와, 지금 내 어깨에 기대어 잠들어 있다고요.']],
    qs:[['스테파네트가 산에서 밤을 보내게 된 까닭은?','소나기로 강물이 불어 건널 수 없어서',['길을 잃어서','별을 보고 싶어서','노새가 도망가서'],'강을 건너지 못해 돌아왔어요.'],['목동이 밤새 꼼짝하지 않은 까닭은?','잠든 아가씨가 깨지 않도록 조심해서',['추워서','양을 지키느라','무서워서'],'어깨에 기대어 잠든 아가씨를 배려했어요.'],['마지막 문장에서 ‘길을 잃고 내려온 별’은 누구를 빗댄 말인가요?','스테파네트 아가씨',['목동','개 라브리','노새'],'가장 아름다운 존재를 별에 빗대었어요.']]},
  {id:'necklace', lv:2, e:'📿', t:'목걸이', by:'기 드 모파상', pages:[
    ['🏠💭','마틸드는 아름다웠지만 가난한 하급 공무원과 결혼해 살았어요. 그녀는 늘 화려한 저택과 값비싼 드레스, 보석을 꿈꾸며 자기 처지를 불행하다고 여겼어요.'],
    ['✉️','어느 날 남편이 장관이 여는 무도회 초대장을 가져왔어요. 하지만 마틸드는 울상이었어요. “입을 옷도, 걸칠 보석도 없는데 어떻게 가요?” 남편은 사냥총을 사려고 모아 둔 돈으로 드레스를 사 주었어요.'],
    ['💎','마틸드는 부자 친구 포레스티에 부인에게 다이아몬드 목걸이를 빌렸어요. 무도회에서 마틸드는 가장 아름다운 여인이었어요. 모두가 그녀에게 춤을 청했지요.'],
    ['😱','그런데 집에 돌아와 보니 목걸이가 없었어요! 부부는 밤새 길거리와 마차 회사를 뒤졌지만 끝내 찾지 못했어요.'],
    ['💸','부부는 보석 가게에서 똑같은 목걸이를 3만 6천 프랑에 샀어요. 가진 돈을 다 털고, 여기저기서 큰 빚을 졌지요. 그리고 친구에게 아무 말 없이 목걸이를 돌려주었어요.'],
    ['🧹','그 뒤 10년 동안 마틸드는 하녀를 내보내고 작은 다락방으로 이사했어요. 손수 빨래하고, 무거운 물통을 나르고, 시장에서 한 푼이라도 깎았어요. 곱던 손은 거칠어지고 얼굴은 부쩍 늙어 버렸어요.'],
    ['🌳','드디어 빚을 다 갚은 어느 날, 마틸드는 공원에서 여전히 젊고 아름다운 포레스티에 부인을 만났어요. 마틸드는 그동안의 일을 모두 털어놓았어요. “네 목걸이를 잃어버려서 그걸 갚느라 10년을 고생했어.”'],
    ['😨','포레스티에 부인은 깜짝 놀라 마틸드의 손을 잡았어요. “아, 가엾은 마틸드! 내 목걸이는 가짜였어. 기껏해야 500프랑짜리였단다!”']],
    qs:[['마틸드가 늘 불행하다고 여긴 까닭은?','화려하게 살고 싶은데 가난해서',['병이 들어서','친구가 없어서','남편이 나빠서'],'화려한 삶을 꿈꾸며 자기 처지를 불만스러워했어요.'],['마틸드가 10년 동안 고생한 까닭은?','잃어버린 목걸이 값의 빚을 갚느라',['무도회에 또 가려고','드레스를 사려고','이사를 가려고'],'새 목걸이를 사느라 큰 빚을 졌어요.'],['이 작품의 반전(뜻밖의 결말)은?','빌린 목걸이는 사실 값싼 가짜였다.',['목걸이를 다시 찾았다.','남편이 목걸이를 훔쳤다.','친구가 목걸이를 선물로 주었다.'],'마지막 한마디가 모든 고생을 허무하게 만들어요.']]},
  {id:'carol', lv:2, e:'🎄', t:'크리스마스 캐럴', by:'찰스 디킨스', pages:[
    ['💰🧓','런던의 스크루지 영감은 소문난 구두쇠였어요. 크리스마스이브에도 추운 사무실에서 점원 밥 크래칫에게 석탄 한 덩이 아끼라며 호통을 쳤어요. “크리스마스라고? 흥, 쓸데없는 소리!”'],
    ['👻⛓️','그날 밤, 7년 전에 죽은 동업자 말리의 유령이 무거운 쇠사슬을 끌고 나타났어요. “나는 살아서 돈만 알았던 벌로 이 사슬을 끌고 다닌다네. 오늘 밤 유령 셋이 자네를 찾아올 걸세.”'],
    ['🕯️','첫 번째는 ‘과거의 크리스마스 유령’이었어요. 스크루지는 외롭던 어린 시절과, 돈을 좇느라 사랑하던 사람을 떠나보낸 젊은 날의 자신을 보았어요. 스크루지의 눈시울이 붉어졌어요.'],
    ['🍗👨‍👩‍👧‍👦','두 번째는 ‘현재의 크리스마스 유령’이었어요. 밥 크래칫의 가난한 집에서는 가족이 작은 음식을 나누며 행복하게 웃고 있었어요. 하지만 다리가 불편한 막내 팀은 몹시 아파 보였어요. “팀은 살 수 있나요?” 스크루지가 물었어요.'],
    ['🌑','세 번째는 말이 없는 ‘미래의 크리스마스 유령’이었어요. 스크루지는 아무도 슬퍼하지 않는 한 남자의 죽음과, 팀이 없는 크래칫 가족의 슬픈 식탁을 보았어요. 이름 없는 묘비에는 ‘에버니저 스크루지’라고 쓰여 있었어요.'],
    ['🙏','“제발, 제가 달라지겠습니다! 과거와 현재와 미래를 모두 마음에 새기겠습니다!” 스크루지가 울부짖는 순간, 눈을 떠 보니 자기 침대였어요. 크리스마스 아침이었어요!'],
    ['🦃🎁','스크루지는 창문을 열고 소년에게 가장 큰 칠면조를 사서 크래칫 집에 보내 달라고 했어요. 그리고 가난한 사람들을 돕는 데 큰돈을 내고, 조카의 크리스마스 파티에도 찾아갔어요.'],
    ['😊','다음 날 스크루지는 밥의 월급을 올려 주었어요. 팀에게는 두 번째 아버지가 되어 주었고, 팀은 건강을 되찾았어요. 사람들은 말했어요. “스크루지만큼 크리스마스를 잘 보내는 사람은 없다!”']],
    qs:[['말리의 유령이 쇠사슬을 끌고 다닌 까닭은?','살아 있을 때 돈만 알았던 벌 때문에',['감옥에서 도망쳐서','크리스마스를 좋아해서','스크루지에게 선물하려고'],'욕심으로 살아온 삶의 무게예요.'],['스크루지가 달라지기로 결심한 결정적 장면은?','미래에 아무도 슬퍼하지 않는 자기 죽음을 보았을 때',['칠면조를 샀을 때','월급을 올렸을 때','석탄을 아꼈을 때'],'이름 없는 묘비에서 자기 이름을 보았어요.'],['이 작품의 주제로 알맞은 것은?','나누고 베푸는 삶의 소중함',['돈을 아끼는 방법','유령의 무서움','크리스마스 음식 만들기'],'구두쇠가 나눔의 기쁨을 깨닫는 이야기예요.']]},
  {id:'miserables', lv:2, e:'🕯️', t:'레 미제라블', by:'빅토르 위고', pages:[
    ['🍞','장 발장은 굶주린 조카들을 위해 빵 한 조각을 훔치다 붙잡혔어요. 탈옥을 하려다 형이 늘어나 무려 19년을 감옥에서 보냈어요. 풀려났을 때 그의 마음은 세상에 대한 분노로 가득 차 있었어요.'],
    ['🚪','전과자라는 노란 통행증 때문에 어느 여관도 그를 받아 주지 않았어요. 추위에 떨던 장 발장은 미리엘 주교의 집 문을 두드렸어요. 주교는 그를 “형제여” 하고 부르며 따뜻한 저녁을 차려 주고 잠자리를 내주었어요.'],
    ['🥄','그러나 한밤중, 장 발장은 주교의 은식기를 훔쳐 달아났어요. 다음 날 아침 헌병들이 그를 붙잡아 주교 앞에 끌고 왔어요.'],
    ['🕯️🕯️','주교는 뜻밖의 말을 했어요. “아, 왔구려! 은촛대도 드렸는데 왜 두고 가셨소?” 그리고 헌병들이 떠나자 조용히 말했어요. “이 은으로 정직한 사람이 되겠다고 약속하시오. 나는 당신의 영혼을 산 것이오.”'],
    ['😭','장 발장은 한참 동안 울었어요. 태어나 처음 받아 보는 용서와 사랑이었어요. 그는 그날부터 완전히 다른 사람이 되기로 결심했어요.'],
    ['🏭','몇 년 뒤, 장 발장은 이름을 바꾸고 공장을 세워 가난한 사람들에게 일자리를 주었어요. 사람들의 존경을 받아 시장까지 되었지요. 그는 가엾은 여인 판틴을 도와주고, 그녀의 딸 코제트를 끝까지 지켜 주겠다고 약속했어요.'],
    ['👮','그런데 끈질긴 경감 자베르가 늘 그를 의심하며 뒤쫓았어요. 게다가 다른 사람이 장 발장으로 몰려 재판을 받게 되자, 장 발장은 모든 것을 잃을 줄 알면서도 법정에 나가 말했어요. “내가 장 발장이오.”'],
    ['👧❤️','장 발장은 평생 쫓기면서도 코제트를 친딸처럼 사랑으로 키웠어요. 삶의 마지막 날, 그는 주교가 준 은촛대의 불빛 아래에서 코제트의 손을 잡고 평화롭게 눈을 감았어요.']],

    LQ.tried=true; LQ.picked.push(i); beep(false); LQ.note='💡 이야기를 다시 떠올려 봐요. '+esc(q.explain); renderLibrary(); return;
  } else {
    LQ.tried=true; LQ.solved=true; beep(false); logToday('korean', false, '명작 도서관');
    LQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${esc(q.explain)}</small>`;
  }
  renderLibrary();
  const me=LQ;
  setTimeout(()=>{
    if(LQ!==me) return;
    LQ.i++; LQ.tried=false; LQ.solved=false; LQ.picked=[]; LQ.note='';
    if(LQ.i>=LQ.list.length){
      LQ.done=true; LQ.earned=LQ.score+(LQ.score===3?1:0);
      if(LQ.score===3){ addStar(1); burst(); }
      const r=libDone(); r[LQ.id]=Math.max(r[LQ.id]===undefined?-1:r[LQ.id], LQ.score); store.set('lib',r); cloudPush();

/* ───── 연산 (단계별): 두 수 덧셈 · 뺄셈은 세로셈 판, 나머지는 가로식 □ 칸 (엔진은 방마다 같고, 단계표 CALC_LEVELS만 달라요) ───── */
const cxR = (a,b) => a+Math.floor(Math.random()*(b-a+1));
const cxPick = a => a[Math.floor(Math.random()*a.length)];
const cxF = (n,d) => `<span class="cx-fr"><i>${n}</i><i>${d}</i></span>`;          // 분수
const cxM = (w,n,d) => `<span class="cx-mx">${w}${cxF(n,d)}</span>`;                  // 대분수
const cxD = (h,p) => { const s=(h/100).toFixed(p); return s; };                           // 소수 (100배 정수 → 글자)
const cxTrim = s => String(s).includes('.') ? String(s).replace(/0+$/,'').replace(/\.$/,'') : String(s);
const cxV = (a,b,op) => ({v:{a,b,op}});
const cxH = (h,ans,o={}) => Object.assign({h, ans:ans.map(String)}, o);
const cxDanTxt = (a,b) => Array.from({length:b},(_,i)=>a*(i+1)).join(', ');
/* 세로셈 판 */
function cxVert(P){
  const {a,b,op}=P.v, ans=op==='-'?a-b:a+b, n=Math.max(String(a).length,String(b).length,String(ans).length);
  const dig=(x,i)=>{ const s=String(x), k=s.length-1-i; return k>=0?s[k]:''; };
  const show=P.showHint||P.done, marks=Array(n).fill(''), strike=Array(n).fill(false);
  if(show){
    if(op==='+'){ let c=0; for(let i=0;i<n;i++){ c=((+dig(a,i)||0)+(+dig(b,i)||0)+c)>=10?1:0; if(c&&i+1<n) marks[i+1]='1'; } }
    else { const top=[...Array(n+1)].map((_,i)=>+dig(a,i)||0), org=top.slice();
      for(let i=0;i<n;i++) if(top[i]<(+dig(b,i)||0)){ top[i]+=10; top[i+1]-=1; }
      for(let i=0;i<n;i++) if(top[i]!==org[i]&&dig(a,i)!==''){ marks[i]=String(top[i]); strike[i]=true; } }
  }
  const cols=[...Array(n)].map((_,k)=>n-1-k), PL=['일','십','백','천','만'];
  const cell=i=>`<button class="cell ${!P.done&&P.sel===i?'active':''} ${P.cells[i]!==''?'done':''}" data-act="cxSel" data-v="${i}" aria-label="${PL[i]}의 자리">${P.cells[i]}</button>`;
  return `<div class="card board cx-v"><div class="vgrid" id="cxgrid" style="--n:${n}">
    <div></div>${cols.map(i=>`<div class="colname">${PL[i]}</div>`).join('')}
    <div></div>${cols.map(i=>`<div>${marks[i]?`<div class="cell carry done">${marks[i]}</div>`:''}</div>`).join('')}
    <div></div>${cols.map(i=>`<div class="dg" ${strike[i]?'style="text-decoration:line-through;text-decoration-color:var(--no)"':''}>${dig(a,i)}</div>`).join('')}
    <div class="dg op">${op==='-'?'−':'+'}</div>${cols.map(i=>`<div class="dg">${dig(b,i)}</div>`).join('')}
    <div class="bar"></div>
    <div></div>${cols.map(i=>`<div>${cell(i)}</div>`).join('')}
  </div><div class="hint">${P.done?P.msg:P.showHint?cxVHint(P):'칸을 눌러 자리를 고르고 답을 써요.'}</div></div>`;
}
function cxVHint(P){
  const {a,b,op}=P.v, PL=['일','십','백','천'], n=Math.max(String(a).length,String(b).length), d=(x,i)=>+String(x).padStart(n+1,'0').slice(-1-i)[0]||0, out=[];
  if(op==='+'){ let c=0; for(let i=0;i<n;i++){ const s=d(a,i)+d(b,i)+c; out.push(`${PL[i]}의 자리: ${c?'1 + ':''}${d(a,i)} + ${d(b,i)} = ${s}${s>=10?` → <b>${s%10}</b> 쓰고 1 올림`:''}`); c=s>=10?1:0; } }
  else { const top=[...Array(n+1)].map((_,i)=>d(a,i)); for(let i=0;i<n;i++){ const bi=d(b,i);
    if(top[i]<bi){ out.push(`${PL[i]}의 자리: ${top[i]}에서 ${bi}을(를) 뺄 수 없어요 → 10을 빌려 와요: ${top[i]+10} − ${bi} = <b>${top[i]+10-bi}</b>`); top[i]+=10; top[i+1]-=1; }
    else if(top[i]||bi||i<String(a).length) out.push(`${PL[i]}의 자리: ${top[i]} − ${bi} = <b>${top[i]-bi}</b>`); } }
  return out.join('<br>');
}
/* 가로식: {0} {1} … 자리에 답 칸 */
function cxHoriz(P){
  const slot=i=>`<span class="cx-sw"><button class="cx-slot ${!P.done&&P.sel===i?'on':''} ${P.done?'ok':''}" data-act="cxSel" data-v="${i}" aria-label="${P.lab?P.lab[i]:'답'} 칸">${P.in[i]||''}</button>${P.lab&&!P.hideLab?`<small>${P.lab[i]}</small>`:''}</span>`;
  return `<div class="card board cx-h">${P.fig||''}<div class="cx-q">${P.h.replace(/\{(\d)\}/g,(m,i)=>slot(+i))}</div>
    <div class="hint">${P.done?P.msg:P.showHint&&P.hint?P.hint:P.ans.length>1?'칸을 눌러 고르고 답을 써요.':'답을 누르고 확인!'}</div></div>`;
}
function cxPad(P){
  const ex=[]; if(P.dec) ex.push(['.','소수점 .']); if(P.ans&&P.ans.length>1) ex.push(['next','다음 칸 ▶']);
  return `<div class="keypad cx-pad">${[7,8,9,4,5,6,1,2,3].map(k=>`<button class="key" data-act="cxKey" data-v="${k}">${k}</button>`).join('')}
    <button class="key fn" data-act="cxKey" data-v="del">⌫ 지우기</button><button class="key" data-act="cxKey" data-v="0">0</button><button class="key ok" data-act="cxKey" data-v="ok">확인</button>
    ${ex.map(([v,l])=>`<button class="key fn ${ex.length===1?'wide':''}" data-act="cxKey" data-v="${v}">${l}</button>`).join('')}</div>`;
}
let CX=null;
function cxLv(){ if(App.clv===undefined) App.clv=store.get('clv_e5',0); if(!CALC_LEVELS[App.clv]) App.clv=0; return CALC_LEVELS[App.clv]; }
function cxNew(){
  const lv=cxLv(), P=lv.g(App.cdan||'mix');
  if(P.v){ const {a,b,op}=P.v, ans=op==='-'?a-b:a+b; P.n=Math.max(String(a).length,String(b).length,String(ans).length); P.cells=Array(P.n).fill(''); }
  else P.in=P.ans.map(()=>'');
  return Object.assign(P,{lv:App.clv, dan:App.cdan, sel:0, wrong:0, miss:false, showHint:false, done:false, msg:''});
}
function renderCalc(){
  const lv=cxLv(), ok=store.get('cxok_e5',{});
  view.innerHTML=`<div class="seg small cx-lvs">${CALC_LEVELS.map((l,i)=>`<button class="pill ${i===App.clv?'on':''}" data-act="cxLv" data-v="${i}">${i+1}. ${l.n}${ok[i]>=20?' 🏅':ok[i]?' ✔':''}</button>`).join('')}</div>
    ${lv.subs?`<div class="seg small">${Object.entries(lv.subs).map(([k,t])=>`<button class="pill ${(App.cdan||'mix')===k?'on':''}" data-act="cxDan" data-v="${k}">${t}</button>`).join('')}</div>`:''}
    <p class="desc">${lv.d}${ok[App.clv]?` · 이 단계에서 맞힌 문제 <b>${ok[App.clv]}</b>개`:''}</p><div id="cxbody"></div>`;
  drawCalc();
}
function drawCalc(){
  const b=document.getElementById('cxbody'); if(!b) return;
  if(!CX || CX.lv!==App.clv || CX.dan!==App.cdan) CX=cxNew();
  b.innerHTML=(CX.v?cxVert(CX):cxHoriz(CX)) + (CX.done?`<button class="big-btn" data-act="cxNext">다음 문제 ▶</button>`:cxPad(CX)+skipBtn('cxKey','skip'));
}
function cxAnsTxt(P){ if(P.v){ const {a,b,op}=P.v; return String(op==='-'?a-b:a+b); } return P.lab?P.ans.map((x,i)=>`${P.lab[i]} ${x}`).join(', '):P.ans.join(', '); }
function cxKey(v){
  const P=CX; if(!P||P.done) return;
  const lvName=CALC_LEVELS[P.lv].n;
  if(v==='skip'){
    P.done=true; logToday('math', false, lvName);
    if(P.v){ const s=cxAnsTxt(P); P.cells=P.cells.map((_,i)=>s[s.length-1-i]||''); } else P.in=P.ans.slice();
    P.msg=`정답은 <b>${cxAnsTxt(P)}</b> 이에요.${P.v?`<br><small>${cxVHint(P)}</small>`:P.hint?`<br><small>${P.hint}</small>`:''}`; drawCalc(); return;
  }
  if(P.v){
    if(/^\d$/.test(v)){ P.cells[P.sel]=v; if(P.sel<P.n-1) P.sel++; drawCalc(); return; }
    if(v==='del'){ if(P.cells[P.sel]===''&&P.sel>0) P.sel--; P.cells[P.sel]=''; drawCalc(); return; }
    if(v!=='ok') return;
    const hi=P.cells.slice().reverse(), f=hi.findIndex(x=>x!=='');
    if(P.cells[0]===''){ toast('일의 자리부터 써요'); return; }
    if(hi.slice(f).some(x=>x==='')){ toast('빈 칸이 있어요'); return; }
    return cxCheck(+hi.join('')===+cxAnsTxt(P));
  }
  const cur=P.in[P.sel]||'';
  if(/^\d$/.test(v)){ if(cur.length<8) P.in[P.sel]=cur+v; drawCalc(); return; }
  if(v==='.'){ if(!cur.includes('.')) P.in[P.sel]=(cur||'0')+'.'; drawCalc(); return; }
  if(v==='del'){ P.in[P.sel]=cur.slice(0,-1); drawCalc(); return; }
  if(v==='next'){ P.sel=(P.sel+1)%P.ans.length; drawCalc(); return; }
  if(v!=='ok') return;
  const empty=P.in.findIndex(x=>x===''||x==='.'); if(empty>=0){ P.sel=empty; toast(P.ans.length>1?'빈 칸을 모두 채워요':'답을 써요'); drawCalc(); return; }
  cxCheck(P.ans.every((x,i)=>Math.abs(parseFloat(P.in[i])-parseFloat(x))<1e-9));
}
function cxCheck(ok){
  const P=CX, lvName=CALC_LEVELS[P.lv].n;
  if(ok){
    P.done=true; beep(true); markO(); addStar(1); logToday('math', !P.miss, lvName); burst();
    const c=store.get('cxok_e5',{}); c[P.lv]=(c[P.lv]||0)+1; store.set('cxok_e5',c);
    P.msg=`<span class="praise">${praise()}</span>${P.hint&&P.miss?`<br><small>${P.hint}</small>`:''}`;
    drawCalc();
  } else {
    P.wrong++; P.miss=true; beep(false);
    if(P.v){ P.cells=P.cells.map(()=>''); P.sel=0; } else { P.in=P.in.map(()=>''); P.sel=0; }
    if(P.wrong>=2) P.showHint=true; else toast('다시 한번 해 봐요');
    drawCalc(); shake(P.v?'cxgrid':'cxbody');
  }
}
/* 연산 단계표 (초4) */
const cxHund = () => cxR(10,89)*10+cxR(1,9);   // 소수 둘째 자리까지 (100배 정수, 끝자리 0 아님)
/* 연산 단계표 (초5) — 쉬운 것부터: 어림하기 → 혼합 계산 → 약수 · 배수 → 약분 · 통분 → 분수 · 소수 계산 */
const gcd5 = (a,b) => b ? gcd5(b, a%b) : a;
const lcm5 = (a,b) => a/gcd5(a,b)*b;
const red5 = (n,d) => { const g=gcd5(n,d); return [n/g, d/g]; };                       // 기약분수로
const cxDec5 = (v,p) => cxTrim((v/Math.pow(10,p)).toFixed(p));                        // 10^p배 정수 → 소수 글자
const cxCop5 = d => { let n; do{ n=cxR(1,d-1); }while(gcd5(n,d)!==1); return n; };     // d와 서로소인 분자
const wa5 = n => [0,1,3,6,7,8].includes(n%10) ? "과" : "와";                         // 대분수 읽기: 1과, 2와 …
const CALC_LEVELS = [
  {n:'어림하기', d:'올림 · 버림 · 반올림 · 예: 2347을 반올림하여 백의 자리까지 → 2300', subs:{up:'올림',down:'버림',round:'반올림',mix:'섞어서'}, g:s=>{
    const m = (s==='up'||s==='down'||s==='round') ? s : cxPick(['up','down','round']);
    const [pl,u] = cxPick([['십',10],['백',100],['천',1000]]);
    let n; do{ n = u===10 ? cxR(101,2999) : cxR(1001,9999); }while(n%u===0);
    const ans = m==='up' ? Math.ceil(n/u)*u : m==='down' ? Math.floor(n/u)*u : Math.round(n/u)*u;
    const nm = {up:'올림',down:'버림',round:'반올림'}[m], dg = Math.floor((n%u)/(u/10));
    const hint = m==='up' ? `${pl}의 자리 아래 수가 0이 아니면 ${pl}의 자리를 1 올리고 아래는 0으로 → <b>${ans}</b>`
      : m==='down' ? `${pl}의 자리 아래 수를 모두 0으로 버려요 → <b>${ans}</b>`
      : `바로 아래 자리 숫자가 ${dg} → ${dg>=5?'5 이상이라 올려요':'4 이하라 버려요'} → <b>${ans}</b>`;
    return cxH(`<div class="cx-sub">${nm}하여 ${pl}의 자리까지 나타내요</div>${n} → {0}`,[ans],{hint}); }},
  {n:'자연수의 혼합 계산', d:'곱셈 · 나눗셈을 먼저, 괄호가 있으면 괄호 안을 가장 먼저 · 예: 8 + 3 × 4, (12 − 4) ÷ 2', g:()=>{
    const t=cxR(1,7); let q, ans, h;

    else if(t===4){ const c=cxR(2,9), k=cxR(2,9), a=cxR(1,30); q=`${a} + ${c*k} ÷ ${c}`; ans=a+k; h=`나눗셈 먼저: ${c*k} ÷ ${c} = ${k} → ${a} + ${k} = <b>${ans}</b>`; }
    else if(t===5){ const c=cxR(2,9), k=cxR(2,9), b=cxR(1,15), a=b+c*k; q=`(${a} − ${b}) ÷ ${c}`; ans=k; h=`괄호 먼저: ${a} − ${b} = ${c*k} → ${c*k} ÷ ${c} = <b>${ans}</b>`; }
    else if(t===6){ const c=cxR(2,6), k=cxR(2,6), a=cxR(2,9); q=`${a} × ${c*k} ÷ ${c}`; ans=a*k; h=`곱셈 · 나눗셈만 있으면 앞에서부터: ${a} × ${c*k} = ${a*c*k} → ${a*c*k} ÷ ${c} = <b>${ans}</b>`; }
    else { const a=cxR(2,9), c=cxR(1,8), b=c+cxR(1,6), e=cxR(1,20); q=`${a} × (${b} − ${c}) + ${e}`; ans=a*(b-c)+e; h=`괄호 → 곱셈 → 덧셈: ${b} − ${c} = ${b-c}, ${a} × ${b-c} = ${a*(b-c)}, ${a*(b-c)} + ${e} = <b>${ans}</b>`; }

  {n:'약수와 배수', d:'약수의 개수, 배수 찾기 · 예: 12의 약수는 1, 2, 3, 4, 6, 12 → 6개', g:()=>{

  {n:'약분 (기약분수로)', d:'분모와 분자를 최대공약수로 나누어 기약분수로 써요 · 예: 12/18 = 2/3', g:()=>{
    let q,p,k; do{ q=cxR(2,9); p=cxCop5(q); k=cxR(2,8); }while(q*k>72);

  {n:'통분', d:'두 분모의 최소공배수를 공통분모로 해서 통분해요 · 예: (1/4, 5/6) → (3/12, 10/12)', g:()=>{

      hint:`통분하면 ${A}/${L} ${add?'+':'−'} ${C}/${L} = ${N}/${L}${p!==N?` = <b>${p}/${q}</b> (약분)`:` → <b>${p}/${q}</b>`}`}); }},

    const t=cxR(1,3), o3={lab:['자연수','분자','분모'],hideLab:true};

    if(t===2){ const d=cxR(2,9), n=cxCop5(d), m=cxR(2,5), k=d*m;

    let d,n,k,p,q; do{ d=cxR(3,9); n=cxCop5(d); k=cxR(2,5); [p,q]=red5(n*k,d); }while(p<q||q===1);

  {n:'소수 × 자연수', d:'자연수처럼 곱하고 소수점을 찍어요 · 예: 1.2 × 3 = 3.6, 0.25 × 4 = 1', g:()=>{

  {n:'대분수의 덧셈 · 뺄셈', d:'분모가 다른 대분수 · 자연수끼리, 분수끼리 계산하고 답은 대분수(기약분수)로 써요 · 예: 1과 1/2 + 2와 1/3 = 3과 5/6', subs:{'+':'덧셈','-':'뺄셈',mix:'섞어서'}, g:s=>{

  {n:'소수 × 소수', d:'소수점 아래 자리 수를 더한 만큼 소수점을 찍어요 · 예: 0.3 × 0.4 = 0.12, 1.2 × 0.5 = 0.6', g:()=>{

/* 몸 전체 그림인 캐릭터는 머리 자리가 달라서 모자를 옮겨 씌워요: [가로 px, 세로 px, 기울기] (큰 방 기준) */
const HAT_FIT = { moonwolf:[0,-12,0], peacock:[-8,-2,-6], goldeagle:[-58,8,-12], kraken:[0,0,0], stardeer:[-42,-18,-12], squirrel:[-16,10,-10], koala:[0,4,0], otter:[-34,22,-14], monkey:[0,4,0], sloth:[-18,26,-10], seal:[-36,20,-16], llama:[-24,-8,-8], flamingo:[-6,-10,-10], owl:[0,8,0], hippo:[-23,49,-10], giraffe:[-30,-12,-10], elephant:[-28,6,-10], chickb:[0,8,0], sheep:[-26,10,-12], hedgehog:[-26,44,-14], whale:[-22,0,-14], octo:[0,10,0], bluefish:[-26,26,-18], phoenix:[-18,4,-10], penguin:[0,6,0], shark:[-36,30,-20], dolphin:[-30,20,-22], dino:[-24,-2,-10], dragon:[-36,4,-14], unicorn:[-8,2,-8] };
function decoGet(){
  const d=Object.assign({base:'dog', hat:null, acc:null, pet:null, bg:'plain', own:[], spent:0, at:0, wear:null}, store.get('deco',{}));
  DECO_ITEMS.forEach(x=>{ if(!x.p && !d.own.includes(x.id)) d.own.push(x.id); });
  if(!d.wear){ d.wear={}; if(d.hat||d.acc) d.wear[d.base]={hat:d.hat||null, acc:d.acc||null}; }   // 예전 기록 옮기기
  const w=d.wear[d.base]||{}; d.hat=w.hat||null; d.acc=w.acc||null;
  return d;
}
function decoSave(d){ const w=d.wear[d.base]||{}; d.hat=w.hat||null; d.acc=w.acc||null; d.at=Date.now(); store.set('deco',d); cloudPush(); drawMeTile(); }
const decoLeft = () => Math.max(0, stars + eStars() - (decoGet().spent||0));   // 쓸 수 있는 별

/* ───── 별 장부 (모든 공부방 공통) ─────
   별 · 🌈 이벤트 별 · 쓴 별은 '이 기기에서 늘어난 만큼'만 온라인에 더해요 (Firestore increment).
   예전에는 '나중에 바뀐 쪽'이 통째로 이겨서, 오래 켜 둔 기기가 작은 별 수로 온라인 별을 덮어쓸 수 있었어요.
   산 물건은 buys(무엇 · 별 · 날짜)로 남겨서 캐릭터 방 '🧾 쓴 별'에서 볼 수 있어요. */
function ledgerAdd(k, n, name){ if(n) store.set(k+'Pend', (store.get(k+'Pend',0,name)||0)+n, name); }
function ledgerBuy(x, price, name){
  const b={id:x.id, e:x.e, n:x.n, p:price, at:Date.now()};
  store.set('buys', store.get('buys',[],name).concat([b]), name);
  store.set('buysPend', store.get('buysPend',[],name).concat([b]), name);
}
/* 올리기 직전: 별 · 쓴 별을 '더하기'로 바꿔요. 올리고 나면 ledgerSent로 올린 만큼 빼요 */
function ledgerDoc(doc, name){
  const FV=firebase.firestore.FieldValue, lg={stars:store.get('starsPend',0,name)||0, estars:store.get('estarsPend',0,name)||0, spent:store.get('spentPend',0,name)||0, buys:store.get('buysPend',[],name)};
  doc.stars=FV.increment(lg.stars);
  if('estars' in doc) doc.estars=FV.increment(lg.estars);
  const deco=Object.assign({}, doc.deco||{}); delete deco.spent;
  if(lg.spent) deco.spent=FV.increment(lg.spent);
  if(Array.isArray(deco.own)){ if(deco.own.length) deco.own=FV.arrayUnion(...deco.own); else delete deco.own; }
  doc.deco=deco;
  if(lg.buys.length) doc.buys=FV.arrayUnion(...lg.buys);
  return lg;
}
function ledgerSent(lg, name){
  ['stars','estars','spent'].forEach(k=>store.set(k+'Pend', (store.get(k+'Pend',0,name)||0)-lg[k], name));
  const sent=new Set(lg.buys.map(b=>b.at+':'+b.id));
  store.set('buysPend', store.get('buysPend',[],name).filter(b=>!sent.has(b.at+':'+b.id)), name);
}
/* 온라인 값 + 이 기기에서 아직 못 올린 만큼 = 이 기기에 보이는 별 */
function ledgerApply(d, name){
  if(!d) return;
  if(typeof d.stars==='number'){ store.set('stars', d.stars+(store.get('starsPend',0,name)||0), name); if(d.starsAt) store.set('starsAt', d.starsAt, name); }
  if(typeof d.estars==='number'){ store.set('estars', d.estars+(store.get('estarsPend',0,name)||0), name); if(d.estarsAt) store.set('estarsAt', d.estarsAt, name); }
  if(typeof d.stk==='number' && typeof stkCount==='function' && d.stk>stkCount(name)) store.set('stk', d.stk, name);
  const L=store.get('deco',{},name), C=d.deco;
  if(C){
    const out=Object.assign({}, (C.at||0)>(L.at||0) ? C : L);
    out.own=[...new Set([...(L.own||[]), ...(C.own||[])])];
    out.spent=typeof C.spent==='number' ? C.spent+(store.get('spentPend',0,name)||0) : (L.spent||0);
    store.set('deco', out, name);
  }
  if(Array.isArray(d.buys)){ const m=new Map(); store.get('buys',[],name).concat(d.buys).forEach(b=>m.set(b.at+':'+b.id, b)); store.set('buys', [...m.values()].sort((a,b)=>a.at-b.at), name); }
  if(name===undefined || name===who){ stars=store.get('stars',0,name); updateStars(); }
}

const decoWearer = (d,id) => Object.keys(d.wear).find(b=>d.wear[b] && (d.wear[b].hat===id || d.wear[b].acc===id)) || null;
function decoWear(d, base, k, id){
  let moved=null;
  if(id){ const prev=decoWearer(d,id); if(prev && prev!==base){ d.wear[prev][k]=null; moved=prev; } }
  d.wear[base]=Object.assign({hat:null, acc:null}, d.wear[base]||{}); d.wear[base][k]=id||null;
  return moved;
}
function decoChar(d, baseId){
  const base=decoItem(baseId)||decoItem('dog'), w=d.wear[baseId]||{}, hat=w.hat&&decoItem(w.hat), acc=w.acc&&decoItem(w.acc), f=HAT_FIT[baseId]||[0,0,0];
  /* 모자 · 소품은 캐릭터 그림(me-fig) 크기에 맞춰 em으로 놓아요 → 아이폰 · 안드로이드 · 윈도우에서 이모지 크기가 달라도 그림에 붙어 있어요 */

    else moved=decoWear(d, d.base, x.k, (d.wear[d.base]||{})[x.k]===id ? null : id);   // 한 번 더 누르면 벗어요
    App.decoPick=null; decoSave(d); renderMyRoom();
    if(moved) toast(`${decoItem(moved).e} ${decoItem(moved).n}에게서 가져왔어요`);
    return;
  }
  App.decoPick=App.decoPick===id?null:id; renderMyRoom();
}
function decoBuy(id){
  const d=decoGet(), x=decoItem(id); if(!x || d.own.includes(id)) return;
  const price=decoPrice(x);
  if(decoLeft()<price){ toast('별이 조금 모자라요'); return; }
  d.spent=(d.spent||0)+price; d.own.push(id); ledgerAdd('spent',price); ledgerBuy(x,price);
  if(x.k==='hat'||x.k==='acc') decoWear(d, d.base, x.k, id); else d[x.k]=id;
  App.decoPick=null; decoSave(d);
  beep(true); burst();
  toast(x.k==='base' ? `🎉 ${x.e} ${x.n} 캐릭터가 생겼어요! 캐릭터 모음에 들어갔어요` : x.k==='bg' ? `${x.e} ${x.n}${josa(x.n,'으로','로').slice(x.n.length)} 방을 꾸몄어요` : `${x.e} ${x.n}${josa(x.n,'을','를').slice(x.n.length)} 샀어요! 사물함에도 들어갔어요`);
  renderMyRoom();
}
function decoGive(v){
  const d=decoGet(), P=decoItem(App.lockPick); if(!P) return;
  if(P.k==='pet') d.pet = v==='room' ? P.id : (d.pet===P.id ? null : d.pet);
  else if(v){ const moved=decoWear(d, v, P.k, P.id); if(moved) toast(`${decoItem(moved).e}에게서 가져왔어요`); }
  else { const cur=decoWearer(d,P.id); if(cur) decoWear(d, cur, P.k, null); toast('🗄️ 사물함에 넣었어요'); }
  App.lockPick=null; decoSave(d); renderMyRoom();
}


/* ───── 책 읽기 모드: 문단을 차례로 읽어 주고, 읽는 문단을 색칠하고 화면이 따라가요 (명작 도서관 · 한국사 이야기책) ───── */
let RD=null; // {sel, texts, i, tok, paused}
function readStart(sel, texts, from=0){
  readStop();
  if(!('speechSynthesis' in window)){ toast('이 기기는 읽어 주기를 할 수 없어요'); return; }
  RD={sel, texts, i:from, tok:Math.random(), paused:false}; readStep();
}
function readStep(){
  const R=RD; if(!R) return;
  const els=document.querySelectorAll(R.sel);
  if(!els.length){ readStop(); return; }                         // 다른 화면으로 갔어요
  els.forEach((e,k)=>e.classList.toggle('reading',k===R.i));
  if(R.i>=R.texts.length){ readStop(); toast('📖 끝까지 다 읽었어요!'); return; }
  const el=els[R.i]; if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(R.texts[R.i].replace(/<[^>]+>/g,'')); u.lang='ko-KR'; u.rate=0.9; if(koVoice) u.voice=koVoice;
  const tok=R.tok; u.onend=()=>{ if(RD && RD.tok===tok && !RD.paused){ RD.i++; readStep(); } };
  speechSynthesis.speak(u); readBar();
}
function readPause(){ if(!RD) return; if(RD.paused){ RD.paused=false; RD.tok=Math.random(); readStep(); } else { RD.paused=true; RD.tok=0; try{ speechSynthesis.cancel(); }catch(e){} readBar(); } }
function readStop(){ RD=null; try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.reading').forEach(e=>e.classList.remove('reading')); readBar(); }
function readBar(){
  let f=document.getElementById('rdfloat');
  if(!RD){ if(f) f.remove(); return; }
  if(!f){ f=document.createElement('div'); f.id='rdfloat'; f.className='rd-float'; document.body.appendChild(f); }
  f.innerHTML=`<span>📖 ${Math.min(RD.i+1,RD.texts.length)} / ${RD.texts.length}</span><button class="pill on" data-act="rdPause">${RD.paused?'▶ 이어 읽기':'⏸ 멈춤'}</button><button class="pill" data-act="rdStop">■ 그만</button>`;
}
const readBtn = k => `<div class="rd-start"><button class="pill on" data-act="rdStart" data-k="${k}">📖 책 읽기 모드 · 처음부터 읽어 주기</button></div>`;
