    qs:[['사람이 태어나면서부터 누리는 기본적인 권리는?','인권',['특권','재산','명예'],'누구나 차별 없이 누려요.'],['어린이날을 만들고 어린이 인권을 위해 노력한 사람은?','방정환',['허균','전태일','세종대왕'],'“어린이”라는 말을 널리 알렸어요.'],['홍길동전을 써서 신분 차별을 비판한 사람은?','허균',['방정환','전태일','정약용'],'서자 차별을 비판했어요.'],['나라의 최고 법은?','헌법',['도로 교통법','조례','학교 규칙'],'모든 법은 헌법에 어긋나면 안 돼요.'],['선거에서 투표하거나 공무원이 될 수 있는 권리는?','참정권',['자유권','평등권','청구권'],'나라의 일에 참여할 권리예요.'],['성별, 종교, 신분 때문에 차별받지 않을 권리는?','평등권',['참정권','청구권','사회권'],'법 앞에서 모두 평등해요.'],['헌법에 나온 국민의 의무가 아닌 것은?','취미 활동의 의무',['국방의 의무','납세의 의무','교육의 의무'],'취미 활동은 의무가 아니에요.'],['헌법을 고칠 때 반드시 거쳐야 하는 것은?','국민 투표',['대통령 혼자 결정','시장의 허락','학교 회의'],'국민이 직접 결정해요.'],['법의 역할로 알맞은 것은?','사회 질서를 지키고 개인의 권리를 보호해요.',['힘센 사람만 이익을 얻게 해요.','모두 마음대로 행동하게 해요.','다툼을 늘려요.'],'법은 모두를 위한 약속이에요.'],['인권 침해를 당했을 때 도움을 요청할 수 있는 국가 기관은?','국가 인권 위원회',['소방서','우체국','기상청'],'인권을 보호하는 일을 해요.']]},
  {id:'history5a', e:'🏺', n:'옛사람들의 삶과 문화 ① 고조선~고려', cards:[
    ['고조선','**단군왕검**이 세운 우리 역사 최초의 국가예요. **8조법**으로 사회 질서를 지켰고, 대표 유물로 **고인돌, 비파형 동검**이 있어요.'],
    ['삼국과 남북국','**고구려 · 백제 · 신라**가 경쟁했어요. 고구려 **광개토대왕**은 영토를 크게 넓혔어요. **신라**는 당과 연합해 백제와 고구려를 무너뜨리고 당을 몰아내 **삼국을 통일**했어요(676). 북쪽에서는 **대조영**이 고구려를 이어 **발해**를 세웠어요. 신라는 **불국사와 석굴암**을 남겼어요.'],
    ['고려','**왕건**이 고려를 세우고 후삼국을 통일했어요. 거란이 쳐들어오자 **서희**는 외교 담판으로 강동 6주를 얻고, **강감찬**은 귀주 대첩에서 크게 이겼어요. 몽골 침입 때는 **팔만대장경**을 만들었어요. **고려청자**와 현재 남아 있는 가장 오래된 금속 활자 책 **직지심체요절**이 유명해요.']],
    qs:[['우리 역사 최초의 국가는?','고조선',['고구려','신라','고려'],'단군왕검이 세웠어요.'],['고조선을 세운 사람은?','단군왕검',['주몽','박혁거세','왕건'],'우리 민족의 시조로 여겨요.'],['고조선 시대의 대표적인 무덤은?','고인돌',['석굴암','첨성대','다보탑'],'지배자의 힘을 보여 줘요.'],['광개토대왕이 영토를 크게 넓힌 나라는?','고구려',['백제','신라','가야'],'만주까지 영토를 넓혔어요.'],['삼국을 통일한 나라는?','신라',['고구려','백제','가야'],'676년에 삼국 통일을 이루었어요.'],['대조영이 고구려를 이어 세운 나라는?','발해',['고려','후백제','가야'],'해동성국이라 불렸어요.'],['통일 신라 때 만들어진 불교 문화유산은?','불국사와 석굴암',['팔만대장경','경복궁','수원 화성'],'경주에 있는 세계 문화유산이에요.'],['고려를 세운 사람은?','왕건',['이성계','견훤','궁예'],'918년에 고려를 세웠어요.'],['거란 침입 때 외교 담판으로 강동 6주를 얻은 사람은?','서희',['강감찬','을지문덕','이순신'],'말로 나라를 지켰어요.'],['몽골의 침입을 부처의 힘으로 물리치려고 만든 것은?','팔만대장경',['직지심체요절','훈민정음','동의보감'],'해인사에 보관되어 있어요.']]},
  {id:'history5b', e:'👑', n:'옛사람들의 삶과 문화 ② 조선', cards:[
    ['조선의 건국','**이성계**가 1392년에 조선을 세우고 도읍을 **한양**으로 옮겼어요. **경복궁**을 짓고, **유교(성리학)**를 바탕으로 나라를 다스렸어요.'],
    ['세종 대의 발전','**세종대왕**은 백성이 쉽게 글을 익히도록 **훈민정음**을 만들었어요. 장영실 등과 함께 비의 양을 재는 **측우기**, 해시계 **앙부일구**, 물시계 **자격루**를 만들어 과학과 농업을 발전시켰어요.'],
    ['나라를 지킨 사람들','**임진왜란**(1592) 때 **이순신**은 거북선으로 바다에서 이겼고, 백성들은 **의병**으로 싸웠으며 권율은 행주 대첩에서 승리했어요. **병자호란**(1636) 때는 청이 쳐들어와 인조가 **남한산성**에서 맞서 싸웠지만 결국 항복했어요.']],
    qs:[['조선을 세운 사람은?','이성계',['왕건','정약용','세종대왕'],'1392년에 조선을 세웠어요.'],['조선의 도읍은?','한양',['개경','경주','평양'],'지금의 서울이에요.'],['조선이 나라를 다스리는 바탕으로 삼은 사상은?','유교(성리학)',['불교','도교','천주교'],'충과 효를 중요하게 여겼어요.'],['훈민정음을 만든 왕은?','세종대왕',['태조','정조','영조'],'백성을 위해 만든 글자예요.'],['비가 내린 양을 재는 기구는?','측우기',['앙부일구','자격루','혼천의'],'농사에 큰 도움이 되었어요.'],['해의 그림자로 시각을 알려 주는 해시계는?','앙부일구',['측우기','자격루','거중기'],'솥 모양의 해시계예요.'],['임진왜란 때 거북선을 이끌고 바다에서 크게 이긴 장군은?','이순신',['강감찬','권율','을지문덕'],'한산도 대첩이 유명해요.'],['임진왜란 때 백성들이 스스로 일어나 만든 군대는?','의병',['삼별초','별무반','관군'],'곽재우 등이 의병을 이끌었어요.'],['1636년 청이 조선에 쳐들어온 전쟁은?','병자호란',['임진왜란','귀주 대첩','살수 대첩'],'인조가 남한산성으로 피란했어요.'],['병자호란 때 인조가 피란하여 맞서 싸운 곳은?','남한산성',['수원 화성','행주산성','경복궁'],'47일 동안 버텼어요.']]},
  {id:'modern5', e:'🇰🇷', n:'사회의 새로운 변화와 오늘날의 우리', cards:[
    ['조선 후기의 변화','영조와 정조는 **탕평책**으로 정치를 안정시켰고, 정조는 **수원 화성**을 쌓았어요. **정약용**은 거중기를 설계했어요. 백성의 삶을 개선하려는 **실학**이 생겼고 한글 소설 · 판소리 · 탈놀이 등 **서민 문화**가 발달했어요. 1876년 일본과 **강화도 조약**을 맺으며 개항했어요.'],
    ['일제 강점기와 독립운동','1910년 일본에 나라를 빼앗겼어요. 1919년 **3·1 운동**이 일어났고, 같은 해 상하이에 **대한민국 임시 정부**가 세워졌어요. **안중근**은 하얼빈에서 이토 히로부미를 처단했고, **홍범도 · 김좌진**은 봉오동 · 청산리에서 일본군을 물리쳤어요.'],
    ['광복과 오늘날의 우리','**1945년 8월 15일 광복** 후 **1948년 대한민국 정부가 수립**되었어요. **1950년 6·25 전쟁**이 일어나 1953년 정전 협정을 맺었어요. 이후 **4·19 혁명(1960), 5·18 민주화 운동(1980), 6월 민주 항쟁(1987)**으로 민주주의가 발전했어요.']],
    qs:[['정조가 쌓은 성으로 거중기를 이용해 지은 곳은?','수원 화성',['남한산성','경복궁','행주산성'],'세계 문화유산이에요.'],['거중기를 설계한 실학자는?','정약용',['박지원','김홍도','장영실'],'목민심서도 썼어요.'],['1876년 조선이 일본과 맺은 불평등 조약은?','강화도 조약',['을사늑약','정전 협정','남북 기본 합의서'],'이 조약으로 항구를 열었어요.'],['1919년 전국에서 일어난 만세 운동은?','3·1 운동',['4·19 혁명','6월 민주 항쟁','5·18 민주화 운동'],'독립 선언서를 발표했어요.'],['1919년 중국 상하이에 세워진 독립운동 기관은?','대한민국 임시 정부',['조선 총독부','집현전','국회'],'독립운동을 이끌었어요.'],['하얼빈에서 이토 히로부미를 처단한 독립운동가는?','안중근',['김구','유관순','윤봉길'],'1909년의 일이에요.'],['청산리 대첩에서 일본군을 크게 물리친 독립군 지도자는?','김좌진',['안중근','이순신','정약용'],'1920년의 승리예요.'],['우리나라가 광복을 맞은 날은?','1945년 8월 15일',['1919년 3월 1일','1950년 6월 25일','1948년 7월 17일'],'일본으로부터 나라를 되찾았어요.'],['대한민국 정부가 수립된 해는?','1948년',['1945년','1950년','1960년'],'광복 3년 뒤예요.'],['6·25 전쟁이 일어난 해는?','1950년',['1945년','1948년','1953년'],'1953년에 정전 협정을 맺었어요.']]}

const CS_SCI_E5 = [
  {id:'heat5', e:'🌡️', n:'온도와 열', cards:[
    ['온도','물체의 차갑고 따뜻한 정도를 숫자로 나타낸 것이 **온도**예요. 단위는 **℃(섭씨도)**를 써요. 기온은 **알코올 온도계**, 물체 표면의 온도는 **적외선 온도계**로 재요.'],
    ['열의 이동과 전도','온도가 다른 두 물체가 닿으면 열은 **온도가 높은 곳에서 낮은 곳으로** 이동해 결국 온도가 같아져요. 고체에서 열이 이동하는 방법은 **전도**예요. **금속(구리 등)**은 열이 빨리 이동하고, 나무 · 플라스틱은 느려요.'],
    ['대류와 단열','액체와 기체에서는 데워진 물질이 **위로 올라가고** 차가운 물질이 아래로 내려오며 열이 이동해요. 이것이 **대류**예요. 그래서 난방기는 **낮은 곳**, 에어컨은 **높은 곳**에 설치해요. 열의 이동을 막는 것을 **단열**이라고 해요.']],
    qs:[['온도의 단위는?','℃(섭씨도)',['kg','cm','mL'],'섭씨도라고 읽어요.'],['따뜻한 물과 차가운 물이 닿으면 열은 어떻게 이동하나요?','온도가 높은 물에서 낮은 물로',['온도가 낮은 물에서 높은 물로','이동하지 않아요.','번갈아 가며 이동해요.'],'결국 두 물의 온도가 같아져요.'],['고체에서 열이 이동하는 방법은?','전도',['대류','증발','응결'],'고체를 따라 열이 이동해요.'],['같은 두께일 때 열이 가장 빠르게 이동하는 것은?','구리판',['나무판','플라스틱판','유리판'],'금속은 열이 빨리 이동해요.'],['물을 데울 때 따뜻해진 물이 위로 올라가며 열이 이동하는 방법은?','대류',['전도','단열','응결'],'액체와 기체에서 일어나요.'],['난방기를 방의 낮은 곳에 설치하는 까닭은?','데워진 공기가 위로 올라가 방 전체가 따뜻해지므로',['차가운 공기가 위로 올라가서','공기가 움직이지 않아서','바닥만 데우기 위해서'],'대류를 이용해요.'],['에어컨을 높은 곳에 설치하는 까닭은?','차가운 공기가 아래로 내려오기 때문에',['차가운 공기가 위로 올라가서','따뜻한 공기가 아래로 내려와서','보기 좋아서'],'차가운 공기는 아래로 내려와요.'],['두 물체 사이에서 열의 이동을 막는 것은?','단열',['전도','대류','증발'],'보온병, 이중창에 이용해요.'],['물체 표면의 온도를 닿지 않고 잴 수 있는 온도계는?','적외선 온도계',['알코올 온도계','저울','자'],'버튼을 눌러 바로 재요.'],['프라이팬 손잡이를 나무나 플라스틱으로 만드는 까닭은?','열이 잘 이동하지 않아서',['열이 잘 이동해서','무거워서','녹이 잘 슬어서'],'손이 뜨겁지 않게 해요.']]},
  {id:'solar5', e:'🪐', n:'태양계와 별', cards:[
    ['태양','**태양**은 스스로 빛을 내는 **별**이에요. 태양의 빛과 열 덕분에 식물이 양분을 만들고, 물이 순환하고, 생물이 살아갈 수 있어요.'],
    ['태양계의 행성','태양과 그 주위를 도는 천체를 **태양계**라고 해요. 행성은 태양에서 가까운 순서로 **수성 · 금성 · 지구 · 화성 · 목성 · 토성 · 천왕성 · 해왕성**이에요. 가장 큰 행성은 **목성**, 가장 작은 행성은 **수성**이에요.'],
    ['별과 별자리','별은 스스로 빛을 내지만 행성은 **태양 빛을 반사**해서 밝게 보여요. 별 무리를 이어 이름 붙인 것이 **별자리**예요. 북쪽 하늘의 **북두칠성과 카시오페이아자리**로 **북극성**을 찾으면 북쪽 방향을 알 수 있어요.']],
    qs:[['태양계에서 스스로 빛을 내는 천체는?','태양',['지구','달','목성'],'태양은 별이에요.'],['태양에서 가장 가까운 행성은?','수성',['금성','지구','해왕성'],'수성 다음은 금성이에요.'],['태양계에서 가장 큰 행성은?','목성',['토성','지구','해왕성'],'지구보다 훨씬 커요.'],['태양계에서 가장 작은 행성은?','수성',['화성','금성','지구'],'달보다 조금 커요.'],['지구 바로 바깥쪽에서 태양 주위를 도는 행성은?','화성',['금성','목성','수성'],'붉은색으로 보여요.'],['태양에서 가까운 순서로 바르게 나열한 것은?','수성 → 금성 → 지구 → 화성',['금성 → 수성 → 지구 → 화성','수성 → 지구 → 금성 → 화성','수성 → 금성 → 화성 → 지구'],'수 · 금 · 지 · 화 · 목 · 토 · 천 · 해!'],['아름다운 고리가 뚜렷하게 보이는 행성은?','토성',['수성','화성','금성'],'얼음과 암석 조각으로 된 고리예요.'],['북쪽 하늘에서 거의 움직이지 않아 북쪽 방향을 알려 주는 별은?','북극성',['직녀성','견우성','시리우스'],'길을 잃었을 때 도움이 돼요.'],['북극성을 찾을 때 이용하는 별자리는?','북두칠성과 카시오페이아자리',['오리온자리와 전갈자리','백조자리와 거문고자리','사자자리와 처녀자리'],'둘 다 북쪽 하늘에 있어요.'],['별과 행성의 차이로 알맞은 것은?','별은 스스로 빛을 내고, 행성은 태양 빛을 반사해요.',['행성만 스스로 빛을 내요.','둘 다 스스로 빛을 내요.','둘 다 빛을 내지 않아요.'],'행성은 반사된 빛으로 보여요.']]},
  {id:'solution5', e:'🧂', n:'용해와 용액', cards:[
    ['용해와 용액','설탕이 물에 녹는 것처럼 물질이 다른 물질에 녹아 고르게 섞이는 현상을 **용해**라고 해요. 녹는 물질은 **용질**(설탕), 녹이는 물질은 **용매**(물), 녹아 섞인 물질은 **용액**(설탕물)이에요. 용액은 오래 두어도 **가라앉거나 뜨는 것이 없어요**.'],
    ['녹기 전과 후의 무게','물질이 녹으면 눈에 보이지 않을 뿐 **없어지지 않아요**. 그래서 **용질의 무게 + 용매의 무게 = 용액의 무게**예요. 같은 온도, 같은 양의 물이라도 **용질의 종류에 따라 녹는 양이 달라요**. 물의 온도가 **높을수록** 백반 같은 용질이 더 많이 녹아요.'],
    ['용액의 진하기','같은 양의 용매에 용질이 많이 녹을수록 **진한 용액**이에요. 색깔이 있으면 **색이 진할수록**, 맛을 보면 **맛이 진할수록** 진해요. 진한 용액일수록 메추리알이나 방울토마토 같은 물체가 **더 높이 떠올라요**.']],
    qs:[['설탕이 물에 녹아 고르게 섞이는 현상은?','용해',['응결','증발','연소'],'녹아서 골고루 섞여요.'],['설탕물에서 설탕처럼 녹는 물질은?','용질',['용매','용액','용기'],'녹는 물질이 용질이에요.'],['설탕물에서 물처럼 다른 물질을 녹이는 물질은?','용매',['용질','용액','용해'],'녹이는 물질이 용매예요.'],['물 100 g에 설탕 10 g을 모두 녹이면 설탕물의 무게는?','110 g',['100 g','90 g','10 g'],'녹아도 설탕은 없어지지 않아요.'],['다음 중 용액이 아닌 것은?','흙탕물',['설탕물','소금물','식초'],'흙탕물은 시간이 지나면 흙이 가라앉아요.'],['같은 온도, 같은 양의 물에 소금 · 설탕 · 베이킹 소다가 녹는 양은?','용질의 종류에 따라 달라요.',['모두 같아요.','끝없이 녹아요.','하나도 녹지 않아요.'],'용질마다 녹는 양이 달라요.'],['백반을 물에 더 많이 녹이는 방법은?','물의 온도를 높여요.',['물을 차갑게 해요.','얼음을 넣어요.','물을 덜어 내요.'],'온도가 높을수록 많이 녹아요.'],['백반을 많이 녹인 따뜻한 용액을 차갑게 하면?','백반 알갱이가 다시 생겨요.',['백반이 더 많이 녹아요.','아무 변화가 없어요.','물이 모두 사라져요.'],'낮은 온도에서는 녹을 수 있는 양이 줄어요.'],['진한 설탕물과 묽은 설탕물에 방울토마토를 넣으면?','진한 설탕물에서 더 높이 떠올라요.',['묽은 설탕물에서 더 높이 떠올라요.','둘 다 똑같이 떠올라요.','진한 설탕물에서 녹아 없어져요.'],'진할수록 물체가 높이 떠요.'],['색깔이 있는 용액의 진하기를 비교하는 방법으로 알맞은 것은?','색이 진할수록 진한 용액이에요.',['색이 옅을수록 진한 용액이에요.','색과 진하기는 관계없어요.','투명할수록 진한 용액이에요.'],'눈으로 쉽게 비교할 수 있어요.']]},
  {id:'microbe5', e:'🍄', n:'다양한 생물과 우리 생활', cards:[
    ['균류','**곰팡이와 버섯**은 **균류**예요. 가는 실 같은 **균사**로 되어 있고 **포자**로 번식해요. 스스로 양분을 만들지 못해 다른 생물이나 죽은 생물에서 양분을 얻어요. **따뜻하고 축축한 곳**에서 잘 자라요.'],
    ['원생생물과 세균','**짚신벌레 · 해캄 · 아메바 · 유글레나**처럼 동물, 식물, 균류로 분류되지 않고 생김새가 단순한 생물을 **원생생물**이라고 해요. **세균**은 아주 작아 **현미경**으로 봐야 하고, 공 · 막대 · 나선 모양 등이 있으며 어디에나 살고 빠르게 번식해요.'],
    ['우리 생활에 주는 영향','**이로운 점**: 된장 · 김치 · 요구르트를 만들고, 죽은 생물을 **분해**해 환경을 깨끗이 하며, 푸른곰팡이로 **페니실린**을 만들어요. **해로운 점**: 음식을 상하게 하고 **질병**을 일으키며, 원생생물이 너무 많이 번식하면 **적조**가 생겨요.']],
    qs:[['곰팡이와 버섯이 속하는 생물 무리는?','균류',['원생생물','세균','식물'],'균사로 이루어져 있어요.'],['균류가 번식하는 방법은?','포자로 번식해요.',['씨로 번식해요.','알을 낳아요.','꽃가루로 번식해요.'],'포자가 퍼져 새로 자라요.'],['짚신벌레와 해캄이 속하는 생물 무리는?','원생생물',['균류','세균','동물'],'생김새가 단순해요.'],['세균의 특징으로 알맞은 것은?','매우 작아서 현미경으로 관찰해요.',['눈으로 크게 보여요.','꽃이 피어요.','뿌리와 잎이 있어요.'],'아주 작은 생물이에요.'],['곰팡이가 잘 자라는 환경은?','따뜻하고 축축한 곳',['차갑고 건조한 곳','뜨거운 사막','얼음 속'],'습한 여름에 곰팡이가 많이 생겨요.'],['푸른곰팡이를 이용해 만든 약은?','페니실린',['아스피린','소화제','비타민'],'세균을 없애는 약이에요.'],['김치와 요구르트를 만드는 데 이용하는 생물은?','세균(유산균)',['해캄','짚신벌레','아메바'],'발효를 일으켜요.'],['균류와 세균이 우리에게 주는 해로운 영향은?','음식을 상하게 하거나 질병을 일으켜요.',['된장을 만들어요.','죽은 생물을 분해해요.','약을 만들어요.'],'이로운 점과 해로운 점이 모두 있어요.'],['균류와 세균이 없다면 생길 일로 알맞은 것은?','죽은 생물과 배설물이 분해되지 않고 쌓여요.',['아무 변화가 없어요.','공기가 더 깨끗해져요.','쓰레기가 더 빨리 사라져요.'],'분해자 역할을 하기 때문이에요.'],['원생생물이 바다에서 너무 많이 번식해 물빛이 붉게 변하는 현상은?','적조',['황사','태풍','가뭄'],'물고기가 죽는 피해가 생겨요.']]},
  {id:'eco5', e:'🌱', n:'생물과 환경', cards:[
    ['생태계','어떤 장소에서 서로 영향을 주고받는 **생물 요소**와 **비생물 요소**(햇빛 · 물 · 온도 · 흙 · 공기)를 합쳐 **생태계**라고 해요. 생물은 양분을 얻는 방법에 따라 **생산자**(식물), **소비자**(동물), **분해자**(곰팡이 · 세균)로 나눠요.'],
    ['먹이 관계와 생태계 평형','먹고 먹히는 관계가 사슬처럼 이어진 것을 **먹이 사슬**, 여러 먹이 사슬이 그물처럼 얽힌 것을 **먹이 그물**이라고 해요. 생물의 종류와 수가 균형을 이루는 상태를 **생태계 평형**이라고 하며, 한 생물이 갑자기 늘거나 줄면 평형이 깨져요.'],
    ['환경과 적응','햇빛이 없으면 콩나물 떡잎이 **노랗게** 자라요. 생물이 환경에 맞게 살아남기 좋은 특징을 갖는 것을 **적응**이라고 해요. 사막여우는 **큰 귀**로 열을 내보내고, 북극여우는 **작은 귀**로 열을 덜 빼앗겨요. 환경 오염은 생태계를 해치므로 함께 보전해야 해요.']],
    qs:[['햇빛을 받아 스스로 양분을 만드는 생물은?','생산자',['소비자','분해자','비생물 요소'],'식물이 대표적이에요.'],['죽은 생물과 배설물을 분해하는 생물은?','분해자',['생산자','소비자','비생물 요소'],'곰팡이와 세균이 해당해요.'],['다음 중 비생물 요소는?','햇빛',['토끼','곰팡이','벼'],'살아 있지 않은 환경 요소예요.'],['생물의 먹고 먹히는 관계가 사슬처럼 한 줄로 이어진 것은?','먹이 사슬',['먹이 그물','생태계 평형','적응'],'벼 → 메뚜기 → 개구리 → 뱀처럼 이어져요.'],['여러 먹이 사슬이 그물처럼 얽힌 것은?','먹이 그물',['먹이 사슬','생산자','분해자'],'한 종류가 사라져도 다른 먹이를 먹을 수 있어요.'],['생태계에서 생물의 종류와 수가 균형을 이루는 상태는?','생태계 평형',['환경 오염','먹이 사슬','적응'],'한쪽이 무너지면 평형이 깨져요.'],['사막여우의 큰 귀가 사막 생활에 좋은 까닭은?','몸의 열을 잘 내보낼 수 있어서',['추위를 잘 막아서','물을 저장해서','먹이를 저장해서'],'더운 곳에 적응한 모습이에요.'],['생물이 환경에 맞게 살아남기 좋은 특징을 갖게 되는 것은?','적응',['오염','분해','용해'],'선인장의 가시 잎도 적응의 예예요.'],['햇빛을 받지 못하고 자란 콩나물 떡잎의 색은?','노란색',['초록색','파란색','붉은색'],'햇빛을 받으면 초록색으로 변해요.'],['생태계를 보전하는 노력으로 알맞은 것은?','쓰레기를 줄이고 분리배출해요.',['나무를 마구 베어요.','공장 폐수를 강에 버려요.','일회용품을 많이 써요.'],'작은 실천이 생태계를 지켜요.']]},
  {id:'weather5', e:'☁️', n:'날씨와 우리 생활', cards:[
    ['습도','공기 중에 수증기가 포함된 정도를 **습도**라고 하고 **건습구 습도계**로 재요. 습도가 높으면 음식이 쉽게 상하고 **곰팡이**가 잘 생기며, 습도가 낮으면 피부가 건조하고 **산불**이 나기 쉬워요.'],
    ['이슬 · 안개 · 구름 · 비 · 눈','수증기가 차가운 물체 표면에 응결해 맺히면 **이슬**, 지표면 가까이에서 응결해 떠 있으면 **안개**, 공기가 높이 올라가 식어 응결하면 **구름**이에요. 구름 속 물방울이 커져 떨어지면 **비**, 얼음 알갱이가 녹지 않고 떨어지면 **눈**이에요.'],
    ['기압과 바람','같은 부피에서 차가운 공기는 무거워 **고기압**, 따뜻한 공기는 가벼워 **저기압**이 돼요. 바람은 **고기압에서 저기압으로** 불어요. 맑은 날 낮에는 바다에서 육지로 **해풍**, 밤에는 육지에서 바다로 **육풍**이 불어요. 우리나라 겨울에는 북서쪽의 **차고 건조한** 공기, 여름에는 남동쪽의 **덥고 습한** 공기의 영향을 받아요.']],

/* 사회 · 과학 설명 카드 그림 (단원 id | 카드 번호) */
const CS_FIG = {};   /* 초5 단원 그림은 아직 없어요 */
const CS_SUBJ = { social:{tracks:[{name:'사회', sub:'초5 사회', units:CS_SOC_E5}]}, science:{tracks:[{name:'과학', sub:'초5 과학', units:CS_SCI_E5}]} };
const CS_ST = {};
let CQ=null;
const csMd = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const csUnitOf = (s,id) => CS_SUBJ[s].tracks.flatMap(t=>t.units).find(u=>u.id===id);
function csState(s){
  if(!CS_ST[s]) CS_ST[s]={tr:Math.min(+store.get('cs_tr_'+s,0)||0, CS_SUBJ[s].tracks.length-1), unit:store.get('cs_u_'+s,null), mode:'learn'};
  return CS_ST[s];
}
function renderCS(s){
  const C=CS_SUBJ[s], st=csState(s); if(!C.tracks[st.tr]) st.tr=0;
  const tr=C.tracks[st.tr]; if(!tr.units.some(u=>u.id===st.unit)) st.unit=tr.units[0].id;
  const u=tr.units.find(x=>x.id===st.unit), best=store.get('csbest',{});
  view.innerHTML=`${lvPick('csTr', st.tr, C.tracks.map((t,i)=>({v:i, name:t.name, sub:t.sub})), {k:s})}
    <div class="unitrow navy">${tr.units.map((x,i)=>{ const b=best[s+'|'+x.id]; return `<button class="pill ${x.id===st.unit?'on':''}" data-act="csUnit" data-k="${s}" data-v="${x.id}">${x.e} ${i+1}. ${x.n}${b===10?' 🏅':b!==undefined?' ✔':''}</button>`; }).join('')}</div>
    <div class="unit-h"><b>${u.e} ${esc(u.n)}</b>${modeSw('csMode', st.mode, false, s)}</div>
    <div id="csbody"></div>`;
  st.mode==='learn' ? drawCSLearn(s,u) : drawCSQuiz(s,u);
}
function drawCSLearn(s,u){
  const b=document.getElementById('csbody'); if(!b) return;
  b.innerHTML=u.cards.map(([t,x],i)=>`<div class="card lesson"><div class="ls-top"><b>${u.e} ${esc(t)}</b><button class="ls-spk" data-act="csSay" data-k="${s}" data-v="${i}" aria-label="읽어 주기">🔊</button></div><p>${csMd(x)}</p>${CS_FIG[u.id+'|'+i]?`<div class="cs-fig">${CS_FIG[u.id+'|'+i]}</div>`:''}</div>`).join('')
    + `<button class="big-btn" data-act="csMode" data-k="${s}" data-v="quiz">✏️ 이제 퀴즈 풀어 보기</button>`;
}
function drawCSQuiz(s,u){
  const b=document.getElementById('csbody'); if(!b) return;
  if(!CQ || CQ.s!==s || CQ.uid!==u.id) CQ={s, uid:u.id, i:0, score:0, tried:false, solved:false, picked:[], note:'', done:false, res:[],
    list:shuffle(u.qs).slice(0,10).map(([q,a,o,ex])=>({q, ans:a, choices:shuffle([a,...o]), explain:ex}))};
  if(CQ.done){
    b.innerHTML=`<div class="card center"><p class="sub">${u.e} ${u.n}</p><p class="big">${CQ.score===CQ.list.length?'🏆 모두 한 번에 맞혔어요!':`${CQ.list.length}문제 중 ${CQ.score}개를 한 번에 맞혔어요!`}</p>
      <p>받은 별: ⭐ ${CQ.earned}개</p><button class="big-btn" data-act="csAgain" data-k="${s}">다시 하기</button>
      <div class="center"><button class="linkbtn" data-act="csMode" data-k="${s}" data-v="learn">📖 설명 다시 보기</button></div></div>`;
    return;
  }
  const q=CQ.list[CQ.i], cls=i=>CQ.solved&&q.choices[i]===q.ans?'ok':(CQ.picked.includes(i)?'no':'');
  b.innerHTML=`<div class="card"><div class="qtop"><span>${u.e} ${u.n} · ${CQ.i+1} / ${CQ.list.length}</span><span>⭐ ${CQ.score}</span></div>
    <div class="dots">${CQ.list.map((_,i)=>`<span class="dot ${i<CQ.i?(CQ.res[i]?'ok':'no'):(i===CQ.i?'cur':'')}"></span>`).join('')}</div>
    <div class="sq ko-q">${esc(q.q)}</div>
    <div class="choices words">${q.choices.map((c,i)=>`<button class="choice ${cls(i)}" data-act="csPick" data-v="${i}"><span class="ct">${esc(c)}</span></button>`).join('')}</div>
    ${CQ.note?`<div class="hint">${CQ.note}</div>`:''}${CQ.solved?'':skipBtn('csSkip')}</div>`;
}
function csAnswer(i){
  if(!CQ||CQ.solved||CQ.done) return;
  const s=CQ.s, u=csUnitOf(s,CQ.uid), q=CQ.list[CQ.i], skip=i<0;
  const note=()=>{ if(!CQ.tried && typeof addWrong==='function') addWrong(s, u.n, {html:esc(q.q), choices:q.choices, ans:q.ans, explain:q.explain}); };
  if(!skip && q.choices[i]===q.ans){
    CQ.solved=true; CQ.res[CQ.i]=!CQ.tried; beep(true); markO(); logToday(s, !CQ.tried, u.n);
    if(!CQ.tried){ CQ.score++; addStar(1); }
    CQ.note=`<span class="praise">${praise()}</span><br><small>${esc(q.explain)}</small>`;
  } else if(!skip){
    if(CQ.picked.includes(i)) return;
    note(); CQ.tried=true; CQ.picked.push(i); beep(false); CQ.note='💡 '+esc(q.explain); drawCSQuiz(s,u); return;
  } else {
    note(); CQ.tried=true; CQ.solved=true; CQ.res[CQ.i]=false; beep(false); logToday(s, false, u.n);
    CQ.note=`정답은 <b>${esc(q.ans)}</b><br><small>${esc(q.explain)}</small>`;
  }
  drawCSQuiz(s,u);
  const me=CQ;
  setTimeout(()=>{
    if(CQ!==me) return;
    CQ.i++; CQ.tried=false; CQ.solved=false; CQ.picked=[]; CQ.note='';
    if(CQ.i>=CQ.list.length){
      CQ.done=true; const all=CQ.score===CQ.list.length; CQ.earned=CQ.score+(all?2:0); if(all) addStar(2); if(CQ.score>=8) burst();
      const B=store.get('csbest',{}), k=s+'|'+CQ.uid; B[k]=Math.max(B[k]===undefined?-1:B[k], CQ.score); store.set('csbest',B); cloudPush();
    }
    if(App.view===s && csState(s).mode==='quiz') drawCSQuiz(s,u);
  }, skip?2600:1600);
}

const hsChoices = (ans, pool, n=4) => shuffle([ans, ...shuffle([...new Set(pool)].filter(x=>x!==ans)).slice(0,n-1)]);
function qWho(it){
  const pool=hisPool().filter(x=>x.type===it.type).map(x=>x.t);
  return {id:it.t, html:`<div class="hs-qd">${it.d}</div>${it.type==='p'?'이 사람은 누구일까요?':'무엇일까요?'}`, ans:it.t, choices:hsChoices(it.t,pool), explain:`${it.e} ${it.t} (${eraName(it.era)})`};
}
function qEra(it){
  return {id:it.t, html:`<div class="hs-qe">${it.e}</div><b>${it.t}</b>${josa(it.t,'은','는').slice(it.t.length)} 어느 시대일까요?`, ans:eraName(it.era), choices:hsChoices(eraName(it.era), hisEras().map(e=>e[1])), explain:it.d};
}
function qOrder(){
  const eras=shuffle(hisEras().map(e=>e[0])).slice(0,4);
  const its=eras.map(k=>one(hisPool().filter(x=>x.era===k)));
  const first=Math.random()<0.6;
  const sorted=its.slice().sort((a,b)=>eraIdx(a.era)-eraIdx(b.era));
  const ans=(first?sorted[0]:sorted[3]).t;
  return {id:ans, html:`시대 순서를 생각해 봐요.<br><b>가장 ${first?'먼저':'나중에'}</b> 있었던 것은?`, ans, choices:shuffle(its.map(x=>x.t)),
    explain:sorted.map(x=>`${x.t}(${eraName(x.era)})`).join(' → ')};
}
const HQ_KIND = {quiz:'퀴즈', mock:'급수 연습 시험', order:'시대 순서 맞히기', wrong:'오답 다시 풀기'};
function startHQ(kind){
  let list=[];
  const P=hisPool();
  if(kind==='quiz'){
    const pool=App.hqera==='all'?P:P.filter(x=>x.era===App.hqera);
    list=shuffle(pool).slice(0,10).map(it=> App.hqera==='all' && Math.random()<0.35 ? qEra(it) : qWho(it));
    while(list.length<10) list.push(qWho(one(pool)));
  } else if(kind==='mock'){
    list=shuffle(P).slice(0,14).map(it=>Math.random()<0.7?qWho(it):qEra(it));
    for(let i=0;i<6;i++) list.push(qOrder());
    list=shuffle(list);
  } else if(kind==='order'){
    list=Array.from({length:10},qOrder);
  } else if(kind==='wrong'){
    const w=Object.keys(store.get('hwrong',{}));
    list=shuffle(HISTORY.filter(x=>w.includes(x.t))).slice(0,10).map(qWho);
    if(!list.length){ toast('오답 노트가 비어 있어요 👍'); return; }
  }
  HQ={kind, list, i:0, score:0, tried:false, solved:false, wrong:[], done:false, start:Date.now(), single:kind==='mock', lv:App.hslv};
  drawHQ();
}

function hqMiss(q){ if(!HQ.tried){ HQ.tried=true; HQ.wrong.push(q.id); hsWrongNote(q.id,true); addWrong('history', hqSub(), q); } }
function hqPick(i){

const ADMIN_EMAIL_SHA256 = '22fa372a479af0929cadcbf6b12b6c2dace34800344067ef44b21a0c187487fb';
async function sha256Hex(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const isAdminUser=async u=>{ const em=((u&&u.email)||'').trim().toLowerCase(); return !!em && await sha256Hex(em)===ADMIN_EMAIL_SHA256; };

async function admGoogleLogin(){
  if(!await cloudInit()){ toast('온라인 저장에 연결하지 못했어요'); return; }
  const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
  try{
    const r=await firebase.auth().signInWithPopup(p);
    if(await isAdminUser(r.user)){ if(setMode==='pin' && !isMom()) admEnter(); }
    else { await firebase.auth().signOut(); toast('관리자 계정이 아니에요'); }
  }catch(e){
    console.warn('로그인 실패',e);
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){ try{ await firebase.auth().signInWithRedirect(p); return; }catch(e2){ e=e2; } }
    if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request') return;
    toast(({'auth/unauthorized-domain':'이 주소가 Firebase 승인된 도메인에 없어요','auth/operation-not-allowed':'Firebase에서 구글 로그인이 꺼져 있어요','auth/too-many-requests':'여러 번 시도해서 잠시 막혔어요','auth/network-request-failed':'인터넷 연결을 확인해 주세요','auth/internal-error':'Firebase 내부 오류예요'}[e.code]||'로그인하지 못했어요')+(e.code?' ('+e.code+')':''));
  }
}

  if(e.key==='Escape'){ const o=document.getElementById('admPop'); if(o && !o.hidden){ o.hidden=true; return; } }
  lastAct=Date.now();
  if(!document.getElementById('login').hidden){
    if(LP){ if(/^[0-9]$/.test(e.key)) lpinKey(e.key); else if(e.key==='Backspace') lpinKey('del'); return; }
    if(e.key==='Enter' && e.target.id==='newWho') addWho(); return;
  }
  if(e.target.tagName==='INPUT'){ if(e.key==='Enter' && (e.target.id==='admEm'||e.target.id==='admPw')){ ACT.admLogin(); return; } if(e.key==='Enter' && (e.target.id==='bkT'||e.target.id==='bkL')) ACT.addBook(); return; }
  let fn=null;
  if(!document.getElementById('settings').hidden){ if(setMode==='pin') fn=pinKey; }
  else if(App.view==='school' && App.smode==='quiz') fn=sKey;
  if(!fn) return;
  if(/^[0-9]$/.test(e.key)) fn(e.key);
  else if(e.key==='.' && fn===sKey) fn('.');
  else if(e.key==='Backspace') fn('del');
  else if(e.key==='Enter' && fn!==pinKey){ e.preventDefault(); fn('ok'); }
});

/* ───── ◀ 뒤로 가기는 공부방 안에서만 (모든 방 공통) ─────
   주소(jsun.site/방/)는 그대로 두고 화면을 바꿀 때마다 기록을 남겨요 → 뒤로 가면 이전 화면으로.
   홈에서 뒤로 가도 다른 페이지로 나가지 않고 홈에 머물러요 (크롬은 손대기 전에 만든 기록을 건너뛰어서, 첫 손길에 지킴이를 놓아요) */
(function(){
  if(!window.history || !history.pushState) return;
  const goRaw = go; let fromPop = false, armed = false;
  const cur = () => (typeof App!=='undefined' && App.view) || 'home';
  const arm = () => { if(armed) return; armed = true; history.replaceState({room:'guard'}, ''); history.pushState({room:cur()}, ''); };
  addEventListener('pointerdown', arm, {capture:true}); addEventListener('keydown', arm, {capture:true});
  go = function(v){ const before = cur(); goRaw.apply(this, arguments); if(!fromPop && armed && cur()!==before) history.pushState({room:cur()}, ''); };
  addEventListener('popstate', e => {
    const s = e.state;
    if(!s || s.room==='guard'){   // 처음 들어온 자리보다 더 뒤로: 나가지 않고 홈으로
      history.pushState({room:'home'}, '');
      if(cur()!=='home'){ fromPop = true; try{ goRaw('home'); }catch(x){} finally{ fromPop = false; } }
      else if(typeof toast==='function') toast('🏠 여기가 홈이에요');
      return;
    }
    if(s.room!==cur()){ fromPop = true; try{ goRaw(s.room); }catch(x){} finally{ fromPop = false; } }
  });
})();

/* 모든 화면 오른쪽 아래: 살짝 투명한 관리자 단추 (위의 숨김 규칙에서 이것만 빼요) */
.sim-adm[data-act="openAdmin"]{display:inline-flex!important;position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;align-items:center;gap:4px;padding:.4rem .8rem;border-radius:999px;background:#FFF7F0;border:2px solid #F1DED3;color:#8C7A72;font-weight:700;font-size:.85rem;opacity:.5;cursor:pointer;transition:opacity .2s}
.sim-adm[data-act="openAdmin"]:hover,.sim-adm[data-act="openAdmin"]:focus-visible{opacity:1}
/* 🖥️ 전자칠판: 모두 한 팀 막대 · 큰 화면 */
.team-bar{display:none}
html.sim-board .team-bar{display:flex;position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:60;align-items:center;gap:12px;padding:8px 18px;border-radius:999px;background:#FFF7F0;border:3px solid #F7C9D8;box-shadow:0 6px 18px rgba(221,101,144,.25);font-weight:700;color:#7A3A55;font-size:1.05rem;white-space:nowrap}
.team-bar .tb-track{width:min(28vw,260px);height:14px;border-radius:99px;background:#F6E3EA;overflow:hidden}
.team-bar .tb-track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#F291B2,#E9B85A);transition:width .4s}
.team-bar b{font-size:1.25rem;color:#DD6590}
html.sim-board body{padding-top:62px}
@media (min-width:1200px){ html.sim-board{zoom:1.22} }
@media (min-width:1700px){ html.sim-board{zoom:1.45} }
.team-win{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(255,247,240,.86)}
.team-win .tw-card{text-align:center;background:#fff;border:4px solid #F7C9D8;border-radius:32px;padding:28px 34px;box-shadow:0 12px 40px rgba(221,101,144,.3);max-width:90vw}
.team-win .tw-big{font-size:4.2rem;line-height:1.1}
.team-win h2{font-size:2rem;margin:10px 0 6px;color:#B94873}
.team-win button{margin-top:16px;padding:.8rem 1.6rem;border-radius:20px;border:0;background:#DD6590;color:#fff;font-size:1.3rem;font-weight:700;cursor:pointer;box-shadow:0 5px 0 #B94873}
</style>
<script>
/* 🖥️ 전자칠판(board/)이 이 방의 문제 은행을 빌려 써요: 보이지 않는 틀에서 SIM_QGEN() 으로 한 문제씩
   돌려주는 모양 { html, say, choices[], ans, pic, hint } — 방마다 문제 만드는 함수가 달라서 여기서 맞춰요 */
(function(){
  const pickOne = a => a[Math.floor(Math.random()*a.length)];
  // 칠판 왼쪽 위에 보일 '영역 - 단원' (TAG)
  // 눈으로 풀기 어려운 곱셈 · 나눗셈(세 자리 × 두 자리, 세 자리 ÷ 두 자리 등)은 칠판 협동에서 빼요
  const hardMul = h => { const t=plain(h); const m=t.match(/(\d[\d,]*)\s*([×÷])\s*(\d[\d,]*)/); if(!m) return false; const x=+m[1].replace(/,/g,''), y=+m[3].replace(/,/g,''); return (x>=100&&y>=10)||(x>=10&&y>=100); };
  const ROOM_G=(new URLSearchParams(location.search).get('g')||location.pathname.split('/').filter(Boolean).pop()||'').slice(0,2);   // e3 → 'e3' 단원(lv)만
  let TAG=''; const QNAME={kor:'한글', word:'낱말', eng:'영어', engw:'영어 낱말', clock:'시계', count:'수 세기', read:'글 읽기', school:'학교 가요'};
  const mix = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const plain = h => String(h||'').replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'').replace(/&nbsp;|&[a-z]+;/g,' ').replace(/□/g,' 무엇 ').replace(/\s+/g,' ').trim();
  // 보기 숫자: 소수는 정답과 같은 자리까지 (컴퓨터 계산 오차 1.3199999… 없애기), 오답은 자리를 헷갈렸을 때 나오는 값으로
  const dpOf = x => { const t=String(+(+x).toFixed(10)); return t.includes('.') ? t.split('.')[1].length : 0; };
  function numChoices(ans){ const a=+(+ans).toFixed(10); if(!isFinite(a)) return null; const dp=dpOf(a), s=new Set([String(a)]);
    const ds = dp>=2 ? [0.1,-0.1,0.01,-0.01,1,-1,0.2,-0.2,0.02] : dp===1 ? [0.1,-0.1,1,-1,0.2,-0.2,0.3] : [1,-1,2,-2,10,-10,3,5];
    for(const d of mix(ds)){ if(s.size>=4) break; const v=+(a+d).toFixed(dp); if(v>=0) s.add(String(v)); }
    return s.size>=3 ? mix([...s]) : null; }
  function fromQuiz(){   // 유아 방: 놀이 단계 (칸 하나짜리만)
    const QK=pickOne(Object.keys(QUIZ)), lv=pickOne(QUIZ[QK].LV), q=lv.g(); TAG=(QNAME[QK]||'놀이')+(lv.n?' - '+lv.n:''); if(!q || q.slots.length!==1 || q.parts) return null;
    return { say:q.say||plain(q.prompt), pic:q.tcls==='pic-tile', choices:mix(q.tiles.slice()), ans:String(q.slots[0]), after:q.after||'',
      html:(q.pic?`<div class="q-pic">${q.pic}</div>`:'')+(q.big?`<div class="q-bigl">${q.big}</div>`:'')+(q.prompt?`<div class="q-p">${q.prompt}</div>`:'')+(q.eq?`<div class="q-eq">${q.eq} <b class="q-mark">?</b></div>`:'') }; }
  function fromCalc(){   // 초등 방: 연산 단계
    const LV0=pickOne(CALC_LEVELS), P=LV0.g('mix'); TAG='연산 - '+LV0.n;
    if(P.v){ const {a,b,op}=P.v, ans=+(op==='-'?a-b:a+b).toFixed(10); return { html:`<div class="q-eq">${a} ${op==='-'?'−':'+'} ${b} = <b class="q-mark">?</b></div>`, say:`${a} ${op==='-'?'빼기':'더하기'} ${b}는?`, ans:String(ans), choices:numChoices(ans) }; }
    if(P.h && P.ans && P.ans.length===1){ const h=P.h.replace('{0}','<b class="q-mark">?</b>'); return { html:(P.fig||'')+`<div class="q-eq">${h}</div>`, say:plain(h), ans:String(isFinite(+P.ans[0])?+(+P.ans[0]).toFixed(10):P.ans[0]), choices:numChoices(P.ans[0]), hint:P.hint?plain(P.hint):'' }; }
    return null; }
  function fromUnit(){   // 초등 방: 학교수학 단원
    const all=Object.keys(UNITS).filter(k=>k!=='mix'&&UNITS[k].gen), mine=all.filter(k=>String(UNITS[k].lv||'').startsWith(ROOM_G)), keys=mine.length?mine:all, UK=pickOne(keys), q=UNITS[UK].gen(); TAG='학교수학 - '+String(UNITS[UK].name||'').replace(/^\d+\.\s*/,''); if(!q) return null;
    const html=`<div class="q-p">${q.html}</div>`;
    if(q.type==='choice' && q.choices && q.choices.length>1) return { html, say:plain(q.html), ans:String(q.ans), choices:mix(q.choices.map(String)), hint:plain(q.explain||'') };
    return { html, say:plain(q.html), ans:String(isFinite(+q.ans)?+(+q.ans).toFixed(10):q.ans), choices:numChoices(q.ans), hint:plain(q.explain||'') }; }
  function fromKo(){   // 초등 방: 국어
    const q=KO_GEN[pickOne(Object.keys(KO_GEN))](); TAG='국어'; if(!q || !q.choices || q.choices.length<2) return null;
    return { html:`<div class="q-p">${q.html}</div>`, say:plain(q.html), ans:String(q.ans), choices:mix(q.choices.map(String)), hint:plain(q.explain||'') }; }
  window.SIM_QGEN = function(){
    const src=[];
    if(typeof QUIZ!=='undefined') src.push(fromQuiz,fromQuiz,fromQuiz);
    if(typeof CALC_LEVELS!=='undefined') src.push(fromCalc,fromCalc);
    if(typeof UNITS!=='undefined') src.push(fromUnit,fromUnit);
    if(typeof KO_GEN!=='undefined') src.push(fromKo);
    for(let t=0;t<40;t++){ try{ const q=pickOne(src)(); if(q && q.choices && q.choices.length>=2 && q.choices.includes(q.ans) && !hardMul(q.html) && !/들리는|듣고|잘 들어|소리를 듣/.test(plain(q.html))){ q.tag=TAG; return q; } }catch(e){} }
    return null;
  };
})();

</script>
<div class="team-bar" id="teamBar" aria-live="polite">🪷 우리 모두 한 팀 · 연꽃 별 <b id="teamN">0</b> / <b id="teamG">20</b><span class="tb-track"><i id="teamT"></i></span></div>
<script>
/* 🖥️ 전자칠판 모드: 누가 맞히든 모두의 별 · 목표를 채우면 다 같이 축하 (이 화면에만, 저장 안 함) */
(function(){
  if(typeof SIM_BOARD==='undefined' || !SIM_BOARD) return;
  const home=document.querySelector('.sim-home'); if(home){ home.textContent='🪷 처음으로'; }
  const K='simin:team:'+(SIM.age||''); let T={n:0, goal:Math.max(5, +SIM_Q.get('goal')||20), wins:0};
  try{ const s=JSON.parse(sessionStorage.getItem(K)||'null'); if(s && s.goal) T=s; }catch(e){}
  const save=()=>{ try{ sessionStorage.setItem(K, JSON.stringify(T)); }catch(e){} };
  const say=t=>{ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=.9; speechSynthesis.speak(u); }catch(e){} };
  function draw(){ const n=document.getElementById('teamN'), g=document.getElementById('teamG'), t=document.getElementById('teamT'); if(n) n.textContent=T.n; if(g) g.textContent=T.goal; if(t) t.style.width=Math.min(100,T.n/T.goal*100)+'%'; }
  function win(){
    T.wins++; save();
    const w=document.createElement('div'); w.className='team-win';
    w.innerHTML='<div class="tw-card"><div class="tw-big">🎉🪷🎉</div><h2>우리가 해냈어요!</h2><p style="font-size:1.25rem;margin:0">연꽃 별 <b>'+T.goal+'</b>송이를 모두 함께 피웠어요.<br>도와준 친구들, 모두 고마워요!</p><button type="button">🪷 다음 목표 +'+Math.max(5,+SIM_Q.get('goal')||20)+'</button></div>';
    document.body.appendChild(w); say('우리가 해냈어요! 모두 함께 박수!');
    try{ if(typeof celebrate==='function') celebrate(); else if(typeof burst==='function'){ burst(); setTimeout(burst,400); } }catch(e){}
    w.querySelector('button').onclick=()=>{ T.goal+=Math.max(5,+SIM_Q.get('goal')||20); save(); draw(); w.remove(); };
  }
  if(typeof addStar==='function'){ const raw=addStar; addStar=function(n){ const r=raw.apply(this,arguments); const k=(+n||1); if(k>0){ const before=T.n; T.n+=k; save(); draw(); if(before<T.goal && T.n>=T.goal) setTimeout(win,900); } return r; }; }
  draw();
})();
</script>
