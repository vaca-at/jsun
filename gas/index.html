<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가스기능사 필기 공부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --paper:#FFFFFF; --ink:#222831; --sub:#5F6B7A; --line:#DDE2E8;
  --acc:#1D6FDB; --acc-ink:#FFFFFF; --acc-dk:#1557B0; --acc-soft:#EEF5FF; --acc-line:#8DB8F0; --head:#1B4B9A;
  --ok:#17703E; --okbg:#E1F2E7; --no:#B92B27; --nobg:#FBE4E3;
  --fs:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171E; --paper:#1B222C; --ink:#EEF2F6; --sub:#AAB6C3; --line:#313C4A;
    --acc:#5C9EF5; --acc-ink:#0E1620; --acc-dk:#3B7ED6; --acc-soft:#1A2A40; --acc-line:#3D6BA8; --head:#8DBBF7;
    --ok:#5CCB8C; --okbg:#173327; --no:#FF7D77; --nobg:#3A1C1C;
  }
}
:root[data-theme="dark"]{
  --bg:#12171E; --paper:#1B222C; --ink:#EEF2F6; --sub:#AAB6C3; --line:#313C4A;
  --acc:#5C9EF5; --acc-ink:#0E1620; --acc-dk:#3B7ED6; --acc-soft:#1A2A40; --acc-line:#3D6BA8; --head:#8DBBF7;
  --ok:#5CCB8C; --okbg:#173327; --no:#FF7D77; --nobg:#3A1C1C;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:var(--fs);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.65;letter-spacing:-.01em;word-break:keep-all;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* 머리: 흰 바탕, 파란 제목, 둥근 메뉴 */
.top{background:var(--paper);border-bottom:1px solid var(--line)}
.stripe{height:4px;background:var(--acc)}
.bar{max-width:760px;margin:0 auto;padding:12px 16px 6px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:1.2rem;font-weight:700;color:var(--head);letter-spacing:-.02em}
.size{display:flex;gap:4px;align-items:center;font-size:.72rem;color:var(--sub)}
.size button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:.1rem .6rem;font-size:.72rem}
.size button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.nav{max-width:760px;margin:0 auto;padding:6px 16px 12px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.nav button{min-height:2.8rem;border:1px solid var(--line);background:var(--paper);border-radius:999px;font-weight:500;font-size:.82rem;padding:.25rem .2rem}
.nav button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}

main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px;margin-bottom:16px}
h2{font-size:1.15rem;margin:0 0 .5rem;font-weight:700;color:var(--head);letter-spacing:-.02em}
p{margin:.4rem 0}
.sub{color:var(--sub)}
.small{font-size:.82rem}

.big{display:block;width:100%;min-height:3.3rem;border:none;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:1.02rem;padding:.55rem 1rem;margin:10px 0}
.big:active{background:var(--acc-dk)}
.plain{display:block;width:100%;min-height:3.1rem;border:1px solid var(--acc-line);border-radius:999px;background:var(--paper);color:var(--ink);font-weight:500;font-size:.98rem;padding:.45rem 1rem;margin:10px 0}
.plain:active{background:var(--acc-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 12rem}

/* 진행 막대: 배관 모양 */
.meter{height:18px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:9px}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px}
.stats div{min-width:6em}
.stats b{display:block;font-size:1.5rem;line-height:1.2}

/* 용기 색깔 */
.cyls{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:10px 6px;margin-top:8px}
.cyl{text-align:center;font-size:.78rem;line-height:1.3}
.cyl svg{width:2.8rem;height:6rem;display:block;margin:0 auto 4px}
.cyl b{display:block;font-size:.85rem}

table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.92rem}
th,td{border:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
th{background:var(--acc-soft);font-weight:500;color:var(--head);white-space:nowrap}
.tip{margin-top:10px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--acc-soft);border-radius:0 10px 10px 0;font-size:.92rem}
.speak{border:1px solid var(--acc-line);background:var(--paper);border-radius:999px;padding:.2rem .8rem;font-size:.82rem;float:right;margin-left:8px}

/* 관리자 */
.adminlink{border:none;background:none;color:var(--sub);font-size:.72rem;text-decoration:underline;padding:.5rem}
.pinbox{display:block;width:100%;font:inherit;font-size:1.4rem;letter-spacing:.5em;text-align:center;padding:.5rem;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);margin:8px 0}

/* 주제 탭 */
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.topics button{flex:none;white-space:nowrap;border:1px solid var(--acc-line);background:var(--paper);border-radius:999px;padding:.15rem .7rem;font-size:.74rem;font-weight:500;min-height:2.1rem;line-height:1.3}
.topics button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.navrow{display:flex;gap:10px}
.navrow button{flex:1}

/* 카드로 익히기: 뒤집는 카드 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.modes button{min-height:3rem;border:1px solid var(--acc-line);background:var(--paper);border-radius:999px;font-weight:500;font-size:.9rem}
.modes button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.flip{perspective:1400px;margin:6px 0 4px;cursor:pointer;border:none;background:none;padding:0;width:100%;display:block}
.flip-in{position:relative;min-height:13rem;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:3px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center}
.face.front{border-color:var(--acc-line)}
.face.back{transform:rotateY(180deg);border-color:var(--ok);background:var(--okbg)}
.face .fq{font-size:1.2rem;font-weight:700;line-height:1.5}
.face .fa{font-size:1.45rem;font-weight:700;color:var(--ok);line-height:1.4}
.face .fd{font-size:.85rem;color:var(--sub)}
.face .hint2{font-size:.8rem;color:var(--sub)}
.face svg{width:3.4rem;height:7rem}
.cardnav{display:flex;gap:10px;margin-top:12px}
.cardnav button{flex:1}
.again{border-color:var(--no)!important;color:var(--no)}
.dots2{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:4px 0 10px}
.dots2 i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots2 i.k{background:var(--ok)}.dots2 i.a{background:var(--no)}.dots2 i.c{outline:3px solid var(--ink);outline-offset:1px}
.pickq{text-align:center;padding:10px 0 4px}
.pickq .fq{font-size:1.2rem;font-weight:700}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}

/* 문제 */
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--sub);font-size:.85rem;margin-bottom:6px}
.qtext{font-size:1.1rem;font-weight:600;line-height:1.6;margin:.3rem 0 .8rem}
.choices{display:flex;flex-direction:column;gap:10px}
.ch{display:flex;gap:.6rem;align-items:flex-start;text-align:left;width:100%;min-height:3.2rem;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:.55rem .8rem;font-size:1rem;line-height:1.5}
.ch b{flex:none;font-size:1.05rem}
.ch.sel{border-color:var(--acc);background:var(--acc-soft);border-width:2px}
.ch.ok{border-color:var(--ok);background:var(--okbg);border-width:3px}
.ch.no{border-color:var(--no);background:var(--nobg);border-width:3px}
.result{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.95rem}
.result.ok{background:var(--okbg)}
.result.no{background:var(--nobg)}
.result strong{font-size:1.1rem;display:block;margin-bottom:4px}
.result.ok strong{color:var(--ok)}
.result.no strong{color:var(--no)}
.timer{font-weight:700;color:var(--ink)}
.grid-ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:6px;margin-top:10px}
.grid-ans button{min-height:2.4rem;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-size:.8rem;padding:0}
.grid-ans button.done{background:var(--acc-soft);border-color:var(--acc-line)}
.grid-ans button.cur{border-color:var(--acc);border-width:3px}

.wrongitem{border-top:2px dashed var(--line);padding:12px 0}
.wrongitem:first-of-type{border-top:none}
.catbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.catbtn small{font-weight:400;color:var(--sub);font-size:.8rem}
/* 상위 카테고리: 둥근 머리칸 / 하위 카테고리: – 목록 */
.subjh{position:relative;display:flex;align-items:center;justify-content:center;gap:.45rem;margin:22px 0 4px;min-height:2.6rem;padding:.35rem 1rem;background:var(--acc-soft);border:1.5px solid var(--acc-line);border-radius:999px;font-weight:500;font-size:.95rem;line-height:1.3;text-align:center;color:var(--ink)}
.subjh:first-of-type{margin-top:8px}
.subjh.wc{padding:.35rem 3.4rem}
.subjh .no{flex:none;color:var(--acc);font-weight:700;font-size:.8rem}
.subjh .cnt{position:absolute;right:1rem;top:50%;transform:translateY(-50%);font-weight:400;font-size:.7rem;color:var(--sub)}
.units{display:flex;flex-direction:column;padding:2px 4px 0 10px}
.unit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;padding:.55rem .25rem;min-height:2.9rem;border-radius:0}
.unit:last-child{border-bottom:none}
.unit::before{content:'–';flex:none;color:var(--sub);font-weight:400}
.unit .t{flex:1;min-width:0}
.unit .t b{display:block;font-size:.92rem;font-weight:500;line-height:1.4}
.unit .t small{display:block;color:var(--sub);font-size:.72rem;line-height:1.4}
.unit:hover .t b,.unit:active .t b{color:var(--acc)}
.unit .p{flex:none;width:3.4rem;font-size:.68rem;color:var(--sub);text-align:right;line-height:1.3}
.unit .p i{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}
.unit .p i u{display:block;height:100%;background:var(--acc)}
.unit.hl .t b{color:var(--acc);font-weight:700}
.ext a{color:var(--acc);font-weight:500}
/* 하단 안내 */
.foot{max-width:760px;margin:0 auto;padding:6px 16px calc(80px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.72rem;color:var(--sub)}
.foot button{border:none;background:none;color:var(--sub);font-size:.72rem;padding:.4rem .5rem;text-decoration:underline;text-underline-offset:3px}
.foot button.strong{color:var(--ink);font-weight:700}
.foot .sep{opacity:.5}
.doc h3{font-size:.95rem;color:var(--head);margin:1.1rem 0 .3rem}
.doc p,.doc li{font-size:.9rem}
.doc ul,.doc ol{margin:.3rem 0;padding-left:1.3rem}
/* 오른쪽 아래 떠 있는 관리자 버튼 */
.fab{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 55%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:.45;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;transition:opacity .2s}
.fab:hover,.fab:focus-visible,.fab.on{opacity:1}
.gbtn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;min-height:3.1rem;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-weight:500;margin:10px 0}
.gbtn svg{width:1.2rem;height:1.2rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;border-radius:12px;font-size:.9rem;z-index:50}
@media (max-width:520px){
  /* 휴대폰: 고른 글자 크기의 85%로 */
  html{font-size:calc(var(--fs) * .85)}
  .bar{padding:10px 12px 4px}
  h1{font-size:1.1rem}
  .nav{grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 12px 10px}
  .nav button{min-height:2.5rem;font-size:.8rem}
  main{padding:12px 12px 48px}
  .card{padding:14px 12px;margin-bottom:12px}
  .units{margin-left:4px;padding-left:8px}
  /* 주제 탭: 한 줄로, 옆으로 밀어서 보기 */
  .topics{flex-wrap:nowrap;overflow-x:auto;gap:5px;margin:0 -12px 10px;padding:2px 12px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding:0 12px}
  .topics::-webkit-scrollbar{display:none}
  .topics button{font-size:.7rem;min-height:1.95rem;padding:.1rem .6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="stripe" aria-hidden="true"></div>
  <div class="bar">
    <h1>가스기능사 필기 공부</h1>
    <div class="size" role="group" aria-label="글자 크기">글자
      <button data-size="19">보통</button><button data-size="22">크게</button><button data-size="26">아주 크게</button>
    </div>
  </div>
  <nav class="nav">
    <button data-go="study">요점 정리</button>
    <button data-go="learn">카드로 익히기</button>
    <button data-go="quiz">문제 풀기</button>
    <button data-go="past">기출 유형</button>
    <button data-go="wrong">틀린 문제</button>
    <button data-go="exam">모의시험</button>
  </nav>
</header>
<main id="view"></main>
<footer class="foot">
  <button data-go="guide">이용방법</button><span class="sep">|</span><button class="strong" data-go="privacy">개인정보처리방침</button>
  <div>가스기능사 필기 공부 · 공부용 연습 앱</div>
</footer>
<button class="fab" data-admin="1" aria-label="관리자" title="관리자">🔒</button>

<script>
/* ▼▼▼ 여기만 바꾸면 돼요 ▼▼▼
   FIREBASE_CONFIG: 파이어베이스 콘솔 > 프로젝트 설정 > 내 앱(웹)의 firebaseConfig 를 붙여 넣으세요.
   null 로 두면 이 기기에만 기록돼요. 기록은 gas/{LEARNER_ID} 문서에 저장돼요. */
const FIREBASE_CONFIG = null;
const LEARNER_ID   = 'learner1';   // 문서 이름 (영어·숫자)
const LEARNER_NAME = '어르신';      // 관리자 화면에 보일 이름
const ADMIN_PIN    = '0000';        // 온라인 기록을 끈 경우에만 쓰는 관리자 비밀번호 4자리, 꼭 바꾸세요
/* 관리자 구글 계정: 메일 주소가 소스에 드러나지 않도록 SHA-256 값만 적어요.
   바꾸려면 새 메일 주소(소문자)의 SHA-256 값(16진수)을 넣으세요. */
const ADMIN_EMAIL_SHA256 = '22fa372a479af0929cadcbf6b12b6c2dace34800344067ef44b21a0c187487fb';
const POLICY_DATE  = '2026년 9월 25일';  // 개인정보처리방침 시행일
/* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

/* ───────── 문제 모음 ─────────
   [과목, 문제, [정답, 오답, 오답, 오답], 해설]
   과목: gen 가스의 성질 / safe 안전관리 / equip 설비와 기기
   보기 순서는 풀 때마다 섞여요. 정답은 늘 배열의 첫 번째에 적어 주세요. */
const CATS = {
  gen:{name:'가스의 성질', sub:'가스일반: 가스 성분, 폭발범위, 압력·온도, 연소'},
  safe:{name:'안전관리', sub:'법규, 용기 색, 거리·높이, 누설 검사'},
  equip:{name:'설비와 기기', sub:'안전밸브, 가스미터, 조정기, 펌프, 부식 방지'}
};
const QS = [
 ['gen','LPG(액화석유가스)의 주성분은 무엇인가요?',['프로판과 부탄','메탄과 에탄','수소와 일산화탄소','질소와 산소'],'LPG는 프로판(C₃H₈)과 부탄(C₄H₁₀)이 주성분이에요.'],
 ['gen','LNG(액화천연가스)의 주성분은 무엇인가요?',['메탄','프로판','부탄','수소'],'LNG는 메탄(CH₄)이 주성분이고, 도시가스의 원료로 쓰여요.'],
 ['gen','다음 중 공기보다 무거운 가스는 무엇인가요?',['프로판','메탄','수소','암모니아'],'가스 비중 = 분자량 ÷ 29(공기). 프로판은 44 ÷ 29 ≈ 1.5라서 공기보다 무거워요. 메탄(16), 수소(2), 암모니아(17)는 공기보다 가벼워요.'],
 ['gen','부탄(C₄H₁₀, 분자량 58)의 비중은 약 얼마인가요?',['2.0','0.5','1.0','1.5'],'비중 = 분자량 ÷ 29 = 58 ÷ 29 = 2.0이에요.'],
 ['gen','다음 중 폭발범위가 가장 넓은 가스는 무엇인가요?',['아세틸렌','메탄','프로판','부탄'],'아세틸렌의 폭발범위는 2.5 ~ 81%로 아주 넓어요.'],
 ['gen','메탄의 폭발범위(공기 중)는 얼마인가요?',['5 ~ 15%','2.1 ~ 9.5%','4 ~ 75%','1.8 ~ 8.4%'],'메탄 5 ~ 15%, 프로판 2.1 ~ 9.5%, 부탄 1.8 ~ 8.4%, 수소 4 ~ 75%예요.'],
 ['gen','수소의 폭발범위(공기 중)는 얼마인가요?',['4 ~ 75%','5 ~ 15%','12.5 ~ 74%','2.5 ~ 81%'],'수소는 4 ~ 75%예요. 12.5 ~ 74%는 일산화탄소, 2.5 ~ 81%는 아세틸렌이에요.'],

 ['gen','1기압(atm)과 같지 않은 것은 무엇인가요?',['10 kgf/cm²','760 mmHg','1.0332 kgf/cm²','101.325 kPa'],'1 atm = 760 mmHg = 1.0332 kgf/cm² = 101.325 kPa = 10.332 mH₂O예요.'],
 ['gen','절대압력을 구하는 식으로 맞는 것은?',['게이지압력 + 대기압','게이지압력 − 대기압','대기압 − 게이지압력','게이지압력 × 대기압'],'절대압력 = 대기압 + 게이지압력. 진공일 때는 절대압력 = 대기압 − 진공압력이에요.'],
 ['gen','27℃를 절대온도(K)로 바꾸면 얼마인가요?',['300 K','246 K','273 K','327 K'],'K = ℃ + 273이라서 27 + 273 = 300 K예요.'],

 ['gen','온도가 일정할 때 압력을 2배로 높이면 기체의 부피는 어떻게 되나요?',['1/2로 줄어든다','2배로 늘어난다','변하지 않는다','4배로 늘어난다'],'보일의 법칙: 온도가 같으면 압력과 부피는 반비례해요.'],

 ['gen','가스가 나오는 속도가 타는 속도보다 느려서, 불꽃이 버너 안쪽으로 들어가는 현상은?',['역화(백파이어)','선화(리프팅)','옐로팁','블로오프'],'역화는 분출속도 < 연소속도, 선화(리프팅)는 분출속도 > 연소속도일 때 불꽃이 버너에서 떠요.'],
 ['gen','불완전연소가 일어나는 원인이 아닌 것은?',['공기를 충분히 공급했을 때','공기 공급이 부족할 때','환기가 잘 안 될 때','불꽃이 차가운 물체에 닿을 때'],'불완전연소가 되면 일산화탄소(CO)가 생겨 위험해요.'],
 ['gen','아세틸렌이 구리, 은, 수은과 만나 생기는 폭발성 물질은?',['아세틸라이드','아세톤','카바이드','아세트산'],'그래서 아세틸렌 설비에는 구리 함유량이 62%를 넘는 동합금을 쓰지 않아요.'],

 ['gen','다음 중 불활성 가스는 무엇인가요?',['아르곤','암모니아','일산화탄소','에틸렌'],'불활성 가스: 질소, 아르곤, 헬륨, 네온, 이산화탄소 등'],

 ['safe','냄새 없는 가스에 넣는 부취제는 공기 중에 얼마쯤 섞였을 때 냄새로 알 수 있어야 하나요?',['1/1000','1/10','1/100','1/100000'],'공기 중 1/1000(0.1%)의 농도에서 냄새를 맡을 수 있어야 해요.'],

 ['safe','LPG 용기는 몇 ℃ 이하로 보관해야 하나요?',['40℃ 이하','60℃ 이하','20℃ 이하','80℃ 이하'],'충전 용기는 늘 40℃ 이하를 지켜요. 직사광선을 피하세요.'],

 ['safe','가연성가스나 산소 설비와 화기를 다루는 곳 사이의 우회거리는 몇 m 이상인가요?',['8 m','2 m','5 m','20 m'],'가연성가스·산소는 8 m, 그 밖의 가스는 2 m예요.'],

/* 날짜별 기록: { n 푼 문제, ok 맞힌 문제, cards 카드 본 수, min 공부한 분 } */

/* ───────── 온라인 기록 (Firebase) ───────── */
const cloud={ready:null, db:null, ok:false};
function cloudInit(){
  if(!FIREBASE_CONFIG) return Promise.resolve(null);
  if(cloud.ready) return cloud.ready;
  const load=src=>new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=rej;document.head.appendChild(t);});
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  cloud.ready=load(base+'firebase-app-compat.js').then(()=>load(base+'firebase-firestore-compat.js')).then(()=>load(base+'firebase-auth-compat.js')).then(()=>{
    firebase.initializeApp(FIREBASE_CONFIG); cloud.db=firebase.firestore(); cloud.ok=true; return cloud.db;
  }).catch(e=>{console.warn('온라인 기록 연결 실패',e); return null;});
  return cloud.ready;
}
const docRef=()=>cloud.db.collection('gas').doc(LEARNER_ID);
async function cloudPull(){
  if(!await cloudInit()) return null;
  try{ const snap=await docRef().get(); return snap.exists?snap.data():null; }catch(e){ console.warn('불러오기 실패',e); return null; }
}
function mergeRemote(r){
  if(!r) return;
  const localEmpty=!Object.keys(S.stat).length;
  Object.entries(r.stat||{}).forEach(([id,v])=>{ const l=S.stat[id]||[0,0]; S.stat[id]=[Math.max(l[0],v[0]||0),Math.max(l[1],v[1]||0)]; });
  if(localEmpty) S.wrong=Object.assign({},r.wrong||{});
  Object.entries(r.days||{}).forEach(([k,v])=>{ const l=dayObj(k); ['n','ok','cards','min'].forEach(f=>{ l[f]=Math.max(l[f]||0,v[f]||0); }); });
  const seen=new Set(S.exams.map(x=>x.at)); (r.exams||[]).forEach(x=>{ if(!seen.has(x.at)) S.exams.push(x); }); S.exams.sort((a,b)=>a.at-b.at);
  Object.entries(r.cardStat||{}).forEach(([t,v])=>{ const l=S.cardStat[t]||{k:0,a:0}; S.cardStat[t]={k:Math.max(l.k,v.k||0),a:Math.max(l.a,v.a||0)}; });
  save();
}
function totals(st=S.stat){ let c=0,w=0; Object.values(st).forEach(v=>{c+=v[0];w+=v[1];}); return {c,w,n:c+w}; }
let pushT=null;
function cloudPush(){ if(!FIREBASE_CONFIG) return; clearTimeout(pushT); pushT=setTimeout(pushNow,2000); }
async function pushNow(){
  if(!await cloudInit()) return;
  const t=totals();
  try{
    await docRef().set({name:LEARNER_NAME, updatedAt:Date.now(), lastSeen:S.lastSeen||Date.now(), solved:t.n, correct:t.c,
      stat:S.stat, wrong:S.wrong, days:S.days, exams:S.exams.slice(-40), cardStat:S.cardStat});
  }catch(e){ console.warn('저장 실패',e); }
}

/* 읽어 주기 */
function speak(text){
  if(!('speechSynthesis' in window)){ toast('이 기기는 읽어 주기를 지원하지 않아요'); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[①②③④]/g,m=>({'①':'1번','②':'2번','③':'3번','④':'4번'}[m])).replace(/~/g,'에서').replace(/℃/g,'도').replace(/÷/g,'나누기').replace(/×/g,'곱하기'));
  u.lang='ko-KR'; u.rate=0.85;
  const v=speechSynthesis.getVoices().find(v=>(v.lang||'').replace('_','-').startsWith('ko')); if(v) u.voice=v;
  speechSynthesis.speak(u);
}

function solvedCount(ids){ return ids.filter(id=>S.stat[id]).length; }
function rate(ids){ let c=0,t=0; ids.forEach(id=>{const s=S.stat[id]; if(s){c+=s[0];t+=s[0]+s[1];}}); return t?Math.round(c/t*100):0; }
function record(q, ok){
  const s=S.stat[q.id]||[0,0]; s[ok?0:1]++; S.stat[q.id]=s;
  if(ok) delete S.wrong[q.id]; else S.wrong[q.id]=(S.wrong[q.id]||0)+1;
  const d=dayObj(); d.n++; if(ok) d.ok++;
  S.lastSeen=Date.now(); save(); cloudPush();
}

function cardRecord(topic, ok){
  const c=S.cardStat[topic]||{k:0,a:0}; ok?c.k++:c.a++; S.cardStat[topic]=c;
  dayObj().cards++; S.lastSeen=Date.now(); save(); cloudPush();
}
let L=null;
function newL(){
  const cards=STUDY[S.topic].cards;
  L={topic:S.topic, mode:S.lmode, order:shuffle(cards.map((_,k)=>k)), i:0, flipped:false, res:[], picked:-1, opts:null, done:false};
  if(L.mode==='pick') makeOpts();
}
function makeOpts(){
  const cards=STUDY[L.topic].cards, c=cards[L.order[L.i]];
  const others=shuffle(cards.filter(x=>x.b!==c.b).map(x=>x.b)).slice(0,3);
  L.opts=shuffle([c.b,...others]); L.picked=-1;
}
function learn(){
  if(!L || L.topic!==S.topic || L.mode!==S.lmode) newL();
  const cards=STUDY[L.topic].cards, n=L.order.length;
  const head = topicTabs('ltopic') + `<div class="modes">
      <button class="${S.lmode==='flip'?'on':''}" data-lmode="flip">🃏 뒤집기 카드</button>
      <button class="${S.lmode==='pick'?'on':''}" data-lmode="pick">👆 골라 맞히기</button></div>`;
  const dots = `<div class="dots2" aria-hidden="true">${L.order.map((_,k)=>`<i class="${L.res[k]===true?'k':L.res[k]===false?'a':''} ${k===L.i&&!L.done?'c':''}"></i>`).join('')}</div>`;
  if(L.done){
    const k=L.res.filter(x=>x===true).length, a=n-k;
    $v.innerHTML = head + `<section class="card" style="text-align:center">
      <h2>${STUDY[L.topic].t} 다 봤어요!</h2>${dots}
      <div class="stats" style="justify-content:center"><div><span class="sub small">알아요</span><b style="color:var(--ok)">${k}개</b></div><div><span class="sub small">다시 볼 것</span><b style="color:var(--no)">${a}개</b></div></div>
      ${a?`<button class="big" data-lagain="1">다시 볼 것 ${a}개만 한 번 더</button>`:'<p>🎉 모두 알고 있어요!</p>'}
      <div class="navrow"><button class="plain" data-lrestart="1">처음부터 다시</button><button class="plain" data-ltopic="${(L.topic+1)%STUDY.length}">다음 주제 ▶</button></div>
      <button class="plain" data-start="mix">문제 풀기로 가기</button></section>`;
    return;
  }
  const c=cards[L.order[L.i]];
  if(L.mode==='flip'){
    $v.innerHTML = head + `<section class="card">
      <div class="qhead"><span>${STUDY[L.topic].t}</span><span>${L.i+1} / ${n}</span></div>${dots}
      <button class="flip ${L.flipped?'on':''}" data-flip="1" aria-label="카드 뒤집기">
        <div class="flip-in">
          <div class="face front"><div class="fq">${c.f}</div><div class="hint2">👆 눌러서 답 보기</div></div>
          <div class="face back">${c.v||''}<div class="fa">${c.b}</div>${c.d?`<div class="fd">${c.d}</div>`:''}</div>
        </div>
      </button>
      <button class="speak" style="float:none;margin:8px auto 0;display:block" data-lread="1">🔊 읽기</button>
      ${L.flipped?`<div class="cardnav"><button class="plain again" data-lres="0">다시 볼래요</button><button class="big" style="margin:10px 0" data-lres="1">알아요 👍</button></div>`
                 :`<button class="plain" data-flip="1">답 보기</button>`}
    </section>`;
  } else {
    const ans=c.b, done=L.picked>=0;
    $v.innerHTML = head + `<section class="card">
      <div class="qhead"><span>${STUDY[L.topic].t}</span><span>${L.i+1} / ${n}</span></div>${dots}
      <div class="pickq">${L.topic===0?c.v:''}<div class="fq">${c.f}</div></div>
      <button class="speak" style="float:none;margin:0 auto 10px;display:block" data-lread="1">🔊 읽기</button>
      <div class="choices">${L.opts.map((o,j)=>`<button class="ch ${done?(o===ans?'ok':j===L.picked?'no':''):''}" data-lpick="${j}" ${done?'disabled':''}><b>${NUM[j]}</b><span>${esc(o)}</span></button>`).join('')}</div>
      ${done?`<div class="result ${L.opts[L.picked]===ans?'ok':'no'}"><strong class="pop">${L.opts[L.picked]===ans?'⭕ 맞았어요!':'❌ 정답은 '+esc(ans)}</strong>${c.d||''}</div>
        <button class="big" data-lnext="1">${L.i+1<n?'다음':'결과 보기'}</button>`:''}
    </section>`;
  }
}
function lNext(){
  L.i++; L.flipped=false;
  if(L.i>=L.order.length){ L.done=true; }
  else if(L.mode==='pick') makeOpts();
  learn(); window.scrollTo(0,0);
}

function unitBtn(start,name,sub,ids,hl){

function start(kind){
  let pool;
  if(kind==='mix') pool=shuffle(QS).slice(0,10);
  else if(kind==='kmix') pool=shuffle(KQ).slice(0,20);
  else if(UNITS[kind]) pool=shuffle(KQ.filter(q=>q.c===kind));
  else if(kind==='exam') pool=shuffle(QS).slice(0,60);
  else if(kind==='wrong'){ pool=shuffle(QS.filter(q=>S.wrong[q.id])).slice(0,10); if(!pool.length){ toast('틀린 문제가 없어요. 잘하셨어요!'); return; } }
  else pool=shuffle(QS.filter(q=>q.c===kind)).slice(0,10);
  const back=kind==='exam'?'exam':(kind==='kmix'||UNITS[kind])?'past':'quiz';
  Q={kind, back, exam:kind==='exam', list:pool.map(q=>({q, opts:shuffle(q.ch)})), i:0, picks:[], done:false, start:Date.now()};
  view=back; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===back));
  stopTimer();
  if(Q.exam) timerId=setInterval(()=>{ if(!Q||!Q.exam||Q.done||view!=='exam') return; const left=3600-Math.floor((Date.now()-Q.start)/1000); if(left<=0){ finishExam(); return; } const t=document.getElementById('timer'); if(t) t.textContent=fmtLeft(left); },1000);
  drawQ(); window.scrollTo(0,0);
}
const fmtLeft=s=>`${Math.floor(s/60)}분 ${String(s%60).padStart(2,'0')}초`;
const titleOf=()=>Q.exam?'실전 모의시험':Q.kind==='mix'?'섞어서 10문제':Q.kind==='kmix'?'기출 유형 섞어서':Q.kind==='wrong'?'틀린 문제 다시':unitName(Q.kind);

function drawQ(){
  if(Q.exam && !Q.done && Date.now()-Q.start>=3600000){ finishExam(); return; }
  if(Q.done){ drawResult(); return; }
  const it=Q.list[Q.i], q=it.q, pick=Q.picks[Q.i], n=Q.list.length;
  const answered = !Q.exam && pick!==undefined;
  const cls=j=>{
    if(Q.exam) return pick===j?'sel':'';
    if(!answered) return '';
    if(it.opts[j]===q.ch[0]) return 'ok';
    return pick===j?'no':'';
  };
  const ok = answered && it.opts[pick]===q.ch[0];
  $v.innerHTML=`
  <section class="card">
    <div class="qhead"><span>${titleOf()}</span><span>${Q.i+1} / ${n}</span>
      ${Q.exam?`<span>남은 시간 <span class="timer" id="timer">${fmtLeft(Math.max(0,3600-Math.floor((Date.now()-Q.start)/1000)))}</span></span>`:''}</div>
    <button class="speak" data-readq="1">🔊 읽기</button>
    <p class="qtext">${esc(q.q)}</p>
    <div class="choices">${it.opts.map((o,j)=>`<button class="ch ${cls(j)}" data-pick="${j}" ${answered?'disabled':''}><b>${NUM[j]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    ${answered?`<div class="result ${ok?'ok':'no'}"><strong>${ok?'⭕ 맞았어요!':'❌ 아쉬워요. 정답은 '+NUM[it.opts.indexOf(q.ch[0])]+' '+esc(q.ch[0])}</strong>${esc(q.ex)}</div>`:''}
    ${!Q.exam && !answered?`<button class="plain" data-skip="1">모르겠어요, 정답 보기</button>`:''}
    ${!Q.exam && answered?`<button class="big" data-next="1">${Q.i+1<n?'다음 문제':'결과 보기'}</button>`:''}
    ${Q.exam?`<div class="row"><button class="plain" data-prev="1" ${Q.i===0?'disabled':''}>이전 문제</button><button class="big" data-next="1">${Q.i+1<n?'다음 문제':'답안 제출하기'}</button></div>
      <details><summary class="sub small" style="cursor:pointer;margin-top:8px">문제 번호로 이동하기</summary>
      <div class="grid-ans">${Q.list.map((_,k)=>`<button class="${Q.picks[k]!==undefined?'done':''} ${k===Q.i?'cur':''}" data-jump="${k}">${k+1}</button>`).join('')}</div></details>`:''}
    <button class="plain" data-quit="1" style="border-style:dashed">그만 풀기</button>
  </section>`;
}
function pickAns(j){
  const it=Q.list[Q.i];
  if(Q.exam){ Q.picks[Q.i]=j; drawQ(); return; }
  if(Q.picks[Q.i]!==undefined) return;
  Q.picks[Q.i]=j; record(it.q, it.opts[j]===it.q.ch[0]); drawQ();
}
function skipAns(){
  const it=Q.list[Q.i];
  Q.picks[Q.i]=-1; record(it.q,false); drawQ();
}
function next(){
  if(Q.exam){
    if(Q.i+1<Q.list.length){ Q.i++; drawQ(); window.scrollTo(0,0); return; }
    const empty=Q.list.filter((_,k)=>Q.picks[k]===undefined).length;
    if(empty && !confirm(`아직 안 푼 문제가 ${empty}개 있어요. 그래도 제출할까요?`)) return;
    finishExam(); return;
  }
  if(Q.picks[Q.i]===undefined) return;
  if(Q.i+1<Q.list.length){ Q.i++; drawQ(); window.scrollTo(0,0); } else { Q.done=true; drawQ(); }
}
function finishExam(){
  stopTimer();
  Q.list.forEach((it,k)=>record(it.q, Q.picks[k]!==undefined && it.opts[Q.picks[k]]===it.q.ch[0]));
  { const n=Q.list.length, c=Q.list.filter((it,k)=>Q.picks[k]!==undefined && it.opts[Q.picks[k]]===it.q.ch[0]).length;
    S.exams.push({at:Date.now(), n, c, score:Math.round(c/n*100), sec:Math.round((Date.now()-Q.start)/1000)}); save(); cloudPush(); }
  Q.done=true; drawQ(); window.scrollTo(0,0);
}
function drawResult(){
  const n=Q.list.length, c=Q.list.filter((it,k)=>Q.picks[k]!==undefined && Q.picks[k]>=0 && it.opts[Q.picks[k]]===it.q.ch[0]).length;
  const score=Math.round(c/n*100), pass=score>=60;
  const wrongs=Q.list.filter((it,k)=>!(Q.picks[k]!==undefined && Q.picks[k]>=0 && it.opts[Q.picks[k]]===it.q.ch[0]));
  $v.innerHTML=`
  <section class="card">
    <h2>${titleOf()} 결과</h2>
    <div class="stats"><div><span class="sub small">맞힌 문제</span><b>${c} / ${n}</b></div><div><span class="sub small">점수</span><b>${score}점</b></div></div>
    <p>${Q.exam?(pass?'🎉 합격 점수(60점)를 넘었어요!':'합격 점수(60점)까지 조금 더 힘내세요.'):(c===n?'🎉 모두 맞혔어요!':'틀린 문제는 "틀린 문제"에 모아 두었어요.')}</p>
    <button class="big" data-again="1">${Q.exam?'모의시험 다시 보기':UNITS[Q.kind]?'이 단원 다시 풀기':Q.kind==='kmix'?'20문제 더 풀기':'10문제 더 풀기'}</button>
    <button class="plain" data-quit="1">문제 고르는 화면으로</button>
  </section>
  ${wrongs.length?`<section class="card"><h2>틀린 문제 다시 보기</h2>${wrongs.map(it=>`<div class="wrongitem"><p><b>${esc(it.q.q)}</b></p><p>정답: <b style="color:var(--ok)">${esc(it.q.ch[0])}</b></p><p class="sub small">${esc(it.q.ex)}</p></div>`).join('')}</section>`:''}`;
}

/* 틀린 문제 노트 */
function wrongNote(){
  const list=QS.filter(q=>S.wrong[q.id]).sort((a,b)=>S.wrong[b.id]-S.wrong[a.id]);
  $v.innerHTML=`
  <section class="card">
    <h2>틀린 문제 ${list.length}개</h2>
    <p class="sub small">많이 틀린 문제가 위에 있어요. 다시 풀어서 맞히면 여기서 빠져요.</p>
    ${list.length?`<button class="big" data-start="wrong">틀린 문제 다시 풀기</button>`:'<p>아직 틀린 문제가 없어요. 문제를 풀어 보세요.</p><button class="big" data-start="mix">오늘의 10문제 풀기</button>'}
    ${list.map(q=>`<div class="wrongitem"><p><b>${esc(q.q)}</b> <span class="sub small">(${S.wrong[q.id]}번 틀림)</span></p>
      <p>정답: <b style="color:var(--ok)">${esc(q.ch[0])}</b></p><p class="sub small">${esc(q.ex)}</p>
      <button class="plain" data-clear="${q.id}" style="min-height:2.4rem;font-size:.85rem">이제 알아요, 목록에서 빼기</button></div>`).join('')}
  </section>
  <p class="center sub small" style="text-align:center"><button class="plain" data-reset="1" style="border-style:dashed;font-size:.8rem;min-height:2.4rem">공부 기록 모두 지우기</button></p>`;
}

/* ───────── 클릭 처리 ───────── */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  if(d.size){ S.size=+d.size; save(); applySize(); return; }
  if(d.go){ const qv=d.go==='quiz'||d.go==='past'||d.go==='exam'; if(qv && Q && !Q.done && Q.back===d.go){ view=d.go; render(); return; } if(qv && Q && Q.exam && !Q.done && !confirm('진행 중인 모의시험을 그만둘까요? 푼 답은 저장되지 않아요.')) return; if(qv) stopTimer(); if(qv) Q=null; go(d.go); return; }
  if(d.admin){ go('admin'); return; }
  if(d.apin){ const v=(document.getElementById('apin')||{}).value; if(v===ADMIN_PIN){ admOK=true; adminView(); } else toast('비밀번호가 달라요'); return; }
  if(d.admrefresh){ adminView(); return; }
  if(d.glogin){ googleLogin(); return; }
  if(d.alogout){ adminLogout(); return; }
  if(d.start){ start(d.start); return; }
  if(d.topic!==undefined){ S.topic=+d.topic; save(); study(); window.scrollTo(0,0); tabIntoView(); return; }
  if(d.golearn){ go('learn'); return; }
  if(d.ltopic!==undefined){ S.topic=+d.ltopic; save(); L=null; learn(); window.scrollTo(0,0); tabIntoView(); return; }
  if(d.lmode){ S.lmode=d.lmode; save(); L=null; learn(); return; }
  if(d.flip){ L.flipped=!L.flipped; learn(); return; }
  if(d.lres!==undefined){ L.res[L.i]=d.lres==='1'; cardRecord(L.topic, L.res[L.i]); lNext(); return; }
  if(d.lpick!==undefined){ if(L.picked>=0) return; L.picked=+d.lpick; const c=STUDY[L.topic].cards[L.order[L.i]]; L.res[L.i]=L.opts[L.picked]===c.b; cardRecord(L.topic, L.res[L.i]); learn(); return; }
  if(d.lnext){ lNext(); return; }
  if(d.lrestart){ L=null; learn(); return; }
  if(d.lagain){ const again=L.order.filter((_,k)=>L.res[k]!==true); L.order=shuffle(again); L.i=0; L.res=[]; L.done=false; L.flipped=false; if(L.mode==='pick') makeOpts(); learn(); return; }
  if(d.lread){ const c=STUDY[L.topic].cards[L.order[L.i]]; speak(L.mode==='flip'&&!L.flipped ? c.f : c.f+'. '+(L.mode==='pick'&&L.picked<0 ? L.opts.map((o,j)=>NUM[j]+' '+o).join('. ') : c.b+'. '+(c.d||''))); return; }
  if(d.pick!==undefined){ pickAns(+d.pick); return; }
  if(d.skip){ skipAns(); return; }
  if(d.next){ next(); return; }
  if(d.prev){ if(Q.i>0){ Q.i--; drawQ(); } return; }
  if(d.jump!==undefined){ Q.i=+d.jump; drawQ(); return; }
  if(d.again){ start(Q.kind==='wrong'?'wrong':Q.kind); return; }
  if(d.quit){ if(Q && Q.exam && !Q.done && !confirm('모의시험을 그만둘까요? 푼 답은 저장되지 않아요.')) return; stopTimer(); const bk=Q?Q.back:'quiz'; Q=null; go(bk); return; }
  if(d.readq){ const it=Q.list[Q.i]; speak(it.q.q+'. '+it.opts.map((o,j)=>NUM[j]+' '+o).join('. ')); return; }
  if(d.read){ const el=document.getElementById(d.read); if(el) speak(el.innerText.replace('🔊 읽기','')); return; }
  if(d.clear){ delete S.wrong[d.clear]; save(); wrongNote(); toast('목록에서 뺐어요'); return; }
  if(d.reset){ if(confirm('푼 기록과 틀린 문제를 모두 지울까요?')){ S.stat={}; S.wrong={}; S.days={}; S.exams=[]; S.cardStat={}; save(); pushNow(); toast('기록을 지웠어요'); go('study'); } return; }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.id==='apin'){ const b=document.querySelector('[data-apin]'); if(b) b.click(); return; }
  if((view!=='quiz'&&view!=='past'&&view!=='exam')||!Q||Q.done) return;
  if(['1','2','3','4'].includes(e.key)) pickAns(+e.key-1);
  if(e.key==='Enter') next();
});
if('speechSynthesis' in window) speechSynthesis.getVoices();

let lastAct=Date.now();
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
setInterval(()=>{
  if(document.visibilityState==='visible' && Date.now()-lastAct<120000 && view!=='admin'){
    dayObj().min++; S.lastSeen=Date.now(); save(); cloudPush();
  }
},60000);

applySize();
render();
cloudPull().then(r=>{ if(r){ mergeRemote(r); if(view==='exam'||view==='quiz'||view==='past') render(); } if(FIREBASE_CONFIG) pushNow(); });
</script>
</body>
</html>
