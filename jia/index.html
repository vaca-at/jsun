<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>지아의 공부방</title>
<style>
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'OwnglyphYuntaeng';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/온글잎 윤탱체.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--font-t:'GMarketSans';--tw:700;--bg:#FFF8F2;--paper:#FFFFFF;--card:#FFFFFF;--ink:#1B1F2E;--sub:#6D7385;--line:#EDE6DD;--accent:#FF6A3D;--soft:#FFEFE8;--hi:#FFC53D;--ok:#12A37A;--no:#E5484D;--shadow:0 6px 18px rgba(27,31,46,.08);--rad:24px;
  --kor:#E8604C;--math:#0FA3B1;--eng:#7A5AF0;--story:#E39A1B;--room:#12A38A;--font:'GMarketSans';--hand:'OwnglyphYuntaeng';
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{font-size:18px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font),system-ui,sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;line-height:1.4}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hand{font-family:var(--hand),var(--font),sans-serif;font-weight:normal}
b,.t{font-weight:700}

/* 상단 */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,248,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;flex:1}
.logo i{font-style:normal;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#FF8A4C,#FF5A5F);color:#fff;font-size:22px}
.star{display:flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;font-size:1.1rem}
.home-btn{width:48px;height:48px;border-radius:16px;background:var(--paper);border:1px solid var(--line);font-size:24px}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}

/* 홈: 오늘의 놀이 길 */
.hello{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:var(--rad);background:linear-gradient(120deg,#FFE7DB,#FFF4D6);margin-bottom:18px}
.hello .me{font-size:64px;line-height:1}
.hello .hand{font-size:2rem;line-height:1.3}
.hello .sub{color:var(--sub);font-size:.95rem;margin-top:2px}
.say{margin-left:auto;flex:none;width:56px;height:56px;border-radius:50%;background:#fff;font-size:26px;box-shadow:var(--shadow)}
.road{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:10px 0 4px}
.road::before{content:"";position:absolute;left:10%;right:10%;top:78px;height:10px;border-radius:10px;background:repeating-linear-gradient(90deg,#F2D7C4 0 22px,transparent 22px 36px)}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0}
.stop .ball{width:150px;max-width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:700;font-size:2.6rem;box-shadow:0 12px 24px color-mix(in srgb,var(--c) 32%,transparent);border:6px solid #fff}
.stop b{font-size:1.25rem}
.stop small{color:var(--sub);font-size:.85rem}
.stop .done{position:absolute;top:4px;right:calc(50% - 76px);width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
.stop:active .ball{transform:scale(.96)}
@media (max-width:760px){ .road{grid-template-columns:repeat(2,1fr)} .road::before{display:none} .stop .ball{width:130px} .stop .done{right:calc(50% - 66px)} }

/* 공통 판 */
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.head .ico{width:56px;height:56px;border-radius:18px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.6rem;font-weight:700}
.head b{font-size:1.5rem}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.lv{min-height:48px;padding:0 18px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-size:1rem;font-weight:700;color:var(--sub)}
.lv.on{background:var(--c);border-color:var(--c);color:#fff}
.lv .m{margin-left:4px}
.board{background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow);padding:22px;text-align:center;position:relative}
.q-top{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:.95rem;margin-bottom:6px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}
.dots i.cur{background:var(--c)}
.pic{font-size:88px;line-height:1.1;margin:6px 0}
.prompt{font-size:1.6rem;margin:6px 0 14px}
.listen{display:inline-flex;align-items:center;gap:10px;height:64px;padding:0 26px;border-radius:999px;background:var(--c);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 8px 18px color-mix(in srgb,var(--c) 30%,transparent);margin:4px 0 14px}
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;font-size:3rem;font-weight:700;margin:6px 0 18px}
.eq .op{color:var(--sub)}
.big-letter{font-size:6rem;font-weight:700;line-height:1;margin:4px 0}

/* 끌어다 놓기 */
.slot{display:inline-grid;place-items:center;min-width:110px;height:110px;padding:0 10px;border-radius:26px;border:5px dashed color-mix(in srgb,var(--c) 55%,#fff);background:color-mix(in srgb,var(--c) 7%,#fff);font-size:3.4rem;font-weight:700;vertical-align:middle;transition:transform .12s,background .12s}
.slot.hover{transform:scale(1.07);background:color-mix(in srgb,var(--c) 18%,#fff)}
.slot.filled{border-style:solid;border-color:var(--ok);background:#E9F8F1;color:#0B6B4F}
.slot.small{min-width:78px;height:78px;border-radius:20px;border-width:4px;font-size:2.2rem}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:22px;padding:18px;border-radius:22px;background:color-mix(in srgb,var(--c) 6%,var(--bg))}
.tile{touch-action:none;min-width:110px;height:110px;padding:0 14px;border-radius:26px;background:#fff;border:3px solid color-mix(in srgb,var(--c) 40%,var(--line));box-shadow:0 6px 0 color-mix(in srgb,var(--c) 30%,var(--line));font-size:3.4rem;font-weight:700;display:grid;place-items:center;cursor:grab}
.tile.small{min-width:78px;height:78px;border-radius:20px;font-size:2.2rem}
.tile.pic-tile{font-size:3.6rem}
.tile.lift{opacity:.25}
.tile.used{visibility:hidden}
.tile.shake{animation:shake .45s}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 18px 30px rgba(0,0,0,.2)}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.hint{min-height:1.6em;margin-top:14px;font-size:1.2rem;color:var(--sub)}
.praise{font-family:var(--hand),var(--font),sans-serif;font-size:2.2rem;color:var(--ok)}
.next{display:inline-flex;align-items:center;gap:10px;height:66px;padding:0 34px;border-radius:999px;background:var(--ink);color:#fff;font-size:1.3rem;font-weight:700;margin-top:16px}

/* 연산 학습지 */
.sheet{background:#fff;border-radius:var(--rad);box-shadow:var(--shadow);padding:18px 22px;border-top:10px solid var(--c)}
.sheet-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sheet-h b{font-size:1.35rem}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:12px 0;border-bottom:2px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .no{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);display:grid;place-items:center;font-weight:700}
.row .ex{display:flex;align-items:center;gap:12px;font-size:2.4rem;font-weight:700}
.row .cnt{display:flex;flex-wrap:wrap;gap:4px;max-width:180px}
.row .cnt i{width:15px;height:15px;border-radius:50%;background:#F59E0B}
.row .cnt i.b{background:var(--c)}
.sheet .tray{margin-top:14px;position:sticky;bottom:10px;z-index:5;box-shadow:0 -6px 18px rgba(27,31,46,.06)}
.sheet-body{display:block}
@media (min-width:900px){ .sheet-body{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start} .sheet-body .tray{position:sticky;top:90px;bottom:auto;margin-top:6px;box-shadow:none} }
@media (orientation:landscape) and (max-height:900px){ .pic{font-size:64px;margin:0} .listen{height:54px;margin:2px 0 8px} .prompt{margin:2px 0 8px} .eq{margin:2px 0 8px} .tray{margin-top:10px;padding:12px} .board{padding:16px 22px} .big-letter{font-size:4.6rem} }

/* 동화 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.book{padding:20px 14px;border-radius:var(--rad);background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.book .e{font-size:60px;line-height:1.1}
.book b{font-size:1.1rem}
.book .ok{position:absolute;top:10px;right:12px;font-size:1.4rem}
.story{background:#FFFBF2;border-radius:var(--rad);box-shadow:var(--shadow);padding:22px}
.story h2{margin:0 0 6px;font-size:1.7rem;text-align:center}
.sec{padding:10px 8px;border-radius:16px;text-align:center}
.sec .e{font-size:64px;line-height:1.1}
.sec p{font-family:var(--hand),var(--font),sans-serif;font-size:2rem;line-height:1.5;margin:6px 0}
.reading{background:color-mix(in srgb,var(--hi) 30%,transparent)}
.rd-row{display:flex;justify-content:center;gap:10px;margin:6px 0 10px}
.pill{min-height:52px;padding:0 22px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:1.05rem}
.pill.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}

/* 내 캐릭터 방 */
.me-ground{position:absolute;left:0;right:0;bottom:0;height:30%;border-radius:50% 50% 0 0 / 22px 22px 0 0}
.me-deco.sc{opacity:1;line-height:1}
.me-box{position:absolute;display:block}
.me-stage.mini .me-deco.sc{transform:scale(.5);transform-origin:top left}
/* 캐릭터 그림 틀: 글자 한 칸(1em) 크기, 모자 · 소품은 그 안에서 em으로 */
.me-char .me-fig{position:absolute;left:50%;bottom:0;width:1em;height:1em;margin-left:-.5em;font-size:130px;line-height:1}
.me-char .me-fig .me-base{position:absolute;inset:0;font-size:1em;line-height:1;text-align:center}
.me-char .me-fig .me-hat{position:absolute;left:50%;top:-.34em;margin:0;font-size:.5em;line-height:1}
.me-char .me-fig .me-acc{position:absolute;right:-.58em;bottom:-.02em;top:auto;left:auto;margin:0;font-size:.42em;line-height:1}
.me-char .me-fig .me-acc.face{right:auto;left:50%;top:.3em;bottom:auto;transform:translateX(-50%);font-size:.48em}
@media (max-width:520px){ .me-char .me-fig{font-size:110px} }
/* 친구(펫)는 방 안을 왼쪽 오른쪽으로 걸어 다녀요: 바깥은 가로로 움직이고 방향을 바꾸고, 안쪽은 콩콩 뛰어요 */
.me-stage .me-char{z-index:2}
.me-stage .me-pet{left:6%;z-index:1;animation:petWalk 11s ease-in-out infinite}
.me-pet-in{display:inline-block;animation:petHop .55s ease-in-out infinite alternate}
.me-stage .me-pet.fly{bottom:auto;top:18%}
.me-pet.fly .me-pet-in{animation:petFly 1.8s ease-in-out infinite alternate}
@keyframes petWalk{0%{left:4%;transform:scaleX(-1)}46%{left:76%;transform:scaleX(-1)}50%{left:76%;transform:scaleX(1)}96%{left:4%;transform:scaleX(1)}100%{left:4%;transform:scaleX(-1)}}
@keyframes petHop{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes petFly{from{transform:translateY(-10px) rotate(-6deg)}to{transform:translateY(12px) rotate(6deg)}}
/* 빨간 문어: 조금 더 빨갛고 동글동글하게 */
.fx-red{filter:saturate(1.7) hue-rotate(-18deg) brightness(1.02)}
/* 전설 캐릭터 빛 효과 */
.fx-moon{animation:fxMoon 2.4s ease-in-out infinite alternate}
@keyframes fxMoon{from{filter:drop-shadow(0 0 6px rgba(140,200,255,.8)) drop-shadow(0 0 14px rgba(80,120,255,.5))}to{filter:drop-shadow(0 0 12px rgba(170,220,255,1)) drop-shadow(0 0 28px rgba(90,130,255,.8))}}
.fx-rainbow{animation:fxRainbow 4s linear infinite}
@keyframes fxRainbow{from{filter:hue-rotate(0deg) saturate(1.5) drop-shadow(0 0 10px rgba(255,120,255,.8))}to{filter:hue-rotate(360deg) saturate(1.5) drop-shadow(0 0 10px rgba(255,120,255,.8))}}
.fx-gold{filter:sepia(.6) saturate(2) hue-rotate(-10deg) brightness(1.1) drop-shadow(0 0 10px rgba(255,210,60,1)) drop-shadow(0 0 22px rgba(255,170,0,.7));animation:fxGold 1.8s ease-in-out infinite alternate}
@keyframes fxGold{to{filter:sepia(.6) saturate(2.2) hue-rotate(-10deg) brightness(1.25) drop-shadow(0 0 14px rgba(255,230,120,1)) drop-shadow(0 0 30px rgba(255,180,0,.85))}}
.fx-deep{filter:hue-rotate(-50deg) saturate(1.4) drop-shadow(0 0 10px rgba(170,90,255,.95)) drop-shadow(0 0 24px rgba(90,40,200,.8));animation:fxDeep 3s ease-in-out infinite}
@keyframes fxDeep{50%{transform:translateY(-4%) rotate(-3deg);filter:hue-rotate(-40deg) saturate(1.6) drop-shadow(0 0 14px rgba(190,110,255,1)) drop-shadow(0 0 30px rgba(110,50,220,.9))}}
.fx-star{filter:drop-shadow(0 0 8px rgba(255,255,255,.95)) drop-shadow(0 0 20px rgba(200,230,255,.8))}
.me-base.fx-star::after{content:'✨';position:absolute;right:4%;top:6%;font-size:.26em;animation:fxSpark 1.6s ease-in-out infinite}
.me-base.fx-star::before{content:'✨';position:absolute;left:6%;top:40%;font-size:.2em;animation:fxSpark 1.6s ease-in-out .8s infinite}
@keyframes fxSpark{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
/* 피닉스: 불꽃 빛이 일렁여요 */
.fx-fire{filter:drop-shadow(0 0 8px rgba(255,150,0,.95)) drop-shadow(0 0 20px rgba(255,70,0,.7));animation:fxFire 1.6s ease-in-out infinite alternate}
@keyframes fxFire{from{filter:drop-shadow(0 0 6px rgba(255,170,0,.9)) drop-shadow(0 0 14px rgba(255,80,0,.55))}to{filter:drop-shadow(0 0 12px rgba(255,200,40,1)) drop-shadow(0 0 28px rgba(255,60,0,.8))}}
.me-item .me-ie.fx-fire,.cm-sil.fx-fire{animation:none}
.me-card{position:relative}
.me-try{position:absolute;top:16px;left:16px;padding:.15rem .6rem;border-radius:999px;background:rgba(255,255,255,.85);font-size:.8rem;color:#333}
.cm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.2rem,1fr));gap:10px}
.cm-grid.small{grid-template-columns:repeat(auto-fill,minmax(5rem,1fr));gap:6px;margin:8px 0}
.cm{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:26px 4px 8px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.cm b{font-size:.88rem;font-weight:normal}
.cm small{font-size:.75rem;color:var(--sub)}
.cm i{position:absolute;top:5px;left:0;right:0;font-style:normal;font-size:.7rem;color:var(--accent)}
.cm.on{border-color:var(--accent);background:var(--soft)}
.cm.none{opacity:.8}
.cm-sil{font-size:3rem;line-height:1.2;filter:brightness(0);opacity:.2}
.cm-wrap{position:relative;display:block;width:66px;height:66px}
.cm-in{position:absolute;left:0;top:0;width:150px;height:150px;transform:scale(.44);transform-origin:top left}
.cm-in .me-char{left:0;bottom:auto;top:0;margin-left:0}
.cm-grid.small .cm-wrap{width:54px;height:54px}.cm-grid.small .cm-in{transform:scale(.36)}
.locker{border-radius:18px;background:#9C6B3F;padding:10px 10px 14px;box-shadow:0 6px 0 #6E4524}
.lk-top{color:#FFF6E6;padding:2px 6px 8px;font-family:var(--font-t),var(--font),sans-serif}
.lk-top small{opacity:.75;font-size:.8rem}
.lk-shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 8px 6px;background:#F3DDBA;border-bottom:9px solid #7A4E2A;border-radius:6px 6px 2px 2px;margin-bottom:10px}
.lk-cell{position:relative;min-height:5.2rem;border-radius:12px;background:#FFF8EC;border:2px solid #E2C597;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#4A3420}
.lk-cell.empty{background:repeating-linear-gradient(45deg,#EFD7B2,#EFD7B2 6px,#F3DDBA 6px,#F3DDBA 12px);border-style:dashed}
.lk-cell.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.lk-e{font-size:2.1rem;line-height:1.1}
.lk-cell small{font-size:.72rem}
.worn{position:absolute;top:-8px;right:-6px;font-style:normal;font-size:1rem;background:#fff;border-radius:50%;width:1.6rem;height:1.6rem;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.give{margin-top:12px}
.give p{margin:.2rem 0}
.me-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.me-head b{display:block;font-family:var(--font-t),var(--font),sans-serif;font-weight:var(--tw);font-size:1.3rem}
.me-head .sub{font-size:.85rem}
.me-bank{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.me-bank span{font-size:.78rem;color:var(--sub)}
.me-bank b{font-size:1.5rem;color:var(--accent)}
.me-bank small{font-size:.75rem;color:var(--sub)}
.me-card{padding:10px}
.me-stage{position:relative;height:260px;border-radius:calc(var(--rad) - 4px);overflow:hidden}
.me-stage.mini{height:120px}
.me-deco{position:absolute;font-size:2rem;opacity:.85}
.me-floor{position:absolute;left:50%;bottom:26px;width:200px;height:34px;margin-left:-100px;border-radius:50%;background:rgba(0,0,0,.12)}
.me-char{position:absolute;left:50%;bottom:36px;width:150px;height:150px;margin-left:-75px}
.me-base{position:absolute;inset:0;font-size:120px;line-height:150px;text-align:center}
.me-hat{position:absolute;left:50%;top:-34px;margin-left:-32px;font-size:64px;line-height:1}
.me-acc{position:absolute;right:-38px;bottom:4px;font-size:52px;line-height:1}
.me-acc.face{right:auto;left:50%;bottom:auto;top:40px;margin-left:-30px;font-size:60px}
.me-pet{position:absolute;left:calc(50% - 170px);bottom:30px;font-size:56px;line-height:1}
.me-buy{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;border-color:var(--accent)}
.me-buy>div{flex:1;min-width:10rem}
.me-buy .big-btn{width:auto;margin:0;padding:.6rem 1.2rem;font-size:1.05rem}
.me-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.4rem,1fr));gap:10px}
.me-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px 10px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.me-item .me-ie,.me-buy .me-ie{font-size:2.3rem;line-height:1.1}
.me-item b{font-size:.9rem;font-family:var(--font-t),var(--font),sans-serif;font-weight:var(--tw)}
.me-item small{font-size:.78rem;color:var(--sub)}
.me-item small .no{opacity:.55}
.me-item.own small{color:var(--ok)}
.me-item.on{border-color:var(--accent);background:var(--soft)}
.me-item.pick{border-color:var(--hi);box-shadow:0 0 0 3px color-mix(in srgb,var(--hi) 45%,transparent)}

<script>
/* ───── 저장 (이 기기에 저장해요. 온라인 저장은 나중에 연결) ───── */
const store = {
  get(k, d){ try{ const v=localStorage.getItem('k7_'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('k7_'+k, JSON.stringify(v)); }catch(e){} }
};
const who = '지아';
let stars = store.get('stars', 0);
const App = { view:'home', hlv:store.get('hlv',0), mlv:store.get('mlv',0), elv:store.get('elv',0), story:null, decoCat:'base', decoPick:null };
const view = document.getElementById('view');
const $ = id => document.getElementById(id);
const rnd = (a,b) => a+Math.floor(Math.random()*(b-a+1));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const pad = n => String(n).padStart(2,'0');
const dayKey = (t=new Date()) => `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
const josa = (w,a,b) => { const c=w.charCodeAt(w.length-1); return w + (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28 ? a : b); };
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function burst(){ for(let i=0;i<14;i++){ const s=document.createElement('div'); s.className='burst'; s.textContent=['⭐','✨','🌟','💖'][i%4];
  s.style.left=(innerWidth/2)+'px'; s.style.top=(innerHeight/2)+'px'; s.style.setProperty('--dx',(Math.random()*360-180)+'px'); s.style.setProperty('--dy',(Math.random()*-320-40)+'px');
  document.body.appendChild(s); setTimeout(()=>s.remove(),1000); } }
function updateStars(){ $('starCount').textContent=stars; }
/* ───── 가족 이벤트 (도윤 · 도진 · 지아 · 윤아 공통): 관리자가 켜면 10분 동안 별 2배 ─────
   이벤트 별(🌈)은 하루 제한과 상관없이 쌓이고 캐릭터 방에서 쓸 수 있어요. 온라인 문서 family/event = {until, mult, rooms, at} */
const EVENT_ROOMS = ['doyun','dojin','jia','yuna'], MY_ROOM = 'jia';
let EV = null, evSub = null;
const evOn = () => !!(EV && EV.until > Date.now() && (EV.rooms||[]).includes(MY_ROOM));
const eStars = () => store.get('estars',0);
function evListen(){
  if(evSub) return;
  evSub = cloudInit().then(db=>{ if(!db) return;
    db.collection('family').doc('event').onSnapshot(s=>{ const was=evOn(); EV=s.exists?s.data():null; drawEvent();
      if(!was && evOn()){ try{ toast(`🌈 별 ${EV.mult||2}배 이벤트가 시작됐어요!`); }catch(e){} } }, e=>console.warn('이벤트를 읽을 수 없어요', e)); });
}
function drawEvent(){
  let bar=document.getElementById('evbar');
  if(!bar){ bar=document.createElement('div'); bar.id='evbar'; bar.className='evbar'; document.body.appendChild(bar); }
  const on=evOn(); bar.hidden=!on; try{ document.body.classList.toggle('ev', on); }catch(e){} if(!on) return;
  const left=Math.max(0, EV.until-Date.now()), m=Math.floor(left/60000), s=String(Math.floor(left/1000)%60).padStart(2,'0');
  bar.innerHTML=`🌈 별 ${EV.mult||2}배 이벤트! <b>${m}:${s}</b> 남았어요 <span>· 이벤트 별 🌈 ${eStars()}</span>`;
}
async function evStart(min){
  if(!await cloudInit()){ toast('온라인 연결이 있어야 이벤트를 켤 수 있어요'); return; }
  try{ await cloud.db.collection('family').doc('event').set({until:Date.now()+min*60000, mult:2, rooms:EVENT_ROOMS, at:Date.now()}); }
  catch(e){ console.warn(e); toast('이벤트를 켜지 못했어요 (온라인 규칙을 확인해 주세요)'); }
}
async function evStop(){ if(!await cloudInit()) return; try{ await cloud.db.collection('family').doc('event').set({until:0, at:Date.now()},{merge:true}); }catch(e){ console.warn(e); } }
function addStar(n=1){
  if(n>0 && evOn()){ store.set('estars',eStars()+n*(EV.mult||2)); store.set('estarsAt',Date.now()); updateStars(); drawEvent(); cloudPush(); return; }
  stars+=n; store.set('stars',stars); store.set('starsAt',Date.now()); updateStars(); cloudPush(); }
/* 날짜별 기록: log[날짜][영역] = {n, ok} (다른 방 · 관리자 대시보드와 같은 모양) */
function logToday(area, ok=true){ const L=store.get('log',{}), k=dayKey(); L[k]=L[k]||{}; const e=L[k][area]=(typeof L[k][area]==='object'?L[k][area]:{n:0,ok:0}); e.n++; if(ok) e.ok++;
  const ks=Object.keys(L).sort(); while(ks.length>90) delete L[ks.shift()]; store.set('log',L); cloudPush(); }
const todayN = area => { const e=((store.get('log',{})[dayKey()])||{})[area]; return e?(e.n||0):0; };

/* ───── 온라인 저장 (Firebase: k7/jia · k7/jia/daily/날짜) ───── */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBHMmNT-TxBAJqarHqLAYtM3VhaUhynzEw",
  authDomain: "moon-15f88.firebaseapp.com",
  projectId: "moon-15f88",
  storageBucket: "moon-15f88.firebasestorage.app",
  messagingSenderId: "124372121061",
  appId: "1:124372121061:web:b1596628daae0bb08eab0c",
  measurementId: "G-NV17H8CTJE"
};
const GRADE_ID = 'k7', KID_ID = 'jia';
const cloud = { ready:null, db:null };
function cloudInit(){
  if(cloud.ready) return cloud.ready;
  const load=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  cloud.ready = load(base+'firebase-app-compat.js').then(()=>load(base+'firebase-firestore-compat.js')).then(()=>load(base+'firebase-auth-compat.js')).then(()=>{
    firebase.initializeApp(FIREBASE_CONFIG); cloud.db=firebase.firestore(); return cloud.db;
  }).catch(e=>{ console.warn('온라인 저장을 쓸 수 없어요', e); return null; });
  return cloud.ready;
}
const kidRef = () => cloud.db ? cloud.db.collection(GRADE_ID).doc(KID_ID) : null;
async function cloudPull(){
  if(!await cloudInit()) return false;
  try{
    const snap=await kidRef().get();
    if(snap.exists){
      const d=snap.data();
      if(d.resetAt && d.resetAt > store.get('resetAt',0)){ ['stars','starsAt','log','deco','mathDone','storyOk'].forEach(k=>{ try{ localStorage.removeItem('k7_'+k); }catch(e){} }); store.set('resetAt',d.resetAt); }
      if(typeof d.estars==='number' && (d.estarsAt||0) > store.get('estarsAt',0)){ store.set('estars',d.estars); store.set('estarsAt',d.estarsAt); }
      if(typeof d.stars==='number' && (d.starsAt||0) > store.get('starsAt',0)){ store.set('stars',d.stars); store.set('starsAt',d.starsAt); }
      if(d.deco && (d.deco.at||0) > (store.get('deco',{}).at||0)) store.set('deco',d.deco);
      if(d.mathDone){ const m=store.get('mathDone',{}); for(const k in d.mathDone) m[k]=Math.max(m[k]||0,d.mathDone[k]); store.set('mathDone',m); }
      if(d.storyOk){ store.set('storyOk',Object.assign({},store.get('storyOk',{}),d.storyOk)); }
    }
    const L=store.get('log',{}), qs=await kidRef().collection('daily').get();
    qs.forEach(doc=>{ const k=doc.id, d=doc.data(); ['kor','math','eng','story'].forEach(a=>{ if(!d[a]) return; const day=L[k]||(L[k]={}), e=typeof day[a]==='object'?day[a]:(day[a]={n:0,ok:0}); e.n=Math.max(e.n,d[a].n||0); e.ok=Math.max(e.ok,d[a].ok||0); }); });
    store.set('log',L);
    stars=store.get('stars',0); updateStars();
    return true;
  }catch(e){ console.warn('불러오기 실패', e); return false; }
}
let pushTimer=null;
function cloudPush(){ clearTimeout(pushTimer); pushTimer=setTimeout(cloudPushNow,1500); }
async function cloudPushNow(){
  if(!await cloudInit()) return;
  try{
    const ref=kidRef(), k=dayKey(), day=(store.get('log',{})[k])||{};
    await ref.set({name:who, estars:eStars(), estarsAt:store.get('estarsAt',0), stars:store.get('stars',0), starsAt:store.get('starsAt',0), deco:store.get('deco',{}), mathDone:store.get('mathDone',{}), storyOk:store.get('storyOk',{}), updatedAt:Date.now()},{merge:true});
    const total=['kor','math','eng','story'].reduce((a,x)=>a+((day[x]&&day[x].n)||0),0);
    await ref.collection('daily').doc(k).set(Object.assign({visited:true, total}, day),{merge:true});
  }catch(e){ console.warn('저장 실패', e); }
}

/* ───── 소리: 유튜브 음악을 멈추지 않게 (다른 방과 같은 설정) ───── */
try{ if(navigator.audioSession) navigator.audioSession.type='ambient'; }catch(e){}
let actx, actxRest;
function beep(ok){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)(); clearTimeout(actxRest); if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime; o.type='triangle'; o.connect(g); g.connect(actx.destination);
    if(ok){ o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+0.1); } else { o.frequency.setValueAtTime(240,t); o.frequency.setValueAtTime(180,t+0.12); }
    g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35); o.start(t); o.stop(t+0.36);
    actxRest=setTimeout(()=>{ try{ actx.suspend(); }catch(e){} },700);
  }catch(e){}
}
let koVoice=null, enVoice=null;
function loadVoices(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices();
  koVoice=vs.find(v=>v.lang&&v.lang.replace('_','-').startsWith('ko'))||null; enVoice=vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang&&v.lang.startsWith('en'))||null; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text, lang='ko', onend){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  if(lang==='en'){ u.lang='en-US'; u.rate=0.8; if(enVoice) u.voice=enVoice; } else { u.lang='ko-KR'; u.rate=0.85; if(koVoice) u.voice=koVoice; }
  if(onend) u.onend=onend;
  speechSynthesis.speak(u);
}
const PRAISE = ['잘했어요!','최고예요!','와, 맞았어요!','멋져요!','정답이에요!','훌륭해요!'];

/* ───── 끌어다 놓기 엔진 ─────
   .tile[data-val] 을 끌어서 .slot[data-ans] 에 놓아요. 살짝 누르기만 하면 가장 앞의 빈칸으로 들어가요.
   놓은 뒤 onDrop(slot, tile, ok) 를 불러요. */
let DND=null, onDrop=null;
document.addEventListener('pointerdown', e=>{
  const t=e.target.closest('.tile'); if(!t || t.classList.contains('used')) return;
  e.preventDefault();
  const r=t.getBoundingClientRect();
  DND={t, x0:e.clientX, y0:e.clientY, moved:false, g:null, hover:null, w:r.width, h:r.height};
});
document.addEventListener('pointermove', e=>{
  if(!DND) return;
  if(!DND.moved && Math.hypot(e.clientX-DND.x0, e.clientY-DND.y0)<8) return;
  if(!DND.moved){ DND.moved=true; const g=DND.t.cloneNode(true); g.classList.add('ghost'); g.style.width=DND.w+'px'; g.style.height=DND.h+'px'; document.body.appendChild(g); DND.g=g; DND.t.classList.add('lift'); }
  DND.g.style.left=e.clientX+'px'; DND.g.style.top=e.clientY+'px';
  const s=slotAt(e.clientX,e.clientY); if(DND.hover!==s){ DND.hover&&DND.hover.classList.remove('hover'); s&&s.classList.add('hover'); DND.hover=s; }
});
document.addEventListener('pointerup', e=>{
  if(!DND) return; const D=DND; DND=null;
  if(D.g) D.g.remove(); D.t.classList.remove('lift'); D.hover&&D.hover.classList.remove('hover');
  const s = D.moved ? slotAt(e.clientX,e.clientY) : [...document.querySelectorAll('.slot:not(.filled)')][0];
  if(s) dropInto(s, D.t);
});
document.addEventListener('pointercancel', ()=>{ if(DND){ DND.g&&DND.g.remove(); DND.t.classList.remove('lift'); DND=null; } });
function slotAt(x,y){ const el=document.elementFromPoint(x,y); const s=el&&el.closest('.slot'); return s&&!s.classList.contains('filled')?s:null; }
function dropInto(s, t){
  const ok = String(s.dataset.ans)===String(t.dataset.val);
  if(ok){ s.innerHTML=t.innerHTML; s.classList.add('filled'); t.classList.add('used'); beep(true); }
  else { beep(false); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); }
  if(onDrop) onDrop(s, t, ok);
}
const tileHTML = (v, label, cls='') => `<button class="tile ${cls}" data-val="${v}">${label??v}</button>`;

/* ───── 문제 한 벌 (5문제) 공통 흐름 ───── */
let Q=null; // {area, lv, list, i, miss, done}
function startSet(area, lv, gen){ Q={area, lv, list:Array.from({length:5},(_,i)=>gen(i)), i:0, miss:false, done:false, ok:[]}; }
function afterDrop(s, t, ok){
  const P=Q.list[Q.i];
  if(!ok){ Q.miss=true; $('hint').textContent='다시 해 볼까?'; speak('다시 해 볼까?'); return; }
  if(document.querySelectorAll('#qbox .slot:not(.filled)').length) { if(P.partSay) speak(t.textContent); return; }   // 칸이 더 남았어요
  addStar(1); logToday(Q.area, !Q.miss); Q.ok[Q.i]=!Q.miss;
  const msg=praise(); $('hint').innerHTML=`<span class="praise">${msg}</span>`;
  speak(P.after ? `${msg} ${P.after}` : msg);
  burst();
  setTimeout(()=>{ Q.i++; Q.miss=false; if(Q.i>=Q.list.length) Q.done=true; render(); }, 1500);
}
function dotsHTML(){ return `<div class="dots">${Q.list.map((_,k)=>`<i class="${k<Q.i?'ok':k===Q.i?'cur':''}"></i>`).join('')}</div>`; }
function setDone(title){
  const n=Q.list.length;
  return `<div class="board"><div class="pic">🎉</div><div class="praise" style="font-size:2.6rem">다 했어요!</div>
    <p style="font-size:1.3rem">${title} ${n}문제 · 별 ${n}개를 받았어요</p>
    <button class="next" data-act="again">한 번 더 ▶</button> <button class="next" style="background:var(--room)" data-act="go" data-v="home">🏠 놀이 길로</button></div>`;
}

const isAdminUser = async u => { const em=((u&&u.email)||'').trim().toLowerCase(); return !!em && await sha256Hex(em)===ADMIN_EMAIL_SHA256; };
let admin = Object.assign({goal:20, msg:'', momH:''}, store.get('admin',{}));
let admRole='admin', admMode=null, pinBuf='';
async function cloudPullSettings(){
  if(!await cloudInit()) return false;
  try{ const snap=await cloud.db.collection(GRADE_ID).doc('settings').get(); if(!snap.exists) return false; const d=snap.data();
    if((d.at||0) <= (admin.at||0)) return false;
    ['goal','msg','momH'].forEach(k=>{ if(d[k]!==undefined && d[k]!==null) admin[k]=d[k]; }); admin.at=d.at; store.set('admin',admin); return true;
  }catch(e){ console.warn('설정 불러오기 실패', e); return false; }
}
async function saveAdmin(){ admin.at=Date.now(); store.set('admin',admin);
  if(await cloudInit()){ try{ await cloud.db.collection(GRADE_ID).doc('settings').set({goal:admin.goal, msg:admin.msg, momH:admin.momH||'', at:admin.at},{merge:true}); }catch(e){ console.warn('설정 저장 실패', e); } } }
function openAdmModal(role){
  admRole=role; pinBuf=''; admMode = role==='mom' ? 'pin' : 'email';
  $('modal').hidden=false; drawAdm();
  cloudPullSettings().then(ch=>{ if(ch) drawAdm(); });
  if(role==='admin') cloudInit().then(ok=>{ if(!ok || !firebase.auth) return; const u=firebase.auth().currentUser; if(u) isAdminUser(u).then(y=>{ if(y){ admMode='panel'; drawAdm(); } }); });
}
function closeAdm(){ $('modal').hidden=true; admMode=null; const o=$('admPop'); if(o) o.hidden=true; render(); }
function drawAdm(){
  const b=$('sheet'), mom=admRole==='mom';
  if(admMode==='pin'){
    if(!admin.momH){ b.innerHTML=`<h3>👩 엄마 모드</h3><p class="center">아직 엄마 비밀번호가 없어요.<br><span class="sub">관리자에게 엄마 비밀번호를 받아 주세요.</span></p><button class="next" data-act="admClose">닫기</button>`; return; }
    b.innerHTML=`<h3>👩 엄마 모드</h3><p class="sub center">엄마 비밀번호 4자리를 눌러 주세요.</p>
      <div class="pinrow" id="pinrow">${[0,1,2,3].map(i=>`<span class="${i<pinBuf.length?'f':''}"></span>`).join('')}</div>
      <div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="admPin" data-v="${n}">${n}</button>`).join('')}<button data-act="admPin" data-v="del">⌫</button><button data-act="admPin" data-v="0">0</button><button data-act="admClose">취소</button></div>`;
    return;
  }
  if(admMode==='email'){
    b.innerHTML=`<div class="adm-top"><h3>🔒 관리자 모드</h3><button class="pill on" data-act="admAll">📚 전체 관리자 (6명) ↗</button></div>
      <p class="sub">관리자 이메일과 비밀번호로 로그인하세요.</p>
      <label class="lbl" for="admEm">이메일</label><input id="admEm" class="inp" type="email" autocomplete="username" autocapitalize="off" spellcheck="false">
      <label class="lbl" for="admPw">비밀번호</label><input id="admPw" class="inp" type="password" autocomplete="current-password">
      <div class="adm-btns"><button class="next" data-act="admLogin">로그인</button><button class="next ghost" data-act="admClose">닫기</button></div>`;
    return;
  }
  // 기록 보기 · 설정
  const L=store.get('log',{}), rows=[];
  for(let i=0;i<7;i++){ const t=new Date(); t.setDate(t.getDate()-i); const d=L[dayKey(t)]||{}; let n=0, ok=0;
    const cells=STUDY.map(k=>{ const e=d[k]; if(!e||!e.n) return '<td class="z">-</td>'; n+=e.n; ok+=e.ok||0; return `<td>${e.ok||0}/${e.n}</td>`; }).join('');
    rows.push(`<tr class="${i?'':'today'}"><th>${t.getMonth()+1}/${t.getDate()}(${'일월화수목금토'[t.getDay()]})</th>${cells}<td><b>${n?`${ok}/${n}`:'-'}</b></td></tr>`); }
  const cloudTxt = cloud.db ? '☁️ 온라인 저장 켜짐 (지아 기록을 다른 기기에서도 볼 수 있어요)' : '☁️ 온라인 저장 연결 중…';
  b.innerHTML=`<div class="adm-top"><h3>${mom?'👩 엄마 모드':'🔒 관리자 모드'}</h3>${mom?'':'<button class="pill on" data-act="admAll">📚 전체 관리자 (6명) ↗</button>'}</div>
    ${mom?'':`<div class="evadm"><b>🎉 가족 이벤트 · 별 2배</b><p class="sub">도윤 · 도진 · 지아 · 윤아 방에서 동시에 별이 2배로 모여요. 이벤트 별(🌈)은 하루 제한과 상관없이 쌓이고, 캐릭터 방에서 쓸 수 있어요.</p>
      ${evOn()?`<p>🌈 진행 중이에요 · ${Math.ceil((EV.until-Date.now())/60000)}분쯤 남았어요</p><button class="pill" data-act="evStop">이벤트 끝내기</button>`:'<button class="pill on" data-act="evStart" data-v="10">🎉 10분 이벤트 시작</button>'}</div>`}
    <p class="sub">${cloudTxt}</p>
    <p class="lbl">📊 최근 7일 기록 <small>(맞은 문제 / 푼 문제)</small></p>
    <div class="scroll-x"><table class="atbl"><tr><th>날짜</th>${STUDY.map(k=>`<th>${AREAS[k].n}</th>`).join('')}<th>합계</th></tr>${rows.join('')}</table></div>
    <p class="lbl">🎯 하루 목표 <small>(첫 화면 막대의 기준)</small></p>
    <div class="seg">${[10,15,20,30,40].map(g=>`<button class="pill ${admin.goal===g?'on':''}" data-act="admGoal" data-v="${g}">${g}개</button>`).join('')}</div>
    <p class="lbl">💌 지아에게 한마디 <small>(첫 화면에 보여요)</small></p>
    <div class="inrow"><input id="admMsg" class="inp" type="text" name="kid-note" autocomplete="off" maxlength="60" placeholder="예: 오늘도 화이팅! 🍦" value="${(admin.msg||'').replace(/"/g,'&quot;')}"><button class="pill on" data-act="admMsg">저장</button></div>
    <p class="lbl">👩 엄마 비밀번호 ${mom?'바꾸기':`<small>(${admin.momH?'정해져 있어요':'아직 없어요'} · 정해서 엄마께 알려 주세요)</small>`}</p>
    <div class="inrow"><input id="momPin" class="inp pinbox" type="text" autocomplete="off" inputmode="numeric" maxlength="4" placeholder="엄마 비밀번호 4자리"><button class="pill on" data-act="admMomPin">${admin.momH?'바꾸기':'정하기'}</button></div>
    ${!mom&&admin.momH?'<button class="linkbtn" data-act="admMomDel">엄마 비밀번호 지우기 (엄마 모드 닫기)</button>':''}
    ${mom?'':`<p class="lbl">⭐ 지아 별 관리 (지금 ${stars}개)</p>
    <div class="seg">${[-5,-1,1,5,10].map(n=>`<button class="pill" data-act="admStar" data-v="${n}">${n>0?'+':''}${n}</button>`).join('')}</div>
    <p class="lbl">🗑️ 기록 초기화 <small>(별 · 꾸민 방 · 공부 기록을 모두 지워요. 설정은 남아요)</small></p>
    <button class="reset-btn" data-act="admReset">🗑️ 지아의 기록 모두 지우기</button>
    <p class="lbl">🔓 관리자 로그인</p><div class="seg"><button class="pill" data-act="admLogout">로그아웃</button></div>`}
    <div class="adm-btns"><button class="next" data-act="admClose">나가기</button></div>`;
}
async function admLogin(){
  const em=(($('admEm')||{}).value||'').trim().toLowerCase(), pw=($('admPw')||{}).value||'';
  if(!em||!pw){ toast('이메일과 비밀번호를 넣어 주세요'); return; }
  if(await sha256Hex(em)!==ADMIN_EMAIL_SHA256){ toast('관리자 이메일이 아니에요'); return; }
  if(!await cloudInit() || !firebase.auth){ toast('온라인 저장에 연결하지 못했어요'); return; }
  try{ const r=await firebase.auth().signInWithEmailAndPassword(em,pw);
    if(await isAdminUser(r.user)){ admMode='panel'; drawAdm(); cloudPull().then(()=>drawAdm()); } else { await firebase.auth().signOut(); toast('관리자 계정이 아니에요'); }
  }catch(e){ console.warn('로그인 실패',e);
    toast({'auth/invalid-credential':'이메일이나 비밀번호가 맞지 않아요','auth/wrong-password':'비밀번호가 맞지 않아요','auth/too-many-requests':'여러 번 틀려서 잠시 막혔어요','auth/network-request-failed':'인터넷 연결을 확인해 주세요'}[e.code]||'로그인하지 못했어요'); }
}
async function admResetAll(){
  if(!confirm('지아의 별, 꾸민 방, 공부 기록을 모두 지울까요?\n지운 기록은 되살릴 수 없어요.')) return;
  ['stars','starsAt','log','deco','mathDone','storyOk'].forEach(k=>{ try{ localStorage.removeItem('k7_'+k); }catch(e){} });
  const now=Date.now(); stars=0; store.set('stars',0); store.set('starsAt',now); store.set('resetAt',now); updateStars();
  if(await cloudInit()){ try{ const ref=kidRef(), qs=await ref.collection('daily').get(); await Promise.all(qs.docs.map(d=>d.ref.delete()));
    await ref.set({name:who, resetAt:now, stars:0, starsAt:now, deco:{at:now}, mathDone:{}, storyOk:{}, updatedAt:now},{merge:true}); }catch(e){ console.warn('지우기 실패', e); } }
  toast('🗑️ 기록을 모두 지웠어요'); drawAdm();
}
function openAllAdmin(){
  const o=$('admPop'); if(o){ o.hidden=false; return; }
  document.body.insertAdjacentHTML('beforeend', `<div class="admpop" id="admPop" role="dialog" aria-label="공부방 관리자"><div class="admpop-box"><div class="admpop-bar"><b>📚 공부방 관리자 (6명)</b>
    <button class="pill" data-act="admPopClose">◀ 지아 방 관리자로</button><button class="pill" data-act="admPopClose">✕ 닫기</button></div><iframe src="${DASHBOARD_URL}?v=jia" title="공부방 관리자 대시보드"></iframe></div></div>`);
}

/* ───── 눌렀을 때 ───── */
const ACT = {
  gate: v=>{ const f=GATE.find(x=>x[0]===v)||GATE[0]; store.set('gate',f[0]); $('login').hidden=true; render(); speak(`${josa(f[1],'이랑','랑')} 같이 들어가요! 지아야, 안녕!`); cloudPull().then(ok=>{ if(ok) render(); }); cloudPullSettings().then(ch=>{ if(ch) render(); }); },
  go: v=>go(v),
  openMom: ()=>openAdmModal('mom'),
  openAdmin: ()=>openAdmModal('admin'),
  admClose: ()=>closeAdm(),
  admPin: v=>{ if(v==='del'){ pinBuf=pinBuf.slice(0,-1); drawAdm(); return; } if(pinBuf.length>=4) return; pinBuf+=v; drawAdm();
    if(pinBuf.length<4) return;
    if(hashPin(pinBuf,'mom')===admin.momH){ admMode='panel'; pinBuf=''; drawAdm(); cloudPull().then(()=>drawAdm()); }
    else { beep(false); toast('비밀번호가 틀렸어요'); setTimeout(()=>{ pinBuf=''; drawAdm(); },400); } },
  admLogin: ()=>admLogin(),
  admLogout: ()=>{ try{ firebase.auth().signOut(); }catch(e){} toast('관리자에서 로그아웃했어요'); closeAdm(); },
  admAll: ()=>openAllAdmin(),
  admPopClose: ()=>{ const o=$('admPop'); if(o) o.hidden=true; },
  admGoal: v=>{ admin.goal=+v; saveAdmin(); drawAdm(); },
  admMsg: ()=>{ admin.msg=$('admMsg').value.trim(); saveAdmin(); toast('저장했어요'); },
  admMomPin: ()=>{ const p=$('momPin').value; if(!/^\d{4}$/.test(p)){ toast('숫자 4자리로 적어 주세요'); return; } admin.momH=hashPin(p,'mom'); saveAdmin(); toast(admRole==='mom'?'엄마 비밀번호를 바꿨어요':'엄마 비밀번호를 정했어요. 엄마께 알려 주세요'); drawAdm(); },
  admMomDel: ()=>{ if(admRole==='mom') return; if(!confirm('엄마 비밀번호를 지울까요?')) return; admin.momH=''; saveAdmin(); drawAdm(); },
  admStar: v=>{ if(admRole==='mom') return; stars=Math.max(0,stars+ +v); store.set('stars',stars); store.set('starsAt',Date.now()); updateStars(); cloudPush(); drawAdm(); },
  admReset: ()=>{ if(admRole==='mom') return; admResetAll(); },
  back: ()=>{ if(App.view==='story' && App.story){ App.story=null; RD=null; try{ speechSynthesis.cancel(); }catch(e){} render(); window.scrollTo(0,0); } else go('home'); },
  sayHome: ()=>speak('지아야, 오늘도 놀아 볼까? 한글, 연산, 영어, 동화를 차례로 건너 봐요.'),
  lv: (v,el)=>{ App[el.dataset.k]=+v; store.set(el.dataset.k,+v); Q=null; MS=null; render(); },
  sayQ: ()=>sayQ(),
  again: ()=>{ Q=null; render(); },
  mathNext: ()=>{ const n=MS.n, pg=MS.page; if(pg>=2){ App.mlv=Math.min(8,App.mlv+1); store.set('mlv',App.mlv); MS=null; } else MS={n, page:pg, rows:mathPage(n)}; render(); window.scrollTo(0,0); },
  openStory: v=>{ App.story=v; render(); window.scrollTo(0,0); },
  readAll: ()=>readFrom(0),
  readStop: ()=>{ RD=null; try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.sec').forEach(e=>e.classList.remove('reading')); },
  sayStoryQ: ()=>{ const st=STORIES.find(s=>s.id===App.story); if(st) speak(st.q.text); },
  decoCat: v=>{ App.decoCat=v; App.decoPick=null; renderMyRoom(); },
  decoTap: v=>decoTap(v),
  decoBuy: v=>decoBuy(v),
  roomv: v=>{ App.roomv=v; App.decoPick=null; App.lockPick=null; renderMyRoom(); },
  decoBase: v=>{ const d=decoGet(); d.base=v; decoSave(d); App.roomv='room'; renderMyRoom(); toast(`${decoItem(v).e} ${decoItem(v).n}${josa(decoItem(v).n,'이','가').slice(decoItem(v).n.length)} 방에 나왔어요`); },
  decoGoShop: v=>{ App.roomv='room'; App.decoCat='base'; App.decoPick=v; renderMyRoom(); },
  lockPick: v=>{ App.lockPick = App.lockPick===v ? null : v; renderMyRoom(); },
  decoGive: v=>decoGive(v),
};
document.addEventListener('click', e=>{ if(e.target.id==='modal'){ closeAdm(); return; } const el=e.target.closest('[data-act]'); if(!el || el.classList.contains('tile')) return; const f=ACT[el.dataset.act]; if(f) f(el.dataset.v, el); });
drawGate(); updateStars(); render();
evListen(); setInterval(()=>{ try{ drawEvent(); }catch(e){} }, 1000);
</script>
</body>
</html>
