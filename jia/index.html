<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지아의 공부방</title>
<style>
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-weight:500;font-display:swap}
:root{--bg:#FFF8F2;--ink:#1B1F2E;--sub:#6D7385;--accent:#FF6A3D}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:'GMarketSans',system-ui,sans-serif;text-align:center}
.box{max-width:420px}
.ico{font-size:5rem;line-height:1}
h1{font-size:1.8rem;margin:16px 0 8px;font-weight:700}
p{color:var(--sub);font-weight:500;line-height:1.6;margin:0}
</style>
</head>
<body>
<div class="box">
  <div class="ico">🌱</div>
  <h1>지아의 공부방</h1>
  <p>지금 열심히 만들고 있어요.<br>조금만 기다려 주세요!</p>
</div>
</body>
</html>
