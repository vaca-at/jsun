
<!DOCTYPE html>
<html lang="ko" data-theme="note" data-font="yuntaeng">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 가족 일기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ▼ 평소 쓰시는 눈누 @font-face 코드를 여기에 붙여 넣으세요.
     font-family 이름: 'OwnglyphYuntaeng', 'NexonBazzi', 'NexonMaplestory'
     (안 붙여도 비슷한 구글 폰트로 대신 보여요)
   ============================================================ */
@font-face {
    font-family: 'OwnglyphYuntaeng';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/온글잎 윤탱체.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}


/* ---------- 디자인 3종 ---------- */
:root, [data-theme="note"]{
  --desk:#E6EEF4; --paper:#FDFDF8; --card:#FFFFFF;
  --ink:#24345C; --ink-soft:#5E6A8A; --line:#C9DCEB;
  --red:#E0555E; --yellow:#F6C945; --ok:#3F8F60; --edge:#D3DEE8; --mom:#E6A3B8;
}
[data-theme="crayon"]{
  --desk:#FBE3EC; --paper:#FFF9FB; --card:#FFFFFF;
  --ink:#5A2E45; --ink-soft:#8C6078; --line:#F5CEDC;
  --red:#E4507F; --yellow:#9FD8C4; --ok:#2F8E72; --edge:#F1C4D5;
}
[data-theme="night"]{
  --desk:#131A30; --paper:#1D2746; --card:#243056;
  --ink:#EEF1FA; --ink-soft:#A8B2D0; --line:#33426C;
  --red:#FF8B8B; --yellow:#FFD66B; --ok:#82D6A3; --edge:#0D1326;
}
/* ---------- 폰트 3종 ---------- */
[data-font="yuntaeng"]{ --font:'OwnglyphYuntaeng','Gaegu',sans-serif; --fs:1.22rem; }
[data-font="bazzi"]{ --font:'NexonBazzi','Jua',sans-serif; --fs:1.05rem; }
[data-font="maple"]{ --font:'NexonMaplestory','Gowun Dodum',sans-serif; --fs:1rem; }

*{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  background:var(--desk); color:var(--ink);
  font-family:var(--font); font-size:var(--fs); line-height:1.6;
  min-height:100vh; padding:18px 14px 60px;
}
button,input,textarea,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--yellow); outline-offset:2px; }
.hidden{ display:none !important; }
.wrap{ max-width:1100px; margin:0 auto; }

/* ---------- 머리 ---------- */
header{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:14px; }
h1{ margin:0; font-size:2.1em; line-height:1.1; letter-spacing:-.01em; }
.today{ color:var(--ink-soft); font-size:.9em; }
.switch{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
.switch button{
  border:1.5px solid var(--edge); background:var(--paper); border-radius:999px;
  padding:2px 10px; font-size:.78em;
}
.switch button.on{ border-color:var(--ink); background:var(--ink); color:var(--paper); }

/* ---------- 이름표 ---------- */
.who-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.logout{ margin-left:auto; background:none; border:none; color:var(--ink-soft); text-decoration:underline; font-size:.85em; }

/* ---------- 공책 + 인덱스 탭 ---------- */
.tabs{ display:flex; gap:4px; padding-left:24px; }
.tabs button{
  border:none; border-radius:10px 10px 0 0; padding:8px 16px 6px;
  background:color-mix(in srgb, var(--tc) 55%, var(--paper)); color:var(--ink);
  transform:translateY(4px); transition:transform .15s;
}
.tabs button.on{ background:var(--tc); transform:translateY(0); font-weight:700; }
.notebook{
  background:var(--paper); border-radius:6px 14px 14px 14px;
  box-shadow:0 3px 0 var(--edge), 0 10px 30px rgba(20,30,60,.08);
  padding:22px 22px 26px; min-height:420px; position:relative;
}

/* ---------- 알림 띠 ---------- */
.banner{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  background:color-mix(in srgb, var(--yellow) 30%, var(--paper));
  border:2px dashed var(--yellow); border-radius:12px; padding:10px 14px; margin-bottom:12px;
}
.banner b{ font-size:1.05em; }
.banner .btns{ margin-left:auto; display:flex; gap:6px; }

/* ---------- 공통 버튼 ---------- */
.btn{ border:2px solid var(--ink); background:var(--paper); border-radius:10px; padding:6px 14px; }
.btn.main{ background:var(--ink); color:var(--paper); }
.btn.red{ border-color:var(--red); color:var(--red); }
.btn:disabled{ opacity:.5; cursor:wait; }
.soft{ color:var(--ink-soft); font-size:.88em; }

/* ---------- 월 머리 ---------- */
.daynav{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:12px; }
.daynav h2{ margin:0; font-size:1.35em; min-width:200px; text-align:center; }
.daynav button{ border:none; background:none; font-size:1.4em; }
.mgoal{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 14px; }
.mgoal span{ font-weight:700; }
.mgoal input{ flex:1; min-width:200px; border:none; border-bottom:2px dashed var(--line); background:transparent; padding:4px 2px; }

/* ---------- 오늘 아이들 ---------- */
.todaykids{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
.tk{ background:var(--card); border-radius:12px; border-left:7px solid var(--c); padding:8px 14px; box-shadow:0 2px 0 var(--edge); }
.tk-head{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:2px; }
.tk-head .state{ font-size:.85em; }
.tk-row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:.9em; padding:2px 0; }
.tk-lb{ color:var(--ink-soft); min-width:5.5em; }
.chips{ display:flex; gap:4px; flex-wrap:wrap; }
.chips i{ font-style:normal; font-size:.8em; border-radius:999px; padding:0 8px; background:color-mix(in srgb, var(--c) 30%, var(--paper)); }

/* ---------- 월별 다이어리 ---------- */
.mgrid{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:20px; align-items:start; }
.mstats{ display:flex; gap:14px; flex-wrap:wrap; font-size:.88em; margin-bottom:8px; }
.mstats i{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--c); margin-right:4px; }
.bigcal{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
.bigcal .h{ text-align:center; font-size:.8em; color:var(--ink-soft); }
.bigcal .h.sun{ color:var(--red); }
.bigcal button{
  min-height:122px; border:1px solid var(--line); background:var(--card); border-radius:10px;
  padding:6px 8px; display:flex; flex-direction:column; align-items:stretch; text-align:left; gap:3px; overflow:hidden;
}
.bigcal .num{ font-size:.95em; font-weight:700; }
.bigcal .sun .num{ color:var(--red); }
.bigcal .sat .num{ color:#3B6FD8; }
.bigcal .plans{ flex:1; display:flex; flex-direction:column; gap:2px; overflow:hidden; min-width:0; }
.bigcal .plans i{ font-style:normal; font-size:.7em; line-height:1.35; background:color-mix(in srgb, var(--yellow) 38%, var(--card)); border-radius:4px; padding:1px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bigcal .plans i.more{ background:none; color:var(--ink-soft); padding:0 2px; }
.bigcal .dots i{ box-sizing:border-box; border:1.5px solid var(--c); background:transparent; }
.bigcal .dots i.on{ background:var(--c); }
.bigcal button.future{ background:color-mix(in srgb, var(--card) 70%, var(--desk)); }
.bigcal button.future .dots{ visibility:hidden; }
.below{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:20px; align-items:start; margin-top:16px; }
.plan-box{ background:var(--card); border-radius:14px; padding:14px 16px; box-shadow:0 2px 0 var(--edge); }
.plan-box h3{ margin:0 0 8px; font-size:1.1em; }
.plan-list{ list-style:none; margin:0 0 8px; padding:0; }
.plan-list li{ display:flex; align-items:center; gap:4px; padding:4px 8px; margin-bottom:4px; border-radius:8px; background:color-mix(in srgb, var(--yellow) 30%, var(--card)); }
.plan-list li span{ flex:1; }
.plan-in{ display:flex; gap:6px; }
.plan-in input{ flex:1; min-width:0; border:none; border-bottom:2px solid var(--line); background:transparent; padding:4px 2px; }
.bigcal .top{ display:flex; justify-content:space-between; align-items:center; font-size:.8em; }
.bigcal .wm{ font-size:.9em; letter-spacing:-2px; }
.bigcal .tt{ font-size:.7em; line-height:1.25; flex:1; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.bigcal .dots{ display:flex; gap:3px; height:8px; }
.bigcal .dots i{ width:8px; height:8px; border-radius:50%; background:var(--c); }
.bigcal button.has{ background:color-mix(in srgb, var(--mom) 18%, var(--card)); }
.bigcal button.today{ border:2px solid var(--ink); }
.bigcal button.sel{ outline:3px solid var(--red); outline-offset:-1px; }
.bigcal button:disabled{ opacity:.35; cursor:default; }
.editor{ background:var(--card); border-radius:14px; padding:14px 16px 16px; box-shadow:0 2px 0 var(--edge); }
.editor h3{ margin:0; font-size:1.2em; }
.kidpeek{ margin-top:14px; border-top:1px dashed var(--line); padding-top:10px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:.9em; }
.kidpeek b{ color:var(--c); }

/* ---------- 쓰기 ---------- */
.row{ display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin-bottom:10px; }
.pick{ display:flex; gap:1px; align-items:center; flex-wrap:wrap; }
.pick span{ margin-right:6px; }
.pick button{ border:2px solid transparent; background:none; border-radius:10px; font-size:1.25em; line-height:1; padding:3px 4px; }
.pick button.on{ border-color:var(--red); background:color-mix(in srgb, var(--red) 10%, transparent); }
.title-in{ width:100%; border:none; border-bottom:2px solid var(--line); background:transparent; padding:4px 2px; font-size:1.1em; margin-bottom:10px; }
.qcard{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  border-left:5px solid var(--yellow); background:color-mix(in srgb, var(--yellow) 14%, var(--paper));
  padding:8px 12px; border-radius:0 10px 10px 0; margin-bottom:10px;
}
.qcard .q{ flex:1; min-width:180px; }
.qcard label{ font-size:.85em; display:flex; gap:4px; align-items:center; }
.qcard button{ background:none; border:none; font-size:.85em; color:var(--ink-soft); text-decoration:underline; }
.lined{
  width:100%; min-height:288px; resize:vertical; border:none; border-radius:4px;
  padding:4px 14px 4px 56px; line-height:36px;
  background-color:var(--paper);
  background-image:
    linear-gradient(to right, transparent 44px, var(--red) 44px, var(--red) 46px, transparent 46px),
    repeating-linear-gradient(to bottom, transparent 0 35px, var(--line) 35px 36px);
  background-attachment:local;
  outline:1px solid var(--line);
}
.gauge-row{ display:flex; align-items:center; gap:10px; margin:10px 0 14px; }
.gauge{ flex:1; height:12px; border-radius:999px; background:var(--line); overflow:hidden; }
.gauge i{ display:block; height:100%; width:0; background:var(--yellow); border-radius:999px; transition:width .25s; }
.gauge.full i{ background:var(--ok); }
.actions{ display:flex; flex-wrap:wrap; gap:8px; }
.actions .btn.main{ margin-left:auto; }

/* 빨간펜 첨삭 */
.redpen{ margin-top:16px; border:2px solid var(--red); border-radius:14px; padding:14px 16px; background:var(--card); }
.redpen h3{ margin:0 0 8px; color:var(--red); font-size:1.1em; }
.redpen .preview{ white-space:pre-wrap; line-height:2; margin-bottom:10px; }
mark{
  background:none; color:inherit; padding:0 4px;
  border:2px solid var(--red); border-radius:48% 52% 45% 55% / 55% 45% 55% 45%;
}
.redpen ol{ margin:0; padding-left:1.4em; }
.redpen li{ margin-bottom:8px; }
.redpen .wrong{ color:var(--red); font-weight:700; }
.redpen .ans{ color:var(--ok); font-weight:700; }
.redpen .fix{ border:1px dashed var(--ink-soft); background:none; border-radius:8px; font-size:.8em; padding:0 8px; margin-left:4px; }
.redpen li.done{ opacity:.55; text-decoration:line-through; }

/* ---------- 아이들 현황 ---------- */
.kgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.kcard{ border:2px solid var(--line); border-top:8px solid var(--c); border-radius:14px; padding:12px 16px 14px; background:var(--card); }
.kcard .line1{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.kcard .line1 b{ font-size:1.15em; }
.state{ font-weight:700; }
.state.warn{ color:var(--red); }
.state.done{ color:var(--ok); }
.kstats{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:10px 0; }
.kstats div{ background:var(--paper); border-radius:10px; padding:6px 10px; }
.kstats b{ display:block; font-size:1.35em; line-height:1.2; }
.kstats small{ color:var(--ink-soft); }
.mini{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; margin:8px 0; }
.mini .h{ font-size:.7em; text-align:center; color:var(--ink-soft); }
.mini button{ aspect-ratio:1; border:1px solid var(--line); background:var(--paper); border-radius:6px; font-size:.72em; padding:0; position:relative; }
.mini button.w{ background:var(--c); border-color:var(--c); color:#1B2340; font-weight:700; }
.mini button.s{ border:2px dashed var(--c); }
.mini button.w.s{ border-style:solid; }
.mini button.today{ outline:2px solid var(--ink); }
.mini button:disabled{ opacity:.35; cursor:default; }
.mini .st{ position:absolute; right:-4px; top:-7px; font-size:.95em; }
.waiting{ display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 8px; }
.waiting button{ border:1.5px solid var(--red); color:var(--red); background:none; border-radius:999px; font-size:.8em; padding:0 10px; }
.kcard textarea{ width:100%; border:1px solid var(--line); border-radius:8px; background:var(--paper); padding:6px 8px; margin-top:8px; resize:vertical; }

/* ---------- 하루 펼쳐보기 ---------- */
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.dcard{
  background:var(--card); border-radius:12px; border-top:8px solid var(--c);
  box-shadow:0 2px 0 var(--edge); padding:12px 14px 14px; position:relative; min-height:220px;
  display:flex; flex-direction:column;
}
.dcard .top{ display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.dcard .top b{ color:var(--c); }
.dcard .wm{ margin-left:auto; font-size:1.2em; }
.dcard h4{ margin:0 0 4px; font-size:1.08em; }
.dcard .qtag{ font-size:.8em; color:var(--ink-soft); margin-bottom:4px; }
.dcard .body{ white-space:pre-wrap; flex:1; }
.dcard .empty{ color:var(--ink-soft); flex:1; display:grid; place-items:center; text-align:center; }
.stamp{
  position:absolute; right:10px; top:40px; transform:rotate(-12deg);
  color:var(--red); border:3px double var(--red); border-radius:50%;
  width:74px; height:74px; display:grid; place-items:center; text-align:center;
  font-size:.78em; line-height:1.1; font-weight:700; background:color-mix(in srgb, var(--paper) 70%, transparent);
}
.stamps{ display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
.stamps button{ border:1.5px solid var(--red); color:var(--red); background:none; border-radius:999px; font-size:.75em; padding:0 8px; }
.stamps button.on{ background:var(--red); color:var(--paper); }
.hearts{ display:flex; gap:6px; align-items:center; margin-top:8px; font-size:.9em; }
.hearts button{ border:none; background:none; font-size:1.1em; padding:0; }
.cmts{ margin-top:8px; border-top:1px dashed var(--line); padding-top:6px; font-size:.9em; }
.cmts p{ margin:2px 0; }
.cmts b{ color:var(--cc); }
.cmt-in{ display:flex; gap:4px; margin-top:4px; }
.cmt-in input{ flex:1; min-width:0; border:none; border-bottom:1.5px solid var(--line); background:transparent; padding:2px; }
.cmt-in button{ border:none; background:none; color:var(--ink-soft); }
.cmt-in b{ align-self:center; color:var(--cc); }
.fx{ background:rgba(110,210,140,.45); border-radius:4px; padding:0 2px; }
.fixes{ margin:4px 0 0; padding-left:1.2em; font-size:.8em; }
.fixes s{ color:var(--red); }
.cmt-tool{ border:none; background:none; font-size:.8em; padding:0 2px; opacity:.55; }
.cmt-tool:hover{ opacity:1; }
.emo{ display:flex; flex-wrap:wrap; gap:2px; margin-top:6px; padding:6px; border:1.5px dashed var(--line); border-radius:10px; background:var(--paper); }
.emo button{ border:none; background:none; font-size:1.3em; padding:2px 4px; border-radius:8px; }
.emo button:hover{ background:color-mix(in srgb, var(--yellow) 30%, transparent); }
.rain{ position:fixed; top:-3rem; z-index:70; pointer-events:none; animation:rainfall 3s linear forwards; }
@keyframes rainfall{ to{ transform:translateY(110vh) rotate(360deg); } }

/* ---------- 책장 ---------- */
.filters{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:12px; }
.filters button{ border:2px solid var(--edge); background:var(--paper); border-radius:999px; padding:2px 12px; font-size:.9em; }
.filters button.on{ border-color:var(--ink); }
.shelf-list article{ border-bottom:1px dashed var(--line); padding:12px 0; }
.shelf-list .meta{ display:flex; gap:8px; align-items:center; font-size:.88em; color:var(--ink-soft); }
.shelf-list .meta b{ color:var(--c); }
.shelf-list h4{ margin:4px 0; }
.shelf-list .body{ white-space:pre-wrap; }

/* ---------- 모달·토스트 ---------- */
.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:8px 18px; border-radius:999px; z-index:60; max-width:90vw; text-align:center; }
.welcome{ text-align:center; padding:50px 10px; }
.welcome p{ font-size:1.2em; }

@media (max-width:900px){
  .mgrid, .kgrid, .todaykids, .below{ grid-template-columns:1fr; }
  .grid3{ grid-template-columns:1fr; }
}
@media (max-width:600px){
  .notebook{ padding:16px 12px 20px; }
  .tabs{ padding-left:6px; overflow-x:auto; }
  .tabs button{ padding:8px 10px 6px; white-space:nowrap; }
  h1{ font-size:1.7em; }
  .bigcal{ gap:3px; }
  .bigcal button{ min-height:70px; padding:3px 4px; }
  .bigcal .plans i{ font-size:.58em; padding:0 3px; }
  .bigcal .dots{ gap:2px; }
  .bigcal .dots i{ width:7px; height:7px; }
  .lined{ padding-left:40px; background-image:linear-gradient(to right, transparent 30px, var(--red) 30px, var(--red) 32px, transparent 32px), repeating-linear-gradient(to bottom, transparent 0 35px, var(--line) 35px 36px); }
}
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
@media print{
  body{ background:#fff; padding:0; }
  header .switch, .who-row, .tabs, .banner, .filters, .noprint, .daynav button{ display:none !important; }
  .notebook{ box-shadow:none; padding:0; }
  .shelf-list article{ break-inside:avoid; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>우리 가족 일기장</h1>
      <div class="today" id="todayLabel"></div>
    </div>
    <div>
      <div class="switch" id="themeSw" style="margin-bottom:4px">
        <button data-act="theme" data-v="note">📒 공책</button>
        <button data-act="theme" data-v="crayon">🖍 크레파스</button>
        <button data-act="theme" data-v="night">🌙 밤하늘</button>
      </div>
      <div class="switch" id="fontSw">
        <button data-act="font" data-v="yuntaeng">윤탱체</button>
        <button data-act="font" data-v="bazzi">배찌체</button>
        <button data-act="font" data-v="maple">메이플체</button>
      </div>
    </div>
  </header>

  <div class="who-row" id="authBar"></div>
  <div id="banner"></div>
  <nav class="tabs" id="tabs"></nav>
  <main class="notebook" id="main"></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, query, where,
  arrayUnion, serverTimestamp, deleteField
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   ① 설정 — 여기만 고치면 돼요
   ============================================================ */

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const thisMonth = () => today().slice(0, 7);
// 일정을 미리 적을 수 있게 12달 뒤까지 넘겨 볼 수 있어요
const maxMonth = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + 12); return ymd(d).slice(0, 7); };
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const WEEK = ["일","월","화","수","목","금","토"];
const fmtDate = s => { const d = parseYmd(s); return `${d.getMonth()+1}월 ${d.getDate()}일 ${WEEK[d.getDay()]}요일`; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const toMs = v => !v ? 0 : typeof v === "number" ? v : v.toMillis ? v.toMillis() : Date.parse(v) || 0;
const hhmm = ms => { const d = new Date(ms); return `${d.getHours()}시 ${pad(d.getMinutes())}분`; };
const countChars = s => s.replace(/\s/g, "").length;
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const hasBatchim = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c % 28 !== 0; };
const monthInfo = ym => { const [y, m] = ym.split("-").map(Number); return { y, m, first: new Date(y, m - 1, 1).getDay(), last: new Date(y, m, 0).getDate() }; };
const store = {

let toastTimer;
function toast(msg){
  let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; document.body.append(t); }
  t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 2600);
}

      if (g && document.activeElement !== g) g.value = S.months[S.month]?.goal || "";

    }, () => {});
  }
  // 아이가 저장 전에 쓰고 있는 글 (자동 저장) → "✍️ 쓰는 중"
  if (!S.unsubDrafts){
    S.unsubDrafts = onSnapshot(collection(db, "diaryDraft"), snap => {
      S.drafts = {};
      snap.forEach(d => { S.drafts[d.id] = d.data(); });
      refresh();
    }, () => {});
  }
  // 공부방 날짜별 공부 기록: e2/dojin/daily/{날짜}, e4/doyun/daily/{날짜}
  if (!S.unsubStudy.length){
    S.unsubStudy = KIDS.map(w => onSnapshot(collection(db, ...PEOPLE[w].room, "daily"), snap => {
      S.study[w] = {};
      snap.forEach(d => { S.study[w][d.id] = d.data(); });
      refresh();
    }, () => {}));
  }
}
function stopData(){
  S.unsub && S.unsub(); S.unsubStatus && S.unsubStatus(); S.unsubMonths && S.unsubMonths();
  S.unsubStudy.forEach(u => u()); S.unsubStudy = []; S.study = {};
  S.unsubDrafts && S.unsubDrafts(); S.unsubDrafts = null; S.drafts = {};
  S.unsub = S.unsubStatus = S.unsubMonths = null; S.range = null; S.entries = {}; S.loaded = false;
}
function ensureRange(){
  const t = today();
  const f0 = [addDays(t, -70), S.month + "-01", S.dayDate, S.writeDate].sort();
  const t0 = [t, S.month + "-31", S.dayDate].sort();
  let from = f0[0], to = t0[t0.length - 1];
  if (S.range && S.range.from <= from && S.range.to >= to) return;
  if (S.range){ from = [from, S.range.from].sort()[0]; to = [to, S.range.to].sort()[1]; }
  S.unsub && S.unsub();
  S.range = { from, to };
  const q = query(collection(db, "diary"), where("date", ">=", from), where("date", "<=", to));
  S.unsub = onSnapshot(q, snap => {
    S.entries = {};
    snap.forEach(d => { S.entries[d.id] = { id: d.id, ...d.data() }; });
    S.loaded = true;
    refresh();
  }, err => toast("일기를 불러오지 못했어요. Firestore 규칙을 확인해 주세요. (" + err.code + ")"));
}
function refresh(){
  if (!S.ok) return;
  renderBanner();
  if (S.tab === "month"){ renderToday(); renderCal(); if (!S.formDirty) renderEditor(); }
  else renderTab();
}

// 공부 기록 한 날: { total, 과목:{n,ok} ... } → 과목별 [이름, 문제 수, 맞힌 수]
function studyOn(w, date){
  const d = S.study[w]?.[date]; if (!d) return null;
  const subj = Object.entries(d)
    .filter(([k, v]) => v && typeof v === "object" && typeof v.n === "number" && v.n > 0)
    .map(([k, v]) => [SUBJ_NAMES[k] || k, v.n, v.ok || 0]);
  const total = d.total || subj.reduce((a, s) => a + s[1], 0);
  return total > 0 ? { total, ok: subj.reduce((a, s) => a + s[2], 0), subj, stars: d.starsGot || 0, min: Math.round((d.sec || 0) / 60) } : null;
}
const studyMin = s => s.min ? ` · ${s.min >= 60 ? Math.floor(s.min / 60) + "시간 " : ""}${s.min % 60}분` : "";
function studiedToday(w){
  if (studyOn(w, today())) return true;
  const ms = toMs(S.status[w]?.lastStudyAt); return ms && ymd(new Date(ms)) === today();
}
function minsToDue(){ const n = new Date(); return DUE_HOUR * 60 - (n.getHours() * 60 + n.getMinutes()); }
// 그날 일기 상태: ✅ 다 써서 저장 · ✍️ 쓰는 중(저장 전) · ⬜ 아직 안 씀(오늘) · ❌ 안 씀(지난날)
function drafting(w, date){
  const d = S.drafts[w];
  return !wroteOn(date, w) && d && d.date === date && countChars(d.content || "") > 0 ? countChars(d.content) : 0;
}
function diaryMark(w, date){
  if (wroteOn(date, w)) return ["✅", "다 씀"];
  const n = drafting(w, date);
  if (n) return ["✍️", `쓰는 중 ${n}자`];
  return date === today() ? ["⬜", "아직 안 씀"] : ["❌", "안 씀"];
}
const MARK_LEGEND = `<span class="soft" style="font-size:.8em">✅ 다 써서 저장함 · ✍️ 지금 쓰는 중(저장 전) · ⬜ 아직 안 씀 · ❌ 그날 안 씀</span>`;
function kidState(w){
  const s = studyOn(w, today()), left = minsToDue(), n = drafting(w, today());
  if (wroteOn(today(), w)) return ["✅ 오늘 일기 다 써서 저장함", "done"];
  if (n) return [`✍️ 지금 일기 쓰는 중 (${n}자, 아직 저장 전)`, left <= 0 ? "warn" : ""];
  if (left <= 0) return [s ? `🚨 공부 ${s.total}문제 했는데 8시가 지나도록 일기 없음` : "🚨 8시가 지났는데 일기가 없어요", "warn"];
  if (s) return [`📝 공부 ${s.total}문제 · 일기는 아직 (8시 마감)`, "warn"];
  return ["아직 오늘 공부·일기 전", ""];
}
function streak(w){
  let d = today(); if (!wroteOn(d, w)) d = addDays(d, -1);
  let n = 0; while (wroteOn(d, w)){ n++; d = addDays(d, -1); }
  return n;
}

let rec = null;
function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("이 브라우저에서는 말로 쓰기를 쓸 수 없어요. 크롬에서 열어 주세요.");
  if (rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = "ko-KR"; rec.interimResults = false; rec.continuous = true;
  rec.onresult = ev => {
    let t = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) t += ev.results[i][0].transcript;
    if (!t) return;
    const ta = $("#content"); const v = ta.value;
    ta.value = v + (v && !/\s$/.test(v) ? " " : "") + t.trim();
    S.formDirty = true; updateGauge();
  };
  rec.onend = () => { rec = null; const b = $("#voiceBtn"); if (b) b.textContent = "🎤 말로 쓰기"; };
  rec.onerror = e => toast("말로 쓰기가 멈췄어요 (" + e.error + ")");
  rec.start(); $("#voiceBtn").textContent = "⏹ 그만 말하기";
}

async function runSpell(){
  const text = $("#content").value.trim();
  if (!text) return toast("먼저 일기를 써 주세요.");
  const btn = $("#spellBtn"); btn.disabled = true; btn.textContent = "🖍 검사하는 중…";
  try {
    const r = await fetch(SPELL_API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, level: "adult", name: PEOPLE[ME].name })
    });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    S.spell = { errors: Array.isArray(data.errors) ? data.errors : [], cheer: data.cheer || "" };
    renderSpell();
  } catch {
    $("#redpen").innerHTML = `<div class="redpen"><h3>맞춤법 검사 서버에 연결하지 못했어요</h3>
      <p class="soft">워커 주소와 API 키 설정을 확인해 주세요. 일기 저장은 그대로 할 수 있어요.</p></div>`;
  } finally { btn.disabled = false; btn.textContent = "🖍 맞춤법 검사"; }
}
function renderSpell(){
  if (!S.spell || !$("#redpen")) return;
  const { errors, cheer } = S.spell, text = $("#content").value;
  if (!errors.length){
    $("#redpen").innerHTML = `<div class="redpen"><h3>💯 틀린 곳이 없어요!</h3><p>${esc(cheer)}</p></div>`;
    return;
  }
  const marks = [];
  errors.forEach((er, i) => {
    const idx = text.indexOf(er.wrong);
    if (idx >= 0 && !marks.some(f => idx < f.end && idx + er.wrong.length > f.idx)) marks.push({ idx, end: idx + er.wrong.length, i });
  });
  marks.sort((a, b) => a.idx - b.idx);
  let html = "", pos = 0;
  marks.forEach(f => { html += esc(text.slice(pos, f.idx)) + `<mark>${esc(text.slice(f.idx, f.end))}<sup>${f.i + 1}</sup></mark>`; pos = f.end; });
  html += esc(text.slice(pos));
  const left = errors.filter(er => text.includes(er.wrong)).length;
  $("#redpen").innerHTML = `<div class="redpen">
    <h3>${left ? `🖍 ${left}군데를 찾았어요` : "🎉 다 고쳤어요"}</h3>
    ${left ? `<div class="preview">${html}</div>` : ""}
    <ol>${errors.map((er, i) => `<li class="${text.includes(er.wrong) ? "" : "done"}">
      <span class="wrong">${esc(er.wrong)}</span> → <span class="ans">${esc(er.right)}</span>
      ${text.includes(er.wrong) ? `<button class="fix" data-act="fix" data-v="${i}">고치기</button>` : ""}
      <br><span class="soft">${esc(er.hint || er.why || "")}</span></li>`).join("")}</ol>
  </div>`;
}

function kidStats(w){
  const { last } = monthInfo(S.month), tm = thisMonth();
  const elapsed = S.month < tm ? last : S.month === tm ? new Date().getDate() : 0;
  const list = Object.values(S.entries).filter(e => e.author === w && e.date.startsWith(S.month));
  const chars = list.map(e => e.chars ?? countChars(e.content || ""));
  const studyDays = Object.keys(S.study[w] || {}).filter(d => d.startsWith(S.month) && studyOn(w, d));
  const probs = studyDays.reduce((a, d) => a + studyOn(w, d).total, 0);
  const oks = studyDays.reduce((a, d) => a + studyOn(w, d).ok, 0);
  return {
    days: list.length, elapsed,
    avg: chars.length ? Math.round(chars.reduce((a, b) => a + b, 0) / chars.length) : 0,
    checked: list.filter(e => e.spellChecked).length,
    self: list.reduce((a, e) => a + (e.spellSelf || 0), 0),
    fixed: list.reduce((a, e) => a + (e.spellFixes ? e.spellFixes.length : Math.max(0, (e.spellFound || 0) - (e.spellLeft || 0))), 0),
    ai: list.reduce((a, e) => a + (e.spellFixes || []).filter(f => f.how === "ai").length, 0),
    waiting: list.filter(e => !e.stamp).sort((a, b) => b.date.localeCompare(a.date)),
    studyDays: studyDays.length, probs, rate: probs ? Math.round(oks / probs * 100) : 0,
    // 공부는 했는데 일기는 안 쓴 날 (오늘은 8시 전이면 빼요)
    missed: studyDays.filter(d => !wroteOn(d, w) && (d < today() || minsToDue() <= 0)).sort().reverse()
  };
}

    document.body.append(s); setTimeout(() => s.remove(), 4200);

function markFixes(text, fixes){
  const spans = [];
  (fixes || []).forEach(f => {
    if (!f.right) return;
    let i = text.indexOf(f.right);
    while (i >= 0 && spans.some(s => i < s.e && i + f.right.length > s.i)) i = text.indexOf(f.right, i + 1);
    if (i >= 0) spans.push({ i, e: i + f.right.length });
  });
  spans.sort((a, b) => a.i - b.i);
  let html = "", pos = 0;
  spans.forEach(s => { html += esc(text.slice(pos, s.i)) + `<span class="fx">${esc(text.slice(s.i, s.e))}</span>`; pos = s.e; });
  return html + esc(text.slice(pos));
}

  return `<div class="dcard" style="--c:${p.color}">${head}
    ${e.stamp ? `<div class="stamp">${esc(e.stamp)}</div>` : ""}
    ${e.question ? `<div class="qtag">💡 ${esc(e.question)}</div>` : ""}
    ${e.title ? `<h4>${esc(e.title)}</h4>` : ""}
    <div class="body">${markFixes(e.content, fx)}</div>
    ${spellNote}
    ${p.kid ? `<div class="stamps">${STAMPS.map(s =>
      `<button class="${e.stamp === s ? "on" : ""}" data-act="stamp" data-id="${e.id}" data-v="${s}">${s}</button>`).join("")}</div>` : ""}
    <div class="hearts">
      <button data-act="heart" data-id="${e.id}" aria-label="하트">${hearts[ME] ? "❤️" : "🤍"}</button>
      <span class="soft">${heartBy.map(k => PEOPLE[k]?.name || k).join(", ")}</span>
    </div>
    <div class="cmts">
      ${(e.comments || []).map(c => {
        const who = `<b style="--cc:${PEOPLE[c.by]?.color || "inherit"}">${esc(PEOPLE[c.by]?.name || c.by)}</b>`;
        if (cmt.edit && cmt.edit.id === e.id && cmt.edit.at === c.at) return `<div class="cmt-in">${who}
          <input maxlength="120" data-cedit="${e.id}" value="${esc(cmt.edit.text)}">
          <button data-act="emoji-open" data-id="${e.id}" aria-label="이모지 넣기">💖</button>
          <button data-act="cedit-save" data-id="${e.id}">저장</button><button data-act="cedit-cancel">취소</button></div>`;
        return `<p>${who} ${esc(c.text)}${c.edited ? ` <span class="soft" style="font-size:.75em">(고침)</span>` : ""}
          ${c.by === ME ? `<button class="cmt-tool" data-act="cedit" data-id="${e.id}" data-v="${c.at}" aria-label="고치기">✏️</button><button class="cmt-tool" data-act="cdel" data-id="${e.id}" data-v="${c.at}" aria-label="지우기">🗑</button>` : ""}</p>`;
      }).join("")}
      ${cmt.edit?.id === e.id ? "" : `<div class="cmt-in"><input placeholder="한마디 남기기" maxlength="120" data-cmt="${e.id}" value="${esc(cmt.draft[e.id] || "")}">
        <button data-act="emoji-open" data-id="${e.id}" aria-label="이모지 넣기" title="이모지 넣기">💖</button>
        <button data-act="comment" data-id="${e.id}">남기기</button></div>`}
      ${cmt.emoji === e.id ? `<div class="emo">${EMOJIS.map(x => `<button data-act="emoji" data-id="${e.id}" data-v="${x}">${x}</button>`).join("")}</div>` : ""}
    </div>
  </div>`;
}

/* ============================================================
   ⑩ 책장
   ============================================================ */
function renderShelf(){
  const who = S.filter === "all" ? ORDER : [S.filter];
  const list = Object.values(S.entries)
    .filter(e => e.date.startsWith(S.month) && who.includes(e.author))
    .sort((a, b) => b.date.localeCompare(a.date) || ORDER.indexOf(a.author) - ORDER.indexOf(b.author));
  const goal = S.months[S.month]?.goal;
  $("#main").innerHTML = `
    ${monthNav("일기")}
    ${goal ? `<p style="text-align:center; margin-top:-6px">🎯 ${esc(goal)}</p>` : ""}
    <div class="filters">
      <button class="${S.filter === "all" ? "on" : ""}" data-act="filter" data-v="all">모두</button>
      ${ORDER.map(w => `<button class="${S.filter === w ? "on" : ""}" data-act="filter" data-v="${w}">${PEOPLE[w].emoji} ${PEOPLE[w].name}</button>`).join("")}
    </div>
    <div style="text-align:right" class="noprint"><button class="btn" data-act="print">🖨 이 달 일기 인쇄하기</button></div>
    <div class="shelf-list">${list.length ? list.map(e => {
      const p = PEOPLE[e.author] || { name: e.author, emoji: "", color: "#999" };
      return `<article style="--c:${p.color}">
        <div class="meta"><b>${p.emoji} ${p.name}</b><span>${fmtDate(e.date)}</span><span>${e.weather || ""}${e.mood || ""}</span>${e.stamp ? `<span style="color:var(--red)">🔴 ${esc(e.stamp)}</span>` : ""}</div>
        ${e.title ? `<h4>${esc(e.title)}</h4>` : ""}
        <div class="body">${esc(e.content)}</div></article>`;
    }).join("") : `<p class="soft" style="text-align:center">이 달에는 아직 일기가 없어요.</p>`}</div>`;
}

/* ============================================================
   ⑪ 클릭 처리
   ============================================================ */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const v = a.dataset.v, id = a.dataset.id;
  switch (a.dataset.act){
    case "theme": setTheme(v); break;
    case "font": setFont(v); break;
    case "login": login(); break;
    case "logout": if (leaveForm("저장하지 않은 일기가 있어요. 로그아웃할까요?")) signOut(auth); break;
    case "tab": goTab(v); break;
    case "pick-date":
      if (v === S.writeDate || !leaveForm("저장하지 않은 일기가 있어요. 다른 날로 옮길까요?")) break;
      S.writeDate = v; S.qShift = 0; planDraft = ""; renderCal(); renderPlans(); renderEditor();
      if (innerWidth <= 900) $("#planBox").scrollIntoView({ behavior: "smooth", block: "start" });
      break;
    case "plan-add": {
      const inp = $("#planIn"), t = inp.value.trim(); if (!t) { inp.focus(); break; }
      savePlans(S.writeDate, l => [...l, { t, at: Date.now() }]).then(ok => { if (ok){ planDraft = ""; inp.value = ""; toast("📌 일정을 적었어요"); } });
      break;
    }
    case "plan-edit": {
      const p = plansOf(S.writeDate).find(p => String(p.at) === v); if (!p) break;
      const t = prompt("일정 고치기", p.t); if (t === null || !t.trim()) break;
      savePlans(S.writeDate, l => l.map(x => x.at === p.at ? { ...x, t: t.trim().slice(0, 40) } : x));
      break;
    }
    case "plan-del":
      if (confirm("이 일정을 지울까요?")) savePlans(S.writeDate, l => l.filter(x => String(x.at) !== v));
      break;
    case "weather": case "mood":
      S[a.dataset.act] = S[a.dataset.act] === v ? "" : v; S.formDirty = true;
      a.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === S[a.dataset.act]));
      break;
    case "q-next": S.qShift++; $("#qText").textContent = currentQuestion(); break;
    case "voice": toggleVoice(); break;
    case "spell": runSpell(); break;
    case "fix": {
      const er = S.spell.errors[+v], ta = $("#content");
      ta.value = ta.value.replace(er.wrong, er.right); S.formDirty = true; updateGauge(); renderSpell();
      break;
    }
    case "save": save(); break;
    case "day-move": S.dayDate = addDays(S.dayDate, +v); if (S.dayDate > today()) S.dayDate = today(); renderTab(); break;
    case "open-day":
      if (S.tab === "month" && !leaveForm()) break;
      S.dayDate = v; goTab("day"); break;
    case "month-move": {
      if (S.tab === "month" && !leaveForm("저장하지 않은 일기가 있어요. 다른 달로 넘길까요?")) break;
      const { y, m } = monthInfo(S.month); const d = new Date(y, m - 1 + (+v), 1);
      S.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
      if (S.month > maxMonth()) S.month = maxMonth();
      if (!S.writeDate.startsWith(S.month)) S.writeDate = S.month === thisMonth() ? today() : S.month + "-01";
      renderTab(); break;
    }
    case "filter": S.filter = v; renderShelf(); break;
    case "print": window.print(); break;
    case "poke": poke(a.dataset.w); break;
    case "stamp": {
      const cur = S.entries[id]?.stamp;
      updateDoc(doc(db, "diary", id), { stamp: cur === v ? deleteField() : v }).catch(err => toast("도장을 찍지 못했어요 (" + err.code + ")"));
      break;
    }
    case "heart": {
      const cur = !!S.entries[id]?.hearts?.[ME];
      updateDoc(doc(db, "diary", id), { [`hearts.${ME}`]: !cur }).catch(err => toast("하트를 남기지 못했어요 (" + err.code + ")"));
      break;
    }
    case "comment": {
      const inp = document.querySelector(`[data-cmt="${id}"]`); const text = inp.value.trim(); if (!text) return;
      updateDoc(doc(db, "diary", id), { comments: arrayUnion({ by: ME, text, at: Date.now() }) })
        .then(() => { cmt.draft[id] = ""; cmt.emoji = null; inp.value = ""; rain(emojisIn(text)); renderTab(); })
        .catch(err => toast("한마디를 남기지 못했어요 (" + err.code + ")"));
      break;
    }
    case "cedit": {
      const c = (S.entries[id]?.comments || []).find(c => String(c.at) === v);
      if (!c) break;
      cmt.edit = { id, at: c.at, text: c.text }; cmt.emoji = null; renderTab();
      const inp = document.querySelector(`[data-cedit="${id}"]`); inp?.focus(); inp?.setSelectionRange(inp.value.length, inp.value.length);
      break;
    }
    case "cedit-cancel": cmt.edit = null; cmt.emoji = null; renderTab(); break;
    case "cedit-save": {
      const ed = cmt.edit, text = document.querySelector(`[data-cedit="${id}"]`)?.value.trim();
      if (!ed || !text) break;
      saveComments(id, list => list.map(c => c.at === ed.at && c.by === ME ? { ...c, text, edited: Date.now() } : c))
        .then(() => { cmt.edit = null; cmt.emoji = null; toast("한마디를 고쳤어요 ✏️ 아이 화면에도 바로 바뀌어요"); rain(emojisIn(text)); renderTab(); })
        .catch(err => toast("고치지 못했어요 (" + err.code + ")"));
      break;
    }
    case "cdel": {
      if (!confirm("이 한마디를 지울까요?")) break;
      saveComments(id, list => list.filter(c => !(String(c.at) === v && c.by === ME)))
        .then(() => toast("한마디를 지웠어요")).catch(err => toast("지우지 못했어요 (" + err.code + ")"));
      break;
    }
    case "emoji-open": cmt.emoji = cmt.emoji === id ? null : id; renderTab(); break;
    case "emoji": {
      const inp = document.querySelector(cmt.edit?.id === id ? `[data-cedit="${id}"]` : `[data-cmt="${id}"]`); if (!inp) break;
      const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
      inp.value = inp.value.slice(0, s) + v + inp.value.slice(en);
      inp.focus(); inp.setSelectionRange(s + v.length, s + v.length);
      inp.dispatchEvent(new Event("input", { bubbles: true }));
      break;
    }
  }
});
let spellTimer;
document.addEventListener("input", e => {
  if (e.target.id === "content"){
    S.formDirty = true; updateGauge();
    clearTimeout(spellTimer); spellTimer = setTimeout(renderSpell, 400);
  }
  else if (e.target.id === "title" || e.target.id === "useQ") S.formDirty = true;
  else if (e.target.dataset?.cmt) cmt.draft[e.target.dataset.cmt] = e.target.value;
  else if (e.target.dataset?.cedit && cmt.edit) cmt.edit.text = e.target.value;
});
// 이모지 판을 눌러도 입력 칸의 커서가 그대로 있게
document.addEventListener("mousedown", e => { if (e.target.closest('[data-act="emoji"]')) e.preventDefault(); });
document.addEventListener("change", e => {
  if (e.target.id === "mgoal" && e.target.value.trim() !== (S.months[S.month]?.goal || "")) saveGoal(e.target.value);
});
document.addEventListener("keydown", e => {
  if (e.target.dataset?.cmt && e.key === "Enter") document.querySelector(`[data-act="comment"][data-id="${e.target.dataset.cmt}"]`)?.click();
  if (e.target.dataset?.cedit && e.key === "Enter") document.querySelector(`[data-act="cedit-save"][data-id="${e.target.dataset.cedit}"]`)?.click();
  if (e.target.dataset?.cedit && e.key === "Escape") document.querySelector('[data-act="cedit-cancel"]')?.click();
  if (e.target.id === "mgoal" && e.key === "Enter") e.target.blur();
});
window.addEventListener("beforeunload", e => { if (S.formDirty){ e.preventDefault(); e.returnValue = ""; } });

/* ============================================================
   ⑫ 디자인·폰트 전환, 시작
   ============================================================ */
function setTheme(v){
  document.documentElement.dataset.theme = v; store.set("fd_theme", v);
  document.querySelectorAll("#themeSw button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
}
function setFont(v){
  document.documentElement.dataset.font = v; store.set("fd_font", v);
  document.querySelectorAll("#fontSw button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
}
setTheme(store.get("fd_theme") || "note");
setFont(store.get("fd_font") || "yuntaeng");
$("#todayLabel").textContent = fmtDate(today());
setInterval(() => S.ok && renderBanner(), 5 * 60 * 1000);
</script>
